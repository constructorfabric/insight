# Insight platform — local docker-compose dev stack.
#
# This is the default path for working on Insight on a developer laptop.
# For the Kubernetes path (Airbyte / Argo Workflows, real cluster shape)
# see CONTRIBUTING.md and deploy/gitops/.
#
# Quick start:
#   cp .env.compose.example .env.compose
#   ./dev-compose.sh up
#
# Everything is driven by .env.compose. Read .env.compose.example for the
# full settings contract.
#
# Layout:
#   * infra services  : mariadb, clickhouse, redis, redpanda
#   * backend         : api-gateway, analytics, identity-resolution
#   * frontend        : ONE of insight-front-{dev,built,ghcr}, selected by
#                       FRONTEND_MODE (profile-gated)
#   * builders        : build-rust, build-frontend
#                       (profile=build — invoked by dev-compose.sh build)
#
# Auto-reload: every backend container runs the shared docker-entrypoint.sh
# which honours ENABLE_AUTO_RELOAD=true to wrap the binary in `watchexec`.
# When unset, runs the bare command (matching prod). NEVER set this in k8s.

name: ${COMPOSE_PROJECT_NAME:-insight}

# ─── Networks ─────────────────────────────────────────────────────────
networks:
  insight:
    name: ${COMPOSE_PROJECT_NAME:-insight}

# ─── Volumes (data + build artefacts) ─────────────────────────────────
volumes:
  mariadb-data: {}
  clickhouse-data: {}
  clickhouse-logs: {}
  redis-data: {}
  redpanda-data: {}
  # Cargo build cache. Lives in Docker so Mac/Windows hosts don't get
  # Linux-target object files polluting their native ./src/backend/target.
  rust-target: {}
  rust-cargo-registry: {}
  rust-cargo-git: {}
  # Frontend dev mode: node_modules lives in a named volume so the host's
  # bind-mount of source doesn't clobber it and Mac perf stays sane.
  frontend-node-modules: {}

# ─── x-anchors (DRY shared blocks) ────────────────────────────────────
x-restart-policy: &restart-policy
  # NO k8s-style auto-restart. Compose recreates on `up` but won't restart
  # crashed processes on its own — keeping behaviour explicit per
  # requirement #8. ENABLE_AUTO_RELOAD is the ONLY restart switch and it
  # is gated by an explicit env var.
  restart: "no"

x-backend-env: &backend-env
  ENABLE_AUTO_RELOAD: ${ENABLE_AUTO_RELOAD:-}
  RUST_LOG: ${RUST_LOG:-info}

x-backend-common: &backend-common
  !!merge <<: *restart-policy
  init: true
  networks: [insight]

# ─── Services ─────────────────────────────────────────────────────────
services:

  # ── Infra ─────────────────────────────────────────────────────────────

  mariadb:
    !!merge <<: *restart-policy
    # Only started when MARIADB_EXTERNAL!=true (dev-compose.sh up adds the
    # `local-mariadb` profile in that case). For external MariaDB, point
    # MARIADB_HOST / MARIADB_INTERNAL_PORT at the real host and leave this
    # profile inactive.
    profiles: ["local-mariadb"]
    image: mariadb:11.4
    container_name: ${COMPOSE_PROJECT_NAME:-insight}-mariadb
    networks: [insight]
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root-local}
      MARIADB_DATABASE: identity
      MARIADB_USER: ${MARIADB_USER:-insight}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-insight-local}
    ports:
      - "${MARIADB_PORT:-3306}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./deploy/compose/mariadb-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  clickhouse:
    !!merge <<: *restart-policy
    # Only started when CLICKHOUSE_EXTERNAL!=true (dev-compose.sh up adds
    # the `local-clickhouse` profile in that case). For external
    # ClickHouse, point CLICKHOUSE_HOST / CLICKHOUSE_INTERNAL_HTTP_PORT at
    # the real host and leave this profile inactive.
    profiles: ["local-clickhouse"]
    image: clickhouse/clickhouse-server:25.7.5
    container_name: ${COMPOSE_PROJECT_NAME:-insight}-clickhouse
    networks: [insight]
    environment:
      CLICKHOUSE_DB: insight
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-insight}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-insight-local}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
      - ./deploy/compose/clickhouse-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      # presentation_ro role + grant-less `presentation` user, so analytics can
      # connect read-only on first `up` (#1964). Role file is the canonical one.
      - ./src/ingestion/scripts/bootstrap-db/presentation-role.sql:/docker-entrypoint-initdb.d/01-presentation-role.sql:ro
      - ./deploy/compose/presentation-user.sql:/docker-entrypoint-initdb.d/02-presentation-user.sql:ro
      # Profile override — see the file for the join_use_nulls rationale.
      - ./deploy/compose/clickhouse-user-defaults.xml:/etc/clickhouse-server/users.d/seed-defaults.xml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    !!merge <<: *restart-policy
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-insight}-redis
    networks: [insight]
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  redpanda:
    !!merge <<: *restart-policy
    image: redpandadata/redpanda:v24.2.7
    container_name: ${COMPOSE_PROJECT_NAME:-insight}-redpanda
    networks: [insight]
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:${REDPANDA_KAFKA_PORT:-19092}
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://localhost:${REDPANDA_PROXY_PORT:-18082}
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
      - --mode=dev-container
      - --smp=1
      - --default-log-level=warn
    ports:
      - "${REDPANDA_KAFKA_PORT:-19092}:19092"
      - "${REDPANDA_PROXY_PORT:-18082}:18082"
      - "${REDPANDA_SCHEMA_PORT:-18081}:18081"
      - "${REDPANDA_ADMIN_PORT:-19644}:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 30

  # ── Backend services ──────────────────────────────────────────────────
  #
  # All use the EXISTING service Dockerfiles (modified to bundle
  # docker-entrypoint.sh + watchexec). For ghcr mode, set
  # ANALYTICS_IMAGE / IDENTITY_RESOLUTION_IMAGE to a registry
  # ref in .env.compose — the dev-compose.sh up script generates an
  # override that drops `build:` and the bind-mount for affected services.

  # (The legacy Rust api-gateway is gone — the nginx `gateway` below is the sole
  # :8080 entry, doing full auth via the authenticator, NGINX_BFF #1583 step 09.)
  # Auth runs via Keycloak (real login form + generated realm): full cookie/BFF
  # auth, the authenticator does the OIDC flow.

  analytics:
    !!merge <<: *backend-common
    image: ${ANALYTICS_IMAGE:-insight-analytics:dev}
    container_name: ${COMPOSE_PROJECT_NAME:-insight}-analytics
    build:
      context: src/backend
      dockerfile: services/analytics/Dockerfile
    depends_on:
      # required: false → compose skips this dependency when the local
      # profile isn't active (external MariaDB / ClickHouse modes).
      mariadb: {condition: service_healthy, required: false}
      clickhouse: {condition: service_healthy, required: false}
      redis: {condition: service_healthy}
    environment:
      !!merge <<: *backend-env
      # analytics runs on the gears-rust host: structural config
      # (gears list, api-gateway REST host w/ auth ENABLED) lives in the
      # bind-mounted config/insight.yaml; these APP__gears__analytics__config__*
      # env vars (toolkit `Env::prefixed`, gear config key `analytics`)
      # override the deployment-specific leaf values.
      APP__gears__analytics__config__database_url: "mysql://${MARIADB_USER:-insight}:${MARIADB_PASSWORD:-insight-local}@${MARIADB_HOST:-mariadb}:${MARIADB_INTERNAL_PORT:-3306}/analytics"
      APP__gears__analytics__config__clickhouse_url: "http://${CLICKHOUSE_HOST:-clickhouse}:${CLICKHOUSE_INTERNAL_HTTP_PORT:-8123}"
      APP__gears__analytics__config__clickhouse_database: "${CLICKHOUSE_DATABASE:-insight}"
      # Read-only query-path identity (#1964): the grant-less `presentation` user
      # (provisioned at CH init below), not the admin.
      APP__gears__analytics__config__clickhouse_user: "presentation"
      APP__gears__analytics__config__clickhouse_password: "${CLICKHOUSE_PRESENTATION_PASSWORD:-presentation-local}"
      APP__gears__analytics__config__identity_url: "http://identity-resolution:8082"
      APP__gears__analytics__config__redis_url: "redis://redis:6379"
      # Explaining a metric with an LLM. Off unless .env.compose turns it on;
      # enabled without a sealing key stops the service at boot, so the two
      # move together.
      APP__gears__analytics__config__ai_assist__enabled: "${AI_ASSIST_ENABLED:-false}"
      APP__gears__analytics__config__ai_assist__token_encryption_key: "${AI_ASSIST_TOKEN_ENCRYPTION_KEY:-}"
      APP__gears__analytics__config__ai_assist__api_key: "${AI_ASSIST_API_KEY:-}"
      APP__gears__analytics__config__ai_assist__admin_only: "${AI_ASSIST_ADMIN_ONLY:-true}"
      APP__gears__analytics__config__ai_assist__model: "${AI_ASSIST_MODEL:-claude-sonnet-5}"
      # Gateway-JWT verification (NGINX_BFF R1) is done by the upstream
      # cf-gears-oidc-authn-plugin. Its config is nested/list-shaped (not
      # env-injectable) and resolves the JWKS via OIDC discovery over HTTPS ONLY,
      # so the concrete plugin config (issuer = the authn-tls front, + its CA at
      # /certs/ca.pem) is bind-mounted from deploy/compose/analytics-fullauth.yaml
      # over /app/config/insight.yaml below. The leaf values above still override.
    volumes:
      - type: bind
        source: ./deploy/compose/build/analytics/analytics
        target: /app/analytics
        read_only: true
        bind:
          create_host_path: false
      # Full-auth plugin config (issuer + CA) — bind-mounted over the committed
      # placeholder config so analytics verifies real gateway JWTs in dev.
      - ./deploy/compose/analytics-fullauth.yaml:/app/config/insight.yaml:ro
      # Self-signed CA for the authn-tls discovery front.
      - ./deploy/compose/authn-tls-certs:/certs:ro
    command:
      - "/app/analytics" # <watched path>
      - "--"
      - "/app/analytics"
      - "-c"
      - "/app/config/insight.yaml"
      - "run"
    ports:
      - "${ANALYTICS_PORT:-8081}:8081"

  # ── Identity Resolution (Rust identity service, epic #1602) ────────────
  #
  # Owns the MariaDB `identity` database (schema applied by the Rust
  # migrator). Internal port 8082; consumers call `identity-resolution:8082`.
  # One-shot schema migration (mirrors the k8s migrate initContainer):
  # compose must run `migrate` before the server. Exits 0 and stays exited;
  # the server below gates on it.
  identity-resolution-migrate:
    # backend-common supplies the insight network (without it the migrator
    # lands on the default network, can't resolve `mariadb`, and the server
    # blocks forever on service_completed_successfully) + restart:no + init.
    !!merge <<: *backend-common
    image: ${IDENTITY_RESOLUTION_IMAGE:-insight-identity-resolution:dev}
    container_name: ${COMPOSE_PROJECT_NAME:-insight}-identity-resolution-migrate
    build:
      context: src/backend
      dockerfile: services/identity-resolution/Dockerfile
    depends_on:
      mariadb: {condition: service_healthy, required: false}
    environment:
      # UNDERSCORE, not hyphen, in the gear name. The shared entrypoint
      # (src/backend/docker-entrypoint.sh) runs under /bin/sh = dash, and dash
      # DROPS environment variables whose names are not valid shell
      # identifiers. `APP__gears__identity-resolution__config__*` therefore
      # never survives `exec "$@"` and the binary sees the YAML's empty
      # default, failing with "database_url is required for migrate".
      # gears-rust normalises `_` to `-` in the key path, so the shell-safe
      # spelling reaches the same `gears.identity-resolution.config` node.
      # Services whose gear name has no hyphen (analytics) are unaffected.
      APP__gears__identity_resolution__config__database_url: "mysql://${MARIADB_USER:-insight}:${MARIADB_PASSWORD:-insight-local}@${MARIADB_HOST:-mariadb}:${MARIADB_INTERNAL_PORT:-3306}/identity"
    volumes:
      - type: bind
        source: ./deploy/compose/build/identity-resolution/identity-resolution
        target: /app/identity-resolution
        read_only: true
        bind:
          create_host_path: false
      - ./deploy/compose/identity-resolution-fullauth.yaml:/app/config/insight.yaml:ro
    command:
      - "/app/identity-resolution" # <watched path — unused, one-shot>
      - "--"
      - "/app/identity-resolution"
      - "-c"
      - "/app/config/insight.yaml"
      - "migrate"

  identity-resolution:
    !!merge <<: *backend-common
    image: ${IDENTITY_RESOLUTION_IMAGE:-insight-identity-resolution:dev}
    container_name: ${COMPOSE_PROJECT_NAME:-insight}-identity-resolution
    build:
      context: src/backend
      dockerfile: services/identity-resolution/Dockerfile
    depends_on:
      # required: false → compose skips this dependency when the local
      # profile isn't active (external MariaDB / ClickHouse modes).
      mariadb: {condition: service_healthy, required: false}
      clickhouse: {condition: service_healthy, required: false}
      identity-resolution-migrate: {condition: service_completed_successfully}
    environment:
      !!merge <<: *backend-env
      # gears-rust host: structural config (gears list, oidc-authn-plugin
      # full-auth wiring) lives in the bind-mounted
      # deploy/compose/identity-resolution-fullauth.yaml; these
      # APP__gears__identity_resolution__config__* env vars override the
      # deployment-specific leaf values. Gear name spelled with an UNDERSCORE
      # so the names stay valid shell identifiers — see the migrate service
      # above for why the hyphenated spelling silently loses its value.
      APP__gears__identity_resolution__config__database_url: "mysql://${MARIADB_USER:-insight}:${MARIADB_PASSWORD:-insight-local}@${MARIADB_HOST:-mariadb}:${MARIADB_INTERNAL_PORT:-3306}/identity"
      APP__gears__identity_resolution__config__clickhouse_url: "http://${CLICKHOUSE_HOST:-clickhouse}:${CLICKHOUSE_INTERNAL_HTTP_PORT:-8123}"
      APP__gears__identity_resolution__config__clickhouse_database: "${CLICKHOUSE_DATABASE:-insight}"
      APP__gears__identity_resolution__config__clickhouse_user: "${CLICKHOUSE_USER:-insight}"
      APP__gears__identity_resolution__config__clickhouse_password: "${CLICKHOUSE_PASSWORD:-insight-local}"
      # The tenant this journal is keyed by. The seed already passes it per
      # invocation; the SERVICE needs it too, because a write that has no
      # caller context to infer a tenant from (the login bootstrap) checks the
      # asserted one against this rather than trusting it.
      APP__gears__identity_resolution__config__tenant_default_id: "${TENANT_DEFAULT_ID:-00000000-df51-5b42-9538-d2b56b7ee953}"
    volumes:
      - type: bind
        source: ./deploy/compose/build/identity-resolution/identity-resolution
        target: /app/identity-resolution
        read_only: true
        bind:
          create_host_path: false
      # Full-auth plugin config (issuer + CA) — bind-mounted over the committed
      # placeholder config so the service verifies real gateway JWTs in dev.
      - ./deploy/compose/identity-resolution-fullauth.yaml:/app/config/insight.yaml:ro
      # Self-signed CA for the authn-tls discovery front.
      - ./deploy/compose/authn-tls-certs:/certs:ro
    command:
      - "/app/identity-resolution" # <watched path>
      - "--"
      - "/app/identity-resolution"
      - "-c"
      - "/app/config/insight.yaml"
    ports:
      - "${IDENTITY_RESOLUTION_PORT:-8086}:8082"

  # ── Authenticator (OIDC login + sessions + cookie-to-JWT exchange) ─────
  #
  # The BFF / token-handler service (nginx+auth step 04). Runs the OIDC
  # code+PKCE login against Keycloak, keeps opaque sessions in Redis, and mints
  # the linked ES256 gateway JWT served at /internal/authz. signing_keys_path
  # points at a bind-mounted dev key that dev-compose.sh generates on `up`
  # (deploy/compose/authenticator-dev-keys, gitignored — never baked into an
  # image); prod mounts a K8s Secret. Login requires the person to exist in
  # Identity (seed the DB with
  # ./dev-compose.sh seed identity — realm users resolve to seeded
  # persons); an unknown person is denied (403). First-admin bootstrap / RBAC are
  # out of scope (a separate universe-admin initiative).
  authenticator:
    !!merge <<: *backend-common
    image: ${AUTHENTICATOR_IMAGE:-insight-authenticator:dev}
    container_name: ${COMPOSE_PROJECT_NAME:-insight}-authenticator
    build:
      context: src/backend
      dockerfile: services/authenticator/Dockerfile
    depends_on:
      redis: {condition: service_healthy}
      identity-resolution: {condition: service_started}
    environment:
      !!merge <<: *backend-env
      APP__gears__authenticator__config__redis_url: "redis://redis:6379"
      APP__gears__authenticator__config__signing_keys_path: "/app/keys"
      APP__gears__authenticator__config__identity_url: "${AUTHENTICATOR_IDENTITY_URL:-http://identity-resolution:8082}"
      # Token `iss` = the TLS discovery front, so downstream verifiers resolve
      # the JWKS over https (the plugin's runtime is https-only). The browser
      # still reaches the gateway plainly at :8080.
      APP__gears__authenticator__config__gateway_issuer: "${AUTHENTICATOR_GATEWAY_ISSUER:-https://authn-tls:8443}"
      # OIDC: the issuer must equal Keycloak's advertised KC_HOSTNAME issuer
      # (dev-compose.sh exports both from the host IP); the browser-facing
      # redirect_uri is host-visible (the SPA / e2e runs there).
      APP__gears__authenticator__config__idp__issuer_url: "${AUTHENTICATOR_OIDC_ISSUER:-http://localhost:8085/kc/realms/insight}"
      APP__gears__authenticator__config__idp__client_id: "${OIDC_CLIENT_ID:-insight-authenticator}"
      APP__gears__authenticator__config__idp__client_secret: "${OIDC_CLIENT_SECRET:-}"
      # Required: the identity-resolution source_type the login-bootstrap
      # lookup is scoped to. The realm sets each user's `sub` to their own
      # roster uuid — the stable external id; the seeder's identity step seeds
      # the matching value_type='id' rows under this same source_type.
      APP__gears__authenticator__config__idp__source_type: "${AUTHENTICATOR_IDP_SOURCE_TYPE:-keycloak}"
      # Callback rides the SPA's browser origin (Vite :3000) so the __Host-sid
      # cookie lands where the SPA runs; see .env.compose.example.
      APP__gears__authenticator__config__redirect_uri: "${AUTHENTICATOR_REDIRECT_URI:-http://localhost:3000/auth/callback}"
      APP__gears__authenticator__config__service_tokens__audience: "${AUTHENTICATOR_TOKEN_AUDIENCE:-http://authenticator:8093/internal/token}"
      # Resolves the testclient public_key_paths against the mounted dev keys
      # (dev-compose.sh generates testclient.pub.pem there; nothing committed).
      APP__gears__authenticator__config__service_tokens__public_key_dir: "/app/keys"
      # Audit events to the platform topic (step 10.8). Delivery failures are
      # dropped + counted, so a stack without Redpanda still works.
      APP__gears__authenticator__config__audit__brokers: "${AUDIT_BROKERS:-redpanda:9092}"
    volumes:
      - type: bind
        source: ./deploy/compose/build/authenticator/authenticator
        target: /app/authenticator
        read_only: true
        bind:
          create_host_path: false
      - ./src/backend/services/authenticator/config:/app/config:ro
      # Full-auth plugin config (issuer + CA) — bind-mounted over the committed
      # placeholder config so the `.authenticated()` admin surface verifies real
      # gateway JWTs in dev (the authenticator trusts its own tokens).
      - ./deploy/compose/authenticator-fullauth.yaml:/app/config/insight.yaml:ro
      # Self-signed CA for the authn-tls discovery front.
      - ./deploy/compose/authn-tls-certs:/certs:ro
      # dev signing key (current.pem) + dev service-token pubkey, both generated
      # by dev-compose.sh into this gitignored dir and mounted at signing_keys_path.
      - ./deploy/compose/authenticator-dev-keys:/app/keys:ro
    command:
      - "/app/authenticator" # <watched path>
      - "--"
      - "/app/authenticator"
      - "-c"
      - "/app/config/insight.yaml"
      - "run"
    ports:
      - "${AUTHENTICATOR_PORT:-8083}:8083"
      - "${AUTHENTICATOR_TOKEN_PORT:-8093}:8093"

  # ── Keycloak (dev/e2e realm-import IdP) ────────────────────────────────
  #
  # Single container, embedded H2, imports the roster-generated realm at
  # deploy/compose/keycloak/realm-insight.generated.json (produced by
  # insight_seed.keycloak_realm, gitignored). Gated behind
  # --profile auth-keycloak.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: ${COMPOSE_PROJECT_NAME:-insight}-keycloak
    command: ["start-dev", "--import-realm", "--http-relative-path=/kc"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # KC_HOSTNAME is the advertised issuer. NGINX_BFF: the authenticator does
      # the OIDC flow SERVER-side, so the issuer must be reachable from BOTH the
      # browser and the authenticator container — dev-compose.sh sets it to the
      # host IP (KEYCLOAK_HOSTNAME) for keycloak mode. Falls back to localhost for
      # a browser-only bring-up. It MUST include /kc: KC26 hostname-v2 drops
      # --http-relative-path from the advertised issuer, so a path-less value
      # would yield iss=.../realms/insight while endpoints live under /kc.
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-http://localhost:8085/kc}
      # Let Keycloak also serve back-channel (token/JWKS) requests on the host
      # used to reach it, so an internal caller (keycloak:8085) still works
      # alongside the advertised issuer.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8085"
      JAVA_OPTS_APPEND: "-Xms256m -Xmx512m"
    # Host port is configurable like every other service's, so a second
    # instance (or another stack already on 8085) does not block the edge.
    # A changed port needs KEYCLOAK_HOSTNAME and AUTHENTICATOR_OIDC_ISSUER
    # moved with it — the issuer is baked into the tokens.
    ports: ["${KEYCLOAK_PORT:-8085}:8085"]
    volumes:
      - ./deploy/compose/keycloak/realm-insight.generated.json:/opt/keycloak/data/import/realm-insight.json:ro
    # `insight`, not `default` — every other service in this stack (see
    # x-backend-common / front-* blocks) attaches to the named `insight`
    # network; a bare `default` network would leave keycloak unreachable
    # by service name from authenticator/gateway.
    networks: [insight]
    profiles: ["auth-keycloak"]

  # ── Gateway (OpenResty edge) ───────────────────────────────────────────
  #
  # Compiles the mounted routes.yaml (same file the chart ships) into nginx.conf
  # at startup; deployment settings come from the environment below.
  #
  # TLS discovery front for the authenticator (see deploy/compose/authn-tls.conf).
  # The analytics oidc-authn-plugin resolves the JWKS via OIDC discovery over
  # https ONLY, so this terminates TLS (self-signed CA, trusted by analytics via
  # /certs/ca.pem) and proxies the well-known endpoints to the authenticator.
  # certs generated by dev-compose.sh into deploy/compose/authn-tls-certs/.
  authn-tls:
    !!merge <<: *backend-common
    image: nginx:1.27-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-insight}-authn-tls
    depends_on:
      authenticator: {condition: service_started}
    volumes:
      - ./deploy/compose/authn-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/compose/authn-tls-certs:/certs:ro

  # Gateway (OpenResty edge) — the DEFAULT :8080 entry (NGINX_BFF): auth_request
  # to the authenticator, JWT injection, routing to analytics/identity + the SPA.
  # `/` -> insight-front resolves lazily (nginx resolver), so the gateway starts
  # even when no frontend profile is up — the /auth + /api surfaces (drivable by
  # curl) work regardless. (#1583 step 09 removes the legacy api-gateway.)
  gateway:
    !!merge <<: *backend-common
    image: ${GATEWAY_IMAGE:-insight-gateway:dev}
    container_name: ${COMPOSE_PROJECT_NAME:-insight}-gateway
    build:
      context: src/backend
      dockerfile: services/gateway/Dockerfile
    depends_on:
      authenticator: {condition: service_started}
      analytics: {condition: service_started}
      identity-resolution: {condition: service_started}
    environment:
      GATEWAY_AUTHENTICATOR_URL: "http://authenticator:8083"
      # The three frontend variants listen on three different ports — vite on
      # 5173, the local-dist nginx on 80, and the published image on 8080 since
      # it began running as a non-root user (uid 101 cannot bind 80).
      # dev-compose.sh sets this from FRONTEND_MODE; the default matches the
      # published image, which is what a bare `docker compose` most likely runs.
      GATEWAY_FRONT_URL: "http://insight-front:${FRONTEND_INTERNAL_PORT:-8080}"
    volumes:
      # Compose route table (docker service names). The k8s equivalent is the
      # chart's templated gateway.routes values. Edit + restart to regenerate.
      - ./deploy/compose/gateway/routes.yaml:/etc/gateway/routes.yaml:ro
    ports:
      - "${GATEWAY_PORT:-8080}:8080"

  # ── Frontend (one variant active per FRONTEND_MODE) ────────────────────
  #
  # The dev-compose.sh up script translates FRONTEND_MODE=dev|built|ghcr
  # into the matching --profile flag.

  insight-front-dev:
    !!merge <<: *restart-policy
    profiles: ["front-dev"]
    image: node:24-bookworm-slim
    container_name: ${COMPOSE_PROJECT_NAME:-insight}-front
    networks:
      insight:
        aliases: [insight-front]
    working_dir: /app
    environment:
      CI: "true"
      # Vite proxies `/api/*` to this target — used by the FE's
      # analytics + identity API clients. Must resolve from inside the
      # frontend container, so we use the compose service name.
      VITE_API_PROXY_TARGET: "${VITE_API_PROXY_TARGET:-http://gateway:8080}"
    volumes:
      - ./src/frontend:/app
      - frontend-node-modules:/app/node_modules
    command:
      - "sh"
      - "-c"
      - "corepack enable && pnpm install --frozen-lockfile && exec pnpm dev --host 0.0.0.0 --port 5173"
    ports:
      - "${FRONTEND_PORT:-3000}:5173"

  insight-front-built:
    !!merge <<: *restart-policy
    profiles: ["front-built"]
    image: nginx:1.27-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-insight}-front
    networks:
      insight:
        aliases: [insight-front]
    environment:
      # Must be DEFINED even when empty: the stock nginx entrypoint's envsubst
      # only substitutes environment variables that exist, and an unsubstituted
      # ${SENTRY_CONNECT_SRC} in the CSP template is an nginx [emerg]. The
      # published image's own entrypoint substitutes it unconditionally.
      SENTRY_CONNECT_SRC: ${SENTRY_CONNECT_SRC:-}
    volumes:
      # Host-built dist/ — produced by dev-compose.sh build (build-frontend)
      # or by running `pnpm build` in src/frontend.
      - ./src/frontend/dist:/usr/share/nginx/html:ro
      - ./src/frontend/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./src/frontend/nginx/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
    ports:
      # 8080, not the stock image's 80: the mounted default.conf.template is
      # the published image's and declares `listen 8080`.
      - "${FRONTEND_PORT:-3000}:8080"

  insight-front-ghcr:
    !!merge <<: *restart-policy
    profiles: ["front-ghcr"]
    # No platform pin: the published tags are multi-arch manifests covering
    # linux/amd64 and linux/arm64, so Apple-silicon hosts pull arm64 natively.
    image: ${FRONTEND_IMAGE:-ghcr.io/constructorfabric/insight-frontend:latest}
    container_name: ${COMPOSE_PROJECT_NAME:-insight}-front
    networks:
      insight:
        aliases: [insight-front]
    environment:
      CSP_REMOTE: ${CSP_REMOTE:-}
    volumes:
      # Patch script — inserts `location /api/ → gateway:8080` into the
      # FE image's nginx config at a known marker. Avoids maintaining a
      # parallel config (drift surface): we describe just the diff we
      # need. The published image has no /api proxy because k8s ingress
      # routes /api → gateway directly; compose has no front-proxy so
      # the hop has to land locally.
      - ./deploy/compose/front-ghcr-patch-conf.sh:/compose/front-ghcr-patch-conf.sh:ro
    # The COMMAND, deliberately — the image's entrypoint stays in place and
    # runs first. It copies the config into /etc/nginx/conf.d and execs this,
    # which patches what it produced and then execs nginx. Overriding the
    # entrypoint instead used to work, and stopped once the image began
    # running as `nginx` (uid 101): the template directory it wrote to is
    # root-owned, so the patch died with "Permission denied" and the whole
    # container with it. See the script for the full account.
    command: ["/bin/sh", "/compose/front-ghcr-patch-conf.sh", "nginx", "-g", "daemon off;"]
    ports:
      # 8080 inside, not 80: the image runs as uid 101, which cannot bind a
      # privileged port. The host side stays 3000 either way.
      - "${FRONTEND_PORT:-3000}:${FRONTEND_INTERNAL_PORT:-8080}"

  # ── Builders (profile=build) ───────────────────────────────────────────
  #
  # These run to completion and exit. Invoked by dev-compose.sh build, not
  # by `up`. They produce Linux artefacts on whatever host (Mac/Win/Linux)
  # so the runtime containers can bind-mount them.

  build-rust:
    profiles: ["build"]
    image: rust:1.95-bookworm
    container_name: ${COMPOSE_PROJECT_NAME:-insight}-build-rust
    networks: [insight]
    working_dir: /workspace
    environment:
      CARGO_TARGET_DIR: /target
    volumes:
      - ./src/backend:/workspace
      - rust-target:/target
      - ./deploy/compose/build:/out
    # The script overrides this command to pick a specific bin. Default
    # builds both Rust services.
    command:
      - "bash"
      - "-c"
      - |
        set -eux
        apt-get update && apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev pkg-config libssl-dev cmake > /dev/null
        cargo build --release --bin analytics --bin authenticator
        mkdir -p /out/analytics /out/authenticator
        rm -rf /out/analytics/analytics
        rm -rf /out/authenticator/authenticator
        # cat + cmp, never cp/install: /out is a macOS bind mount where cp
        # fails with "error deallocating: Invalid argument" AFTER writing a
        # SHORT file, and `cp X Y && chmod Y` hides that from set -e (bash
        # exempts every command in an && list but the last), shipping a
        # truncated binary that segfaults on exec. cmp makes it fatal here.
        cat /target/release/analytics > /out/analytics/analytics
        chmod 0755 /out/analytics/analytics
        cmp -s /target/release/analytics /out/analytics/analytics || { echo 'ERROR: /out/analytics/analytics copied corrupt' >&2; exit 1; }
        cat /target/release/authenticator > /out/authenticator/authenticator
        chmod 0755 /out/authenticator/authenticator
        cmp -s /target/release/authenticator /out/authenticator/authenticator || { echo 'ERROR: /out/authenticator/authenticator copied corrupt' >&2; exit 1; }

  build-frontend:
    profiles: ["build"]
    image: node:24-bookworm-slim
    container_name: ${COMPOSE_PROJECT_NAME:-insight}-build-frontend
    networks: [insight]
    working_dir: /app
    volumes:
      - ./src/frontend:/app
      - frontend-node-modules:/app/node_modules
    command:
      - "sh"
      - "-c"
      - "corepack enable && pnpm install --frozen-lockfile && pnpm build"

  # ── Sample-data seeder (profile=seed) ──────────────────────────────────
  #
  # Invoked via ./dev-compose.sh seed which passes positional args
  # (identity | silver | all) through to seed.py.
  seed-sample:
    profiles: ["seed"]
    container_name: ${COMPOSE_PROJECT_NAME:-insight}-seed-sample
    networks: [insight]
    # Context is the ingestion tree: the image carries the seeder AND the DDL /
    # gold-build scripts its silver step runs. Same image CI publishes for the
    # cluster Job — the toolbox deliberately carries neither.
    build:
      context: src/ingestion
      dockerfile: tools/seed/Dockerfile
    # The image pins USER 1000. That is unambiguous where it was chosen — as a
    # k8s Job the seed mounts nothing from a host — but compose bind-mounts the
    # source below and the seed writes manifest.json back into it, so the
    # container has to run as whoever owns the checkout. A tree owned by any
    # other uid is simply not writable by 1000, and the seed dies on its last
    # step with EACCES after doing all of its work. Still non-root.
    user: "${SEED_UID:-1000}:${SEED_GID:-1000}"
    depends_on:
      # required: false → seeding an external DB doesn't need the local
      # mariadb/clickhouse profiles to be active.
      mariadb: {condition: service_healthy, required: false}
      clickhouse: {condition: service_healthy, required: false}
      identity-resolution: {condition: service_started}
    environment:
      # Identity / persons anchor
      DEV_USER_EMAIL: "${DEV_USER_EMAIL:-}"
      TENANT_DEFAULT_ID: "${TENANT_DEFAULT_ID:-00000000-df51-5b42-9538-d2b56b7ee953}"
      # Must match the authenticator's idp.source_type (AUTHENTICATOR_IDP_SOURCE_TYPE
      # above) — the dev-lead's login-bootstrap value_type='id' row is seeded
      # under this source_type.
      IDP_SOURCE_TYPE: "${AUTHENTICATOR_IDP_SOURCE_TYPE:-keycloak}"
      # MariaDB — falls back to the local docker service name/port; the
      # wizard rewrites these when external MariaDB is selected.
      MARIADB_HOST: "${MARIADB_HOST:-mariadb}"
      MARIADB_PORT: "${MARIADB_INTERNAL_PORT:-3306}"
      MARIADB_USER: "${MARIADB_USER:-insight}"
      MARIADB_PASSWORD: "${MARIADB_PASSWORD:-insight-local}"
      # Required by the seeder, with no default in code: which database holds the
      # analytics catalogue tables is a per-stand fact. Here it is a database of
      # its own; a chart-deployed stand keeps them in `mariadb.database`.
      MARIADB_ANALYTICS_DB: "${MARIADB_ANALYTICS_DB:-analytics}"
      # The second-tenant refusal fixture. ON here because tests/stand asserts
      # cross-tenant refusal against it; a cluster stand turns it off, where a
      # second tenant would abort identity-resolution's scheduled projection.
      SEED_CROSS_TENANT_FIXTURE: "${SEED_CROSS_TENANT_FIXTURE:-1}"
      # ClickHouse — same convention as MariaDB above.
      CLICKHOUSE_HOST: "${CLICKHOUSE_HOST:-clickhouse}"
      CLICKHOUSE_HTTP_PORT: "${CLICKHOUSE_INTERNAL_HTTP_PORT:-8123}"
      CLICKHOUSE_USER: "${CLICKHOUSE_USER:-insight}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-insight-local}"
      CLICKHOUSE_DATABASE: "${CLICKHOUSE_DATABASE:-insight}"
      # Grant-less `presentation` user's password (#1964), provisioned on seed.
      CLICKHOUSE_PRESENTATION_PASSWORD: "${CLICKHOUSE_PRESENTATION_PASSWORD:-presentation-local}"
      # apply-ch-migrations.sh runs `dbt run` from /ingestion/dbt. The
      # ingestion tree is bind-mounted read-only (below), so redirect dbt's
      # writable outputs (target/, logs/) to a writable scratch dir.
      DBT_TARGET_PATH: "/tmp/dbt-target"
      DBT_LOG_PATH: "/tmp/dbt-logs"
      # The `user:` above is the host's uid, which has no /etc/passwd entry in
      # this image, so Docker leaves HOME at "/" — not writable, and dbt writes
      # ~/.dbt/.user.yml for its anonymous-usage id before it runs anything.
      HOME: "/tmp"
      # Seed window. SEED_ANCHOR_DATE is the last day carrying activity — an
      # ISO date pins the dataset reproducibly, the literal `today` (or unset)
      # tracks the calendar. Both are recorded in the emitted manifest.
      SEED_ANCHOR_DATE: "${SEED_ANCHOR_DATE:-}"
      # Two years, matching the deployed stand. Wider than any one request the
      # analytics API will answer (it refuses a period of 400 days or more), so
      # a test asking about "the seeded period" must clamp — see
      # tests/stand/api/analytics/query_window.
      SEED_DAYS: "${SEED_DAYS:-730}"
      # Organisation size; empty is the committed 26-person roster. Listed
      # because compose's `environment` is an allowlist.
      SEED_ORG_HEADCOUNT: "${SEED_ORG_HEADCOUNT:-}"
      # Preflight's documented escape hatch; unreachable unless listed here.
      SEED_FORCE: "${SEED_FORCE:-}"
      # The issuer the authenticator resolved for this run. `test-stand up`
      # persists it after cmd_up so the manifest
      # records the real IdP instead of assuming the default.
      AUTHENTICATOR_OIDC_ISSUER: "${AUTHENTICATOR_OIDC_ISSUER:-}"
    volumes:
      # One mount, writable, over the tree the image already carries: seeder
      # edits and script edits both take effect without a rebuild (the package
      # is installed editable), and the seed writes manifest.json back into
      # tools/seed at the end of a run — the fixed path downstream test phases
      # read. Read-only would fail that last step after all the real work.
      - ./src/ingestion:/ingestion
