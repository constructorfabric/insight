##
## Insight umbrella — default values.
##
## Customers override these with their own values.yaml (secrets, hosts, tuning).
##
## Commands for verification:
##   helm dependency update charts/insight
##   helm template insight charts/insight | less
##   helm template insight charts/insight -f my-values.yaml | less
##
## ─────────────────────────────────────────────────────────────────────────
## Conventions
## ─────────────────────────────────────────────────────────────────────────
## 1. Release name = `insight`. All internal DNS names follow the pattern
##    `{.Release.Name}-{component}` (insight-clickhouse, insight-mariadb,
##    insight-api-gateway, ...). If you deploy under a different release
##    name, override the corresponding `host`/`url` fields in your values.
##
## 2. SINGLE-NAMESPACE model: Airbyte, Argo Workflows and the umbrella are
##    separate Helm releases that all deploy into the release namespace
##    (default `insight`). Multiple Insight instances on one cluster use
##    different namespaces — each is self-contained.
##
## 3. Every INFRA dependency (ClickHouse, MariaDB, Redis, Redpanda) is
##    deployed OUT-OF-CHART (separate releases in `insight-infra` via
##    gitops `make system-*`). The umbrella only carries the wiring it
##    needs to dial them:
##      <dep>.host           — host (MUST be set)
##      <dep>.port           — port
##      <dep>.database       — db name (where applicable)
##      <dep>.username       — login user
##      <dep>.passwordSecret — {name, key} pointing at a K8s Secret
##    These are just strings the consumers (and the pre-install init-DB
##    Hook Jobs) read — the umbrella never runs the dep itself.
##
## 4. Core app services (apiGateway, analytics, frontend) are MANDATORY
##    components of the umbrella — no deploy-flag. The gateway is the
##    only entrance to the cluster internals; the other services are
##    reachable only through it. This matches the Constructor Platform
##    integration contract.
##    Identity Resolution (`identityResolution`) is OPTIONAL (deploy-flag,
##    off by default) — it is the Rust persons-store service that owns the
##    `identity` MariaDB database (per ADR-0006), reads observation history
##    from ClickHouse `identity.identity_inputs`, and is NOT an OIDC provider.
##
## 5. Resolved infra coordinates (URLs, hosts) live in a single ConfigMap
##    named `{release}-platform` (see templates/platform-config.yaml).
##    Any pod in the namespace can read them via `envFrom`.
##
## 6. Credentials are stored in Secrets — never inline. With
##    `credentials.autoGenerate: true` the umbrella provisions
##    `{release}-db-creds` with random 24-char passwords on first install
##    and reuses them via `lookup` on subsequent upgrades. For BYO /
##    platform integration, pre-create the Secret before `helm install`.
##

# ─── Credentials ──────────────────────────────────────────────────────────
# Single source of truth for all DB passwords. With autoGenerate=true (the
# default), the umbrella generates random 24-char passwords on first
# install and stores them in the Secret `insight-db-creds` (keys:
# clickhouse-password, mariadb-password, mariadb-root-password,
# redis-password). Subsequent `helm upgrade` runs reuse the existing
# values via `lookup` — passwords stay stable.
#
# ─────────────────────────────────────────────────────────────────────
#  GitOps note — IMPORTANT
# ─────────────────────────────────────────────────────────────────────
# ArgoCD renders charts via `helm template`, where Helm's `lookup`
# function ALWAYS returns nil — so under a reconcile loop every sync
# would regenerate `randAlphaNum 24` and rotate every DB password.
# Set `autoGenerate: false` in any GitOps overlay and pre-create
# `insight-db-creds` via ExternalSecrets / sealed-secrets / SOPS.
#
# For Constructor Platform / BYO (air-gapped, custom secret tooling):
# same — `autoGenerate: false` + pre-create the Secret. `lookup` finds
# and uses it; the umbrella's BYO validator refuses any install where
# a required key is missing, empty, or contains URL-reserved characters.
credentials:
  # Imperative `helm install/upgrade` is the default; the umbrella
  # generates random passwords on first install and reuses them via
  # `lookup` on every upgrade. Under ArgoCD/Flux (`helm template`) lookup
  # returns nil, so the GitOps overlay MUST flip `deploymentMode: gitops`
  # AND `autoGenerate: false` — the validator refuses the combination
  # `gitops + autoGenerate=true` because it would silently rotate every
  # DB password on each reconcile.
  deploymentMode: helm # helm | gitops
  autoGenerate: true
# ─── Global values ────────────────────────────────────────────────────────
# Everything under `global:` is visible to all subcharts automatically.
# IMPORTANT: bitnami charts read `global.imageRegistry` and rewrite all
# their images to use it. Do NOT set `imageRegistry` here — each of our
# services sets `image.repository` explicitly.
global:
  imagePullSecrets: [] # pull-secrets for a private registry
  storageClass: "" # empty = default StorageClass of the cluster
  security:
    # bitnami charts check that the image belongs to their "secure images"
    # list. We use bitnamilegacy (see mariadb.image / redis.image) so we
    # have to allow "insecure" images — otherwise the chart refuses to deploy.
    allowInsecureImages: true
  # Optional single-tenant seed UUID. NGINX_BFF: the request tenant comes ONLY
  # from the signed gateway JWT (the api-gateway plugin default fallback was
  # removed), so this no longer affects request-time tenant — it only feeds the
  # analytics metric-catalog fallback + identity-resolution's bootstrap-admin
  # seed. Empty (default) = no default anywhere; a missing tenant fails closed.
  tenantDefaultId: ""
# ═══════════════════════════════════════════════════════════════════════════
#  OBSERVABILITY — logs & traces EMISSION (the product contract)
# ═══════════════════════════════════════════════════════════════════════════
#
# Insight ALWAYS emits structured JSON to stdout — that is the product
# contract and is not toggleable. WHETHER it ALSO exports OTLP, and WHERE,
# is driven entirely by `otlp.endpoint`:
#
#   endpoint: ""   — stdout only. No OTEL_* vars are published; whoever
#                    runs the cluster collects stdout (the host's own node
#                    agent, or the Loki/Alloy/Grafana stack installed via
#                    the deploy pipeline's system layer). SAFE DEFAULT for
#                    a drop into an unknown existing cluster.
#   endpoint: set  — services additionally export OTLP there: the
#                    in-cluster Alloy for a self-hosted stack
#                    (http://alloy.insight-infra.svc.cluster.local:4317),
#                    or the customer's own collector.
#
# The umbrella NEVER installs the collector stack — like Airbyte and Argo
# it is separate releases, driven by the deploy pipeline (inventory
# toggles; see deploy/gitops/system/README.md). This block only governs what
# services EMIT. The values are published into the `{release}-platform`
# ConfigMap as INSIGHT_LOG_LEVEL / OTEL_* env vars, so every pod that does
# `envFrom` picks them up uniformly — no per-service wiring.
observability:
  logs:
    level: info # debug|info|warn|error — default level for all services
  otlp:
    endpoint: "" # empty = stdout only; set = services export OTLP here
    protocol: grpc # grpc | http/protobuf
# ═══════════════════════════════════════════════════════════════════════════
#  EXTERNAL — Airbyte (installed as a separate Helm release)
# ═══════════════════════════════════════════════════════════════════════════
airbyte:
  releaseName: airbyte # Helm release name of the L2 Airbyte system release
  # Namespace of the Airbyte release. "" = same namespace as this chart.
  # When Airbyte runs in its own namespace (e.g. insight-infra), set it here:
  # the sync/reconcile jobs then read `authSecret` from that namespace via
  # the K8s API (a Role/RoleBinding is rendered there — see
  # templates/ingestion/airbyte-auth-rbac.yaml), and the computed apiUrl
  # points at it. No copy of the Secret in the app namespace is needed.
  namespace: ""
  # "" = compute from releaseName + airbyte namespace. If you point apiUrl
  # at an Airbyte in ANOTHER namespace, set `namespace` too — it controls
  # where the auth Secret is read from. Leaving it empty makes the jobs
  # read a copy in the app namespace, which goes stale when Airbyte
  # regenerates its credentials (issue #1885).
  apiUrl: ""
  jwtSecret:
    name: airbyte-auth-secrets # created by the Airbyte chart itself
    key: jwt-signature-secret
  authSecret:
    name: airbyte-auth-secrets # same K8s Secret as jwtSecret; carries OAuth client credentials
    clientIdKey: instance-admin-client-id # key under .data
    clientSecretKey: instance-admin-client-secret # key under .data
# ═══════════════════════════════════════════════════════════════════════════
#  INGESTION — WorkflowTemplates (content for Argo)
# ═══════════════════════════════════════════════════════════════════════════
#
# The WorkflowTemplates require the Argo Workflows CRDs to be present in
# the cluster. If Argo is not installed, set enabled=false or the umbrella
# will fail with `no matches for kind "WorkflowTemplate"`.
#
# `toolboxImage` is baked into the rendered WorkflowTemplate as the
# input-parameter default. Submitters (api-gateway, CronWorkflow YAML,
# run-sync.sh) can still override per-call, but in the common case they
# just submit the workflow without specifying a tag and get the
# operator-pinned version. NO `:latest` defaults — the validator refuses
# to render when `templates.enabled=true` and this field is empty.
#
# Connector images (CDK sources + enrich sidecars) are NOT in values.yaml —
# per ADR-0016 each connector's image refs live exclusively in
# `descriptor.yaml.images.<key>.image` (keys: `cdk`, `enrich`, …) and are
# propagated to the source-definition / enrich WorkflowTemplate / ingestion-
# pipeline submission via reconcile reading them on every run.
ingestion:
  # PREREQUISITE: when `templates.enabled=true`, the rendered Argo
  # `WorkflowTemplate` objects pin `serviceAccountName: argo-workflow`.
  # The `argo-workflow` ServiceAccount + supplemental RBAC (Role
  # `argo-workflow-executor` granting create/patch on
  # `workflowtaskresults.argoproj.io`) are NOT shipped by this chart —
  # they come from the gitops Argo Workflows system layer
  # (`deploy/gitops/system/argo-workflows`, applied via `make system-argo`).
  # Otherwise workflow submission fails with
  # `serviceaccount "argo-workflow" not found`.
  templates:
    enabled: true
  toolboxImage: "ghcr.io/constructorfabric/insight-toolbox:2026.08.24.12.33-dc52a4c" # e.g. "ghcr.io/constructorfabric/insight-toolbox:2026.04.28.10.34-b08b460"
  # The sample-data seeder's image, for TEST stands only. Nothing in the chart
  # runs it: `src/ingestion/tools/seed/seed-stand.sh` reads this value to render
  # a one-shot Job. Its own image rather than the toolbox on purpose — the
  # toolbox runs migrations on real stands and does not carry demo data. Empty
  # (the default) means the stand cannot be seeded until an operator names an
  # image, either here or with the script's `--image` flag.
  seedImage: "ghcr.io/constructorfabric/insight-seed:2026.08.24.12.33-dc52a4c" # e.g. "ghcr.io/constructorfabric/insight-seed:2026.04.28.10.34-b08b460"
  # airbyte-sync poll-job tunables — see templates/ingestion/airbyte-sync.yaml.
  # The poll loop replaces a wall-clock deadline with a progress watchdog:
  # it tracks (status, bytesEmitted, recordsEmitted, stateMessagesEmitted)
  # on the latest attempt and resets a timer whenever any of those move.
  # If the timer exceeds `idleThresholdSeconds`, the step exits with a
  # "no-progress" failure (exit 2), distinct from SIGTERM (exit 143).
  airbyteSync:
    pollIntervalSeconds: 30
    idleThresholdSeconds: 1800 # 30 min without any byte/record/state movement → fail
  # Data-quality checks: a CronWorkflow runs the dbt check catalog (the
  # `data_quality` selector — tests tagged data_quality, not every dbt test) on
  # a schedule, independent of the per-connector pipeline. See
  # templates/ingestion/data-quality-cron.yaml and data-quality-test.yaml.
  # Each check emits a JSON finding to stdout for the central log store.
  # Checks are non-blocking (severity=warn) so a finding never freezes
  # ingestion.
  dataQuality:
    enabled: true
    schedule: "0 6 * * *" # daily 06:00 UTC, after overnight connector syncs
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
    ttlSecondsAfterCompletion: 1800
    ttlSecondsAfterSuccess: 600
    ttlSecondsAfterFailure: 3600
  # Reconcile loop: descriptor-driven Airbyte connector reconciliation,
  # cron-scheduled inside the cluster (see templates/ingestion/reconcile-cron.yaml).
  reconcile:
    schedule: "*/15 * * * *"
    # Airbyte workspace UUID is auto-discovered at runtime via ab_workspace_id (ADR-0009) — no value to set.
    destinationId: "" # Optional override: explicit Airbyte destination UUID. Leave empty for fresh installs — reconcile auto-creates the Bronze ClickHouse destination by name (ADR-0012).
    destinationName: "" # Optional: name of the Bronze destination managed by reconcile. Default `clickhouse-bronze`.
    argoInstanceId: "" # Optional. Set only if the cluster's Argo workflow controller runs with `instanceID:` configured (e.g. "argo-workflows-insight" on dev-vhc). Empty leaves the controller-instanceid label off — controllers without instanceID accept that.
    tenantId: "" # Set to the Insight tenant slug (used in source/connection names per ADR-0005). No silent default.
    # NB: the old `logs:` block (PVC/emptyDir file logger at
    # /var/log/insight) is gone — reconcile emits structured JSON to
    # stdout and the cluster's log collector is the durable destination.
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
# ═══════════════════════════════════════════════════════════════════════════
#  INFRASTRUCTURE (external — deployed out-of-chart at L2)
# ═══════════════════════════════════════════════════════════════════════════
#
# ClickHouse, MariaDB, Redis and Redpanda are NOT bundled by this chart.
# They run as separate releases in `insight-infra` (gitops `make system-*`).
# See CONTRIBUTING.md ("Deployment paths" → Kubernetes) and
# deploy/gitops/README.md for the layered L0/L2/L3 model.
# The blocks below are pure WIRING — the host/port/creds the app services
# and the pre-install init-DB Hook Jobs use to reach them:
#   <dep>.host / .port     — connection target (host MUST be set)
#   <dep>.database         — db name (where applicable)
#   <dep>.username         — login user
#   <dep>.passwordSecret   — {name, key}

# ─── ClickHouse ──────────────────────────────────────────────────────────
# NO defaults for host / username / database — operator MUST supply.
# Ports are RFC standards and may stay defaulted.
clickhouse:
  host: "" # MUST be set (external L2 ClickHouse host)
  port: 8123 # RFC standard for CH HTTP
  protocol: http # http|https for the Bronze airbyte/destination-clickhouse 2.x connection
  database: "" # MUST be set
  username: "" # MUST be set
  passwordSecret:
    # Fixed Secret name — chart convention (one Insight per namespace).
    name: "insight-db-creds"
    key: "clickhouse-password"
  # Databases the chart's pre-install Hook Job (clickhouse-init-svcdbs-job)
  # creates against the external ClickHouse via CREATE DATABASE IF NOT
  # EXISTS. Connector-specific bronze schemas (bronze_jira, bronze_slack, …)
  # are created by ingestion pipelines themselves; only schemas required
  # at startup live here.
  initDatabases:
    - insight
    # Empty writable namespace for new gold / saved-query results / scratch
    # (#1964). The read-only presentation_ro role + grant-less `presentation`
    # user are provisioned by the clickhouse-migrate Hook (apply-ch-migrations
    # -> provision-presentation-access.sh).
    - presentation
    # Adoption events (#2573). Here rather than in the migration alone because
    # the presentation_ro grant references it before that migration runs.
    - product_usage
  # When true (default), a post-install/post-upgrade Hook Job
  # (clickhouse-migrate-job) applies the gold-view migrations
  # (src/ingestion/scripts/migrations/*.sql) + ADR-0007 placeholders against
  # the external ClickHouse, using ingestion.toolboxImage. Set false to own
  # CH migrations out-of-band (e.g. a managed-warehouse change process).
  # The Job also no-ops if an overlay explicitly clears ingestion.toolboxImage.
  runMigrations: true
# ─── MariaDB ─────────────────────────────────────────────────────────────
mariadb:
  host: "" # MUST be set (external L2 MariaDB host)
  port: 3306 # RFC standard for MySQL/MariaDB
  database: "" # MUST be set
  username: "" # MUST be set
  passwordSecret:
    name: "insight-db-creds"
    key: "mariadb-password"
# ─── Redis ───────────────────────────────────────────────────────────────
redis:
  host: "" # MUST be set (external L2 Redis host)
  port: 6379 # RFC standard for Redis
  passwordSecret:
    name: "insight-db-creds"
    key: "redis-password"
# ─── Redpanda ────────────────────────────────────────────────────────────
redpanda:
  brokers: "" # MUST be set (external L2 Redpanda brokers, comma-separated host:port)
# ═══════════════════════════════════════════════════════════════════════════
#  APPLICATION SERVICES (mandatory — no deploy-flag)
# ═══════════════════════════════════════════════════════════════════════════
#
# App-service subcharts consume their config from a Secret generated by
# the umbrella (see templates/secrets.yaml). When `existingSecret` is set,
# the subchart skips its own Secret template; all APP__* / similar
# env vars come from the umbrella-managed Secret.

# ─── API Gateway ─────────────────────────────────────────────────────────
# NO defaults for image.tag, OIDC audience, OIDC issuer/clientId/redirectUri,
# or downstream service URLs (those come from `{release}-platform`
# ConfigMap via envFrom). The chart MUST refuse to render without them.
# ─── Gateway (nginx+auth edge, NGINX_BFF EPIC #1583) ───────────────────────
# The single entrance: OpenResty runs auth_request -> authenticator, injects the
# ES256 gateway JWT, and fans out to the app services + SPA. The subchart's own
# defaults template the upstreams (authenticatorUrl / frontUrl / analytics /
# identity) off `.Release.Name`, so no per-URL wiring is needed here.
gateway:
  replicaCount: 2
  image:
    repository: ghcr.io/constructorfabric/insight-gateway
    tag: "" # MUST be set (e.g. "0.1.0")
    pullPolicy: IfNotPresent
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 500m, memory: 128Mi}
  # The gateway's route attaches to the shared Gateway; it routes "/" internally.
  route:
    enabled: true
    parentRef:
      name: insight
      namespace: insight-infra
      # Target listener on the Gateway (e.g. https). Empty = all listeners.
      sectionName: ""
    host: ""
# ─── Authenticator (OIDC login + Redis sessions + gateway-JWT mint) ─────────
authenticator:
  replicaCount: 1
  image:
    repository: ghcr.io/constructorfabric/insight-authenticator
    tag: "" # MUST be set (e.g. "0.1.0")
    pullPolicy: IfNotPresent
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
  # Leaf config (redis/identity/gateway_issuer/idp/redirect) is composed by the
  # umbrella into `insight-authenticator-config` (templates/secrets.yaml).
  existingSecret: "insight-authenticator-config"
  # ES256 signing keys (current.pem PKCS#8). NOT auto-generated — supplied as a
  # sealed/BYO Secret with key `current.pem` (local: sealed under
  # environments/local/sealed-secrets/insight/).
  signingKeysSecret: "insight-authenticator-signing-keys"
  # authn-tls sidecar so downstream verifiers resolve the JWKS over https. The
  # cert is issued by cert-manager; `issuerRef.name` is the cluster's CA issuer
  # (local: the self-signed `local-ca` ClusterIssuer from bootstrap).
  tlsDiscovery:
    enabled: true
    port: 8443
    issuerRef:
      name: local-ca
      kind: ClusterIssuer
  # OIDC upstream + browser callback, folded into insight-authenticator-config.
  # Values may be Helm templates (rendered with `tpl`); local points at Keycloak.
  oidc:
    issuerUrl: "" # the IdP issuer (local: the in-stack Keycloak realm URL)
    clientId: "insight-authenticator"
    clientSecret: ""
    redirectUri: "" # browser-facing callback, through the gateway edge
    # The identity-resolution source_type this IdP is seeded under (e.g.
    # "ms-entra") — required; the login-bootstrap person lookup is scoped to
    # it. No default: an empty value fails config validation at boot.
    sourceType: ""
    # id_token claim carrying the IdP's stable external user id for
    # sourceType (e.g. Entra's "oid"). Defaults to "sub".
    externalIdClaim: "sub"
    # Provision a person on first successful login instead of refusing one the
    # journal has no binding for yet.
    #
    # The login-bootstrap row is otherwise written only by the nightly
    # persons-seed, which links a person by e-mail — so a roster member whose
    # directory publishes no address (a GitHub member with a hidden e-mail, for
    # one) cannot enter until an operator binds them by hand.
    #
    # Off by default because it widens who may ENTER. It does not widen who
    # EXISTS: identity mints only for an account a connector has already
    # observed, refuses one the source has closed, refuses one an operator
    # excluded, and writes only under the tenant its own journal is keyed by.
    provisionOnLogin: false
  # Honor `/auth/login?__override=<email>` (view-as, #1941): the session is
  # minted for that person instead of the authenticated one. Dev/demo
  # environments ONLY — MUST stay false anywhere real users log in.
  overrideEnabled: false
  # Honor a post-login return into the `/exp/<name>` preview subtree (#1973):
  # only when true is a login return under that prefix accepted. Dev/demo
  # preview stands ONLY — a production stand leaves this false so it cannot
  # host experimental frontends against its data.
  experimentsEnabled: false
# ─── keycloak ────────────────────────────────────────────────────────────────
# The stack's Keycloak (identity broker, ADR-0003): start, MariaDB-backed,
# admin from a Secret; realm content via keycloakConfig only.
keycloak:
  deploy: false
  image:
    repository: quay.io/keycloak/keycloak
    tag: "26.4"
    pullPolicy: IfNotPresent
  # Advertised issuer BASE (must end in /kc) — the URL browser AND
  # authenticator reach, e.g. https://<host>/kc.
  hostname: ""
  # Admin console base. The route exposes only /kc/realms + /kc/resources;
  # the console rides a port-forward (empty = http://localhost:<port>/kc).
  adminHostname: ""
  # Bootstrap-admin Secret (keys username/password) and DB connection.
  admin:
    existingSecret: ""
  database:
    host: ""
    port: 3306
    name: "keycloak"
    username: ""
    passwordSecret: {name: "", key: ""}
  route:
    enabled: false
# ─── keycloakConfig (broker realms as code — ADR-0003, EPIC #2193) ──────────
# Hook Job applying the env's versioned realm YAML (pre-created ConfigMap from
# the gitops `keycloak-broker-realms` target) with keycloak-config-cli on every
# deploy. Independent of `keycloak.deploy`.
keycloakConfig:
  enabled: false
  image:
    repository: adorsys/keycloak-config-cli
    # Release line must match the Keycloak server major.
    tag: "6.5.1-26.1.0"
    pullPolicy: IfNotPresent
  # Keycloak base URL (tpl-rendered). Must be https; plain http only with
  # allowInsecureUrl=true (in-cluster dev/CI Keycloak only).
  url: ""
  allowInsecureUrl: false
  # envFrom Secret: any $(env:VAR) the realm YAML references; the config-cli
  # login (KEYCLOAK_USER/KEYCLOAK_PASSWORD) is mapped from the same Secret's
  # username/password keys via extraEnv. Sealed in gitops — never a value in
  # realm YAML.
  existingSecret: "insight-keycloak-config"
  # Extra env entries for placeholders resolving from OTHER Secrets (single
  # sealed source of truth; also the only way to reach non-C-identifier keys,
  # which envFrom drops silently):
  #   - name: INSIGHT_AUTHENTICATOR_CLIENT_SECRET
  #     valueFrom:
  #       secretKeyRef: {name: insight-oidc, key: oidc-client-secret}
  # The Job also injects INSIGHT_TENANT_ID from global.tenantDefaultId (set):
  # realm IdP mappers pin the tenant per environment, never from IdP claims.
  extraEnv: []
  # Glob(s) config-cli imports, comma-separated. config-cli FAILS on any
  # glob with zero matches — list only patterns the env's realms dir
  # always contains. Local adds ',/config/*.json' for the generated realm.
  filesLocations: "/config/*.yaml"
  # Pre-created realms ConfigMap (empty = <release>-keycloak-config-realms).
  realmsConfigMap: ""
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}
# ─── Analytics ────────────────────────────────────────────────────────────
analytics:
  replicaCount: 2
  image:
    repository: ghcr.io/constructorfabric/insight-analytics
    tag: "" # MUST be set (e.g. "0.1.0")
    pullPolicy: IfNotPresent
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
  metricCatalog:
    tenantMetricsEnabled: false
  # Explaining a metric with an LLM. Off everywhere until an operator turns it
  # on, and turning it on without `tokenEncryptionKey` stops the service at
  # boot rather than accepting keys it cannot seal.
  aiAssist:
    enabled: false
    # Base64 of 32 random bytes: `openssl rand -base64 32`. Seals the Anthropic
    # keys people store. Rotating it makes every stored key unreadable, and
    # each person has to paste theirs again.
    tokenEncryptionKey: ""
    # One Anthropic key for the whole stand. Set it and nobody stores their
    # own: every explanation is paid for by this key, and the SPA offers no
    # place to paste a personal one.
    apiKey: ""
    # Restrict asking for an explanation to admins. On by default, because
    # the common setup is a stand key and then every call spends the
    # deployment's own money. Off for a stand where people bring their own.
    adminOnly: true
    model: "claude-sonnet-5"
  # The umbrella generates `insight-analytics-config` with every
  # APP__gears__analytics__config__* env var filled in from the
  # auto-generated credentials (see templates/secrets.yaml). The subchart
  # consumes it via envFrom (overriding its mounted config ConfigMap).
  existingSecret: "insight-analytics-config"
  # Metric Catalog single-tenant fallback comes from
  # `global.tenantDefaultId` (DESIGN §2.2 cpt-metric-cat-constraint-tenant-
  # default). The session-bound tenant from the gateway ALWAYS wins; this
  # global default fires only on header-less callers. Empty global value =
  # strict mode (400 tenant_unresolved on header-less requests).
  # Gateway-JWT verification (NGINX_BFF R1). The oidc-authn-plugin resolves the
  # authenticator's JWKS via OIDC discovery over https on `issuer` (the authn-tls
  # FQDN, rendered with `tpl`). It trusts the issuer's CA (ca.crt) from the
  # authn-tls cert Secret, mounted via `caCertSecret`. `issuer` here MUST equal
  # the authenticator's gateway_issuer and the identity issuer.
  gateway:
    issuer: 'https://{{ .Release.Name }}-authenticator.{{ .Release.Namespace }}.svc.cluster.local:8443'
    audience: "internal-services"
    caCertSecret: "insight-authenticator-authn-tls-cert"
    caCertPaths:
      - /etc/insight/authn-ca/ca.crt
# ─── Identity Resolution (Rust identity service, epic #1602) ─────────────
# The persons-store API. Reads from MariaDB `persons` written by the seed
# pipeline (src/backend/services/identity-resolution/seed/seed-persons-from-identity-input.py)
# fed off ClickHouse `identity.identity_inputs`. NOT an OIDC provider.
# Consumers reach it at `http://<release>-identity-resolution:8082`.
# `deploy: true` is mandatory: the authenticator's login-bootstrap resolve
# (GET /internal/persons/by-external-id / by-email-override) lives here
# (constructorfabric/insight#1960), and the authenticator is always installed
# (its "no deploy flag" app-service contract); `insight.validate` fails the
# render otherwise.
# SCHEMA OWNER: identity-resolution's migrate initContainer applies the
# migrations + first-admin bootstrap against `databaseName` — see ADR-0006
# (service-owned migrations).
# Git CLI Proxy — clone-based commit extraction for the nocode git connectors.
# Airbyte-only consumer: no gateway route, no platform-config entry (other
# services must not discover it), ingress restricted by its own NetworkPolicy.
# Deployed by default: every nocode git connector reads its commits, file
# changes and commit authors through this service, so an instance without it can
# sync no git source at all. The cost is one PVC (`persistence.size`) on an
# instance that syncs none — set deploy=false there.
# Two prerequisites an environment must meet before this renders for it:
#   * under `credentials.deploymentMode: gitops`, set `proxyToken` (or
#     pre-create insight-git-cli-proxy-config) — a template-time token would
#     differ on every sync, so secrets.yaml refuses to generate one;
#   * the deploy credential must hold a persistentvolumeclaims rule for the
#     cache claim (test-stand: ci-deployer-rbac.yaml).
gitCliProxy:
  deploy: true
  replicaCount: 1
  image:
    repository: ghcr.io/constructorfabric/insight-git-cli-proxy
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    requests: {cpu: 200m, memory: 256Mi}
    limits: {cpu: "2", memory: 2Gi}
  persistence:
    size: 50Gi
    storageClass: ""
  cache:
    # Budget defaults to 85% of persistence.size (subchart-computed); the
    # headroom absorbs transient packs and git temp files. Override with
    # diskBudgetBytes (must stay within 50-90% of the volume).
    maxRepoBytes: 10737418240
    defaultMaxStalenessSeconds: 300
    heavyOpsConcurrency: 4
    caCertPath: ""
  caCertSecret: ""
  # Bearer token the proxy requires on every /v1 request. Empty = generated on
  # first install and reused on every upgrade; reconcile hands it to the
  # connectors, so an operator never needs to see or copy it. Set it only to
  # pin a specific value.
  #
  # Under `credentials.autoGenerate: false` — which every gitops overlay runs —
  # the chart emits no Secret at all and this value is unused: pre-create
  # `existingSecret` below with the key
  # APP__gears__git_cli_proxy__config__proxy_token, the same contract as
  # `insight-db-creds`. Never inline the token here in a committed overlay.
  proxyToken: ""
  # Composed by templates/secrets.yaml (carries the bearer token).
  existingSecret: "insight-git-cli-proxy-config"
  networkPolicy:
    # Off by default, as on the authenticator: the /v1 bearer token is the
    # control, and requiring every deployment to declare where Airbyte runs
    # before the chart will install is friction the token already covers.
    # Enable it per deployment — the clone cache serves private source, so
    # hiding it from the rest of the cluster is worth the one value.
    enabled: false
    # Namespaces whose pods may call the proxy: the one running Airbyte
    # connector jobs, which is `airbyte.namespace` above when that is set.
    # Required whenever enabled=true — the subchart refuses to render an
    # allow-list that would deny every caller.
    allowedNamespaceLabels:
      - key: kubernetes.io/metadata.name
        values: []
identityResolution:
  deploy: true
  replicaCount: 1
  visibilityPolicy: "org_chart"
  image:
    repository: ghcr.io/constructorfabric/insight-identity-resolution
    tag: "" # MUST be set (e.g. "0.1.0")
    pullPolicy: IfNotPresent
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
  # MariaDB database the service owns.
  databaseName: "identity"
  # First-admin seed: on migrate,
  # this person UUID gets an active `admin` assignment in
  # `global.tenantDefaultId`, idempotently. The person row must already
  # exist in `persons` for that tenant. Empty string disables the runner.
  bootstrapAdminPersonId: ""
  # The ONE source trusted to say who exists: the persons-seed mints a person for
  # its accounts even with no address to match on, and the identities console
  # asks an operator to confirm each one. Empty (the default) mints from an
  # address only, and enabling it is not undone by disabling it — `persons` is
  # append-only. A `source_type` as the connectors emit it, and it must be a
  # source that can report deactivation, or leavers stay minted and queued. See
  # the identity DESIGN §4.1.
  rosterSourceType: ""
  # The umbrella generates `insight-identity-resolution-config` with every
  # APP__gears__identity_resolution__config__* env var filled in from the
  # auto-generated credentials (see templates/secrets.yaml). The subchart
  # consumes it via envFrom (overriding its mounted config ConfigMap).
  existingSecret: "insight-identity-resolution-config"
  # Scheduled persons-seed (#1690): a CronJob runs `identity-resolution seed`
  # daily to rebuild the identity org projection (persons / account_person_map
  # / org_chart) from ClickHouse identity_inputs — without it the projection
  # freezes at the last manual run and Team-view rosters go stale. Runs
  # serialize on a per-tenant MariaDB advisory lock; input guards abort on an
  # empty identity_inputs read or a tenant mismatch (`--force` overrides).
  # Manual run: kubectl create job --from=cronjob/<release>-identity-resolution-seed ...
  seed:
    enabled: true
    schedule: "*/15 * * * *" # freshness backstop; the pipeline + corrections publish on their own
  # Gateway-JWT verification (NGINX_BFF R1) — same wiring as analytics: the
  # oidc-authn-plugin resolves the authenticator's JWKS via OIDC discovery
  # over https on `issuer` and trusts its CA from the authn-tls cert Secret.
  gateway:
    issuer: 'https://{{ .Release.Name }}-authenticator.{{ .Release.Namespace }}.svc.cluster.local:8443'
    audience: "internal-services"
    caCertSecret: "insight-authenticator-authn-tls-cert"
    caCertPaths:
      - /etc/insight/authn-ca/ca.crt
# ─── Frontend (SPA) ──────────────────────────────────────────────────────
frontend:
  # Served through the gateway edge at "/". Set deploy=false for a backend-only
  # bring-up (the gateway resolves its front upstream lazily, so /api/* still
  # works without a frontend pod).
  deploy: true
  replicaCount: 1
  image:
    repository: ghcr.io/constructorfabric/insight-frontend
    tag: "" # MUST be set (e.g. "0.1.0")
    pullPolicy: IfNotPresent
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 200m, memory: 128Mi}
  # Standalone installs only — the SPA is served through the gateway's "/"
  # route; enabling both on one Gateway/host makes the routes collide.
  route:
    enabled: false
  sentry:
    # Sentry origin the SPA posts to, e.g. "https://sentry.example.com".
    # Empty leaves it out of the CSP, which blocks every event.
    connectSrc: ""
    # DSN the SPA reads from /config.js at load. Empty disables reporting.
    dsn: ""
  nav:
    # Navigation entries hidden on this install, read by the SPA from
    # /config.js. Typed paths, one per entry:
    #   - "zone:scorecard"                          (a rail zone)
    #   - "zone:aicost/item:idle-seats"             (a pane item)
    #   - "zone:directions/dir:sales"               (a whole direction)
    #   - "zone:directions/dir:dev/lens:git-output" (one lens, by URL slug)
    #   - "zone:person/section:git_output"          (a Person-zone section)
    #   - "metric:tasks.resolution_time"            (one metric, everywhere)
    #   - "metric:ai.*"                             (a whole metric family)
    # A metric path is not a menu entry: it gates the key itself, so the metric
    # reaches no tile, attention row, heatmap column, drilldown block or report
    # column, and no request asks for it.
    # Unknown paths are ignored (the browser console warns). Presentation
    # only — the API authorizes independently of what the menu shows.
    hide: []
    # Navigation entries this install marks as still in development — same
    # path forms as `hide`. This is the only source of planned navigation:
    # entries absent from this list are treated as live. Planned entries are
    # toggled by the viewer's "Show planned sections" switch. A path in both
    # lists is hidden.
    planned: []
