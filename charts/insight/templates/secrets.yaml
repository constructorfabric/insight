{{/*
==============================================================================
 Auto-generated credentials
==============================================================================
The umbrella provisions two (or three) Secrets per install:

  1. `insight-db-creds` — raw passwords for the external L2 infra
     (mariadb, redis, clickhouse). Keys match the field names the app
     services and init-DB Hook Jobs read.

  2. `insight-analytics-config` — pre-assembled env vars for the
     analytics Rust service, including a full
     `APP__gears__analytics__config__database_url` that embeds the
     MariaDB password.

  3. `insight-identity-resolution-config` — identical pattern for the
     identity-resolution service, emitted only when
     `identityResolution.deploy=true`.

`lookup` on first line makes this idempotent: on subsequent `helm upgrade`
runs we REUSE the existing Secret values, so pod restarts do not
invalidate credentials. Fresh install (no existing Secret) →
randAlphaNum 24 per field.

FIXED SECRET NAMES (no release-name prefix). One Insight install per
namespace — multi-tenant uses multiple namespaces, each with its own
`insight-db-creds`. This keeps values.yaml `passwordSecret.name`
references constant and matches the SRE single-namespace model.

Constructor Platform / BYO path: the customer creates `insight-db-creds`
with their own values BEFORE the first `helm install`. The chart auto-
detects BYO via absence of the `app.kubernetes.io/managed-by=Helm` label
and SKIPS emitting its own Secret template — Helm therefore never tries
to take ownership of the customer's Secret and the install no longer
fails with `invalid ownership metadata`. The chart still uses `lookup`
to read the BYO values for composing the per-service config Secrets
(`insight-analytics-config`, `insight-identity-resolution-config`).

If any of the four required keys is empty or missing on a BYO Secret,
the install FAILS FAST with a readable message instead of silently
writing an empty password.

To bypass auto-gen entirely (e.g. in an air-gapped env where lookup is
undesirable), set `credentials.autoGenerate: false` and pre-create the
Secret.
==============================================================================
*/}}

{{/*
First-login provisioning preconditions. Checked OUTSIDE the credential-mode
body below on purpose: `credentials.autoGenerate: false` is the documented
GitOps path, where this file emits nothing and the config Secret is composed by
deploy/gitops/scripts/compose-app-secrets.sh — a guard living inside that body
would fall silent in exactly the mode that most needs it.
*/}}
{{- if .Values.authenticator.oidc.provisionOnLogin }}
{{- if not ((.Values.global | default dict).tenantDefaultId) }}
{{- fail "authenticator.oidc.provisionOnLogin=true requires global.tenantDefaultId — it feeds tenant_default_id in insight-identity-resolution-config, which the login bootstrap checks the token's tenant against before writing. Without it identity refuses every provision, so first-login sign-in would still fail. Set global.tenantDefaultId, or leave provisionOnLogin off." }}
{{- end }}
{{- if not .Values.identityResolution.deploy }}
{{- fail "authenticator.oidc.provisionOnLogin=true requires identityResolution.deploy=true — the login bootstrap provisions by calling identity-resolution's internal route, and there is nothing to call when the service is not deployed." }}
{{- end }}
{{- end }}

{{- if .Values.credentials.autoGenerate }}

{{- /* Attempt lookup; on first install this returns nil. Helm 3 skips
       lookups during `--dry-run` by default, so dry-runs see this as a
       fresh install (the chart emits its own Secret template). */ -}}
{{- $dbSec := lookup "v1" "Secret" .Release.Namespace "insight-db-creds" -}}

{{- /* Detect BYO: the customer pre-created `insight-db-creds` with
       their own values and (deliberately or not) without Helm ownership
       labels. Skipping our Secret template emission for that case is
       what makes the documented BYO path actually work — otherwise
       Helm refuses to install with `invalid ownership metadata`. */ -}}
{{- $byo := false -}}
{{- if $dbSec -}}
  {{- $managedBy := "" -}}
  {{- if and $dbSec.metadata $dbSec.metadata.labels -}}
    {{- $managedBy = index $dbSec.metadata.labels "app.kubernetes.io/managed-by" -}}
  {{- end -}}
  {{- if ne $managedBy "Helm" -}}
    {{- $byo = true -}}
  {{- end -}}
{{- end -}}

{{- /* Per-key resolve: reuse existing (and complain loudly on empty)
       or generate fresh on first install. */ -}}
{{- $resolve := dict -}}
{{- $keys := list "clickhouse-password" "mariadb-password" "mariadb-root-password" "redis-password" -}}
{{- range $k := $keys -}}
  {{- $val := "" -}}
  {{- if $dbSec -}}
    {{- /* Existing Secret (BYO or Helm-managed) → must have every required key filled. */ -}}
    {{- $raw := index $dbSec.data $k -}}
    {{- if not $raw -}}
      {{- fail (printf "insight-db-creds exists but is missing key %q. Fill every required key (clickhouse-password, mariadb-password, mariadb-root-password, redis-password) or delete the Secret to re-generate." $k) -}}
    {{- end -}}
    {{- $val = $raw | b64dec -}}
    {{- if not $val -}}
      {{- fail (printf "insight-db-creds.%s is empty — refusing to install with a blank password. Populate the key or delete the Secret to re-generate." $k) -}}
    {{- end -}}
  {{- else -}}
    {{- /* First install → generate. */ -}}
    {{- $val = randAlphaNum 24 -}}
  {{- end -}}
  {{- $_ := set $resolve $k $val -}}
{{- end -}}

{{- $chPass    := index $resolve "clickhouse-password" -}}
{{- $mdbPass   := index $resolve "mariadb-password" -}}
{{- $mdbRoot   := index $resolve "mariadb-root-password" -}}
{{- $redisPass := index $resolve "redis-password" -}}

{{- /* Compose Redis URL: bitnami/redis sets a password by default in the
       umbrella-managed install, but external Redis (deploy=false with
       a stock-config server) may have auth disabled. Emit a userless URL
       in that case so the analytics client doesn't send `AUTH`. */ -}}
{{- $redisHost := include "insight.redis.host" . -}}
{{- $redisPort := include "insight.redis.port" . -}}
{{- $redisUrl  := printf "redis://%s:%v" $redisHost $redisPort -}}
{{- if $redisPass -}}
  {{- $redisUrl = printf "redis://:%s@%s:%v" $redisPass $redisHost $redisPort -}}
{{- end -}}

{{- /* BYO path: the operator owns `insight-db-creds` out-of-band. We
       skip emitting our template entirely so Helm doesn't try to take
       ownership and fail with `invalid ownership metadata`. The values
       have already been read into $chPass/$mdbPass/etc. via lookup
       above, so the per-service config Secrets below still get the
       correct passwords interpolated. */ -}}
{{- if not $byo }}
---
apiVersion: v1
kind: Secret
metadata:
  name: insight-db-creds
  labels:
    {{- include "insight.labels" . | nindent 4 }}
  annotations:
    # Helm-managed, but preserved across uninstalls so the next install
    # picks up the same credentials (avoids accidental data loss when
    # bundled CH/MariaDB PVCs survive a helm uninstall).
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  clickhouse-password:   {{ $chPass    | quote }}
  mariadb-password:      {{ $mdbPass   | quote }}
  mariadb-root-password: {{ $mdbRoot   | quote }}
  redis-password:        {{ $redisPass | quote }}
{{- end }}

---
apiVersion: v1
kind: Secret
metadata:
  name: insight-analytics-config
  labels:
    {{- include "insight.labels" . | nindent 4 }}
type: Opaque
stringData:
  # gears-rust host config. These APP__* env vars override the leaf values
  # in the mounted config YAML (the analytics chart's configmap.yaml);
  # the gears structure + auth_disabled host live there. Env prefix is
  # `APP__gears__analytics__config__*` (gear config key `analytics`,
  # toolkit Env::prefixed("APP__").split("__")).
  #
  # Full DSN, password interpolated from generated credentials. No silent
  # defaults — `required` on every field the operator MUST supply (username,
  # database). Passwords come from `insight-db-creds`.
  # user/password percent-encoded (urlquery) so operator credentials with
  # `:`/`@`/`/`/`%` produce a valid DSN — matches the identity DSN below.
  APP__gears__analytics__config__database_url: {{ printf "mysql://%s:%s@%s:%v/%s"
    (required "mariadb.username is required" .Values.mariadb.username | urlquery)
    ($mdbPass | urlquery)
    (include "insight.mariadb.host" .)
    (include "insight.mariadb.port" .)
    (include "insight.mariadb.database" .)
    | quote }}
  APP__gears__analytics__config__clickhouse_url:      {{ include "insight.clickhouse.url" . | quote }}
  APP__gears__analytics__config__clickhouse_database: {{ include "insight.clickhouse.database" . | quote }}
  APP__gears__analytics__config__clickhouse_user:     {{ required "clickhouse.username is required" .Values.clickhouse.username | quote }}
  APP__gears__analytics__config__clickhouse_password: {{ $chPass | quote }}
  APP__gears__analytics__config__redis_url:           {{ $redisUrl | quote }}
  APP__gears__analytics__config__identity_url:        {{ printf "http://%s:8082" (include "insight.identityResolution.host" .) | quote }}
  APP__gears__analytics__config__visibility_policy:   {{ .Values.identityResolution.visibilityPolicy | default "org_chart" | quote }}
  APP__gears__analytics__config__ai_assist__enabled:  {{ .Values.analytics.aiAssist.enabled | default false | quote }}
  APP__gears__analytics__config__ai_assist__admin_only: {{ .Values.analytics.aiAssist.adminOnly | quote }}
  APP__gears__analytics__config__ai_assist__model:    {{ .Values.analytics.aiAssist.model | default "claude-sonnet-5" | quote }}
  {{- if .Values.analytics.aiAssist.enabled }}
  APP__gears__analytics__config__ai_assist__token_encryption_key: {{ required "analytics.aiAssist.tokenEncryptionKey is required when analytics.aiAssist.enabled is true (openssl rand -base64 32)" .Values.analytics.aiAssist.tokenEncryptionKey | quote }}
  {{- with .Values.analytics.aiAssist.apiKey }}
  APP__gears__analytics__config__ai_assist__api_key: {{ . | quote }}
  {{- end }}
  {{- end }}

---
# Authenticator leaf config (NGINX_BFF). The gears-rust host reads these
# APP__gears__authenticator__config__* env vars, overriding the mounted config
# ConfigMap. Redis reuses the auto-generated password; the gateway_issuer is the
# authn-tls discovery FQDN (must equal the token `iss` and the cert SAN); the
# idp.* + redirect_uri come from `.Values.authenticator.oidc.*` (Keycloak in
# local). The signing keys are a SEPARATE mounted Secret (not here).
apiVersion: v1
kind: Secret
metadata:
  name: insight-authenticator-config
  labels:
    {{- include "insight.labels" . | nindent 4 }}
type: Opaque
stringData:
  APP__gears__authenticator__config__redis_url:     {{ $redisUrl | quote }}
  # The login-bootstrap resolve (GET /internal/persons/by-external-id /
  # by-email-override) exists on identity-resolution only
  # (constructorfabric/insight#1960). `insight.validate` (NOTES.txt) requires
  # identityResolution.deploy=true whenever the authenticator is installed,
  # so this is never a dangling host.
  APP__gears__authenticator__config__identity_url:  {{ printf "http://%s:8082" (include "insight.identityResolution.host" .) | quote }}
  # Discovery/JWKS issuer served by the authn-tls sidecar. Downstream verifiers
  # trust this over https; it is also the minted token `iss`.
  APP__gears__authenticator__config__gateway_issuer: {{ printf "https://%s-authenticator.%s.svc.cluster.local:8443" .Release.Name .Release.Namespace | quote }}
  # OIDC upstream (the real IdP; Keycloak for local). issuer_url must be
  # in-cluster reachable AND equal the id_token `iss`.
  APP__gears__authenticator__config__idp__issuer_url:    {{ tpl (required "authenticator.oidc.issuerUrl is required" .Values.authenticator.oidc.issuerUrl) . | quote }}
  APP__gears__authenticator__config__idp__client_id:     {{ .Values.authenticator.oidc.clientId | default "insight-authenticator" | quote }}
  APP__gears__authenticator__config__idp__client_secret: {{ .Values.authenticator.oidc.clientSecret | default "" | quote }}
  # Browser-facing callback the IdP redirects back to (through the gateway edge).
  APP__gears__authenticator__config__redirect_uri:       {{ tpl (required "authenticator.oidc.redirectUri is required" .Values.authenticator.oidc.redirectUri) . | quote }}
  # Tenant resolution. `tenant_claim` defaults to `tenant_id` and is FROZEN
  # there (ADR-0003: the broker always emits `tenant_id`); the value remains
  # configurable only for third-party consumers wiring a non-broker IdP
  # directly (e.g. Entra=`tid`). `default_tenant_id` is
  # the single-tenant fallback, used ONLY when that claim is absent (Okta and
  # other claim-less IdPs — see #1853). It is sourced from `global.tenantDefaultId`
  # — the same single source of truth the rest of the platform keys on — so a
  # single-tenant install (which already sets it, e.g. vz) needs no extra auth
  # config; multi-tenant installs leave `global.tenantDefaultId` unset and rely
  # on the per-user claim (fail closed when neither is present).
  APP__gears__authenticator__config__idp__tenant_claim:      {{ .Values.authenticator.oidc.tenantClaim | default "tenant_id" | quote }}
  APP__gears__authenticator__config__idp__default_tenant_id: {{ .Values.authenticator.oidc.defaultTenantId | default (default "" (default dict .Values.global).tenantDefaultId) | quote }}
  # The identity-resolution source_type this IdP is seeded under (e.g.
  # "ms-entra") — required; drives the login-bootstrap person lookup
  # (GET /internal/persons/by-external-id?source_type=...&external_id=...).
  APP__gears__authenticator__config__idp__source_type: {{ required "authenticator.oidc.sourceType is required" .Values.authenticator.oidc.sourceType | quote }}
  # id_token claim carrying the IdP's stable external user id for source_type
  # (Entra: "oid"; the generic OIDC "sub" is not the same directory-stable id).
  APP__gears__authenticator__config__idp__external_id_claim: {{ .Values.authenticator.oidc.externalIdClaim | default "sub" | quote }}
  # Provision a person on first login instead of refusing one the journal has
  # no binding for yet. Off by default: it widens who may ENTER, so it is a
  # deployment's policy to set. Identity still mints only for an account a
  # connector has already observed, so the roster keeps deciding who exists.
  APP__gears__authenticator__config__idp__provision_on_login: {{ .Values.authenticator.oidc.provisionOnLogin | default false | quote }}
  {{- with .Values.authenticator.oidc.scopes }}
  # Requested OIDC scopes (space-delimited; the gear splits on space/comma).
  # `offline_access` is what makes the IdP issue a refresh token — required for
  # the background refresher to keep the session alive past the access-token
  # lifetime (else NoRefreshTokenPolicy::Strict caps it there).
  APP__gears__authenticator__config__oidc_scopes:            {{ join " " . | quote }}
  {{- end }}
  # Service-token endpoint audience callers sign assertions for.
  APP__gears__authenticator__config__service_tokens__audience: {{ printf "http://%s-authenticator.%s.svc.cluster.local:8093/internal/token" .Release.Name .Release.Namespace | quote }}
  # Audit events to the platform Redpanda topic (step 10.8). Empty = disabled
  # (structured log only) — the global redpanda.brokers wires it when set.
  APP__gears__authenticator__config__audit__brokers: {{ .Values.redpanda.brokers | default "" | quote }}
  {{- if .Values.authenticator.overrideEnabled }}
  # `__override` view-as login (#1941) — dev/demo environments ONLY.
  APP__gears__authenticator__config__override_enabled: "true"
  {{- end }}
  {{- if .Values.authenticator.experimentsEnabled }}
  # Preview experiments `/exp/<name>` return path (#1973) — dev/demo stands ONLY.
  APP__gears__authenticator__config__experiments_enabled: "true"
  {{- end }}

{{- if .Values.identityResolution.deploy }}
{{- if and ((.Values.identityResolution.seed).enabled) (not ((.Values.global | default dict).tenantDefaultId)) (not ((.Values.identityResolution.seed).tenantDefaultId)) }}
{{- fail "identityResolution.seed.enabled=true requires a tenant: set global.tenantDefaultId (it feeds tenant_default_id in insight-identity-resolution-config) or identityResolution.seed.tenantDefaultId — the seed refuses to run without one, so every CronJob run would exit 1. Alternatively disable identityResolution.seed.enabled." }}
{{- end }}
---
# Identity Resolution (epic #1602) leaf config. Same gears-rust
# env-override convention as analytics (`APP__gears__<gear>__config__*`). The
# YAML gear name is `identity-resolution`; its environment-key segment is
# `identity_resolution`, which the toolkit remaps to the YAML name. Points at
# the MariaDB `identity` database it owns and migrates, and at the ClickHouse
# `identity.identity_inputs` seed input over the HTTP protocol (the shared
# insight-clickhouse client).
apiVersion: v1
kind: Secret
metadata:
  name: insight-identity-resolution-config
  labels:
    {{- include "insight.labels" . | nindent 4 }}
type: Opaque
stringData:
  APP__gears__identity_resolution__config__database_url: {{ printf "mysql://%s:%s@%s:%v/%s"
    (required "mariadb.username is required" .Values.mariadb.username | urlquery)
    ($mdbPass | urlquery)
    (include "insight.mariadb.host" .)
    (include "insight.mariadb.port" .)
    (required "identityResolution.databaseName is required" .Values.identityResolution.databaseName)
    | quote }}
  APP__gears__identity_resolution__config__clickhouse_url:      {{ include "insight.clickhouse.url" . | quote }}
  APP__gears__identity_resolution__config__clickhouse_database: {{ include "insight.clickhouse.database" . | quote }}
  APP__gears__identity_resolution__config__clickhouse_user:     {{ required "clickhouse.username is required" .Values.clickhouse.username | quote }}
  APP__gears__identity_resolution__config__clickhouse_password: {{ $chPass | quote }}
  {{- with (default "" (default dict .Values.global).tenantDefaultId) }}
  # Sourced from `global.tenantDefaultId` — same single source of truth the
  # rest of the platform keys on. Feeds the first-admin bootstrap in the
  # migrate initContainer.
  APP__gears__identity_resolution__config__tenant_default_id: {{ . | quote }}
  {{- end }}
  {{- with .Values.identityResolution.bootstrapAdminPersonId }}
  # First-admin seed for the OrgChart Visibility tables (#346 step 5): the
  # configured person UUID gets minted as `admin` in `person_roles`. Applied
  # by the migrate initContainer, idempotently. Empty value disables the
  # runner.
  APP__gears__identity_resolution__config__bootstrap_admin_person_id: {{ . | quote }}
  {{- end }}
{{- end }}

{{- end }}

{{- if and .Values.gitCliProxy.deploy .Values.credentials.autoGenerate }}
# 4. `insight-git-cli-proxy-config` — the service-to-service bearer token the
# proxy requires on every /v1 request.
#
# Generated like the database passwords above, and on the same terms: reconcile
# reads this Secret and injects the token into each opted-in connector's Airbyte
# source config, so the value never has to be re-derived anywhere an operator
# can see it.
#
# `autoGenerate: false` hands it to the operator, exactly as for
# `insight-db-creds`: the deployment and the reconcile CronJob both read the
# token from `gitCliProxy.existingSecret`, so a pre-created Secret carrying
# APP__gears__git_cli_proxy__config__proxy_token is the whole contract. That is
# also the only arrangement that works under `deploymentMode: gitops` — which
# the validator already pairs with `autoGenerate: false` — because `helm
# template` sees nothing from `lookup`, so a token generated here would differ
# on every sync while the deployed Airbyte sources kept the previous one.
{{- $existingProxy := (lookup "v1" "Secret" .Release.Namespace "insight-git-cli-proxy-config") }}
{{- $proxyToken := "" }}
{{- $proxyByo := false }}
{{- if $existingProxy }}
  {{- $managedBy := "" }}
  {{- if and $existingProxy.metadata $existingProxy.metadata.labels }}
    {{- $managedBy = index $existingProxy.metadata.labels "app.kubernetes.io/managed-by" }}
  {{- end }}
  {{- if ne $managedBy "Helm" }}
    {{- $proxyByo = true }}
  {{- end }}
  {{- $raw := index $existingProxy.data "APP__gears__git_cli_proxy__config__proxy_token" }}
  {{- if not $raw }}
    {{- fail "insight-git-cli-proxy-config exists but is missing key APP__gears__git_cli_proxy__config__proxy_token. Fill it, or delete the Secret to have one generated." }}
  {{- end }}
  {{- $proxyToken = ($raw | b64dec) }}
  {{- if not $proxyToken }}
    {{- fail "insight-git-cli-proxy-config.APP__gears__git_cli_proxy__config__proxy_token is empty — refusing to install with a blank bearer token. Populate the key, or delete the Secret to have one generated." }}
  {{- end }}
{{- else }}
  {{- /* Reached only under autoGenerate, so `lookup` is live and a generated
         token persists via the resource-policy below rather than rotating. */ -}}
  {{- $proxyToken = default "" .Values.gitCliProxy.proxyToken }}
  {{- if not $proxyToken }}
    {{- $proxyToken = randAlphaNum 32 }}
  {{- end }}
{{- end }}
{{- if not $proxyByo }}
---
apiVersion: v1
kind: Secret
metadata:
  name: insight-git-cli-proxy-config
  labels:
    {{- include "insight.labels" . | nindent 4 }}
  annotations:
    # Preserved across uninstall: the deployed Airbyte sources hold the same
    # value, so losing it breaks every git sync until the next reconcile tick.
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  APP__gears__git_cli_proxy__config__proxy_token: {{ $proxyToken | quote }}
{{- end }}
{{- end }}
