{{- if .Values.ingestion.templates.enabled }}
{{- /*
Argo parameter references ({{inputs.parameters.foo}}, {{steps.x.outputs.result}})
are escaped with Go-template raw-string literals (`…`) so Helm emits them
verbatim for Argo to resolve at workflow-run time. Helm-resolved values are
unescaped: they use `include` helpers and .Values references directly.

SECURITY:
  Argo substitutes parameter refs as LITERAL TEXT. Splicing them
  directly into script source enables arbitrary code execution by any
  submitter — e.g. a crafted connection_id can become valid Python.
  Mitigation: every workflow-time parameter is exposed via env vars
  (os.environ[...]); the trigger/poll entrypoints are static files baked
  into the toolbox image (src/ingestion/scripts/airbyte_sync_*.py).
*/}}
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: airbyte-sync
  labels:
    {{- include "insight.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingestion-template
spec:
  # Without this, manual `kubectl create -f` triggers fall back to the
  # namespace default SA and fail on `workflowtaskresults.argoproj.io`
  # RBAC (exit code 64). CronWorkflow callers also pin the same SA via
  # render templates.
  serviceAccountName: argo-workflow
  arguments:
    parameters:
      - name: connection_name
      - name: connector
        value: ""
      - name: tenant
        value: ""
      - name: airbyte_url
        value: {{ include "insight.airbyte.url" . | quote }}
  entrypoint: main
  templates:
    - name: main
      inputs:
        parameters:
          - name: connection_name
          - name: airbyte_url
      steps:
        - - name: resolve-connection-by-name
            template: resolve-connection-by-name
            arguments:
              parameters:
                - name: connection_name
                  value: {{ `"{{inputs.parameters.connection_name}}"` }}
                - name: airbyte_url
                  value: {{ `"{{inputs.parameters.airbyte_url}}"` }}
        - - name: sync
            template: sync
            arguments:
              parameters:
                - name: connection_id
                  value: {{ `"{{steps.resolve-connection-by-name.outputs.parameters.connection_id}}"` }}
                - name: airbyte_url
                  value: {{ `"{{inputs.parameters.airbyte_url}}"` }}

    - name: resolve-connection-by-name
      retryStrategy:
        limit: 3
        retryPolicy: OnError
        backoff:
          duration: "30s"
          factor: 2
          maxDuration: "5m"
      inputs:
        parameters:
          - name: connection_name
          - name: airbyte_url
      outputs:
        parameters:
          - name: connection_id
            valueFrom:
              path: /tmp/connection_id.txt
      script:
        image: {{ required "ingestion.toolboxImage is required when ingestion.templates.enabled=true" .Values.ingestion.toolboxImage | quote }}
        command: [bash]
        env:
          - name: AIRBYTE_URL
            value: {{ `"{{inputs.parameters.airbyte_url}}"` }}
          - name: INSIGHT_NAMESPACE
            value: {{ .Release.Namespace | quote }}
          # The auth Secret lives in Airbyte's namespace, which may differ
          # from the app's (issue #1885). lib/airbyte.sh reads it from
          # there via the K8s API; RBAC comes from airbyte-auth-rbac.yaml.
          - name: AIRBYTE_AUTH_SECRET_NAME
            value: {{ required "airbyte.authSecret.name is required" .Values.airbyte.authSecret.name | quote }}
          - name: AIRBYTE_AUTH_SECRET_NAMESPACE
            value: {{ include "insight.airbyte.namespace" . | quote }}
          - name: AIRBYTE_CLIENT_ID_KEY
            value: {{ default "instance-admin-client-id" .Values.airbyte.authSecret.clientIdKey | quote }}
          - name: AIRBYTE_CLIENT_SECRET_KEY
            value: {{ default "instance-admin-client-secret" .Values.airbyte.authSecret.clientSecretKey | quote }}
          - name: CONNECTORS_DIR
            value: "/ingestion/connectors"
        source: |
          set -euo pipefail
          source /ingestion/reconcile-connectors/lib/airbyte.sh
          source /ingestion/reconcile-connectors/lib/argo.sh
          name='{{ `{{inputs.parameters.connection_name}}` }}'
          if ! id="$(argo_resolve_connection_id_by_name "$name")"; then
            echo "ERROR: connection name not found: $name" >&2
            exit 1
          fi
          printf '%s' "$id" > /tmp/connection_id.txt

    - name: sync
      inputs:
        parameters:
          - name: connection_id
          - name: airbyte_url
      steps:
        - - name: trigger
            template: trigger-sync
            arguments:
              parameters:
                - name: connection_id
                  value: {{ `"{{inputs.parameters.connection_id}}"` }}
                - name: airbyte_url
                  value: {{ `"{{inputs.parameters.airbyte_url}}"` }}
        - - name: poll
            template: poll-job
            arguments:
              parameters:
                - name: job_id
                  value: {{ `"{{steps.trigger.outputs.result}}"` }}
                - name: airbyte_url
                  value: {{ `"{{inputs.parameters.airbyte_url}}"` }}

    - name: trigger-sync
      retryStrategy:
        limit: 3
        retryPolicy: OnError
        backoff:
          duration: "30s"
          factor: 2
          maxDuration: "5m"
      inputs:
        parameters:
          - name: connection_id
          - name: airbyte_url
      container:
        image: {{ required "ingestion.toolboxImage is required when ingestion.templates.enabled=true" .Values.ingestion.toolboxImage | quote }}
        # IfNotPresent so dev clusters use the locally-built toolbox image loaded
        # into Kind via `kind load docker-image` (same convention as dbt-run.yaml).
        imagePullPolicy: IfNotPresent
        command: [python3, /ingestion/scripts/airbyte_sync_trigger.py]
        env:
          # OAuth client_credentials against /api/v1/applications/token. The
          # legacy self-minted HMAC JWT is rejected by Airbyte 1.7+ (the
          # request hangs ~5 min then RST). Per ADR-0013, every workflow
          # API call goes through the same instance-admin OAuth flow that
          # reconcile uses.
          #
          # The credentials are read from the auth Secret via the K8s API,
          # not a secretKeyRef: the Secret lives in Airbyte's namespace,
          # which may differ from the app's (issue #1885), and secretKeyRef
          # cannot cross namespaces. RBAC: airbyte-auth-rbac.yaml grants the
          # workflow SA `get` on this one Secret.
          - name: AIRBYTE_AUTH_SECRET_NAME
            value: {{ required "airbyte.authSecret.name is required" .Values.airbyte.authSecret.name | quote }}
          - name: AIRBYTE_AUTH_SECRET_NAMESPACE
            value: {{ include "insight.airbyte.namespace" . | quote }}
          - name: AIRBYTE_CLIENT_ID_KEY
            value: {{ default "instance-admin-client-id" .Values.airbyte.authSecret.clientIdKey | quote }}
          - name: AIRBYTE_CLIENT_SECRET_KEY
            value: {{ default "instance-admin-client-secret" .Values.airbyte.authSecret.clientSecretKey | quote }}
          - name: CONNECTION_ID
            value: {{ `"{{inputs.parameters.connection_id}}"` }}
          - name: AIRBYTE_URL
            value: {{ `"{{inputs.parameters.airbyte_url}}"` }}
          # Install-wide log level knob from the platform ConfigMap (#3191).
          - name: INSIGHT_LOG_LEVEL
            valueFrom:
              configMapKeyRef:
                name: {{ .Release.Name }}-platform
                key: INSIGHT_LOG_LEVEL

    - name: poll-job
      retryStrategy:
        limit: 3
        retryPolicy: OnError
        backoff:
          duration: "30s"
          factor: 2
          maxDuration: "5m"
      inputs:
        parameters:
          - name: job_id
          - name: airbyte_url
      # 48h absolute backstop only — the poll entrypoint enforces a
      # progress-based (idle) timeout, so a legitimate long sync
      # (youtrack issue_history initial full-refresh, hubspot archived
      # streams) can run as long as it is actually emitting records
      # without tripping a wall-clock cap. This number is the runaway
      # ceiling: if the polling logic itself wedges or Airbyte returns
      # bytes-emitting churn forever, k8s still kills the pod.
      activeDeadlineSeconds: 172800
      container:
        image: {{ required "ingestion.toolboxImage is required when ingestion.templates.enabled=true" .Values.ingestion.toolboxImage | quote }}
        # IfNotPresent so dev clusters use the locally-built toolbox image loaded
        # into Kind via `kind load docker-image` (same convention as dbt-run.yaml).
        imagePullPolicy: IfNotPresent
        command: [python3, /ingestion/scripts/airbyte_sync_poll.py]
        env:
          # Same K8s-API credential read as trigger-sync (see the comment
          # there): the auth Secret may live in Airbyte's own namespace.
          # Read per poll iteration, so a rotated credential is picked up
          # mid-sync without restarting the watchdog.
          - name: AIRBYTE_AUTH_SECRET_NAME
            value: {{ required "airbyte.authSecret.name is required" .Values.airbyte.authSecret.name | quote }}
          - name: AIRBYTE_AUTH_SECRET_NAMESPACE
            value: {{ include "insight.airbyte.namespace" . | quote }}
          - name: AIRBYTE_CLIENT_ID_KEY
            value: {{ default "instance-admin-client-id" .Values.airbyte.authSecret.clientIdKey | quote }}
          - name: AIRBYTE_CLIENT_SECRET_KEY
            value: {{ default "instance-admin-client-secret" .Values.airbyte.authSecret.clientSecretKey | quote }}
          - name: JOB_ID
            value: {{ `"{{inputs.parameters.job_id}}"` }}
          - name: AIRBYTE_URL
            value: {{ `"{{inputs.parameters.airbyte_url}}"` }}
          # Progress-watchdog knobs. The poll loop tracks a tuple of
          # (status, bytesEmitted, recordsEmitted, stateMessagesEmitted)
          # on the latest attempt. Any change resets the idle timer;
          # no change for IDLE_THRESHOLD_SECONDS → exit with a clear
          # "no progress" failure (distinct from the SIGTERM that
          # activeDeadlineSeconds produces). Override per-env via
          # Helm values if a tenant has unusually slow paginated
          # streams (e.g. heavily-rate-limited APIs).
          - name: POLL_INTERVAL_SECONDS
            value: {{ default 30  .Values.ingestion.airbyteSync.pollIntervalSeconds | quote }}
          - name: IDLE_THRESHOLD_SECONDS
            value: {{ default 1800 .Values.ingestion.airbyteSync.idleThresholdSeconds | quote }}
          # Install-wide log level knob from the platform ConfigMap (#3191).
          - name: INSIGHT_LOG_LEVEL
            valueFrom:
              configMapKeyRef:
                name: {{ .Release.Name }}-platform
                key: INSIGHT_LOG_LEVEL
{{- end }}
