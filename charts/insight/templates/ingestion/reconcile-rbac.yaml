{{- if .Values.ingestion.templates.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "insight.fullname" . }}-reconcile
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: reconcile-loop
    {{- include "insight.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "insight.fullname" . }}-reconcile
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: reconcile-loop
    {{- include "insight.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets, configmaps]
    verbs: [get, list, watch]
  - apiGroups: ["onepassword.com"]
    resources: [onepassworditems]
    verbs: [get, list, watch]
  - apiGroups: ["argoproj.io"]
    resources: [workflows, cronworkflows]
    verbs: [get, list, create, delete, patch, update]
  # workflows/status mutation is owned by the workflow-controller; reconcile only reads it
  - apiGroups: ["argoproj.io"]
    resources: [workflows/status]
    verbs: [get, list]
  # Argo executor (v3.4+) writes step results via the pod SA. Without
  # this rule, every workflow step under serviceAccountName=insight-
  # reconcile fails with exit 64 / `workflowtaskresults … is forbidden`
  # before reaching the user container.
  - apiGroups: ["argoproj.io"]
    resources: [workflowtaskresults]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "insight.fullname" . }}-reconcile
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: reconcile-loop
    {{- include "insight.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "insight.fullname" . }}-reconcile
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "insight.fullname" . }}-reconcile
{{- if ne (include "insight.airbyte.namespace" .) .Release.Namespace }}
---
# Split-namespace envs only: airbyte-auth-secrets lives in a different
# namespace than this release (see airbyte.namespace in values.yaml).
# reconcile's ab_get_token needs `secrets get` there to mint an Airbyte
# API token — the Role above only grants it in .Release.Namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "insight.fullname" . }}-reconcile-airbyte-auth
  namespace: {{ include "insight.airbyte.namespace" . }}
  labels:
    app.kubernetes.io/component: reconcile-loop
    {{- include "insight.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ .Values.airbyte.authSecret.name }}]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "insight.fullname" . }}-reconcile-airbyte-auth
  namespace: {{ include "insight.airbyte.namespace" . }}
  labels:
    app.kubernetes.io/component: reconcile-loop
    {{- include "insight.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "insight.fullname" . }}-reconcile
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "insight.fullname" . }}-reconcile-airbyte-auth
{{- end }}
{{- end }}
