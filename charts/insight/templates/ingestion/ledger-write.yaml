{{- if .Values.ingestion.templates.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: ledger-write
  labels:
    {{- include "insight.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingestion-template
spec:
  serviceAccountName: argo-workflow
  entrypoint: write-tolerated
  templates:
    # INVARIANT: the only entry point callers use. A pod-level failure of the
    # write — an image it cannot pull, an eviction, the deadline — must not
    # reach the run being recorded, and `continueOn` is legal in `steps` while a
    # `depends` DAG rejects it. With a failing inner step this template still
    # completes, both as a DAG task and as an exit handler.
    - name: write-tolerated
      inputs:
        parameters:
          - name: event
          - name: connector
            default: ""  # RULE-DEFAULTS-OK: forwarded verbatim to `write`
          - name: run_id
          - name: job_id
            default: ""  # RULE-DEFAULTS-OK: as connector
          - name: status
          - name: claim
            default: ""  # RULE-DEFAULTS-OK: as connector
          - name: step
            default: ""  # RULE-DEFAULTS-OK: as connector
          - name: duration_ms
            default: "0"  # RULE-DEFAULTS-OK: as connector
          - name: duration_seconds
            default: ""  # RULE-DEFAULTS-OK: as connector
          - name: records_moved
            default: "0"  # RULE-DEFAULTS-OK: as connector
          - name: failures_json
            default: ""  # RULE-DEFAULTS-OK: as connector
          - name: window_start
            default: ""  # RULE-DEFAULTS-OK: as connector
      steps:
        - - name: write
            template: write
            continueOn: { failed: true, error: true }
            arguments:
              parameters:
                - name: event
                  value: {{ `"{{inputs.parameters.event}}"` }}
                - name: connector
                  value: {{ `"{{inputs.parameters.connector}}"` }}
                - name: run_id
                  value: {{ `"{{inputs.parameters.run_id}}"` }}
                - name: job_id
                  value: {{ `"{{inputs.parameters.job_id}}"` }}
                - name: status
                  value: {{ `"{{inputs.parameters.status}}"` }}
                - name: claim
                  value: {{ `"{{inputs.parameters.claim}}"` }}
                - name: step
                  value: {{ `"{{inputs.parameters.step}}"` }}
                - name: duration_ms
                  value: {{ `"{{inputs.parameters.duration_ms}}"` }}
                - name: duration_seconds
                  value: {{ `"{{inputs.parameters.duration_seconds}}"` }}
                - name: records_moved
                  value: {{ `"{{inputs.parameters.records_moved}}"` }}
                - name: failures_json
                  value: {{ `"{{inputs.parameters.failures_json}}"` }}
                - name: window_start
                  value: {{ `"{{inputs.parameters.window_start}}"` }}

    # Records one row in the ingestion run ledger (connector-health spec §3.2,
    # Run Recorder). Callers reach it through `write-tolerated`, never directly.
    - name: write
      # SECURITY:
      #  Argo substitutes parameter refs as LITERAL TEXT at run time — splicing
      #  them into Python source is a command-injection sink, and
      #  `workflow.failures` in particular arrives as quoted JSON. Every
      #  parameter is passed via env and read with os.environ.
      inputs:
        parameters:
          - name: event
          - name: connector
            default: ""  # RULE-DEFAULTS-OK: empty on the sweep-marker row, which is instance-wide
          - name: run_id
          - name: job_id
            default: ""  # RULE-DEFAULTS-OK: empty on run-boundary rows, which name no mover job
          - name: status
          - name: claim
            default: ""  # RULE-DEFAULTS-OK: empty on non-sync rows, which carry no trigger question
          - name: step
            default: ""  # RULE-DEFAULTS-OK: derived from failures_json when a run failed
          - name: duration_ms
            default: "0"  # RULE-DEFAULTS-OK: rows that report no elapsed time
          # Argo reports a workflow's elapsed time in fractional seconds. Callers
          # that have that rather than milliseconds pass it here.
          - name: duration_seconds
            default: ""  # RULE-DEFAULTS-OK: callers that already have milliseconds
          - name: records_moved
            default: "0"  # RULE-DEFAULTS-OK: as duration_ms

          # Raw workflow-failures JSON, as the exit handler receives it. Read
          # only when `step` is empty: the first failed node's displayName is
          # the step the run reached.
          - name: failures_json
            default: ""  # RULE-DEFAULTS-OK: empty on a run that did not fail
          # Delivery measurement (spec FR-3). When set, the row carries
          # `rows_landed` counted over this connector's own bronze streams for
          # rows stamped inside the window. Only the pipeline sets it — the
          # sweep cannot, its window has passed.
          - name: window_start
            default: ""  # RULE-DEFAULTS-OK: no measurement requested
          - name: clickhouse_url
            default: {{ include "insight.clickhouse.url" . | quote }}
          - name: clickhouse_user
            default: {{ required "clickhouse.username is required" .Values.clickhouse.username | quote }}
      # A ledger row is one small insert plus at most one count; anything
      # longer than this is a stuck warehouse, and the run must not wait.
      activeDeadlineSeconds: 300
      script:
        image: python:3.12-alpine
        command: [python3]
        env:
          - name: CLICKHOUSE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ required "clickhouse.passwordSecret.name is required" .Values.clickhouse.passwordSecret.name | quote }}
                key:  {{ required "clickhouse.passwordSecret.key is required"  .Values.clickhouse.passwordSecret.key  | quote }}
          - name: CLICKHOUSE_URL
            value: {{ `"{{inputs.parameters.clickhouse_url}}"` }}
          - name: CLICKHOUSE_USER
            value: {{ `"{{inputs.parameters.clickhouse_user}}"` }}
          - name: LEDGER_EVENT
            value: {{ `"{{inputs.parameters.event}}"` }}
          - name: LEDGER_CONNECTOR
            value: {{ `"{{inputs.parameters.connector}}"` }}
          - name: LEDGER_RUN_ID
            value: {{ `"{{inputs.parameters.run_id}}"` }}
          - name: LEDGER_JOB_ID
            value: {{ `"{{inputs.parameters.job_id}}"` }}
          - name: LEDGER_STATUS
            value: {{ `"{{inputs.parameters.status}}"` }}
          - name: LEDGER_CLAIM
            value: {{ `"{{inputs.parameters.claim}}"` }}
          - name: LEDGER_STEP
            value: {{ `"{{inputs.parameters.step}}"` }}
          - name: LEDGER_DURATION_MS
            value: {{ `"{{inputs.parameters.duration_ms}}"` }}
          - name: LEDGER_DURATION_SECONDS
            value: {{ `"{{inputs.parameters.duration_seconds}}"` }}
          - name: LEDGER_RECORDS_MOVED
            value: {{ `"{{inputs.parameters.records_moved}}"` }}
          - name: LEDGER_FAILURES_JSON
            value: {{ `"{{inputs.parameters.failures_json}}"` }}
          - name: LEDGER_WINDOW_START
            value: {{ `"{{inputs.parameters.window_start}}"` }}
        source: |
          import datetime
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          LEDGER = "ingestion_runs.pipeline_events"
          STAMP = "_airbyte_extracted_at"
          # The workflow layer's outcome vocabulary, mapped to the ledger's at
          # this boundary so no reader has to know both.
          STATUS_FROM_WORKFLOW = {
              "Succeeded": "ok",
              "Failed": "failed",
              "Error": "failed",
              "Running": "running",
              "Pending": "running",
          }
          TIMEOUT_SECONDS = 60
          # A window count over one connector's schema reads one narrow column;
          # bronze sorts by its dedup key, so the window does not prune. That is
          # affordable here and only here: one schema, inside a job that just
          # spent far longer syncing.
          MEASURE_TIMEOUT_SECONDS = 120


          def log(event, **fields):
              print(json.dumps({
                  "ts": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                  "level": fields.pop("level", "info"),
                  "component": "ledger-write",
                  "event": event,
                  **fields,
              }), flush=True)


          def query(sql, timeout):
              url = os.environ["CLICKHOUSE_URL"].rstrip("/") + "/"
              req = urllib.request.Request(
                  url,
                  data=sql.encode(),
                  headers={
                      "X-ClickHouse-User": os.environ["CLICKHOUSE_USER"],
                      "X-ClickHouse-Key": os.environ["CLICKHOUSE_PASSWORD"],
                  },
              )
              with urllib.request.urlopen(req, timeout=timeout) as resp:
                  return resp.read().decode().strip()


          def quote(value):
              """Single-quoted SQL literal. Values reach here from env, never spliced."""
              return "'" + str(value).replace("\\", "\\\\").replace("'", "\\'") + "'"


          def normalized_status(raw):
              return STATUS_FROM_WORKFLOW.get(raw, raw)


          def started_at_sql():
              """When the reported thing started, not when this row was written.

              The caller passes the real start where it has one; otherwise the
              write time is the closest fact available, and the row is written at
              the moment the event happened.
              """
              raw = os.environ.get("LEDGER_WINDOW_START", "")
              if not raw:
                  return "now64(3)"
              try:
                  return f"toDateTime64({window_start_epoch(raw)}, 3)"
              except (ValueError, TypeError):
                  return "now64(3)"


          def elapsed_ms():
              seconds = os.environ.get("LEDGER_DURATION_SECONDS", "")
              if seconds:
                  return int(float(seconds) * 1000)
              return int(os.environ.get("LEDGER_DURATION_MS") or 0)


          def window_start_epoch(raw):
              """Epoch seconds from either an epoch or the workflow layer's RFC3339."""
              if raw.isdigit():
                  return int(raw)
              return int(datetime.datetime.fromisoformat(raw).timestamp())


          def bronze_schema(connector):
              return "bronze_" + connector.replace("-", "_")


          def without_attempt(step):
              """`poll(0)` -> `poll`: a retry attempt is the step, not a step.

              The earliest node to finish is the innermost retry attempt, so the
              raw name carries an attempt index that changes between otherwise
              identical failures.
              """
              return step.split("(", 1)[0] if step.endswith(")") else step


          def is_plain_identifier(name):
              return bool(name) and all(c.isalnum() or c == "_" for c in name)


          def failed_step(failures_json):
              """The step whose failure caused the run to fail.

              INVARIANT: chosen by earliest finish, not by position. The payload
              is built by iterating a Go map, so its order is random, and one
              failure yields several nodes — the retry node, its attempt, and
              every DAG that inherited the phase. The earliest to finish is the
              cause; picking the first entry recorded a different step for two
              identical runs.

              The workflow-level node repeats the workflow name and names no
              step, so it is skipped.
              """
              if not failures_json:
                  return ""
              payload = json.loads(failures_json)
              if isinstance(payload, str):
                  payload = json.loads(payload)
              # A run with no failures marshals to JSON `null`, which is every
              # successful run — not something to warn about.
              if not payload:
                  return ""

              workflow_name = os.environ.get("LEDGER_RUN_ID", "")
              named = [
                  node
                  for node in payload
                  if node.get("displayName") and node.get("displayName") != workflow_name
              ]
              if not named:
                  return ""
              named.sort(key=lambda node: (node.get("finishedAt") or "", node.get("displayName")))
              return without_attempt(named[0]["displayName"])


          def rows_landed(connector, window_start):
              """Rows this sync delivered: stamped inside its own window.

              Exact at this moment — the window's rows are the newest versions,
              so no merge can have collapsed them yet.
              """
              schema = bronze_schema(connector)
              # SAFETY: names are spliced into a backticked identifier, not
              # bound, so anything that is not a plain identifier is refused
              # rather than quoted — the schema as much as the stream.
              if not is_plain_identifier(schema):
                  return None
              streams = query(
                  "SELECT name FROM system.tables WHERE database = "
                  f"{quote(schema)} AND engine LIKE '%MergeTree' "
                  "AND name NOT LIKE '.inner%' FORMAT TSVRaw",
                  TIMEOUT_SECONDS,
              )
              names = [s for s in streams.split("\n") if s]
              if not names:
                  return None

              window = (
                  f"{STAMP} >= toDateTime64({window_start_epoch(window_start)}, 3) "
                  f"AND {STAMP} <= now64(3)"
              )
              counts = " UNION ALL ".join(
                  f"SELECT count() AS n FROM `{schema}`.`{name}` WHERE {window}"
                  for name in names
                  if is_plain_identifier(name)
              )
              if not counts:
                  return None

              total = query(f"SELECT sum(n) FROM ({counts}) FORMAT TSVRaw", MEASURE_TIMEOUT_SECONDS)
              return int(total)


          def measured_rows():
              """None whenever the measurement was not asked for or did not work.

              A failed measurement is honest absence, never a fabricated zero.
              """
              connector = os.environ.get("LEDGER_CONNECTOR", "")
              window_start = os.environ.get("LEDGER_WINDOW_START", "")
              if not connector or not window_start:
                  return None
              try:
                  return rows_landed(connector, window_start)
              except Exception as error:
                  log("ledger.measure_failed", level="warning", error=repr(error))
                  return None


          def main():
              landed = measured_rows()
              step = os.environ.get("LEDGER_STEP", "")
              if not step:
                  try:
                      step = failed_step(os.environ.get("LEDGER_FAILURES_JSON", ""))
                  except Exception as error:
                      log("ledger.step_parse_failed", level="warning", error=repr(error))
                      step = ""

              columns = {
                  "run_id": quote(os.environ.get("LEDGER_RUN_ID", "")),
                  "job_id": quote(os.environ.get("LEDGER_JOB_ID", "")),
                  "connector": quote(os.environ.get("LEDGER_CONNECTOR", "")),
                  "event": quote(os.environ["LEDGER_EVENT"]),
                  "status": quote(normalized_status(os.environ.get("LEDGER_STATUS", ""))),
                  "origin": quote("pipeline"),
                  "claim": quote(os.environ.get("LEDGER_CLAIM", "")),
                  "step": quote(step),
                  "started_at": started_at_sql(),
                  "duration_ms": str(elapsed_ms()),
                  "records_moved": str(int(os.environ.get("LEDGER_RECORDS_MOVED") or 0)),
                  "rows_landed": "NULL" if landed is None else str(landed),
              }

              sql = (
                  f"INSERT INTO {LEDGER} ({', '.join(columns)}) "
                  f"VALUES ({', '.join(columns.values())})"
              )
              query(sql, TIMEOUT_SECONDS)
              log(
                  "ledger.recorded",
                  ledger_event=os.environ["LEDGER_EVENT"],
                  connector=os.environ.get("LEDGER_CONNECTOR", ""),
                  step=step,
                  rows_landed=landed,
              )


          try:
              main()
          except Exception as error:
              # SAFETY: the run being recorded must not fail because recording did.
              log("ledger.write_failed", level="error", error=repr(error))
          sys.exit(0)
{{- end }}
