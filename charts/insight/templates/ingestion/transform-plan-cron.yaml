{{- if and .Values.ingestion.templates.enabled .Values.ingestion.transformPlan.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: {{ include "insight.fullname" . }}-transform-plan
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: transform-plan
    {{- include "insight.labels" . | nindent 4 }}
    {{- with .Values.ingestion.reconcile.argoInstanceId }}
    workflows.argoproj.io/controller-instanceid: {{ . | quote }}
    {{- end }}
spec:
  schedules:
    - {{ required "ingestion.transformPlan.schedule is required" .Values.ingestion.transformPlan.schedule | quote }}
  timezone: UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  workflowSpec:
    serviceAccountName: argo-workflow
    entrypoint: run
    activeDeadlineSeconds: 900
    ttlStrategy:
      secondsAfterCompletion: 1800
      secondsAfterSuccess: 600
      secondsAfterFailure: 3600
    podGC:
      strategy: OnPodCompletion
    {{- with .Values.global.imagePullSecrets }}
    imagePullSecrets:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    templates:
      - name: run
        container:
          image: {{ required "ingestion.toolboxImage is required when ingestion.templates.enabled=true" .Values.ingestion.toolboxImage | quote }}
          command: [bash, /ingestion/reconcile-connectors/transform-plan.sh]
          env:
            - name: RECONCILE_RUN_ID
              value: {{ `"{{workflow.name}}"` }}
            - name: INSIGHT_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-platform
                  key: INSIGHT_LOG_LEVEL
            - name: INSIGHT_VERSION
              value: {{ .Chart.Version | quote }}
            - name: CONNECTORS_DIR
              value: "/ingestion/connectors"
            - name: RECONCILE_DEST_CLICKHOUSE_HOST
              value: {{ include "insight.clickhouse.fqdn" . | quote }}
            - name: RECONCILE_DEST_CLICKHOUSE_PORT
              value: {{ include "insight.clickhouse.port" . | quote }}
            - name: RECONCILE_DEST_CLICKHOUSE_PROTOCOL
              value: {{ include "insight.clickhouse.protocol" . | quote }}
            - name: RECONCILE_DEST_CLICKHOUSE_DATABASE
              value: {{ include "insight.clickhouse.database" . | quote }}
            - name: RECONCILE_DEST_CLICKHOUSE_USERNAME
              value: {{ required "clickhouse.username is required" .Values.clickhouse.username | quote }}
            - name: RECONCILE_DEST_CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "clickhouse.passwordSecret.name is required" .Values.clickhouse.passwordSecret.name | quote }}
                  key: {{ required "clickhouse.passwordSecret.key is required" .Values.clickhouse.passwordSecret.key | quote }}
            - name: RECONCILE_DEST_CLICKHOUSE_CLUSTER_MODE
              value: {{ include "insight.clickhouse.clusterMode" . | quote }}
            - name: RECONCILE_DEST_CLICKHOUSE_CLUSTER_NAME
              value: {{ include "insight.clickhouse.clusterName" . | quote }}
          resources:
            {{- toYaml .Values.ingestion.transformPlan.resources | nindent 12 }}
{{- end }}
