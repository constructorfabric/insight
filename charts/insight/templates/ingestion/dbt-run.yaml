{{- if .Values.ingestion.templates.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: dbt-run
  labels:
    {{- include "insight.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingestion-template
spec:
  serviceAccountName: argo-workflow
  entrypoint: run
  templates:
    - name: run
      # SECURITY:
      #  Argo substitutes parameter refs as LITERAL TEXT at render time —
      #  splicing them into shell, Python, or YAML source is a command-
      #  injection sink. We pass every parameter via env vars and reference
      #  them as `"$ENV_VAR"` in the shell, which is not parsed as code by
      #  bash. See ingestion-templates SECURITY notes in DESIGN.md.
      inputs:
        parameters:
          - name: dbt_select
          # Space-separated selectors to subtract from the selection (same
          # grammar as dbt_select). The pipeline uses it to keep a graph-walk
          # step (`tag:X+`) from rebuilding what its staging step just built.
          - name: dbt_exclude
            default: ""  # RULE-DEFAULTS-OK: empty means "exclude nothing"
          # One-shot full-refresh flag per ADR-0015. Set to "true" by the
          # reconcile sync-trigger when a connector's major version was
          # bumped this run; scoped via dbt_select to that connector's
          # downstream models only (no cross-connector cascade). Empty/
          # "false" runs incremental.
          - name: dbt_full_refresh
            default: "false"
          # Operator-pinned values from umbrella chart. Submitter may override
          # per-call but typically just submits and gets these defaults baked in
          # at chart-render time. `insight.<dep>.host/port` helpers resolve the
          # operator-supplied external L2 host/port.
          - name: toolbox_image
            default: {{ required "ingestion.toolboxImage is required when ingestion.templates.enabled=true" .Values.ingestion.toolboxImage | quote }}
          - name: clickhouse_host
            default: {{ include "insight.clickhouse.fqdn" . | quote }}
          - name: clickhouse_port
            default: {{ include "insight.clickhouse.port" . | quote }}
          - name: clickhouse_user
            default: {{ required "clickhouse.username is required" .Values.clickhouse.username | quote }}
      # 2h. Incremental dbt runs finish in seconds, but full-refresh
      # (triggered manually or by a future major-bump dispatch per
      # PR #456 / ADR-0015) can rebuild the entire staging+silver
      # layer for a connector. 30m caps were observed killing the
      # job on hubspot full-refresh.
      activeDeadlineSeconds: 7200
      script:
        image: {{ `"{{inputs.parameters.toolbox_image}}"` }}
        # IfNotPresent so dev clusters use the locally-built `insight-toolbox:local`
        # loaded into Kind via `kind load docker-image` (same convention as
        # tt-enrich-jira-run.yaml). Production overlays should set their own
        # registry-pinned tag in `ingestion.toolboxImage` and rely on registry pulls.
        imagePullPolicy: IfNotPresent
        command: [bash]
        env:
          - name: CLICKHOUSE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ required "clickhouse.passwordSecret.name is required" .Values.clickhouse.passwordSecret.name | quote }}
                key:  {{ required "clickhouse.passwordSecret.key is required"  .Values.clickhouse.passwordSecret.key  | quote }}
          - name: DBT_SELECT
            value: {{ `"{{inputs.parameters.dbt_select}}"` }}
          - name: DBT_EXCLUDE
            value: {{ `"{{inputs.parameters.dbt_exclude}}"` }}
          - name: DBT_FULL_REFRESH
            value: {{ `"{{inputs.parameters.dbt_full_refresh}}"` }}
          - name: CLICKHOUSE_HOST
            value: {{ `"{{inputs.parameters.clickhouse_host}}"` }}
          - name: CLICKHOUSE_PORT
            value: {{ `"{{inputs.parameters.clickhouse_port}}"` }}
          - name: CLICKHOUSE_USER
            value: {{ `"{{inputs.parameters.clickhouse_user}}"` }}
          # Install-wide log level knob from the platform ConfigMap (#3191).
          - name: INSIGHT_LOG_LEVEL
            valueFrom:
              configMapKeyRef:
                name: {{ .Release.Name }}-platform
                key: INSIGHT_LOG_LEVEL
        source: |
          set -euo pipefail
          cd /ingestion/dbt
          # Writes profiles.yml from env vars without ever interpolating user
          # input into YAML or shell text — closes the parameter-injection sink
          # that splicing into a heredoc would open.
          python3 /ingestion/scripts/dbt_profiles.py --correlated-subqueries
          # `dbt run --select ""` matches NOTHING (not "all models") —
          # ${VAR:+...} drops the flag entirely when DBT_SELECT is empty
          # so manual triggers without the parameter run all models.
          # DBT_FULL_REFRESH="true" appends --full-refresh per ADR-0015;
          # any other value (false / empty) runs incremental.
          # --log-format json: structured per-model output for the log
          # collector (Alloy maps dbt's nested info.level/info.name).
          # The if/else (instead of `dbt ...; RC=$?`) keeps the terminal
          # dbt.completed event below alive under `set -e`.
          T0=$(date +%s); RC=0
          # `dbt run` exits 0 when --select resolves to no nodes ("Nothing to
          # do"), so a stale or misspelled selector reports success while the
          # connector's rows never leave bronze — silently, under a green
          # workflow (#2362). Resolve the selection first: `dbt ls` prints one
          # line per node and exits 0 whether or not anything matched, so empty
          # output is the unambiguous signal and a non-zero exit is a genuine
          # failure to resolve. An empty DBT_SELECT is deliberately left alone —
          # it means "run everything" for manual triggers.
          # Resolved WITHOUT --exclude on purpose: the guard judges the
          # SELECTOR, and a selection an earlier step already covered (a
          # roster-only connector's models ARE the excluded ones) would
          # otherwise be indistinguishable from a typo. The run below then
          # exits 0 on the empty remainder, per the note above.
          if [[ -n "${DBT_SELECT:-}" ]]; then
            LS_RC=0
            SELECTED="$(dbt --quiet ls --profiles-dir . --resource-type model --select "$DBT_SELECT")" || LS_RC=$?
            if [[ "$LS_RC" -ne 0 ]]; then
              echo "ERROR: could not resolve dbt selector '${DBT_SELECT}' (dbt ls exited ${LS_RC})" >&2
              RC="$LS_RC"
            elif [[ -z "$SELECTED" ]]; then
              echo "ERROR: dbt selector '${DBT_SELECT}' matches no models — refusing to report success for a transform that runs nothing. The pipeline derives this selector as tag:<connector>+, so the connector's models must carry a tag equal to its slug (#2362)." >&2
              RC=1
            fi
          fi
          if [[ "$RC" -eq 0 ]]; then
            if [[ "${DBT_FULL_REFRESH:-false}" == "true" ]]; then
              dbt run --profiles-dir . --log-format json --log-level "${INSIGHT_LOG_LEVEL:-info}" --full-refresh ${DBT_SELECT:+--select "$DBT_SELECT"} ${DBT_EXCLUDE:+--exclude "$DBT_EXCLUDE"} || RC=$?
            else
              dbt run --profiles-dir . --log-format json --log-level "${INSIGHT_LOG_LEVEL:-info}" ${DBT_SELECT:+--select "$DBT_SELECT"} ${DBT_EXCLUDE:+--exclude "$DBT_EXCLUDE"} || RC=$?
            fi
          fi
          # Lifecycle event via the shared logger (agreed line shape, #3191);
          # python3 keeps the JSON safe against whatever rides in DBT_SELECT.
          DBT_RC="$RC" DBT_DURATION_MS=$(( ($(date +%s) - T0) * 1000 )) \
            python3 /ingestion/scripts/dbt_completed.py
          exit "$RC"
{{- end }}
