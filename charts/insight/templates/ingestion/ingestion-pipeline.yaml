{{- if .Values.ingestion.templates.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: ingestion-pipeline
  labels:
    {{- include "insight.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingestion-template
spec:
  serviceAccountName: argo-workflow
  entrypoint: pipeline
  # Workflow-scope so the exit handler resolves them too. Declared with empty
  # defaults because a submitter that predates the run ledger passes neither,
  # and an unresolved reference in onExit would fail the run it only observes.
  arguments:
    parameters:
      - name: connector
        value: ""
      - name: tenant_id
        value: ""
  # INVARIANT: this handler is the only writer that sees a run which died
  # before its first step produced anything — proven on a stand to fire through
  # workflowTemplateRef, including on a failure in the first task. The ledger
  # row it writes is what makes such a run visible at all (spec FR-1).
  onExit: record-run-finished
  templates:
    - name: pipeline
      # Connection-specific inputs (connection_name, insight_source_id,
      # data_source, dbt_select, dbt_select_staging) are supplied by the
      # invoker. Image tags and infrastructure coordinates default from
      # umbrella chart values — single source of truth, baked into the
      # rendered WorkflowTemplate at `helm install` time. Submitters can
      # still override per-call (e.g. for testing a different toolbox tag).
      #
      # connection_name (per ADR-0005): pattern {connector}-{source_id}-{tenant}-conn.
      # The airbyte-sync template's resolve-connection-by-name init-step
      # resolves the UUID at submit time.
      inputs:
        parameters:
          - name: connection_name
          # Ledger identity as template INPUTS, not workflow scope: the manual
          # submitter reaches this template by `templateRef`, which merges no
          # `spec.arguments`, so a workflow-scope reference there is
          # unresolvable and the run errors before it starts.
          - name: connector
            default: ""  # RULE-DEFAULTS-OK: a caller that predates the ledger
          - name: tenant_id
            default: ""  # RULE-DEFAULTS-OK: as connector
          - name: insight_source_id
          - name: data_source                # "jira" → enriched path; anything else → legacy single-dbt
          - name: dbt_select_staging         # e.g. "tag:jira"; empty for non-jira
            default: ""  # RULE-DEFAULTS-OK: empty-string sentinel — non-jira callers send "" so the `data_source == 'jira'` predicate is the only dispatch.
          - name: dbt_select                 # e.g. "tag:silver"
          - name: dbt_full_refresh           # one-shot full-refresh flag; "true" iff bump_kind=major (per ADR-0015)
            default: "false"
          - name: toolbox_image
            default: {{ required "ingestion.toolboxImage is required when ingestion.templates.enabled=true" .Values.ingestion.toolboxImage | quote }}
          # Sourced from the jira descriptor's `images.enrich.image` field
          # (per ADR-0016) by the submitter; required when data_source == "jira".
          - name: jira_enrich_image
          - name: airbyte_url
            default: {{ include "insight.airbyte.url" . | quote }}
          - name: clickhouse_host
            default: {{ include "insight.clickhouse.fqdn" . | quote }}
          - name: clickhouse_port
            default: {{ include "insight.clickhouse.port" . | quote }}
          - name: clickhouse_user
            default: {{ required "clickhouse.username is required" .Values.clickhouse.username | quote }}
      dag:
        # INVARIANT: the real work is named alongside the recorders.
        #
        # A DAG's phase comes from its targets, and a target is any task nothing
        # depends on — leaving the recorders as the only ones. Measured on a
        # stand: a failed task plus a succeeded recorder reported the DAG
        # Succeeded, which turned a failed dbt into a green run.
        target: "sync transform record-run-started record-transform"
        tasks:
          # Nothing depends on this task: the ledger observes the run, so the
          # sync must never wait on a warehouse write to start.
          - name: record-run-started
            when: {{ `"'{{inputs.parameters.connector}}' != ''"` }}
            templateRef:
              name: ledger-write
              template: write-tolerated
            arguments:
              parameters:
                - name: event
                  value: "run.started"
                - name: status
                  value: "running"
                - name: connector
                  value: {{ `"{{inputs.parameters.connector}}"` }}
                - name: run_id
                  value: {{ `"{{workflow.name}}"` }}

          - name: sync
            templateRef:
              name: airbyte-sync
              template: main
            arguments:
              parameters:
                - name: connection_name
                  value: {{ `"{{inputs.parameters.connection_name}}"` }}
                - name: airbyte_url
                  value: {{ `"{{inputs.parameters.airbyte_url}}"` }}
                - name: connector
                  value: {{ `"{{inputs.parameters.connector}}"` }}

          - name: transform
            depends: sync
            template: transform
            arguments:
              parameters:
                - name: insight_source_id
                  value: {{ `"{{inputs.parameters.insight_source_id}}"` }}
                - name: data_source
                  value: {{ `"{{inputs.parameters.data_source}}"` }}
                - name: dbt_select_staging
                  value: {{ `"{{inputs.parameters.dbt_select_staging}}"` }}
                - name: dbt_select
                  value: {{ `"{{inputs.parameters.dbt_select}}"` }}
                - name: dbt_full_refresh
                  value: {{ `"{{inputs.parameters.dbt_full_refresh}}"` }}
                - name: toolbox_image
                  value: {{ `"{{inputs.parameters.toolbox_image}}"` }}
                - name: jira_enrich_image
                  value: {{ `"{{inputs.parameters.jira_enrich_image}}"` }}
                - name: clickhouse_host
                  value: {{ `"{{inputs.parameters.clickhouse_host}}"` }}
                - name: clickhouse_port
                  value: {{ `"{{inputs.parameters.clickhouse_port}}"` }}
                - name: clickhouse_user
                  value: {{ `"{{inputs.parameters.clickhouse_user}}"` }}

          # The transform's own outcome (spec FR-4). Neither the mover nor
          # bronze knows it, so a successful sync followed by a failed dbt —
          # fresh bronze, stalled downstream layers — is visible only here.
          # Omitted when the sync did not run, which is the honest answer.
          - name: record-transform
            depends: "transform.Succeeded || transform.Failed || transform.Errored"
            when: {{ `"'{{inputs.parameters.connector}}' != ''"` }}
            templateRef:
              name: ledger-write
              template: write-tolerated
            arguments:
              parameters:
                - name: event
                  value: "transform.completed"
                - name: status
                  value: {{ `"{{tasks.transform.status}}"` }}
                - name: connector
                  value: {{ `"{{inputs.parameters.connector}}"` }}
                - name: run_id
                  value: {{ `"{{workflow.name}}"` }}

    # The terminal ledger row. `workflow.failures` arrives as quoted JSON and
    # names the step the run reached; ledger-write parses it and maps the
    # workflow status vocabulary onto the ledger's.
    - name: record-run-finished
      steps:
        - - name: write
            when: {{ `"'{{workflow.parameters.connector}}' != ''"` }}
            templateRef:
              name: ledger-write
              template: write-tolerated
            arguments:
              parameters:
                - name: event
                  value: "run.finished"
                - name: status
                  value: {{ `"{{workflow.status}}"` }}
                - name: connector
                  value: {{ `"{{workflow.parameters.connector}}"` }}
                - name: run_id
                  value: {{ `"{{workflow.name}}"` }}
                - name: duration_seconds
                  value: {{ `"{{workflow.duration}}"` }}
                - name: failures_json
                  value: {{ `"{{workflow.failures}}"` }}

    # Everything after the Airbyte sync, as its own entrypoint: a sync started
    # outside the pipeline (Airbyte UI, ad-hoc) gets the same chain by
    # submitting `entrypoint: transform` with `data_source`. Every other
    # parameter defaults, except jira's, which the CronWorkflow always passes.
    - name: transform
      inputs:
        parameters:
          - name: data_source
          - name: insight_source_id
            default: ""  # RULE-DEFAULTS-OK: consumed by the jira enrich step only
          - name: dbt_select_staging
            default: ""  # RULE-DEFAULTS-OK: same sentinel as on `pipeline`
          - name: dbt_select
            default: ""  # RULE-DEFAULTS-OK: consumed by the jira silver step only
          - name: dbt_full_refresh
            default: "false"
          - name: toolbox_image
            default: {{ required "ingestion.toolboxImage is required when ingestion.templates.enabled=true" .Values.ingestion.toolboxImage | quote }}
          - name: jira_enrich_image
            default: ""  # RULE-DEFAULTS-OK: consumed by the jira enrich step only
          - name: clickhouse_host
            default: {{ include "insight.clickhouse.fqdn" . | quote }}
          - name: clickhouse_port
            default: {{ include "insight.clickhouse.port" . | quote }}
          - name: clickhouse_user
            default: {{ required "clickhouse.username is required" .Values.clickhouse.username | quote }}
      dag:
        tasks:
          # ------ Jira: dbt(tag:jira) → jira-enrich → dbt(tag:silver) ------
          - name: transform-jira-staging
            when: {{ `"'{{inputs.parameters.data_source}}' == 'jira'"` }}
            templateRef:
              name: dbt-run
              template: run
            arguments:
              parameters:
                # identity_inputs alongside the connector's own staging
                # models: the seed step reads it.
                - name: dbt_select
                  value: {{ `"{{inputs.parameters.dbt_select_staging}} identity_inputs"` }}
                - name: dbt_full_refresh
                  value: {{ `"{{inputs.parameters.dbt_full_refresh}}"` }}
                - name: toolbox_image
                  value: {{ `"{{inputs.parameters.toolbox_image}}"` }}
                - name: clickhouse_host
                  value: {{ `"{{inputs.parameters.clickhouse_host}}"` }}
                - name: clickhouse_port
                  value: {{ `"{{inputs.parameters.clickhouse_port}}"` }}
                - name: clickhouse_user
                  value: {{ `"{{inputs.parameters.clickhouse_user}}"` }}

          - name: enrich
            depends: transform-jira-staging
            when: {{ `"'{{inputs.parameters.data_source}}' == 'jira'"` }}
            templateRef:
              name: tt-enrich-jira-run
              template: run
            arguments:
              parameters:
                - name: insight_source_id
                  value: {{ `"{{inputs.parameters.insight_source_id}}"` }}
                - name: jira_enrich_image
                  value: {{ `"{{inputs.parameters.jira_enrich_image}}"` }}
                - name: clickhouse_host
                  value: {{ `"{{inputs.parameters.clickhouse_host}}"` }}
                - name: clickhouse_port
                  value: {{ `"{{inputs.parameters.clickhouse_port}}"` }}
                - name: clickhouse_user
                  value: {{ `"{{inputs.parameters.clickhouse_user}}"` }}
                - name: batch_size
                  value: "10000"

          # ------ Non-Jira: connector staging + identity_inputs before the seed ------
          - name: transform-staging
            when: {{ `"'{{inputs.parameters.data_source}}' != 'jira'"` }}
            templateRef:
              name: dbt-run
              template: run
            arguments:
              parameters:
                - name: dbt_select
                  value: {{ `"tag:{{inputs.parameters.data_source}} identity_inputs"` }}
                - name: dbt_full_refresh
                  value: {{ `"{{inputs.parameters.dbt_full_refresh}}"` }}
                - name: toolbox_image
                  value: {{ `"{{inputs.parameters.toolbox_image}}"` }}
                - name: clickhouse_host
                  value: {{ `"{{inputs.parameters.clickhouse_host}}"` }}
                - name: clickhouse_port
                  value: {{ `"{{inputs.parameters.clickhouse_port}}"` }}
                - name: clickhouse_user
                  value: {{ `"{{inputs.parameters.clickhouse_user}}"` }}

          # ------ Both paths: resolve + publish identity before gold ------
          # INVARIANT: gold must not resolve against a snapshot older than the
          # data it is building over. `.Succeeded` is load-bearing: a bare task
          # name also satisfies on Skipped, and the staging task the `when`
          # dispatch rejects skips at DAG start — the seed would launch beside
          # the staging build instead of after it.
          - name: identity-seed
            depends: transform-jira-staging.Succeeded || transform-staging.Succeeded
            templateRef:
              name: identity-seed-run
              template: run

          - name: transform-jira-silver
            depends: enrich && identity-seed
            when: {{ `"'{{inputs.parameters.data_source}}' == 'jira'"` }}
            templateRef:
              name: dbt-run
              template: run
            arguments:
              parameters:
                - name: dbt_select
                  value: {{ `"{{inputs.parameters.dbt_select}}"` }}
                # The staging step built the identity_inputs union already.
                - name: dbt_exclude
                  value: "identity_inputs"
                - name: dbt_full_refresh
                  value: {{ `"{{inputs.parameters.dbt_full_refresh}}"` }}
                - name: toolbox_image
                  value: {{ `"{{inputs.parameters.toolbox_image}}"` }}
                - name: clickhouse_host
                  value: {{ `"{{inputs.parameters.clickhouse_host}}"` }}
                - name: clickhouse_port
                  value: {{ `"{{inputs.parameters.clickhouse_port}}"` }}
                - name: clickhouse_user
                  value: {{ `"{{inputs.parameters.clickhouse_user}}"` }}

          # ------ Non-Jira: single-dbt path, scoped to this connector ------
          # Selector is derived from the connector slug as `tag:<connector>+`:
          # this connector's staging models plus everything downstream
          # (silver class_*, fct_*, mtr_*) reachable via dbt-graph edges.
          # Sister connectors stay sideways in the graph and are skipped, so a
          # connector whose bronze sources are absent on this tenant cannot fail
          # the run. The incoming `dbt_select` param is intentionally ignored
          # here — name-derived scoping does not depend on it being populated.
          - name: transform-legacy
            depends: identity-seed && transform-staging
            when: {{ `"'{{inputs.parameters.data_source}}' != 'jira'"` }}
            templateRef:
              name: dbt-run
              template: run
            arguments:
              parameters:
                - name: dbt_select
                  value: {{ `"tag:{{inputs.parameters.data_source}}+"` }}
                # transform-staging already built these; a `+` walk would
                # rebuild them a second time in the same pipeline.
                - name: dbt_exclude
                  value: {{ `"tag:{{inputs.parameters.data_source}} identity_inputs"` }}
                - name: dbt_full_refresh
                  value: {{ `"{{inputs.parameters.dbt_full_refresh}}"` }}
                - name: toolbox_image
                  value: {{ `"{{inputs.parameters.toolbox_image}}"` }}
                - name: clickhouse_host
                  value: {{ `"{{inputs.parameters.clickhouse_host}}"` }}
                - name: clickhouse_port
                  value: {{ `"{{inputs.parameters.clickhouse_port}}"` }}
                - name: clickhouse_user
                  value: {{ `"{{inputs.parameters.clickhouse_user}}"` }}
{{- end }}
