{{/*
==============================================================================
 ClickHouse schema migrations
==============================================================================

Helm Hook Job that applies the schema migrations
(`src/ingestion/scripts/migrations/*.sql`) and the guarded heals of
`apply-ch-migrations.sh` against the external ClickHouse: it runs the
toolbox image (which bundles the scripts and `lib/ch-exec.sh`) and dials
`clickhouse.host` over the HTTP interface (CLICKHOUSE_URL selects the HTTP
backend in lib/ch-exec.sh). The `clickhouse-databases` Hook only creates
databases and access.

Hook timing: `post-install,post-upgrade`. The post-* phase runs after the
main release (so the `clickhouse-databases` pre-install Hook has created
the app database and the app pods have rolled). post-* over pre-* is safe
because gold consumers (analytics) resolve VIEW source tables lazily at
query time, so a relation materialising after pod startup is fine.
(hook-weight 200 runs this AFTER the keycloak-config hook (100): helm
executes same-phase hooks serially.)

Failure behavior: a failed migration is NOT silently tolerated. Helm blocks
on the hook Job, so a non-zero exit fails `helm upgrade` (and, under the
gitops `--rollback-on-failure` default, rolls the release back). That is
intentional — a broken migration must surface loudly. `backoffLimit` is low
because migration SQL errors are deterministic, not transient: retrying a
bad statement just delays the inevitable failure.

Idempotent: migrations are re-run on every upgrade and are CREATE OR
REPLACE / IF NOT EXISTS; the heals are guarded by `ch_table_exists`. No
migration ledger.

The script pre-creates no relation and builds no model (#3559, #3561): every
staging, silver and gold relation is dbt's, built by the connector sync that
feeds it, because every descriptor's dbt selector ends in `+`. A relation no
sync has built yet does not exist, and the analytics service answers it as
not-ready rather than as a failure.

Gated on `clickhouse.runMigrations` (default true) AND the availability of
`ingestion.toolboxImage` (the image that ships the migration SQL).
*/}}
{{- if and .Values.clickhouse.runMigrations .Values.ingestion.toolboxImage }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "insight.fullname" . }}-clickhouse-migrate
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "200"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  labels:
    {{- include "insight.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse-migrate
spec:
  # Low on purpose: migration SQL errors are deterministic (see header).
  # A couple of attempts still absorbs a transient CH blip mid-run.
  backoffLimit: 2
  # 2700 s = 3 attempts (backoffLimit 2) x 900 s, lib/ch-exec.sh's cluster-mode
  # transport ceiling per statement: an attempt either runs its ~200 statements
  # and the row-moving heals well inside one ceiling, or stalls on one statement
  # and is cut at it (a coordinated DDL answers within its own 60 s).
  activeDeadlineSeconds: 2700
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "insight.fullname" . }}-clickhouse-migrate
        app.kubernetes.io/component: clickhouse-migrate
    spec:
      # Suppress the legacy `<SVC>_SERVICE_HOST/PORT/…` Docker-link env-vars
      # kubelet auto-injects for every Service in the namespace at pod-start.
      enableServiceLinks: false
      restartPolicy: OnFailure
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ .Values.ingestion.toolboxImage | quote }}
          imagePullPolicy: IfNotPresent
          command: [bash]
          args:
            - "-c"
            - "bash /ingestion/scripts/apply-ch-migrations.sh"
          env:
            {{- include "insight.clickhouse.ddlEnv" . | nindent 12 }}
{{- end }}
