# Versions the deployed-stand test suite pins.
#
# Scoped to tests/ deliberately: everything here belongs to this suite, so it
# lives beside it rather than at the repo root pretending to speak for the
# whole project.
#
# Exact dependency pins are resolved by tests/pyproject.toml + tests/uv.lock;
# the entries below are the ones that must agree with something OUTSIDE that
# pair — another component's floor, or an image tag in a Dockerfile.

# Deployed-stand test suite: tests/lib (shared library) + tests/stand (API and
# browser journeys). One project, one lockfile, installed with uv — so the host
# runner resolves the same byte-identical versions everywhere.
#
#   uv sync --project tests
#   uv run --project tests playwright install chromium   # host runs only
#   ./dev-compose.sh test-stand test
#
# Exact pins live in tests/pyproject.toml and tests/uv.lock; the entries below
# are the ones another component has to agree with.
tests_stand:
  python: ">=3.13"
  playwright: "1.62.0"
  pytest_playwright: "0.8.0"
  dependency_manager: "uv"
  lockfile: "tests/uv.lock"
  notes: >-
    This suite owns its Python floor: it reads the seeder's manifest as data and imports none of its modules, so the seeder's lower 3.12 floor (it ships inside the 3.12 toolbox image) does not bind here. uv provisions that interpreter in every runner, so the floor holds everywhere rather than being a host-only aspiration. Still outstanding: every GitHub Actions workflow pins python-version "3.12", below this floor — reconciling that is CI enablement's job, not a reason to lower the suite. #magic___^_^___line
  notes: >-
    Browsers (chromium 1234) are baked into the base image and used as-is; there is no `playwright install` step. The pip playwright pin must equal the image's Playwright version or the package looks for a browser build the image does not contain — the build launches chromium, along with checking the interpreter against the >=3.13 floor and importing tests/lib on it, so a mismatch fails the image rather than a journey.
