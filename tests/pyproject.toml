# One project for the whole deployed-stand test tree.
#
#   tests/lib/   — insight_stand, the shared library (importable package)
#   tests/stand/ — the suite that consumes it (api/, ui/)
#
# Both halves share one dependency set and one lockfile, so every runner
# installs byte-identical versions instead of drifting.
#
#   uv sync --project tests                       # create tests/.venv
#   uv run --project tests playwright install chromium
#   uv run --project tests pytest tests/stand     # or: ./dev-compose.sh test-stand test
#
# Everything is pinned and locked (tests/uv.lock). Adding a dependency means
# editing this file and re-running `uv lock --project tests`.

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "insight-stand-tests"
version = "0.1.0"
description = "Deployed-stand test suite for Insight: shared library plus API and browser journeys."
# This suite's own floor, not inherited from anywhere: it reads the seeder's
# manifest as DATA and imports none of its modules, so the seeder's lower 3.12
# floor (it ships inside the 3.12 toolbox image) does not apply here. uv
# provisions this interpreter everywhere, so the floor holds in every runner
# rather than being a host-only aspiration. (Workflows' setup-python still
# pins 3.12 — that interpreter only runs stdlib helper scripts, never this
# suite; reconciling the pins is CI enablement's call, not a reason to lower
# the floor.)
requires-python = ">=3.13"
dependencies = [
    "pytest>=8",
    # Sync HTTP with a cookie jar — the session transport LoginSession needs.
    "httpx>=0.27",
    # Pinned so every runner installs the same browser build via
    # `playwright install chromium`.
    "playwright==1.62.0",
    "pytest-playwright==0.8.0",
    # Response-schema validation. Already a proven version in this repo — the
    # integration rig resolves the same 2.13 line transitively.
    "pydantic>=2.13",
    # Signing the RFC 7523 client assertion a service principal presents to the
    # authenticator's token endpoint (`insight_stand.service_token`). `[crypto]`
    # pulls `cryptography`, which is what supplies ES256 — PyJWT alone can only
    # do HMAC, and the authenticator accepts nothing but ES256.
    #
    # This is the suite's only cryptography, and it is deliberately not used to
    # MINT anything: the assertion is a request for a token, exchanged at the
    # deployed endpoint, exactly as a real service does it.
    "pyjwt[crypto]>=2.9",
    # Reads the .xlsx half of every export a journey downloads. A workbook is a
    # zip of XML, so a hand-rolled reader is possible and is a liability: the
    # assertion would then depend on test code nobody reviews as carefully as
    # the product. Read-only here — the suite writes no spreadsheets.
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "mypy==2.1.0",
    "ruff==0.15.16",
    # Regenerates tests/stand/api/schemas/analytics.py from the committed
    # analytics OpenAPI document. Dev-only: the generated module is committed,
    # so a test run never needs the generator.
    "datamodel-code-generator>=0.26",
]

# The library lives under lib/; the suite under stand/ is collected by pytest
# and is deliberately not packaged. `where` is the whole filter — lib/ holds the
# library and nothing else, so an `include` pattern on top of it would only be a
# second place to edit when a second package appears.
[tool.setuptools.packages.find]
where = ["lib"]

[tool.pytest.ini_options]
# `-ra` keeps skips visible with their reason: without it a `-q` run prints a
# bare `s`, which turns a skipped browser journey into an invisible one.
addopts = "-ra --strict-markers --strict-config"
# `base_url` (pytest-base-url, via pytest-playwright) is deliberately NOT set
# here. A stand's address is only known at run time, so tests/stand/conftest.py
# fills the option from $INSIGHT_STAND_BASE_URL or the stand's own env file —
# and only when `--base-url` / $PYTEST_BASE_URL / this key has not set it.
markers = [
    "requires_seed(*names): stand fixtures this test needs, validated against the manifest's fixture catalog at COLLECTION time",
    "requires_ingestion: needs a stand whose manifest declares the 'ingestion' capability; skipped with a reason when it does not",
    "requires_service_principal: needs a stand whose authenticator token listener this runner can reach, so a service principal can be obtained; skipped with a reason when it cannot",
    "stand_smoke: the post-deploy gate — a handful of tests from this same suite (a login-derived identity check, /auth/me, one metric with real data) selected with `-m stand_smoke` to prove a freshly deployed stand works, rather than a separate package",
    "rebuild_lane: the serialized rebuild lane — the test triggers a scoped dbt rebuild of one gold evidence relation through the stand's own seed image, so it needs docker beside the local compose stand and a run nothing else shares. OPT-IN: skipped unless --rebuild-lane is passed (tests/stand/conftest.py)",
    # Quality vectors — every stand api/ui test carries exactly one: a module-level
    # pytestmark where the whole module shares a vector, per-test markers throughout
    # a mixed module (never both — markers are additive, so a default plus an
    # override would leave two and break `-m` selection). Enforced at collection by
    # tests/stand/conftest.py. Select a vector's tests with `-m <vector>`.
    "reliability: quality vector — the data promise: correctness, contracts, fail-clear behaviour, journeys completing",
    "security: quality vector — access control, tenancy and visibility scope, refusals, credential hygiene",
    "performance: quality vector — speed at reference scale",
    "efficiency: quality vector — compute cost to run",
    "versatility: quality vector — breadth across sources, the metric catalog and its surfaces",
]

[tool.ruff]
line-length = 100
target-version = "py313"
# GENERATED by tests/generate_schemas.py, which runs its own ruff pass. Excluded
# from this one because `ruff check --fix` would edit the files and then
# `generate_schemas.py --check` reports them stale — the two checks would fight
# every time, and the drift check is the one that matters.
extend-exclude = [
    "stand/api/schemas/analytics.py",
    "stand/api/schemas/authenticator.py",
    "stand/api/schemas/identity.py",
]

[tool.ruff.lint]
# Same pragmatic strict set as src/ingestion/tools/seed/pyproject.toml.
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "UP",       # pyupgrade
    "RET",      # flake8-return
    "SIM",      # flake8-simplify
    "ANN",      # flake8-annotations
    "DTZ",      # flake8-datetimez (naive datetime is a bug)
    "N",        # pep8-naming
    "RUF",      # ruff-specific
]
ignore = [
    "ANN401",  # Dynamic `Any` is sometimes the right tool
    "E501",    # Long lines handled by `line-length`
]


[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
