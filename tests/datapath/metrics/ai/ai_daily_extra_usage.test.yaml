spec_version: 1
description: >
  Metric: ai.daily_approximate_extra_usage_cost — the billed seat spend placed on
  the days it was spent.
  How it's computed (bronze → silver → gold):
    • bronze: one per-seat spend snapshot per day the vendor was read; used_credits
              is the month-to-date total ALREADY in cents, not that day's spend
    • silver: class_ai_overage_daily keeps one reading per seat per day
    • gold:   a day's figure is the step between consecutive readings inside one
              billing month, after the running total is corrected to its suffix
              minimum

  Why a step and not the reported number: the vendor states only a running total
  for the month in progress and keeps no history, so a day's spend exists nowhere
  and can only be recovered as a difference.

  The correction rule is what erin is here for. A running total may not fall; when
  it does the vendor has revised the month down, and the revision belongs to the
  days already reported rather than to the day it arrived. Taking the minimum of a
  reading and every later one rewrites those days, which is why erin's Dec 05 reads
  4.00 and not 5.00, and why her Dec 06 is 0.00 and never −1.00.

  The month's last calendar day is the exception, and alice's September is here for
  it: a drop there cannot be told from a rolled-over counter, so such a reading may
  raise the month but never lower it.

  Department: 5 Engineering members, read on Dec 05 and Dec 06 (alice again on
  Dec 07), inside the custom window (Nov 01 .. Dec 12). Cents as the vendor
  reports them, dollars as the metric serves them:

    person   Dec 05   Dec 06   Dec 07   corrected steps      window sum
    alice       100      300      300    100 / 200 / 0        300¢ = $3
    bob         200      500        —    200 / 300            500¢ = $5
    carol       300      700        —    300 / 400            700¢ = $7
    dave        400      900        —    400 / 500            900¢ = $9
    erin        500      400        —    400 / 0              400¢ = $4

  Five contributors, because the peer view suppresses its quartiles below five.

  Every window sum equals that seat's last reading, and so equals what
  ai.extra_usage_cost reports for the same window — not by arrangement but by
  construction, since the steps of a corrected running total telescope to its final
  value. The third case asserts it for all five, erin included: a correction that
  broke the identity would show up there first.

  Cases: the four served views · a correction · a held last day · an overstated
  first reading · the sum identity · empty window.

bronze:
  bronze_bamboohr.employees:
    - $ref: ../templates/people.yaml#/templates/alice
    - $ref: ../templates/people.yaml#/templates/bob
    - $ref: ../templates/people.yaml#/templates/carol
    - $ref: ../templates/people.yaml#/templates/dave
    - $ref: ../templates/people.yaml#/templates/erin

  # One row per seat per day, each with its own unique_key — the grain the
  # connector writes since claude-team 3.2.0. Keyed by seat and month these
  # would be one row and every step below would be unmeasurable.
  bronze_claude_team.claude_team_overage_spend:
    - { $ref: ../templates/claude_team_overage.yaml#/templates/alice, _airbyte_extracted_at: "2026-12-05T00:00:00Z", unique_key: seat-alice-2026-12-05, snapshot_date: "2026-12-05", used_credits: 100, monthly_credit_limit: 1000 }
    - { $ref: ../templates/claude_team_overage.yaml#/templates/alice, _airbyte_extracted_at: "2026-12-06T00:00:00Z", unique_key: seat-alice-2026-12-06, snapshot_date: "2026-12-06", used_credits: 300, monthly_credit_limit: 1000 }
    - { $ref: ../templates/claude_team_overage.yaml#/templates/alice, _airbyte_extracted_at: "2026-12-07T00:00:00Z", unique_key: seat-alice-2026-12-07, snapshot_date: "2026-12-07", used_credits: 300, monthly_credit_limit: 1000 }
    - { $ref: ../templates/claude_team_overage.yaml#/templates/bob,   _airbyte_extracted_at: "2026-12-05T00:00:00Z", unique_key: seat-bob-2026-12-05,   snapshot_date: "2026-12-05", used_credits: 200, monthly_credit_limit: 1000 }
    - { $ref: ../templates/claude_team_overage.yaml#/templates/bob,   _airbyte_extracted_at: "2026-12-06T00:00:00Z", unique_key: seat-bob-2026-12-06,   snapshot_date: "2026-12-06", used_credits: 500, monthly_credit_limit: 1000 }
    - { $ref: ../templates/claude_team_overage.yaml#/templates/carol, _airbyte_extracted_at: "2026-12-05T00:00:00Z", unique_key: seat-carol-2026-12-05, snapshot_date: "2026-12-05", used_credits: 300, monthly_credit_limit: 1000 }
    - { $ref: ../templates/claude_team_overage.yaml#/templates/carol, _airbyte_extracted_at: "2026-12-06T00:00:00Z", unique_key: seat-carol-2026-12-06, snapshot_date: "2026-12-06", used_credits: 700, monthly_credit_limit: 1000 }
    - { $ref: ../templates/claude_team_overage.yaml#/templates/dave,  _airbyte_extracted_at: "2026-12-05T00:00:00Z", unique_key: seat-dave-2026-12-05,  snapshot_date: "2026-12-05", used_credits: 400, monthly_credit_limit: 1000 }
    - { $ref: ../templates/claude_team_overage.yaml#/templates/dave,  _airbyte_extracted_at: "2026-12-06T00:00:00Z", unique_key: seat-dave-2026-12-06,  snapshot_date: "2026-12-06", used_credits: 900, monthly_credit_limit: 1000 }
    # The correction: Dec 06 reports LESS than Dec 05.
    - { $ref: ../templates/claude_team_overage.yaml#/templates/erin,  _airbyte_extracted_at: "2026-12-05T00:00:00Z", unique_key: seat-erin-2026-12-05,  snapshot_date: "2026-12-05", used_credits: 500, monthly_credit_limit: 1000 }
    - { $ref: ../templates/claude_team_overage.yaml#/templates/erin,  _airbyte_extracted_at: "2026-12-06T00:00:00Z", unique_key: seat-erin-2026-12-06,  snapshot_date: "2026-12-06", used_credits: 400, monthly_credit_limit: 1000 }
    # Sep 30 is the month's last calendar day and reports LESS than Sep 29. Its
    # own month, so the December pool above keeps its five contributors.
    - { $ref: ../templates/claude_team_overage.yaml#/templates/alice, _airbyte_extracted_at: "2026-09-29T00:00:00Z", unique_key: seat-alice-2026-09-29, snapshot_date: "2026-09-29", used_credits: 600, monthly_credit_limit: 1000 }
    - { $ref: ../templates/claude_team_overage.yaml#/templates/alice, _airbyte_extracted_at: "2026-09-30T00:00:00Z", unique_key: seat-alice-2026-09-30, snapshot_date: "2026-09-30", used_credits: 100, monthly_credit_limit: 1000 }
    # bob's Oct 01 reads far above the month: a reading taken before the
    # vendor's period rolled over states the closing month.
    - { $ref: ../templates/claude_team_overage.yaml#/templates/bob,   _airbyte_extracted_at: "2026-10-01T00:00:00Z", unique_key: seat-bob-2026-10-01,   snapshot_date: "2026-10-01", used_credits: 5000, monthly_credit_limit: 10000 }
    - { $ref: ../templates/claude_team_overage.yaml#/templates/bob,   _airbyte_extracted_at: "2026-10-02T00:00:00Z", unique_key: seat-bob-2026-10-02,   snapshot_date: "2026-10-02", used_credits: 100,  monthly_credit_limit: 10000 }
    - { $ref: ../templates/claude_team_overage.yaml#/templates/bob,   _airbyte_extracted_at: "2026-10-31T00:00:00Z", unique_key: seat-bob-2026-10-31,   snapshot_date: "2026-10-31", used_credits: 300,  monthly_credit_limit: 10000 }
