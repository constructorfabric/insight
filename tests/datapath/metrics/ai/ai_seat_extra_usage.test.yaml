spec_version: 1
description: >
  Metrics: ai.extra_usage_cost and ai.extra_usage_utilisation — Claude Team seat spend.
  How they're computed (bronze → silver → gold):
    • bronze: per-seat spend snapshot, used_credits and monthly_credit_limit ALREADY in cents
    • silver: latest snapshot per seat per calendar month, stamped period_month from
              the extraction time
    • gold:   one evidence row per seat-month per measure, dated at the first day of the
              billing month — not at the day the snapshot was read, which moves with the
              sync schedule and drops the row out of a window ending before it.

  used_credits IS the money: the vendor bills it only once a seat has exhausted the
  usage included in its fee. It is NOT the excess over monthly_credit_limit, which is
  an enforced ceiling on that same spend. Every seat below is under its ceiling, so a
  model computing max(0, used − limit) would return 0 for all of them and every
  ai.extra_usage_cost assertion here would fail.

  ONE snapshot per seat, because that is all bronze can hold: the connector's
  unique_key carries no month, and bronze is
  ReplacingMergeTree(_airbyte_extracted_at) ORDER BY unique_key, so a merge keeps the
  newest row per seat. Monthly history accrues in silver instead, one month at a time;
  test_ai_seat_extra_usage_history.py drives the pipeline twice to cover that.

  Department: 5 Engineering members, one snapshot each read Dec 10, inside the custom
  window (Nov 01 .. Dec 12):

    person   Dec used   ceiling/month   utilisation
    alice         50¢          1000¢     5.0 %
    bob          100¢          1000¢    10.0 %
    carol        150¢          1000¢    15.0 %
    dave         200¢          1000¢    20.0 %
    erin         250¢          1000¢    25.0 %

  Utilisation therefore rises 5 → 10 → 15 → 20 → 25 % across the cohort, and the peer
  spread asserted below is that order. grace completes it at the top: her seat has
  spent its ceiling exactly, so she reads 100 % — the point at which the vendor stops
  the seat. Read as proximity to being blocked, 100 % is the ceiling of the scale and
  not an error, and it is the reading the cohort's 5..25 % cannot reach.

  Five ceilings, not four: the peer view suppresses its quartiles below five
  contributing entities. frank and grace both hold employment records outside
  Engineering, so their departments keep them out of the cohort the peer pools are
  drawn from and neither moves the spread. frank holds a seat with no ceiling, so he is
  present in ai.extra_usage_cost and absent from ai.extra_usage_utilisation —
  honest-NULL, not a zero.

  Three more Quality members finish the scale (#2479 scenario 2): ivan at 95 % of
  his ceiling sits just below grace's 100 %, and judy at 104 % reads past it, because
  the vendor can bill the charge that crosses the ceiling and the ratio is never
  capped. kim holds two seats that identity resolves to one person (#2479 scenario
  12): 400¢ against a 1000¢ ceiling, and 300¢ on a seat with no ceiling. Her money
  is both seats, 7.00; her utilisation is the ceiling-bearing seat alone, 40 %. A
  ratio that let the no-ceiling seat's spend in would read 70 %.

  Cases: custom scope · dedup of a repeated snapshot · the no-ceiling seat · the seat
  stopped at its ceiling · the proximity scale uncapped · two seats, one without a
  ceiling · empty window.

identity_aliases:
  kim@example.com: [kim.second@example.org]

bronze:
  bronze_bamboohr.employees:
    - $ref: ../templates/people.yaml#/templates/alice
    - $ref: ../templates/people.yaml#/templates/bob
    - $ref: ../templates/people.yaml#/templates/carol
    - $ref: ../templates/people.yaml#/templates/dave
    - $ref: ../templates/people.yaml#/templates/erin
    - {$ref: ../templates/people.yaml#/templates/bamboohr_employee, id: e099, unique_key: bamboohr-test-e099, firstName: Frank, lastName: Zeta, displayName: Frank Zeta, workEmail: frank@example.com, department: Quality}
    - {$ref: ../templates/people.yaml#/templates/bamboohr_employee, id: e098, unique_key: bamboohr-test-e098, firstName: Grace, lastName: Yuen, displayName: Grace Yuen, workEmail: grace@example.com, department: Quality}
    - {$ref: ../templates/people.yaml#/templates/bamboohr_employee, id: e097, unique_key: bamboohr-test-e097, firstName: Ivan, lastName: Xu, displayName: Ivan Xu, workEmail: ivan@example.com, department: Quality}
    - {$ref: ../templates/people.yaml#/templates/bamboohr_employee, id: e096, unique_key: bamboohr-test-e096, firstName: Judy, lastName: Wolfe, displayName: Judy Wolfe, workEmail: judy@example.com, department: Quality}
    - {$ref: ../templates/people.yaml#/templates/bamboohr_employee, id: e095, unique_key: bamboohr-test-e095, firstName: Kim, lastName: Vance, displayName: Kim Vance, workEmail: kim@example.com, department: Quality}

  bronze_claude_team.claude_team_members:
    - { $ref: ../templates/claude_team_member.yaml#/templates/claude_team_member, unique_key: member-kim,        account: '{"uuid": "seat-kim", "email_address": "kim@example.com", "full_name": "Kim Vance"}' }
    - { $ref: ../templates/claude_team_member.yaml#/templates/claude_team_member, unique_key: member-kim-second, account: '{"uuid": "seat-kim-second", "email_address": "kim.second@example.org", "full_name": "Kim Vance"}', seat_tier: null }

  bronze_claude_team.claude_team_overage_spend:
    - { $ref: ../templates/claude_team_overage.yaml#/templates/alice, _airbyte_extracted_at: "2026-12-10T00:00:00Z", unique_key: seat-alice, used_credits: 50,  monthly_credit_limit: 1000, seat_tier: unassigned }
    - { $ref: ../templates/claude_team_overage.yaml#/templates/bob,   _airbyte_extracted_at: "2026-12-10T00:00:00Z", unique_key: seat-bob,   used_credits: 100, monthly_credit_limit: 1000 }
    - { $ref: ../templates/claude_team_overage.yaml#/templates/carol, _airbyte_extracted_at: "2026-12-10T00:00:00Z", unique_key: seat-carol, used_credits: 150, monthly_credit_limit: 1000 }
    - { $ref: ../templates/claude_team_overage.yaml#/templates/dave,  _airbyte_extracted_at: "2026-12-10T00:00:00Z", unique_key: seat-dave,  used_credits: 200, monthly_credit_limit: 1000 }
    # ── erin (the requested IC member) ──────────────────────────────────────────
    - { $ref: ../templates/claude_team_overage.yaml#/templates/erin,  _airbyte_extracted_at: "2026-12-10T00:00:00Z", unique_key: seat-erin,  used_credits: 250, monthly_credit_limit: 1000 }
    # Repeated sync of the same snapshot — the staging model keeps one row per
    # (seat, month), so the window stays 2.50 and does not become 5.00.
    - { $ref: ../templates/claude_team_overage.yaml#/templates/erin,  _airbyte_extracted_at: "2026-12-10T00:00:00Z", unique_key: seat-erin,  used_credits: 250, monthly_credit_limit: 1000 }
    # ── frank — NO ceiling: money yes, utilisation absent ────────────────────────
    - { $ref: ../templates/claude_team_overage.yaml#/templates/frank, _airbyte_extracted_at: "2026-12-10T00:00:00Z", unique_key: seat-frank, used_credits: 300, monthly_credit_limit: null, seat_tier: unassigned, limit_type: null }
    # ── grace — spent the ceiling exactly: 100 %, the point the vendor blocks at ──
    - { $ref: ../templates/claude_team_overage.yaml#/templates/grace, _airbyte_extracted_at: "2026-12-10T00:00:00Z", unique_key: seat-grace, used_credits: 1000, monthly_credit_limit: 1000, out_of_credits: true }
    - { $ref: ../templates/claude_team_overage.yaml#/templates/claude_team_seat, account_email: ivan@example.com,       account_uuid: seat-ivan,       _airbyte_extracted_at: "2026-12-10T00:00:00Z", unique_key: seat-ivan,       used_credits: 950,  monthly_credit_limit: 1000 }
    - { $ref: ../templates/claude_team_overage.yaml#/templates/claude_team_seat, account_email: judy@example.com,       account_uuid: seat-judy,       _airbyte_extracted_at: "2026-12-10T00:00:00Z", unique_key: seat-judy,       used_credits: 1040, monthly_credit_limit: 1000, out_of_credits: true }
    - { $ref: ../templates/claude_team_overage.yaml#/templates/claude_team_seat, account_email: kim@example.com,        account_uuid: seat-kim,        _airbyte_extracted_at: "2026-12-10T00:00:00Z", unique_key: seat-kim,        used_credits: 400,  monthly_credit_limit: 1000 }
    - { $ref: ../templates/claude_team_overage.yaml#/templates/claude_team_seat, account_email: kim.second@example.org, account_uuid: seat-kim-second, _airbyte_extracted_at: "2026-12-10T00:00:00Z", unique_key: seat-kim-second, used_credits: 300,  monthly_credit_limit: null, seat_tier: unassigned, limit_type: null }
