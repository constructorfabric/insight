spec_version: 1
description: >
  Metric: tasks.closed with a second tenant in the same warehouse.

  This tenant: alice, bob and carol of one department close 1, 2 and 1 issues on
  2026-12-25. The neighbour (tasks/tasks_closed under another tenant) carries
  the same addresses, the same Jira accounts and the same issue ids and keys,
  plus dave and erin; its carol closes three issues, TCW1 among them.

  Every read of this tenant sees its own three members only: carol's count is
  1, the department pool holds 3 observations and so discloses nothing, and
  carol's evidence lists TCW1 once.

bronze:
  bronze_bamboohr.employees:
    - $ref: ../templates/people.yaml#/templates/alice
    - $ref: ../templates/people.yaml#/templates/bob
    - $ref: ../templates/people.yaml#/templates/carol

  bronze_jira.jira_user:
    - { $ref: ../templates/jira_task.yaml#/templates/jira_user, unique_key: jira-test-alice-jira-acct, account_id: alice-jira-acct, email: alice@example.com, display_name: Alice Alpha }
    - { $ref: ../templates/jira_task.yaml#/templates/jira_user, unique_key: jira-test-bob-jira-acct, account_id: bob-jira-acct, email: bob@example.com, display_name: Bob Beta }
    - { $ref: ../templates/jira_task.yaml#/templates/jira_user, unique_key: jira-test-carol-jira-acct, account_id: carol-jira-acct, email: carol@example.com, display_name: Carol Gamma }

  bronze_jira.jira_statuses:
    - $ref: ../templates/jira_task.yaml#/templates/status_open
    - $ref: ../templates/jira_task.yaml#/templates/status_in_progress
    - $ref: ../templates/jira_task.yaml#/templates/status_closed

  bronze_jira.jira_issuetypes:
    - $ref: ../templates/jira_task.yaml#/templates/issuetype_task

  config.field_value_map:
    - $ref: ../templates/jira_task.yaml#/templates/value_type_task

  config.field_value_defaults:
    - $ref: ../templates/jira_task.yaml#/templates/jira_issue_type_default_unknown
    - $ref: ../templates/jira_task.yaml#/templates/jira_resolution_default_unknown

  bronze_jira.jira_fields:
    - $ref: ../templates/jira_task.yaml#/templates/field_status
    - $ref: ../templates/jira_task.yaml#/templates/field_assignee
    - $ref: ../templates/jira_task.yaml#/templates/field_issuetype
    - $ref: ../templates/jira_task.yaml#/templates/field_duedate

  bronze_jira.jira_issue:
    - $ref: ../templates/jira_task.yaml#/templates/jira_issue
      id: "10058"
      jira_id: "10058"
      unique_key: jira-test-TAW-1
      id_readable: TAW1
      created: "2026-01-05T09:00:00"
      custom_fields_json: '{"status":{"id":"6","name":"Closed"},"issuetype":{"id":"10001","name":"Task"},"assignee":{"accountId":"alice-jira-acct","displayName":"Alice Alpha"}}'
    - $ref: ../templates/jira_task.yaml#/templates/jira_issue
      id: "10059"
      jira_id: "10059"
      unique_key: jira-test-TBW-1
      id_readable: TBW1
      created: "2026-01-05T09:00:00"
      custom_fields_json: '{"status":{"id":"6","name":"Closed"},"issuetype":{"id":"10001","name":"Task"},"assignee":{"accountId":"bob-jira-acct","displayName":"Bob Beta"}}'
    - $ref: ../templates/jira_task.yaml#/templates/jira_issue
      id: "10060"
      jira_id: "10060"
      unique_key: jira-test-TBW-2
      id_readable: TBW2
      created: "2026-01-05T09:00:00"
      custom_fields_json: '{"status":{"id":"6","name":"Closed"},"issuetype":{"id":"10001","name":"Task"},"assignee":{"accountId":"bob-jira-acct","displayName":"Bob Beta"}}'
    - $ref: ../templates/jira_task.yaml#/templates/jira_issue
      id: "10061"
      jira_id: "10061"
      unique_key: jira-test-TCW-1
      id_readable: TCW1
      created: "2026-01-05T09:00:00"
      custom_fields_json: '{"status":{"id":"6","name":"Closed"},"issuetype":{"id":"10001","name":"Task"},"assignee":{"accountId":"carol-jira-acct","displayName":"Carol Gamma"}}'

  bronze_jira.jira_issue_history:
    - {$ref: ../templates/jira_task.yaml#/templates/jira_history, id_readable: TAW1, jira_id: "10058", changelog_id: "50000", unique_key: jira-test-TAW1-50000, created_at: "2026-12-25T14:00:00.000+0000", author_account_id: alice-jira-acct, items: '[{"field":"Status","fieldId":"status","fromString":"In Progress","from":"3","toString":"Closed","to":"6"}]'}
    - {$ref: ../templates/jira_task.yaml#/templates/jira_history, id_readable: TBW1, jira_id: "10059", changelog_id: "50001", unique_key: jira-test-TBW1-50001, created_at: "2026-12-25T14:00:00.000+0000", author_account_id: bob-jira-acct, items: '[{"field":"Status","fieldId":"status","fromString":"In Progress","from":"3","toString":"Closed","to":"6"}]'}
    - {$ref: ../templates/jira_task.yaml#/templates/jira_history, id_readable: TBW2, jira_id: "10060", changelog_id: "50002", unique_key: jira-test-TBW2-50002, created_at: "2026-12-25T14:00:00.000+0000", author_account_id: bob-jira-acct, items: '[{"field":"Status","fieldId":"status","fromString":"In Progress","from":"3","toString":"Closed","to":"6"}]'}
    - {$ref: ../templates/jira_task.yaml#/templates/jira_history, id_readable: TCW1, jira_id: "10061", changelog_id: "50003", unique_key: jira-test-TCW1-50003, created_at: "2026-12-25T14:00:00.000+0000", author_account_id: carol-jira-acct, items: '[{"field":"Status","fieldId":"status","fromString":"In Progress","from":"3","toString":"Closed","to":"6"}]'}
