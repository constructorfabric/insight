description: >
  Metric: ci.gate_first_try_pass_rate — gate runs green without a retry
  (tenant-grain, issue #2803).
  How it's computed (bronze → silver → gold):
    • bronze: workflow run attempts
    • silver: a run counts once at its LAST attempt; first-try = that attempt
      is attempt 1 and it passed
    • gold:   first-try passes / gate runs

  Seeded: four gate runs — two first-try successes, one success that needed a
  retry, one failure → 2/4 = 50%. The retried success raises the plain pass
  rate but not this one; the gap IS the retry tax.
  Cases: period 50, daily point, per-repository breakdown.
bronze:
  bronze_github.workflow_runs:
    - $ref: ../templates/github_ci.yaml#/templates/workflow_run
      unique_key: gh-run-f1
      id: 1
      run_number: 1
    - $ref: ../templates/github_ci.yaml#/templates/workflow_run
      unique_key: gh-run-f2
      id: 2
      run_number: 2
    - $ref: ../templates/github_ci.yaml#/templates/workflow_run
      unique_key: gh-run-f3
      id: 3
      run_number: 3
      run_attempt: 2
    - $ref: ../templates/github_ci.yaml#/templates/workflow_run
      unique_key: gh-run-f4
      id: 4
      run_number: 4
      conclusion: failure
