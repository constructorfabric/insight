# Reusable GitLab bronze records for the git-domain fixture. Commit line stats
# come from the commit's own stats fields; per-file rows carry no object ids
# (the GitLab diff API reports none). project_key / repo_slug resolve through
# the projects row. Missing schema columns pad to null.
templates:
  base:
    _airbyte_raw_id: "00000000-0000-0000-0000-000000000000"
    _airbyte_extracted_at: "2026-10-02T00:00:00"
    _airbyte_meta: "{}"
    _airbyte_generation_id: 0
    tenant_id: "{{ tenant }}"
    source_id: gitlab-test
    data_source: insight_gitlab

  project:
    $ref: "#/templates/base"
    id: 101
    name: platform
    path: platform
    path_with_namespace: acme/platform
    namespace_id: 1
    namespace_full_path: acme
    default_branch: main

  commit:
    $ref: "#/templates/base"
    project_id: 101
    id: null
    short_id: null
    title: change
    message: change
    author_name: null
    author_email: null
    authored_date: "2026-10-01T09:00:00Z"
    committer_name: null
    committer_email: null
    committed_date: "2026-10-01T09:00:00Z"
    parent_count: 1
    stats_additions: 0
    stats_deletions: 0
    stats_total: 0
    is_in_default_branch: true

  file_change:
    $ref: "#/templates/base"
    project_id: 101
    commit_sha: null
    old_path: null
    new_path: null
    new_file: false
    deleted_file: false
    renamed_file: false
    lines_added: 0
    lines_removed: 0
    diff_truncated: false

  # A merge request carries only its author's username; this row is what turns
  # that into an address.
  user:
    $ref: "#/templates/base"
    id: null
    username: null
    name: null
    state: active
    email: null
    public_email: ""
    bot: false

  merge_request:
    $ref: "#/templates/base"
    project_id: 101
    iid: null
    id: null
    title: change
    description: body
    state: merged
    draft: false
    author_id: null
    author_username: null
    source_branch: feature
    target_branch: main
    created_at: "2026-10-01T08:00:00Z"
    updated_at: "2026-10-01T13:00:00Z"
    merged_at: null
    closed_at: null
    sha: null
    merge_commit_sha: null
    squash: false
    merge_status: can_be_merged
    user_notes_count: 0
