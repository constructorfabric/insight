# Reusable GitLab bronze records for the git-domain fixture. Commit and
# file-change rows come from the git-cli-proxy and carry their own counts and
# object ids; the project, the merge request and its children come from the
# vendor API. project_key / repo_slug resolve through repo_path on the proxy
# rows and through the projects row on the merge-request rows. Missing schema
# columns pad to null.
templates:
  base:
    _airbyte_raw_id: "00000000-0000-0000-0000-000000000000"
    _airbyte_extracted_at: "2026-10-02T00:00:00"
    _airbyte_meta: "{}"
    _airbyte_generation_id: 0
    tenant_id: "{{ tenant }}"
    source_id: gitlab-test
    data_source: insight_gitlab
    collected_at: "2026-10-02T00:00:00Z"

  project:
    $ref: "#/templates/base"
    id: 101
    name: platform
    path: platform
    path_with_namespace: acme/platform
    namespace_id: 1
    namespace_full_path: acme
    namespace_kind: group
    default_branch: main
    visibility: private
    archived: false
    is_fork: false
    http_url_to_repo: https://gitlab.example.com/acme/platform.git
    last_activity_at: "2026-10-01T13:00:00.000+00:00"

  commit:
    $ref: "#/templates/base"
    project_id: 101
    repository: https://gitlab.example.com/acme/platform.git
    repo_path: acme/platform
    sha: null
    message: change
    authored_date: "2026-10-01T09:00:00Z"
    committed_date: "2026-10-01T09:00:00Z"
    author_name: null
    author_email: null
    committer_name: null
    committer_email: null
    parent_hashes: "[\"parent\"]"
    is_merge: false
    additions: 0
    deletions: 0
    changed_files: 0
    is_in_default_branch: true

  file_change:
    $ref: "#/templates/base"
    project_id: 101
    repository: https://gitlab.example.com/acme/platform.git
    repo_path: acme/platform
    sha: null
    committed_date: "2026-10-01T09:00:00Z"
    filename: null
    status: modified
    additions: 0
    deletions: 0
    changes: 0
    is_binary: false

  # A merge request carries its author's account, never an address; this row
  # is what turns the account into one.
  user:
    $ref: "#/templates/base"
    id: null
    username: null
    name: null
    state: active
    email: null
    public_email: ""
    commit_email: ""
    bot: false

  # The merge request <-> commit link. Its own author fields are the commit's,
  # not the request author's — the two are different identities.
  merge_request_commit:
    $ref: "#/templates/base"
    project_id: 101
    mr_iid: null
    mr_updated_at: "2026-10-01T13:00:00.000+00:00"
    sha: null
    short_id: null
    title: change
    message: change
    author_name: null
    author_email: null
    authored_date: "2026-10-01T08:30:00.000+00:00"
    committer_name: null
    committer_email: null
    committed_date: "2026-10-01T08:30:00.000+00:00"
    parent_ids: "[]"

  merge_request:
    $ref: "#/templates/base"
    project_id: 101
    iid: null
    id: null
    title: change
    description: body
    state: merged
    draft: false
    author_id: null
    author_username: null
    author_name: null
    assignee_ids: "[]"
    reviewers: "[]"
    labels: "[]"
    source_branch: feature
    target_branch: main
    created_at: "2026-10-01T08:00:00.000+00:00"
    updated_at: "2026-10-01T13:00:00.000+00:00"
    merged_at: null
    closed_at: null
    sha: null
    merge_commit_sha: null
    squash_commit_sha: ""
    squash: false
    detailed_merge_status: not_open
    user_notes_count: 0

  # A merge-request note. `system: true` rows are GitLab's own log of the
  # request; the review verdicts among them are recognised by body.
  note:
    $ref: "#/templates/base"
    project_id: 101
    mr_iid: null
    mr_updated_at: "2026-10-01T13:00:00.000+00:00"
    id: null
    body: null
    type: null
    system: false
    internal: false
    resolvable: false
    resolved: false
    author_id: null
    author_username: null
    author_name: null
    created_at: null
    updated_at: null
