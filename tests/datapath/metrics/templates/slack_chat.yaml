    user_id: null
    email_address: null
    is_guest: false
    is_billable_seat: true
    is_active: true
    is_active_ios: false
    is_active_android: false
    is_active_desktop: true
    is_active_apps: false
    is_active_workflows: false
    is_active_slack_connect: false
    reactions_added_count: 0
