# Reusable Slack member-analytics records (bronze_slack.users_details). The base
# lists EVERY schema field; a test sets the member, the day and the counters.
templates:
  slack_user_day:
    _airbyte_raw_id: "00000000-0000-0000-0000-000000000000"
    _airbyte_extracted_at: "2030-01-01T00:00:00"
