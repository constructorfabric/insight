# Reusable calendar-event records (bronze_m365.calendar_events). The base lists
# EVERY schema field; a test sets the event under test (id, unique_key, times,
# response and flags). The defaults describe an accepted, busy, timed meeting read
# by the sync of 2026-12-31, whose window is 2026-12-04 .. 2026-12-30.
templates:
  m365_calendar_event:
    _airbyte_raw_id: "00000000-0000-0000-0000-000000000000"
    _airbyte_extracted_at: "2026-12-31T02:00:00"
    _airbyte_meta: "{}"
    _airbyte_generation_id: 0
    id: null
    iCalUId: null
    type: singleInstance
    isAllDay: false
    isCancelled: false
    isOrganizer: false
    showAs: busy
    response: accepted
    start_time: null
    end_time: null
    other_invitees: 1
    user_id: null
    userPrincipalName: null
    tenant_id: "{{ tenant }}"
    source_id: "m365-test"
    unique_key: null

  alice_event:
    $ref: "#/templates/m365_calendar_event"
    user_id: "00000000-0000-0000-0000-0000000000a1"
    userPrincipalName: alice@example.com
