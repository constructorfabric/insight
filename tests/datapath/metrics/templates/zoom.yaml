# Reusable Zoom records (bronze_zoom.meetings, bronze_zoom.participants).
# Bases list every schema field (unused = null). _airbyte_extracted_at sits in the future on purpose:
# zoom__meeting_sessions only stitches meetings extracted within its lookback window of now().
templates:
  zoom_meeting:
    _airbyte_raw_id: "00000000-0000-0000-0000-000000000000"
    _airbyte_extracted_at: "2030-01-01T00:00:00"
    _airbyte_meta: "{}"
    _airbyte_generation_id: 0
    uuid: null
    id: null
    topic: null
    host: null
    email: null
    user_type: null
    start_time: null
    end_time: null
    duration: null
    participants: null
    has_pstn: null
    has_archiving: null
    has_voip: null
    has_3rd_party_audio: null
    has_video: null
    has_screen_share: null
    has_recording: null
    has_sip: null
    dept: null
    has_poll: null
    has_qa: null
    has_survey: null
    session_key: null
    audio_quality: null
    has_manual_captions: null
    has_automated_captions: null
    has_meeting_summary: null
    avg_jointime_cost: null
    tenant_id: "{{ tenant }}"
    source_id: "zoom-test"
    unique_key: null
    video_quality: null
    screen_share_quality: null

  zoom_participant:
    _airbyte_raw_id: "00000000-0000-0000-0000-000000000000"
    _airbyte_extracted_at: "2030-01-01T00:00:00"
    _airbyte_meta: "{}"
    _airbyte_generation_id: 0
    version: null
    id: null
    user_id: null
    participant_uuid: null
