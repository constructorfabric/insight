    - { $ref: ../templates/zoom.yaml#/templates/zoom_participant, unique_key: zp-guest-m111-b, meeting_uuid: m111-b, participant_uuid: g-m111-b, user_name: Guest, join_time: "2026-12-10T10:32:00Z", leave_time: "2026-12-10T11:00:00Z" }
    - { $ref: ../templates/zoom.yaml#/templates/zoom_participant, unique_key: zp-guest-m222, meeting_uuid: m222, participant_uuid: g-m222, user_name: Guest, join_time: "2026-12-10T14:00:00Z", leave_time: "2026-12-10T14:30:00Z" }
    - { $ref: ../templates/zoom.yaml#/templates/zoom_participant, unique_key: zp-guest-m333-a, meeting_uuid: m333-a, participant_uuid: g-m333-a, user_name: Guest, join_time: "2026-12-11T09:00:00Z", leave_time: "2026-12-11T09:30:00Z" }
    - { $ref: ../templates/zoom.yaml#/templates/zoom_participant, unique_key: zp-guest-m333-b, meeting_uuid: m333-b, participant_uuid: g-m333-b, user_name: Guest, join_time: "2026-12-11T09:40:00Z", leave_time: "2026-12-11T10:00:00Z" }
    - { $ref: ../templates/zoom.yaml#/templates/zoom_participant, unique_key: zp-guest-m444, meeting_uuid: m444, participant_uuid: g-m444, user_name: Guest, join_time: "2026-12-31T23:30:00Z", leave_time: "2027-01-01T00:20:00Z" }
