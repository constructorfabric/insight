    - { $ref: ../templates/m365_calendar.yaml#/templates/alice_event, id: e15, unique_key: cal-alice-e15, start_time: "2026-12-15T10:00:00.0000000", end_time: "2026-12-15T11:00:00.0000000" }
    - { $ref: ../templates/m365_calendar.yaml#/templates/alice_event, id: e15b, unique_key: cal-alice-e15b, start_time: "2026-12-15T11:30:00.0000000", end_time: "2026-12-15T12:30:00.0000000" }
    - { $ref: ../templates/m365_calendar.yaml#/templates/alice_event, id: e16, unique_key: cal-alice-e16, start_time: "2026-12-16T08:00:00.0000000", end_time: "2026-12-16T16:00:00.0000000" }
    - { $ref: ../templates/m365_calendar.yaml#/templates/alice_event, id: e17, unique_key: cal-alice-e17, start_time: "2026-12-17T23:00:00.0000000", end_time: "2026-12-18T00:00:00.0000000" }
    - { $ref: ../templates/m365_calendar.yaml#/templates/alice_event, id: e18, unique_key: cal-alice-e18, response: organizer, isOrganizer: true, other_invitees: null, start_time: "2026-12-21T09:00:00.0000000", end_time: "2026-12-21T10:00:00.0000000" }
    - { $ref: ../templates/m365_calendar.yaml#/templates/alice_event, id: e19, unique_key: cal-alice-e19, userPrincipalName: Alice@Example.com, start_time: "2026-12-22T09:00:00.0000000", end_time: "2026-12-22T10:00:00.0000000" }
