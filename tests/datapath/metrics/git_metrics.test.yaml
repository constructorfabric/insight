spec_version: 1
description: "Unified Git metrics cover authored commits, file categories, pull requests, cohort merge rate, medians, and histograms."

bronze:
  bronze_bamboohr.employees:
    - $ref: templates/people.yaml#/templates/alice
    - $ref: templates/people.yaml#/templates/bob
    - $ref: templates/people.yaml#/templates/carol
    - $ref: templates/people.yaml#/templates/dave
    - $ref: templates/people.yaml#/templates/erin
    - {$ref: templates/people.yaml#/templates/bamboohr_employee, id: e006, unique_key: bamboohr-test-e006, firstName: Frank, lastName: Zeta, displayName: Frank Zeta, workEmail: frank@example.com, department: Quality}
  bronze_github.commits:
    # Commit stats agree with the file-change rows below, so the commit sizes
    # are additions plus deletions: 12, 24, 36, 48, 60 — and erin's second
    # commit (no file changes collected) is 50.
    - {$ref: templates/git_activity.yaml#/templates/commit, unique_key: commit-alice, sha: hash-alice, author_name: alice, author_email: alice@example.com, committer_name: alice, committer_email: alice@example.com, additions: 10, deletions: 2}
    - {$ref: templates/git_activity.yaml#/templates/commit, unique_key: commit-bob, sha: hash-bob, author_name: bob, author_email: bob@example.com, committer_name: bob, committer_email: bob@example.com, additions: 20, deletions: 4}
    - {$ref: templates/git_activity.yaml#/templates/commit, unique_key: commit-carol, sha: hash-carol, author_name: carol, author_email: carol@example.com, committer_name: carol, committer_email: carol@example.com, additions: 30, deletions: 6}
    - {$ref: templates/git_activity.yaml#/templates/commit, unique_key: commit-dave, sha: hash-dave, author_name: dave, author_email: dave@example.com, committer_name: dave, committer_email: dave@example.com, additions: 40, deletions: 8}
    - {$ref: templates/git_activity.yaml#/templates/commit, unique_key: commit-erin, sha: hash-erin, author_name: erin, author_email: erin@example.com, committer_name: erin, committer_email: erin@example.com, additions: 50, deletions: 10}
    - {$ref: templates/git_activity.yaml#/templates/commit, unique_key: commit-erin-second, repository: "https://github.com/constructor/example.git", sha: hash-erin-second, author_name: erin, author_email: erin@example.com, committer_name: erin, committer_email: erin@example.com, additions: 50}
  bronze_github.file_changes:
    - {$ref: templates/git_activity.yaml#/templates/file_change, unique_key: file-alice, sha: hash-alice, additions: 10, deletions: 2}
    - {$ref: templates/git_activity.yaml#/templates/file_change, unique_key: file-bob, sha: hash-bob, additions: 20, deletions: 4}
    - {$ref: templates/git_activity.yaml#/templates/file_change, unique_key: file-carol, sha: hash-carol, additions: 30, deletions: 6}
    - {$ref: templates/git_activity.yaml#/templates/file_change, unique_key: file-dave, sha: hash-dave, additions: 40, deletions: 8}
    - {$ref: templates/git_activity.yaml#/templates/file_change, unique_key: file-erin, sha: hash-erin, additions: 50, deletions: 10}
  bronze_github.pull_requests:
    - {$ref: templates/git_activity.yaml#/templates/pull_request, unique_key: pr-alice, id: 1, number: 1, author_login: alice, closed_at: "2026-10-01T09:00:00Z", merged_at: "2026-10-01T09:00:00Z", merge_commit_sha: merge-alice}
    - {$ref: templates/git_activity.yaml#/templates/pull_request, unique_key: pr-bob, id: 2, number: 2, author_login: bob, closed_at: "2026-10-01T10:00:00Z", merged_at: "2026-10-01T10:00:00Z", merge_commit_sha: merge-bob}
    - {$ref: templates/git_activity.yaml#/templates/pull_request, unique_key: pr-carol, id: 3, number: 3, author_login: carol, closed_at: "2026-10-01T11:00:00Z", merged_at: "2026-10-01T11:00:00Z", merge_commit_sha: merge-carol}
    - {$ref: templates/git_activity.yaml#/templates/pull_request, unique_key: pr-dave, id: 4, number: 4, author_login: dave, closed_at: "2026-10-01T12:00:00Z", merged_at: "2026-10-01T12:00:00Z", merge_commit_sha: merge-dave}
    - {$ref: templates/git_activity.yaml#/templates/pull_request, unique_key: pr-erin, id: 5, number: 5, author_login: erin, closed_at: "2026-10-01T13:00:00Z", merged_at: "2026-10-01T13:00:00Z", merge_commit_sha: merge-erin}
    - {$ref: templates/git_activity.yaml#/templates/pull_request, unique_key: pr-frank, id: 6, number: 6, author_login: frank, state: open, closed_at: "", merged_at: "", merge_commit_sha: ""}
    - {$ref: templates/git_activity.yaml#/templates/pull_request, unique_key: pr-grace, id: 7, number: 7, author_login: grace, closed_at: "2026-10-01T09:00:00Z", merged_at: "2026-10-01T09:00:00Z", merge_commit_sha: merge-grace}
  bronze_github.pull_request_diff_stats:
    - {$ref: templates/git_activity.yaml#/templates/diff_stat, unique_key: ds-alice, pull_number: 1, additions: 10, author_email: alice@example.com}
    - {$ref: templates/git_activity.yaml#/templates/diff_stat, unique_key: ds-bob, pull_number: 2, additions: 20, author_email: bob@example.com}
    - {$ref: templates/git_activity.yaml#/templates/diff_stat, unique_key: ds-carol, pull_number: 3, additions: 30, author_email: carol@example.com}
    - {$ref: templates/git_activity.yaml#/templates/diff_stat, unique_key: ds-dave, pull_number: 4, additions: 40, author_email: dave@example.com}
    - {$ref: templates/git_activity.yaml#/templates/diff_stat, unique_key: ds-erin, pull_number: 5, additions: 50, author_email: erin@example.com}
    - {$ref: templates/git_activity.yaml#/templates/diff_stat, unique_key: ds-frank, pull_number: 6, additions: 10, author_email: frank@example.com}
    - {$ref: templates/git_activity.yaml#/templates/diff_stat, unique_key: ds-grace, pull_number: 7, additions: 10, author_email: grace@example.com}
  bronze_github.pull_request_reviews:
    - {$ref: templates/git_activity.yaml#/templates/pull_request_review, unique_key: review-alice, id: 101, pull_number: 1, author_login: reviewer-one, author_id: 101, submitted_at: "2026-10-01T08:30:00Z"}
    - {$ref: templates/git_activity.yaml#/templates/pull_request_review, unique_key: review-bob, id: 102, pull_number: 2, author_login: reviewer-one, author_id: 101, submitted_at: "2026-10-01T09:00:00Z"}
    - {$ref: templates/git_activity.yaml#/templates/pull_request_review, unique_key: review-carol, id: 103, pull_number: 3, author_login: reviewer-one, author_id: 101, submitted_at: "2026-10-01T09:30:00Z"}
    - {$ref: templates/git_activity.yaml#/templates/pull_request_review, unique_key: review-dave, id: 104, pull_number: 4, author_login: reviewer-one, author_id: 101, submitted_at: "2026-10-01T10:00:00Z"}
    - {$ref: templates/git_activity.yaml#/templates/pull_request_review, unique_key: review-erin-one, id: 105, pull_number: 5, author_login: reviewer-one, author_id: 101, submitted_at: "2026-10-01T10:30:00Z"}
    - {$ref: templates/git_activity.yaml#/templates/pull_request_review, unique_key: review-erin-two, id: 106, pull_number: 5, author_login: reviewer-two, author_id: 102, submitted_at: "2026-10-01T10:30:00Z"}
    - {$ref: templates/git_activity.yaml#/templates/pull_request_review, unique_key: review-grace, id: 107, pull_number: 7, author_login: reviewer-one, author_id: 101, submitted_at: "2026-10-01T10:00:00Z"}
