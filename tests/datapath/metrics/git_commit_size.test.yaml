spec_version: 1
description: >
  Metric: git.commit_size — median diff size (lines added plus removed) of a
  person's authored commits. Values chosen so the median is the ONLY aggregate
  that fits: erin's sizes over the window are {4, 6, 10, 30, 204} — median 10,
  mean 50.8, max 204 — so a mean, a sum, an extremum or a wrong percentile all
  fail the period assertion. No file-change rows are seeded, so every commit
  reports the size its own stats gave (the file-grain corrections have their
  own specs: content identity, work identity, uncollected file changes).

  Fixture:
    * erin, 2026-10-01, acme/api: sizes 10, 30, 204 — an odd pool whose median
      is 30, plus a merge commit (1000) that must contribute nothing.
    * erin, 2026-10-02, acme/web: sizes 4, 6 — an even pool; ClickHouse
      quantileExact(0.5) takes the UPPER middle element, so the day reads 6.
    * dave, 2026-10-01, acme/api: one commit whose bronze row carries no
      stats at all. Staging projects absent stats to zero, so the commit
      enters the median as 0 rather than abstaining.

  Cases: period median over both days, per-day timeseries medians, per-repo
  breakdown medians, deterministic histogram bins over erin's [4, 204], the
  stats-less commit reading 0.

bronze:
  bronze_bamboohr.employees:
    - $ref: templates/people.yaml#/templates/dave
    - $ref: templates/people.yaml#/templates/erin

  bronze_github.commits:
    # Day one, acme/api: {10, 30, 204}.
    - {$ref: templates/git_activity.yaml#/templates/commit, unique_key: cs-erin-a1, repository: "https://github.com/acme/api.git", sha: cs-a1, authored_date: "2026-10-01T09:00:00Z", committed_date: "2026-10-01T09:00:00Z", author_name: erin, author_email: erin@example.com, committer_name: erin, committer_email: erin@example.com, additions: 8, deletions: 2}
    - {$ref: templates/git_activity.yaml#/templates/commit, unique_key: cs-erin-a2, repository: "https://github.com/acme/api.git", sha: cs-a2, authored_date: "2026-10-01T10:00:00Z", committed_date: "2026-10-01T10:00:00Z", author_name: erin, author_email: erin@example.com, committer_name: erin, committer_email: erin@example.com, additions: 25, deletions: 5}
    - {$ref: templates/git_activity.yaml#/templates/commit, unique_key: cs-erin-a3, repository: "https://github.com/acme/api.git", sha: cs-a3, authored_date: "2026-10-01T11:00:00Z", committed_date: "2026-10-01T11:00:00Z", author_name: erin, author_email: erin@example.com, committer_name: erin, committer_email: erin@example.com, additions: 200, deletions: 4}
    # A merge commit with a huge diff: excluded from the pool entirely. If it
    # counted, the period median could not read 10.
    - {$ref: templates/git_activity.yaml#/templates/commit, unique_key: cs-erin-merge, repository: "https://github.com/acme/api.git", sha: cs-merge, authored_date: "2026-10-01T12:00:00Z", committed_date: "2026-10-01T12:00:00Z", author_name: erin, author_email: erin@example.com, committer_name: erin, committer_email: erin@example.com, additions: 900, deletions: 100, is_merge: true}
    # Day two, acme/web: {4, 6}.
    - {$ref: templates/git_activity.yaml#/templates/commit, unique_key: cs-erin-w1, repository: "https://github.com/acme/web.git", sha: cs-w1, authored_date: "2026-10-02T09:00:00Z", committed_date: "2026-10-02T09:00:00Z", author_name: erin, author_email: erin@example.com, committer_name: erin, committer_email: erin@example.com, additions: 3, deletions: 1}
    - {$ref: templates/git_activity.yaml#/templates/commit, unique_key: cs-erin-w2, repository: "https://github.com/acme/web.git", sha: cs-w2, authored_date: "2026-10-02T10:00:00Z", committed_date: "2026-10-02T10:00:00Z", author_name: erin, author_email: erin@example.com, committer_name: erin, committer_email: erin@example.com, additions: 5, deletions: 1}
    # dave: a commit whose source reported no line stats.
    - {$ref: templates/git_activity.yaml#/templates/commit, unique_key: cs-dave-nostats, repository: "https://github.com/acme/api.git", sha: cs-d1, authored_date: "2026-10-01T09:00:00Z", committed_date: "2026-10-01T09:00:00Z", author_name: dave, author_email: dave@example.com, committer_name: dave, committer_email: dave@example.com, additions: null, deletions: null}
