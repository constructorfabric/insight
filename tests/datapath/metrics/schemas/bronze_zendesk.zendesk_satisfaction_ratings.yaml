# Mirrors the bronze_zendesk.zendesk_satisfaction_ratings DDL in scripts/connectors-ddl/zendesk.sql.
schemas:
  bronze_zendesk.zendesk_satisfaction_ratings:
    $schema: http://json-schema.org/draft-07/schema#
    type: object
    additionalProperties: false
    properties:
      _airbyte_raw_id: { type: string }
      _airbyte_extracted_at: { type: string, format: date-time }
      _airbyte_meta: { type: string }
      _airbyte_generation_id: { type: integer }
      tenant_id: { type: [string, "null"] }
      source_id: { type: [string, "null"] }
      unique_key: { type: [string, "null"] }
      collected_at: { type: [string, "null"] }
      data_source: { type: [string, "null"] }
      rating_id: { type: [string, "null"] }
      ticket_id: { type: [string, "null"] }
      requester_id: { type: [string, "null"] }
      assignee_id: { type: [string, "null"] }
      group_id: { type: [string, "null"] }
      score: { type: [string, "null"] }
      comment: { type: [string, "null"] }
      reason: { type: [string, "null"] }
      created_at: { type: [string, "null"] }
      updated_at: { type: [string, "null"] }
