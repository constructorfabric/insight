# Mirrors the bronze_github.project_items DDL in scripts/connectors-ddl/github.sql.
schemas:
  bronze_github.project_items:
    $schema: http://json-schema.org/draft-07/schema#
    type: object
    additionalProperties: false
    properties:
      _airbyte_raw_id:
        type: string
      _airbyte_extracted_at:
        type: string
        format: date-time
      _airbyte_meta:
        type: string
      _airbyte_generation_id:
        type: integer
      unique_key: &id001
        type: string
      tenant_id: *id001
      source_id: *id001
      data_source: *id001
      collected_at: *id001
      project_id: *id001
      project_number: &id002
        type: integer
      item_id: *id001
      item_database_id: *id001
      item_type: *id001
      content_type: *id001
      content_number: *id002
      content_repo_full_name: *id001
      is_archived:
        type: boolean
      creator_login: *id001
      creator_id: *id002
      created_at: *id001
      updated_at: *id001
      field_values_json: *id001
