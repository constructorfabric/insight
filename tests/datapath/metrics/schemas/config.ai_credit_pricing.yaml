# Operator-authored credit pricing; DDL owned by the create_ai_config_tables macro.
schemas:
  config.ai_credit_pricing:
    $schema: http://json-schema.org/draft-07/schema#
    type: object
    additionalProperties: false
    required:
      - tenant_id
      - insight_source_id
      - source
      - credit_price_minor_units
      - billed_currency
      - native_minor_to_usd_cents_rate
    properties:
      tenant_id: &id001
        type: string
      insight_source_id: *id001
      source: *id001
      unique_key: *id001
      credit_price_minor_units:
        type: number
      billed_currency: *id001
      native_minor_to_usd_cents_rate:
        type: number
      is_deleted:
        type: integer
      note: *id001
      recorded_by: *id001
      _version:
        type: string
        format: date-time
