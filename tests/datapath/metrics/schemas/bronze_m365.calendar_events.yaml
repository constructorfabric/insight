# Reusable JSON schema for the table (all real fields). Resolved by table name.
# Mirrors the bronze_m365.calendar_events table destination-clickhouse creates
# from the connector's calendar_events stream.
schemas:
  bronze_m365.calendar_events:
    $schema: http://json-schema.org/draft-07/schema#
    type: object
    additionalProperties: false
    properties:
      _airbyte_raw_id: {type: string}
      _airbyte_extracted_at: {type: string, format: date-time}
      _airbyte_meta: {type: string}
      _airbyte_generation_id: {type: integer}
      id: {type: [string, "null"]}
      iCalUId: {type: [string, "null"]}
      type: {type: [string, "null"]}
      isAllDay: {type: [boolean, "null"]}
      isCancelled: {type: [boolean, "null"]}
      isOrganizer: {type: [boolean, "null"]}
      showAs: {type: [string, "null"]}
      response: {type: [string, "null"]}
      start_time: {type: [string, "null"]}
      end_time: {type: [string, "null"]}
      other_invitees: {type: [integer, "null"]}
      user_id: {type: [string, "null"]}
      userPrincipalName: {type: [string, "null"]}
      tenant_id: {type: [string, "null"]}
      source_id: {type: [string, "null"]}
      unique_key: {type: string}
