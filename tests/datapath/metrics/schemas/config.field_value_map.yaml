# Operator-authored field-value decisions; DDL owned by the create_task_config_tables macro.
schemas:
  config.field_value_map:
    $schema: http://json-schema.org/draft-07/schema#
    type: object
    additionalProperties: false
    properties:
      tenant_id: &id001
        type: string
      insight_source_id: *id001
      data_source: *id001
      field: *id001
      source_key: *id001
      valid_from:
        type: string
        format: date-time
      recorded_at:
        type: string
        format: date-time
      unique_key: *id001
      target_value: *id001
      display_name: *id001
      is_deleted:
        type: integer
      note: *id001
      recorded_by: *id001
      _version:
        type: string
        format: date-time
