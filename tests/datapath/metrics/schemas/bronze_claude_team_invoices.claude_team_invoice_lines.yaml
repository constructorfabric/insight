# JSON schema for bronze_claude_team_invoices.claude_team_invoice_lines (all real columns).
# Mirrors the CDK connector's stream schema
# (connectors/ai/claude-team-invoices/source_claude_team_invoices/schemas/) plus the 4
# _airbyte_* CDK columns. Amounts are ALREADY minor units (cents) — Silver maps them
# through with no x100.
schemas:
  bronze_claude_team_invoices.claude_team_invoice_lines:
    $schema: http://json-schema.org/draft-07/schema#
    type: object
    additionalProperties: false
    properties:
      _airbyte_raw_id: { type: string }
      _airbyte_extracted_at: { type: string, format: date-time }
      _airbyte_meta: { type: string }
      _airbyte_generation_id: { type: integer }
      tenant_id: { type: [string, "null"] }
      source_id: { type: [string, "null"] }
      unique_key: { type: string }
      collected_at: { type: [string, "null"] }
      data_source: { type: [string, "null"] }
      chain_status: { type: [string, "null"] }
      invoice_ref: { type: [string, "null"] }
      invoice_id: { type: [string, "null"] }
      invoice_status: { type: [string, "null"] }
      invoice_created_ts: { type: [number, "null"] }
      invoice_due_date_ts: { type: [number, "null"] }
      invoice_currency: { type: [string, "null"] }
      invoice_total: { type: [number, "null"] }
      invoice_total_excluding_tax: { type: [number, "null"] }
      invoice_num_seats: { type: [number, "null"] }
      invoice_payment_intent: { type: [string, "null"] }
      line_id: { type: [string, "null"] }
      description: { type: [string, "null"] }
      product_name: { type: [string, "null"] }
      tier_label: { type: [string, "null"] }
      price_id: { type: [string, "null"] }
      product_id: { type: [string, "null"] }
      category: { type: [string, "null"] }
      is_proration: { type: [boolean, "null"] }
      amount: { type: [number, "null"] }
      currency: { type: [string, "null"] }
      quantity: { type: [number, "null"] }
      unit_amount: { type: [number, "null"] }
      seat_unit_amount: { type: [number, "null"] }
      period_start_ts: { type: [number, "null"] }
      period_end_ts: { type: [number, "null"] }
