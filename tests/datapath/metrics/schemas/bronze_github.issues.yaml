# Mirrors the bronze_github.issues DDL in scripts/connectors-ddl/github.sql.
schemas:
  bronze_github.issues:
    $schema: http://json-schema.org/draft-07/schema#
    type: object
    additionalProperties: false
    properties:
      _airbyte_raw_id:
        type: string
      _airbyte_extracted_at:
        type: string
        format: date-time
      _airbyte_meta:
        type: string
      _airbyte_generation_id:
        type: integer
      unique_key: &id001
        type: string
      tenant_id: *id001
      source_id: *id001
      data_source: *id001
      collected_at: *id001
      id: &id002
        type: integer
      number: *id002
      repo_full_name: *id001
      state: *id001
      state_reason: &id003
        type:
        - string
        - 'null'
      title: *id001
      author_login: *id001
      author_id: *id002
      assignee_logins: *id001
      assignee_ids: *id001
      label_names: *id001
      issue_type: *id001
      issue_type_id: *id001
      closed_by_login: *id001
      closed_by_id: *id002
      created_at: *id001
      updated_at: *id001
      closed_at: *id003
      issue_field_values_json: *id001
