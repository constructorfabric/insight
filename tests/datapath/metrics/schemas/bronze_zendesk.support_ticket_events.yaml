# Mirrors the bronze_zendesk.support_ticket_events DDL in scripts/connectors-ddl/zendesk.sql.
schemas:
  bronze_zendesk.support_ticket_events:
    $schema: http://json-schema.org/draft-07/schema#
    type: object
    additionalProperties: false
    properties:
      _airbyte_raw_id: { type: string }
      _airbyte_extracted_at: { type: string, format: date-time }
      _airbyte_meta: { type: string }
      _airbyte_generation_id: { type: integer }
      tenant_id: { type: [string, "null"] }
      source_id: { type: [string, "null"] }
      unique_key: { type: [string, "null"] }
      collected_at: { type: [string, "null"] }
      data_source: { type: [string, "null"] }
      audit_id: { type: [string, "null"] }
      ticket_id: { type: [string, "null"] }
      author_id: { type: [string, "null"] }
      created_at: { type: [string, "null"] }
      events: { type: [string, "null"] }
