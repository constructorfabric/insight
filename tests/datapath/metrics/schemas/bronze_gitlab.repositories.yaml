# Derived from the bronze_gitlab DDL snapshot. Array/object fields
# land in bronze as JSON strings (the staging models toString() them), so they
# are typed string here.
schemas:
  bronze_gitlab.repositories:
    $schema: http://json-schema.org/draft-07/schema#
    type: object
    additionalProperties: false
    properties:
      unique_key: { type: [string, "null"] }
      tenant_id: { type: [string, "null"] }
      source_id: { type: [string, "null"] }
      data_source: { type: [string, "null"] }
      collected_at: { type: [string, "null"] }
      id: { type: [integer, "null"] }
      name: { type: [string, "null"] }
      path: { type: [string, "null"] }
      path_with_namespace: { type: [string, "null"] }
      namespace_id: { type: [integer, "null"] }
      namespace_full_path: { type: [string, "null"] }
      namespace_kind: { type: [string, "null"] }
      description: { type: [string, "null"] }
      default_branch: { type: [string, "null"] }
      visibility: { type: [string, "null"] }
      archived: { type: [boolean, "null"] }
      empty_repo: { type: [boolean, "null"] }
      issues_enabled: { type: [boolean, "null"] }
      wiki_enabled: { type: [boolean, "null"] }
      is_fork: { type: [boolean, "null"] }
      forked_from_project_path: { type: [string, "null"] }
      mirror: { type: [boolean, "null"] }
      topics: { type: [string, "null"] }
      star_count: { type: [integer, "null"] }
      forks_count: { type: [integer, "null"] }
      open_issues_count: { type: [integer, "null"] }
      repository_size: { type: [integer, "null"] }
      http_url_to_repo: { type: [string, "null"] }
      web_url: { type: [string, "null"] }
      created_at: { type: [string, "null"] }
      last_activity_at: { type: [string, "null"] }
      _airbyte_raw_id: { type: string }
      _airbyte_extracted_at: { type: string, format: date-time }
      _airbyte_meta: { type: string }
      _airbyte_generation_id: { type: integer }
