spec_version: 1
description: >-
  The day a commit counts on is the day its work was written, not the day the
  commit last took its current shape. Rebase, amend and cherry-pick rewrite the
  committer date and keep the author date, so a branch rebased before merging
  carries one committer date across every commit on it — and a metric dated by
  the committer reads a week of work as a single day.

  Alice writes on three separate days and rebases on the fourth: her three
  commits share one committer date and keep three author dates. Bob writes
  three commits on one day and never rebases, so both dates agree throughout.
  They must not come out the same: alice has three active days, bob has one.

  Guards #3153. Every git connector maps the author date, so the same shape
  holds for gitlab and bitbucket.

bronze:
  bronze_bamboohr.employees:
    - $ref: ../templates/people.yaml#/templates/alice
    - $ref: ../templates/people.yaml#/templates/bob
    - $ref: ../templates/people.yaml#/templates/carol
  bronze_github.commits:
    # Written on the 1st, 2nd and 3rd; all three rebased onto main on the 4th.
    - {$ref: ../templates/git_activity.yaml#/templates/commit, unique_key: c-alice-1, sha: sha-alice-1, author_name: alice, author_email: alice@example.com, committer_name: alice, committer_email: alice@example.com, additions: 10, authored_date: "2026-10-01T09:00:00Z", committed_date: "2026-10-04T18:00:00Z"}
    - {$ref: ../templates/git_activity.yaml#/templates/commit, unique_key: c-alice-2, sha: sha-alice-2, author_name: alice, author_email: alice@example.com, committer_name: alice, committer_email: alice@example.com, additions: 10, authored_date: "2026-10-02T09:00:00Z", committed_date: "2026-10-04T18:00:00Z"}
    - {$ref: ../templates/git_activity.yaml#/templates/commit, unique_key: c-alice-3, sha: sha-alice-3, author_name: alice, author_email: alice@example.com, committer_name: alice, committer_email: alice@example.com, additions: 10, authored_date: "2026-10-03T09:00:00Z", committed_date: "2026-10-04T18:00:00Z"}
    # Three commits, one day, no rewrite: the two dates agree.
    - {$ref: ../templates/git_activity.yaml#/templates/commit, unique_key: c-bob-1, sha: sha-bob-1, author_name: bob, author_email: bob@example.com, committer_name: bob, committer_email: bob@example.com, additions: 10, authored_date: "2026-10-01T09:00:00Z", committed_date: "2026-10-01T09:00:00Z"}
    - {$ref: ../templates/git_activity.yaml#/templates/commit, unique_key: c-bob-2, sha: sha-bob-2, author_name: bob, author_email: bob@example.com, committer_name: bob, committer_email: bob@example.com, additions: 10, authored_date: "2026-10-01T10:00:00Z", committed_date: "2026-10-01T10:00:00Z"}
    - {$ref: ../templates/git_activity.yaml#/templates/commit, unique_key: c-bob-3, sha: sha-bob-3, author_name: bob, author_email: bob@example.com, committer_name: bob, committer_email: bob@example.com, additions: 10, authored_date: "2026-10-01T11:00:00Z", committed_date: "2026-10-01T11:00:00Z"}
    # A cherry-pick keeps the author date, so the copy and its original tie on
    # it. Only the committer date still tells them apart, and the earlier
    # carrier must win — otherwise the survivor is picked by comparing hashes.
    # The branch flags differ so the winner is observable: whichever carrier
    # survives brings its own branch scope, and that is the only thing the two
    # do not share.
    - {$ref: ../templates/git_activity.yaml#/templates/commit, unique_key: c-carol-orig, repository: "https://github.com/constructor/pick.git", sha: zzz-carol-orig, author_name: carol, author_email: carol@example.com, committer_name: carol, committer_email: carol@example.com, additions: 7, authored_date: "2026-10-01T09:00:00Z", committed_date: "2026-10-01T09:00:00Z", patch_id: patch-carol, is_in_default_branch: false}
    - {$ref: ../templates/git_activity.yaml#/templates/commit, unique_key: c-carol-copy, repository: "https://github.com/constructor/pick.git", sha: aaa-carol-copy, author_name: carol, author_email: carol@example.com, committer_name: carol, committer_email: carol@example.com, additions: 7, authored_date: "2026-10-01T09:00:00Z", committed_date: "2026-10-03T09:00:00Z", patch_id: patch-carol, is_in_default_branch: true}
  bronze_github.file_changes:
    - {$ref: ../templates/git_activity.yaml#/templates/file_change, unique_key: f-alice-1, sha: sha-alice-1, filename: src/a1.rs, additions: 10}
    - {$ref: ../templates/git_activity.yaml#/templates/file_change, unique_key: f-alice-2, sha: sha-alice-2, filename: src/a2.rs, additions: 10}
    - {$ref: ../templates/git_activity.yaml#/templates/file_change, unique_key: f-alice-3, sha: sha-alice-3, filename: src/a3.rs, additions: 10}
    - {$ref: ../templates/git_activity.yaml#/templates/file_change, unique_key: f-bob-1, sha: sha-bob-1, filename: src/b1.rs, additions: 10}
    - {$ref: ../templates/git_activity.yaml#/templates/file_change, unique_key: f-bob-2, sha: sha-bob-2, filename: src/b2.rs, additions: 10}
    - {$ref: ../templates/git_activity.yaml#/templates/file_change, unique_key: f-bob-3, sha: sha-bob-3, filename: src/b3.rs, additions: 10}
    - {$ref: ../templates/git_activity.yaml#/templates/file_change, unique_key: f-carol-orig, sha: zzz-carol-orig, filename: src/c1.rs, additions: 7}
    - {$ref: ../templates/git_activity.yaml#/templates/file_change, unique_key: f-carol-copy, sha: aaa-carol-copy, filename: src/c1.rs, additions: 7}
