spec_version: 1
description: >
  GitLab git metrics. Seeds the connector's bronze and drives it through the
  gitlab__commits / __file_changes staging models into the shared git classes.
  Assertions use the `source=gitlab` breakdown so they are unaffected by any
  other git connector seeded in the suite.

  Fixture covers:
    * commit line stats come from the proxy's per-commit counts, so commit
      size is additions plus deletions per commit;
    * a merge commit is excluded from the commit count and from the size
      pool;
    * the same path changed on two commits with DIFFERENT object ids is two
      distinct transitions: both commits keep their full sizes and both
      commits' lines count;
    * per-file lines feed Lines added / Lines removed through the file rows.

  Sizes: {12, 0, 8, 8} — median 8. Lines added: 10 + 7 + 7 = 24; removed:
  2 + 1 + 1 = 4.

bronze:
  bronze_bamboohr.employees:
    - $ref: ../templates/people.yaml#/templates/erin

  bronze_gitlab.repositories:
    - {$ref: ../templates/gitlab_git.yaml#/templates/project, unique_key: "gl-proj:101"}

  bronze_gitlab.commits:
    # Counts and the file row agree: size 12.
    - {$ref: ../templates/gitlab_git.yaml#/templates/commit, unique_key: "gl-c:commit-a", sha: gl-commit-a, author_name: Erin Epsilon, author_email: erin@example.com, committer_name: Erin Epsilon, committer_email: erin@example.com, additions: 10, deletions: 2, changed_files: 1}
    # An empty diff: size 0, not absent.
    - {$ref: ../templates/gitlab_git.yaml#/templates/commit, unique_key: "gl-c:commit-b", sha: gl-commit-b, author_name: Erin Epsilon, author_email: erin@example.com, committer_name: Erin Epsilon, committer_email: erin@example.com}
    # A merge commit: excluded everywhere.
    - {$ref: ../templates/gitlab_git.yaml#/templates/commit, unique_key: "gl-c:commit-m", sha: gl-commit-m, author_name: Erin Epsilon, author_email: erin@example.com, committer_name: Erin Epsilon, committer_email: erin@example.com, is_merge: true, parent_hashes: "[\"p1\", \"p2\"]", additions: 500, deletions: 500, changed_files: 3}
    # The same path on two commits, each transition its own: each commit keeps
    # its own 8.
    - {$ref: ../templates/gitlab_git.yaml#/templates/commit, unique_key: "gl-c:commit-c1", sha: gl-commit-c1, authored_date: "2026-10-01T10:00:00Z", committed_date: "2026-10-01T10:00:00Z", author_name: Erin Epsilon, author_email: erin@example.com, committer_name: Erin Epsilon, committer_email: erin@example.com, additions: 7, deletions: 1, changed_files: 1}
    - {$ref: ../templates/gitlab_git.yaml#/templates/commit, unique_key: "gl-c:commit-c2", sha: gl-commit-c2, authored_date: "2026-10-01T11:00:00Z", committed_date: "2026-10-01T11:00:00Z", author_name: Erin Epsilon, author_email: erin@example.com, committer_name: Erin Epsilon, committer_email: erin@example.com, additions: 7, deletions: 1, changed_files: 1}

  bronze_gitlab.file_changes:
    - {$ref: ../templates/gitlab_git.yaml#/templates/file_change, unique_key: "gl-fc:commit-a:a.py", sha: gl-commit-a, filename: src/a.py, additions: 10, deletions: 2, changes: 12, pre_image_oid: oid-a0, post_image_oid: oid-a1}
    # Two transitions of one path, each from a different pre-image.
    - {$ref: ../templates/gitlab_git.yaml#/templates/file_change, unique_key: "gl-fc:commit-c1:c.py", sha: gl-commit-c1, committed_date: "2026-10-01T10:00:00Z", filename: src/c.py, additions: 7, deletions: 1, changes: 8, pre_image_oid: oid-c0, post_image_oid: oid-c1}
    - {$ref: ../templates/gitlab_git.yaml#/templates/file_change, unique_key: "gl-fc:commit-c2:c.py", sha: gl-commit-c2, committed_date: "2026-10-01T11:00:00Z", filename: src/c.py, additions: 7, deletions: 1, changes: 8, pre_image_oid: oid-c1, post_image_oid: oid-c2}
