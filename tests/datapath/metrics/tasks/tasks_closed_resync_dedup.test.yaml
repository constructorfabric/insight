spec_version: 1
description: >
  Unified tasks.closed coverage for re-synced issue snapshots. The latest
  extraction wins regardless of insertion order, identical snapshots count once,
  and a reopened issue is not counted as closed. Bob's DDP-5 extends the same
  rule to the bug subset: a Bug whose snapshot AND close event each arrive twice
  under fresh extraction stamps still scores bugs_fixed exactly once.
bronze:
  bronze_bamboohr.employees:
    - $ref: ../templates/people.yaml#/templates/alice
    - $ref: ../templates/people.yaml#/templates/bob

  bronze_jira.jira_user:
    - $ref: ../templates/jira_task.yaml#/templates/alice_user
    - $ref: ../templates/jira_task.yaml#/templates/bob_user

  bronze_jira.jira_statuses:
    - $ref: ../templates/jira_task.yaml#/templates/status_open
    - $ref: ../templates/jira_task.yaml#/templates/status_in_progress
    - $ref: ../templates/jira_task.yaml#/templates/status_closed

  bronze_jira.jira_issuetypes:
    - $ref: ../templates/jira_task.yaml#/templates/issuetype_task
    - $ref: ../templates/jira_task.yaml#/templates/issuetype_bug

  bronze_jira.jira_fields:
    - $ref: ../templates/jira_task.yaml#/templates/field_status
    - $ref: ../templates/jira_task.yaml#/templates/field_assignee
    - $ref: ../templates/jira_task.yaml#/templates/field_issuetype
    - $ref: ../templates/jira_task.yaml#/templates/field_duedate

  bronze_jira.jira_issue:
    # ── DDP-1: In Progress first, Closed re-extracted LATER → latest wins ──
    - $ref: ../templates/jira_task.yaml#/templates/jira_issue
      id: DDP-1
      jira_id: DDP-1
      unique_key: jira-test-DDP-1
      id_readable: DDP1
      created: "2026-12-21T09:00:00"
      _airbyte_extracted_at: "2026-12-26T00:00:00"
      custom_fields_json: '{"status":{"id":"3","name":"In Progress"},"issuetype":{"id":"10001","name":"Task"},"assignee":{"accountId":"alice-jira-acct","displayName":"Alice Alpha"}}'
    - $ref: ../templates/jira_task.yaml#/templates/jira_issue
      id: DDP-1
      jira_id: DDP-1
      unique_key: jira-test-DDP-1
      id_readable: DDP1
      created: "2026-12-21T09:00:00"
      _airbyte_extracted_at: "2026-12-27T00:00:00"
      custom_fields_json: '{"status":{"id":"6","name":"Closed"},"issuetype":{"id":"10001","name":"Task"},"assignee":{"accountId":"alice-jira-acct","displayName":"Alice Alpha"}}'

    # ── DDP-2: byte-identical re-sync duplicate → must count ONCE ──
    - $ref: ../templates/jira_task.yaml#/templates/jira_issue
      id: DDP-2
      jira_id: DDP-2
      unique_key: jira-test-DDP-2
      id_readable: DDP2
      created: "2026-12-22T09:00:00"
      _airbyte_extracted_at: "2026-12-26T00:00:00"
      custom_fields_json: '{"status":{"id":"6","name":"Closed"},"issuetype":{"id":"10001","name":"Task"},"assignee":{"accountId":"alice-jira-acct","displayName":"Alice Alpha"}}'
    - $ref: ../templates/jira_task.yaml#/templates/jira_issue
      id: DDP-2
      jira_id: DDP-2
      unique_key: jira-test-DDP-2
      id_readable: DDP2
      created: "2026-12-22T09:00:00"
      _airbyte_extracted_at: "2026-12-26T00:00:00"
      custom_fields_json: '{"status":{"id":"6","name":"Closed"},"issuetype":{"id":"10001","name":"Task"},"assignee":{"accountId":"alice-jira-acct","displayName":"Alice Alpha"}}'

    # ── DDP-3: LATEST extraction (Closed) inserted FIRST, older In Progress
    #    inserted after it → dedup must key on _airbyte_extracted_at, not on
    #    physical insert order ──
    - $ref: ../templates/jira_task.yaml#/templates/jira_issue
      id: DDP-3
      jira_id: DDP-3
      unique_key: jira-test-DDP-3
      id_readable: DDP3
      created: "2026-12-23T09:00:00"
      _airbyte_extracted_at: "2026-12-28T00:00:00"
      custom_fields_json: '{"status":{"id":"6","name":"Closed"},"issuetype":{"id":"10001","name":"Task"},"assignee":{"accountId":"alice-jira-acct","displayName":"Alice Alpha"}}'
    - $ref: ../templates/jira_task.yaml#/templates/jira_issue
      id: DDP-3
      jira_id: DDP-3
      unique_key: jira-test-DDP-3
      id_readable: DDP3
      created: "2026-12-23T09:00:00"
      _airbyte_extracted_at: "2026-12-26T00:00:00"
      custom_fields_json: '{"status":{"id":"3","name":"In Progress"},"issuetype":{"id":"10001","name":"Task"},"assignee":{"accountId":"alice-jira-acct","displayName":"Alice Alpha"}}'

    # ── DDP-4: was Closed, the LATEST extraction re-opens it → the stale
    #    Closed row must NOT resurrect a close (min-extraction dedup would) ──
    - $ref: ../templates/jira_task.yaml#/templates/jira_issue
      id: DDP-4
      jira_id: DDP-4
      unique_key: jira-test-DDP-4
      id_readable: DDP4
      created: "2026-12-24T09:00:00"
      _airbyte_extracted_at: "2026-12-26T00:00:00"
      custom_fields_json: '{"status":{"id":"6","name":"Closed"},"issuetype":{"id":"10001","name":"Task"},"assignee":{"accountId":"alice-jira-acct","displayName":"Alice Alpha"}}'
    - $ref: ../templates/jira_task.yaml#/templates/jira_issue
      id: DDP-4
      jira_id: DDP-4
      unique_key: jira-test-DDP-4
      id_readable: DDP4
      created: "2026-12-24T09:00:00"
      _airbyte_extracted_at: "2026-12-27T00:00:00"
      custom_fields_json: '{"status":{"id":"3","name":"In Progress"},"issuetype":{"id":"10001","name":"Task"},"assignee":{"accountId":"alice-jira-acct","displayName":"Alice Alpha"}}'

    # ── DDP-5: bob's Bug re-synced whole — the snapshot arrives twice with
    #    fresh raw ids and extraction stamps → bugs_fixed must count it once ──
    - $ref: ../templates/jira_task.yaml#/templates/jira_issue
      id: DDP-5
      jira_id: DDP-5
      unique_key: jira-test-DDP-5
      id_readable: DDP5
      created: "2026-12-25T09:00:00"
      _airbyte_raw_id: "00000000-0000-0000-0000-000000000501"
      _airbyte_extracted_at: "2026-12-27T00:00:00"
      custom_fields_json: '{"status":{"id":"6","name":"Closed"},"issuetype":{"id":"10000","name":"Bug"},"assignee":{"accountId":"bob-jira-acct","displayName":"Bob Beta"}}'
    - $ref: ../templates/jira_task.yaml#/templates/jira_issue
      id: DDP-5
      jira_id: DDP-5
      unique_key: jira-test-DDP-5
      id_readable: DDP5
      created: "2026-12-25T09:00:00"
      _airbyte_raw_id: "00000000-0000-0000-0000-000000000502"
      _airbyte_extracted_at: "2026-12-28T00:00:00"
      custom_fields_json: '{"status":{"id":"6","name":"Closed"},"issuetype":{"id":"10000","name":"Bug"},"assignee":{"accountId":"bob-jira-acct","displayName":"Bob Beta"}}'

  bronze_jira.jira_issue_history:
    # ── DDP-5's close event, re-synced the same way as its snapshot ──
    - $ref: ../templates/jira_task.yaml#/templates/jira_history
      id_readable: DDP5
      changelog_id: "58001"
      unique_key: jira-test-DDP5-58001
      created_at: "2026-12-26T14:00:00.000+0000"
      author_account_id: bob-jira-acct
      _airbyte_raw_id: "00000000-0000-0000-0000-000000000503"
      _airbyte_extracted_at: "2026-12-27T00:00:00"
      items: '[{"field":"Status","fieldId":"status","fromString":"In Progress","from":"3","toString":"Closed","to":"6"}]'
    - $ref: ../templates/jira_task.yaml#/templates/jira_history
      id_readable: DDP5
      changelog_id: "58001"
      unique_key: jira-test-DDP5-58001
      created_at: "2026-12-26T14:00:00.000+0000"
      author_account_id: bob-jira-acct
      _airbyte_raw_id: "00000000-0000-0000-0000-000000000504"
      _airbyte_extracted_at: "2026-12-28T00:00:00"
      items: '[{"field":"Status","fieldId":"status","fromString":"In Progress","from":"3","toString":"Closed","to":"6"}]'
