spec_version: 1
description: >
  Task Delivery - retracting a role binding for GITHUB, and what the field
  falls back to once it is gone.

  `config.task_field_roles` is bitemporal: `unique_key` carries `valid_from`
  and `recorded_at`, so withdrawing a binding writes a NEWER row carrying
  `is_deleted = 1` beside the one it withdraws, and nothing overwrites anything.

  The operator bound GitHub's `type` field to the `issuetype` role, then
  retracted that decision. GitHub defines issue fields per organization and
  carries a built-in default for `title` only, so nothing takes the retracted
  binding's place: `type` is unbound, its events reach no role, and the two
  closures carry no issue type for the operator's `config.field_value_map` row
  to classify.

  Carol closes two issues, both of type `IT_bug`, which has a live decision
  saying `bug`. With the retraction honoured both land in `tasks.closed_unknown`
  and `tasks.bugs_fixed` has no value at all; with the retraction dropped,
  `IT_bug` classifies and `tasks.bugs_fixed` is two. `tasks.closed`
  stays two either way — the `state` and `assignees` bindings are untouched, so
  a retraction that reached the wrong field would show up there.

bronze:
  bronze_bamboohr.employees:
    - $ref: ../templates/people.yaml#/templates/alice
    - $ref: ../templates/people.yaml#/templates/bob
    - $ref: ../templates/people.yaml#/templates/carol

  bronze_github.commit_authors:
    - { $ref: ../templates/github_task.yaml#/templates/commit_author, unique_key: gh-author-1003, _airbyte_raw_id: gh-author-1003, author_id: 1003, author_login: carol, author_email: carol@example.com }

  config.task_field_roles:
    - $ref: ../templates/github_task.yaml#/templates/role_state
    - $ref: ../templates/github_task.yaml#/templates/role_assignees
    # Authored, then withdrawn — both rows persist.
    - $ref: ../templates/github_task.yaml#/templates/role_type
    - $ref: ../templates/github_task.yaml#/templates/role_type_retracted

  config.task_value_map:
    - $ref: ../templates/github_task.yaml#/templates/value_open
    - $ref: ../templates/github_task.yaml#/templates/value_closed_completed

  # Live, but reachable only through the retracted binding, so it must go unused.
  config.field_value_map:
    - $ref: ../templates/github_task.yaml#/templates/issue_type_kind_bug

  bronze_github.issue_types:
    - $ref: ../templates/github_task.yaml#/templates/issue_type_bug

  bronze_github.issue_fields: []

  bronze_github.issues:
    - { $ref: ../templates/github_task.yaml#/templates/issue, id: 1, number: 1, unique_key: gh-issue-1, assignee_logins: carol, assignee_ids: "1003", author_id: 1003, issue_type: Bug, issue_type_id: IT_bug }
    - { $ref: ../templates/github_task.yaml#/templates/issue, id: 2, number: 2, unique_key: gh-issue-2, assignee_logins: carol, assignee_ids: "1003", author_id: 1003, issue_type: Bug, issue_type_id: IT_bug }

  bronze_github.issue_timeline_events:
    - { $ref: ../templates/github_task.yaml#/templates/closed_event, unique_key: gh-ev-1, event_id: CE_1, item_number: 1, actor_id: 1003 }
    - { $ref: ../templates/github_task.yaml#/templates/closed_event, unique_key: gh-ev-2, event_id: CE_2, item_number: 2, actor_id: 1003 }
