spec_version: 1
description: >
  Metric: tasks.closed — every evidence row names its issue, #3469.
  How it's computed (bronze → silver → gold):
    • bronze: two closed issues, both observed alive by the census. One issue
      row carries the tenant stamp the census carries; the other does not, so
      the availability model holds it as two entities and the census one has
      no readable key.
    • silver: the field history carries the issue's key on its journal rows;
      the availability row the census detection adds — the newest row of the
      issue — carries none.
    • gold:   the key is the newest one any row names, so a row naming none
      cannot blank the key every other row carries.

  Cases: carol closes RFA-1 (stamped) and RFB-1 (unstamped) in August; the
  evidence behind her closures names both.

bronze:
  bronze_bamboohr.employees:
    - $ref: ../templates/people.yaml#/templates/carol

  bronze_jira.jira_user:
    - $ref: ../templates/jira_task.yaml#/templates/carol_user

  bronze_jira.jira_statuses:
    - $ref: ../templates/jira_task.yaml#/templates/status_open
    - $ref: ../templates/jira_task.yaml#/templates/status_in_progress
    - $ref: ../templates/jira_task.yaml#/templates/status_closed

  bronze_jira.jira_fields:
    - $ref: ../templates/jira_task.yaml#/templates/field_status
    - $ref: ../templates/jira_task.yaml#/templates/field_assignee
    - $ref: ../templates/jira_task.yaml#/templates/field_issuetype

  bronze_jira.jira_issuetypes:
    - $ref: ../templates/jira_task.yaml#/templates/issuetype_task

  config.field_value_map:
    - $ref: ../templates/jira_task.yaml#/templates/value_type_task

  config.field_value_defaults:
    - $ref: ../templates/jira_task.yaml#/templates/jira_issue_type_default_unknown
    - $ref: ../templates/jira_task.yaml#/templates/jira_resolution_default_unknown

  bronze_jira.jira_issue:
    - $ref: ../templates/jira_task.yaml#/templates/jira_issue
      tenant_id: "{{ tenant }}"
      id: "10701"
      jira_id: "10701"
      unique_key: jira-test-RFA-1
      id_readable: RFA-1
      created: "2026-08-03T09:00:00"
      custom_fields_json: '{"status":{"id":"6","name":"Closed"},"issuetype":{"id":"10001","name":"Task"},"assignee":{"accountId":"carol-jira-acct","displayName":"Carol Gamma"}}'
    # No tenant stamp: its availability entity key cannot match the census row's.
    - $ref: ../templates/jira_task.yaml#/templates/jira_issue
      id: "10702"
      jira_id: "10702"
      unique_key: jira-test-RFB-1
      id_readable: RFB-1
      created: "2026-08-03T09:00:00"
      custom_fields_json: '{"status":{"id":"6","name":"Closed"},"issuetype":{"id":"10001","name":"Task"},"assignee":{"accountId":"carol-jira-acct","displayName":"Carol Gamma"}}'

  bronze_jira.jira_issue_history:
    - {$ref: ../templates/jira_task.yaml#/templates/jira_history, id_readable: RFA-1, jira_id: "10701", changelog_id: "58001", unique_key: jira-test-RFA1-58001, created_at: "2026-08-20T14:00:00.000+0000", author_account_id: carol-jira-acct, items: '[{"field":"Status","fieldId":"status","fromString":"In Progress","from":"3","toString":"Closed","to":"6"}]'}
    - {$ref: ../templates/jira_task.yaml#/templates/jira_history, id_readable: RFB-1, jira_id: "10702", changelog_id: "58002", unique_key: jira-test-RFB1-58002, created_at: "2026-08-20T14:00:00.000+0000", author_account_id: carol-jira-acct, items: '[{"field":"Status","fieldId":"status","fromString":"In Progress","from":"3","toString":"Closed","to":"6"}]'}

  bronze_jira.jira_issue_census:
    - {$ref: ../templates/jira_task.yaml#/templates/jira_census, jira_id: "10701", unique_key: "{{ tenant }}-jira-test-10701"}
    - {$ref: ../templates/jira_task.yaml#/templates/jira_census, jira_id: "10702", unique_key: "{{ tenant }}-jira-test-10702"}

  bronze_jira.jira_project_visibility:
    - {$ref: ../templates/jira_task.yaml#/templates/jira_visibility, id: "100", key: TST, name: Test Project, unique_key: "{{ tenant }}-jira-test-100", project_id: 100, project_key: TST}
