spec_version: 1
description: >
  Task Delivery - issues closed and their split by issue type - JIRA,
  department-of-5 distribution in a single custom window.

  bronze -> silver -> gold: jira_issue (Closed) + jira_issue_history
  (Status->Closed event = the close date / metric_date) + jira_user +
  jira_issuetypes. One closed issue per issue; tasks_closed counts every one of
  them regardless of type, and each carries its type as a breakdown dimension
  resolved through the issue-type dimension. Summed per person over the window
  (value = the requested member's OWN sum; median/p25/p75/range = the department
  (org_unit_id) distribution).

  Department: 5 Engineering members alice..erin, alice..dave closing rank r
  issues each and erin 6, on the same close date (2026-12-25). The custom window
  2026-12-20..12-31 captures them all -> per-person sums {1,2,3,4,6}; the IC
  case requests erin (6). Erin's six are 3 Task + 1 Bug + 1 Incident + 1 issue
  with no issuetype field at all, so her total splits into four type groups
  that add back up to 6 — Incident, a catalogued name neither configured list
  covers, stays its own group instead of joining the non-bug work, and the
  type-less issue reports no type id, so the issue-type dimension lookup
  misses entirely: it counts as closed under the unknown kind, in neither
  bugs_fixed nor closed_task, and falls in the reserved unknown-type
  breakdown group. Both join closed_unknown_type instead, so the three kind
  subsets partition the 6 closed exactly: 1 bug + 3 task + 2 unclassified.
  Empty window 2026-06 -> no items.

bronze:
  bronze_bamboohr.employees:
    - $ref: ../templates/people.yaml#/templates/alice
    - $ref: ../templates/people.yaml#/templates/bob
    - $ref: ../templates/people.yaml#/templates/carol
