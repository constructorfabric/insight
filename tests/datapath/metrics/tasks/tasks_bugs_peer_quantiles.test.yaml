spec_version: 1
description: >
  Task Delivery - bugs_fixed and bugs_ratio with a peer pool large enough to
  disclose - JIRA, department of 6 with 5 observed members, so this is the first
  spec where the bugs_fixed / bugs_ratio peer quantiles disclose
  (pool n=5 >= MIN_PEER_N).

  bronze -> silver -> gold: jira_issue + jira_issue_history (Status->Closed event
  = metric_date) + jira_user + jira_issuetypes. The issue's type id lives in
  custom_fields_json (issuetype.id) and resolves through the issue-type
  dimension; task_issue_kind lower+trims coalesce(nullIf(untranslatedName,''),
  name) against the configured bug list, so Defect, Regression, "  DEFECT  "
  (empty untranslatedName, padded display name) and Ошибка (untranslatedName
  Bug) all classify as bug alongside the literal Bug.

  Department: 6 Engineering members. alice..erin of rank r in 1..5 each close
  EXACTLY 5 issues on the same close date (2026-06-25): r bugs + (5-r) Tasks,
  each person's bugs carrying THEIR alias type -> bugs_fixed = {1,2,3,4,5} and
  bugs_ratio = {20,40,60,80,100}. heidi closes 2 Tasks and 0 bugs: sumIfOrNull
  computes NULL over her zero bug rows for bugs_fixed AND for the ratio's
  numerator, so she carries no observation and stays out of both peer pools -
  the pool is the 5 observed members, and p25/median/p75/min/max disclose over
  their distribution.

