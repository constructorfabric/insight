name: Verify candidate data and Helm
run-name: Verify PR 3970 data/API and Helm (no publication)

on:
  workflow_dispatch:

concurrency:
  group: pr3970-verification-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  verify:
    name: Verify candidate without publication
    uses: ./.github/workflows/release-helm.yml
    with:
      build_results: '{"changes":{"result":"success","outputs":{"analytics":"true","authenticator":"true","gateway":"true","identity_resolution":"true","insight_v3_core":"true","git_cli_proxy":"true","previews":"true","frontend":"true","build_tag":"2026.10.28.09.10-bf4960f","toolbox":"false","seed":"false","candidate_checks":"true"}},"discover-images":{"result":"success","outputs":{"any":"false"}},"bump-descriptors":{"result":"skipped"},"queue-gate":{"result":"success","outputs":{"clear":"true"}},"merge-analytics":{"result":"success"},"merge-authenticator":{"result":"success"},"merge-gateway":{"result":"success"},"merge-identity-resolution":{"result":"success"},"merge-insight-v3-core":{"result":"success"},"merge-git-cli-proxy":{"result":"success"},"merge-previews":{"result":"success"},"merge-frontend":{"result":"success"},"merge-toolbox":{"result":"skipped"},"merge-seed":{"result":"skipped"},"merge-image":{"result":"skipped"}}'
    secrets:
      TEST_STAND_KUBECONFIG: ${{ secrets.TEST_STAND_KUBECONFIG }}
      TEST_STAND_PERSONA_PASSWORD: ${{ secrets.TEST_STAND_PERSONA_PASSWORD }}
