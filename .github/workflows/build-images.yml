      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE_PREFIX }}/insight-frontend
          tags: |
            type=raw,value=${{ needs.changes.outputs.build_tag }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fail on a fixable critical before any tag points here
        uses: ./.github/actions/image-cve-gate
        with:
          image: ${{ env.IMAGE_PREFIX }}/insight-frontend
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch manifest and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE_PREFIX }}/insight-frontend@sha256:%s ' *)
      - name: Inspect manifest digest
        id: inspect
        run: |
          DIGEST=$(docker buildx imagetools inspect \
            ${{ env.IMAGE_PREFIX }}/insight-frontend:${{ needs.changes.outputs.build_tag }} \
            --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}/insight-frontend
          subject-digest: ${{ steps.inspect.outputs.digest }}
          push-to-registry: true
      # Copy-pastable pushed ref on the run's Summary page (#1994).
      - name: Report pushed image
        run: |
          echo '- `${{ env.IMAGE_PREFIX }}/insight-frontend:${{ needs.changes.outputs.build_tag }}`' >> "$GITHUB_STEP_SUMMARY"

  # ─── Toolbox build (with dbt parse smoke) ──────────────────────────────────
  # Toolbox is special — it bakes every connector's descriptor.yaml and dbt
  # project at build time, so a descriptor-only change (commit A from
  # bump-descriptors) MUST re-trigger it. paths-filter for `toolbox` matches
  # `src/ingestion/**` (which includes descriptor.yaml).
  #
  toolbox:
    needs: changes
    if: |
      needs.changes.outputs.toolbox == 'true'
      || (github.event_name == 'workflow_dispatch' && !inputs.frontend_only)
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJson(needs.changes.outputs.arches) }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: needs.changes.outputs.should_push == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build → validate (amd64 leg only) → push by digest. Python toolbox
      # content is arch-agnostic, so we validate once on amd64 and skip
      # validate on arm64. The validate-build uses `load: true` (single-arch
      # only, into the runner's Docker daemon) so `docker run` can exercise
      # `dbt parse`. The push-build then reuses the buildx cache — mostly
      # cache-hits on amd64, full build on arm64 (native, fast).
      #
      # Caveat: if validate fails on amd64, the arm64 leg may have already
      # pushed an untagged digest. merge-toolbox is gated on toolbox=success
      # so the orphan never gets tagged; GHCR retention reclaims it.
      - name: Build toolbox image (load locally, amd64 only)
        if: matrix.arch == 'amd64'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: src/ingestion
          file: src/ingestion/tools/toolbox/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: insight-toolbox:ci-validate
          cache-from: type=gha,scope=toolbox-amd64
          cache-to: ${{ needs.changes.outputs.should_push == 'true' && 'type=gha,mode=max,scope=toolbox-amd64,ignore-error=true' || '' }}

      - name: Validate dbt project (dbt parse)
        if: matrix.arch == 'amd64'
        # `dbt parse` exercises the dbt manifest: duplicate model/test
        # names, broken `ref()`/`source()`, jinja syntax errors,
        # schema.yml model patches that don't match a model — all error
        # here. It does NOT execute any SQL against the warehouse: the
        # dummy profile below is never connected, the adapter just
        # needs to be loadable.
        run: |
          mkdir -p /tmp/dbt-ci-profiles
          cat > /tmp/dbt-ci-profiles/profiles.yml <<'YAML'
          ingestion:
            target: ci-parse
            outputs:
              ci-parse:
                type: clickhouse
                host: dummy.local
                port: 8123
                schema: dbt_parse_ci
                user: ci
                password: ci
                secure: false
          YAML
          docker run --rm \
            -v /tmp/dbt-ci-profiles:/profiles:ro \
            -w /ingestion/dbt \
            insight-toolbox:ci-validate \
            dbt parse --profiles-dir /profiles

      - name: Build and push toolbox image (by digest)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: src/ingestion
          file: src/ingestion/tools/toolbox/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}/insight-toolbox,push-by-digest=true,name-canonical=true,push=${{ needs.changes.outputs.should_push == 'true' }}
          cache-from: type=gha,scope=toolbox-${{ matrix.arch }}
          cache-to: ${{ needs.changes.outputs.should_push == 'true' && format('type=gha,mode=max,scope=toolbox-{0},ignore-error=true', matrix.arch) || '' }}

      - name: Export digest
        if: needs.changes.outputs.should_push == 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        if: needs.changes.outputs.should_push == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-toolbox-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-toolbox:
    needs: [changes, toolbox]
    if: |
      always()
      && needs.toolbox.result != 'skipped'
      && needs.changes.outputs.should_push == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Require the platform builds to have passed
        if: needs.toolbox.result != 'success'
        run: |
          echo "::error::toolbox finished '${{ needs.toolbox.result }}' — nothing to merge."
          exit 1
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-toolbox-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE_PREFIX }}/insight-toolbox
          tags: |
            type=raw,value=${{ needs.changes.outputs.build_tag }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fail on a fixable critical before any tag points here
        uses: ./.github/actions/image-cve-gate
        with:
          image: ${{ env.IMAGE_PREFIX }}/insight-toolbox
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch manifest and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE_PREFIX }}/insight-toolbox@sha256:%s ' *)
      - name: Inspect manifest digest
        id: inspect
        run: |
          DIGEST=$(docker buildx imagetools inspect \
            ${{ env.IMAGE_PREFIX }}/insight-toolbox:${{ needs.changes.outputs.build_tag }} \
            --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}/insight-toolbox
          subject-digest: ${{ steps.inspect.outputs.digest }}
          push-to-registry: true
      # Copy-pastable pushed ref on the run's Summary page (#1994).
      - name: Report pushed image
        run: |
          echo '- `${{ env.IMAGE_PREFIX }}/insight-toolbox:${{ needs.changes.outputs.build_tag }}`' >> "$GITHUB_STEP_SUMMARY"

  # ─── Sample-data seeder build (with import smoke) ──────────────────────────
  # The seeder's own image, separate from the toolbox on purpose: the toolbox
  # runs migrations against real stands and a demo-data generator has no
  # business being installed there. Same build context (src/ingestion), a
  # narrower COPY set, and `insight-seed` as the entry point — see
  # src/ingestion/tools/seed/Dockerfile.
  #
  # `seed-stand.sh` runs this image as a one-shot Job; the ref it discovers is
  # `ingestion.seedImage`, pinned by publish-chart below.
  seed:
    needs: changes
    if: |
      needs.changes.outputs.seed == 'true'
      || (github.event_name == 'workflow_dispatch' && !inputs.frontend_only)
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJson(needs.changes.outputs.arches) }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: needs.changes.outputs.should_push == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build → validate (amd64 leg only) → push by digest, exactly as the
      # toolbox above: the content is arch-agnostic, so one validate is enough
      # and the push-build reuses the buildx cache.
      - name: Build seed image (load locally, amd64 only)
        if: matrix.arch == 'amd64'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: src/ingestion
          file: src/ingestion/tools/seed/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: insight-seed:ci-validate
          cache-from: type=gha,scope=seed-amd64
          cache-to: ${{ needs.changes.outputs.should_push == 'true' && 'type=gha,mode=max,scope=seed-amd64,ignore-error=true' || '' }}

      - name: Validate the seeder (entry point, imports, tests, dbt)
        if: matrix.arch == 'amd64'
        # The failure this catches is the one that made the seeder unrunnable
        # on a stand in the first place: a module whose dependency is not
        # installed in the image. Importing every step module exercises the
        # whole dependency set (MariaDB and ClickHouse drivers included)
        # without touching a database, `--help` proves the console script is on
        # PATH, and `dbt --version` proves the silver step's subprocess
        # environment exists.
        #
        # The package's own tests run here rather than in ci.yml's Python
        # matrix: they touch no database, so the shipped image can run them
        # against exactly what is published. They are pytest-style, and pytest
        # deliberately stays out of the image — it is installed into this
        # throwaway container only, so the runner is added on top while the
        # package under test remains the published one.
        run: |
          docker run --rm insight-seed:ci-validate --help
          docker run --rm --entrypoint python insight-seed:ci-validate -c \
            'import insight_seed.identity, insight_seed.silver, insight_seed.analytics, insight_seed.preflight, insight_seed.keycloak_realm'
          docker run --rm --entrypoint sh insight-seed:ci-validate -c \
            'pip install --no-cache-dir --quiet "pytest>=8,<9" && python -m pytest tests -q'
          docker run --rm --entrypoint dbt insight-seed:ci-validate --version

      - name: Build and push seed image (by digest)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: src/ingestion
          file: src/ingestion/tools/seed/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}/insight-seed,push-by-digest=true,name-canonical=true,push=${{ needs.changes.outputs.should_push == 'true' }}
          cache-from: type=gha,scope=seed-${{ matrix.arch }}
          cache-to: ${{ needs.changes.outputs.should_push == 'true' && format('type=gha,mode=max,scope=seed-{0},ignore-error=true', matrix.arch) || '' }}

      - name: Export digest
        if: needs.changes.outputs.should_push == 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        if: needs.changes.outputs.should_push == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-seed-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-seed:
    needs: [changes, seed]
    if: |
      always()
      && needs.seed.result != 'skipped'
      && needs.changes.outputs.should_push == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Require the platform builds to have passed
        if: needs.seed.result != 'success'
        run: |
          echo "::error::seed finished '${{ needs.seed.result }}' — nothing to merge."
          exit 1
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-seed-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE_PREFIX }}/insight-seed
          tags: |
            type=raw,value=${{ needs.changes.outputs.build_tag }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Create multi-arch manifest and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE_PREFIX }}/insight-seed@sha256:%s ' *)
      - name: Inspect manifest digest
        id: inspect
        run: |
          DIGEST=$(docker buildx imagetools inspect \
            ${{ env.IMAGE_PREFIX }}/insight-seed:${{ needs.changes.outputs.build_tag }} \
            --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}/insight-seed
          subject-digest: ${{ steps.inspect.outputs.digest }}
          push-to-registry: true
      # Copy-pastable pushed ref on the run's Summary page (#1994).
      - name: Report pushed image
        run: |
          echo '- `${{ env.IMAGE_PREFIX }}/insight-seed:${{ needs.changes.outputs.build_tag }}`' >> "$GITHUB_STEP_SUMMARY"

  # ─── Connector image build (matrix-driven, descriptor-discovered) ──────────
  # One matrix leg per `descriptor.yaml.images.<key>` entry × arch that
  # fires this run (see discover-images for the firing rule). Build
  # identity (`name`, `dockerfile`, `context`) is read from the matrix
  # entry — there is no per-connector hardcode in this workflow.
  #
  build-image:
    needs: [changes, discover-images]
    if: needs.discover-images.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJson(needs.discover-images.outputs.matrix) }}
        arch: ${{ fromJson(needs.changes.outputs.arches) }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: needs.changes.outputs.should_push == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: ${{ matrix.entry.connector_dir }}/${{ matrix.entry.context }}
          file: ${{ matrix.entry.connector_dir }}/${{ matrix.entry.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          # insight-jira-enrich is the one connector image the e2e rig bakes
          # into its runner — its PR amd64 leg feeds it (see backend-analytics).
          tags: ${{ github.event_name == 'pull_request' && matrix.arch == 'amd64' && matrix.entry.name == 'insight-jira-enrich' && format('{0}:e2e-prebuilt', matrix.entry.name) || '' }}
          outputs: ${{ github.event_name == 'pull_request' && matrix.arch == 'amd64' && matrix.entry.name == 'insight-jira-enrich' && 'type=docker,dest=/tmp/e2e-prebuilt.tar' || format('type=image,name={0}/{1},push-by-digest=true,name-canonical=true,push={2}', env.IMAGE_PREFIX, matrix.entry.name, needs.changes.outputs.should_push == 'true') }}
          # Scope cache per (image name, arch) so unrelated connectors and
          # cross-arch builds don't evict each other.
          cache-from: type=gha,scope=${{ matrix.entry.name }}-${{ matrix.arch }}
          cache-to: ${{ needs.changes.outputs.should_push == 'true' && format('type=gha,mode=max,scope={0}-{1},ignore-error=true', matrix.entry.name, matrix.arch) || '' }}
      - name: Upload image for the e2e rig
        if: github.event_name == 'pull_request' && matrix.arch == 'amd64' && matrix.entry.name == 'insight-jira-enrich'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-prebuilt-insight-jira-enrich
          path: /tmp/e2e-prebuilt.tar
          if-no-files-found: error
          retention-days: 1
          overwrite: true
      - name: Export digest
        if: needs.changes.outputs.should_push == 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        if: needs.changes.outputs.should_push == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.entry.name }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # One merge leg per connector entry: pulls the per-arch digests this run
  # produced, assembles the multi-arch manifest at <build_tag>+latest, and
  # attests the manifest digest.
  merge-image:
    needs: [changes, discover-images, build-image]
    if: |
      always()
      && needs.discover-images.outputs.any == 'true'
      && needs.build-image.result != 'skipped'
      && needs.changes.outputs.should_push == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJson(needs.discover-images.outputs.matrix) }}
    steps:
      - name: Require the platform builds to have passed
        if: needs.build-image.result != 'success'
        run: |
          echo "::error::build-image finished '${{ needs.build-image.result }}' — nothing to merge."
          exit 1
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.entry.name }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.entry.name }}
          tags: |
            type=raw,value=${{ needs.changes.outputs.build_tag }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fail on a fixable critical before any tag points here
        uses: ./.github/actions/image-cve-gate
        with:
          image: ${{ env.IMAGE_PREFIX }}/${{ matrix.entry.name }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch manifest and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE_PREFIX }}/${{ matrix.entry.name }}@sha256:%s ' *)
      - name: Inspect manifest digest
        id: inspect
        run: |
          DIGEST=$(docker buildx imagetools inspect \
            ${{ env.IMAGE_PREFIX }}/${{ matrix.entry.name }}:${{ needs.changes.outputs.build_tag }} \
            --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}/${{ matrix.entry.name }}
          subject-digest: ${{ steps.inspect.outputs.digest }}
          push-to-registry: true
      # Copy-pastable pushed ref on the run's Summary page (#1994).
      - name: Report pushed image
        run: |
          echo '- `${{ env.IMAGE_PREFIX }}/${{ matrix.entry.name }}:${{ needs.changes.outputs.build_tag }}`' >> "$GITHUB_STEP_SUMMARY"

  # ─── Connector descriptor bump ─────────────────────────────────────────────
  # After build-image succeeds on every matrix leg, patch each connector's
  # `descriptor.yaml.images.<key>.image` with the freshly pushed tag, then
  # commit + push WITHOUT [skip ci]. That push re-triggers this workflow:
  # paths-filter sees src/ingestion/** changes and toolbox rebuilds with the
  # patched descriptors baked in; publish-chart in the follow-up run produces
  # the umbrella version bump with [skip ci].
  #
  # The matrix is the universal source of truth for what to patch — every
  # entry that BUILT in this run gets its image field updated. Skipped
  # entries (the matrix was empty or the build job didn't run) → commit
  # short-circuits via the `committed=false` output.
  #
  # See ADR-0016 (descriptor.images: schema) and ADR-0001 (chart-publishing).
  bump-descriptors:
    needs:
      - changes
      - discover-images
      - merge-analytics
      - merge-authenticator
      - merge-gateway
      - merge-identity-resolution
      - merge-git-cli-proxy
      - merge-frontend
      - merge-toolbox
      - merge-image
    # All siblings must finish first — bump-descriptors auto-commits to main
    # and that push retriggers the workflow, so we must NOT pin descriptors
    # while a backend service or toolbox is still building or has just failed
    # tests. The `success || skipped` shape mirrors publish-chart: any of
    # the merge-* jobs may legitimately be `skipped` when its underlying
    # build job was skipped (paths-filter didn't flag it), but they must
    # never be `failure` or `cancelled`. Each merge-* job's manifest-push
    # is what tags the canonical <build_tag> images, so descriptor refs
    # only safely point at those tags once the merge completes.
    if: |
      always()
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-'))
      && needs.discover-images.outputs.any == 'true'
      && (needs.merge-image.result == 'success' || needs.merge-image.result == 'skipped')
      && (needs.merge-analytics.result == 'success' || needs.merge-analytics.result == 'skipped')
      && (needs.merge-authenticator.result == 'success' || needs.merge-authenticator.result == 'skipped')
      && (needs.merge-gateway.result       == 'success' || needs.merge-gateway.result       == 'skipped')
      && (needs.merge-identity-resolution.result == 'success' || needs.merge-identity-resolution.result == 'skipped')
      && (needs.merge-git-cli-proxy.result == 'success' || needs.merge-git-cli-proxy.result == 'skipped')
      && (needs.merge-frontend.result      == 'success' || needs.merge-frontend.result      == 'skipped')
      && (needs.merge-toolbox.result       == 'success' || needs.merge-toolbox.result       == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      # `committed` is set to 'true' when this job actually pushed a
      # descriptor-bump commit. publish-chart reads it to skip itself in
      # THIS run when bump-descriptors made changes — the descriptor commit's
      # push re-triggers the workflow, and publish-chart fires canonically in
      # that follow-up run with toolbox already rebuilt against the patched
      # descriptors. This avoids a double umbrella publish (one with stale
      # toolbox content, one with fresh).
      committed: ${{ steps.commit.outputs.committed }}
    steps:
      - name: Mint chart-release App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Patch images.<key>.image refs from matrix
        env:
          BUILD_TAG: ${{ needs.changes.outputs.build_tag }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          MATRIX: ${{ needs.discover-images.outputs.matrix }}
        run: |
          set -euo pipefail
          # Iterate every matrix entry (every built image this run) and patch
          # `descriptor.yaml.images.<key>.image` with the new full ref.
          # `field`/`repo` are not hardcoded in this workflow — they live in
          # the descriptor. Multi-image connectors patch multiple keys.
          echo "$MATRIX" | jq -c '.[]' | while IFS= read -r entry; do
            desc="$(echo "$entry" | jq -r '.connector_dir')/descriptor.yaml"
            key="$(echo "$entry"  | jq -r '.key')"
            name="$(echo "$entry" | jq -r '.name')"
            ref="$IMAGE_PREFIX/$name:$BUILD_TAG"
            echo "Patching $desc: images.$key.image = $ref"
            yq -i ".images.\"$key\".image = \"$ref\"" "$desc"
          done

      - name: Bump descriptor.version (minor) for each patched connector
        env:
          MATRIX: ${{ needs.discover-images.outputs.matrix }}
        run: |
          set -euo pipefail
          # Every connector whose image was rebuilt this run gets its
          # descriptor.version bumped by one minor increment (X.Y.Z → X.(Y+1).0).
          # Reconcile then classifies this as `bump_kind: minor` on the next
          # deploy (per ADR-0015) and re-discovers the source catalog without
          # dispatching a `dbt --full-refresh` — the new image is a continuation
          # of the same connector contract, not a breaking change.
          #
          # Dedupe by connector_dir: a single descriptor with multiple image
          # entries gets exactly ONE minor bump per CI run, not one per entry.
          echo "$MATRIX" | jq -r '.[].connector_dir' | sort -u \
            | while IFS= read -r connector_dir; do
              desc="$connector_dir/descriptor.yaml"
              echo "Bumping $desc version (minor):"
              .github/workflows/scripts/bump-descriptor-version.sh --descriptor "$desc"
            done

      # Pin backend service subchart appVersions here too. This job commits
      # WITHOUT [skip ci] and re-triggers the workflow; because publish-chart
      # is deferred to that follow-up run (see its `committed != 'true'`
      # gate), a backend built alongside a connector — or every backend on a
      # manual full rebuild — would otherwise never get pinned: the follow-up
      # run doesn't see the backend source as changed. Bumping the subchart
      # Chart.yaml here makes the follow-up run rebuild that backend and
      # publish-chart persist its tag. Uses the same script as publish-chart.
      - name: Bump per-service subchart appVersions (built this run)
        env:
          BUILD_TAG: ${{ needs.changes.outputs.build_tag }}
          FULL_REBUILD: ${{ github.event_name == 'workflow_dispatch' }}
          ANALYTICS: ${{ needs.changes.outputs.analytics }}
          AUTHENTICATOR: ${{ needs.changes.outputs.authenticator }}
          GATEWAY: ${{ needs.changes.outputs.gateway }}
          IDENTITY_RESOLUTION: ${{ needs.changes.outputs.identity_resolution }}
          GIT_CLI_PROXY: ${{ needs.changes.outputs.git_cli_proxy }}
          FRONTEND: ${{ needs.changes.outputs.frontend }}
        run: .github/workflows/scripts/bump-service-appversions.sh

      - name: Commit descriptor patches (no [skip ci])
        id: commit
        env:
          MATRIX: ${{ needs.discover-images.outputs.matrix }}
          BUILD_TAG: ${{ needs.changes.outputs.build_tag }}
        run: |
          set -euo pipefail
          git config user.email "ci@constructorfabric.local"
          git config user.name  "insight-ci"

          # Stage every descriptor.yaml that was patched. `sort -u` because
          # multi-image connectors appear once per image entry in the matrix.
          echo "$MATRIX" \
            | jq -r '.[].connector_dir + "/descriptor.yaml"' \
            | sort -u \
            | xargs -r git add

          # Stage any backend subchart appVersion bumps from the step above.
          # git add of an unchanged file is a harmless no-op.
          # The frontend chart must be here: otherwise a connector+frontend commit
          # bumps it, defers publish-chart, and the follow-up run sees no
          # src/frontend/** change to re-bump from.
          git add src/backend/services/analytics/helm/Chart.yaml \
                  src/backend/services/authenticator/helm/Chart.yaml \
                  src/backend/services/gateway/helm/Chart.yaml \
                  src/backend/services/identity-resolution/helm/Chart.yaml \
                  src/backend/services/git-cli-proxy/helm/Chart.yaml \
                  src/frontend/helm/Chart.yaml

          if git diff --staged --quiet; then
            echo "no descriptor changes to commit"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "committed=true" >> "$GITHUB_OUTPUT"

          # Connector slugs (basename of each connector_dir) — surface in
          # the commit subject so a reader of `git log` sees what shipped
          # without opening the diff.
          MODIFIED="$(echo "$MATRIX" \
            | jq -r '.[].connector_dir' \
            | sed 's|.*/||' | sort -u | paste -sd, -)"

          # Intentionally NO [skip ci]: the push must re-trigger this
          # workflow so toolbox rebuilds with the patched descriptors and
          # publish-chart produces the umbrella bump.
          git commit -m "chore(descriptors): bump ${MODIFIED} image refs + version (minor) to ${BUILD_TAG}"

          # Push, with one rebase-retry to absorb a race against
          # origin/${GITHUB_REF_NAME} advancing between job start and now.
          # Mirrors publish-chart's policy: rebase once, fail loud on
          # second failure.
          if ! git push origin "HEAD:${GITHUB_REF_NAME}"; then
            echo "push failed; rebasing onto refreshed origin/${GITHUB_REF_NAME} and retrying"
            if ! git pull --rebase origin "${GITHUB_REF_NAME}"; then
              echo "rebase failed (conflict on patched descriptors?); aborting"
              git rebase --abort 2>/dev/null || true
              exit 1
            fi
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

  # ─── Umbrella chart publish ────────────────────────────────────────────────
  # Per merge to main — and per push/dispatch on a release-** branch: bump
  # subchart appVersions for whichever services were rebuilt in this run,
  # patch-bump the umbrella version, regenerate Chart.lock, package, push to
  # oci://ghcr.io/constructorfabric/charts/insight, and commit the bumps back
  # to the triggering branch with [skip ci] so we don't recurse. The
  # patch-only bump keeps release-branch chart versions inside the minor
  # stream the branch was cut with (trunk minor-bumps right after cutting a
  # release branch, so the streams never collide on the OCI registry).
  #
  # Skipped in this run when bump-descriptors committed (`committed=true`):
  # the descriptor commit's push re-triggers the workflow, and publish-chart
  # runs canonically in that follow-up run with toolbox already rebuilt
  # against the patched descriptors.
  #
  # and the gitops SPEC §2.4 for the contract.
  publish-chart:
    needs:
      - changes
      - discover-images
      - merge-analytics
      - merge-authenticator
      - merge-gateway
      - merge-identity-resolution
      - merge-git-cli-proxy
      - merge-frontend
      - merge-toolbox
      - merge-seed
      - merge-image
      - bump-descriptors
    if: |
      always()
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && !(github.event_name == 'workflow_dispatch' && inputs.frontend_only)
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-'))
      && (needs.merge-analytics.result == 'success' || needs.merge-analytics.result == 'skipped')
      && (needs.merge-authenticator.result == 'success' || needs.merge-authenticator.result == 'skipped')
      && (needs.merge-gateway.result       == 'success' || needs.merge-gateway.result       == 'skipped')
      && (needs.merge-identity-resolution.result == 'success' || needs.merge-identity-resolution.result == 'skipped')
      && (needs.merge-git-cli-proxy.result == 'success' || needs.merge-git-cli-proxy.result == 'skipped')
      && (needs.merge-frontend.result      == 'success' || needs.merge-frontend.result      == 'skipped')
      && (needs.merge-toolbox.result       == 'success' || needs.merge-toolbox.result       == 'skipped')
      && (needs.merge-seed.result          == 'success' || needs.merge-seed.result          == 'skipped')
      && (needs.merge-image.result         == 'success' || needs.merge-image.result         == 'skipped')
      && (needs.bump-descriptors.result    == 'success' || needs.bump-descriptors.result    == 'skipped')
      && needs.bump-descriptors.outputs.committed != 'true'
      && (
        needs.changes.outputs.analytics == 'true'
        || needs.changes.outputs.authenticator == 'true'
        || needs.changes.outputs.gateway      == 'true'
        || needs.changes.outputs.identity_resolution == 'true'
        || needs.changes.outputs.git_cli_proxy == 'true'
        || needs.changes.outputs.frontend     == 'true'
        || needs.changes.outputs.toolbox      == 'true'
        || needs.changes.outputs.seed         == 'true'
        || needs.changes.outputs.umbrella     == 'true'
      )
    runs-on: ubuntu-latest
    steps:
      # Mint a short-lived (1h) installation token from the
      # insight-chart-release-bot GitHub App so the auto-commit push at the
      # end of this job can bypass branch protection on `main`. The App has
      # Contents: read & write on this repo only and is on `main`'s bypass
      # list; default GITHUB_TOKEN cannot bypass, and we explicitly chose
      # App-over-PAT to avoid tying release pushes to a single human.
      # GHCR push (helm registry login below) stays on GITHUB_TOKEN via
      # packages: write — the App was deliberately not granted that scope.
      - name: Mint chart-release App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history needed because we'll commit back to the same branch.
          fetch-depth: 0
          # App token; persists in the git remote so the final `git push`
          # in this job runs as the App and clears `main` branch protection.
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: '3.14.0'

      # Re-anchor the working tree to the live tip of the target branch
      # BEFORE any value is computed. `checkout` above pins this run's
      # trigger SHA, but the umbrella `version` is derived as
      # (Chart.yaml version + 1) and `ingestion.toolboxImage` is rewritten
      # to this run's build tag — both read from / written to the tree. If
      # origin/main has advanced (an earlier release run already bumped &
      # pushed; common when two src/ingestion/** PRs merge back-to-back),
      # the trigger-SHA tree is stale: both runs compute the SAME next
      # version and both rewrite the SAME toolboxImage line to a different
      # tag. They both `helm push` that version (clobbering each other's
      # OCI artifact), and the final commit can never fast-forward — the
      # rebase-retry below then conflicts on the toolboxImage line in
      # charts/insight/values.yaml (the version line auto-merges, identical
      # on both sides) and cannot auto-resolve. Resetting to the live tip
      # makes version-compute, the toolboxImage ref and the commit all
      # consistent with what's on the branch, and makes a plain job re-run
      # idempotent (a re-run recomputes against the refreshed tip instead
      # of replaying the stale pinned SHA forever).
      - name: Re-anchor to live branch tip
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$GITHUB_REF_NAME"
          git reset --hard "origin/$GITHUB_REF_NAME"

      # Per-service subchart appVersion bumps. Each is bumped INDEPENDENTLY,
      # only if the matching image was rebuilt this run. Services whose
      # source didn't change keep their previous appVersion → their image
      # tag in the published chart still resolves to an image that exists.
      # A manual full rebuild (workflow_dispatch) rebuilds every service image,
      # so it bumps every service — mirroring the build jobs' own
      # `workflow_dispatch` trigger. When
      # bump-descriptors runs (connectors changed / full rebuild) it does the
      # bump instead, in its re-triggering commit; this step is the canonical
      # path when no connector changed and bump-descriptors was skipped.
      - name: Bump per-service subchart appVersions
        env:
          BUILD_TAG: ${{ needs.changes.outputs.build_tag }}
          FULL_REBUILD: ${{ github.event_name == 'workflow_dispatch' }}
          ANALYTICS: ${{ needs.changes.outputs.analytics }}
          AUTHENTICATOR: ${{ needs.changes.outputs.authenticator }}
          GATEWAY: ${{ needs.changes.outputs.gateway }}
          IDENTITY_RESOLUTION: ${{ needs.changes.outputs.identity_resolution }}
          GIT_CLI_PROXY: ${{ needs.changes.outputs.git_cli_proxy }}
          FRONTEND: ${{ needs.changes.outputs.frontend }}
        run: .github/workflows/scripts/bump-service-appversions.sh

      - name: Bump ingestion image refs
        env:
          BUILD_TAG: ${{ needs.changes.outputs.build_tag }}
          TOOLBOX: ${{ needs.changes.outputs.toolbox }}
          SEED: ${{ needs.changes.outputs.seed }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
        run: |
          set -euo pipefail
          # toolbox and seed are the only ingestion images pinned in
          # charts/insight/values.yaml — connector image refs travel inside
          # the toolbox image's baked descriptors (ADR-0016). Connector
          # descriptors are patched by `bump-descriptors` in a separate
          # commit (without [skip ci]) BEFORE this run.
          if [ "$TOOLBOX" = "true" ]; then
            REF="$IMAGE_PREFIX/insight-toolbox:$BUILD_TAG"
            echo "Setting ingestion.toolboxImage → $REF"
            yq -i ".ingestion.toolboxImage = \"$REF\"" charts/insight/values.yaml
          fi
          # seedImage is not deployed by the chart — nothing renders it into a
          # pod. It is published state: `seed-stand.sh` reads it back off an
          # installed release to learn which seeder image matches that stand.
          if [ "$SEED" = "true" ]; then
            REF="$IMAGE_PREFIX/insight-seed:$BUILD_TAG"
            echo "Setting ingestion.seedImage → $REF"
            yq -i ".ingestion.seedImage = \"$REF\"" charts/insight/values.yaml
          fi

      # Umbrella `version` always patch-bumps (semver, per-publish contract).
      # Umbrella `appVersion` is DISPLAY-ONLY in the deploy path — the actual
      # image.tag for each pod is resolved inside that pod's subchart from
      # the SUBCHART's appVersion. We set the umbrella appVersion to the MAX
      # of the four subchart appVersions so it summarises "the newest image
      # tag bundled in this chart artifact". `sort -V` handles the
      # YYYY.MM.DD.HH.MM-shortsha format correctly because the date prefix
      # is lexicographically sortable.
      - name: Bump umbrella version
        id: umbrella
        run: |
          set -euo pipefail
          CURRENT="$(yq '.version' charts/insight/Chart.yaml)"
          NEXT="$(echo "$CURRENT" | awk -F. '{ printf "%d.%d.%d", $1, $2, $3+1 }')"
          # yq v4 emits a `---` document separator between results when given
          # multiple files (behaviour appeared with a runner yq update,
          # 2026-06-08): without the filter below, `sort -V | tail -1` picks
          # the separator and `appVersion: "---"` ships in the published
          # chart — an invalid `app.kubernetes.io/version` label value that
          # breaks every install (charts 0.1.48–0.1.55 were affected).
          NEW_APP=$(yq -r '.appVersion' \
            src/backend/services/analytics/helm/Chart.yaml \
            src/backend/services/authenticator/helm/Chart.yaml \
            src/backend/services/gateway/helm/Chart.yaml \
            src/backend/services/identity-resolution/helm/Chart.yaml \
            src/backend/services/git-cli-proxy/helm/Chart.yaml \
            src/frontend/helm/Chart.yaml \
            | grep -Ev '^(---|null)$' \
            | sort -V | tail -1)
          # Fail loud unless the result is a build tag (YYYY.MM.DD.HH.MM-sha):
          # a malformed appVersion must never reach a published chart again.
          # On main the regex stays strict — a branch-suffixed tag leaking
          # into a main-published chart must abort. On release-** the
          # suffixed form (…-sha7.<sanitized-branch>) is the canonical tag
          # shape for images built from the branch, so accept it there.
          TAG_RE='^[0-9]{4}(\.[0-9]{2}){4}-[0-9a-f]{7}$'
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            TAG_RE='^[0-9]{4}(\.[0-9]{2}){4}-[0-9a-f]{7}(\.[A-Za-z0-9._-]+)?$'
          fi
          if ! echo "$NEW_APP" | grep -Eq "$TAG_RE"; then
            echo "ERROR: computed umbrella appVersion '$NEW_APP' is not a valid build tag for ref '${GITHUB_REF_NAME}'" >&2
            exit 1
          fi
          echo "Umbrella version $CURRENT → $NEXT (appVersion → $NEW_APP)"
          yq -i ".version = \"$NEXT\""        charts/insight/Chart.yaml
          yq -i ".appVersion = \"$NEW_APP\""  charts/insight/Chart.yaml
          # Pin new version in docs and sample gitops
          if [ -f docs/deploy/.insight-version ]; then
            echo "$NEXT" > docs/deploy/.insight-version
          fi
          if [ -f deploy/gitops/.insight-version ]; then
            echo "$NEXT" > deploy/gitops/.insight-version
          fi
          echo "version=${NEXT}" >> "$GITHUB_OUTPUT"
      - name: Helm dependency update
        run: helm dependency update charts/insight

      - name: Helm package
        run: |
          mkdir -p dist
          helm package charts/insight -d dist/

      - name: Helm registry login (GHCR)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Helm push
        id: helm_push
        run: |
          set -euo pipefail
          OUT="$(helm push "dist/insight-${{ steps.umbrella.outputs.version }}.tgz" \
            oci://ghcr.io/constructorfabric/charts 2>&1)"
          echo "$OUT"
          # helm push prints "Digest: sha256:..." — that digest is the chart's
          # OCI manifest identity, which the attestation below binds to.
          DIGEST="$(echo "$OUT" | sed -n 's/^Digest: //p')"
          if [ -z "$DIGEST" ]; then
            echo "ERROR: could not parse chart digest from helm push output" >&2
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      # attest-build-provenance with push-to-registry reads DOCKER credentials
      # (~/.docker/config.json) — `helm registry login` above writes to helm's
      # own config, which the attest action cannot see. Without this login the
      # attest step dies with "No credentials found for registry ghcr.io".
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Keyless SLSA provenance for the umbrella chart OCI artifact — same
      # contract as the image attestations (see backend-analytics). Verify:
      #   gh attestation verify oci://ghcr.io/constructorfabric/charts/insight:<ver> \
      #     --repo constructorfabric/insight
      - name: Attest chart provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/constructorfabric/charts/insight
          subject-digest: ${{ steps.helm_push.outputs.digest }}
          push-to-registry: true

      - name: Commit version bumps back to the branch
        env:
          UMBRELLA_VERSION: ${{ steps.umbrella.outputs.version }}
          BUILD_TAG: ${{ needs.changes.outputs.build_tag }}
        run: |
          set -euo pipefail
          git config user.email "ci@constructorfabric.local"
          git config user.name  "insight-ci"

          git add charts/insight/Chart.yaml \
                  charts/insight/Chart.lock \
                  charts/insight/values.yaml \
                  src/backend/services/analytics/helm/Chart.yaml \
                  src/backend/services/authenticator/helm/Chart.yaml \
                  src/backend/services/gateway/helm/Chart.yaml \
                  src/backend/services/identity-resolution/helm/Chart.yaml \
                  src/backend/services/git-cli-proxy/helm/Chart.yaml \
                  src/frontend/helm/Chart.yaml \
                  deploy/gitops/.insight-version
          # Sample gitops starter under docs/deploy — pin moves with the
          # umbrella. Stage only if present (the file is introduced by
          # the gitops-sample PR and only lives on `main` after it merges).
          if [ -f docs/deploy/.insight-version ]; then
            git add docs/deploy/.insight-version
          fi

          if git diff --staged --quiet; then
            echo "no version changes to commit"
            exit 0
          fi

          # [skip ci] in the message prevents the push from re-triggering
          # this workflow. paths-filter on the next real merge will diff
          # against THIS commit, so service-file changes are correctly
          # detected on the subsequent run.
          git commit -m "chore(release): umbrella ${UMBRELLA_VERSION} (build ${BUILD_TAG}) [skip ci]"

          # We re-anchored to the live branch tip at job start and runs are
          # serialised per-ref (see the workflow `concurrency` block), so this
          # push is expected to fast-forward. Do NOT rebase the bump commit on
          # failure: the only way the tip moves under us now is a direct human
          # push to ${GITHUB_REF_NAME}, and rebasing our bump onto it conflicts
          # on the values.yaml lines we just edited (toolboxImage, seedImage) —
          # unresolvable in CI. Fail loud instead; a plain job re-run is
          # idempotent (it recomputes against the refreshed tip, see
          # "Re-anchor" above).
          if ! git push origin "HEAD:${GITHUB_REF_NAME}"; then
            echo "push to ${GITHUB_REF_NAME} was rejected — the branch tip moved" >&2
            echo "after re-anchor (a direct human push?). Re-run this job to" >&2
            echo "recompute the bump against the new tip." >&2
            exit 1
          fi
