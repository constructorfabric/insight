name: Build & Push Container Images

on:
  push:
    # release-** pushes get the full main treatment (build → pin → publish),
    # with the branch-suffixed image tag and a PATCH-only umbrella bump. Safe
    # because trunk's minor version is bumped right after a release branch is
    # cut, so the branch's patch stream can never collide with main's.
    branches: [main, "release-**"]
    paths:
      - "src/backend/**"
      - "src/frontend/**"
      - "src/ingestion/**"
      - "charts/insight/**"
      - ".github/workflows/build-images.yml"
      - ".github/workflows/scripts/discover-image-matrix.py"
      - ".github/workflows/scripts/bump-service-appversions.sh"
  pull_request:
    branches: [main, "release-**"]
    paths:
      - "src/backend/**"
      - "src/frontend/**"
      - "src/ingestion/**"
      - "charts/insight/**"
      - ".github/workflows/build-images.yml"
      - ".github/workflows/scripts/discover-image-matrix.py"
      - ".github/workflows/scripts/bump-service-appversions.sh"
  # A manual dispatch is a full rebuild by default: every service and
  # connector image is rebuilt regardless of changed paths, and publish-chart
  # pins them all. With `frontend_only` checked it instead builds and pushes
  # JUST the frontend image from the dispatched ref (main or a branch) —
  # no backend/connector builds, no descriptor bumps, no chart publish.
  workflow_dispatch:
    inputs:
      frontend_only:
        description: "Build and push only the frontend image (skip everything else)"
        type: boolean
        default: false

# One in-flight chart-publish per branch. Prevents two merges from racing
# the auto-commit-back step. PR builds have no publish to protect, and a new
# push obsoletes the matrix in flight — cancel it rather than let a stale
# build keep burning runners next to the fresh one it queues behind.
concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/constructorfabric

permissions:
  contents: write # publish-chart auto-commits Chart.yaml bumps back to main
  packages: write # publish-chart pushes the umbrella chart to GHCR
  id-token: write # keyless OIDC identity for attest-build-provenance
  attestations: write # store SLSA provenance in the repo attestation store

jobs:
  # ─── Backend / chart change detection ──────────────────────────────────────
  # Per-service filters so a single-service code change only rebuilds that one
  # image. Connector image builds are NOT handled here — see discover-images,
  # which scans every descriptor.yaml's `images:` block (ADR-0016).
  changes:
    runs-on: ubuntu-latest
    outputs:
      analytics: ${{ steps.filter.outputs.analytics }}
      authenticator: ${{ steps.filter.outputs.authenticator }}
      gateway: ${{ steps.filter.outputs.gateway }}
      identity_resolution: ${{ steps.filter.outputs.identity_resolution }}
      git_cli_proxy: ${{ steps.filter.outputs.git_cli_proxy }}
      frontend: ${{ steps.filter.outputs.frontend }}
      toolbox: ${{ steps.filter.outputs.toolbox }}
      seed: ${{ steps.filter.outputs.seed }}
      umbrella: ${{ steps.filter.outputs.umbrella }}
      arches: ${{ steps.arches.outputs.arches }}
      build_tag: ${{ steps.tag.outputs.build_tag }}
      # Single push-policy switch consumed by every build/merge job below:
      # 'true' for a main push and for ANY workflow_dispatch (including a
      # branch dispatch — that is what branch image builds are, #1994);
      # 'false' for pull_request runs, which build without pushing.
      # Publishing side-effects are gated per-ref: bump-descriptors and
      # publish-chart run on main AND release-** (branch builds get pinned
      # into the branch's chart, #1994 follow-up); the `latest` tag and the
      # strict suffix-less appVersion regex stay main-only.
      should_push: ${{ steps.tag.outputs.should_push }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select build architectures
        id: arches
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo 'arches=["amd64"]' >> "$GITHUB_OUTPUT"
          else
            echo 'arches=["amd64","arm64"]' >> "$GITHUB_OUTPUT"
          fi
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # Diff against the pushed-to branch itself, NOT the repo default
          # branch (dorny's default base). On a release-** push the default
          # would diff the whole branch against main and mark every service
          # changed on every push; base=ref_name keeps the per-push diff
          # semantics main has always had. Ignored on pull_request events.
          base: ${{ github.ref_name }}
          filters: |
            analytics:
              - '.github/workflows/build-images.yml'
              - 'src/backend/services/analytics/**'
              - 'src/backend/libs/insight-clickhouse/**'
              # The shared entrypoint is baked into the image.
              - 'src/backend/docker-entrypoint.sh'
              - 'src/backend/Cargo.toml'
              - 'src/backend/Cargo.lock'
            authenticator:
              - '.github/workflows/build-images.yml'
              - 'src/backend/services/authenticator/**'
              - 'src/backend/libs/authenticator-sdk/**'
              - 'src/backend/Cargo.toml'
              - 'src/backend/Cargo.lock'
            gateway:
              - '.github/workflows/build-images.yml'
              - 'src/backend/services/gateway/**'
              - 'src/backend/tools/routegen/**'
              - 'src/backend/Cargo.toml'
              - 'src/backend/Cargo.lock'
            git_cli_proxy:
              - '.github/workflows/build-images.yml'
              - 'src/backend/services/git-cli-proxy/**'
              # The shared entrypoint is baked into the image.
              - 'src/backend/docker-entrypoint.sh'
              - 'src/backend/Cargo.toml'
              - 'src/backend/Cargo.lock'
            identity_resolution:
              - '.github/workflows/build-images.yml'
              - 'src/backend/services/identity-resolution/**'
              # The image compiles the path-dependency lib in — a lib change
              # must republish this image (same for analytics above).
              - 'src/backend/libs/insight-clickhouse/**'
              # The shared entrypoint is baked into the image too.
              - 'src/backend/docker-entrypoint.sh'
              - 'src/backend/Cargo.toml'
              - 'src/backend/Cargo.lock'
            # Includes src/frontend/helm/, so a subchart edit rebuilds and
            # republishes as it does for the services above.
            frontend:
              - '.github/workflows/build-images.yml'
              - 'src/frontend/**'
            toolbox:
              - '.github/workflows/build-images.yml'
              - 'src/ingestion/**'
            # The sample-data seeder's own image. It COPYs a subset of the
            # ingestion tree (scripts, dbt, silver, gold, connectors, the tool
            # itself), but the filter stays as wide as the toolbox's on
            # purpose: a narrower list would have to be kept in step with the
            # Dockerfile's COPY lines, and the failure mode of forgetting is a
            # silently stale published image.
            seed:
              - '.github/workflows/build-images.yml'
              - 'src/ingestion/**'
            umbrella:
              - '.github/workflows/build-images.yml'
              - 'charts/insight/**'

      # Compute the canonical build tag once per workflow run so every
      # downstream job (backend builds + matrix connector builds + toolbox +
      # chart publish) tags with the SAME string. metadata-action's {{date}}
      # would otherwise drift by up to a minute across parallel steps, and
      # subchart appVersion bumps would point at images that don't exist.
      #
      # Branch builds (#1994) append `.<sanitized-branch>` after the sha so a
      # branch image can never be mistaken for (or `sort -V`-beat) a main
      # release tag — main keeps the suffix-less format, and publish-chart's
      # appVersion regex rejects the suffixed form on main as a backstop
      # (release-** publishes accept it — that's their canonical tag shape).
      - name: Compute build tag and push policy
        id: tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          BUILD_TAG="$(date -u +%Y.%m.%d.%H.%M)-$(echo "${GITHUB_SHA}" | cut -c1-7)"
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            # Fail fast on branch names outside the docker-tag charset (+ `/`):
            # byte-wise sanitization would mangle unicode names into ambiguous,
            # potentially colliding tags. Rename the branch instead.
            if ! printf '%s' "$REF_NAME" | LC_ALL=C grep -Eq '^[A-Za-z0-9._/-]+$'; then
              echo "::error::branch name '$REF_NAME' contains characters outside [A-Za-z0-9._/-] — non-ASCII branch names are not allowed for image builds; rename the branch"
              exit 1
            fi
            # Docker tag charset is [A-Za-z0-9._-] (branch names carry `/`);
            # cap the suffix well under the 128-char tag limit and trim
            # separator runs the sanitizer may produce at the edges.
            SAFE_BRANCH="$(printf '%s' "$REF_NAME" \
              | tr -c 'a-zA-Z0-9._-' '-' \
              | sed -E 's/^[-.]+//; s/[-.]+$//' \
              | cut -c1-60)"
            # All-separator names (e.g. `-`) pass the allowlist but sanitize
            # to nothing — a bare trailing `.` is not a usable tag suffix.
            if [ -z "$SAFE_BRANCH" ]; then
              echo "::error::branch name '$REF_NAME' sanitizes to an empty tag suffix — rename the branch"
              exit 1
            fi
            BUILD_TAG="${BUILD_TAG}.${SAFE_BRANCH}"
          fi
          # Push policy: pull_request builds are compile-only; push (main is
          # the only on.push branch) and workflow_dispatch (any ref) push.
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            SHOULD_PUSH=false
          else
            SHOULD_PUSH=true
          fi
          echo "build_tag=${BUILD_TAG}" >> "$GITHUB_OUTPUT"
          echo "should_push=${SHOULD_PUSH}" >> "$GITHUB_OUTPUT"
          echo "Build tag for this run: ${BUILD_TAG} (push: ${SHOULD_PUSH})"

  # ─── Connector image discovery (ADR-0016) ──────────────────────────────────
  # Scan every src/ingestion/connectors/*/*/descriptor.yaml's `images:` map
  # and produce a matrix of {connector_dir, key, name, dockerfile, context,
  # image} entries to build in this run.
  #
  # An entry fires when at least one changed path lives under
  # `<connector_dir>/<context>/` AND is NOT the connector's descriptor.yaml.
  # The descriptor exclusion is the recursion-break: bump-descriptors patches
  # `images.<key>.image` in descriptor.yaml on every successful push without
  # `[skip ci]`, and that push re-triggers this workflow. If the descriptor
  # itself fired image rebuilds, we'd loop forever.
  # 
  # `workflow_dispatch` (full rebuild) emits every entry; PR runs use the same
  # path-filter logic as push runs. A frontend-only dispatch skips discovery
  # entirely — build-image, merge-image and bump-descriptors all key off
  # `outputs.any`, so they cascade-skip with it.
  discover-images:
    if: github.event_name != 'workflow_dispatch' || !inputs.frontend_only
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.scan.outputs.matrix }}
      any: ${{ steps.scan.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need parent commit for the changed-paths diff.
          fetch-depth: 0
      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml
      - name: Scan descriptors and filter by changed paths
        id: scan
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Determine base for the changed-paths diff:
          # - push: github.event.before (parent before the push)
          # - pull_request: base sha of the PR
          # - workflow_dispatch: HEAD~1 (single-commit lookback fallback)
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE_SHA"
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ -n "$EVENT_BEFORE" ] \
               && [ "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            BASE="$EVENT_BEFORE"
          else
            BASE="HEAD~1"
          fi

          # Full-rebuild semantics on workflow_dispatch: emit every image entry
          # regardless of changed paths.
          ALL_FLAG=""
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            ALL_FLAG="--all"
          elif grep -Fxq '.github/workflows/build-images.yml' /tmp/changed.txt; then
            ALL_FLAG="--all"
          fi

          if ! git rev-parse "$BASE" >/dev/null 2>&1; then
            echo "WARN: base $BASE not resolvable; treating as no changes (matrix may be empty)" >&2
            : > /tmp/changed.txt
          else
            git diff --name-only "$BASE" "$GITHUB_SHA" > /tmp/changed.txt || true
          fi
          echo "--- changed paths vs $BASE ---"
          cat /tmp/changed.txt
          echo "--- end ---"

          MATRIX="$(python3 .github/workflows/scripts/discover-image-matrix.py \
            --connectors-root src/ingestion/connectors \
            --changed /tmp/changed.txt \
            $ALL_FLAG)"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          LEN="$(echo "$MATRIX" | jq 'length')"
          if [ "$LEN" -gt 0 ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi
          echo "discovered $LEN image entries"
          echo "$MATRIX" | jq . || true

  # ─── Backend per-service builds ────────────────────────────────────────────
  # Split from a single matrix job so that a change touching only one service
  # rebuilds only that image — and only that subchart's `appVersion` gets
  # bumped downstream. This is what makes per-service granularity actually
  # work in the gitops promotion flow (see publish-chart for the appVersion
  # logic).

  # INVARIANT: PR validation builds amd64 only; publishing builds both supported architectures on native runners.
  backend-analytics:
    needs: changes
    if: |
      needs.changes.outputs.analytics == 'true'
      || (github.event_name == 'workflow_dispatch' && !inputs.frontend_only)
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJson(needs.changes.outputs.arches) }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: needs.changes.outputs.should_push == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: src/backend
          file: src/backend/services/analytics/Dockerfile
          platforms: linux/${{ matrix.arch }}
          # PR amd64 legs write a loadable tarball instead of discarding the
          # result — the e2e rig consumes it (see "Upload image for the e2e
          # rig" below). Other legs keep the push-by-digest output.
          tags: ${{ github.event_name == 'pull_request' && matrix.arch == 'amd64' && 'insight-analytics:e2e-prebuilt' || '' }}
          outputs: ${{ github.event_name == 'pull_request' && matrix.arch == 'amd64' && 'type=docker,dest=/tmp/e2e-prebuilt.tar' || format('type=image,name={0}/insight-analytics,push-by-digest=true,name-canonical=true,push={1}', env.IMAGE_PREFIX, needs.changes.outputs.should_push == 'true') }}
          cache-from: type=gha,scope=analytics-${{ matrix.arch }}
          # Cache writes from PR runs land in branch-isolated caches invisible to other refs, yet still consume the shared 10 GB repo quota — only main/dispatch runs export.
          cache-to: ${{ needs.changes.outputs.should_push == 'true' && format('type=gha,mode=max,scope=analytics-{0},ignore-error=true', matrix.arch) || '' }}
      # Hand the PR-built image to e2e-bronze-to-api.yml's runner build so it
      # doesn't recompile the same source (registry has no PR images to pull).
      - name: Upload image for the e2e rig
        if: github.event_name == 'pull_request' && matrix.arch == 'amd64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-prebuilt-insight-analytics
          path: /tmp/e2e-prebuilt.tar
          if-no-files-found: error
          retention-days: 1
          overwrite: true
      - name: Export digest
        if: needs.changes.outputs.should_push == 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        if: needs.changes.outputs.should_push == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-analytics-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-analytics:
    needs: [changes, backend-analytics]
    # != 'skipped', not == 'success': a failed platform build must turn this
    # gate red, not skip it — a skipped required check reads as satisfied.
    if: |
      always()
      && needs.backend-analytics.result != 'skipped'
      && needs.changes.outputs.should_push == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Require the platform builds to have passed
        if: needs.backend-analytics.result != 'success'
        run: |
          echo "::error::backend-analytics finished '${{ needs.backend-analytics.result }}' — nothing to merge."
          exit 1
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-analytics-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE_PREFIX }}/insight-analytics
          tags: |
            type=raw,value=${{ needs.changes.outputs.build_tag }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fail on a fixable critical before any tag points here
        uses: ./.github/actions/image-cve-gate
        with:
          image: ${{ env.IMAGE_PREFIX }}/insight-analytics
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch manifest and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE_PREFIX }}/insight-analytics@sha256:%s ' *)
      - name: Inspect manifest digest
        id: inspect
        run: |
          DIGEST=$(docker buildx imagetools inspect \
            ${{ env.IMAGE_PREFIX }}/insight-analytics:${{ needs.changes.outputs.build_tag }} \
            --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}/insight-analytics
          subject-digest: ${{ steps.inspect.outputs.digest }}
          push-to-registry: true
      # Copy-pastable pushed ref on the run's Summary page (#1994).
      - name: Report pushed image
        run: |
          echo '- `${{ env.IMAGE_PREFIX }}/insight-analytics:${{ needs.changes.outputs.build_tag }}`' >> "$GITHUB_STEP_SUMMARY"

  backend-authenticator:
    needs: changes
    if: |
      needs.changes.outputs.authenticator == 'true'
      || (github.event_name == 'workflow_dispatch' && !inputs.frontend_only)
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJson(needs.changes.outputs.arches) }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: needs.changes.outputs.should_push == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: src/backend
          file: src/backend/services/authenticator/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}/insight-authenticator,push-by-digest=true,name-canonical=true,push=${{ needs.changes.outputs.should_push == 'true' }}
          cache-from: type=gha,scope=authenticator-${{ matrix.arch }}
          cache-to: ${{ needs.changes.outputs.should_push == 'true' && format('type=gha,mode=max,scope=authenticator-{0},ignore-error=true', matrix.arch) || '' }}
      - name: Export digest
        if: needs.changes.outputs.should_push == 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        if: needs.changes.outputs.should_push == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-authenticator-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-authenticator:
    needs: [changes, backend-authenticator]
    if: |
      always()
      && needs.backend-authenticator.result != 'skipped'
      && needs.changes.outputs.should_push == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Require the platform builds to have passed
        if: needs.backend-authenticator.result != 'success'
        run: |
          echo "::error::backend-authenticator finished '${{ needs.backend-authenticator.result }}' — nothing to merge."
          exit 1
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-authenticator-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE_PREFIX }}/insight-authenticator
          tags: |
            type=raw,value=${{ needs.changes.outputs.build_tag }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fail on a fixable critical before any tag points here
        uses: ./.github/actions/image-cve-gate
        with:
          image: ${{ env.IMAGE_PREFIX }}/insight-authenticator
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch manifest and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
