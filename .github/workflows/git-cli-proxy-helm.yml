# Helm render-contract for the git-cli-proxy chart.
#
# This is the first chart in the repo with a PersistentVolumeClaim, and its
# correctness rests on facts a diff does not show: one writer for a
# ReadWriteOnce volume, ingress closed until a namespace is allowed, and byte
# budgets rendered as integers rather than the scientific notation Helm
# produces for large YAML numbers. Pure `helm template` + assertions — no
# cluster, no images.

name: git-cli-proxy helm

on:
  pull_request:
    branches: [main]
    paths:
      - "src/backend/services/git-cli-proxy/helm/**"
      - "charts/insight/**"
      - ".github/workflows/git-cli-proxy-helm.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helm-contract:
    name: render contract
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          # This job never pushes; the default leaves the token in
          # .git/config where every later step can read it.
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: pip install pytest pyyaml
      - name: helm lint
        run: |
          helm lint src/backend/services/git-cli-proxy/helm \
            --set existingSecret=cfg \
            --set 'networkPolicy.allowedNamespaceLabels[0].key=kubernetes.io/metadata.name' \
            --set 'networkPolicy.allowedNamespaceLabels[0].values[0]=airbyte'
      - name: Render contract
        run: pytest src/backend/services/git-cli-proxy/helm/tests/ -q
