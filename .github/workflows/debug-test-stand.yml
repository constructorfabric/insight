# TEMPORARY — delete before merge (tracked in PR #2404). Pre-merge CI trigger
# for the deploy pipeline; fires only when this file changes on this branch.
# run marker: 12 — full suite
name: debug-test-stand
on:
  push:
    branches: [test-stand-ci]
    paths: ['.github/workflows/debug-test-stand.yml']

permissions:
  contents: read

jobs:
  resolve:
    name: resolve newest published chart
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          set -euo pipefail
          v="$(helm show chart oci://ghcr.io/constructorfabric/charts/insight | yq -r '.version // ""')"
          [ -n "$v" ] || { echo "::error::could not resolve the newest published chart version"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

  run:
    name: deploy → seed → smoke (debug)
    needs: resolve
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-test-stand.yml
    with:
      chart_version: ${{ needs.resolve.outputs.version }}
    secrets: inherit
