# TEMPORARY — delete before merge (tracked in PR #2404).
#
# Debug trigger for the deploy→edge→seed→smoke pipeline from THIS branch:
# workflow_dispatch only registers from the default branch, so pre-merge the
# only way to exercise deploy-test-stand.yml in CI is a push-triggered caller.
# Fires only when this file itself changes — bump the run marker below.
#
# `secrets: inherit` is debug-only: the real caller (build-images.yml) passes
# nothing and expects the insight-test-stand GitHub environment to carry the
# credentials; this branch's interim secrets are repo-level.
#
# run marker: 4
name: debug-test-stand
on:
  push:
    branches: [test-stand-ci]
    paths: ['.github/workflows/debug-test-stand.yml']

permissions:
  contents: read

jobs:
  resolve:
    name: resolve newest published chart
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          set -euo pipefail
          v="$(helm show chart oci://ghcr.io/constructorfabric/charts/insight | yq -r '.version // ""')"
          [ -n "$v" ] || { echo "::error::could not resolve the newest published chart version"; exit 1; }
          echo "resolved $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

  run:
    name: deploy → seed → smoke (debug)
    needs: resolve
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-test-stand.yml
    with:
      chart_version: ${{ needs.resolve.outputs.version }}
    secrets: inherit
