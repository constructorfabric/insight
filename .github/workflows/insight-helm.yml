name: Insight — Helm contract

on:
  pull_request:
    branches: [main]
    paths:
      - "charts/insight/**"
      - "src/backend/services/**/helm/**"
      - "src/frontend/helm/**"
      - ".github/workflows/insight-helm.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  helm-contract:
    name: render contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install --quiet pytest pyyaml
      - name: Helm lint
        run: |
          helm lint src/backend/services/identity-resolution/helm
          helm dependency update charts/insight
          helm lint charts/insight
          helm lint charts/insight --values charts/insight/tests/values.yaml
      - name: Render-contract tests
        run: >-
          python -m pytest
          charts/insight/tests/
          src/backend/services/identity-resolution/helm/tests/
          -q
