name: Insight — Helm contract

on:
  pull_request:
    branches: [main]
    paths:
      - "charts/insight/**"
      - "src/backend/services/**/helm/**"
      - "src/frontend/helm/**"
      - "deploy/compose/insight-init.sh"
      - "deploy/compose/tests/**"
      - "deploy/gitops/scripts/**"
      - "deploy/gitops/environments/local/**"
      - ".github/workflows/insight-helm.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Routing: .github/runners/README.md.
jobs:
  helm-contract:
    name: render contract
    runs-on: ${{ (vars.INSIGHT_FORCE_GITHUB_HOSTED == 'true' || github.repository != 'constructorfabric/insight' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-latest' || 'insight-small' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          pip install --quiet pytest pyyaml
          if ! command -v openssl >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y openssl
          fi
          openssl version
      - name: Install yq
        env:
          YQ_VERSION: 4.54.1
          YQ_SHA256: 8e34fc298390875de416e6a4afcb8cabeceb25d9aa8506c1a2f9353cf702ea5f
        run: |
          set -euo pipefail
          bin="${RUNNER_TEMP}/yq-bin"
          mkdir -p "$bin"
          curl -fsSL --retry 3 --retry-delay 2 -o "$bin/yq" \
            "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64"
          printf '%s  %s\n' "$YQ_SHA256" "$bin/yq" | sha256sum -c -
          chmod 0755 "$bin/yq"
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/yq" --version
      - name: Helm lint
        run: |
          helm lint src/backend/services/identity-resolution/helm
          helm dependency update charts/insight
          helm lint charts/insight
          helm lint charts/insight --values charts/insight/tests/values.yaml
      - name: Render-contract tests
        run: >-
          python -m pytest
          charts/insight/tests/
          src/backend/services/identity-resolution/helm/tests/
          deploy/compose/tests/
          deploy/gitops/scripts/tests/
          -q
