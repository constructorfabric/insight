name: E2E — Bronze to API

# End-to-end transformation tests covering bronze → dbt → ClickHouse
# migration views → analytics HTTP response → expect rules.
#
# Everything (Python, Rust, dbt, pytest) runs inside the runner image
# defined at src/ingestion/tests/e2e/compose/Dockerfile.runner. The same
# image is used for local development via src/ingestion/tests/e2e/e2e.sh.
#
# This is now the DATA-PATH rig, and only that. The `api` and `identity-rust`
# lanes retired with the HTTP contract suites they ran: those contracts are
# asserted against a deployed stand in `e2e-stand.yml` (tests/stand), which
# crosses a real gateway with a real Keycloak session and can therefore prove
# the 401/403 behaviour an in-process rig structurally cannot. What is left
# here is what only this rig can do — bronze → dbt → ClickHouse → analytics
# response, over fixtures it seeds itself.
#
# Topology: a cheap `changes` job decides whether the diff can reach the data
# path at all and everything expensive hangs off it; a shared upstream `build`
# job assembles the runner image ONCE —
# on PRs from the component images build-images.yml already built (or the
# published :latest for path-skipped components), elsewhere by compiling
# analytics + each connector's enrich binary via build-only services — and
# hands it to `e2e-metrics` as a saved image
# artifact, which also makes `build` the SOLE writer of the GHA BuildKit
# cache scopes wired in compose/docker-compose.cache.yml (two concurrent
# writers to the same scope key just thrash each other's cache). The lane is
# a shard matrix: each leg loads the pre-built image, boots its own isolated
# stack, runs its slice of the suite, and snapshots that session's
# `.artifacts/` for `metric-coverage-gate`, which analyses it
# as a pure-Python check (no Docker, no app boot). See
# src/ingestion/tests/e2e/lib/{metric_coverage,collect_metric_definitions}.py.
#
# Specs: docs/domain/bronze-to-api-e2e/specs/
# Code:  src/ingestion/tests/e2e/

on:
  # PR-only (+ manual dispatch). workflow_dispatch remains for manual reruns
  # against main.
  pull_request:
    branches: [main]
    # Deliberately NO `paths:` filter. This workflow emits a REQUIRED check
    # ("Run E2E suite"), and GitHub reports a required check whose workflow
    # never ran as pending rather than passed — a path filter here would block
    # every PR that did not happen to touch one of the listed directories.
    # Relevance is decided by the `changes` job below instead, which is cheap
    # and always reports. Same pattern as e2e-stand.yml.
  # Merge-queue builds: the queue's gh-readonly-queue/* branches emit merge_group,
  # and the required "Run E2E suite" check must report there or every queued PR
  # times out and is evicted.
  merge_group:
  workflow_dispatch:

# A new push obsoletes any run still in flight for the same ref — cancel it so a
# rebase/force-push doesn't leave a slow suite burning minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # NB: forbids developers from running `pytest --update-snapshots` in CI.
  # The guard lives in src/ingestion/tests/e2e/metrics/test_fixtures.py.
  CI: "true"

permissions:
  contents: read
  # e2e-suite reads this SHA's "Build & Push Container Images" run conclusion.
  actions: read

jobs:
  # `e2e-suite` emits the "Run E2E suite" status check the `main` ruleset
  # requires, so branch protection needs no change when lanes come and go —
  # only this file's `needs:` does. It is the one job here that runs
  # unconditionally — a required check must report on EVERY pull request,
  # including the ones `changes` decided are irrelevant.
  #
  # Skipping cascades by default `needs` semantics: `changes` says irrelevant →
  # `build` skips → `e2e-metrics` skips → `metric-coverage-gate` skips. A red
  # `build` produces the same cascade, so the umbrella distinguishes the two
  # cases from `changes`'s own output rather than from the lane results.

  # ─── changes ──────────────────────────────────────────────────────────────
  # What an `on: paths:` filter would have done, moved into a job so the
  # workflow ALWAYS runs and the umbrella below can always report.
  #
  # The list is deliberately over-inclusive: a false positive costs one
  # unnecessary suite run — today's behaviour for every PR — while a false
  # negative greens a required check over untested data-path changes. It covers
  # everything the runner image bakes in or the suite reads at run time:
  #
  #   src/ingestion/  the rig itself (tests/e2e), dbt models, the migration and
  #                   connectors-ddl scripts, and every connector's enrich
  #                   source (jira-enrich is baked into the runner image)
  #   src/backend/    analytics and identity-resolution — compiled from their
  #                   own Dockerfiles into the runner image, and the analytics
  #                   HTTP response is the last hop every metric fixture
  #                   asserts on
  #   build-images.yml  the PR path consumes its e2e-prebuilt-* artifacts by
  #                   name, so a change there can break this workflow's build
  #
  # src/frontend/, deploy/, tests/ (the deployed-stand suite) and docs/ are
  # absent on purpose: nothing in this rig loads them.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The diff needs both endpoints; the default shallow fetch has
          # neither the base nor enough history to reach a merge base.
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # No base to diff against (a merge_group without one, or a manual
          # dispatch): assume relevant rather than skipping a required gate on
          # a guess.
          if [ -z "${BASE:-}" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "no base sha — running"
            exit 0
          fi
          # Diff from the MERGE BASE, not from the base branch's tip. A two-dot
          # `git diff BASE HEAD` reports every file that differs between the
          # two commits, which includes everything that landed on the base
          # branch since this branch forked — attributed to this PR. Any branch
          # not freshly rebased would then look like it touched the data path
          # and the gate would never skip anything.
          base_point="$(git merge-base "$BASE" "$HEAD" 2>/dev/null || true)"
          if [ -z "$base_point" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "no merge base between $BASE and $HEAD — running"
            exit 0
          fi
          changed="$(git diff --name-only "$base_point" "$HEAD")"
          echo "$changed" | sed 's/^/  /'
          if echo "$changed" | grep -qE '^(src/ingestion/|src/backend/|\.github/workflows/e2e-bronze-to-api\.yml|\.github/workflows/build-images\.yml)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "nothing on the bronze → dbt → ClickHouse → analytics path changed"
          fi

  # ─── Build the runner image once, shared by both lanes ────────────────────
  build:
    name: Build runner image
    needs: changes
    if: ${{ needs.changes.outputs.relevant == 'true' }}
    runs-on: ubuntu-latest
    # This compile-only job keeps the old combined job's full ceiling: a cold
    # GHA cache (Cargo.lock bump, the 7-day cache eviction, or the 10 GB
    # per-repo cache quota getting evicted by other workflows) means a full
    # Rust recompile of analytics + each connector's enrich binary — the
    # warm-cache fast path below is not guaranteed.
    timeout-minutes: 30

    defaults:
      run:
        working-directory: src/ingestion/tests/e2e

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # docker-container buildx driver — required for the gha cache export that
      # compose/docker-compose.cache.yml wires onto the build-only services.
      # From-source path only: the PR path below needs the DEFAULT driver, which
      # is the only one that resolves `docker-image://` contexts from the local
      # daemon store (compose/docker-compose.prebuilt.yml).
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        if: github.event_name != 'pull_request'

      # Expose ACTIONS_RUNTIME_TOKEN / ACTIONS_CACHE_URL to run steps. The
      # type=gha cache backend needs them; GitHub only hands them to JS
      # actions, so `docker compose build` in a plain run step never sees
      # them and buildx SILENTLY drops the cache_from/cache_to config —
      # every run was a full Rust recompile.
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
        if: github.event_name != 'pull_request'

      # ─── PR path: consume the images build-images.yml already built ─────
      # A PR run of that workflow compiles the exact same source this rig
      # would (same Dockerfiles, same contexts) and uploads the amd64 legs as
      # e2e-prebuilt-* artifacts; components it path-skipped are unchanged in
      # the merge ref, so the published :latest IS their build. Either way the
      # rig compiles no Rust here. Components whose artifact the run inventory
      # promises must download — no silent registry fallback, that would bake
      # a stale binary into a green run.
      #
      # merge_group / dispatch SHAs have no build-images run, so those events
      # keep the from-source path below.
      - name: Fetch pre-built component images
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          run_json=""
          # 70 x 30s = 35min: a dependency bump invalidates the whole cargo
          # build cache and a cold image build can exceed the old 20min window.
          for attempt in $(seq 1 70); do
            run_json=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}&per_page=100" \
              --jq '[.workflow_runs[] | select(.name == "Build & Push Container Images")] | sort_by(.run_started_at) | last // empty')
            if [ -z "$run_json" ]; then
              echo "No image-build run for ${HEAD_SHA} — every component comes from the registry."
              break
            fi
            conclusion=$(jq -r '.conclusion // ""' <<<"$run_json")
            if [ "$conclusion" = "success" ]; then
              break
            fi
            if [ -n "$conclusion" ]; then
              echo "::error::Image-build run concluded '${conclusion}' — its artifacts can't be trusted; see $(jq -r '.html_url' <<<"$run_json")"
              exit 1
            fi
            echo "Image-build run still in progress (attempt ${attempt}/70); retrying in 30s…"
            sleep 30
          done
          if [ -n "$run_json" ] && [ "$(jq -r '.conclusion // ""' <<<"$run_json")" != "success" ]; then
            echo "::error::Image-build run did not finish within the polling window."
            exit 1
          fi

          expected=""
          if [ -n "$run_json" ]; then
            run_id=$(jq -r '.id' <<<"$run_json")
            expected=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" \
              --jq '[.artifacts[].name | select(startswith("e2e-prebuilt-"))] | join(" ")')
            if [ -n "$expected" ]; then
              gh run download "$run_id" -R "$GITHUB_REPOSITORY" -p 'e2e-prebuilt-*' -D /tmp/e2e-prebuilt
            fi
          fi

          for name in insight-analytics insight-identity-resolution insight-jira-enrich; do
            case " ${expected} " in
              *" e2e-prebuilt-${name} "*)
                docker load < "/tmp/e2e-prebuilt/e2e-prebuilt-${name}/e2e-prebuilt.tar"
                echo "${name}: PR-built artifact"
                ;;
              *)
                docker pull -q "ghcr.io/constructorfabric/${name}:latest"
                docker tag "ghcr.io/constructorfabric/${name}:latest" "${name}:e2e-prebuilt"
                echo "${name}: registry :latest (unchanged by this PR)"
                ;;
            esac
          done

      # ─── Build the runner image ─────────────────────────────────────────
      # The runner bakes in analytics + each connector's enrich binary, each
      # compiled FROM ITS OWN Dockerfile via build-only services wired as
      # `additional_contexts` (see compose/docker-compose.runner.yml). Nothing is
      # compiled inside the runner at test time.
      #
      # E2E_COMPOSE_OVERLAYS picks the source of those binaries: PRs point the
      # contexts at the pre-built images fetched above (docker-compose.prebuilt.yml
      # — pip layer uncached, but no Rust compiles at all); merge_group /
      # dispatch compile from source with the GHA BuildKit cache
      # (docker-compose.cache*.yml) — on a warm cache with an unchanged
      # Cargo.lock the dependency-compile layers restore instead of recompiling.
      - name: Build runner image
        run: ./e2e.sh build
        env:
          E2E_COMPOSE_OVERLAYS: ${{ github.event_name == 'pull_request' && 'compose/docker-compose.prebuilt.yml' || (github.event_name == 'merge_group' && 'compose/docker-compose.cache-ro.yml' || 'compose/docker-compose.cache.yml') }}
          # From-source path only: delegate the build to buildx bake so the
          # three build-only component images (analytics, identity-resolution,
          # jira-enrich) compile CONCURRENTLY in one BuildKit graph instead of
          # one compose service at a time. Cache-scope safety is unchanged —
          # each service keeps its own gha scope, still one writer per scope.
          # The PR path stays on the classic builder: bake is not needed there
          # (no Rust compiles at all) and the docker-image:// prebuilt contexts
          # are only guaranteed to resolve from the daemon store with the
          # default driver/builder. Explicit 'false', not '' — compose parses
          # the variable with strict ParseBool and dies on an empty string.
          COMPOSE_BAKE: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}

      # ─── Hand the built image to both lanes ─────────────────────────────
      # Only insight-e2e-runner:latest travels: analytics and jira-enrich
      # (compose/docker-compose.runner.yml) are build-only services consumed
      # as `additional_contexts` while building the runner above and are
      # never started themselves, so their images aren't needed at test time.
      # zstd (multi-threaded, default level) keeps the round-trip fast — the
      # tarball only needs to survive the few minutes until the two lanes
      # download it, hence retention-days: 1.
      # zstd ships in the ubuntu-latest runner image today; the guard keeps a
      # future image revision from failing the required check with a bare
      # command-not-found.
      - name: Ensure zstd is available
        run: command -v zstd >/dev/null || (sudo apt-get update && sudo apt-get install -y zstd)

      - name: Save runner image
        run: docker save insight-e2e-runner:latest | zstd -T0 -o runner-image.tar.zst

      - name: Upload runner image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-runner-image
          path: src/ingestion/tests/e2e/runner-image.tar.zst
          if-no-files-found: error
          retention-days: 1
          # Single-writer per-run artifact; lets "Re-run failed jobs" replace
          # a half-uploaded tarball instead of erroring "artifact already
          # exists".
          overwrite: true

  e2e-metrics:
    name: metrics (shard ${{ matrix.shard }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Every leg reports: a red shard must not cancel its siblings, or their
      # failures (and coverage artifacts) vanish with it.
      fail-fast: false
      matrix:
        # Shards of the metrics suite, one isolated stack per leg, sliced BY
        # FIXTURE FAMILY (filename prefix), not round-robin. Families must not
        # split across shards: fixtures leak state to LATER tests in the same
        # session through table existence — e.g. every ai_* silver build
        # eagerly selects assert_cursor_event_cost_attributed (dbt's default
        # indirect selection), whose ephemeral ref compiles to a read of the
        # cursor staging tables, and those only exist once a cursor-seeding
        # fixture (ai_active_days, alphabetically first) has run in the same
        # session. Grouping a family keeps its alphabetical order — exactly
        # the serial lane's semantics. (Round-robin sharding was tried and
        # tripped precisely this: dbt indirect-selection modes don't help —
        # `cautious`/`buildable` would silently deselect that test everywhere
        # because its ephemeral parent is never in any build's selection.)
        #
        # `rest` is the complement of the named prefixes (see the run step),
        # so every yaml lands in EXACTLY one shard by construction and a new
        # test — even with a brand-new prefix — can never silently fall out
        # of CI. Rebalancing = promoting a prefix out of `rest` into its own
        # leg here AND excluding it in the run step's `rest` branch.
        shard: [ai, collab, tasks, rest]

    defaults:
      run:
        working-directory: src/ingestion/tests/e2e

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ─── Load the shared runner image ───────────────────────────────────
      # Built once by the `build` job above; loading tags it back as
      # insight-e2e-runner:latest, exactly what compose expects, so the
      # `./e2e.sh test` below never re-triggers a build.
      - name: Download runner image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-runner-image
          path: src/ingestion/tests/e2e

      # zstd ships in the ubuntu-latest runner image today; the guard keeps a
      # future image revision from failing the required check with a bare
      # command-not-found.
      - name: Ensure zstd is available
        run: command -v zstd >/dev/null || (sudo apt-get update && sudo apt-get install -y zstd)

      - name: Load runner image
        run: zstd -d < runner-image.tar.zst | docker load

      # This job runs a single suite session, so there's no cross-session
      # ledger merge to worry about — but a reused workspace (self-hosted
      # runner) could still leave a stale .artifacts/ behind from a previous
      # run; start from a clean slate so dead coverage can't survive.
      - name: Reset coverage artifacts
        run: rm -rf .artifacts

      # ─── Run this shard's slice inside the runner ───────────────────────
      # `./e2e.sh test <node-ids>` (docker compose run runner) starts the
      # clickhouse + mariadb `depends_on` services — compose pulls their images
      # on demand and waits for `service_healthy` — so no explicit image
      # pre-pull is needed.
      #
      # This lane runs only the metrics/ suite — the bronze→dbt→gold→API metric
      # fixtures (the yaml rig) — split across the shard matrix: each leg gets
      # its own runner VM, hence its own ClickHouse/MariaDB/dbt target/analytics
      # — full isolation with zero changes to the session rig. The slice is
      # this shard's fixture family (see the matrix comment for why families
      # must stay whole), expanded into explicit pytest node ids: exhaustive by
      # construction (no `-k` substring traps — an id that is a prefix of
      # another cannot leak across shards, and a new test can never silently
      # fall out of CI thanks to the complement `rest` shard).
      #
      # WITHIN a shard the tests still run serially: the session rig is not
      # xdist-safe (see conftest.py — per-worker analytics spawns race SeaORM
      # migrations in the shared MariaDB, non-primary workers don't wait for
      # ClickHouse migrations, and the shared dbt target/ dir is deleted by
      # whichever worker finishes first). The expensive analytics+enrich
      # compile happens once, upstream, in the `build` job.
      #
      # meta/ (the rig's own framework smoke tests) is deliberately NOT run in
      # CI — it tests the harness, not the product; run it locally via
      # `./e2e.sh test meta/`.
      #
      # Each shard's session ALSO emits BOTH .artifacts/ files while analytics
      # is up:
      #   • metric_definitions.json  (lib/collect_metric_definitions.py)
      #   • observed_endpoints.json  (conftest.pytest_sessionfinish — httpx hook
      #     ledger)
      # but only the lane-relevant one is consumed downstream: this metrics
      # lane feeds metric-coverage-gate. metric_definitions.json is the FULL
      # builtin registry queried from MariaDB — independent of which tests the
      # shard ran, so every shard's copy is identical and the gate can use any
      # one of them.
      - name: E2E suite — metrics shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          # `rest` must exclude exactly the prefixes that have their own matrix
          # leg — keep this list in lockstep with `matrix.shard` above.
          case "$SHARD" in
            rest) filter=(grep -v -e '^metrics/ai_' -e '^metrics/collab_' -e '^metrics/tasks_') ;;
            *)    filter=(grep -e "^metrics/${SHARD}_") ;;
          esac
          nodes=()
          while IFS= read -r stem; do
            nodes+=("metrics/test_fixtures.py::test_metric_smoke[${stem}]")
          done < <(printf '%s\n' metrics/*.test.yaml | "${filter[@]}" | sort \
                     | xargs -n1 basename | sed 's/\.test\.yaml$//')
          # Fail loudly on an empty slice — pytest exits 4 on unknown node ids
          # but an empty arg list would silently run the FULL suite instead.
          [ "${#nodes[@]}" -gt 0 ] || { echo "::error::shard ${SHARD} selected no tests"; exit 1; }
          printf 'shard %s → %s tests\n' "$SHARD" "${#nodes[@]}"
          printf '  %s\n' "${nodes[@]}"
          ./e2e.sh test "${nodes[@]}" --tb=short -q

      # ─── Hand the collected catalog to the gate job ─────────────────────
      # Uploaded even if the suite failed (the collection script still runs), so the
      # gate reports alongside a red suite. `path` is workspace-relative (actions
      # ignore defaults.run.working-directory).
      - name: Upload coverage inputs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Per-shard name — matrix legs may not share one artifact. The gate
          # downloads the whole coverage-inputs-metrics-* family and merges
          # last-write-wins; safe because the only file it reads —
          # metric_definitions.json — is a full-registry snapshot, identical
          # in every shard. (observed_endpoints.json does differ per shard,
          # but nothing downstream consumes it in this lane.)
          name: coverage-inputs-metrics-${{ matrix.shard }}
          path: src/ingestion/tests/e2e/.artifacts/
          # Single-writer per-run artifact; lets "Re-run failed jobs" replace a
          # prior partial upload instead of erroring "artifact already exists".
          overwrite: true
          # `.artifacts/` is a dotdir; upload-artifact@v4 skips hidden paths by
          # default (include-hidden-files: false) — without this it uploads
          # nothing and the gate job fails with "artifact not found".
          include-hidden-files: true
          # The gate is useless without the catalog; fail loudly here rather than
          # as a confusing downstream "artifact not found".
          if-no-files-found: error
          retention-days: 7

      # ─── Diagnostics on failure ─────────────────────────────────────────
      - name: Dump compose logs on failure
        if: failure()
        run: |
          echo "::group::clickhouse logs"
          ./e2e.sh logs clickhouse || true
          echo "::endgroup::"
          echo "::group::mariadb logs"
          ./e2e.sh logs mariadb || true
          echo "::endgroup::"

      - name: Tear down
        if: always()
        run: ./e2e.sh down || true

  # ─── Gate jobs — pure-Python analysis of the collected artifacts ──────────
  # Each runs after its own lane's suite job (needs), downloads that lane's
  # artifact, and reads plain files. No Docker, no analytics boot.
  # `!cancelled()` so they still report when the suite itself failed (the
  # artifacts are usually present). The `needs.<lane>.result != 'skipped'`
  # clause guards the other case: a lane is SKIPPED (not failed) when `changes`
  # found nothing relevant or when the upstream `build` job fails, and in
  # neither case is there an artifact to download — without this clause the
  # gate would still run and fail noisily on a missing artifact instead of just
  # skipping cleanly alongside its lane.

  metric-coverage-gate:
    name: Metric coverage gate
    needs: e2e-metrics
    if: ${{ !cancelled() && needs.e2e-metrics.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Merge every shard's artifact into one directory. The gate's "asserted"
      # side is a STATIC scan of metrics/*.test.yaml from the checkout (see
      # lib/metric_coverage.py:coverage_from_tests) — sharding cannot
      # under-fill it — and its only runtime input, metric_definitions.json,
      # is identical in every shard, so the merge just needs at least one
      # shard to have uploaded.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-inputs-metrics-*
          merge-multiple: true
          path: coverage-inputs
      - name: Analyse metric coverage
        run: |
          pip install --quiet pyyaml
          python3 src/ingestion/tests/e2e/lib/metric_coverage.py \
            --universe-file coverage-inputs/metric_definitions.json | tee metric_coverage.md
          rc=${PIPESTATUS[0]}
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then cat metric_coverage.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ "$rc" -ne 0 ]; then echo "::error::metric coverage gate failed — builtin metric coverage is incomplete or stale. See the report."; fi
          exit "$rc"

  e2e-suite:
    name: Run E2E suite
    # The required check the `main` ruleset names — the name is branch-protection
    # config, so keep it even as `needs:` changes.
    #
    # It no longer folds in an endpoint-coverage gate: after the api/identity
    # retirement this workflow has none — those contracts and their gate live in
    # `e2e-stand.yml`, under its own umbrella ("Stand E2E").
    #
    # It DOES fold in the image-build gate: this required check also goes red
    # when this SHA's "Build & Push Container Images" run failed, so a PR with
    # a broken service image can't be merged even though that workflow's own
    # checks aren't in the ruleset.
    needs:
      - changes
      - build
      - e2e-metrics
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # 5 min sufficed for the needs-check alone; the image-build gate below may
    # poll a straggling build-images run for up to 10 more.
    timeout-minutes: 15
    steps:
      # A skipped lane now has two possible meanings, and they are opposites:
      # `changes` decided the diff cannot reach the data path (a pass), or the
      # upstream build went red and took the lane with it (a failure). So the
      # lane results are read one at a time through the environment rather than
      # collapsed with `contains(needs.*.result, 'skipped')` — that expression
      # cannot tell the two apart, and it would also fold in `changes`'s own
      # result now that it is a `needs` entry.
      - name: Require the build and the data-path lane to have succeeded
        env:
          CHANGES: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          BUILD: ${{ needs.build.result }}
          # Matrix aggregate: 'success' only when EVERY shard passed.
          METRICS: ${{ needs.e2e-metrics.result }}
        run: |
          set -euo pipefail
          echo "changes=$CHANGES relevant=$RELEVANT build=$BUILD metrics=$METRICS"

          # Fail closed. A `changes` job that did not succeed leaves `relevant`
          # empty, which would otherwise read as "irrelevant" and green a
          # required check that proved nothing.
          if [ "$CHANGES" != "success" ]; then
            echo "::error::the changes job did not succeed ($CHANGES) — relevance is unknown, so the data path is unproven."
            exit 1
          fi

          if [ "$RELEVANT" != "true" ]; then
            echo "nothing on the bronze → dbt → ClickHouse → analytics path changed — nothing to prove."
          else
            for lane in "build=$BUILD" "metrics=$METRICS"; do
              if [ "${lane#*=}" != "success" ]; then
                echo "::error::${lane%%=*} did not pass (${lane#*=}) — the E2E suite did not fully run for this change."
                exit 1
              fi
            done
            echo "E2E suite passed: build + the metrics lane succeeded."
          fi

      # Unconditional, including on a PR `changes` found irrelevant: this gate
      # guards the service images rather than the data path, and a PR touching
      # only src/frontend/ can still break a build this required check is the
      # sole ruleset-visible reporter for.
      #
      # build-images.yml is a separate workflow, so `needs:` can't reach it;
      # ask the API for this SHA's run instead. Absent (path-skipped, or a
      # merge_group SHA — that workflow has no merge_group trigger) passes;
      # anything but success fails. The image builds finish long before this
      # job starts, so the poll loop only covers stragglers.
      - name: Require image builds on this SHA to be green or absent
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          for attempt in $(seq 1 20); do
            run_json=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}&per_page=100" \
              --jq '[.workflow_runs[] | select(.name == "Build & Push Container Images")] | sort_by(.run_started_at) | last // empty')
            if [ -z "$run_json" ]; then
              echo "No image-build run for ${HEAD_SHA} — builds were path-skipped."
              exit 0
            fi
            conclusion=$(jq -r '.conclusion // ""' <<<"$run_json")
            run_url=$(jq -r '.html_url' <<<"$run_json")
            case "$conclusion" in
              success)
                echo "Image builds succeeded: ${run_url}"
                exit 0
                ;;
              "")
                echo "Image-build run still in progress (attempt ${attempt}/20); retrying in 30s…"
                sleep 30
                ;;
              *)
                echo "::error::Image builds concluded '${conclusion}' on this commit — see ${run_url}"
                exit 1
                ;;
            esac
          done
          echo "::error::Image-build run did not finish within the polling window."
          exit 1
