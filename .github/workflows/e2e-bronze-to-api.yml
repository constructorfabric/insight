name: E2E — Bronze to API

# End-to-end data-path tests: a spec seeds bronze, dbt builds staging, silver
# and gold on a ClickHouse the stand raised, identity mints the spec's people
# through the product, and the metric is read back over HTTP as a seeded
# persona. The assertions are pytest; the specs are tests/datapath/metrics.
#
# This is the DATA-PATH suite, and only that. The HTTP CONTRACT suites the `api`
# and `identity` lanes once ran retired: those contracts are asserted against a
# deployed stand in `e2e-stand.yml` (tests/stand), which crosses a real gateway
# with a real Keycloak session and can therefore prove the 401/403 behaviour an
# in-process rig structurally cannot. What is left here is what only a suite
# that seeds its own bronze can do — bronze → dbt → ClickHouse → analytics
# response for the metric specs, and identity's own data path (a connector's
# output reaching persons-seed, and an operator's correction surviving the seed
# run after it), both read back as real stand personas.
#
# Topology: a cheap `changes` job decides whether the diff can reach the data
# path at all and everything expensive hangs off it. The suite is a shard
# matrix, one leg per metric class plus one for identity: each leg raises a
# MINIMAL compose stand of its own (`dev-compose.sh test-stand minimal` —
# identity and the realm seeded, the warehouse empty), pulls the chart-pinned
# backend images or compiles the backend when the diff touched it, runs its
# directories of the suite host-side with uv, and the metric legs upload that
# session's `.artifacts/` for `metric-coverage-gate`, a pure-Python check over
# two JSON files: the builtin metric catalogue the run read from analytics, and
# the ledger of what it asserted.
#
# Code:  tests/datapath/ and tests/lib/insight_datapath/

on:
  # Merge-queue builds: the queue's gh-readonly-queue/* branches emit merge_group,
  # and the required "Run E2E suite" check must report there or every queued PR
  # times out and is evicted. On a pull request the same check name is emitted
  # by e2e-stand.yml as a deferral to the queue.
  merge_group:
  workflow_dispatch:

# A new push obsoletes any run still in flight for the same ref — cancel it so a
# rebase/force-push doesn't leave a slow suite burning minutes.
concurrency:
  group: e2e-bronze-to-api-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

permissions:
  contents: read
  # The coverage gate downloads the shards' artifacts from this run.
  actions: read

jobs:
  # `e2e-suite` is the reusable workflow's aggregate result. The caller emits
  # the stable "Run E2E suite" pull-request check; merge_group runs emit it
  # directly here.
  #
  # Skipping cascades by default `needs` semantics: `changes` says irrelevant →
  # `e2e-datapath` skips → `metric-coverage-gate` skips. The umbrella tells that
  # apart from a red shard by reading `changes`'s own output.

  # ─── changes ──────────────────────────────────────────────────────────────
  # What an `on: paths:` filter would have done, moved into a job so the
  # workflow ALWAYS runs and the umbrella below can always report.
  #
  # The list is deliberately over-inclusive: a false positive costs one
  # unnecessary suite run, while a false negative greens a required check over
  # untested data-path changes. It covers everything a stand raises or the
  # suite reads at run time:
  #
  #   src/ingestion/    dbt models, the migration and connectors-ddl scripts,
  #                     and every connector's enrich source
  #   src/backend/      analytics, identity-resolution, the gateway and the
  #                     authenticator — the stand runs them, and the analytics
  #                     HTTP response is the last hop every spec asserts on
  #   tests/datapath/   the specs and their modules
  #   tests/lib/        the suite's own machinery and the stand client it
  #                     authenticates through
  #   tests/pyproject.toml, tests/uv.lock   the suite's dependency set
  #   dev-compose.sh, docker-compose.yml, deploy/compose/   what raises a stand
  #
  # src/frontend/ and docs/ are absent on purpose: nothing here loads them.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The diff needs both endpoints; the default shallow fetch has
          # neither the base nor enough history to reach a merge base.
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # No base to diff against (a merge_group without one, or a manual
          # dispatch): assume relevant rather than skipping a required gate on
          # a guess.
          if [ -z "${BASE:-}" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "no base sha — running"
            exit 0
          fi
          # Diff from the MERGE BASE, not from the base branch's tip. A two-dot
          # `git diff BASE HEAD` reports every file that differs between the
          # two commits, which includes everything that landed on the base
          # branch since this branch forked — attributed to this PR. Any branch
          # not freshly rebased would then look like it touched the data path
          # and the gate would never skip anything.
          base_point="$(git merge-base "$BASE" "$HEAD" 2>/dev/null || true)"
          if [ -z "$base_point" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "no merge base between $BASE and $HEAD — running"
            exit 0
          fi
          changed="$(git diff --name-only "$base_point" "$HEAD")"
          echo "$changed" | sed 's/^/  /'
          if echo "$changed" | grep -qE '^(src/ingestion/|src/backend/|tests/datapath/|tests/lib/|tests/pyproject\.toml|tests/uv\.lock|dev-compose\.sh|docker-compose\.yml|deploy/compose/|\.github/workflows/e2e-bronze-to-api\.yml)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "nothing on the bronze → dbt → ClickHouse → analytics path changed"
          fi
          # A backend change means the pinned images no longer describe this
          # tree, so the stand compiles the backend instead of pulling it.
          if echo "$changed" | grep -qE '^src/backend/'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

  e2e-datapath:
    name: data path (shard ${{ matrix.shard }})
    needs: changes
    if: ${{ needs.changes.outputs.relevant == 'true' }}
    runs-on: ubuntu-latest
    # Compiling the backend from this tree is the slow path; pulling the
    # pinned images is not. Same split e2e-stand.yml makes.
    timeout-minutes: ${{ needs.changes.outputs.backend == 'true' && 75 || 45 }}
    permissions:
      contents: read
      packages: read
    strategy:
      # Every leg reports: a red shard must not cancel its siblings, or their
      # failures (and coverage ledgers) vanish with it.
      fail-fast: false
      matrix:
        # One leg per metric class directory under tests/datapath/metrics, and
        # one for tests/datapath/identity. The suite builds every non-gold
        # model once per session and clears the warehouse between specs, so a
        # leg is any set of specs; classes are the natural split because a
        # reader can find a shard by name.
        #
        # `rest` is every class directory not named here, computed at run
        # time from the tree, so a new class can never silently fall out of
        # CI. Rebalancing = naming a class here AND excluding it in the run
        # step's `rest` branch.
        shard: [ai, git, tasks, rest, identity]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          cache-suffix: datapath

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `minimal` seeds identity and the realm and leaves the warehouse empty:
      # the suite writes its own bronze and clears it between specs, and the
      # guard at its door refuses an instance whose seed shares those tables.
      - name: Bring a minimal stand up
        id: stand-up
        env:
          BUILD_BACKEND: ${{ needs.changes.outputs.backend }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$BUILD_BACKEND" = "true" ]; then flags+=(--build-backend); fi
          ./dev-compose.sh test-stand minimal "${flags[@]}"

      # A reused workspace could carry a previous run's ledger; the gate must
      # see only what this run asserted.
      - name: Reset coverage inputs
        run: rm -rf .artifacts

      # `test-stand test` picks the suite's own dependency group for a tree
      # under tests/datapath and aims it at the stand it just raised.
      - name: Data-path suite — shard
        id: suite
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          trees=()
          case "$SHARD" in
            rest)
              for dir in tests/datapath/metrics/*/; do
                name="$(basename "$dir")"
                case "$name" in ai|git|tasks|schemas|templates|__pycache__) continue ;; esac
                trees+=("--tree=${dir%/}")
              done
              trees+=(--tree=tests/datapath/meta)
              ;;
            identity) trees+=(--tree=tests/datapath/identity) ;;
            *) trees+=("--tree=tests/datapath/metrics/${SHARD}") ;;
          esac
          [ "${#trees[@]}" -gt 0 ] || { echo "::error::shard ${SHARD} selected no trees"; exit 1; }
          printf 'shard %s → %s\n' "$SHARD" "${trees[*]}"
          ./dev-compose.sh test-stand test "${trees[@]}" --tb=short -q

      # The shards' ledgers merge into one directory, which keeps one file per
      # name — so each carries its own or the gate sees a quarter of the coverage.
      - name: Name this shard's assertion ledger
        if: ${{ !cancelled() && matrix.shard != 'identity' }}
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          ledger=.artifacts/metric_assertions.json
          [ -f "$ledger" ] && mv "$ledger" ".artifacts/metric_assertions-${SHARD}.json"

      # Uploaded even when the suite failed, so the gate reports beside a red
      # run. metric_definitions.json is the full builtin catalogue, identical
      # in every shard; the ledgers are per shard and the gate unions them.
      - name: Upload coverage inputs
        if: ${{ !cancelled() && matrix.shard != 'identity' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-inputs-metrics-${{ matrix.shard }}
          path: .artifacts/
          overwrite: true
          # `.artifacts/` is a dotdir; without this the action uploads nothing
          # and the gate fails on a missing artifact.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          set -uo pipefail
          echo "::group::containers"
          docker ps -a || true
          echo "::endgroup::"
          for name in $(docker ps -a --filter "name=insight-" --format '{{.Names}}' || true); do
            echo "::group::${name}"
            docker logs --tail=200 "$name" 2>&1 || true
            echo "::endgroup::"
          done

      # always(), not failure(): a cancelled run must still tear its stack
      # down, and `down` passes --volumes so the next run starts from empty
      # databases rather than inheriting this one's rows.
      - name: Tear the stand down
        if: always()
        run: |
          [ -f .env.compose.test-stand ] || { echo "no stand env file — nothing to tear down"; exit 0; }
          ./dev-compose.sh test-stand down

  # ─── Gate job — pure-Python analysis of the collected artifacts ───────────
  # Runs after the shards (needs), downloads their artifacts, and reads plain
  # files. No Docker, no analytics boot. `!cancelled()` so it still reports when
  # the suite itself failed (the artifacts are usually present). The
  # `result != 'skipped'` clause guards the other case: the shards are SKIPPED
  # (not failed) when `changes` found nothing relevant, and then there is no
  # artifact to download — without this clause the gate would fail noisily on
  # a missing artifact instead of skipping cleanly alongside them.

  metric-coverage-gate:
    name: Metric coverage gate
    needs: e2e-datapath
    if: ${{ !cancelled() && needs.e2e-datapath.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Merge every shard's artifact into one directory. metric_definitions.json
      # is the full builtin registry and is identical in every shard, so any one
      # will do; the assertion ledgers are per-shard and the gate takes them all.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-inputs-metrics-*
          merge-multiple: true
          path: coverage-inputs
      - name: Analyse metric coverage
        run: |
          python3 tests/lib/insight_datapath/metric_coverage.py \
            --universe-file coverage-inputs/metric_definitions.json \
            --ledger coverage-inputs/metric_assertions-*.json | tee metric_coverage.md
          rc=${PIPESTATUS[0]}
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then cat metric_coverage.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ "$rc" -ne 0 ]; then echo "::error::metric coverage gate failed — builtin metric coverage is incomplete or stale. See the report."; fi
          exit "$rc"

  e2e-suite:
    name: Run E2E suite
    # The required check the `main` ruleset names — the name is branch-protection
    # config, so keep it even as `needs:` changes.
    #
    # It no longer folds in an endpoint-coverage gate: after the api/identity
    # retirement this workflow has none — those contracts and their gate live in
    # `e2e-stand.yml`, under its own umbrella ("Stand E2E").
    #
    needs:
      - changes
      - e2e-datapath
      - metric-coverage-gate
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A skipped shard has two possible meanings, and they are opposites:
      # `changes` decided the diff cannot reach the data path (a pass), or an
      # upstream job went red and took it along (a failure). So the results are
      # read one at a time through the environment rather than collapsed with
      # `contains(needs.*.result, 'skipped')` — that expression cannot tell the
      # two apart, and it would also fold in `changes`'s own result.
      - name: Require every data-path shard and the gate to have succeeded
        env:
          CHANGES: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          # Matrix aggregate: 'success' only when EVERY shard passed.
          SUITE: ${{ needs.e2e-datapath.result }}
          # A metric the catalogue serves and no spec asserts is a red check,
          # not a report: the gate is what makes a missing spec block.
          GATE: ${{ needs.metric-coverage-gate.result }}
        run: |
          set -euo pipefail
          echo "changes=$CHANGES relevant=$RELEVANT suite=$SUITE gate=$GATE"

          # Fail closed. A `changes` job that did not succeed leaves `relevant`
          # empty, which would otherwise read as "irrelevant" and green a
          # required check that proved nothing.
          if [ "$CHANGES" != "success" ]; then
            echo "::error::the changes job did not succeed ($CHANGES) — relevance is unknown, so the data path is unproven."
            exit 1
          fi

          if [ "$RELEVANT" != "true" ]; then
            echo "nothing on the bronze → dbt → ClickHouse → analytics path changed — nothing to prove."
          else
            for lane in "suite=$SUITE" "gate=$GATE"; do
              if [ "${lane#*=}" != "success" ]; then
                echo "::error::${lane%%=*} did not pass (${lane#*=}) — the E2E suite did not fully run for this change."
                exit 1
              fi
            done
            echo "E2E suite passed: every data-path shard and the metric coverage gate succeeded."
          fi
