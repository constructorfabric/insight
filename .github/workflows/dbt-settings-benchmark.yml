name: dbt settings benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/ci/dbt_benchmark/**
      - .github/workflows/dbt-settings-benchmark.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  experiments:
    runs-on: ${{ (vars.INSIGHT_FORCE_GITHUB_HOSTED == 'true' || github.event_name == 'pull_request') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","insight-vhc"]') }}
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.experiments.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: experiments
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/ci/dbt_benchmark -p 'test_*.py'
          echo "matrix=$(python3 scripts/ci/dbt_benchmark/experiments.py)" >> "$GITHUB_OUTPUT"
  compare:
    name: Compare ${{ matrix.experiment }} only
    needs: experiments
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.experiments.outputs.matrix) }}
    runs-on: ${{ (vars.INSIGHT_FORCE_GITHUB_HOSTED == 'true' || github.event_name == 'pull_request') && 'ubuntu-latest' || fromJSON('["self-hosted","persistent"]') }}
    timeout-minutes: 35
    env:
      CLICKHOUSE_URL: http://127.0.0.1:18127
      CLICKHOUSE_USER: benchmark
      CLICKHOUSE_PASSWORD: synthetic-benchmark
      CLICKHOUSE_CONTAINER: dbt-settings-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.experiment }}
      BENCHMARK_EXPERIMENT: ${{ matrix.experiment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Start a resource-bounded disposable ClickHouse
        run: |
          set -euo pipefail
          source src/ingestion/scripts/bootstrap-db/pins.env
          docker run -d --name "${CLICKHOUSE_CONTAINER}" --cpus 4 --memory 3g \
            -p 127.0.0.1:18127:8123 \
            -e CLICKHOUSE_USER -e CLICKHOUSE_PASSWORD \
            -e CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1 \
            -v "${GITHUB_WORKSPACE}/deploy/compose/clickhouse-memory.xml:/etc/clickhouse-server/config.d/memory.xml:ro" \
            "${CLICKHOUSE_SERVER_IMAGE}"
          for _ in $(seq 1 60); do
            if curl --fail --silent "${CLICKHOUSE_URL}/ping"; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Install the pinned dbt versions
        run: |
          set -euo pipefail
          source src/ingestion/scripts/bootstrap-db/pins.env
          venv="${RUNNER_TEMP}/dbt-settings-${BENCHMARK_EXPERIMENT}"
          echo "BENCHMARK_VENV=${venv}" >> "$GITHUB_ENV"
          python -m venv "${venv}"
          "${venv}/bin/pip" install "dbt-core==${DBT_CORE_VERSION}" "dbt-clickhouse==${DBT_CLICKHOUSE_VERSION}"
      - name: Compare baseline against one isolated change
        run: |
          set -euo pipefail
          mkdir -p benchmark-results
          docker inspect "${CLICKHOUSE_CONTAINER}" --format '{"cpu_nanocpus": {{.HostConfig.NanoCpus}}, "memory_bytes": {{.HostConfig.Memory}}}' > benchmark-results/resources.json
          "${BENCHMARK_VENV}/bin/python" scripts/ci/dbt_benchmark/run.py \
            --experiment "${BENCHMARK_EXPERIMENT}" --rows 1000000 --repeats 3 --output benchmark-results
      - name: Summary
        if: always()
        run: |
          if [ -f benchmark-results/summary.md ]; then
            cat benchmark-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: dbt-settings-${{ matrix.experiment }}
          path: benchmark-results/
          if-no-files-found: warn
      - name: Remove the disposable ClickHouse
        if: always()
        run: docker rm -fv "${CLICKHOUSE_CONTAINER}"

  summary:
    name: Isolated comparison summary
    needs: [experiments, compare]
    if: ${{ always() && !cancelled() && needs.experiments.result == 'success' }}
    runs-on: ${{ (vars.INSIGHT_FORCE_GITHUB_HOSTED == 'true' || github.event_name == 'pull_request') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","insight-vhc"]') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dbt-settings-*
          path: all-results
      - name: Validate isolation and compare all results
        run: python3 scripts/ci/dbt_benchmark/report.py --input-root all-results --output comparison-summary.md
      - name: Summary
        if: always()
        run: |
          if [ -f comparison-summary.md ]; then
            cat comparison-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: isolated-comparison-summary
          path: comparison-summary.md
          if-no-files-found: warn
