name: CI timings

on:
  workflow_run:
    workflows:
      - Lint and test
      - E2E bronze to API
      - E2E compose stand
      - Build & Push Container Images
      - Functional K3s Smoke
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Collect completed attempt timings
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/attempts/${RUN_ATTEMPT}/jobs?per_page=100" \
            --jq '.jobs[] | @json' > "${RUNNER_TEMP}/jobs.jsonl"
          python3 scripts/ci/timings.py \
            --event "${GITHUB_EVENT_PATH}" \
            --jobs "${RUNNER_TEMP}/jobs.jsonl" \
            --output "${RUNNER_TEMP}/timings.json" \
            --summary "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-timings-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/timings.json
          if-no-files-found: error
