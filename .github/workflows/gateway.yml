name: Gateway — routegen, config, e2e

# The gateway is generated, not hand-written (DD-GW-02): routes.yaml is the
# single source of truth (shipped as a ConfigMap / compose mount), and the
# container compiles it into nginx.conf at startup with routegen. This workflow
# is the guard: routegen's own tests, `nginx -t` on the real OpenResty image
# (via the container's own generate-and-validate path), and the full end-to-end
# suite (the five NGINX_BFF step-05 scenarios in run-e2e.sh). Runs only when the
# gateway or the generator changes.
on:
  workflow_call:
    inputs:
      gateway_changed:
        required: false
        type: boolean
        default: false
      authenticator_changed:
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "src/backend/tools/routegen/**"
      - "src/backend/services/gateway/**"
      - "src/backend/services/authenticator/**"
      - "src/backend/libs/authenticator-sdk/**"
      - "src/backend/Cargo.toml"
      - "src/backend/Cargo.lock"
      - "src/ingestion/tools/seed/insight_seed/**"
      - ".github/workflows/gateway.yml"
      - ".github/workflows/build-images.yml"
      - "scripts/ci/prebuilt_images.py"
      - "scripts/ci/test_prebuilt_images.py"
  workflow_dispatch:

concurrency:
  group: gateway-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  # routegen unit/golden tests + committed-config up-to-date assertion + nginx -t.
  config:
    name: routegen + nginx -t
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: src/backend -> target
          key: routegen
          save-if: ${{ github.event_name == 'push' }}

      - name: Test pre-built image selection
        run: PYTHONPATH=scripts/ci python3 -m unittest scripts/ci/test_prebuilt_images.py

      - name: routegen fmt + clippy + tests
        working-directory: src/backend
        run: |
          cargo fmt -p routegen -- --check
          cargo clippy -p routegen --all-targets -- -D warnings
          cargo test -p routegen

      - name: Build the OpenResty gateway image
        if: github.event_name != 'merge_group'
        working-directory: src/backend
        run: docker build -f services/gateway/Dockerfile -t insight-gateway:ci .

      - name: Load the merge-group gateway image
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REQUIRED: ${{ inputs.gateway_changed }}
        run: |
          policy=unchanged
          if [ "$REQUIRED" = "true" ]; then policy=required; fi
          python3 scripts/ci/prebuilt_images.py \
            --run-id "$RUN_ID" --registry ghcr.io/constructorfabric \
            --destination /tmp/e2e-prebuilt \
            --image "insight-gateway:${policy}"
          docker tag insight-gateway:e2e-prebuilt insight-gateway:ci

      - name: Generate + nginx -t via the container's own startup path
        run: |
          # Exercise the real entrypoint (routegen -> nginx -t) against the
          # compose route table. Upstream short-names are mapped to loopback so
          # nginx can resolve them at config-load time; GATEWAY_VALIDATE_ONLY
          # makes the container generate, validate, and exit without serving.
          docker run --rm \
            --add-host analytics:127.0.0.1 \
            --add-host identity-resolution:127.0.0.1 \
            --add-host authenticator:127.0.0.1 \
            --add-host insight-front:127.0.0.1 \
            -e GATEWAY_VALIDATE_ONLY=1 \
            -e GATEWAY_AUTHENTICATOR_URL=http://authenticator:8083 \
            -e GATEWAY_FRONT_URL=http://insight-front:8080 \
            -e GATEWAY_SET_REAL_IP_FROM=10.0.0.0/8 \
            -v "$PWD/deploy/compose/gateway/routes.yaml":/etc/gateway/routes.yaml:ro \
            insight-gateway:ci

      - name: helm lint + assert the chart's rendered routes.yaml compiles
        run: |
          helm lint src/backend/services/gateway/helm
          # Render the templated route table (helm template fails on a bad tpl)
          # and run it through routegen to catch a bad routes value before a pod.
          helm template insight src/backend/services/gateway/helm \
            --set image.repository=x --set image.tag=t --namespace insight \
            --show-only templates/configmap.yaml \
            | sed -n '/routes.yaml: |/,$p' | tail -n +2 | sed 's/^    //' > rendered-routes.yaml
          cat rendered-routes.yaml
          docker run --rm \
            --add-host insight-analytics:127.0.0.1 --add-host insight-identity-resolution:127.0.0.1 \
            --add-host insight-previews:127.0.0.1 \
            --add-host insight-authenticator:127.0.0.1 --add-host insight-frontend:127.0.0.1 \
            -e GATEWAY_VALIDATE_ONLY=1 \
            -e GATEWAY_AUTHENTICATOR_URL=http://insight-authenticator:8083 \
            -e GATEWAY_FRONT_URL=http://insight-frontend:80 \
            -v "$PWD/rendered-routes.yaml":/etc/gateway/routes.yaml:ro \
            insight-gateway:ci

  # Full edge e2e: real authenticator + a realm-importing Keycloak behind the
  # gateway (the five NGINX_BFF step-05 scenarios). No host Rust toolchain --
  # routegen and every service image are built inside Docker; the host only
  # needs python + pytest (+ uv for the realm generator).
  e2e:
    name: e2e (5 scenarios)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # conftest.py generates the Keycloak import realm through
      # `uv run --project`: the generator is a console script of the seed
      # package, and uv resolves and installs it on first use.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          save-cache: ${{ github.event_name == 'push' }}

      - name: Load merge-group service images
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          GATEWAY_REQUIRED: ${{ inputs.gateway_changed }}
          AUTHENTICATOR_REQUIRED: ${{ inputs.authenticator_changed }}
        run: |
          gateway_policy=unchanged
          authenticator_policy=unchanged
          if [ "$GATEWAY_REQUIRED" = "true" ]; then gateway_policy=required; fi
          if [ "$AUTHENTICATOR_REQUIRED" = "true" ]; then authenticator_policy=required; fi
          python3 scripts/ci/prebuilt_images.py \
            --run-id "$RUN_ID" --registry ghcr.io/constructorfabric \
            --destination /tmp/e2e-prebuilt \
            --image "insight-gateway:${gateway_policy}" \
            --image "insight-authenticator:${authenticator_policy}"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run the gateway e2e
        env:
          GATEWAY_E2E_PREBUILT: ${{ github.event_name == 'merge_group' && 'true' || 'false' }}
        run: src/backend/services/gateway/tests/run-e2e.sh
