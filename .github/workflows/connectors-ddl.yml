name: connectors-ddl

# Validates the two contracts no other lane can see, against a ClickHouse built
# from scratch by the real pipeline:
#
#   1. the committed connectors-ddl snapshot still matches what the current
#      connectors + dbt + migrations actually produce;
#   2. every staging contributor still lines up field-for-field with its silver
#      union target (check-field-parity.py).
#
# One empty ClickHouse, then straight into bootstrap-db.sh: real connector
# `discover`, the real destination-clickhouse connector, real dbt, real
# migrations. The committed snapshot is deliberately NOT applied first —
# create-bronze-placeholders.sh issues `CREATE ... IF NOT EXISTS`, so a relation
# the snapshot still carries but the current code no longer produces would
# survive into the fresh dump, hide its own deletion from the diff and break
# convergence. That is the same reason bootstrap-db.sh sets
# BOOTSTRAP_SKIP_SNAPSHOT=1 during generation.
#
# Runs on PRs against main and on every commit that lands on main. The push run
# is not redundant: a PR is validated against its own merge-base, so two PRs that
# are each green apart — one adding a gold table, one regenerating the snapshot —
# can still leave main drifted, and only a run on the merged tree sees that.
#
# Every connector's `discover` runs on fake config values, so the gate needs no
# secrets and fork PRs validate like any other. The trigger is `pull_request`,
# never `pull_request_target`.
#
# The gate job validates; it never commits. On PR drift the separate regen-pr
# job delivers the regenerated snapshot as a reviewable stacked PR against the
# PR's own branch — see its header for the trust boundary. Drift on a main push
# stays a red run: there is no PR branch to stack onto.

# TEMPORARILY DISABLED — manual dispatch only. Dependabot-triggered
# pull_request events receive Dependabot secrets instead of the repository
# secrets, so every dependabot PR fails the credentials preflight and the lane
# goes red across the board. Re-enable by restoring the pull_request + push
# triggers below, together with an actor guard on the gate job:
#   if: github.actor != 'dependabot[bot]' && (github.event_name == 'push' || ...)
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseding a PR push is free; superseding a main commit is not — that run is
  # the only signal that this particular merged tree converges.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  connectors-ddl:
    name: connectors-ddl snapshot + field parity
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      # Written by the drift step before its exit 1 — step outputs survive the
      # step's own failure, which is how regen-pr below learns it has work.
      drift: ${{ steps.drift.outputs.drift }}
    env:
      BOOTSTRAP_DIR: src/ingestion/scripts/bootstrap-db
      CLICKHOUSE_CONTAINER: connectors-ddl-clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_PROTOCOL: http
      CLICKHOUSE_USER: insight
      CLICKHOUSE_PASSWORD: insight
      CLICKHOUSE_DATABASE: insight
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false # don't leave the token in .git/config

      - uses: actions/setup-python@v6
        with:
          # run-dbt.sh builds its venv from python3.12/3.11 — same major as the
          # toolbox image.
          python-version: "3.12"

      - name: Load image pins + check tooling
        run: |
          set -euo pipefail
          # pins.env is plain KEY=VALUE, so it doubles as a $GITHUB_ENV fragment:
          # every image/version stays pinned in exactly one committed place.
          cat "${BOOTSTRAP_DIR}/pins.env" >> "$GITHUB_ENV"
          # seed-connectors.sh needs mikefarah yq v4 and jq; both ship in the
          # runner image. Fail here with a clear message rather than inside a
          # connector loop if that ever changes.
          yq --version
          jq --version

      - name: Start an empty ClickHouse
        run: |
          set -euo pipefail
          # The bridge gateway is the runner host as seen from inside a container:
          # the same address works for dbt (on the host) and for the connector
          # containers create-connector-tables.sh starts, which reach the
          # published port. `host.docker.internal` does not resolve on Linux.
          host="$(docker network inspect bridge -f '{{ (index .IPAM.Config 0).Gateway }}')"
          echo "CLICKHOUSE_HOST=${host}" >> "$GITHUB_ENV"
          echo "CLICKHOUSE_URL=http://${host}:8123" >> "$GITHUB_ENV"
          .github/workflows/scripts/start-clickhouse.sh "${CLICKHOUSE_CONTAINER}"

      - name: Bootstrap from connectors + dbt + migrations
        id: bootstrap
        run: |
          set -euo pipefail
          "${BOOTSTRAP_DIR}/bootstrap-db.sh" "${BOOTSTRAP_DIR}/connectors-config.yaml"

      - name: Re-dump the snapshot and fail on drift
        id: drift
        run: |
          set -euo pipefail
          "${BOOTSTRAP_DIR}/dump-ddl.sh"
          # --intent-to-add so a brand-new connector's .sql file (untracked, and
          # therefore invisible to a plain `git diff`) counts as drift too.
          git add --intent-to-add --all -- src/ingestion/scripts/connectors-ddl
          git diff -- src/ingestion/scripts/connectors-ddl > "$RUNNER_TEMP/connectors-ddl.diff"
          if [[ -s "$RUNNER_TEMP/connectors-ddl.diff" ]]; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
            echo "::error title=connectors-ddl snapshot is stale::The regen-pr job opens a pull request against this branch with the regenerated snapshot — review its DDL diff and merge it. Full diff also in the connectors-ddl-drift artifact."
            git diff --stat -- src/ingestion/scripts/connectors-ddl
            head -n 200 "$RUNNER_TEMP/connectors-ddl.diff"
            exit 1
          fi
          echo "snapshot converges: re-dump is byte-identical"

      - name: Upload the drift diff
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: connectors-ddl-drift
          path: ${{ runner.temp }}/connectors-ddl.diff
          if-no-files-found: ignore

      - name: Upload the regenerated snapshot
        # Input for the regen-pr job below: the freshly dumped *.sql files, not
        # the diff — the diff may not apply if the author pushes meanwhile.
        if: failure() && steps.drift.outputs.drift == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: connectors-ddl-regenerated
          path: src/ingestion/scripts/connectors-ddl/

      - name: Field parity
        # Runs even when the snapshot drifted: the two gates are independent, and a
        # PR that breaks both should learn both in one run instead of one per push.
        # A failed bootstrap is different — there is no warehouse to audit.
        if: steps.bootstrap.outcome == 'success'
        run: |
          set -euo pipefail
          # Every model in the manifest must have a relation (bootstrap-db just
          # built all of them, so a gap means something failed quietly), and any
          # column-set, order or type divergence fails the job. The one benign
          # shape — the target widened this contributor's T to Nullable(T) because
          # another branch is nullable — is printed as WARN and does not fail.
          # manifest.json comes from the dbt run inside bootstrap-db.
          if ! "${BOOTSTRAP_DIR}/check-field-parity.py" --no-env-file; then
            echo "::error title=Field parity::A staging contributor does not line up with its silver union target. ClickHouse unions branches BY POSITION and widens types silently, so this is a data-correctness gate, not style."
            exit 1
          fi

      - name: ClickHouse logs
        if: failure()
        run: docker logs --tail 200 "${CLICKHOUSE_CONTAINER}" 2>&1 || true

  # On snapshot drift in a PR, deliver the regenerated snapshot as a REVIEWABLE
  # stacked pull request against the PR's own branch, saving the author a local
  # bootstrap run. The author reviews the DDL diff and merges it; that merge is
  # a human push, so the required checks re-run normally (a bot push with
  # GITHUB_TOKEN would not trigger them).
  #
  # This job never executes code from the PR: it checks out the head branch only
  # as a git base and replaces the snapshot directory with the artifact the gate
  # job produced. That separation is why THIS job may hold write tokens while
  # the gate job runs PR code with contents: read.
  #
  # Convergence terminates: the re-dump on an unchanged tree is byte-identical,
  # so once the regen commit is merged the next run finds no drift.
  regen-pr:
    name: Open a regen PR on snapshot drift
    needs: connectors-ddl
    # Same-repo only: this job pushes a branch and opens a PR, neither of which
    # it can do against a fork's head. A fork PR still gets the gate result and
    # the regenerated snapshot as a downloadable artifact.
    if: >-
      always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.connectors-ddl.result == 'failure' && needs.connectors-ddl.outputs.drift == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      REGEN_BRANCH: regen-ddl/${{ github.event.pull_request.head.ref }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      DDL_DIR: src/ingestion/scripts/connectors-ddl
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          # This checkout keeps credentials on purpose: the push below uses them.

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: connectors-ddl-regenerated
          path: ${{ runner.temp }}/regenerated

      - name: Commit the snapshot and push the regen branch
        id: commit
        run: |
          set -euo pipefail
          # Full replace, not overlay: a relation the code no longer produces
          # must disappear from the snapshot, and cp alone cannot delete.
          rm -f "${DDL_DIR}"/*.sql
          cp "${RUNNER_TEMP}/regenerated"/*.sql "${DDL_DIR}/"
          git add --all -- "${DDL_DIR}"
          if git diff --cached --quiet; then
            # The author pushed a regeneration while the gate was running.
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --signoff -m "chore(connectors-ddl): regenerate the snapshot for ${HEAD_REF}" \
            -m "Produced by the connectors-ddl gate from a full bootstrap of this branch: real connector discover, destination-clickhouse, dbt, migrations, then dump-ddl.sh."
          # Force: this branch is bot-owned and rebuilt from scratch on every
          # drifting run, so its only history is the latest regeneration.
          git push --force origin "HEAD:refs/heads/${REGEN_BRANCH}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open or reuse the stacked PR + sticky comment
        if: steps.commit.outputs.changed == 'true'
        run: |
          set -euo pipefail
          url="$(gh pr list --head "${REGEN_BRANCH}" --base "${HEAD_REF}" --state open --json url -q '.[0].url // empty')"
          if [[ -z "${url}" ]]; then
            url="$(gh pr create --base "${HEAD_REF}" --head "${REGEN_BRANCH}" \
              --title "chore(connectors-ddl): regenerate the snapshot for ${HEAD_REF}" \
              --body "The connectors-ddl gate on #${PR_NUMBER} found the committed snapshot stale against what this branch's connectors + dbt + migrations actually produce. This PR carries the regenerated snapshot — review the DDL diff and merge it into \`${HEAD_REF}\`; the gate then re-runs and goes green. Closes automatically if #${PR_NUMBER} is merged without it (the base branch disappears).")"
          fi
          echo "regen PR: ${url}"

          marker='<!-- connectors-ddl-regen-pr -->'
          body="$(printf '%s\n### :robot: connectors-ddl snapshot drift\n\n%s\n\n%s' \
            "${marker}" \
            "The committed snapshot does not match what this branch actually produces. The regenerated snapshot is waiting in ${url} — review the DDL diff there and merge it into this branch; the gate re-runs on your merge." \
            "_Refreshed on every drifting gate run (the regen branch is force-pushed), so it reflects this branch as of the last completed run._")"
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            -q "[.[] | select(.body | startswith(\"${marker}\"))][0].id // empty")"
          if [[ -z "${existing}" ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="${body}" > /dev/null
          else
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -f body="${body}" > /dev/null
          fi
