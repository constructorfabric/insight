name: Warm upgrade

# Validates the one contract the fresh-install lanes cannot see: deploying
# this branch onto an installation that ALREADY holds data.
#
# On a fresh install every relation is created by the dbt run that first builds
# it, so a model gets whatever shape this branch's SELECT states. On a warm
# installation the relation already exists, and neither `CREATE TABLE IF NOT
# EXISTS` nor dbt's default `on_schema_change` widens it — so a gold model
# reading a newly added silver/staging column fails with UNKNOWN_IDENTIFIER
# unless the change ships a guarded heal: the "Warehouse contract changes"
# rule in AGENTS.md, enforced here instead of in the field.
# Since #3561 nothing builds gold at deploy time, so the failure lands on the
# first connector sync after the upgrade — later, and on the pipeline rather
# than on helm, which is why this lane matters more, not less.
#
# The simulation runs the base commit's own deploy first, lets its connectors
# create their bronze through destination-clickhouse and plays its last sync
# (the whole buildable dbt graph) — what an existing installation's last
# deploy and last sync left behind — adds the rows a connector would have
# synced into it, then runs this branch's apply-ch-migrations.sh end to end —
# exactly like the Helm clickhouse-migrate hook — and finally its own whole
# buildable graph, standing in for that first sync.
#
# Not a required check: on pull requests an `on: paths` filter scopes it to
# the warehouse path, so an unrelated change gets no run at all. This lane
# upgrades a single node; the same simulation on a two-replica warehouse is
# a required leg of cluster-mode.yml, run in the merge queue.
#
# The push run is not redundant: a PR is validated against its own base, so
# two PRs green apart can still leave main uncovered, and only a run on the
# merged tree — upgrading from the commit just before it — sees that.
#
# Needs no secrets; fork PRs validate like any other. The trigger is
# `pull_request`, never `pull_request_target`.

on:
  pull_request:
    branches: [main]
    paths:
      - "src/ingestion/gold/**"
      - "src/ingestion/silver/**"
      - "src/ingestion/connectors/**"
      - "src/ingestion/dbt/**"
      - "src/ingestion/scripts/**"
      - ".github/workflows/warm-upgrade.yml"
      - ".github/workflows/scripts/warm-upgrade-sim.sh"
      - ".github/workflows/scripts/start-clickhouse.sh"
  # Unfiltered on main: the paths filter sees at most 300 changed files, and
  # the merged tree is the one an installation upgrades to.
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # PRs supersede per ref — cancelling an outdated run is free. Every main
  # push gets its OWN group: a shared group would let a newer run replace an
  # older one, and the replaced A→B transition would never be validated — run
  # B→C installs B's own fresh warehouse as the base, so B's missing heal is
  # exactly what it cannot see.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Routing: .github/runners/README.md.
jobs:
  warm-upgrade:
    name: Deploy onto a warm installation
    runs-on: ${{ (vars.INSIGHT_FORCE_GITHUB_HOSTED == 'true' || github.repository != 'constructorfabric/insight' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-latest' || 'insight-large' }}
    timeout-minutes: 30
    env:
      CLICKHOUSE_CONTAINER: warm-upgrade-clickhouse
      CLICKHOUSE_USER: insight
      CLICKHOUSE_PASSWORD: insight
      CLICKHOUSE_DATABASE: insight
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # don't leave the token in .git/config
          # The sim replays the base commit's tree as the installed release,
          # so that commit's objects must be present.
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Same major as the toolbox image that runs the real deploy hook.
          # The sim builds one dbt venv per phase, pinned from that phase's
          # own pins.env.
          python-version: "3.12"

      - name: Start an empty ClickHouse
        run: |
          set -euo pipefail
          # seed-connectors.sh needs mikefarah yq v4 and jq; both ship in the
          # runner image.
          yq --version
          jq --version
          # pins.env is plain KEY=VALUE, so it doubles as a $GITHUB_ENV fragment.
          cat src/ingestion/scripts/bootstrap-db/pins.env >> "$GITHUB_ENV"
          source src/ingestion/scripts/bootstrap-db/pins.env
          # The bridge gateway is the runner host as seen from inside a
          # container: one address that works for dbt on the host and for the
          # destination-clickhouse container the sim starts, which reaches the
          # published port. `host.docker.internal` does not resolve on Linux.
          host="$(docker network inspect bridge -f '{{ (index .IPAM.Config 0).Gateway }}')"
          echo "CLICKHOUSE_URL=http://${host}:8123" >> "$GITHUB_ENV"
          CLICKHOUSE_SERVER_IMAGE="$CLICKHOUSE_SERVER_IMAGE" \
            .github/workflows/scripts/start-clickhouse.sh "${CLICKHOUSE_CONTAINER}"

      - name: Resolve the installed-release commit
        run: |
          set -euo pipefail
          # Pull request: the base the branch merges onto — the release a
          # warm installation would be on when this change deploys.
          # Push to main: the commit just before this one; after a force-push
          # or on ref creation `event.before` is unusable, so fall back to
          # the first parent of the pushed commit.
          if [ -n "${PR_BASE_SHA}" ]; then
            echo "BASE_SHA=${PR_BASE_SHA}" >> "$GITHUB_ENV"
          elif [ "${GITHUB_EVENT_NAME}" = "push" ] \
              && [ "${PUSH_BEFORE_SHA}" != "0000000000000000000000000000000000000000" ] \
              && git cat-file -e "${PUSH_BEFORE_SHA}^{commit}" 2>/dev/null; then
            echo "BASE_SHA=${PUSH_BEFORE_SHA}" >> "$GITHUB_ENV"
          elif [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            echo "BASE_SHA=$(git rev-parse HEAD^)" >> "$GITHUB_ENV"
          else
            echo "BASE_SHA=$(git rev-parse origin/main)" >> "$GITHUB_ENV"
          fi
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}

      - name: Install the base release, then deploy this tree onto it
        run: .github/workflows/scripts/warm-upgrade-sim.sh

      - name: ClickHouse logs on failure
        if: failure()
        run: docker logs --tail 200 "${CLICKHOUSE_CONTAINER}" || true
