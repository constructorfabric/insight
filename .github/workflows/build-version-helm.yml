name: Build version — Helm contract

# Each chart's build-version env and its `image:` line resolve the tag from the
# same expression and can be edited apart, which is why the render is asserted.

on:
  pull_request:
    branches: [main]
    paths:
      - "src/backend/services/analytics/helm/**"
      - "src/backend/services/authenticator/helm/**"
      - "src/backend/services/identity-resolution/helm/**"
      - "src/frontend/helm/**"
      - "charts/insight/tests/**"
      - ".github/workflows/build-version-helm.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  helm-contract:
    name: render contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full SHAs, not tags: mutable tags are repointable (as in semgrep.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install test deps
        run: pip install --quiet pytest pyyaml

      - name: Render-contract tests (build version across every stamped chart)
        run: python -m pytest charts/insight/tests/ -q
