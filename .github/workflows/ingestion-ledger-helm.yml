# Helm render-contract for the ingestion run-ledger writers.
#
# These templates record what an ingestion run did, and two of their properties
# are invisible in a diff. A DAG's phase comes from its targets, so a recorder
# that runs after the work it records can erase that work's failure — a failed
# sync reported a green run, and dbt rebuilt from stale bronze. And the inverse:
# a recorder that cannot run must not fail the run it only observes. Both
# properties follow from documented Argo semantics, and the assertions below
# are what hold the templates to them.
#
# Pure `helm template` + assertions — no cluster, no images.

name: ingestion ledger helm

on:
  pull_request:
    branches: [main]
    paths:
      - "charts/insight/templates/ingestion/**"
      - "charts/insight/tests/**"
      - ".github/workflows/ingestion-ledger-helm.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helm-contract:
    name: render contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          # This job never pushes; the default leaves the token in
          # .git/config where every later step can read it.
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: pip install pytest pyyaml
      # The umbrella's subcharts are `file://` refs that `helm template`
      # refuses to render until they are vendored into charts/insight/charts,
      # which is untracked. A developer machine usually has them from an
      # earlier build; a fresh checkout never does.
      - name: Vendor chart dependencies
        run: helm dependency build charts/insight
      - name: Render contract
        run: pytest charts/insight/tests/ -q
