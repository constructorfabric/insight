name: Git version probe

# Temporary: tests whether git 2.43 is what fails git-cli-proxy's promisor paths
# on the self-hosted pool. Delete once the answer lands in bootstrap.sh.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: git-cli-proxy under a newer git
    runs-on: [self-hosted, linux, x64, insight-vhc]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Runner and git before
        run: |
          set -euo pipefail
          echo "runner: ${RUNNER_NAME}"
          git --version

      - name: Install protoc + curl headers
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libcurl4-openssl-dev

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.95.0"

      - name: Upgrade git from the git-core PPA
        run: |
          set -euo pipefail
          sudo add-apt-repository -y ppa:git-core/ppa
          sudo apt-get update
          sudo apt-get install -y git

      - name: Runner and git after
        run: |
          set -euo pipefail
          echo "runner: ${RUNNER_NAME}"
          git --version

      # The same 244 tests the coverage lane runs, without the llvm-cov wrapper.
      - name: Test git-cli-proxy
        working-directory: src/backend
        run: cargo test --tests -p git-cli-proxy --all-features
