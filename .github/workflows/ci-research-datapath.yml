name: Data path CI research

on:
  pull_request:
    paths:
      - .github/workflows/ci-research-datapath.yml
      - scripts/ci/research_datapath/**
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: isolated-ci-research
  cancel-in-progress: false

jobs:
  compare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ vars.INSIGHT_FORCE_GITHUB_HOSTED == 'true' && 'ubuntu-latest' || fromJSON('["self-hosted","persistent"]') }}
    timeout-minutes: 80
    env:
      CLICKHOUSE_MEM_LIMIT: 3g
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b263c07d66d0e6cf5dccde175601cbdb602b84ac
          path: application
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          save-cache: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare the host and locked test environment
        run: |
          if ! command -v ip >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends iproute2
          fi
          uv sync --project application/tests --frozen --group datapath --no-group dev
      - name: Compare the full path with gold-seeded API assertions
        timeout-minutes: 65
        run: python3 scripts/ci/research_datapath/run.py --source application --output results
      - name: Clean up only this run's compose projects
        if: always()
        working-directory: application
        run: |
          for mode in baseline data api; do
            instance="ci-split-${GITHUB_RUN_ID}-${mode}"
            if [ -f ".env.compose.test-stand-${instance}" ]; then
              ./dev-compose.sh test-stand down "--instance=${instance}"
            fi
          done
      - name: Preserve measurements and synthetic gold fixture
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: datapath-ci-research
          path: |
            results/results.json
            results/baseline/*.json
            results/api/*.json
            results/gold-snapshot/
          if-no-files-found: error
