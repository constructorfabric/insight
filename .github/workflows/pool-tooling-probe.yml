name: Pool tooling probe

# Temporary: installs the two tools the lanes assume the image carries — helm and
# gh — on every runner in the pool, then reports what the image holds. Five legs
# that each hold a distinct runner so no machine serves two of them. Delete once
# the pool is level.

on:
  push:
    branches:
      - chore/self-hosted-runner-smoke-3515

permissions:
  contents: read

jobs:
  install:
    name: leg ${{ matrix.leg }}
    runs-on: [self-hosted, linux, x64, insight-vhc]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        leg: [1, 2, 3, 4, 5]
    steps:
      # First, so the five legs overlap and each lands on its own runner.
      - name: Hold the runner
        run: |
          echo "runner: ${RUNNER_NAME}"
          sleep 120

      - name: Install helm and gh
        run: |
          set -euo pipefail
          sudo install -m 0755 -d /etc/apt/keyrings

          curl -fsSL https://baltocdn.com/helm/signing.asc \
            | sudo gpg --dearmor --yes -o /etc/apt/keyrings/helm.gpg
          sudo chmod a+r /etc/apt/keyrings/helm.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/helm.gpg] https://baltocdn.com/helm/stable/debian/ all main" \
            | sudo tee /etc/apt/sources.list.d/helm.list >/dev/null

          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            | sudo tee /etc/apt/keyrings/githubcli.gpg >/dev/null
          sudo chmod a+r /etc/apt/keyrings/githubcli.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/githubcli.gpg] https://cli.github.com/packages stable main" \
            | sudo tee /etc/apt/sources.list.d/github-cli.list >/dev/null

          sudo apt-get update
          sudo apt-get install -y helm gh

      - name: Report
        run: |
          set -uo pipefail
          echo "runner: ${RUNNER_NAME}"
          helm version --short
          gh --version | head -1
