name: Pool hook verify

# Temporary, last pass: removes the probe the verification planted. Delete this
# file once it has run.

on:
  push:
    branches:
      - chore/self-hosted-runner-smoke-3515

permissions:
  contents: read

jobs:
  cleanup:
    name: leg ${{ matrix.leg }}
    runs-on: [self-hosted, linux, x64, insight-vhc]
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        leg: [1, 2, 3, 4, 5]
    steps:
      - name: Remove the probe
        run: |
          set -uo pipefail
          echo "runner: ${RUNNER_NAME}"
          sudo rm -rf /srv/gha/work/_hook_probe
          ls -la /srv/gha/work | grep -c _hook_probe || echo "probe gone"

      # Holds so the five legs overlap and each lands on its own runner.
      - name: Hold the runner
        run: sleep 120
