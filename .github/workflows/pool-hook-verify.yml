name: Pool hook verify

# Temporary: proves the job-started hook runs and repairs ownership. Run once to
# plant a root-owned probe, then re-run so the hook meets it. The probe sits
# beside the checkout tree, not inside it, so a failure cannot break checkout.

on:
  push:
    branches:
      - chore/self-hosted-runner-smoke-3515

permissions:
  contents: read

jobs:
  verify:
    name: leg ${{ matrix.leg }}
    runs-on: [self-hosted, linux, x64, insight-vhc]
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        leg: [1, 2, 3, 4, 5]
    steps:
      - name: Report the probe this runner carries
        run: |
          set -uo pipefail
          echo "runner: ${RUNNER_NAME}"
          probe=/srv/gha/work/_hook_probe/f
          if [ -e "$probe" ]; then
            echo "probe owner: $(stat -c '%U:%G' "$probe")"
          else
            echo "probe: none on this runner"
          fi

      - name: Plant a root-owned probe for the next run
        run: |
          set -euo pipefail
          sudo rm -rf /srv/gha/work/_hook_probe
          docker run --rm -v /srv/gha/work:/w alpine:3 \
            sh -c 'mkdir -p /w/_hook_probe && touch /w/_hook_probe/f'
          echo "planted as: $(stat -c '%U:%G' /srv/gha/work/_hook_probe/f)"

      # Holds so the five legs overlap and each lands on its own runner.
      - name: Hold the runner
        run: sleep 120
