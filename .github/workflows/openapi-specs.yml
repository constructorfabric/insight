name: OpenAPI specs

# Generated stand models drift gate — checks that the pydantic response models
# under tests/stand/api/schemas/ still correspond to the committed OpenAPI
# documents under docs/components/backend/<service>/openapi.json.
#
# The documents themselves are pinned to the services' code by a unit test in
# each service crate (`committed_openapi_document_is_current`, run by ci.yml),
# so this workflow needs no Rust: it reads the committed documents only.

on:
  # Not a required status check, so a `paths:` filter is safe: a PR outside it
  # gets no run and no pending check.
  pull_request:
    branches: [main]
    paths:
      - "docs/components/backend/*/openapi.json"
      - "tests/generate_schemas.py"
      - "tests/stand/api/schemas/**"
      - "tests/pyproject.toml"
      - "tests/uv.lock"
      - ".github/workflows/openapi-specs.yml"
  push:
    branches: [main]
    paths:
      - "docs/components/backend/*/openapi.json"
      - "tests/generate_schemas.py"
      - "tests/stand/api/schemas/**"
      - "tests/pyproject.toml"
      - "tests/uv.lock"
      - ".github/workflows/openapi-specs.yml"
  workflow_dispatch:

# Reads the checkout only — no write-back.
permissions:
  contents: read

# A new push obsoletes any run still in flight for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated-models:
    name: Generated schema models drift gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # don't leave the token in .git/config
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          cache-suffix: generated-models
          save-cache: ${{ github.event_name == 'push' }}
      - name: Regenerate the models and diff them against the committed copy
        run: |
          set +e
          # 2>&1: the per-target verdicts go to stdout, the findings to stderr —
          # the step summary wants both.
          uv run --project tests --frozen python tests/generate_schemas.py --check 2>&1 | tee generated_models.txt
          rc=${PIPESTATUS[0]}
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then { echo '```'; cat generated_models.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          if [ "$rc" -ne 0 ]; then echo "::error::Generated schema models are stale, or a service that was listed as publishing no bodies now does. Regenerate: uv run --project tests --frozen python tests/generate_schemas.py"; fi
          exit "$rc"
