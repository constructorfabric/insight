name: Release Helm

on:
  workflow_call:
    inputs:
      build_results:
        description: "Results and outputs of the caller's image-build dependencies."
        required: true
        type: string
      frontend_only:
        type: boolean
        default: false
    secrets:
      AUTOMATION_APP_PRIVATE_KEY:
        required: false
      TEST_STAND_KUBECONFIG:
        required: false
      TEST_STAND_PERSONA_PASSWORD:
        required: false

permissions:
  contents: read
  actions: read
  packages: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/constructorfabric

jobs:
  preflight:
    name: Verify source and successful main image builds
    runs-on: ${{ vars.INSIGHT_FORCE_GITHUB_HOSTED == 'true' && 'ubuntu-latest' || 'insight-small' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify the main image producer and source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image_source=bf4960f9e0f01c929b209d5e0101d4b5f14d48c2
          producer=40661825796
          git fetch --no-tags --depth=1 origin "$image_source"
          if ! git diff --quiet "$image_source" -- src charts; then
            echo '::error::Application/chart sources differ from the verified image producer.'
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$producer"             --jq '[.head_sha, .head_branch, .event]'             | jq -e --arg sha "$image_source" '. == [$sha, "main", "push"]' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$producer/attempts/1/jobs?per_page=100"             | jq -e '.total_count <= 100 and (.jobs | map(select(.name | test("^merge-(analytics|authenticator|gateway|identity-resolution|insight-v3-core|git-cli-proxy|previews|frontend)$"))) | length == 8 and all(.conclusion == "success"))' >/dev/null

  main-release-idle:
    name: Wait for the existing main release
    runs-on: ${{ vars.INSIGHT_FORCE_GITHUB_HOSTED == 'true' && 'ubuntu-latest' || 'insight-small' }}
    timeout-minutes: 125
    steps:
      - name: Wait before using the shared stand
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 7200 ))
          quiet=0
          while :; do
            active=0
            for workflow in build-images.yml deploy-test-stand-on-publish.yml deploy-test-stand.yml run-stand-suite.yml; do
              for status in in_progress queued waiting; do
                count="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=main&status=$status&per_page=100" --jq '.workflow_runs | length')"
                active=$(( active + count ))
              done
            done
            if [ "$active" -eq 0 ]; then
              quiet=$(( quiet + 1 ))
              [ "$quiet" -lt 2 ] || exit 0
            else
              quiet=0
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo '::error::Main release remained active; shared-stand verification did not start.'
              exit 1
            fi
            echo 'Waiting for the main release path to become idle before shared-stand validation.'
            sleep 30
          done

  prepare-candidate:
    needs: preflight
    runs-on: ${{ (vars.INSIGHT_FORCE_GITHUB_HOSTED == 'true' || (github.event_name == 'pull_request' && !(contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) || contains(fromJSON(vars.INSIGHT_ARC_PR_AUTHORS || '[]'), github.event.pull_request.user.login)))) && 'ubuntu-latest' || 'insight-small-vm' }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.candidate-version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: '3.14.0'

      # Per-service subchart appVersion bumps. Each is bumped INDEPENDENTLY,
      # only if the matching image was rebuilt this run. Services whose
      # source didn't change keep their previous appVersion → their image
      # tag in the published chart still resolves to an image that exists.
      # A manual full rebuild (workflow_dispatch) rebuilds every service image,
      # so it bumps every service — mirroring the build jobs' own
      # `workflow_dispatch` trigger. When
      # bump-descriptors runs (connectors changed / full rebuild) it does the
      # bump instead, in its re-triggering commit; this step is the canonical
      # path when no connector changed and bump-descriptors was skipped.
      - name: Bump per-service subchart appVersions
        env:
          BUILD_TAG: ${{ fromJSON(inputs.build_results).changes.outputs.build_tag }}
          FULL_REBUILD: ${{ github.event_name == 'workflow_dispatch' }}
          ANALYTICS: ${{ fromJSON(inputs.build_results).changes.outputs.analytics }}
          AUTHENTICATOR: ${{ fromJSON(inputs.build_results).changes.outputs.authenticator }}
          GATEWAY: ${{ fromJSON(inputs.build_results).changes.outputs.gateway }}
          IDENTITY_RESOLUTION: ${{ fromJSON(inputs.build_results).changes.outputs.identity_resolution }}
          INSIGHT_V3_CORE: ${{ fromJSON(inputs.build_results).changes.outputs.insight_v3_core }}
          GIT_CLI_PROXY: ${{ fromJSON(inputs.build_results).changes.outputs.git_cli_proxy }}
          PREVIEWS: ${{ fromJSON(inputs.build_results).changes.outputs.previews }}
          FRONTEND: ${{ fromJSON(inputs.build_results).changes.outputs.frontend }}
        run: .github/workflows/scripts/bump-service-appversions.sh

      - name: Bump ingestion image refs
        env:
          BUILD_TAG: ${{ fromJSON(inputs.build_results).changes.outputs.build_tag }}
          TOOLBOX: ${{ fromJSON(inputs.build_results).changes.outputs.toolbox }}
          SEED: ${{ fromJSON(inputs.build_results).changes.outputs.seed }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
        run: |
          set -euo pipefail
          # toolbox and seed are the only ingestion images pinned in
          # charts/insight/values.yaml — connector image refs travel inside
          # the toolbox image's baked descriptors (ADR-0016). Connector
          # descriptors are patched by `bump-descriptors` in a separate
          # commit (without [skip ci]) BEFORE this run.
          if [ "$TOOLBOX" = "true" ]; then
            REF="$IMAGE_PREFIX/insight-toolbox:$BUILD_TAG"
            echo "Setting ingestion.toolboxImage → $REF"
            yq -i ".ingestion.toolboxImage = \"$REF\"" charts/insight/values.yaml
          fi
          # seedImage is not deployed by the chart — nothing renders it into a
          # pod. It is published state: `seed-stand.sh` reads it back off an
          # installed release to learn which seeder image matches that stand.
          if [ "$SEED" = "true" ]; then
            REF="$IMAGE_PREFIX/insight-seed:$BUILD_TAG"
            echo "Setting ingestion.seedImage → $REF"
            yq -i ".ingestion.seedImage = \"$REF\"" charts/insight/values.yaml
          fi

      # Umbrella `version` always patch-bumps (semver, per-publish contract).
      # Umbrella `appVersion` is DISPLAY-ONLY in the deploy path — the actual
      # image.tag for each pod is resolved inside that pod's subchart from
      # the SUBCHART's appVersion. We set the umbrella appVersion to the MAX
      # of the four subchart appVersions so it summarises "the newest image
      # tag bundled in this chart artifact". `sort -V` handles the
      # YYYY.MM.DD.HH.MM-shortsha format correctly because the date prefix
      # is lexicographically sortable.
      - name: Bump umbrella version
        id: umbrella
        run: |
          set -euo pipefail
          CURRENT="$(yq '.version' charts/insight/Chart.yaml)"
          NEXT="$(echo "$CURRENT" | awk -F. '{ printf "%d.%d.%d", $1, $2, $3+1 }')"
          # yq v4 emits a `---` document separator between results when given
          # multiple files (behaviour appeared with a runner yq update,
          # 2026-06-08): without the filter below, `sort -V | tail -1` picks
          # the separator and `appVersion: "---"` ships in the published
          # chart — an invalid `app.kubernetes.io/version` label value that
          # breaks every install (charts 0.1.48–0.1.55 were affected).
          NEW_APP=$(yq -r '.appVersion' \
            src/backend/services/analytics/helm/Chart.yaml \
            src/backend/services/authenticator/helm/Chart.yaml \
            src/backend/services/gateway/helm/Chart.yaml \
            src/backend/services/identity-resolution/helm/Chart.yaml \
            src/backend/services/insight-v3-core/helm/Chart.yaml \
            src/backend/services/git-cli-proxy/helm/Chart.yaml \
            src/backend/services/previews/helm/Chart.yaml \
            src/frontend/helm/Chart.yaml \
            | grep -Ev '^(---|null)$' \
            | sort -V | tail -1)
          # Fail loud unless the result is a build tag (YYYY.MM.DD.HH.MM-sha):
          # a malformed appVersion must never reach a published chart again.
          # On main the regex stays strict — a branch-suffixed tag leaking
          # into a main-published chart must abort. On release-** the
          # suffixed form (…-sha7.<sanitized-branch>) is the canonical tag
          # shape for images built from the branch, so accept it there.
          TAG_RE='^[0-9]{4}(\.[0-9]{2}){4}-[0-9a-f]{7}$'
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            TAG_RE='^[0-9]{4}(\.[0-9]{2}){4}-[0-9a-f]{7}(\.[A-Za-z0-9._-]+)?$'
          fi
          if ! echo "$NEW_APP" | grep -Eq "$TAG_RE"; then
            echo "ERROR: computed umbrella appVersion '$NEW_APP' is not a valid build tag for ref '${GITHUB_REF_NAME}'" >&2
            exit 1
          fi
          echo "Umbrella version $CURRENT → $NEXT (appVersion → $NEW_APP)"
          yq -i ".version = \"$NEXT\""        charts/insight/Chart.yaml
          yq -i ".appVersion = \"$NEW_APP\""  charts/insight/Chart.yaml
          # Pin new version in docs and sample gitops
          if [ -f docs/deploy/.insight-version ]; then
            echo "$NEXT" > docs/deploy/.insight-version
          fi
          if [ -f deploy/gitops/.insight-version ]; then
            echo "$NEXT" > deploy/gitops/.insight-version
          fi
          echo "version=${NEXT}" >> "$GITHUB_OUTPUT"
      - name: Read the candidate version
        id: candidate-version
        run: |
          set -euo pipefail
          version="$(yq -er '.version' charts/insight/Chart.yaml)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Save candidate source and release metadata
        env:
          VERSION: ${{ steps.candidate-version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          git rev-parse HEAD > dist/source-sha
          printf '%s\n' "$VERSION" > dist/version
          git diff --binary > dist/release.patch

      - name: Pin candidate images
        run: .github/workflows/scripts/pin-chart-images.sh

      - name: Save immutable candidate inputs
        run: |
          set -euo pipefail
          yq -o=json charts/insight/values.yaml > dist/values.json
          cd dist
          sha256sum release.patch source-sha version values.json > SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: candidate-inputs
          path: dist/
          if-no-files-found: error
          retention-days: 7

  package-chart:
    needs: prepare-candidate
    if: ${{ !cancelled() && needs.prepare-candidate.result == 'success' }}
    runs-on: ${{ vars.INSIGHT_FORCE_GITHUB_HOSTED == 'true' && 'ubuntu-latest' || 'insight-small-vm' }}
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ needs.prepare-candidate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: candidate-inputs
          path: inputs
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: '3.14.0'
      - name: Restore verified candidate inputs
        run: |
          set -euo pipefail
          python3 scripts/ci/candidate_inputs.py inputs "$GITHUB_SHA"
          git apply --allow-empty inputs/release.patch
          cp inputs/values.json charts/insight/values.yaml
          mkdir -p dist
          cp inputs/release.patch inputs/source-sha inputs/version dist/
      - name: Bundle pinned dependencies
        run: helm dependency update charts/insight
      - name: Package the immutable candidate
        env:
          VERSION: ${{ needs.prepare-candidate.outputs.version }}
        run: |
          set -euo pipefail
          helm package charts/insight -d dist/
          cd dist
          sha256sum "insight-$VERSION.tgz" release.patch source-sha version > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: helm-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 7

  validate-data:
    needs: prepare-candidate
    permissions:
      contents: read
      actions: read
      packages: read
    uses: ./.github/workflows/e2e-bronze-to-api.yml
    with:
      candidate_artifact: candidate-inputs

  validate-chart:
    needs: [package-chart, main-release-idle]
    if: |
      !cancelled()
      && needs.package-chart.result == 'success'
    permissions:
      contents: read
      actions: read
      packages: read
    uses: ./.github/workflows/deploy-test-stand.yml
    with:
      candidate_artifact: helm-candidate
      chart_version: ${{ needs.package-chart.outputs.version }}
    secrets:
      TEST_STAND_KUBECONFIG: ${{ secrets.TEST_STAND_KUBECONFIG }}
      TEST_STAND_PERSONA_PASSWORD: ${{ secrets.TEST_STAND_PERSONA_PASSWORD }}
