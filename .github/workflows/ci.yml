name: Lint, Test & Coverage Gate

on:
  # PR-only gate (+ manual dispatch). Coverage is reported self-contained via the
  # GitHub Actions job summary — no external service, and no PR comment (fork PRs
  # only get a read-only token, so a comment post 403s). Works on any plan.
  #
  # Topology: per-language producer jobs build + test under coverage and upload a
  # Cobertura artifact each; the `coverage-gate` job downloads them all and runs
  # the single language-agnostic checker (scripts/ci/coverage.py gate). coverage.py
  # runs no tests — it only checks reports. Make `coverage-gate` the required
  # status check in branch protection.
  pull_request:
    branches: [main]
    paths:
      - "src/backend/**"
      - "src/ingestion/connectors/**"
      - "scripts/ci/**"
      - ".github/workflows/ci.yml"
      # Inputs to connector-wiring-guard beyond the connector tree itself: the
      # bootstrap connector registry and the shared class_people union.
      - "src/ingestion/scripts/bootstrap-db/connectors-config.yaml"
      - "src/ingestion/silver/_shared/**"
  # Merge-queue builds. paths filters don't apply to merge_group, so every queue
  # entry runs this workflow — the `changes` job still scopes the heavy jobs to
  # the batch's actual diff (changed.py diffs origin/main...HEAD, and on a queue
  # branch that is exactly the batched PRs' combined change set).
  merge_group:
  workflow_dispatch:
    inputs:
      full:
        description: "Run ALL components (ignore the diff) — full coverage baseline"
        type: boolean
        default: false

# A new push obsoletes any run still in flight for the same ref — cancel it so a
# rebase/force-push doesn't leave a slow instrumented build burning minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # NB: `-D warnings` is intentionally NOT set globally. It belongs on the clippy
  # lint step only — applying it to the instrumented coverage build turns benign
  # warnings (e.g. feature-gated dead code in jira-enrich's default build) into
  # hard errors. Warnings are gated by clippy; coverage just measures coverage.

# Producers only read + upload artifacts; the gate only reads. No write scopes.
permissions:
  contents: read

jobs:
  # Detect which components a PR touches — via scripts/ci/coverage.py, the single
  # component↔path map — and emit a per-language matrix of rich entries (each
  # carries the fields its producer job needs to collect coverage). Downstream
  # jobs run ONLY for changed components, so unchanged ones don't burn CI.
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.detect.outputs.rust }}
      python: ${{ steps.detect.outputs.python }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fetch base branch
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - id: detect
        env:
          FULL: ${{ github.event.inputs.full }}
        run: |
          if [ "$FULL" = "true" ]; then
            changed=$(python3 scripts/ci/changed.py --all)
          else
            changed=$(python3 scripts/ci/changed.py)
          fi
          echo "changed: $changed"
          echo "rust=$(echo "$changed" | jq -c .rust)" >> "$GITHUB_OUTPUT"
          echo "python=$(echo "$changed" | jq -c .python)" >> "$GITHUB_OUTPUT"

  # Guard the jsonwebtoken crypto-provider invariant: >1 backend active makes
  # verify() panic on every call (#1725, #1727). cargo tree only reads the
  # resolved graph — no compile.
  jwt-provider-guard:
    name: JWT crypto-provider invariant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.95.0"
      - name: Exactly one jsonwebtoken crypto provider
        run: |
          # Providers = jsonwebtoken's enabled features minus the known
          # non-crypto ones, so an unknown future backend still counts (fail-safe).
          providers=$(cargo tree --manifest-path src/backend/Cargo.toml --edges features --invert jsonwebtoken \
            | grep -oE 'jsonwebtoken feature "[^"]+"' | sed -E 's/.*"([^"]+)".*/\1/' \
            | tr '-' '_' | sort -u | grep -vxE 'default|use_pem|pem|simple_asn1')
          n=$(printf '%s' "$providers" | grep -c .)
          if [ "$n" -ne 1 ]; then
            echo "Expected exactly one jsonwebtoken crypto provider, found $n: $(echo $providers)"
            exit 1
          fi

  # Catches half-landed connectors on the PR instead of after the merge.
  # bump-descriptors runs only on the push to main, so a non-semver
  # descriptor.version passes the PR and then aborts that job post-merge,
  # leaving images.<key>.image unpatched — which is how #2048 also took
  # silver.class_people out of every bootstrap-db run. Cheap and dependency-
  # light: pure file inspection, no ClickHouse and no dbt.
  connector-wiring-guard:
    name: Connector wiring invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml
      - name: Connector wiring invariants
        run: python3 scripts/ci/connector_wiring.py

  # One unified job per Rust crate: fmt + clippy (when entry.lint) and coverage
  # (when entry.cover). Replaces the old standalone workspace rust-lint — fmt and
  # clippy now run per crate, gated by the lint flag from changed.py (a shared
  # backend change fans lint out to every crate; coverage stays per-changed-crate).
  rust:
    name: Rust — ${{ matrix.entry.name }}
    needs: changes
    if: ${{ needs.changes.outputs.rust != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJson(needs.changes.outputs.rust) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false # don't leave the token in .git/config

      - name: Install protoc + librdkafka build deps
        # protobuf-compiler: grpc-hub -> prost-build. cmake + libcurl headers:
        # the authenticator vendors librdkafka (audit events, step 10.8) via
        # rdkafka's cmake-build; librdkafka's OAUTHBEARER path needs curl/curl.h
        # even with WITH_CURL=0.
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler cmake libcurl4-openssl-dev

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.95.0"
          # rustfmt + clippy for the lint steps; llvm-tools-preview for cargo-llvm-cov.
          components: rustfmt, clippy, llvm-tools-preview

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # Both possible workspaces declared; only the relevant one is used per
          # crate. Per-component cache key so jobs don't thrash a shared target.
          workspaces: |
            src/backend -> target
            src/ingestion/connectors/task-tracking/jira/enrich -> target
          key: ${{ matrix.entry.name }}

      - name: Format check (${{ matrix.entry.name }})
        if: ${{ matrix.entry.lint }}
        working-directory: ${{ matrix.entry.root }}
        run: cargo fmt -p ${{ matrix.entry.package }} -- --check

      - name: Clippy (${{ matrix.entry.name }})
        if: ${{ matrix.entry.lint && matrix.entry.clippy }}
        working-directory: ${{ matrix.entry.root }}
        # -D warnings stays on clippy only — never the coverage build (it would
        # turn jira-enrich's feature-gated dead code into a hard error).
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          feats=""
          if [ "${{ matrix.entry.all_features }}" = "true" ]; then feats="--all-features"; fi
          cargo clippy -p ${{ matrix.entry.package }} --all-targets $feats

      - uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2
        if: ${{ matrix.entry.cover }}
        with:
          tool: cargo-llvm-cov

      # DB-backed components (analytics) run their #[ignore]d live_tests
      # against a real MariaDB. Gated on live_db so only those entries pay the
      # ~15s startup. ClickHouse is intentionally not provisioned — CH-gated
      # tests skip themselves (see cf/insight#1564).
      - name: Start MariaDB (${{ matrix.entry.name }})
        # live_db is a static per-component flag — only pay the container
        # startup when this run actually executes tests (with or without
        # coverage), not on a lint-only fanout entry.
        if: ${{ matrix.entry.live_db && (matrix.entry.cover || matrix.entry.test) }}
        run: |
          set -euo pipefail
          docker run -d --name insight-maria \
            -e MARIADB_DATABASE=${{ matrix.entry.live_db_name }} \
            -e MARIADB_USER=insight -e MARIADB_PASSWORD=insight \
            -e MARIADB_ROOT_PASSWORD=root \
            -p 3306:3306 mariadb:11.4
          for i in $(seq 1 60); do
            if docker exec insight-maria healthcheck.sh --connect --innodb_initialized 2>/dev/null; then
              echo "MariaDB ready"; break
            fi
            if [ "$i" = "60" ]; then echo "MariaDB never became healthy"; docker logs insight-maria; exit 1; fi
            sleep 2
          done

      - name: Coverage (${{ matrix.entry.name }} -> Cobertura)
        if: ${{ matrix.entry.cover }}
        working-directory: ${{ matrix.entry.root }}
        # For live_db components: apply migrations once up front against the
        # MariaDB service (a failed migration fails the job), then run the
        # #[ignore]d live_tests in parallel — they are tenant/metric-key
        # isolated and never reset the DB, so parallel runs don't collide.
        env:
          INTEGRATION_TESTS_MARIADB_URL: ${{ matrix.entry.live_db && format('mysql://insight:insight@127.0.0.1:3306/{0}', matrix.entry.live_db_name) || '' }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/coverage"
          feats=""
          if [ "${{ matrix.entry.all_features }}" = "true" ]; then feats="--all-features"; fi
          if [ "${{ matrix.entry.live_db }}" = "true" ]; then
            # The gear reads its DB URL from APP__gears__analytics__config__database_url
            # (the gear config key is "analytics" — dash-free, so the env var
            # survives sh/dash entrypoints and k8s envFrom).
            APP__gears__analytics__config__database_url="$INTEGRATION_TESTS_MARIADB_URL" \
              cargo llvm-cov run --no-report --package "${{ matrix.entry.package }}" $feats -- \
                -c "services/${{ matrix.entry.name }}/config/insight.yaml" migrate
            cargo llvm-cov --no-report --package "${{ matrix.entry.package }}" $feats -- --include-ignored
          else
            cargo llvm-cov --no-report --package "${{ matrix.entry.package }}" $feats
          fi
          # Scope the report to this component's own code — drop any linked
          # dependency-crate files so they don't pollute another component's
          # coverage number (each crate self-reports in its own job).
          ignore=""
          if [ -n "${{ matrix.entry.cover_ignore_regex }}" ]; then
            ignore="--ignore-filename-regex ${{ matrix.entry.cover_ignore_regex }}"
          fi
          cargo llvm-cov report --cobertura $ignore \
            --output-path "$GITHUB_WORKSPACE/coverage/rust-${{ matrix.entry.name }}.cobertura.xml"

      # Changed crates with cover=false (authenticator — no in-process tests yet) still
      # run plain `cargo test`: a failure fails this job; only the Cobertura
      # collection and the coverage gates are skipped. Lint-only fanout entries
      # (test=false) skip this too — coverage/tests stay per-changed-crate.
      - name: Test (${{ matrix.entry.name }}, no coverage)
        if: ${{ matrix.entry.test && !matrix.entry.cover }}
        working-directory: ${{ matrix.entry.root }}
        env:
          INTEGRATION_TESTS_MARIADB_URL: ${{ matrix.entry.live_db && format('mysql://insight:insight@127.0.0.1:3306/{0}', matrix.entry.live_db_name) || '' }}
        run: |
          set -euo pipefail
          feats=""
          if [ "${{ matrix.entry.all_features }}" = "true" ]; then feats="--all-features"; fi
          if [ "${{ matrix.entry.live_db }}" = "true" ]; then
            # Apply migrations once up front (a failed migration fails the
            # job); the live tests then re-run the migrator to prove
            # idempotency. The gear name may contain a dash
            # (identity-resolution), so the env override is passed via
            # `env` — a plain NAME=VALUE prefix is not a valid sh assignment.
            env "APP__gears__${{ matrix.entry.name }}__config__database_url=$INTEGRATION_TESTS_MARIADB_URL" \
              cargo run -p ${{ matrix.entry.package }} $feats -- \
                -c "services/${{ matrix.entry.name }}/config/insight.yaml" migrate
          fi
          cargo test -p ${{ matrix.entry.package }} $feats

      - name: Upload Cobertura
        if: ${{ matrix.entry.cover }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cobertura-rust-${{ matrix.entry.name }}
          path: coverage/*.xml
          # cargo-llvm-cov always emits a report when the build succeeds, so a
          # missing file means something went wrong — fail rather than ignore.
          if-no-files-found: error

  # One producer job per changed Python connector. Collects inline with
  # pytest-cov in an isolated uv venv; exit-5 (no tests collected) is tolerated.
  python:
    name: Python coverage — ${{ matrix.entry.name }}
    needs: changes
    if: ${{ needs.changes.outputs.python != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJson(needs.changes.outputs.python) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false # don't leave the token in .git/config

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          # Per-connector cache key so parallel setup-uv jobs don't race to
          # reserve one shared key ("Unable to reserve cache …").
          cache-suffix: ${{ matrix.entry.name }}

      - name: Coverage (${{ matrix.entry.name }} -> Cobertura)
        working-directory: ${{ matrix.entry.root }}
        run: |
          set -uo pipefail
          mkdir -p "$GITHUB_WORKSPACE/coverage"
          uv venv --allow-existing .venv-cov
          PY=".venv-cov/bin/python"
          export VIRTUAL_ENV="$PWD/.venv-cov"
          if ! uv pip install --python "$PY" -e ".[dev]" pytest-cov; then
            echo "::notice::[dev] extra unavailable — installing base deps + pytest"
            uv pip install --python "$PY" -e . pytest pytest-cov
          fi
          # pytest exit 5 = "no tests collected" — legitimate for a connector
          # without tests; treat as success. Capture rc via `|| rc=$?` so the
          # runner's default `set -e` shell can't abort before we inspect it.
          rc=0
          "$PY" -m pytest ${{ matrix.entry.pytest_args }} \
            --cov="${{ matrix.entry.cov_package }}" \
            --cov-report "xml:$GITHUB_WORKSPACE/coverage/python-${{ matrix.entry.name }}.cobertura.xml" || rc=$?
          if [ "$rc" -eq 5 ]; then
            echo "::notice::no tests collected for ${{ matrix.entry.name }} — component stays at 0"
            exit 0
          fi
          exit "$rc"

      - name: Upload Cobertura
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cobertura-python-${{ matrix.entry.name }}
          path: coverage/*.xml
          # A connector with no tests legitimately produces no report (exit 5).
          if-no-files-found: ignore

  # Single authority: per-component overall + the global new-code gate. Runs even
  # when some producers were skipped (unchanged languages) via `!cancelled()`,
  # and judges only the components that actually produced a report.
  coverage-gate:
    name: Coverage gate
    needs: [changes, rust, python]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # If detection failed, or any CHANGED component's producer job failed
      # (compile error, test failure, crash), the report set is incomplete — fail
      # rather than silently passing on a partial set. Skipped producers (an
      # unchanged language) report 'skipped', not 'failure', so they're fine.
      - name: Guard against incomplete reports
        if: >-
          needs.changes.result != 'success' || needs.rust.result == 'failure' || needs.python.result == 'failure'
        run: |
          echo "changes=${{ needs.changes.result }} rust=${{ needs.rust.result }} python=${{ needs.python.result }}"
          echo "::error::Change detection or a producer job failed — refusing to gate on an incomplete report set."
          exit 1

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0 # diff-cover needs history + source present for path resolution

      - name: Fetch base branch (for the new-code gate)
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install diff-cover
        # Pinned: the gate parses diff-cover's --json-report `src_stats` schema,
        # which is internal API. (TODO: --json-report is deprecated in diff-cover
        # >= 10 in favor of `--format json:<path>`; migrate before unpinning.)
        run: pip install "diff-cover==10.3.0" "defusedxml==0.7.1"

      - name: Download all Cobertura reports
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: cobertura-*
          merge-multiple: true
          path: coverage

      # Writes a markdown report to the job summary and exits non-zero if either
      # gate fails (so this is the required check). --require makes a *changed*
      # component that produced no report a failure (not a silent skip); the
      # names come from the `changes` matrices, passed via env to avoid script
      # injection from interpolating untrusted-ish JSON into the shell.
      - name: Run coverage gate
        env:
          RUST_CHANGED: ${{ needs.changes.outputs.rust }}
          PYTHON_CHANGED: ${{ needs.changes.outputs.python }}
          FULL: ${{ github.event.inputs.full }}
        run: |
          # Only components that actually produce coverage are "required" —
          # rust entries may be lint-only, and python entries may measure
          # lines that bucket to another component (connector-mock-tests);
          # cover=false filters all of these.
          required=$(jq -rn \
            --argjson r "$RUST_CHANGED" --argjson p "$PYTHON_CHANGED" \
            '[($r[] | select(.cover)), ($p[] | select(.cover))] | map(.name) | join(",")')
          echo "required components: ${required:-<none>}"
          # A full/baseline run measures overall coverage; skip the new-code gate
          # (there is no meaningful "patch" for a manual all-components run).
          extra=""; [ "$FULL" = "true" ] && extra="--no-patch"
          python3 scripts/ci/coverage.py gate $extra --require "$required" --summary "$GITHUB_STEP_SUMMARY"
