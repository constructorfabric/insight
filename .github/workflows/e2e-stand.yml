name: E2E — Compose stand

# The deployed-stand suite (tests/stand) run against a real compose stack: ghcr
# images pinned to each component's chart appVersion, a real Keycloak login, and
# gold data dbt actually built. Distinct from e2e-bronze-to-api.yml, which
# exercises the in-process ingestion rig and now carries one blocking gate
# (metric coverage) — that workflow is untouched by this one.
#
# By default nothing here compiles the backend. `test-stand up` pulls
# analytics, authenticator, identity-resolution and gateway at their charts'
# appVersions; building them cost ~26 min per job. `up` refuses a tree that
# changes src/backend/ rather than silently testing it against main's images,
# so when the diff touches the backend the `changes` job flags it and the
# lanes pass --build-backend (and take the longer timeout) instead.
#
# Two independently-reporting checks, split by what they need rather than by
# what they cover:
#
#   api-smoke    tests/stand/api — 267 HTTP contract tests, plus the harness's
#                own 17 (tests/stand/meta) and the coverage gate. No browser.
#   ui-journeys  tests/stand/ui  — the browser journeys, run host-side from
#                the checkout on every event, so the ref's own test code is
#                what executes.
#
# Neither is required on its own; `Stand E2E` below is the one stable context
# for branch protection. The stand goes with any change it covers: the lanes
# run on every pull_request whose diff matches the paths filter, once per
# queue batch on merge_group, nightly, and on dispatch. Superseded PR runs
# are cancelled by the concurrency group. Wall-clock and flake history are in
# .cf-studio/.plans/stage1-compose-e2e-suite/out/ci-wiring.md.
#
# Every stand operation goes through ./dev-compose.sh test-stand — never the
# bare up/down/seed a human developer uses. The pinned frontend, Keycloak auth
# and the dbt-readiness gate live behind that verb family; the plain
# subcommands resolve to the developer's defaults and would silently exercise a
# different stand.

on:
  pull_request:
    branches: [main]
    # Mirrors the `changes` job's regex below — keep the two lists in sync.
    # This filter decides which PRs run the stand at all; the `changes` job
    # re-checks the same diff (and is the only filter merge_group gets, since
    # that event supports no `paths:` key). A PR outside these paths produces
    # no run at all, so `Stand E2E` cannot be made a PR-level required check
    # while this filter exists — a required check whose workflow never
    # triggers reports as pending forever and blocks queue entry. It can
    # still be required on merge_group.
    paths:
      - "tests/**"
      - "deploy/compose/**"
      - "src/ingestion/tools/seed/**"
      - "docker-compose.yml"
      - "dev-compose.sh"
      - "src/backend/**"
      - "src/frontend/**"
      - "docs/components/backend/**/openapi.json"
      - ".github/workflows/e2e-stand.yml"
      - ".github/workflows/scripts/redact-playwright-trace.py"
  # Merge-queue builds: the queue's gh-readonly-queue/* branches emit
  # merge_group, and a required check must report there or every queued PR
  # times out and is evicted.
  merge_group:
  # A scheduled run always evaluates against the default branch, so this is the
  # main-branch lane whatever ref the file is authored on. Nightly rather than
  # per-push: the stand is expensive and nothing here is a merge gate.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Which stand to run against. Only 'compose' is implemented."
        required: false
        type: choice
        options: [compose]
        default: compose

# One run per PR; a rebase or a force-push obsoletes whatever is in flight.
# Merge-queue builds get a unique group instead — cancelling a batch mid-run
# is the queue's own call, never this workflow's.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'merge_group' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

permissions:
  contents: read
  packages: read # pulls the pinned service images (via compose)

jobs:
  # Stages 2 (CI stand) and 3 (E2E stand) are meant to add a target to
  # `resolve-target` below rather than copy this file.
  # ─── changes ──────────────────────────────────────────────────────────────
  # The relevance filter for the events that support no `paths:` key —
  # merge_group above all. Its regex mirrors the pull_request paths list at
  # the top of the file; keep the two in sync.
  #
  # `src/backend/**` is in the list, and its absence was the reason making this
  # required would have gated nothing that matters: the endpoint contracts this
  # suite asserts are implemented there, so a PR changing an analytics handler
  # has to run the stand or the gate is decorative.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
      # Whether the diff touches src/backend/ — the lanes turn this into
      # `up --build-backend`, because `up` refuses a backend-changing tree
      # rather than silently testing it against main's pulled images.
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # No base to diff against (merge_group without one, or a manual
          # run): assume relevant rather than skipping a gate on a guess, and
          # take the backend answer from the same comparison `up` itself
          # makes, so the flag and the refusal cannot disagree.
          if [ -z "${BASE:-}" ]; then
            BASE="$(git rev-parse --verify --quiet origin/main || true)"
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "no base sha — running"
            if [ -n "$BASE" ] && [ -n "$(git diff --name-only "$BASE" "$HEAD" -- src/backend | head -1)" ]; then
              echo "backend=true" >> "$GITHUB_OUTPUT"
            else
              echo "backend=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          changed="$(git diff --name-only "$BASE" "$HEAD")"
          echo "$changed" | sed 's/^/  /'
          if echo "$changed" | grep -qE '^(tests/|deploy/compose/|src/ingestion/tools/seed/|docker-compose\.yml|dev-compose\.sh|src/backend/|src/frontend/|docs/components/backend/.*/openapi\.json|\.github/workflows/e2e-stand\.yml|\.github/workflows/scripts/redact-playwright-trace\.py)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "nothing the stand covers changed"
          fi
          if echo "$changed" | grep -q '^src/backend/'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

  resolve-target:
    name: resolve-target
    needs: changes
    if: ${{ needs.changes.outputs.relevant == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      target: ${{ steps.resolve.outputs.target }}
    steps:
      - id: resolve
        # Through the environment, not string interpolation: an input spliced
        # into a shell body is a script-injection sink even when the input is a
        # `choice` today and someone widens it to a string tomorrow.
        env:
          REQUESTED: ${{ inputs.target }}
        run: |
          set -euo pipefail
          TARGET="${REQUESTED:-compose}"
          if [ "$TARGET" != "compose" ]; then
            echo "::error::unsupported target '$TARGET' — only 'compose' is implemented"
            exit 1
          fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "target: $TARGET"

  # ─── api-smoke ────────────────────────────────────────────────────────────
  # HTTP-only, so it runs from the repo with uv rather than in the browser
  # image. `--ignore` rather than a path argument: `test-stand test` always
  # passes `tests/stand` to pytest and forwards this on top, so naming a
  # subdirectory would ADD to the full collection instead of narrowing it.
  # Measured: 273 collected here, 10 in ui-journeys, 283 for the whole suite.
  api-smoke:
    name: api-smoke
    needs: [changes, resolve-target]
    if: needs.resolve-target.outputs.target == 'compose'
    runs-on: ubuntu-latest
    # Pull mode measured near 8m, so 45 leaves ~5x headroom for a cold runner
    # and a slow registry while not letting a hung stand burn an hour and a
    # half. A backend-building run was measured at 28m (26m of it the build),
    # hence the wider ceiling on that path.
    timeout-minutes: ${{ needs.changes.outputs.backend == 'true' && 75 || 45 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # don't leave the token in .git/config

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          cache-suffix: stand-api

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `up` writes .env.compose.test-stand, forces the pinned frontend and
      # Keycloak, seeds, and then blocks until EVERY gold observation table the
      # seed populates proves dbt rebuilt it for THIS run and left a positive
      # observation in it. It does not return success before that, so no
      # separate readiness wait belongs here — and no separate `seed` step
      # either: re-seeding after the gate would rebuild the data the gate just
      # vouched for and leave nothing checking the result.
      #
      # The gate covers ClickHouse only. A service that failed to start is not
      # its business and will surface as a test failure instead.
      - name: Bring the stand up
        env:
          BUILD_BACKEND: ${{ needs.changes.outputs.backend }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$BUILD_BACKEND" = "true" ]; then flags+=(--build-backend); fi
          ./dev-compose.sh test-stand up "${flags[@]}"

      - name: Run the API suite
        run: ./dev-compose.sh test-stand test --ignore=tests/stand/ui

      # `always()`: the ledger a FAILING run wrote is the more useful of the
      # two — it says which operations were reached before things went wrong —
      # and a gate that only ran after a green suite would never report on the
      # runs where coverage actually slipped.
      #
      # Plain python3, no uv: the gate is stdlib-only over two JSON files by
      # design, so it does not need the suite's environment and cannot be
      # broken by it.
      - name: API coverage gate
        if: always()
        run: |
          set -uo pipefail
          [ -f .artifacts/stand_observed_endpoints.json ] || {
            echo "::warning::no coverage ledger — the suite did not reach pytest_sessionfinish"
            exit 0; }
          python3 tests/lib/insight_stand/coverage.py \
            --observed .artifacts/stand_observed_endpoints.json \
            --catalogue .artifacts/stand_operations.json \
            --spec docs/components/backend/analytics/openapi.json | tee coverage.md
          rc=${PIPESTATUS[0]}
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then cat coverage.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ "$rc" -ne 0 ]; then
            echo "::error::API coverage gate failed — a catalogued operation was never called, was called only by the anonymous sweep, or a documented operation has no test"
          fi
          exit "$rc"

      # `include-hidden-files` is load-bearing, not boilerplate: `.artifacts/`
      # is a dotted directory, and without it the action silently drops both
      # JSON files and uploads the rendered table alone. That is the half of
      # the artifact nobody can act on — re-running the gate over a past run's
      # ledger, which is how you tell a coverage regression from a reshuffle,
      # needs the inputs and not the summary.
      - name: Upload the coverage ledger
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-smoke-coverage
          include-hidden-files: true
          path: |
            .artifacts/stand_observed_endpoints.json
            .artifacts/stand_operations.json
            coverage.md
          if-no-files-found: ignore
          retention-days: 7

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          set -uo pipefail
          mkdir -p compose-logs
          echo "::group::containers"
          docker ps -a || true
          echo "::endgroup::"
          echo "::group::container logs"
          for name in $(docker ps -a --filter "name=insight-" --format '{{.Names}}' || true); do
            docker logs --tail=400 "$name" > "compose-logs/${name}.log" 2>&1 || true
            echo "----- ${name} -----"
            tail -n 120 "compose-logs/${name}.log" || true
          done
          echo "::endgroup::"
          echo "::group::stand configuration"
          # Named keys only — the generated env file also carries the local
          # database passwords, and this output is world-readable on a public run.
          grep -E '^(FRONTEND_MODE|FRONTEND_IMAGE|AUTH_MODE|GATEWAY_PORT|AUTHENTICATOR_OIDC_ISSUER)=' \
            .env.compose.test-stand || true
          echo "::endgroup::"

      - name: Upload compose logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-smoke-compose-logs
          path: compose-logs/
          if-no-files-found: ignore
          retention-days: 7

      # always(), not failure(): a cancelled run must still tear its stack
      # down, and `down` passes --volumes so the next run starts from empty
      # databases rather than inheriting this one's rows.
      - name: Tear the stand down
        if: always()
        run: |
          [ -f .env.compose.test-stand ] || { echo "no stand env file — nothing to tear down"; exit 0; }
          ./dev-compose.sh test-stand down

  # ─── ui-journeys ──────────────────────────────────────────────────────────
  # No `needs` on api-smoke and none from it: each is an independently
  # reportable check, so a red API contract does not hide a broken login.
  #
  # Host-side, from the checkout, on every event — so the lane always tests
  # the test code of the ref it runs for. The suite once ran inside a
  # published `insight-ui-tests` image, but the image baked the suite in and
  # `:latest` only moved on a main push, so a PR lane ran main's old test
  # code against the PR's stand; when checkout mode replaced that, the image
  # had no consumer left and was removed. The cookie constraint the image's
  # netns join once served is met here too: the stand publishes the gateway
  # on the runner's own localhost, and localhost is the one plain-http origin
  # a browser stores a `__Host-` cookie from.
  ui-journeys:
    name: ui-journeys
    needs: [changes, resolve-target]
    if: needs.resolve-target.outputs.target == 'compose'
    runs-on: ubuntu-latest
    # Same reasoning as api-smoke's, plus the Chromium install. The journeys
    # themselves took 28s.
    timeout-minutes: ${{ needs.changes.outputs.backend == 'true' && 75 || 45 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12" # runs the redaction script only — stdlib alone

      # `test-stand up` forces Keycloak, and the realm is generated by the seed
      # package's own entry point (`insight-seed-realm`), which dev-compose.sh
      # runs through uv. The API job above installs uv for the suite; this job
      # needs it for the bring-up itself.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          cache-suffix: stand-ui

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bring the stand up
        env:
          BUILD_BACKEND: ${{ needs.changes.outputs.backend }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$BUILD_BACKEND" = "true" ]; then flags+=(--build-backend); fi
          ./dev-compose.sh test-stand up "${flags[@]}"

      # The suite's own Chromium, resolved by the locked test environment so
      # every runner installs the same browser build. `--with-deps` installs
      # the runner's system libraries.
      - name: Install the suite's browser
        run: |
          uv sync --project tests
          uv run --project tests --frozen playwright install --with-deps chromium

      # `--ignore` rather than a path argument for the same reason as
      # api-smoke's: the verb always passes tests/stand and unions paths.
      #
      # retain-on-failure for trace and video: a green run then carries no
      # session credentials off the runner at all, which is a smaller problem
      # than redacting one.
      - name: Run the browser journeys
        run: |
          ./dev-compose.sh test-stand test \
            --ignore=tests/stand/api --ignore=tests/stand/meta \
            --browser chromium \
            --tracing=retain-on-failure \
            --screenshot=only-on-failure \
            --video=retain-on-failure

      # BETWEEN capture and upload, and always — a failed run is exactly when a
      # trace exists. A Playwright trace replays a real signed-in session: it
      # carries the `__Host-sid` cookie and every Authorization header, twice
      # over (raw headers and a parsed HAR `cookies` array). The script fails
      # closed — a trace it cannot rewrite and verify is deleted, not uploaded.
      - name: Strip credentials from traces
        id: redact
        if: always()
        run: python3 .github/workflows/scripts/redact-playwright-trace.py test-results

      - name: Upload traces and screenshots
        # Gated on redaction having SUCCEEDED, not merely run: a non-zero exit
        # means at least one artifact was not proven clean.
        if: always() && steps.redact.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-journeys-traces
          path: |
            test-results/**/*.zip
            test-results/**/*.png
          # A green run keeps neither, by the capture policy above.
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload video
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-journeys-video
          path: test-results/**/*.webm
          if-no-files-found: ignore
          retention-days: 7

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          set -uo pipefail
          mkdir -p compose-logs
          echo "::group::containers"
          docker ps -a || true
          echo "::endgroup::"
          echo "::group::container logs"
          for name in $(docker ps -a --filter "name=insight-" --format '{{.Names}}' || true); do
            docker logs --tail=400 "$name" > "compose-logs/${name}.log" 2>&1 || true
            echo "----- ${name} -----"
            tail -n 120 "compose-logs/${name}.log" || true
          done
          echo "::endgroup::"
          echo "::group::stand configuration"
          grep -E '^(FRONTEND_MODE|FRONTEND_IMAGE|AUTH_MODE|GATEWAY_PORT|AUTHENTICATOR_OIDC_ISSUER)=' \
            .env.compose.test-stand || true
          echo "::endgroup::"

      - name: Upload compose logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-journeys-compose-logs
          path: compose-logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Tear the stand down
        if: always()
        run: |
          [ -f .env.compose.test-stand ] || { echo "no stand env file — nothing to tear down"; exit 0; }
          ./dev-compose.sh test-stand down

  # ─── the required check ───────────────────────────────────────────────────
  # One stable context name for branch protection — requirable on merge_group
  # only; the paths filter above means it cannot be required at PR level. It
  # runs whenever the run wasn't cancelled, so it still reports when `changes`
  # deemed the diff irrelevant and the lanes were skipped.
  #
  # `skipped` is therefore a PASS here, unlike in e2e-bronze-to-api.yml's
  # umbrella where it is a failure. The difference is what the skip means: there
  # a skipped lane implies a red upstream build, here it means `changes` decided
  # the diff cannot affect the stand. Treating those the same would either block
  # every unrelated PR or let a broken build through.
  stand-suite:
    name: Stand E2E
    needs: [changes, api-smoke, ui-journeys]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both lanes to have passed, or to have been skipped as irrelevant
        env:
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          API: ${{ needs.api-smoke.result }}
          UI: ${{ needs.ui-journeys.result }}
        run: |
          set -euo pipefail
          echo "relevant=$RELEVANT api-smoke=$API ui-journeys=$UI"

          if [ "$RELEVANT" != "true" ]; then
            echo "nothing the stand covers changed — nothing to prove."
            exit 0
          fi
          for lane in "api-smoke=$API" "ui-journeys=$UI"; do
            if [ "${lane#*=}" != "success" ]; then
              echo "::error::${lane%%=*} did not pass (${lane#*=}) — the deployed-stand"\
                   "contracts are unproven for this change."
              exit 1
            fi
          done
          echo "Stand E2E passed: both lanes green."
