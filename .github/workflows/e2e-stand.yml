name: E2E — Compose stand

# The deployed-stand suite (tests/stand) run against a real compose stack: ghcr
# images pinned to each component's chart appVersion, a real Keycloak login, and
# gold data dbt actually built. Distinct from e2e-bronze-to-api.yml, which
# exercises the in-process ingestion rig and now carries one blocking gate
# (metric coverage) — that workflow is untouched by this one.
#
# Nothing here builds by default: `test-stand up` pulls the frontend and the
# four backend services at their charts' appVersions, which name main's build.
# A ref that changes one of those trees has to run it or the lane reports on
# code it never tested. Pull requests load backend images already built for the
# same commit; events without that image workflow retain the source-build path.
# Frontend changes continue to build the SPA in this job.
#
# INVARIANT: Both lane checks report independently from one stand lifecycle.
#
#   api-smoke    tests/stand/api — 267 HTTP contract tests, plus the harness's
#                own 17 (tests/stand/meta) and the coverage gate. No browser.
#   ui-journeys  tests/stand/ui  — the browser journeys, run host-side from
#                the checkout on every event, so the ref's own test code is
#                what executes.
#
# Neither is required on its own; `Stand E2E` below is the one stable context
# for branch protection. The workflow starts on every pull request so that
# required context always reports; the cheap `changes` job decides whether the
# two stand lanes need to run. Relevant changes run on the pull request, once
# per queue batch on merge_group, nightly, and on dispatch. Superseded PR runs
# are cancelled by the concurrency group. Wall-clock and flake history are in
# .cf-studio/.plans/stage1-compose-e2e-suite/out/ci-wiring.md.
#
# Every stand operation goes through ./dev-compose.sh test-stand — never the
# bare up/down/seed a human developer uses. The pinned frontend, Keycloak auth
# and the dbt-readiness gate live behind that verb family; the plain
# subcommands resolve to the developer's defaults and would silently exercise a
# different stand.

on:
  pull_request:
    branches: [main]
    # Deliberately NO `paths:` filter. This workflow emits the required
    # `Stand E2E` check, and GitHub leaves a required check whose workflow never
    # ran pending forever. Relevance is decided by the cheap `changes` job.
  # Merge-queue builds: the queue's gh-readonly-queue/* branches emit
  # merge_group, and a required check must report there or every queued PR
  # times out and is evicted.
  merge_group:
  # A scheduled run always evaluates against the default branch, so this is the
  # main-branch lane whatever ref the file is authored on. Nightly rather than
  # per-push: the stand is expensive and nothing here is a merge gate.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Which stand to run against. Only 'compose' is implemented."
        required: false
        type: choice
        options: [compose]
        default: compose

# One run per PR; a rebase or a force-push obsoletes whatever is in flight.
# Merge-queue builds get a unique group instead — cancelling a batch mid-run
# is the queue's own call, never this workflow's.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'merge_group' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

permissions:
  contents: read
  actions: read # downloads images produced earlier in this workflow run
  packages: read # pulls the pinned service images (via compose)

env:
  UI_TESTS_IMAGE: mcr.microsoft.com/playwright/python@sha256:aa81288e738725378becba5b3e06cb0f3a7f012a610e87e8d767a090ea3f740d

jobs:
  # Stages 2 (CI stand) and 3 (E2E stand) are meant to add a target to
  # `resolve-target` below rather than copy this file.
  # ─── changes ──────────────────────────────────────────────────────────────
  # What an `on: paths:` filter would have done, moved into a job so the
  # workflow always runs and the required umbrella below always reports. The
  # same filter also covers events such as merge_group that support no paths.
  #
  # `src/backend/**` is in the list, and its absence was the reason making this
  # required would have gated nothing that matters: the endpoint contracts this
  # suite asserts are implemented there, so a PR changing an analytics handler
  # has to run the stand or the gate is decorative.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
      # One per buildable tree; the lanes turn each into its own --build-* flag.
      backend: ${{ steps.filter.outputs.backend }}
      backend_artifacts: ${{ steps.filter.outputs.backend_artifacts }}
      analytics: ${{ steps.filter.outputs.analytics }}
      authenticator: ${{ steps.filter.outputs.authenticator }}
      identity_resolution: ${{ steps.filter.outputs.identity_resolution }}
      gateway: ${{ steps.filter.outputs.gateway }}
      gateway_checks: ${{ steps.filter.outputs.gateway_checks }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          emit() {
            printf 'relevant=%s\nbackend=%s\nfrontend=%s\nbackend_artifacts=%s\nanalytics=%s\nauthenticator=%s\nidentity_resolution=%s\ngateway=%s\ngateway_checks=%s\n' \
              "$relevant" "$backend" "$frontend" "$backend_artifacts" \
              "$analytics" "$authenticator" "$identity_resolution" "$gateway" "$gateway_checks" >> "$GITHUB_OUTPUT"
            echo "relevant=$relevant backend=$backend frontend=$frontend backend_artifacts=$backend_artifacts"
            echo "analytics=$analytics authenticator=$authenticator identity_resolution=$identity_resolution gateway=$gateway"
          }
          # Match pull_request path-filter semantics: compare the branch from
          # its merge base, not from the current base-branch tip. A two-dot diff
          # would attribute unrelated commits that landed on main after this
          # branch forked to the pull request and run the stand unnecessarily.
          #
          # No base means a schedule or a dispatch: nothing to filter, so it
          # runs either way and the comparison only decides what to build.
          forced=false
          if [ -n "${BASE:-}" ]; then
            base_point="$(git merge-base "$BASE" "$HEAD" 2>/dev/null || true)"
          else
            forced=true
            base_point="$(git rev-parse --verify --quiet origin/main || true)"
            echo "no base sha — running, and comparing against origin/main to decide what to build"
          fi
          # No comparison point: build both rather than pin on a comparison that
          # was never made.
          if [ -z "$base_point" ]; then
            echo "no comparison point — running the stand and building the product"
            relevant=true
            backend=true
            frontend=true
            backend_artifacts=false
            analytics=false
            authenticator=false
            identity_resolution=false
            gateway=false
            gateway_checks=false
            emit
            exit 0
          fi
          changed="$(git diff --name-only "$base_point" "$HEAD")"
          printf '  %s\n' "${changed//$'\n'/$'\n  '}"
          relevant="$forced"
          backend=false
          frontend=false
          backend_artifacts=false
          analytics=false
          authenticator=false
          identity_resolution=false
          gateway=false
          gateway_checks=false
          if echo "$changed" | grep -qE '^(tests/|deploy/compose/|src/ingestion/tools/seed/|docker-compose\.yml|dev-compose\.sh|src/backend/|src/frontend/|docs/components/backend/.*/openapi\.json|\.github/workflows/(build-images|e2e-stand)\.yml|\.github/workflows/scripts/redact-playwright-trace\.py|scripts/ci/prebuilt_images\.py)'; then
            relevant=true
          elif [ "$forced" = true ]; then
            echo "nothing the stand covers changed — running anyway, this event has no pull request to filter"
          else
            echo "nothing the stand covers changed"
          fi
          if echo "$changed" | grep -q '^src/backend/'; then backend=true; fi
          if echo "$changed" | grep -q '^src/frontend/'; then frontend=true; fi
          if echo "$changed" | grep -qE '^(src/backend/services/analytics/|src/backend/libs/insight-clickhouse/|src/backend/docker-entrypoint\.sh$|src/backend/Cargo\.(toml|lock)$|\.github/workflows/(build-images|e2e-stand)\.yml$)'; then analytics=true; fi
          if echo "$changed" | grep -qE '^(src/backend/services/authenticator/|src/backend/libs/authenticator-sdk/|src/backend/Cargo\.(toml|lock)$|\.github/workflows/(gateway|build-images|e2e-stand)\.yml$|scripts/ci/prebuilt_images\.py$)'; then authenticator=true; fi
          if echo "$changed" | grep -qE '^(src/backend/services/identity-resolution/|src/backend/libs/insight-clickhouse/|src/backend/docker-entrypoint\.sh$|src/backend/Cargo\.(toml|lock)$|\.github/workflows/(build-images|e2e-stand)\.yml$)'; then identity_resolution=true; fi
          if echo "$changed" | grep -qE '^(src/backend/services/gateway/|src/backend/tools/routegen/|src/backend/Cargo\.(toml|lock)$|\.github/workflows/(gateway|build-images|e2e-stand)\.yml$|scripts/ci/prebuilt_images\.py$)'; then gateway=true; fi
          if echo "$changed" | grep -qE '^(src/backend/tools/routegen/|src/backend/services/gateway/|src/backend/services/authenticator/|src/backend/libs/authenticator-sdk/|src/backend/Cargo\.(toml|lock)$|src/ingestion/tools/seed/insight_seed/|\.github/workflows/(gateway|build-images|e2e-stand)\.yml$|scripts/ci/(prebuilt_images|test_prebuilt_images)\.py$)'; then gateway_checks=true; fi
          if [[ "$GITHUB_EVENT_NAME" == pull_request || "$GITHUB_EVENT_NAME" == merge_group ]] && \
             [[ "$analytics" == true || "$authenticator" == true || "$identity_resolution" == true || "$gateway" == true ]]; then
            backend_artifacts=true
          fi
          emit

  build-pr-images:
    name: Build PR images
    needs: changes
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-images.yml

  bronze-to-api:
    name: Bronze to API
    needs: build-pr-images
    if: github.event_name == 'pull_request' && needs.build-pr-images.result == 'success'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/e2e-bronze-to-api.yml

  bronze-to-api-report:
    name: Run E2E suite
    needs: bronze-to-api
    if: github.event_name == 'pull_request' && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Require the Bronze-to-API workflow to pass
        env:
          RESULT: ${{ needs.bronze-to-api.result }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "::error::Bronze-to-API checks did not pass ($RESULT)."
            exit 1
          fi

  gateway:
    name: Gateway checks
    needs: [changes, build-pr-images]
    if: |
      !cancelled()
      && github.event_name == 'pull_request'
      && needs.changes.outputs.gateway_checks == 'true'
      && (needs.build-pr-images.result == 'success' || needs.build-pr-images.result == 'skipped')
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/gateway.yml

  resolve-target:
    name: resolve-target
    needs: changes
    if: ${{ needs.changes.outputs.relevant == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      target: ${{ steps.resolve.outputs.target }}
    steps:
      - id: resolve
        # Through the environment, not string interpolation: an input spliced
        # into a shell body is a script-injection sink even when the input is a
        # `choice` today and someone widens it to a string tomorrow.
        env:
          REQUESTED: ${{ inputs.target }}
        run: |
          set -euo pipefail
          TARGET="${REQUESTED:-compose}" # RULE-DEFAULTS-OK: compose is the workflow's only declared target.
          if [ "$TARGET" != "compose" ]; then
            echo "::error::unsupported target '$TARGET' — only 'compose' is implemented"
            exit 1
          fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "target: $TARGET"

  # ─── api-smoke ────────────────────────────────────────────────────────────
  # HTTP-only, so it runs from the repo with uv rather than in the browser
  # image. `--ignore` rather than a path argument: `test-stand test` always
  # passes `tests/stand` to pytest and forwards this on top, so naming a
  # subdirectory would ADD to the full collection instead of narrowing it.
  stand-runner:
    name: shared stand runner
    needs: [changes, resolve-target, build-pr-images]
    if: |
      !cancelled()
      && needs.resolve-target.result == 'success'
      && needs.resolve-target.outputs.target == 'compose'
      && (needs.build-pr-images.result == 'success' || needs.build-pr-images.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.results.outputs.api }}
      ui: ${{ steps.results.outputs.ui }}
    timeout-minutes: ${{ needs.changes.outputs.backend == 'true' && 75 || 45 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # don't leave the token in .git/config

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12" # runs the redaction script only — stdlib alone

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          cache-suffix: stand-api
          save-cache: ${{ github.event_name == 'schedule' }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load PR-built backend images
        if: needs.changes.outputs.backend_artifacts == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          ANALYTICS_POLICY: ${{ needs.changes.outputs.analytics == 'true' && 'required' || 'unchanged' }}
          AUTHENTICATOR_POLICY: ${{ needs.changes.outputs.authenticator == 'true' && 'required' || 'unchanged' }}
          IDENTITY_POLICY: ${{ needs.changes.outputs.identity_resolution == 'true' && 'required' || 'unchanged' }}
          GATEWAY_POLICY: ${{ needs.changes.outputs.gateway == 'true' && 'required' || 'unchanged' }}
        run: |
          python3 scripts/ci/prebuilt_images.py \
            --run-id "$RUN_ID" --registry ghcr.io/constructorfabric \
            --destination /tmp/e2e-prebuilt \
            --image "insight-analytics:${ANALYTICS_POLICY}" \
            --image "insight-authenticator:${AUTHENTICATOR_POLICY}" \
            --image "insight-identity-resolution:${IDENTITY_POLICY}" \
            --image "insight-gateway:${GATEWAY_POLICY}"

      # `up` writes .env.compose.test-stand, forces the pinned frontend and
      # Keycloak, seeds, and then blocks until EVERY gold observation table the
      # seed populates proves dbt rebuilt it for THIS run and left a positive
      # observation in it. It does not return success before that, so no
      # separate readiness wait belongs here — and no separate `seed` step
      # either: re-seeding after the gate would rebuild the data the gate just
      # vouched for and leave nothing checking the result.
      #
      # The gate covers ClickHouse only. A service that failed to start is not
      # its business and will surface as a test failure instead.
      - name: Bring the stand up
        id: stand-up
        continue-on-error: true
        env:
          BUILD_BACKEND: ${{ needs.changes.outputs.backend }}
          PREBUILT_BACKEND: ${{ needs.changes.outputs.backend_artifacts }}
          BUILD_FRONTEND: ${{ needs.changes.outputs.frontend }}
          ANALYTICS_IMAGE: ${{ needs.changes.outputs.backend_artifacts == 'true' && 'insight-analytics:e2e-prebuilt' || '' }}
          AUTHENTICATOR_IMAGE: ${{ needs.changes.outputs.backend_artifacts == 'true' && 'insight-authenticator:e2e-prebuilt' || '' }}
          IDENTITY_RESOLUTION_IMAGE: ${{ needs.changes.outputs.backend_artifacts == 'true' && 'insight-identity-resolution:e2e-prebuilt' || '' }}
          GATEWAY_IMAGE: ${{ needs.changes.outputs.backend_artifacts == 'true' && 'insight-gateway:e2e-prebuilt' || '' }}
        run: |
          set -euo pipefail
          # `if` blocks, not `[ … ] && flags+=(…)`: under set -e a false test as
          # the last command of an && list ends the step.
          flags=()
          if [ "$PREBUILT_BACKEND" = "true" ]; then
            flags+=(--prebuilt-backend)
          elif [ "$BUILD_BACKEND" = "true" ]; then
            flags+=(--build-backend)
          fi
          if [ "$BUILD_FRONTEND" = "true" ]; then flags+=(--build-frontend); fi
          ./dev-compose.sh test-stand up "${flags[@]}"

      - name: Run the API suite
        id: api-tests
        if: steps.stand-up.outcome == 'success'
        continue-on-error: true
        run: ./dev-compose.sh test-stand test --ignore=tests/stand/ui

      # `always()`: the ledger a FAILING run wrote is the more useful of the
      # two — it says which operations were reached before things went wrong —
      # and a gate that only ran after a green suite would never report on the
      # runs where coverage actually slipped.
      #
      # Plain python3, no uv: the gate is stdlib-only over two JSON files by
      # design, so it does not need the suite's environment and cannot be
      # broken by it.
      - name: API coverage gate
        id: api-coverage
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          [ -f .artifacts/stand_observed_endpoints.json ] || {
            echo "::warning::no coverage ledger — the suite did not reach pytest_sessionfinish"
            exit 0; }
          python3 tests/lib/insight_stand/coverage.py \
            --observed .artifacts/stand_observed_endpoints.json \
            --catalogue .artifacts/stand_operations.json \
            --spec docs/components/backend/analytics/openapi.json | tee coverage.md
          rc=${PIPESTATUS[0]}
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then cat coverage.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ "$rc" -ne 0 ]; then
            echo "::error::API coverage gate failed — a catalogued operation was never called, was called only by the anonymous sweep, or a documented operation has no test"
          fi
          exit "$rc"

      # `include-hidden-files` is load-bearing, not boilerplate: `.artifacts/`
      # is a dotted directory, and without it the action silently drops both
      # JSON files and uploads the rendered table alone. That is the half of
      # the artifact nobody can act on — re-running the gate over a past run's
      # ledger, which is how you tell a coverage regression from a reshuffle,
      # needs the inputs and not the summary.
      - name: Upload the coverage ledger
        id: api-coverage-upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-smoke-coverage
          include-hidden-files: true
          path: |
            .artifacts/stand_observed_endpoints.json
            .artifacts/stand_operations.json
            coverage.md
          if-no-files-found: ignore
          retention-days: 7

      - name: Install the suite's browser
        id: browser-install
        if: always() && steps.stand-up.outcome == 'success'
        continue-on-error: true
        run: docker pull "$UI_TESTS_IMAGE"

      - name: Run the browser journeys
        id: ui-tests
        if: always() && steps.browser-install.outcome == 'success'
        continue-on-error: true
        run: |
          ./dev-compose.sh test-stand test \
            --image "$UI_TESTS_IMAGE" \
            --ignore=tests/stand/api --ignore=tests/stand/meta \
            --browser chromium \
            --tracing=retain-on-failure \
            --screenshot=only-on-failure \
            --video=retain-on-failure

      - name: Strip credentials from traces
        id: redact
        if: always()
        continue-on-error: true
        run: python3 .github/workflows/scripts/redact-playwright-trace.py test-results

      - name: Upload traces and screenshots
        id: ui-traces-upload
        if: always() && steps.redact.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-journeys-traces
          path: |
            test-results/**/*.zip
            test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload video
        if: always() && steps.ui-tests.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-journeys-video
          path: test-results/**/*.webm
          if-no-files-found: ignore
          retention-days: 7

      - name: Dump diagnostics on failure
        if: >-
          always() && (
            steps.stand-up.outcome != 'success' ||
            steps.api-tests.outcome != 'success' ||
            steps.api-coverage.outcome != 'success' ||
            steps.browser-install.outcome != 'success' ||
            steps.ui-tests.outcome != 'success' ||
            steps.redact.outcome != 'success'
          )
        run: |
          set -uo pipefail
          mkdir -p compose-logs
          echo "::group::containers"
          docker ps -a || true
          echo "::endgroup::"
          echo "::group::container logs"
          for name in $(docker ps -a --filter "name=insight-" --format '{{.Names}}' || true); do
            docker logs --tail=400 "$name" > "compose-logs/${name}.log" 2>&1 || true
            echo "----- ${name} -----"
            tail -n 120 "compose-logs/${name}.log" || true
          done
          echo "::endgroup::"
          echo "::group::stand configuration"
          # Named keys only — the generated env file also carries the local
          # database passwords, and this output is world-readable on a public run.
          grep -E '^(FRONTEND_MODE|FRONTEND_IMAGE|AUTH_MODE|GATEWAY_PORT|AUTHENTICATOR_OIDC_ISSUER)=' \
            .env.compose.test-stand || true
          echo "::endgroup::"

      - name: Upload compose logs
        if: >-
          always() && (
            steps.stand-up.outcome != 'success' ||
            steps.api-tests.outcome != 'success' ||
            steps.api-coverage.outcome != 'success'
          )
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-smoke-compose-logs
          path: compose-logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload UI compose logs
        if: >-
          always() && (
            steps.stand-up.outcome != 'success' ||
            steps.browser-install.outcome != 'success' ||
            steps.ui-tests.outcome != 'success' ||
            steps.redact.outcome != 'success'
          )
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-journeys-compose-logs
          path: compose-logs/
          if-no-files-found: ignore
          retention-days: 7

      # always(), not failure(): a cancelled run must still tear its stack
      # down, and `down` passes --volumes so the next run starts from empty
      # databases rather than inheriting this one's rows.
      - name: Tear the stand down
        id: teardown
        if: always()
        run: |
          [ -f .env.compose.test-stand ] || { echo "no stand env file — nothing to tear down"; exit 0; }
          ./dev-compose.sh test-stand down

      - name: Record lane results
        id: results
        if: always()
        env:
          STAND: ${{ steps.stand-up.outcome }}
          API_TESTS: ${{ steps.api-tests.outcome }}
          API_COVERAGE: ${{ steps.api-coverage.outcome }}
          API_COVERAGE_UPLOAD: ${{ steps.api-coverage-upload.outcome }}
          BROWSER_INSTALL: ${{ steps.browser-install.outcome }}
          UI_TESTS: ${{ steps.ui-tests.outcome }}
          REDACTION: ${{ steps.redact.outcome }}
          UI_TRACES_UPLOAD: ${{ steps.ui-traces-upload.outcome }}
          TEARDOWN: ${{ steps.teardown.outcome }}
        run: |
          set -euo pipefail
          api=failure
          ui=failure
          if [ "$STAND" = success ] && [ "$API_TESTS" = success ] && [ "$API_COVERAGE" = success ] && [ "$API_COVERAGE_UPLOAD" = success ] && [ "$TEARDOWN" = success ]; then
            api=success
          fi
          if [ "$STAND" = success ] && [ "$BROWSER_INSTALL" = success ] && [ "$UI_TESTS" = success ] && [ "$REDACTION" = success ] && [ "$UI_TRACES_UPLOAD" = success ] && [ "$TEARDOWN" = success ]; then
            ui=success
          fi
          printf 'api=%s\nui=%s\n' "$api" "$ui" >> "$GITHUB_OUTPUT"

  # ─── stable lane checks ──────────────────────────────────────────────────
  # INVARIANT: These job names are stable branch-protection check identities.
  api-smoke:
    name: api-smoke
    needs: [changes, stand-runner]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report the API lane
        env:
          CHANGES: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          LANE: ${{ needs.stand-runner.outputs.api }}
        run: |
          set -euo pipefail
          if [ "$CHANGES" != success ]; then
            echo "::error::stand relevance is unknown because the changes job did not pass"
            exit 1
          fi
          if [ "$RELEVANT" = false ]; then
            echo "API smoke is not relevant to this change"
            exit 0
          fi
          if [ "$LANE" != success ]; then
            echo "::error::API smoke did not pass"
            exit 1
          fi
          echo "API smoke passed"

  ui-journeys:
    name: ui-journeys
    needs: [changes, stand-runner]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report the UI lane
        env:
          CHANGES: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          LANE: ${{ needs.stand-runner.outputs.ui }}
        run: |
          set -euo pipefail
          if [ "$CHANGES" != success ]; then
            echo "::error::stand relevance is unknown because the changes job did not pass"
            exit 1
          fi
          if [ "$RELEVANT" = false ]; then
            echo "UI journeys are not relevant to this change"
            exit 0
          fi
          if [ "$LANE" != success ]; then
            echo "::error::UI journeys did not pass"
            exit 1
          fi
          echo "UI journeys passed"

  # ─── the required check ───────────────────────────────────────────────────
  # One stable context name for branch protection on both pull_request and
  # merge_group. It runs whenever the workflow was not cancelled, including
  # when `changes` deemed the diff irrelevant and the lanes were skipped.
  #
  # A skipped lane is a pass only when `changes` explicitly reported the diff
  # irrelevant. If relevance is unknown or relevant, every lane must succeed.
  stand-suite:
    name: Stand E2E
    needs: [changes, api-smoke, ui-journeys]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both lanes to have passed, or to have been skipped as irrelevant
        env:
          CHANGES: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          API: ${{ needs.api-smoke.result }}
          UI: ${{ needs.ui-journeys.result }}
        run: |
          set -euo pipefail
          echo "changes=$CHANGES relevant=$RELEVANT api-smoke=$API ui-journeys=$UI"

          if [ "$CHANGES" != "success" ]; then
            echo "::error::the changes job did not succeed ($CHANGES) — stand relevance is unknown."
            exit 1
          fi
          if [ "$RELEVANT" = "false" ]; then
            echo "nothing the stand covers changed — nothing to prove."
            exit 0
          fi
          if [ "$RELEVANT" != "true" ]; then
            echo "::error::the changes job produced an invalid relevance value ('$RELEVANT')."
            exit 1
          fi
          for lane in "api-smoke=$API" "ui-journeys=$UI"; do
            if [ "${lane#*=}" != "success" ]; then
              echo "::error::${lane%%=*} did not pass (${lane#*=}) — the deployed-stand"\
                   "contracts are unproven for this change."
              exit 1
            fi
          done
          echo "Stand E2E passed: both lanes green."
