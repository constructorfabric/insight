name: Pool git upgrade

# Temporary: brings every runner in the pool to the git-core PPA's git in place.
# Five legs that each hold their runner so GitHub cannot serve two of them from
# the same machine. Delete once the pool is level.

on:
  push:
    branches:
      - chore/self-hosted-runner-smoke-3515

permissions:
  contents: read

jobs:
  upgrade:
    name: leg ${{ matrix.leg }}
    runs-on: [self-hosted, linux, x64, insight-vhc]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        leg: [1, 2, 3, 4, 5]
    steps:
      - name: Upgrade git in place
        run: |
          set -euo pipefail
          echo "runner: ${RUNNER_NAME}"
          echo "before: $(git --version)"

          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:git-core/ppa
          sudo apt-get update
          sudo apt-get install -y git

          echo "after: $(git --version)"

      # Holds the runner so the five legs overlap; without it one machine can
      # serve several legs in turn and the rest are never touched.
      - name: Hold the runner
        run: sleep 180
