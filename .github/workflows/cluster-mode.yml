name: Cluster mode

# Deploys onto a two-replica ClickHouse behind a round-robin proxy with
# CLICKHOUSE_CLUSTER_MODE on, and onto a single node with it off: two syncs of
# a connector's bronze, the heals a warm install needs, a connector's dbt
# models built twice, the persons sync and the dataset lifecycle of the two
# services that write the warehouse themselves — then asserts what every node
# holds: src/ingestion/tests/cluster-rig/README.md. Both legs are required.

on:
  pull_request:
    branches: [main]
    paths:
      - "src/ingestion/scripts/**"
      - "src/ingestion/dbt/**"
      - "src/ingestion/gold/**"
      - "src/ingestion/silver/**"
      - "src/ingestion/connectors/**"
      - "src/ingestion/reconcile-connectors/python/**"
      - "src/ingestion/tests/cluster-rig/**"
      - "deploy/compose/clickhouse-memory.xml"
      - ".github/workflows/cluster-mode.yml"
      - ".github/runners/insight-vhc/**"
  push:
    branches: [main]
    paths:
      - "src/ingestion/scripts/**"
      - "src/ingestion/dbt/**"
      - "src/ingestion/gold/**"
      - "src/ingestion/silver/**"
      - "src/ingestion/connectors/**"
      - "src/ingestion/reconcile-connectors/python/**"
      - "src/ingestion/tests/cluster-rig/**"
      - "deploy/compose/clickhouse-memory.xml"
      - ".github/workflows/cluster-mode.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rig:
    name: Deploy onto a ${{ matrix.topology }} warehouse
    runs-on: ${{ (vars.INSIGHT_FORCE_GITHUB_HOSTED == 'true' || github.event_name == 'pull_request') && 'ubuntu-latest' || fromJSON('["self-hosted","persistent"]') }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        topology: [standalone, replicated]
    env:
      RIG_TOPOLOGY: ${{ matrix.topology }}
      CLICKHOUSE_MEM_LIMIT: 2g
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # INVARIANT: same major as the toolbox image that runs the deploy hook.
          python-version: "3.12"

      - name: Install protoc + curl headers
        # The same build inputs as ci.yml's rust job: grpc-hub's generated code
        # needs protoc.
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev libcurl4-openssl-dev

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.98.1"

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: src/backend -> target
          key: cluster-rig
          save-if: ${{ github.event_name == 'push' }}

      - name: Build the services the rig runs
        working-directory: src/backend
        run: cargo build -p identity-resolution -p insight-v3-core

      - name: Deploy and assert
        run: src/ingestion/tests/cluster-rig/run.sh
