name: Deploy test stand

# Take the umbrella chart that build-images.yml has just published, put it on the
# shared test stand, seed it, and prove a person can sign in and see data. Issue
# #2244's three acceptance criteria, and nothing else.
#
# ── WHY THIS IS AN ALARM AND NOT A GATE ─────────────────────────────────────
#
# The thing under test does not exist until the merge has happened. `publish-chart`
# runs on push to main; the chart version this workflow deploys is minted by that
# job, so there is no point before the merge at which a deploy of it could be
# required. That is not a limitation to be engineered around — it is the shape of
# the problem. What guards the merge is the existing merge-queue lanes (ci.yml,
# e2e-stand.yml, e2e-bronze-to-api.yml); what this workflow guards is the claim
# that the artefact those lanes approved actually installs and works.
#
# So the failure mode is an ALARM: a red X on the merge commit. There is no
# freeze, no automatic revert, no rollback. A red run means the stand is broken
# and, by construction, so is main.
#
#   RED-RUN OWNERSHIP. The author of the merge commit owns the red run. Fix
#   forward if the cause is obvious and small; revert if it is not. "Someone will
#   look at it" is how a permanently red stand happens, and a permanently red
#   stand is worth less than no stand at all — it stops being read.
#
# The stand's state is CI's: every merge redeploys and reseeds it. Do not put
# hand-made data on it, do not point a demo at it expecting it to be stable, and
# do not `helm upgrade` it by hand except to recover from a failure this workflow
# left in place on purpose (see "deploy" below).
#
# ── WHY ONE JOB AND NOT THREE ───────────────────────────────────────────────
#
# The three stages are steps in one job, each with its own `timeout-minutes`,
# rather than three jobs. Three jobs would be tidier to read in the UI and would
# cost two things that matter more:
#
#   * The seed manifest would have to travel between jobs, and the only transport
#     is an artifact. That manifest names every seeded persona — emails, UUIDs,
#     the tenant. On a public repository an uploaded artifact is a downloadable
#     copy of that for anyone who wants one. Kept inside one job it lives in
#     $RUNNER_TEMP and dies with the runner.
#   * The kubeconfig would have to be re-materialised in each job, tripling the
#     number of places a credential is written to disk.
#
# Steps also give "smoke never runs after a failed seed" for free: a step without
# `if:` does not run once an earlier step has failed. Nothing enforces that
# ordering except the absence of `if: always()`, which is why every `if:` in this
# file is deliberate and worth a second look in review.
#
# ── WHAT THIS DELIBERATELY DOES NOT DO ──────────────────────────────────────
#
# Scope is exactly the three acceptance criteria. Everything below is a known gap
# with a follow-up issue, NOT an oversight:
#
#   * No alerting. The red X is the whole notification story.
#   * No rollback, and no `--atomic`. A failed upgrade is LEFT failed so the next
#     person to look has the evidence (see the deploy stage).
#   * No infrastructure bootstrap. Datastores, the shared Envoy Gateway,
#     cert-manager and the realm ConfigMap the bundled IdP is configured from
#     are somebody else's lifecycle; this workflow installs the application
#     chart and nothing beneath it. One thing that used to be on that list has
#     moved: the two edge HTTPRoutes are rendered BY the chart, from this
#     environment's `gateway.route` and `keycloak.route`, so the release owns
#     them. What stays external is the Gateway they attach to.
#   * No exact-value assertions on seeded data. The smoke proves shape and
#     non-emptiness. Reading a number off a running stand and asserting it back
#     is a test of nothing.
#   * No second environment. `ENV=test-stand` is hardcoded; a second stand gets a
#     second gitops environment and an input, not a copy of this file.
#
# ── EVERY LINE THIS PRINTS IS PUBLIC ────────────────────────────────────────
#
# This repository is public, so run logs are public, forever, to everyone. The
# rules that follow from that are not negotiable and are enforced structurally
# rather than by care:
#
#   * All cluster and seeder output goes through
#     .github/workflows/scripts/redact-stand-log.py before it reaches the
#     console. The raw copy stays in $RUNNER_TEMP.
#   * Failure diagnostics are an allowlist —
#     .github/workflows/scripts/stand-diagnostics.sh — not "dump everything and
#     hope". No `kubectl describe`, no `-o yaml`, no environment dumps, no
#     artifact uploads.
#   * Every credential arrives from the `insight-test-stand` GitHub environment.
#     Nothing about the stand's identity, addresses or accounts is committed here.
#
# ── WHY THE HELM CALL IS SPELLED OUT AND NOT `make deploy` ──────────────────
#
# Reusing `deploy/gitops`'s own entry point was the first design and it is the
# wrong one FOR THIS STAND. `make deploy` → `deploy-insight` depends on
# `apply-app-secrets`, which:
#
#   * hard-requires at least one *-sealedsecret.yaml under
#     environments/<ENV>/sealed-secrets/insight/ and `kubectl apply`s it. This
#     cluster runs no sealed-secrets controller and has no SealedSecret CRD, and
#     the target has no skip switch;
#   * then runs compose-app-secrets.sh, which overwrites the three chart-owned
#     *-config Secrets and reads the OIDC client secret from a key name this
#     stand's Secret does not use — writing a BLANK client secret and breaking
#     every login while the release still reports `deployed`.
#
# and `deploy-insight` additionally hardcodes `--atomic` after
# $(HELM_UPGRADE_FLAGS), so no existing variable can turn it off (a later
# `--atomic` re-sets what an earlier `--atomic=false` cleared) — which would roll
# a failed upgrade back and destroy the evidence this stand exists to produce.
#
# So the deploy stage runs the invocation written down in
# deploy/gitops/environments/test-stand/README.md, step by step. That README is
# the authority for what this stage does and why `make deploy` is not it — the
# sealed-secrets prerequisite alone makes that target unable to run against this
# stand at all, with or without an `--atomic` knob. `make diff`, `make status`
# and `make rollback` do still work for this environment and are the right tools
# for their jobs.
#
# "CI and humans run the same code path" is therefore kept by that README rather
# than by a second executable. A rehearsal harness that ran these commands from a
# laptop and diffed itself against this file was built and then dropped: it was
# a third copy of the invocation to keep in step, and it drifted from this file
# within a day of being written. The README is the one copy; when a command here
# changes, change it there.
#
# ── PRECONDITIONS THIS WORKFLOW ASSERTS RATHER THAN ASSUMES ─────────────────
#
# Each is checked with a named error rather than left to fail obscurely:
#
#   1. `deploy/gitops/environments/test-stand/` exists and its `kubeContext`
#      matches the kubeconfig in the environment secret. That comparison is the
#      mechanical guard that a deploy cannot land on a cluster nobody meant to
#      touch — the credential alone is not a guarantee, because a credential is
#      whatever someone last pasted into the settings page.
#   2. The in-cluster Secret `insight-oidc` carries a non-empty `client-secret`.
#      The committed values file leaves `authenticator.oidc.clientSecret` empty
#      because this repository is public, and the chart writes whatever it is
#      given straight into the authenticator's config. An upgrade without that
#      value produces a confidential OIDC client with a blank secret: pods Ready,
#      release `deployed`, every login broken.
#   3. The stand's IdP can complete the login the smoke stage attempts. This
#      stand's realm is `insight` — the roster realm generated from the demo
#      seed's own organisation, carrying a local password user per seeded
#      person — so a scripted username+password login is the supported path
#      here and the smoke's `password` mode is the one that fits. What the
#      precondition still buys is the half nobody expects: AUTHENTICATING IS
#      NOT RESOLVING. The callback looks the signed-in principal up in
#      `identity.persons` by the id the seeder wrote, and fails closed when
#      there is no match, so a deployed-but-unseeded stand signs a persona in
#      and then denies them. That is why the smoke stage runs after the seed
#      and never instead of it, and why the suite fails — loudly, naming the
#      step it got stuck at — rather than pretending. See
#      tests/stand/smoke/README.md.
#
# ── COST ────────────────────────────────────────────────────────────────────
#
# This runs INSIDE the caller's workflow run, so a merge's image build and this
# deploy share one `build-images-refs/heads/main` concurrency slot. The next
# merge's build queues behind this run's stand work. That is a deliberate trade:
# coalescing deploys (`cancel-in-progress: false`) never kills a running upgrade,
# and an upgrade killed halfway leaves a release in `pending-upgrade`, which is
# the one state neither this workflow nor a human can diagnose from a log.

on:
  # The normal path: build-images.yml calls this as its final job, once the
  # chart is published. See .cf-studio/.plans/test-stand-ci/build-images-hook.patch.md
  # for the calling block and the reasoning behind its guards.
  workflow_call:
    inputs:
      chart_version:
        description: >-
          Exact umbrella chart version to install, as published to oci://ghcr.io/constructorfabric/charts/insight — e.g. 0.5.101. Comes from publish-chart's output, never from deploy/gitops/.insight-version: that file is only committed at the END of publish-chart, so a checkout of the trigger SHA reads the PREVIOUS release.
        required: true
        type: string
      stages:
        description: >-
          Which stages to run, as a prefix of deploy -> seed -> smoke: `all`, `deploy+seed`, or `deploy`. The caller has no reason to pass anything but the default; it exists on this trigger only so the value has one definition rather than two. A partial run is never a pass — the summary and the run title both say which stages were skipped.
        required: false
        default: all
        type: string
  # The human path: redeploy a specific version by hand, e.g. after fixing the
  # stand by hand and wanting CI's view of it back. Same input, same code path —
  # there is no manual-only branch anywhere below.
  workflow_dispatch:
    inputs:
      chart_version:
        description: "Umbrella chart version to install (e.g. 0.5.101). Leave empty to take the newest one published from main."
        required: false
        default: ""
        type: string
      stages:
        description: "Stages to run. A prefix only: you cannot smoke without seeding, or seed without deploying."
        required: false
        default: all
        type: choice
        options:
          - all
          - deploy+seed
          - deploy
      seed_force:
        description: "Seed a tenant that already holds person rows the seeder did not write. Overrides a guard — read its refusal first."
        required: false
        default: false
        type: boolean

# One stand, one deploy at a time. `cancel-in-progress: false` because the thing
# being cancelled would be a `helm upgrade` mid-flight: killing it leaves the
# release in `pending-upgrade`, which blocks the next upgrade until a human
# intervenes. Waiting is cheap; an interrupted upgrade is not.
#
# The group lives HERE, in the called workflow, so what it serialises is the
# deploy work inside each caller run. A burst of merges therefore deploys in
# order, each run installing the chart its own run published, rather than two
# upgrades racing on one release. If that ever needs to become "newest wins,
# drop the rest", the change is a group on the calling job AND removing this one
# — never both, see the note below.
#
# NOTE for the caller: do NOT also put `concurrency:` with this group on the job
# that `uses:` this workflow. The calling job would hold the group while the
# called workflow's job waits for it, and the run would sit there until it timed
# out.
concurrency:
  group: test-stand-deploy
  cancel-in-progress: false

# Narrower than the caller's. This workflow reads the repository and talks to a
# cluster; it publishes nothing, writes nothing back to git, and needs no
# registry token — the umbrella chart is pullable anonymously from GHCR, which
# was verified rather than assumed.
permissions:
  contents: read

jobs:
  test-stand:
    name: deploy → seed → smoke
    runs-on: ubuntu-latest
    # The environment is declared HERE and not on the calling job: `environment:`
    # is not a legal key on a job that `uses:` a reusable workflow. Its
    # deployment-branch policy (main only) still evaluates against the caller's
    # ref, so restricting the environment to main restricts this whole path to
    # main — including a manual dispatch from a topic branch, which is refused
    # again below with a readable message.
    environment: insight-test-stand
    # The ceiling, not the expectation. Sum of the stage budgets plus room for a
    # cold runner: deploy 14 + seed 65 + smoke 5 + toolchain and preflight.
    timeout-minutes: 95
    env:
      # The gitops environment this deploys. One stand, one name; a second stand
      # gets its own directory and an input, not a fork of this file.
      #
      # The two paths are spelled out in full rather than composed from
      # ENV_NAME. Composing them would read fine and cost the thing that matters
      # most in a file nobody runs locally: a reader would have to resolve a
      # variable to learn which file the upgrade actually passes to helm.
      ENV_NAME: test-stand
      VALUES_FILE: deploy/gitops/environments/test-stand/values.yaml
      INVENTORY_FILE: deploy/gitops/environments/test-stand/inventory.yaml
      CHART_REF: oci://ghcr.io/constructorfabric/charts/insight
      STAND_NAMESPACE: insight
      STAND_RELEASE: insight
      SMOKE_SUITE: tests/stand/smoke
      # The three deployments whose configuration arrives through `envFrom` and
      # is therefore read exactly once, at container start. See stage 1's restart
      # step for why a list of two would be a silent bug.
      RESTART_TARGETS: deploy/insight-authenticator deploy/insight-analytics deploy/insight-identity-resolution
      # The two edge routes the chart renders from this environment's
      # `gateway.route` and `keycloak.route`. The release owns them, so the
      # upgrade below is what writes them; what the check after it asks is
      # whether the Gateway ACCEPTED them, which helm does not wait for. Every
      # acceptance criterion travels through both.
      ROUTE_NAMES: insight-gateway insight-keycloak
      # The REQUESTED version, which on a dispatch may be empty. The resolver
      # step below exports what is ACTUALLY installed as CHART_VERSION into
      # $GITHUB_ENV, so every later step reads a plain shell variable and no
      # GitHub expression is interpolated into a shell body — the same rule the
      # ref/semver guard is written to.
      REQUESTED_CHART_VERSION: ${{ inputs.chart_version }}
      REDACT: .github/workflows/scripts/redact-stand-log.py

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # don't leave the token in .git/config

      # ── Guards ────────────────────────────────────────────────────────────
      # Everything that can be refused without touching the cluster is refused
      # here, in order of how cheap it is to check. A deploy that fails after
      # `helm upgrade` has started costs a stand; one that fails now costs
      # nothing.
      # ── Which chart version ────────────────────────────────────────────────
      # A `workflow_call` always names one: it is publish-chart's output, the
      # version that run just pushed, and guessing there would install something
      # other than what was published. A `workflow_dispatch` may leave it empty,
      # which means "whatever is newest in the registry" — the common case for a
      # human redeploying the current stand, and one nobody should have to look
      # up.
      #
      # Resolved from the REGISTRY, and this is the second attempt. The first read
      # `deploy/gitops/.insight-version` from `main` of $GITHUB_REPOSITORY, which
      # is correct in the upstream repository and quietly wrong anywhere else: run
      # from a fork whose `main` is a stale mirror, it resolved 0.4.8 against a
      # stand running 0.5.x. Reading it from the checkout has the same shape of
      # bug, one branch instead of one fork. The registry has no such failure mode
      # — it is the thing the input actually refers to ("must already be
      # published") and it is the same answer whoever asks.
      #
      # `?n=1000` because the default page is 100 and the registry does not order
      # tags: taking a maximum from page one is exactly how you deploy 0.2.14 to
      # a stand on 0.5.x. The `Link: rel="next"` header is followed anyway, so a
      # repository that outgrows one page keeps working. Only strict `X.Y.Z` tags
      # are considered, compared as integer tuples rather than as strings.
      #
      # No credential: GHCR issues an anonymous pull token for a public package,
      # and the chart repository is derived from CHART_REF so a fork resolves the
      # same upstream chart it deploys.
      #
      # A release branch publishes on its own PATCH stream, so in principle its
      # newest tag could out-sort main's. It cannot in practice: main's MINOR is
      # bumped as soon as a release branch is cut, which is what keeps the two
      # streams from colliding. If that ever changes, pass the version explicitly.
      - name: Resolve the chart version
        id: chart
        run: |
          set -euo pipefail
          version="$REQUESTED_CHART_VERSION"
          origin="the caller"

          if [ -z "$version" ]; then
            if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
              echo "::error::chart_version is empty on a $GITHUB_EVENT_NAME. Only a dispatch may omit it;"
              echo "a workflow_call must pass publish-chart's output, or the deploy installs"
              echo "something other than the chart that run published."
              exit 1
            fi
            version="$(python3 .github/workflows/scripts/latest-chart-version.py "$CHART_REF")"
            origin="the registry"
            [ -n "$version" ] || { echo "::error::could not resolve a version from $CHART_REF."; exit 1; }
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "CHART_VERSION=$version" >> "$GITHUB_ENV"
          echo "chart version: $version (from $origin)"

      - name: Refuse anything that is not main, and anything that is not a version
        env:
          # Through the environment rather than interpolated into the script
          # body: `chart_version` is a free-text `workflow_dispatch` input, and a
          # string spliced into a shell line is a script-injection sink. It is
          # also passed to `make` further down, which is the reason the shape
          # check below is a refusal and not a warning.
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Absolute for workflow_call, advisory for workflow_dispatch, and the
          # asymmetry is deliberate. A CALL comes from build-images.yml after a
          # publish, and a publish only happens on main: a call carrying any
          # other ref means the caller's guard has broken, which is a bug rather
          # than a request. A DISPATCH is a person with write access asking for a
          # specific version on purpose — typically to rehearse this workflow on
          # the branch that changes it, which cannot be done from main by
          # definition. What actually decides whether a dispatch may touch the
          # stand is the environment's deployment-branch policy, which is
          # enforced by GitHub before this job starts and cannot be talked out of
          # by anything written here. So dispatch reports the ref and continues.
          if [ "$REF_NAME" != "main" ]; then
            if [ "$EVENT" = "workflow_dispatch" ]; then
              echo "::warning::dispatched from '$REF_NAME', not main. Allowed because the" \
                   "insight-test-stand environment's deployment-branch policy already" \
                   "decided this ref may deploy — but what lands on the stand is that" \
                   "branch's idea of the deploy, not main's."
            else
              echo "::error::this workflow deploys main and only main (ref was '$REF_NAME', event '$EVENT')."
              echo "A workflow_call arrives from build-images.yml after a publish, which only"
              echo "happens on main, so a call from anywhere else means the caller's guard broke."
              exit 1
            fi
          fi
          if ! printf '%s' "$CHART_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::chart_version '$CHART_VERSION' is not a semver. Refusing to pass it to make."
            exit 1
          fi
          echo "deploying umbrella chart $CHART_VERSION to ENV=$ENV_NAME"

      # ── Which stages run ──────────────────────────────────────────────────
      # `stages` is a PREFIX of deploy -> seed -> smoke, never a set. You cannot
      # smoke without seeding or seed without deploying, because each stage is
      # the previous one's precondition: the smoke reads personas the seed
      # writes, and the seed reads coordinates the deploy settles. Offering the
      # stages as independent checkboxes would let someone smoke yesterday's data
      # against today's chart and call it a pass.
      #
      # A partial run is a REHEARSAL, not a green light, and this workflow says
      # so in three places rather than trusting anyone to remember: a warning
      # annotation here, the per-stage lines in the summary, and the skipped
      # steps in the UI. The reason it exists at all is that the smoke needs a
      # credential the deploy does not, so "does this chart install and seed on
      # this stand" is a question worth being able to answer on its own.
      - name: Resolve which stages run
        id: stages
        env:
          STAGES: ${{ inputs.stages }}
        run: |
          set -euo pipefail
          case "${STAGES:-all}" in
            all)          deploy=true seed=true  smoke=true  ;;
            deploy+seed)  deploy=true seed=true  smoke=false ;;
            deploy)       deploy=true seed=false smoke=false ;;
            *)
              echo "::error::stages '$STAGES' is not one of: all, deploy+seed, deploy"
              exit 1 ;;
          esac
          {
            echo "run_deploy=$deploy"
            echo "run_seed=$seed"
            echo "run_smoke=$smoke"
          } >> "$GITHUB_OUTPUT"
          echo "stages: ${STAGES:-all}  (deploy=$deploy seed=$seed smoke=$smoke)"
          if [ "$smoke" != "true" ]; then
            echo "::warning::partial run — stages='${STAGES:-all}'. The smoke gate did NOT run," \
                 "so this run says the chart installs, not that the stand works."
          fi

      - name: Confirm the environment is wired up
        env:
          # Presence only. Values are never printed; GitHub masks the secrets
          # anyway, but a workflow that relies on masking to keep a secret out of
          # a log is one `base64` away from not doing so.
          #
          # The names are the ones in
          # docs/components/deployment/specs/sop/credentials-runbook.md — that
          # runbook is how they get set, and a rename has to happen in both.
          HAVE_KUBECONFIG: ${{ secrets.TEST_STAND_KUBECONFIG != '' }}
          # Read, but NOT required — and the difference is the whole point of
          # this entry. The dev-lead address used to be handed to the seeder from
          # here, which made this environment a second place the roster was
          # written down; the realm the deploy stage applies was the first. Two
          # writers, one value, and they drifted: the realm named one person, the
          # secret named another, both halves looked healthy, and the login the
          # smoke gate performs resolved to nobody.
          #
          # seed-stand.sh now reads the address out of the realm ConfigMap the
          # stand actually applied, so the realm is the single writer and the
          # seeded rows follow it. This secret survives only as an override for a
          # stand whose realm is provisioned some other way, and the preflight
          # below therefore reports what it MEANS rather than demanding it: a
          # required secret nothing needs is a required opportunity to be wrong.
          HAVE_SEED_EMAIL: ${{ secrets.TEST_STAND_SEED_EMAIL != '' }}
          HAVE_PERSONA_PASSWORD: ${{ secrets.TEST_STAND_PERSONA_PASSWORD != '' }}
          HAVE_BOOTSTRAP_EMAIL: ${{ secrets.TEST_STAND_BOOTSTRAP_EMAIL != '' }}
          HAVE_BOOTSTRAP_PASSWORD: ${{ secrets.TEST_STAND_BOOTSTRAP_PASSWORD != '' }}
          HAVE_BASE_URL: ${{ vars.TEST_STAND_BASE_URL != '' }}
          # `password` (every persona authenticates as themselves) or `override`
          # (one principal authenticates and every persona session is minted from
          # it). Unset means the suite's own default, which is `password`.
          #
          # `password` is the mode THIS stand serves. Its realm carries a local
          # password user per seeded person, so each persona signs in as itself
          # and a green run is evidence of a login rather than of an
          # impersonation. `override` is for a stand whose realm federates to an
          # external provider and therefore serves no password form at all: it
          # proves strictly less, and it additionally depends on the
          # authenticator's `overrideEnabled` staying on — a flag the chart's own
          # values say must be false anywhere real users log in.
          #
          # Still read from a repository variable rather than pinned in this
          # file, because which mode fits is a fact about the stand's realm and
          # not about this workflow: a stand can be redeployed into the other
          # shape without a line here changing. Setting it explicitly to
          # `password` is better than leaving it unset — an unset variable and a
          # stale `override` look identical in the settings page, and only one of
          # them quietly keeps the gate in impersonation mode.
          LOGIN_MODE: ${{ vars.TEST_STAND_SMOKE_LOGIN_MODE }}
          RUN_SMOKE: ${{ steps.stages.outputs.run_smoke }}
        run: |
          set -euo pipefail
          missing=""
          [ "$HAVE_KUBECONFIG" = "true" ] || missing="$missing secrets.TEST_STAND_KUBECONFIG"
          [ "$HAVE_BASE_URL" = "true" ]   || missing="$missing vars.TEST_STAND_BASE_URL"

          # Checked HERE rather than left to the smoke suite, which validates the
          # same thing far better than this does — but only after a deploy and a
          # seed have already run. Twenty minutes is too long to wait to be told
          # a password is missing.
          #
          # Skipped entirely when the smoke stage is not running: demanding a
          # credential for work that will not happen turns a deliberate partial
          # rehearsal into an unrunnable one, which is exactly the trap this
          # input exists to avoid. The mode string is still validated, because a
          # typo there should be caught on the run that introduces it rather than
          # on the first full run afterwards.
          if [ "$RUN_SMOKE" != "true" ]; then
            case "${LOGIN_MODE:-password}" in
              password|override) ;;
              *)
                echo "::error::vars.TEST_STAND_SMOKE_LOGIN_MODE is '$LOGIN_MODE'; it must be 'password' or 'override'"
                exit 1 ;;
            esac
            echo "smoke stage not selected — its credentials are not required for this run"
          else
          case "${LOGIN_MODE:-password}" in
            override)
              [ "$HAVE_BOOTSTRAP_EMAIL" = "true" ]    || missing="$missing secrets.TEST_STAND_BOOTSTRAP_EMAIL"
              [ "$HAVE_BOOTSTRAP_PASSWORD" = "true" ] || missing="$missing secrets.TEST_STAND_BOOTSTRAP_PASSWORD" ;;
            password)
              [ "$HAVE_PERSONA_PASSWORD" = "true" ]   || missing="$missing secrets.TEST_STAND_PERSONA_PASSWORD" ;;
            *)
              echo "::error::vars.TEST_STAND_SMOKE_LOGIN_MODE is '$LOGIN_MODE'; it must be 'password' or 'override'"
              exit 1 ;;
          esac
          fi

          if [ -n "$missing" ]; then
            echo "::error::the insight-test-stand environment is missing:$missing"
            echo ""
            echo "What each one is (full procedure: docs/components/deployment/specs/sop/credentials-runbook.md):"
            echo "  TEST_STAND_KUBECONFIG          base64 of the kubeconfig for the namespace-scoped"
            echo "                                 'ci-deployer' ServiceAccount, as produced by"
            echo "                                 deploy/gitops/scripts/provision-ci-deployer.sh."
            echo "                                 Admin kubeconfigs stay with humans."
            echo "  TEST_STAND_PERSONA_PASSWORD    'password' mode — the mode this stand's realm"
            echo "                                 serves: the credential every persona signs in"
            echo "                                 with. The runbook says where its value comes from."
            echo "  TEST_STAND_BOOTSTRAP_EMAIL     'override' mode, for a stand whose realm serves no"
            echo "  TEST_STAND_BOOTSTRAP_PASSWORD  password form at all: the one principal that really"
            echo "                                 authenticates; persona sessions are minted from it."
            echo "                                 Not needed here while the mode is 'password'."
            echo "  TEST_STAND_BASE_URL            the stand's public HTTPS origin, scheme and host,"
            echo "                                 no trailing slash. A variable, not a secret: the"
            echo "                                 smoke drives it as a browser would."
            exit 1
          fi
          echo "smoke login mode: ${LOGIN_MODE:-password (suite default)}"

          # Stated on every run, not only when something is wrong, because the
          # interesting case is the quiet one: an operator who set this secret
          # believing it decides which persona gets seeded needs to see, in the
          # log, that it is now an override on top of the realm rather than the
          # source. The address itself is never echoed here — the seed stage
          # prints what it resolved, through the redactor.
          if [ "$HAVE_SEED_EMAIL" = "true" ]; then
            echo "dev-lead address: OVERRIDDEN by secrets.TEST_STAND_SEED_EMAIL."
            echo "  The seeder would otherwise read it out of the realm this deploy applies."
            echo "  An override that names anybody but the realm's dev-lead reproduces exactly"
            echo "  the drift this stopped being a required secret to prevent: unset it unless"
            echo "  this stand's realm is provisioned outside deploy/gitops."
          else
            echo "dev-lead address: discovered by seed-stand.sh from the stand's realm ConfigMap."
            echo "  Set secrets.TEST_STAND_SEED_EMAIL only to override that, for a stand whose"
            echo "  realm the seeder cannot read."
          fi

      # ── Toolchain ─────────────────────────────────────────────────────────
      # All of it before anything touches the cluster: a broken lockfile or a
      # missing binary should not be discovered after an upgrade has landed.
      # Every pin is one this repository already uses elsewhere.
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          # Same pin as publish-chart, so the chart is installed by the version
          # of helm that packaged it. Also sidesteps the helm 4.2.1 `--wait`
          # regression that deploy/gitops/scripts/doctor.sh refuses.
          version: '3.14.0'

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          cache-suffix: test-stand-smoke

      - name: Check the tools this workflow and the seeder shell out to
        run: |
          set -euo pipefail
          # The inventory is read with yq; seed-stand.sh renders its Job with
          # envsubst; the release check and the diagnostics select fields with
          # jq. All three are on the GitHub-hosted image today, and all three
          # would otherwise fail somewhere much less obvious than here.
          missing=""
          for tool in helm kubectl yq jq envsubst python3; do
            command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
          done
          if [ -n "$missing" ]; then
            echo "::error::the runner image no longer carries:$missing — install it in this job"
            exit 1
          fi
          helm version --short
          kubectl version --client -o yaml | head -n 3

      - name: Resolve the smoke suite's dependencies
        run: |
          set -euo pipefail
          # --frozen: the lockfile is the contract. A run that silently resolves
          # a different dependency set is testing a different suite.
          uv sync --project tests --frozen

      # ── Cluster identity ──────────────────────────────────────────────────
      - name: Write the stand kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.TEST_STAND_KUBECONFIG }}
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/test-stand.kubeconfig"
          # umask BEFORE the file exists, chmod after: the file must never be
          # readable by another process on the runner, not even for the instant
          # between creation and chmod.
          (
            umask 077
            printf '%s' "$KUBECONFIG_B64" | tr -d '[:space:]' | base64 -d > "$target"
          )
          chmod 600 "$target"
          # Never `cat`, never `kubectl config view` without a redirect: the only
          # thing this prints is whether the file parses at all.
          if ! KUBECONFIG="$target" kubectl config view --minify >/dev/null 2>&1; then
            echo "::error::TEST_STAND_KUBECONFIG did not decode into a usable kubeconfig."
            echo "It must be base64 of a complete kubeconfig with a current-context set —"
            echo "'base64 -w0 < kubeconfig' on Linux, 'base64 < kubeconfig | tr -d \\\\n' on macOS."
            exit 1
          fi
          echo "KUBECONFIG=$target" >> "$GITHUB_ENV"

      - name: Confirm the credential points at the stand this repo describes
        run: |
          set -euo pipefail
          if [ ! -f "$INVENTORY_FILE" ]; then
            echo "::error::$INVENTORY_FILE does not exist."
            echo "The committed gitops environment is what makes this deploy reviewable:"
            echo "the cluster it targets, the namespaces, and which infrastructure is"
            echo "externally managed all live there. Add it before wiring up the deploy."
            exit 1
          fi
          expected="$(yq -r '.kubeContext // ""' "$INVENTORY_FILE")"
          actual="$(kubectl config current-context 2>/dev/null || echo "")"
          if [ -z "$expected" ]; then
            echo "::error::$INVENTORY_FILE has no kubeContext, so there is nothing to check the credential against."
            exit 1
          fi
          if [ "$expected" != "$actual" ]; then
            # Deliberately does NOT echo the context the kubeconfig actually
            # carries. This branch is exactly the case where the credential points
            # somewhere it should not, and naming that somewhere in a public log is
            # the thing the check exists to prevent.
            echo "::error::the kubeconfig's current context is not the one $INVENTORY_FILE names ('$expected')."
            echo "Either the environment secret holds the wrong cluster's credential, or the"
            echo "inventory was changed without rotating it. Both are human decisions; CI will not guess."
            exit 1
          fi
          # `get namespace <name>` rather than `cluster-info` or a workload list:
          # the CI credential is namespace-scoped and cannot do anything
          # cluster-wide, so a reachability probe that needs cluster scope would
          # reject the very credential it is meant to validate. A request for a
          # Namespace object is authorised within that namespace, which a
          # RoleBinding can satisfy.
          if ! kubectl --request-timeout=20s get namespace "$STAND_NAMESPACE" -o name >/dev/null 2>&1; then
            echo "::error::cannot read namespace '$STAND_NAMESPACE' with this credential."
            echo "Either the cluster is unreachable from a GitHub-hosted runner, or the"
            echo "ci-deployer ServiceAccount and its RoleBinding are not in place. Re-issue with"
            echo "deploy/gitops/scripts/provision-ci-deployer.sh."
            exit 1
          fi
          echo "context matches the committed inventory; namespace $STAND_NAMESPACE is reachable"

      - name: Confirm the chart this run is asked to install exists
        run: |
          set -euo pipefail
          # Read-only, no cluster, a couple of seconds — and it converts "helm
          # spent ten minutes failing to pull a chart" into an immediate,
          # specific failure. The registry is anonymous-readable, so no token is
          # needed here and the job asks for no `packages:` permission.
          if ! helm show chart "$CHART_REF" --version "$CHART_VERSION" >/dev/null 2>&1; then
            echo "::error::$CHART_REF:$CHART_VERSION is not in the registry."
            echo "publish-chart is what puts it there; if that job failed after pushing but"
            echo "before committing the version bump, re-run it rather than deploying by hand."
            exit 1
          fi
          echo "$CHART_REF:$CHART_VERSION is published"

      # ── Stage 1 of 3: deploy ──────────────────────────────────────────────
      # `timeout-minutes` is 14 against helm's own `--timeout 10m` on purpose,
      # with room for the chart pull and the render that precede it. The step
      # budget must never be the one that fires: a step timeout SIGKILLs helm and
      # leaves the release in `pending-upgrade`, while helm's own timeout leaves
      # a clean `failed` release that `helm history` explains.
      - name: 'Stage 1/3 — upgrade the release'
        timeout-minutes: 14
        run: |
          set -euo pipefail
          # The OIDC client secret is read out of the cluster at deploy time and
          # injected, because the committed values file leaves it empty — this
          # repository is public. The chart writes whatever it is given straight
          # into the authenticator's config Secret, so an upgrade without this
          # produces a confidential client with a blank secret: pods Ready,
          # release `deployed`, every login broken.
          #
          # Read from the cluster rather than held as a GitHub secret so there is
          # ONE copy of the value — the one the realm already agrees with. A
          # second copy in CI is a second thing to rotate and a second way for
          # the two to disagree.
          oidc_client_secret="$(
            kubectl -n "$STAND_NAMESPACE" get secret insight-oidc \
              -o 'jsonpath={.data.client-secret}' | base64 --decode
          )"
          if [ -z "$oidc_client_secret" ]; then
            echo "::error::Secret insight-oidc in namespace $STAND_NAMESPACE has no non-empty 'client-secret' key."
            echo "Refusing to deploy: the upgrade would succeed and leave the authenticator with a"
            echo "blank client secret, which looks healthy and fails every login."
            exit 1
          fi
          # Belt and braces. The value is never echoed below, but a masked value
          # cannot be leaked by a future edit either.
          echo "::add-mask::$oidc_client_secret"

          # Deliberately NO --atomic: a failed upgrade is LEFT failed so the pods
          # holding the reason are still there for the diagnostics step. Recovery
          # is the next merge, or a human running `make rollback ENV=test-stand`.
          #
          # Deliberately NO --create-namespace: the namespace exists, and the CI
          # credential is namespace-scoped and could not create one anyway —
          # asking would turn a working deploy into an RBAC failure.
          #
          # --timeout 10m rather than the gitops Makefile's 30m default: a deploy
          # that is going to fail should say so inside the CI budget.
          helm upgrade --install "$STAND_RELEASE" "$CHART_REF" \
            --version "$CHART_VERSION" \
            --namespace "$STAND_NAMESPACE" \
            --values "$VALUES_FILE" \
            --set-string authenticator.oidc.clientSecret="$oidc_client_secret" \
            --wait --timeout 10m \
            --history-max 10 \
            2>&1 | python3 "$REDACT"

      - name: 'Stage 1/3 — verify the release is the chart this run published'
        run: |
          set -euo pipefail
          # A release can be `deployed` and still be the wrong chart — a resumed
          # run, a hand-deploy that raced this one, an input that did not say what
          # it meant. Checked separately from the upgrade's exit status because
          # they answer different questions.
          #
          # The status flags are enumerated instead of `--all` because `--all` is
          # a Helm 3 flag that Helm 4 removed: on a runner carrying v4 it exits
          # `Error: unknown flag: --all` and this verification silently reports
          # every release as "absent". The explicit set means the same thing on
          # both majors. The intent it preserves: the interesting failures are
          # the ones the default listing hides — a `pending-upgrade` release (an
          # upgrade that was killed rather than one that failed) must be reported
          # as itself, not as "absent".
          listed="$(helm list -n "$STAND_NAMESPACE" \
            --deployed --failed --pending --uninstalling \
            --filter "^${STAND_RELEASE}\$" -o json)"
          status="$(printf '%s' "$listed" | jq -r '.[0].status // "absent"')"
          chart="$(printf '%s' "$listed" | jq -r '.[0].chart // "absent"')"
          revision="$(printf '%s' "$listed" | jq -r '.[0].revision // "?"')"
          echo "release $STAND_RELEASE: status=$status chart=$chart revision=$revision"
          if [ "$status" != "deployed" ]; then
            echo "::error::release '$STAND_RELEASE' is '$status', not 'deployed'."
            echo "It has been left in that state on purpose — see the failure diagnostics below,"
            echo "then either fix forward with another merge or roll back by hand."
            exit 1
          fi
          if [ "$chart" != "insight-$CHART_VERSION" ]; then
            echo "::error::the stand is running '$chart', not 'insight-$CHART_VERSION'."
            echo "helm reported success while installing something else — treat this as a"
            echo "problem with the chart reference or the version input, not with the stand."
            exit 1
          fi

      - name: 'Stage 1/3 — restart what the chart cannot know to restart'
        timeout-minutes: 8
        run: |
          set -euo pipefail
          # Each subchart's `checksum/config` annotation hashes its OWN ConfigMap.
          # It does not cover the umbrella-rendered insight-*-config Secrets,
          # which these pods consume with `envFrom` and therefore read exactly
          # once, at container start. So a changed datastore host, tenant or
          # client secret updates the Secret, leaves the pod spec byte-identical,
          # and never reaches a running process — a `deployed` release with
          # all-Ready pods running stale configuration.
          #
          # All three services are listed on purpose: each consumes its config
          # the same way, and a restart list of two would leave one of them
          # holding yesterday's configuration with nothing to show for it.
          # shellcheck disable=SC2086  # RESTART_TARGETS is a deliberate word list
          kubectl -n "$STAND_NAMESPACE" rollout restart $RESTART_TARGETS
          # shellcheck disable=SC2086
          kubectl -n "$STAND_NAMESPACE" rollout status --timeout=5m $RESTART_TARGETS

      - name: 'Stage 1/3 — confirm the edge still routes'
        run: |
          set -euo pipefail
          # The chart renders both of these, from this environment's
          # `gateway.route` and `keycloak.route`, so the release owns them and
          # the upgrade above is what wrote them. This step is therefore a
          # POST-CONDITION on the deploy — "did what I just write take effect" —
          # and not, as it once was, a check on an object somebody else applied.
          #
          # It still earns its place, because `helm --wait` waits on workloads
          # and not on HTTPRoute status. A route helm stored successfully can be
          # refused by the Gateway it names: a parentRef pointing at a Gateway
          # that is not there, a sectionName naming a listener that does not
          # exist, a hostname the listener will not widen to. Every one of those
          # leaves the release reporting `deployed` with all pods Ready and the
          # stand unreachable, and `Accepted=False` on the route is the only
          # place that failure is written down.
          #
          # Nothing is applied from here, and there is nothing to apply: the
          # routes arrive with the release, and the Gateway they attach to lives
          # in a namespace this credential cannot see at all.
          # shellcheck disable=SC2086  # ROUTE_NAMES is a deliberate word list
          kubectl -n "$STAND_NAMESPACE" get httproute $ROUTE_NAMES \
            -o 'custom-columns=NAME:.metadata.name,ACCEPTED:.status.parents[0].conditions[?(@.type=="Accepted")].status'
          # shellcheck disable=SC2086
          not_accepted="$(
            kubectl -n "$STAND_NAMESPACE" get httproute $ROUTE_NAMES \
              -o 'jsonpath={range .items[*]}{.metadata.name}{"="}{.status.parents[0].conditions[?(@.type=="Accepted")].status}{"\n"}{end}' \
              | grep -v '=True$' || true
          )"
          if [ -n "$not_accepted" ]; then
            echo "::error::an edge route is not Accepted:"
            printf '%s\n' "$not_accepted"
            echo "The release is 'deployed' and its pods are Ready; the stand is still unreachable,"
            echo "and the smoke below would fail at its first request with a much less useful"
            echo "message. The route came out of this deploy, so start in the values file that"
            echo "produced it — $VALUES_FILE, keys gateway.route and keycloak.route — and check the"
            echo "parentRef they name against the Gateway the cluster actually has."
            exit 1
          fi

      # ── Stage 2 of 3: seed ────────────────────────────────────────────────
      # 65 minutes is a CEILING chosen against the seed Job's own
      # activeDeadlineSeconds of 3600s, not a measurement: deliberately just
      # ABOVE it, so the pod's deadline is what fires first. A step timeout that
      # fired first would kill the log follow while leaving the Job running in
      # the cluster, and the next run would meet it half-finished.
      #
      # PENDING: replace this with a measured value once a handful of runs have
      # reported wall-clock. If the real figure is (say) 12 minutes, the Job's
      # --deadline should come down with the step budget, in one change, with the
      # measurement quoted.
      - name: 'Stage 2/3 — seed the stand'
        if: steps.stages.outputs.run_seed == 'true'
        timeout-minutes: 65
        env:
          # Empty on every normal run — see the block below. Declared anyway so
          # that a stand which genuinely needs the override does not need a
          # workflow edit to get one.
          SEED_EMAIL: ${{ secrets.TEST_STAND_SEED_EMAIL }}
          # `inputs.seed_force` is unset on a workflow_call, so this is the
          # empty string there and the branch below is never taken.
          SEED_FORCE: ${{ inputs.seed_force }}
        run: |
          set -euo pipefail
          # seed-stand.sh verbatim — no wrapper, no re-implemented Job manifest.
          # It discovers every coordinate it needs (datastore hosts, the tenant,
          # the seed image the release pins) from the cluster, which is precisely
          # why CI must not hand it any: a value CI supplied would be a value CI
          # could get wrong, and a stand seeded against the wrong tenant looks
          # seeded.
          #
          # That now includes the dev-lead address, and it is the reason this
          # step no longer passes `--email`. The realm and `identity.persons` are
          # two projections of ONE roster: the realm says who can log in, the
          # seeded rows say who those logins resolve to, and they have to
          # describe the same people or a login authenticates and then resolves
          # to nobody. While the realm was written at deploy time and the address
          # was handed to the seeder from a GitHub secret, that invariant had two
          # writers and no check between them — so they drifted, silently, and
          # the only thing that noticed was the smoke gate failing one persona's
          # login on a release that reported `deployed` with every pod Ready.
          #
          # So the realm is the source of truth and the seed follows it:
          # seed-stand.sh reads the dev-lead out of the realm ConfigMap this
          # stand applied, keyed on the roster's own dev-lead UUID. Regenerating
          # the realm now moves both projections at once, because there is only
          # one place the address is written. `secrets.TEST_STAND_SEED_EMAIL`
          # survives purely as an escape hatch for a stand whose realm the
          # seeder cannot read (it is created outside the Helm release, by a
          # bring-up this repository does not own), which is why it is appended
          # CONDITIONALLY: `--email ""` is not a fallback to discovery, it is
          # `${2:?--email needs a value}` aborting the stage on argument parsing.
          #
          # `--context` is passed even though the ambient kubeconfig already
          # points there. The script prints the context it resolved before it
          # writes anything, and a run whose target is stated rather than
          # inherited is one a reader of this log can check.
          #
          # `--days`, spelled exactly like that: the seeder rejects unknown
          # arguments, so a plausible-looking synonym fails the stage every time.
          #
          # `tee` keeps the raw stream in $RUNNER_TEMP — it is the only copy of
          # the seed manifest, which the next step reads — while only the redacted
          # form reaches this public log. `pipefail` (set above) is what makes
          # the seeder's exit status, rather than python's, the status of this
          # step; without it a failed seed would be reported as a clean run.
          # `--force` is opt-in, dispatch-only, and off by default — the input
          # does not exist on `workflow_call`, so a merge can never reach this
          # branch. What it overrides is the seeder's refusal to add demo people
          # to a tenant already holding `identity.persons` rows it did not write,
          # and that refusal is not fussiness: the silver step CLEARS the tables
          # it writes, and on a tenant carrying data from somewhere else that is
          # data loss rather than a reset. Forcing is a considered answer to a
          # refusal a human has read, which is why it is a flag on a hand-run
          # dispatch and not a value in this file.
          force_args=()
          if [ "${SEED_FORCE:-false}" = "true" ]; then
            force_args+=(--force)
            echo "::warning::seeding with --force — the seeder's foreign-person-rows guard is overridden for this run."
          fi

          # Built the same way as force_args, and for the same reason: an
          # argument that is only sometimes present has to be absent, not empty.
          # The warning is deliberately loud. Overriding here is the one thing
          # that can put the realm and the seeded roster back out of step, and it
          # will do so without any stage failing — the Job succeeds, the release
          # stays `deployed`, and the mismatch only surfaces as a persona that
          # cannot log in. The address is masked by the redactor like every other
          # one in this log, so the warning names the SECRET, not its value.
          email_args=()
          if [ -n "${SEED_EMAIL:-}" ]; then
            email_args+=(--email "$SEED_EMAIL")
            echo "::warning::seeding with an explicit --email from secrets.TEST_STAND_SEED_EMAIL — the dev-lead address is NOT being read from the realm this deploy applied. Unset that secret unless this stand's realm is provisioned outside deploy/gitops."
          fi

          kube_context="$(yq -r '.kubeContext' "$INVENTORY_FILE")"
          ./src/ingestion/tools/seed/seed-stand.sh \
            -n "$STAND_NAMESPACE" \
            --context "$kube_context" \
            "${email_args[@]}" \
            --days 730 \
            "${force_args[@]}" \
            2>&1 | tee "$RUNNER_TEMP/seed.log" | python3 "$REDACT"

      - name: 'Stage 2/3 — capture the seed manifest'
        if: steps.stages.outputs.run_seed == 'true'
        run: |
          set -euo pipefail
          # A cluster seed Job's filesystem dies with its pod, so the seeder
          # prints the manifest to stdout before writing it. That log is the only
          # record, and the smoke suite needs the document to know which personas
          # exist. Extracted here rather than uploaded anywhere: it names every
          # persona and the tenant.
          #
          # The algorithm lives in a committed script rather than in this heredoc
          # so that anyone recovering a manifest by hand — from
          # `kubectl logs job/insight-seed-all-<stamp>`, which is the only copy
          # once the pod is gone — runs the same parser this step does. Read that
          # script's header for why a naive brace scan cannot work: the manifest
          # is stdout and the seeder's log is stderr, and this log is the two
          # merged and interleaved.
          #
          # Diagnostics arrive on stderr in plain text; the `::error::` framing is
          # this caller's, which is why the script does not bake it in.
          if ! python3 .github/workflows/scripts/extract-seed-manifest.py \
                 "$RUNNER_TEMP/seed.log" "$RUNNER_TEMP/stand-manifest.json" 2> "$RUNNER_TEMP/extract.err"; then
            echo "::error::could not recover the seed manifest from the seed log"
            python3 "$REDACT" < "$RUNNER_TEMP/extract.err"
            echo "The seed stage's redacted output is immediately above — the document is in it,"
            echo "along with whatever landed inside it."
            exit 1
          fi

      - name: 'Stage 3/3 — smoke the stand through its public URL'
        if: steps.stages.outputs.run_smoke == 'true'
        timeout-minutes: 5
        env:
          # The public origin, driven exactly as a browser would drive it: real
          # DNS, real TLS, real IdP redirect. No port-forward, no in-cluster
          # address — a stand that works only from inside the cluster is a stand
          # nobody can use.
          #
          # SMOKE_BASE_URL and nothing else aims the suite: its conftest copies
          # the value into the shared stand resolution itself, so passing
          # `--base-url` as well would be a second spelling of one address.
          SMOKE_BASE_URL: ${{ vars.TEST_STAND_BASE_URL }}
          SMOKE_LOGIN_MODE: ${{ vars.TEST_STAND_SMOKE_LOGIN_MODE }}
          SMOKE_PERSONA_PASSWORD: ${{ secrets.TEST_STAND_PERSONA_PASSWORD }}
          SMOKE_BOOTSTRAP_EMAIL: ${{ secrets.TEST_STAND_BOOTSTRAP_EMAIL }}
          SMOKE_BOOTSTRAP_PASSWORD: ${{ secrets.TEST_STAND_BOOTSTRAP_PASSWORD }}
        run: |
          set -euo pipefail
          if [ ! -d "$SMOKE_SUITE" ]; then
            echo "::error::$SMOKE_SUITE does not exist."
            echo "The smoke module is what turns this workflow from a deploy into a gate."
            echo "It belongs there so it inherits tests/stand/conftest.py — the manifest, the"
            echo "persona factory, the API client — without inheriting tests/stand/api's"
            echo "scratch-row policy."
            exit 1
          fi
          # Both spellings, on purpose. INSIGHT_STAND_MANIFEST is what the shared
          # library reads; --stand-manifest is what the suite's own option reads;
          # they point at the same file, and setting only one of them makes the
          # run depend on which layer happens to resolve first.
          #
          # INSIGHT_STAND_ARTIFACT_DIR is explicit because the library computes
          # its default from its own location on disk, and a runner is not a
          # developer's checkout.
          export INSIGHT_STAND_ARTIFACT_DIR="$RUNNER_TEMP/stand-artifacts"
          mkdir -p "$INSIGHT_STAND_ARTIFACT_DIR"
          # Redacted like everything else: the suite's assertion messages quote
          # response bodies, and a response body is not a place anyone controls
          # what appears. `pipefail` (set above) keeps pytest's exit status as
          # the step's.
          # The suite path is spelled literally here, not as $SMOKE_SUITE, for
          # the same reason the values file is: a reader should not have to
          # resolve a variable to learn which tests gate a deployment.
          uv run --project tests --frozen \
            pytest tests/stand/smoke -ra --stand-manifest "$INSIGHT_STAND_MANIFEST" \
            2>&1 | python3 "$REDACT"

      # ── Diagnostics ───────────────────────────────────────────────────────
      # One step, only on failure, and everything it can print is decided by a
      # committed script rather than by this file — so widening what a red run
      # publishes is a reviewable diff and not an edit to a `run:` block.
      - name: Failure diagnostics (curated, redacted)
        if: failure()
        timeout-minutes: 6
        run: |
          set -uo pipefail
          if [ -z "${KUBECONFIG:-}" ] || [ ! -f "$KUBECONFIG" ]; then
            echo "the run failed before a cluster credential existed — nothing to collect"
            exit 0
          fi
          bash .github/workflows/scripts/stand-diagnostics.sh "$STAND_NAMESPACE" "$STAND_RELEASE"

      - name: Summarise the run
        if: always()
        env:
          OUTCOME: ${{ job.status }}
          RUN_SEED: ${{ steps.stages.outputs.run_seed }}
          RUN_SMOKE: ${{ steps.stages.outputs.run_smoke }}
          STAGES: ${{ inputs.stages }}
        run: |
          set -euo pipefail
          {
            echo "### Test stand — \`$CHART_VERSION\`"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| chart | \`insight-$CHART_VERSION\` |"
            echo "| environment | \`$ENV_NAME\` (namespace \`$STAND_NAMESPACE\`, release \`$STAND_RELEASE\`) |"
            echo "| stages | \`${STAGES:-all}\` — deploy ✓, seed $([ "$RUN_SEED" = "true" ] && echo '✓' || echo '— skipped'), smoke $([ "$RUN_SMOKE" = "true" ] && echo '✓' || echo '— skipped') |"
            echo "| outcome | **$OUTCOME** |"
            echo ""
            # A partial run that says nothing about being partial is worse than
            # no run: the next person reads a green tick and believes the stand
            # was proven. Said here as well as in the warning annotation because
            # this table is what gets screenshotted into a thread.
            if [ "$RUN_SMOKE" != "true" ]; then
              echo "> **Partial run — this is a rehearsal, not a pass.** The smoke gate did not"
              echo "> run, so nothing here claims a person can sign in or that any metric returns"
              echo "> data. It says the chart installs$([ "$RUN_SEED" = "true" ] && echo ' and the stand seeds' || echo ''), and no more."
              echo ""
            fi
            if [ "$OUTCOME" != "success" ]; then
              echo "This is an after-merge alarm, not a merge gate: the chart under test did not"
              echo "exist until the merge happened. **The author of the merge commit owns this run.**"
              echo "Fix forward if the cause is small and obvious, revert if it is not."
              echo ""
              echo "A failed \`helm upgrade\` is left in place on purpose. Recovery is the next"
              echo "merge, or a deliberate \`helm rollback\` by a human."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
