name: TruffleHog Secrets

# Secret detection (#2020). `secrets-diff` BLOCKS; the other passes report only.
#
#   secrets-diff     — pull requests, the PR's own commits only (#2025). BLOCKING.
#   secrets-history  — nightly, every ref. Baseline: 253 unverified false positives.
#   secrets-api      — nightly, GitHub API: comments, wikis, unreachable objects.
#
# Do not change without reading why:
#   - `--results=verified,unknown,unverified,filtered_unverified` — the default hides findings
#     whose verification failed, which on a public repository is still a leak.
#   - no `--filter-entropy` — it suppresses AWS access key IDs.
#   - `--exclude-detectors lob` — a Lob key is `test_` followed by 35 characters, the same shape
#     as this repository's long `test_*` function names, and Lob is not a dependency here.
#   - raw values never reach a log, summary or artifact — this repository is public.

on:
  pull_request:
    branches: [main]
  schedule:
    # Nightly sweep, 03:13 UTC — ahead of the Semgrep baseline at 03:27.
    - cron: "13 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets-diff:
    name: secrets (diff)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so --since-commit can reach the merge base.
          fetch-depth: 0
          persist-credentials: false

      - name: TruffleHog scan (commits added by this PR)
        # `pull_request.base.sha` lags main, so it pulls unrelated commits into range (#2025).
        # The merge ref's first parent is the current base tip — that is the PR's own range.
        # `--since-commit` alone only prunes what the base can reach: with fetch-depth 0 the
        # checkout carries every branch, and commits on unmerged ones are scanned too, so an
        # unrelated branch fails this PR. `--branch` confines the walk to the merge ref.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          SINCE="$(git rev-parse 'HEAD^1' 2>/dev/null || echo "$BASE_SHA")"
          HEAD_SHA="$(git rev-parse HEAD)"
          echo "Scanning ${SINCE}..HEAD"
          docker run --rm \
            -v "${{ github.workspace }}:/src:ro" \
            -e SINCE \
            trufflesecurity/trufflehog:3.96.0@sha256:aa821cf4ace8861c7d096d83818cdf7bb9719028a52d37a52eaad44086a52577 \
            git file:///src \
              --json \
              --no-update \
              --since-commit "$SINCE" \
              --branch "$HEAD_SHA" \
              --exclude-detectors lob \
              --results=verified,unknown,unverified,filtered_unverified \
            > trufflehog-findings.jsonl

      - name: Summarize (redacted)
        if: always()
        run: |
          [ -f trufflehog-findings.jsonl ] || exit 0
          python3 - trufflehog-findings.jsonl "${GITHUB_STEP_SUMMARY:-/dev/null}" <<'PY'
          import json, sys, collections
          rows, unparsable, skipped = [], 0, 0
          with open(sys.argv[1], encoding="utf-8") as fh:
              for line in fh:
                  line = line.strip()
                  if not line:
                      continue
                  try:
                      d = json.loads(line)
                  except json.JSONDecodeError:
                      # A truncated or non-JSON line must not take the whole summary down with
                      # it; it is counted and reported instead.
                      unparsable += 1
                      continue
                  if "DetectorName" not in d:
                      # Only findings carry a detector. Anything else on stdout is not a finding
                      # and must not inflate the count.
                      skipped += 1
                      continue
                  git = (d.get("SourceMetadata") or {}).get("Data", {}).get("Git", {})
                  rows.append({
                      "detector": d.get("DetectorName", "?"),
                      "verified": bool(d.get("Verified")),
                      "commit": (git.get("commit") or "")[:8],
                      "file": git.get("file") or "?",
                      "line": git.get("line") or "",
                  })
          out = open(sys.argv[2], "a", encoding="utf-8")
          w = out.write
          w("## TruffleHog — commits added by this PR\n\n")
          if unparsable or skipped:
              w(f"_{unparsable} unparsable line(s), {skipped} non-finding record(s) skipped._\n\n")
          if not rows:
              w("No secrets detected in the added commits (all result kinds enabled).\n")
              sys.exit(0)
          ver = sum(1 for r in rows if r["verified"])
          w(f"**{len(rows)}** finding(s) — {ver} live-verified, {len(rows) - ver} unverified. "
            "Values are redacted here on purpose; read them from the source commit.\n\n")
          w("| Detector | Verified | Commit | Path |\n|---|---|---|---|\n")
          for r in sorted(rows, key=lambda r: (not r["verified"], r["detector"])):
              w(f"| `{r['detector']}` | {'yes' if r['verified'] else 'no'} | `{r['commit']}` | `{r['file']}`{':' + str(r['line']) if r['line'] else ''} |\n")
          by_det = collections.Counter(r["detector"] for r in rows)
          w(f"\nBy detector: {', '.join(f'{k} x{v}' for k, v in by_det.most_common())}\n")
          w("\n**Revoke and rotate every credential listed above.** Removing the commit is not "
            "remediation — assume the value is compromised the moment it was pushed. If a finding "
            "is a detector false positive on synthetic data, say so in the PR and add a narrow, "
            "reviewed exclusion rather than widening the filter.\n")
          out.close()
          sys.exit(1)
          PY

  secrets-history:
    name: secrets (full history)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch every branch
        # The sweep covers all live branches, so a secret parked on a long-lived feature
        # branch is visible before it reaches main. Explicit authenticated URL because
        # `persist-credentials: false` leaves no credential on `origin`; Actions masks the
        # token in logs.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            '+refs/heads/*:refs/remotes/origin/*'

      - name: TruffleHog scan (all refs, all result kinds)
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${{ github.workspace }}:/src:ro" \
            trufflesecurity/trufflehog:3.96.0@sha256:aa821cf4ace8861c7d096d83818cdf7bb9719028a52d37a52eaad44086a52577 \
            git file:///src \
              --json \
              --no-update \
              --exclude-detectors lob \
              --results=verified,unknown,unverified,filtered_unverified \
            > trufflehog-findings.jsonl

      - name: Summarize (redacted) — report only
        if: always()
        # Never fails the run. A rise above the triaged baseline of 253, or any live-verified
        # finding, is the signal to act; both are visible in the table.
        run: |
          [ -f trufflehog-findings.jsonl ] || exit 0
          python3 - trufflehog-findings.jsonl "${GITHUB_STEP_SUMMARY:-/dev/null}" <<'PY'
          import json, sys, collections
          BASELINE = 253  # triaged 2026-07-28: all unverified detector false positives
          rows, unparsable, skipped = [], 0, 0
          with open(sys.argv[1], encoding="utf-8") as fh:
              for line in fh:
                  line = line.strip()
                  if not line:
                      continue
                  try:
                      d = json.loads(line)
                  except json.JSONDecodeError:
                      # A truncated or non-JSON line must not take the whole summary down with
                      # it; it is counted and reported instead.
                      unparsable += 1
                      continue
                  if "DetectorName" not in d:
                      # Only findings carry a detector. Anything else on stdout is not a finding
                      # and must not inflate the count.
                      skipped += 1
                      continue
                  git = (d.get("SourceMetadata") or {}).get("Data", {}).get("Git", {})
                  rows.append({
                      "detector": d.get("DetectorName", "?"),
                      "verified": bool(d.get("Verified")),
                      "file": git.get("file") or "?",
                  })
          out = open(sys.argv[2], "a", encoding="utf-8")
          w = out.write
          ver = sum(1 for r in rows if r["verified"])
          w("## TruffleHog — full history (report-only)\n\n")
          if unparsable or skipped:
              w(f"_{unparsable} unparsable line(s), {skipped} non-finding record(s) skipped._\n\n")
          w(f"**{len(rows)}** finding(s) over every ref — {ver} live-verified, "
            f"{len(rows) - ver} unverified. Triaged baseline: **{BASELINE}**, all unverified "
            "detector false positives.\n\n")
          if ver:
              w("> **A live-verified secret is present.** Revoke and rotate it now; rewriting "
                "history is not remediation.\n\n")
          if len(rows) > BASELINE:
              w(f"> Count is **{len(rows) - BASELINE} above** the triaged baseline — new findings "
                "entered the history. Re-triage before adjusting the baseline.\n\n")
          if rows:
              by_det = collections.Counter(r["detector"] for r in rows)
              w("| Detector | Count |\n|---|---:|\n")
              for k, v in by_det.most_common():
                  w(f"| `{k}` | {v} |\n")
              by_file = collections.Counter(r["file"] for r in rows)
              w("\n<details><summary>Top paths</summary>\n\n| Count | Path |\n|---:|---|\n")
              for k, v in by_file.most_common(20):
                  w(f"| {v} | `{k}` |\n")
              w("\n</details>\n")
          out.close()
          PY

  # The git scan above only reaches commits that some ref still points at. Two classes of leak
  # sit outside it, and only the GitHub API can see them: objects orphaned by a force push or a
  # deleted branch, which remain fetchable by SHA, and secrets pasted into pull request or issue
  # comments, where they arrive more often than in code. On this repository the API source reads
  # ~8600 chunks against the git scan's ~6900, and takes about ten seconds.
  #
  # Off pull requests because it depends on API availability and rate limits, and a transient
  # outage should not colour a pull request at all.
  secrets-api:
    name: secrets (GitHub API)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: TruffleHog scan (GitHub API — comments, wikis, unreachable objects)
        # Deliberately unauthenticated. `GITHUB_TOKEN` cannot be used here: the GitHub source
        # calls `GET /user` to identify the token owner, and an installation token gets
        # `403 Resource not accessible by integration`, which fails the whole job. This repository
        # is public, so no token is needed — measured unauthenticated: 34393 chunks in 15s.
        #
        # Known partial coverage: enumerating comments stops with a 422 past ~1000 issues
        # ("Pagination with the page parameter is not supported for large datasets"). That is a
        # TruffleHog limitation and `--comments-timeframe` does not avoid it. The git-object half
        # is unaffected, and that is where the value sits — it reaches commits no ref points at,
        # which a refs-based scan cannot see at all. TruffleHog still exits 0, so the run stays
        # green with the error visible in the log.
        run: |
          set -euo pipefail
          docker run --rm \
            trufflesecurity/trufflehog:3.96.0@sha256:aa821cf4ace8861c7d096d83818cdf7bb9719028a52d37a52eaad44086a52577 \
            github \
              --repo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              --issue-comments \
              --pr-comments \
              --include-wikis \
              --json \
              --no-update \
              --exclude-detectors lob \
              --results=verified,unknown,unverified,filtered_unverified \
            > trufflehog-api-findings.jsonl

      - name: Summarize (redacted) — report only
        if: always()
        run: |
          [ -f trufflehog-api-findings.jsonl ] || exit 0
          python3 - trufflehog-api-findings.jsonl "${GITHUB_STEP_SUMMARY:-/dev/null}" <<'PY'
          import json, sys, collections
          rows, unparsable, skipped = [], 0, 0
          with open(sys.argv[1], encoding="utf-8") as fh:
              for line in fh:
                  line = line.strip()
                  if not line:
                      continue
                  try:
                      d = json.loads(line)
                  except json.JSONDecodeError:
                      # A truncated or non-JSON line must not take the whole summary down with
                      # it; it is counted and reported instead.
                      unparsable += 1
                      continue
                  if "DetectorName" not in d:
                      # Only findings carry a detector. Anything else on stdout is not a finding
                      # and must not inflate the count.
                      skipped += 1
                      continue
                  meta = (d.get("SourceMetadata") or {}).get("Data", {})
                  # The GitHub source reports under Github for commits and comments alike.
                  loc = meta.get("Github") or meta.get("Git") or {}
                  rows.append({
                      "detector": d.get("DetectorName", "?"),
                      "verified": bool(d.get("Verified")),
                      # A comment hit carries a link instead of a path.
                      "where": loc.get("file") or loc.get("link") or "?",
                  })
          out = open(sys.argv[2], "a", encoding="utf-8")
          w = out.write
          w("## TruffleHog — GitHub API source (report-only)\n\n")
          if unparsable or skipped:
              w(f"_{unparsable} unparsable line(s), {skipped} non-finding record(s) skipped._\n\n")
          if not rows:
              w("No secrets detected in commits, pull request and issue comments, or wikis "
                "(all result kinds enabled).\n")
              sys.exit(0)
          ver = sum(1 for r in rows if r["verified"])
          w(f"**{len(rows)}** finding(s) — {ver} live-verified, {len(rows) - ver} unverified. "
            "Values are redacted; open the linked location to read them.\n\n")
          w("| Detector | Verified | Where |\n|---|---|---|\n")
          for r in sorted(rows, key=lambda r: (not r["verified"], r["detector"])):
              w(f"| `{r['detector']}` | {'yes' if r['verified'] else 'no'} | `{r['where']}` |\n")
          by_det = collections.Counter(r["detector"] for r in rows)
          w(f"\nBy detector: {', '.join(f'{k} x{v}' for k, v in by_det.most_common())}\n")
          w("\nA hit here that the git scan did not report means the value lives outside the "
            "current refs — an orphaned commit or a comment. **Rotate it; deleting the comment "
            "does not.**\n")
          out.close()
          PY
