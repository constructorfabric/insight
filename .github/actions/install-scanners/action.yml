name: Install scanners
description: >-
  Put the pinned scanner binaries on PATH, each checked against the sha256 its
  own release publishes. This replaces `docker run` of the vendors' Docker Hub
  images: every job on the self-hosted pool leaves through one outbound IP and
  so shares one anonymous pull quota, and an ephemeral runner pulls again from
  scratch each time.

inputs:
  trivy:
    description: Install Trivy.
    default: "false"
  trufflehog:
    description: Install TruffleHog.
    default: "false"

runs:
  using: composite
  steps:
    - shell: bash
      env:
        # INVARIANT: version and digest are one pin — bump both together, taking the
        # digest from the line for this asset in the release's own checksums.txt.
        # Dependabot cannot see these (see .github/dependabot.yml).
        TRIVY_VERSION: 0.72.0
        TRIVY_SHA256: bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea
        TRUFFLEHOG_VERSION: 3.96.0
        TRUFFLEHOG_SHA256: 7105f1cd6577f058a9e39d0578f1a99c8a1e481e4d3512cd8a09acfe22a0fdc0
        WANT_TRIVY: ${{ inputs.trivy }}
        WANT_TRUFFLEHOG: ${{ inputs.trufflehog }}
      run: |
        set -euo pipefail

        # Under RUNNER_TEMP and never /usr/local/bin: an ARC runner pod has no sudo,
        # and a shared machine must not carry a tool one job installed into the next.
        bin="${RUNNER_TEMP}/scanner-bin"
        mkdir -p "$bin"

        # Both archives unpack flat, with the binary beside a LICENSE and docs, so
        # each one is extracted into its own directory rather than straight into $bin.
        install_release() {
          local name="$1" url="$2" want="$3" work
          work="$(mktemp -d)"
          curl -fsSL --retry 3 --retry-delay 2 -o "$work/release.tar.gz" "$url"
          printf '%s  %s\n' "$want" "$work/release.tar.gz" | sha256sum -c -
          tar -xzf "$work/release.tar.gz" -C "$work" "$name"
          install -m 0755 "$work/$name" "$bin/$name"
          rm -rf "$work"
          "$bin/$name" --version
        }

        # The two projects name their assets differently — Trivy `Linux-64bit`,
        # TruffleHog `linux_amd64` — so neither URL is derivable from the other.
        if [ "$WANT_TRIVY" = "true" ]; then
          install_release trivy \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            "$TRIVY_SHA256"
        fi

        if [ "$WANT_TRUFFLEHOG" = "true" ]; then
          install_release trufflehog \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz" \
            "$TRUFFLEHOG_SHA256"
        fi

        echo "$bin" >> "$GITHUB_PATH"
