name: Install scanners
description: >-
  Put the pinned scanner binaries on PATH, each checked against the sha256 its
  own release publishes. This replaces `docker run` of the vendors' Docker Hub
  images: every job on the self-hosted runners leaves through one outbound IP and
  so shares one anonymous pull quota, and an ephemeral runner pulls again from
  scratch each time.

inputs:
  trivy:
    description: Install Trivy.
    default: "false"
  trufflehog:
    description: Install TruffleHog.
    default: "false"

runs:
  using: composite
  steps:
    - name: Resolve Trivy archive key
      id: trivy-pin
      if: inputs.trivy == 'true'
      shell: bash
      env:
        # INVARIANT: version and digest are one pin — bump both together, taking the
        # digest from the line for this asset in the release's own checksums.txt.
        # Dependabot cannot see these (see .github/dependabot.yml).
        TRIVY_VERSION: 0.76.2
        TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
      run: |
        set -euo pipefail
        echo "version=${TRIVY_VERSION}" >> "$GITHUB_OUTPUT"
        echo "sha=${TRIVY_SHA256}" >> "$GITHUB_OUTPUT"
        echo "key=trivy-archive-v1-${TRIVY_VERSION}-${TRIVY_SHA256}" >> "$GITHUB_OUTPUT"

    - name: Restore Trivy archive
      id: trivy-archive
      if: inputs.trivy == 'true'
      continue-on-error: true
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/trivy-archive
        key: ${{ steps.trivy-pin.outputs.key }}

    - shell: bash
      env:
        TRIVY_VERSION: ${{ steps.trivy-pin.outputs.version }}
        TRIVY_SHA256: ${{ steps.trivy-pin.outputs.sha }}
        # INVARIANT: version and digest are one pin — bump both together, taking the
        # digest from the line for this asset in the release's own checksums.txt.
        TRUFFLEHOG_VERSION: 3.96.0
        TRUFFLEHOG_SHA256: 7105f1cd6577f058a9e39d0578f1a99c8a1e481e4d3512cd8a09acfe22a0fdc0
        WANT_TRIVY: ${{ inputs.trivy }}
        WANT_TRUFFLEHOG: ${{ inputs.trufflehog }}
      run: |
        set -euo pipefail

        # Under RUNNER_TEMP and never /usr/local/bin: an ARC runner pod has no sudo,
        # and a shared machine must not carry a tool one job installed into the next.
        bin="${RUNNER_TEMP}/scanner-bin"
        mkdir -p "$bin"

        # Both archives unpack flat, with the binary beside a LICENSE and docs, so
        # each one is extracted into its own directory rather than straight into $bin.
        install_release() {
          local name="$1" url="$2" want="$3" work
          work="$(mktemp -d)"
          curl -fsSL --retry 3 --retry-delay 2 -o "$work/release.tar.gz" "$url"
          printf '%s  %s\n' "$want" "$work/release.tar.gz" | sha256sum -c -
          tar -xzf "$work/release.tar.gz" -C "$work" "$name"
          install -m 0755 "$work/$name" "$bin/$name"
          rm -rf "$work"
          "$bin/$name" --version
        }

        # INVARIANT: the digest is checked before extract on a cache hit and a download.
        # A miss or a mismatch still downloads. A failed download or checksum stops the job.
        install_trivy() {
          local url="$1" want="$2" archive work
          archive="${RUNNER_TEMP}/trivy-archive/trivy.tar.gz"
          mkdir -p "$(dirname "$archive")"
          if [ -f "$archive" ] && printf '%s  %s\n' "$want" "$archive" | sha256sum -c -; then
            echo "using cached trivy archive"
          else
            rm -f "$archive"
            curl -fsSL --retry 3 --retry-delay 2 -o "$archive" "$url"
            printf '%s  %s\n' "$want" "$archive" | sha256sum -c -
          fi
          work="$(mktemp -d)"
          tar -xzf "$archive" -C "$work" trivy
          install -m 0755 "$work/trivy" "$bin/trivy"
          rm -rf "$work"
          "$bin/trivy" --version
        }

        # The two projects name their assets differently — Trivy `Linux-64bit`,
        # TruffleHog `linux_amd64` — so neither URL is derivable from the other.
        if [ "$WANT_TRIVY" = "true" ]; then
          install_trivy \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            "$TRIVY_SHA256"
        fi

        if [ "$WANT_TRUFFLEHOG" = "true" ]; then
          install_release trufflehog \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz" \
            "$TRUFFLEHOG_SHA256"
        fi

        echo "$bin" >> "$GITHUB_PATH"

    - name: Save Trivy archive
      if: success() && inputs.trivy == 'true' && steps.trivy-archive.outcome == 'success' && steps.trivy-archive.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/trivy-archive
        key: ${{ steps.trivy-pin.outputs.key }}
