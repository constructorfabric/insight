# Automated dependency refresh. Pinning an action to a commit digest removes the
# risk of a moving tag being repointed, but a digest never ages out on its own —
# this file is the other half of that trade.
#
# Scanner images are NOT covered: they are invoked as `docker run <image>@sha256:…`
# inside workflow shell steps rather than as `FROM` lines, which the docker
# ecosystem cannot see. They are refreshed by hand — see
# the scanner-image refresh SOP.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Review routing comes from .github/CODEOWNERS, so it follows ownership
    # rather than naming one person here.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # Base images only. A bumped base is a rebuild that can change runtime
  # behaviour, so it is grouped apart from the actions above: one red build must
  # not hold back an unrelated action bump.
  - package-ecosystem: docker
    directories: ["/src/**", "/deploy/**"]
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      base-images:
        patterns: ["*"]
    ignore:
      # dbt's dependency chain (dbt-common -> mashumaro) does not import on
      # Python 3.14 yet, and the toolbox image the seeder ships in is 3.12.
      - dependency-name: python
        versions: [">=3.14"]
      # Odd Node majors are never LTS — 25 ended 2026-06-01. Moving to 26 (LTS from
      # 2026-10-28) also moves package.json engines and .nvmrc, so it is deliberate.
      - dependency-name: node
        versions: [">=25"]

  - package-ecosystem: cargo
    directory: /src/backend
    schedule:
      interval: daily
      time: "21:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    groups:
      rust-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    # reqwest 0.13 breaks the authenticator: openidconnect 4 / oauth2 5 implement
    # their HTTP-client traits only for reqwest 0.12. Lift when a released
    # openidconnect supports reqwest 0.13.
    ignore:
      - dependency-name: reqwest
        versions: [">=0.13"]

  - package-ecosystem: pip
    directory: /src/ingestion/tools/seed
    schedule:
      interval: daily
      time: "21:30"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    groups:
      seed-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pip
    directories: ["/src/ingestion/connectors/*/*"]
    schedule:
      interval: daily
      time: "22:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    groups:
      connector-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /src/ingestion/scripts
    schedule:
      interval: daily
      time: "22:30"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    groups:
      scripts-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pip
    directories: ["/src/ingestion/tests/connectors", "/src/ingestion/tests/e2e"]
    schedule:
      interval: daily
      time: "23:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    groups:
      tests-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # CDK 7 changes the parent request the declarative engine emits, so the zoom
      # substream suites go to zero records — 42 passed on 6.60.16 against 6 failed
      # and 1 error on 7.23.8 (#2061). Moving belongs with the zoom manifest.
      - dependency-name: airbyte-cdk
        versions: [">=7"]

  # Frontend package tree. Grouped so a week's worth of bumps arrives as one
  # reviewable change rather than one pull request per package.
  - package-ecosystem: npm
    directory: /src/frontend
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # typescript-eslint caps its typescript peer at <6.1.0 up to and including
      # 8.66.0, and refuses to load past it, so TS 7 breaks the ESLint job (#2371).
      - dependency-name: typescript
        versions: [">=6.1"]
      # v3 drops `initialize` and stops applying `parameters.msw.handlers`; stories
      # have to call `context.msw.use` themselves, so the storybook setup file
      # fails to load until that is rewritten (#2430).
      - dependency-name: msw-storybook-addon
        versions: [">=3"]
      # That addon declares `peer msw ^2.0.0`, so the two come off the hold together.
      - dependency-name: msw
        versions: [">=3"]
      # The lint job runs inside mcr.microsoft.com/playwright, pinned in ci.yml
      # where this ecosystem cannot see it; both move together, by hand (#2503).
      - dependency-name: playwright
        versions: [">1.62.1"]
