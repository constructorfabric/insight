apiVersion: v1
kind: Service
metadata:
  name: {{ include "insight-analytics.fullname" . }}
  labels:
    {{- include "insight-analytics.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if or .Values.global.mcp.enabled .Values.global.sqlApi.enabled }}
    - port: {{ .Values.mcp.port }}
      targetPort: mcp
      protocol: TCP
      name: mcp
    {{- end }}
  selector:
    {{- include "insight-analytics.selectorLabels" . | nindent 4 }}
