# Authored half of the field catalog: what each dataset field may be used for.
# The other half — names, types, engine, sorting key — is `columns.snapshot.json`.
datasets:
  - key: git_commits
    database: insight
    relation: git_commits
    row_identity: [source, commit_hash]
    fields:
      tenant_id: tenant
      author_email: entity
      authored_at: event_time
      lines_added: measurable
      lines_removed: measurable
      branch_scope:
        role: dimension
        label_field: branch_scope_label
      repository:
        role: dimension
        label_field: repository_label
      project:
        role: dimension
        label_field: project_label
      source:
        role: dimension
        label_field: source_label
      commit_hash:
        display: [reference]
      message:
        display: [title]
      author_name:
        display: [actor]
      repository_label:
        display: [location]

  - key: git_file_changes
    database: insight
    relation: git_file_changes
    row_identity: [source, commit_hash, file_path, change_type]
    fields:
      tenant_id: tenant
      author_email: entity
      authored_at: event_time
      lines_added: measurable
      lines_removed: measurable
      category:
        role: dimension
        label_field: category_label
      file_extension:
        role: dimension
        label_field: file_extension_label
      change_type:
        role: dimension
        label_field: change_type_label
      branch_scope:
        role: dimension
        label_field: branch_scope_label
      repository:
        role: dimension
        label_field: repository_label
      project:
        role: dimension
        label_field: project_label
      source:
        role: dimension
        label_field: source_label
      file_path:
        display: [title]
      commit_hash:
        display: [reference]
      author_name:
        display: [actor]
      repository_label:
        display: [location]

  - key: git_pull_requests
    database: insight
    relation: git_pull_requests
    row_identity: [source_id, project_key, repo_slug, pr_id]
    fields:
      tenant_id: tenant
      author_email: entity
      created_at: event_time
      closed_at: event_time
      first_reviewed_at: event_time
      approved_at: event_time
      lines_added: measurable
      lines_removed: measurable
      files_changed: measurable
      linked_commit_count: measurable
      reviewer_count: measurable
      cycle_hours: measurable
      first_review_hours: measurable
      review_to_merge_hours: measurable
      approval_to_merge_hours: measurable
      review_wait_share: measurable
      branch_scope:
        role: dimension
        label_field: branch_scope_label
      destination_branch:
        role: dimension
        label_field: destination_branch_label
      repository:
        role: dimension
        label_field: repository_label
      project:
        role: dimension
        label_field: project_label
      source:
        role: dimension
        label_field: source_label
      pr_number:
        display: [reference]
      title:
        display: [title]
      author_name:
        display: [actor]
      repository_label:
        display: [location]

  - key: git_review_events
    database: insight
    relation: git_review_events
    row_identity: [source_id, event_key]
    fields:
      tenant_id: tenant
      entity_id: entity
      observed_at: event_time
      comment_target_value:
        role: dimension
        label_field: comment_target_label
      repository_value:
        role: dimension
        label_field: repository_label
      project_value:
        role: dimension
        label_field: project_label
      source_value:
        role: dimension
        label_field: source_label
      pr_number:
        display: [reference]
      title:
        display: [title]
      repository_label:
        display: [location]

  - key: wiki_pages
    database: insight
    relation: wiki_pages
    row_identity: [source_id, page_id]
    fields:
      tenant_id: tenant
      author_email: entity
      created_at: event_time
      title:
        display: [title]
      page_id:
        display: [reference]
      space_name:
        display: [location]

  - key: wiki_person_days
    database: insight
    relation: wiki_person_days
    row_identity: [source_id, author_email, activity_date]
    fields:
      tenant_id: tenant
      author_email: entity
      activity_date: event_time
      edits: measurable
      pages_edited: measurable
      comments_received: measurable

  - key: task_closed_issues
    database: insight
    relation: task_closed_issues
    row_identity: [insight_source_id, issue_id]
    fields:
      tenant_id: tenant
      assignee_email: entity
      closed_at: event_time
      dev_seconds: measurable
      dev_hours: measurable
      lead_seconds: measurable
      resolution_days: measurable
      pickup_days: measurable
      slip_days: measurable
      issue_type:
        role: dimension
        label_field: issue_type_label
      source:
        role: dimension
        label_field: source_label
      id_readable:
        display: [reference]
      title:
        display: [title]

  - key: task_close_events
    database: insight
    relation: task_close_events
    row_identity: [insight_source_id, issue_id, close_at]
    fields:
      tenant_id: tenant
      assignee_email: entity
      close_at: event_time
      id_readable:
        display: [reference]
      title:
        display: [title]

  - key: task_estimation_days
    database: insight
    relation: task_estimation_days
    row_identity: [tenant_id, assignee_email, closed_date]
    fields:
      tenant_id: tenant
      assignee_email: entity
      closed_date: event_time
      estimation_pct: measurable
      estimation_error_pct: measurable

  - key: task_person_days
    database: insight
    relation: task_worklog_flow
    row_identity: [tenant_id, entity_id, metric_date]
    fields:
      tenant_id: tenant
      entity_id: entity
      metric_date: event_time
      in_progress_seconds: measurable
      worklog_seconds: measurable

  - key: task_open_issues
    database: insight
    relation: task_open_issues
    row_identity: [insight_source_id, issue_id]
    fields:
      tenant_id: tenant
      assignee_email: entity
      last_status_event_at: event_time
      idle_days: measurable
      id_readable:
        display: [reference]
      title:
        display: [title]
  - key: ai_usage
    database: insight
    relation: ai_usage
    row_identity: [email, usage_date, tool, surface, seat_status]
    fields:
      tenant_id: tenant
      email: entity
      usage_date: event_time
      lines_added: measurable
      lines_removed: measurable
      tool_use_offered: measurable
      tool_use_accepted: measurable
      dev_conversations: measurable
      assistant_messages: measurable
      assistant_actions: measurable
      chat_conversations: measurable
      prs_with_assistant: measurable
      prs_total: measurable
      cost_usd: measurable
      tool:
        role: dimension
        label_field: tool_label
      surface:
        role: dimension
        label_field: surface_label
      seat_status: dimension

  - key: ai_seat_months
    database: insight
    relation: ai_seat_months
    row_identity: [source_id, account_id, period_month]
    fields:
      tenant_id: tenant
      email: entity
      period_month: event_time
      extra_usage_usd: measurable
      extra_usage_limit_usd: measurable
      seat_cost_usd: measurable
      tool:
        role: dimension
        label_field: tool_label
      seat_tier: dimension

  - key: ai_seat_days
    database: insight
    relation: ai_seat_days
    row_identity: [source_id, account_id, snapshot_date]
    fields:
      tenant_id: tenant
      email: entity
      snapshot_date: event_time
      daily_extra_usage_usd: measurable
      tool:
        role: dimension
        label_field: tool_label
      seat_tier: dimension
