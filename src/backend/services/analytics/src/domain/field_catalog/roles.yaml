# Field roles for the semantic-layer field catalog (#2208, Phase 1 slice 2).
#
# This is the AUTHORED half of the hybrid catalog: the semantic role of each
# exposed dataset field. Column TYPES are NOT authored here — they are joined in
# from `types.snapshot.json`, generated from ClickHouse `system.columns` (see the
# drift test). A field named here must exist as a column in the snapshot and its
# ClickHouse type must normalize to a known field type; the offline consistency
# test enforces both.
#
# Coverage: the source families with a clean, self-contained entity and tenant at
# the silver layer — git, ai, collab, wiki. NOT yet catalogued (deferred to the
# extraction slice, #2208 slice 5, where roles are verified against real
# measures):
#   - task (class_task_worklogs/comments carry no tenant column and key on
#     author_id, not an email — needs identity resolution and a tenant join);
#   - reference/join relations with no direct entity (class_git_repositories,
#     *_branches, git PR comment/commit/reviewer tables, class_task_statuses/
#     projects/sprints/field_metadata, class_wiki_engagement);
#   - derived populations (active-day, focus) that are not a single raw relation.
#
# Note the tenant column name is NOT uniform across families (git/collab/wiki:
# tenant_id; ai: insight_tenant_id), so it is named per dataset here.
#
# Roles: tenant | entity | event_time | dimension | value | subject
datasets:
  # ---- git ----
  - key: git_commits
    database: silver
    table: class_git_commits
    read_discipline: final
    fields:
      - {name: tenant_id, role: tenant}
      - {name: author_email, role: entity}
      - {name: date, role: event_time}
      - {name: commit_hash, role: subject}
      - {name: repo_slug, role: dimension}
      - {name: project_key, role: dimension}
      - {name: branch, role: dimension}
      - {name: data_source, role: dimension}
      - {name: is_merge_commit, role: dimension}
      - {name: lines_added, role: value}
      - {name: lines_removed, role: value}
      - {name: files_changed, role: value}
  - key: git_pull_requests
    database: silver
    table: class_git_pull_requests
    read_discipline: final
    fields:
      - {name: tenant_id, role: tenant}
      - {name: author_email, role: entity}
      - {name: created_on, role: event_time}
      - {name: closed_on, role: event_time}
      - {name: pr_id, role: subject}
      - {name: repo_slug, role: dimension}
      - {name: project_key, role: dimension}
      - {name: source_branch, role: dimension}
      - {name: destination_branch, role: dimension}
      - {name: state, role: dimension}
      - {name: data_source, role: dimension}
      - {name: files_changed, role: value}
      - {name: lines_added, role: value}
      - {name: lines_removed, role: value}
  # ---- ai (tenant column is insight_tenant_id) ----
