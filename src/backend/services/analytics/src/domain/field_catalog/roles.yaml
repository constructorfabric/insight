# Authored half of the field catalog: what each dataset field may be used for.
#
# The other half — field names, types, engine, sorting key — is
# `columns.snapshot.json`, dumped from a ClickHouse the real pipeline built and
# gated by the connectors-ddl lane. This file names datasets and roles; it never
# restates a type. A role naming a field the snapshot does not carry, or a type
# that cannot hold that role, fails the build.
#
# `key` is how a definition names the dataset; `relation` is where it lives.
datasets:
  - key: git_commits
    database: insight
    relation: git_commits
    fields:
      tenant_id: tenant
      author_email: entity
      authored_at: event_time
      lines_added: measurable
      lines_removed: measurable
      branch_scope:
        role: dimension
        label_field: branch_scope_label
      repository:
        role: dimension
        label_field: repository_label
      project:
        role: dimension
        label_field: project_label
      source:
        role: dimension
        label_field: source_label
      commit_hash:
        display: [reference]
      message:
        display: [title]
      author_name:
        display: [actor]
      repository_label:
        display: [location]

  - key: git_file_changes
    database: insight
    relation: git_file_changes
    fields:
      tenant_id: tenant
      author_email: entity
      authored_at: event_time
      lines_added: measurable
      lines_removed: measurable
      category:
        role: dimension
        label_field: category_label
      file_extension:
        role: dimension
        label_field: file_extension_label
      change_type:
        role: dimension
        label_field: change_type_label
      branch_scope:
        role: dimension
        label_field: branch_scope_label
      repository:
        role: dimension
        label_field: repository_label
      project:
        role: dimension
        label_field: project_label
      source:
        role: dimension
        label_field: source_label
      file_path:
        display: [title]
      commit_hash:
        display: [reference]
      author_name:
        display: [actor]
      repository_label:
        display: [location]

  - key: git_pull_requests
    database: silver
    relation: class_git_pull_requests
    fields:
      tenant_id: tenant
      author_email: entity
      created_on: event_time
      data_source: dimension
      repo_slug: dimension
      project_key: dimension
      pr_id:
        display: [reference]
      title:
        display: [title]
