metrics:
  - metric_key: ai.accepted_lines
    source_key: ai_usage
    subject: code
    label: AI-added lines
    short_label: AI lines +
    description: Accepted added coding output
    explanation: Accepted AI-generated added lines across coding AI tools.
    unit: lines
    format: integer
    direction: higher_is_better
    entity_type: person
    computation: sum
    peer_cohort_key: org_unit
    inputs:
      - input_role: value
        measure_key: accepted_lines
    dimensions:
      - tool
  - metric_key: ai.removed_lines
    source_key: ai_usage
    subject: code
    label: AI-removed lines
    short_label: AI lines −
    description: Accepted deleted coding output
    explanation: Accepted AI-generated removed lines across coding AI tools.
    unit: lines
    format: integer
    direction: higher_is_better
    entity_type: person
    computation: sum
    peer_cohort_key: org_unit
    inputs:
      - input_role: value
        measure_key: removed_lines
    dimensions:
      - tool
  - metric_key: ai.active_days
    source_key: ai_usage
    subject: activity
    label: AI active days
    short_label: AI days
    description: Days with any AI activity across dev and assistant tools
    explanation: Distinct days with person-attributed AI activity across dev and assistant tools.
    unit: days
    format: integer
    direction: higher_is_better
    entity_type: person
    computation: sum
    peer_cohort_key: org_unit
    inputs:
      - input_role: value
        measure_key: active_day
    dimensions: []
  - metric_key: ai.cost
    source_key: ai_usage
    subject: cost
    label: AI usage cost
    description: AI usage priced at vendor token/usage rates
    explanation: Person-attributed AI usage priced at the vendor's token or usage rates — what the consumption would cost if billed purely by usage. Includes usage a seat or subscription already covered, and excludes seat and subscription fees, so it is not the amount invoiced. Covers the tools whose connector prices usage per person. Overlaps ai.extra_usage_cost, which is the part of that same consumption the vendor actually billed on top of the seat fee — the two are served side by side and are never added, since adding them counts the billed part twice.
    format: currency
    direction: lower_is_better
    entity_type: person
    computation: sum
    peer_cohort_key: org_unit
    inputs:
      - input_role: value
        measure_key: cost_usd
    dimensions:
      - tool
  - metric_key: ai.extra_usage_cost
    source_key: ai_cost
    subject: cost
    label: AI extra usage
    short_label: Extra usage
    description: Spend above the usage included in the seat fee
    explanation: What the vendor billed a person on top of their seat fee, once the usage included in that fee was exhausted, priced at API rates. A monthly fact reported against the day the seat snapshot was last read; a window covering part of a month returns that month in full rather than a fraction. Distinct from ai.cost, which prices all consumption including what the seat fee already covered — the two are never summed. Attribution mode is direct — the vendor reports this amount per seat.
    format: currency
    direction: lower_is_better
    entity_type: person
    computation: sum
    peer_cohort_key: org_unit
    inputs:
      - input_role: value
        measure_key: extra_usage_usd
    dimensions:
      - tool
      - seat_tier
  - metric_key: ai.extra_usage_utilisation
    source_key: ai_cost
    subject: cost
    label: Extra-usage ceiling used
    short_label: Ceiling used
    description: Share of the extra-usage ceiling consumed
    explanation: Extra usage measured against the ceiling in force on the seat — the plan tier's default, or a different one set for that member. At 100 per cent the vendor stops the seat, so this reads as proximity to being blocked, not as waste — room left under a ceiling was never purchased and costs nothing. A seat with no ceiling returns no value rather than a zero, the ratio having no denominator. Above 100 per cent means the ceiling was lowered below what the seat had already spent — the vendor reports the ceiling in force now against the whole month's spend, so a limit set or reduced mid-month is read against money that predates it.
    format: percent
    direction: lower_is_better
    entity_type: person
    computation: !ratio
      scale: 100.0
    peer_cohort_key: org_unit
    inputs:
      - input_role: numerator
        measure_key: extra_usage_usd
      - input_role: denominator
        measure_key: extra_usage_limit_usd
    dimensions:
      - tool
      - seat_tier
  - metric_key: ai.accepted_edit_actions
    source_key: ai_usage
    subject: code
    label: Accepted AI edits
    short_label: AI edits
    description: Accepted tool or edit suggestions
    explanation: Accepted AI edit or tool suggestions across supported coding AI tools.
    unit: actions
    format: integer
    direction: higher_is_better
    entity_type: person
    computation: sum
    peer_cohort_key: org_unit
    inputs:
      - input_role: value
        measure_key: accepted_edit_actions
    dimensions:
      - tool
  - metric_key: ai.tool_acceptance_rate
    source_key: ai_usage
    subject: code
    tags:
      - rate
    label: AI tool acceptance
    short_label: AI accept %
    description: Accepted divided by offered AI edits
    explanation: Accepted AI edit or tool suggestions divided by offered suggestions.
    format: percent
    direction: higher_is_better
    entity_type: person
    computation: !ratio
      scale: 100.0
    peer_cohort_key: org_unit
    inputs:
      - input_role: numerator
        measure_key: accepted_edit_actions
      - input_role: denominator
        measure_key: tool_use_offered
    dimensions:
      - tool
  - metric_key: ai.assistant_messages
    source_key: ai_usage
    subject: assistant
    label: AI assistant messages
    short_label: AI msgs
    description: Assistant messages
    explanation: Person-attributed assistant messages from supported AI assistant tools.
    unit: messages
    format: integer
    direction: higher_is_better
    entity_type: person
    computation: sum
    peer_cohort_key: org_unit
    inputs:
      - input_role: value
        measure_key: assistant_messages
    dimensions:
      - tool
      - surface
  - metric_key: ai.assistant_actions
    source_key: ai_usage
    subject: assistant
    label: AI assistant actions
    short_label: AI actions
    description: Assistant actions
    explanation: Person-attributed assistant actions from supported AI assistant tools.
    unit: actions
    format: integer
    direction: higher_is_better
    entity_type: person
    computation: sum
    peer_cohort_key: org_unit
    inputs:
      - input_role: value
        measure_key: assistant_actions
    dimensions:
      - tool
      - surface
  - metric_key: ai.dev_conversations
    source_key: ai_usage
    subject: assistant
    label: AI dev conversations
    short_label: AI dev chats
    description: Coding tool conversations where the source reports them
    explanation: Person-attributed conversations with coding AI tools, counted as the vendor counts them. For the agent tools this is the session or thread count — a session is the unit of conversation there, and no vendor publishes a separate conversation counter — so the number reads as "times the person started working with the assistant", not as messages exchanged. Tools that report no such unit, inline-completion tools among them, return no value rather than a zero.
    unit: conversations
    format: integer
    direction: higher_is_better
    entity_type: person
    computation: sum
    peer_cohort_key: org_unit
    inputs:
      - input_role: value
        measure_key: dev_conversations
    dimensions:
      - tool
  - metric_key: ai.chat_assistant_conversations
    source_key: ai_usage
    subject: assistant
    label: AI chat conversations
    short_label: AI chats
    description: Chat assistant conversations
    explanation: Person-attributed chat assistant conversations from supported AI chat tools.
    unit: conversations
    format: integer
    direction: higher_is_better
    entity_type: person
    computation: sum
    peer_cohort_key: org_unit
    inputs:
      - input_role: value
        measure_key: chat_assistant_conversations
    dimensions:
      - tool
      - surface
  - metric_key: ai.prs_with_assistant
    source_key: ai_usage
    subject: pull_requests
    label: PRs with AI assistance
    short_label: PRs with AI
    description: Pull requests the coding assistant touched
    explanation: Pull requests where the coding assistant was active at least once, as the vendor attributes them. Reported only by sources that connect to the code host themselves, so a person working without that connection returns no value rather than a zero. Counts pull requests, not commits or lines, and says nothing about how much of the change the assistant wrote.
    unit: PRs
    format: integer
    direction: higher_is_better
    entity_type: person
    computation: sum
    peer_cohort_key: org_unit
    inputs:
      - input_role: value
        measure_key: prs_with_assistant
    dimensions:
      - tool
      - seat_status
  - metric_key: ai.prs_total
    source_key: ai_usage
    subject: pull_requests
    label: PRs seen by the AI vendor
    short_label: PRs seen
    description: Pull requests the AI vendor counted in the same window
    explanation: Pull requests the AI vendor observed for the person, served as the context for PRs with AI assistance rather than as a goal of its own. It is the vendor's count over the vendor's own window, which need not be the day it is reported against and need not agree with the git sources — read it next to that measure, not next to git pull-request metrics.
    unit: PRs
    format: integer
    direction: neutral
    entity_type: person
    computation: sum
    peer_cohort_key: org_unit
    inputs:
      - input_role: value
        measure_key: prs_total
    dimensions:
      - tool
      - seat_status
  - metric_key: git.commits
    source_key: git
    subject: commits
    label: Commits
    description: Authored commits
    explanation: Distinct authored commits across connected git sources, excluding merge commits.
    unit: commits
    format: integer
    direction: higher_is_better
    entity_type: person
    computation: sum
    peer_cohort_key: org_unit
    inputs:
      - input_role: value
        measure_key: commit_count
    dimensions:
      - project
      - repository
      - source
  - metric_key: git.code_lines
    source_key: git
    subject: code_changes
    label: Code lines added
    short_label: Code lines
    description: Lines added to code files
    explanation: Lines added to files classified as code — tests, configuration, and documentation excluded.
    unit: lines
    format: integer
    direction: higher_is_better
    entity_type: person
    computation: sum
    peer_cohort_key: org_unit
    inputs:
      - input_role: value
        measure_key: code_lines_added
    dimensions:
      - change_type
      - file_extension
      - project
      - repository
      - source
  - metric_key: git.lines_added
    source_key: git
    subject: code_changes
    label: Lines added
    short_label: Lines +
    description: All lines added, by file category
    explanation: 'Lines added across all files, split by file category: code, tests, configuration, documentation.'
    unit: lines
    format: integer
    direction: higher_is_better
    entity_type: person
    computation: sum
    peer_cohort_key: org_unit
    inputs:
      - input_role: value
        measure_key: lines_added
    dimensions:
      - category
      - change_type
      - file_extension
      - project
      - repository
      - source
  - metric_key: git.lines_removed
    source_key: git
    subject: code_changes
    label: Lines removed
    short_label: Lines −
    description: All lines removed, by file category
    explanation: Lines removed across all reported file changes, with file-category, repository, and source breakdowns available.
    unit: lines
    format: integer
    direction: neutral
    entity_type: person
    computation: sum
    peer_cohort_key: org_unit
    inputs:
      - input_role: value
        measure_key: lines_removed
    dimensions:
      - category
      - change_type
      - file_extension
      - project
      - repository
      - source
  - metric_key: git.prs_created
    source_key: git
    subject: pull_requests
    label: Pull requests created
    short_label: PRs opened
    description: Authored pull requests
    explanation: Pull requests opened, dated by creation.
    unit: PRs
    format: integer
    direction: higher_is_better
    entity_type: person
    computation: sum
    peer_cohort_key: org_unit
    inputs:
      - input_role: value
        measure_key: pr_created
    dimensions:
      - destination_branch
      - project
      - repository
      - source
  - metric_key: git.prs_merged
    source_key: git
    subject: pull_requests
    label: Pull requests merged
    short_label: PRs merged
    description: Authored pull requests merged
    explanation: Authored pull requests that merged, dated by the merge.
    unit: PRs
    format: integer
    direction: higher_is_better
    entity_type: person
    computation: sum
    peer_cohort_key: org_unit
    inputs:
      - input_role: value
        measure_key: pr_merged
    dimensions:
      - destination_branch
      - project
      - repository
      - source
  - metric_key: git.merge_rate
    source_key: git
    subject: pull_requests
    tags:
      - rate
    label: PR merge rate
    short_label: Merge %
    description: Share of created pull requests that merged
    explanation: Of the pull requests created in the period, the share that have merged. Requests opened near the end of the period may not have merged yet, which lowers the rate at period edges.
    format: percent
    direction: higher_is_better
    entity_type: person
    computation: !ratio
      scale: 100.0
    peer_cohort_key: org_unit
    inputs:
      - input_role: numerator
        measure_key: pr_created_merged
      - input_role: denominator
        measure_key: pr_created
    dimensions:
      - destination_branch
      - project
      - repository
      - source
  - metric_key: git.commits_per_active_day
    source_key: git
    subject: commits
    tags:
      - rate
    label: Commits per active day
    short_label: Commits/day
    description: Commit cadence on days with commits
    explanation: Commits divided by the number of days with at least one commit.
    format: decimal
    direction: higher_is_better
    entity_type: person
    computation: !ratio
      scale: 1.0
    peer_cohort_key: org_unit
    inputs:
      - input_role: numerator
        measure_key: commit_count
      - input_role: denominator
        measure_key: commit_day
    dimensions: []
  - metric_key: git.commit_size
    source_key: git
    subject: commits
    tags:
      - distribution
    label: Commit size
    description: Typical diff size per commit
    explanation: Median diff size of authored commits (lines added plus removed). Smaller commits are easier to review.
    unit: lines
    format: integer
    direction: lower_is_better
    entity_type: person
    computation: median
    peer_cohort_key: org_unit
    inputs:
      - input_role: value
        measure_key: commit_change_size
    dimensions:
      - project
      - repository
      - source
  - metric_key: git.pr_size
    source_key: git
    subject: pull_requests
    tags:
      - distribution
    label: PR size
    description: Typical diff size per pull request
    explanation: Median diff size of authored pull requests (lines added plus removed). Smaller requests are easier to review. Sources that do not report line counts contribute no values.
    unit: lines
    format: integer
    direction: lower_is_better
    entity_type: person
    computation: median
    peer_cohort_key: org_unit
    inputs:
      - input_role: value
        measure_key: pr_change_size
    dimensions:
      - destination_branch
      - project
      - repository
      - source
  - metric_key: git.pr_cycle_time_h
    source_key: git
    subject: pull_requests
    tags:
      - duration
      - distribution
    label: PR cycle time
    short_label: PR cycle
    description: Typical hours from open to merge
    explanation: Median hours from opening a pull request to merging it, over requests merged in the period.
    unit: h
    format: decimal
    direction: lower_is_better
    entity_type: person
    computation: median
    peer_cohort_key: org_unit
    inputs:
      - input_role: value
        measure_key: pr_cycle_hours
    dimensions:
      - destination_branch
      - project
      - repository
      - source
  - metric_key: collab.messages_sent
    source_key: collab
    subject: messaging
    label: Messages Sent
    short_label: Msgs
    description: Chat messages sent
    explanation: 'Chat messages a person sent across messaging tools. Counts are not directly comparable between tools: Slack includes thread replies, and Microsoft 365 combines private-chat and channel messages.'
    unit: messages
    format: integer
    direction: higher_is_better
    entity_type: person
    computation: sum
    peer_cohort_key: org_unit
    inputs:
      - input_role: value
        measure_key: total_chat_messages
    dimensions:
      - tool
  - metric_key: collab.channel_posts
    source_key: collab
    subject: messaging
    label: Channel Posts
    short_label: Channel posts
    description: Messages posted to shared channels, including replies
    explanation: Channel posts plus thread replies across messaging tools. Tools that report posts and replies separately are folded so counts stay comparable.
    unit: messages
    format: integer
    direction: higher_is_better
    entity_type: person
    computation: sum
    peer_cohort_key: org_unit
    inputs:
      - input_role: value
        measure_key: channel_posts
    dimensions:
      - tool
  - metric_key: collab.dm_ratio
    source_key: collab
    subject: messaging
    tags:
      - rate
    label: DM Ratio
    short_label: DM %
    description: Share of messages sent in direct or group chats
    explanation: Direct and group-chat messages divided by all chat messages. A lower ratio means more communication happens in open channels. Tools that do not distinguish message types report no value.
    format: percent
    direction: lower_is_better
    entity_type: person
    computation: !ratio
      scale: 100.0
    peer_cohort_key: org_unit
    inputs:
      - input_role: numerator
        measure_key: direct_and_group_messages
      - input_role: denominator
        measure_key: total_chat_messages
    dimensions:
      - tool
  - metric_key: collab.msgs_per_active_day
    source_key: collab
    subject: messaging
    tags:
      - rate
    label: Messages per Active Day
    short_label: Msgs/day
    description: Chat messages divided by chat-active days
    explanation: Chat messages sent divided by days with chat messages. Each tool's active days count separately.
    unit: messages/day
    format: decimal
    direction: higher_is_better
    entity_type: person
    computation: !ratio
      scale: 1.0
    peer_cohort_key: org_unit
    inputs:
      - input_role: numerator
        measure_key: total_chat_messages
      - input_role: denominator
        measure_key: chat_active_day
    dimensions:
      - tool
  - metric_key: collab.active_days
    source_key: collab
    subject: activity
    label: Active Days
    description: Days with collaboration activity
    explanation: Distinct days on which a person took a deliberate collaboration action — sending a message, sending email, engaging or sharing a file, or attending a meeting. Passive activity such as receiving or reading email is excluded.
    unit: days
    format: integer
    direction: higher_is_better
    entity_type: person
    computation: distinct_count
    peer_cohort_key: org_unit
    inputs:
      - input_role: value
        measure_key: active_day
    dimensions:
      - tool
  - metric_key: collab.emails_sent
    source_key: collab
    subject: email
    label: Emails Sent
    short_label: Emails sent
    description: Emails sent
    explanation: Emails a person sent.
    unit: emails
    format: integer
    direction: higher_is_better
    entity_type: person
    computation: sum
    peer_cohort_key: org_unit
    inputs:
      - input_role: value
        measure_key: emails_sent
    dimensions:
      - tool
  - metric_key: collab.emails_received
    source_key: collab
    subject: email
    label: Emails Received
    short_label: Emails rcvd
    description: Emails received
