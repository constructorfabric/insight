
server:
  home_dir: "~/.insight"

logging:
  default:
    console_level: info

gears:
  api-gateway:
    config:
      # INVARIANT: the service router's insight-http-metrics is the single
      # writer of http.server.request.duration — the host's copy stays renamed
      # or two bucket layouts collide in one series.
      metrics:
        prefix: "host"
      bind_addr: "0.0.0.0:8081"
      enable_docs: true
      cors_enabled: true
      openapi:
        title: "Insight Analytics API"
        version: "0.1.0"
        description: "Read-only query service over predefined ClickHouse metrics"
      auth_disabled: false

  service-discovery:
    config: {}

  grpc-hub:
    config:
      listen_addr: "uds:///tmp/analytics-grpc"

  authn-resolver:
    config:
      vendor: "hyperspot"

  oidc-authn-plugin:
    config:
      vendor: "hyperspot"
      priority: 50
      jwt:
        supported_algorithms: ["ES256"]
        clock_skew_leeway: 60s
        require_audience: true
        expected_audience:
          - "internal-services"
        trusted_issuers:
          - issuer: "https://gateway.invalid"
        claim_mapping:
          subject_id: "sub"
          subject_tenant_id: "tenant_id"
          subject_type: "sub_type"
          token_scopes: "roles"
        required_claims: []
      http_client:
        request_timeout: 5s
      # Client-credentials exchange is UNUSED by analytics (no outbound S2S
      # calls) but the block is required config. `discovery_url` must resolve to
      # a trusted issuer; it is never fetched unless an exchange is performed.
      s2s_oauth:
        discovery_url: "https://gateway.invalid"
        default_subject_type: "service"
        token_cache:
          ttl: 300s
          max_entries: 100

  authz-resolver:
    config:
      vendor: "hyperspot"

  static-authz-plugin:
    config:
      vendor: "hyperspot"
      priority: 100

  tenant-resolver:
    config:
      vendor: "hyperspot"

  single-tenant-tr-plugin:
    config:
      vendor: "hyperspot"
      priority: 20

  analytics:
    config:
      bind_addr: "0.0.0.0:8081"
      database_url: ""
      clickhouse_url: ""
      clickhouse_database: "insight"
      identity_url: ""
      visibility_policy: "org_chart"
      redis_url: ""
      metric_catalog:
        tenant_metrics_enabled: false
        enforce_tenant_scope: false
