[package]
name = "analytics"
version = "0.1.0"
description = "Analytics API — read-only query service over predefined ClickHouse metrics"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
insight-clickhouse = { workspace = true }
insight-http-metrics = { workspace = true }
insight-log-context = { workspace = true }
insight-openapi = { workspace = true }
insight-migration = { workspace = true }
clickhouse = { workspace = true }

sqlparser = { workspace = true, features = ["visitor"] }
rmcp = { workspace = true }

axum = { workspace = true }
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
toolkit = { workspace = true, features = ["bootstrap"] }
toolkit-security = { workspace = true }
toolkit-canonical-errors = { workspace = true }

api_gateway = { workspace = true }
authn-resolver = { workspace = true }
authz-resolver = { workspace = true }
oidc-authn-plugin = { workspace = true }
tenant-resolver = { workspace = true }
single-tenant-tr-plugin = { workspace = true }
static-authz-plugin = { workspace = true }
grpc_hub = { workspace = true }
service_discovery = { workspace = true }
types_registry = { workspace = true }
reqwest = { workspace = true }
jsonwebtoken = { workspace = true }
redis = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
schemars = { workspace = true }
url = { workspace = true }
utoipa = { workspace = true, features = ["chrono", "uuid"] }
thiserror = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }
zeroize = { workspace = true }
hex = { workspace = true }
secrecy = { workspace = true }
csv = { workspace = true }
rust_xlsxwriter = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
opentelemetry = { workspace = true }
clap = { workspace = true }

[dev-dependencies]
insight-log-context = { workspace = true, features = ["test-support"] }
sea-orm = { workspace = true, features = ["mock"] }
tower = { version = "0.5", features = ["util"] }
clickhouse = { workspace = true, features = ["test-util"] }
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3.27"
zip = { version = "9.0", default-features = false, features = ["deflate"] }
p256 = { version = "0.14", features = ["pkcs8", "pem", "ecdsa", "getrandom"] }
