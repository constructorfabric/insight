[package]
name = "connectors"
version = "0.1.0"
description = "Connector management service"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
insight-clickhouse = { workspace = true }
insight-http-metrics = { workspace = true }
insight-log-context = { workspace = true }
insight-openapi = { workspace = true }
insight-migration = { workspace = true }
clickhouse = { workspace = true }
axum = { workspace = true }
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
toolkit-security = { workspace = true }
toolkit-canonical-errors = { workspace = true }
api_gateway = { workspace = true }
authn-resolver = { workspace = true }
authz-resolver = { workspace = true }
oidc-authn-plugin = { workspace = true }
tenant-resolver = { workspace = true }
single-tenant-tr-plugin = { workspace = true }
static-authz-plugin = { workspace = true }
grpc_hub = { workspace = true }
service_discovery = { workspace = true }
types_registry = { workspace = true }
reqwest = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
secrecy = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
toolkit = { workspace = true, features = ["bootstrap"] }
utoipa = { workspace = true, features = ["chrono", "uuid"] }

[dev-dependencies]
insight-log-context = { workspace = true, features = ["test-support"] }
sea-orm = { workspace = true, features = ["mock"] }
tower = { version = "0.5", features = ["util"] }
clickhouse = { workspace = true, features = ["test-util"] }
tokio = { workspace = true, features = ["test-util"] }
