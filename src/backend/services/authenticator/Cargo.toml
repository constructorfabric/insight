[package]
name = "authenticator"
version = "0.1.0"
description = "Authenticator — OIDC login, opaque sessions, and the cookie-to-JWT exchange behind the nginx gateway (BFF / token-handler pattern)"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
authenticator-sdk = { workspace = true }
insight-http-metrics = { workspace = true }
insight-log-context = { workspace = true }
insight-openapi = { workspace = true }

toolkit = { workspace = true, features = ["bootstrap"] }
toolkit-security = { workspace = true }
toolkit-canonical-errors = { workspace = true }

api_gateway = { workspace = true }
authn-resolver = { workspace = true }
oidc-authn-plugin = { workspace = true }
authz-resolver = { workspace = true }
tenant-resolver = { workspace = true }
single-tenant-tr-plugin = { workspace = true }
static-authz-plugin = { workspace = true }
grpc_hub = { workspace = true }
service_discovery = { workspace = true }
types_registry = { workspace = true }

axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
utoipa = { workspace = true, features = ["chrono", "uuid"] }
thiserror = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tokio-util = "0.7"
async-trait = { workspace = true }
futures = { workspace = true }
uuid = { workspace = true, features = ["v5"] }
chrono = { workspace = true }
tracing = { workspace = true }
opentelemetry = { workspace = true }
rdkafka = { version = "0.39", features = ["cmake-build", "tokio"] }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
reqwest = { workspace = true }
redis = { workspace = true }
url = "2.5"
openidconnect = "4"
axum-extra = { version = "0.12", features = ["cookie"] }
time = { workspace = true }

# Workspace dep: jsonwebtoken v10 panics if two crypto providers are active under feature unification.
jsonwebtoken = { workspace = true }
base64 = "0.23"
rand = "0.10"

[dev-dependencies]
insight-log-context = { workspace = true, features = ["test-support"] }
p256 = { version = "0.14", features = ["pkcs8", "pem", "ecdsa", "getrandom"] }
tower = { version = "0.5", features = ["util"] }
serde_yaml = { workspace = true }
