apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "insight-authenticator.fullname" . }}
  labels:
    {{- include "insight-authenticator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "insight-authenticator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "insight-authenticator.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/observability: {{ default dict (default dict .Values.global).observability | toYaml | sha256sum }}
        {{- if .Values.idp.extraCaCertSecret }}
        # `lookup` returns nil under `helm template` (GitOps), so GitOps
        # rotations need an external rollout trigger.
        checksum/idp-extra-ca: {{ lookup "v1" "Secret" .Release.Namespace .Values.idp.extraCaCertSecret | toYaml | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.global }}
      {{- with .imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: authenticator
          image: "{{ required "image.repository is required" .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/authenticator"]
          args: ["-c", "/app/config/authenticator.yaml", "run"]
          volumeMounts:
            - name: authenticator-config
              mountPath: /app/config/authenticator.yaml
              subPath: authenticator.yaml
              readOnly: true
            - name: signing-keys
              mountPath: {{ .Values.signingKeysPath | quote }}
              readOnly: true
            {{- if .Values.tlsDiscovery.enabled }}
            - name: authn-tls-cert
              mountPath: /app/authn-ca
              readOnly: true
            {{- end }}
            {{- if .Values.idp.extraCaCertSecret }}
            - name: idp-extra-ca
              mountPath: {{ dir .Values.idp.extraCaCertPath | quote }}
              readOnly: true
            {{- end }}
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            - name: token
              containerPort: {{ .Values.service.tokenPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-platform
                optional: true
            - secretRef:
                name: {{ required "existingSecret is required (umbrella provides `insight-authenticator-config`; standalone installs supply their own)" .Values.existingSecret | quote }}
          {{- if .Values.idp.extraCaCertSecret }}
          env:
            - name: APP__gears__authenticator__config__idp__extra_ca_cert_path
              value: {{ .Values.idp.extraCaCertPath | quote }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        {{- if .Values.tlsDiscovery.enabled }}
        - name: authn-tls
          image: "{{ .Values.tlsDiscovery.image.repository }}:{{ .Values.tlsDiscovery.image.tag }}"
          ports:
            - name: tls
              containerPort: {{ .Values.tlsDiscovery.port }}
              protocol: TCP
          volumeMounts:
            - name: authn-tls-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: authn-tls-cert
              mountPath: /tls
              readOnly: true
            # nginx-unprivileged keeps its pid and every *_temp dir under /tmp.
            - name: authn-tls-tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 101       # the nginx-unprivileged user (owns /tmp paths)
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        {{- end }}
      volumes:
        - name: authenticator-config
          configMap:
            name: {{ include "insight-authenticator.fullname" . }}-gears-config
        - name: signing-keys
          secret:
            secretName: {{ required "signingKeysSecret is required (mount the ES256 current.pem/previous.pem)" .Values.signingKeysSecret | quote }}
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- if .Values.idp.extraCaCertSecret }}
        - name: idp-extra-ca
          secret:
            secretName: {{ .Values.idp.extraCaCertSecret | quote }}
            items:
              - key: {{ .Values.idp.extraCaCertSecretKey | quote }}
                path: {{ base .Values.idp.extraCaCertPath | quote }}
        {{- end }}
        {{- if .Values.tlsDiscovery.enabled }}
        - name: authn-tls-conf
          configMap:
            name: {{ include "insight-authenticator.fullname" . }}-authn-tls
        - name: authn-tls-cert
          secret:
            secretName: {{ include "insight-authenticator.authnTlsSecret" . }}
        - name: authn-tls-tmp
          emptyDir: {}
        {{- end }}
