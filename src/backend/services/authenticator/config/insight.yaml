server:
  home_dir: "~/.insight"

logging:
  default:
    console_level: info

gears:
  api-gateway:
    config:
      metrics:
        prefix: "host"
      bind_addr: "0.0.0.0:8083"
      enable_docs: true
      cors_enabled: true
      openapi:
        title: "Insight Authenticator"
        version: "0.1.0"
        description: "OIDC login, opaque sessions, and the cookie-to-JWT exchange (BFF / token-handler)"
      auth_disabled: false

  service-discovery:
    config: {}

  grpc-hub:
    config:
      listen_addr: "uds:///tmp/authenticator-grpc"

  authn-resolver:
    config:
      vendor: "hyperspot"

  oidc-authn-plugin:
    config:
      vendor: "hyperspot"
      priority: 50
      jwt:
        supported_algorithms: ["ES256"]
        clock_skew_leeway: 60s
        require_audience: true
        expected_audience:
          - "internal-services"
        trusted_issuers:
          - issuer: "https://gateway.invalid"
        claim_mapping:
          subject_id: "sub"
          subject_tenant_id: "tenant_id"
          subject_type: "sub_type"
          token_scopes: "roles"
        required_claims: []
      http_client:
        request_timeout: 5s
      # Client-credentials exchange is UNUSED here (the authenticator makes no
      # outbound S2S calls through the plugin) but the block is required config.
      s2s_oauth:
        discovery_url: "https://gateway.invalid"
        default_subject_type: "service"
        token_cache:
          ttl: 300s
          max_entries: 100

  authz-resolver:
    config:
      vendor: "hyperspot"

  static-authz-plugin:
    config:
      vendor: "hyperspot"
      priority: 100

  tenant-resolver:
    config:
      vendor: "hyperspot"

  single-tenant-tr-plugin:
    config:
      vendor: "hyperspot"
      priority: 20

  authenticator:
    config:
      bind_addr: "0.0.0.0:8083"
      redis_url: ""
      signing_keys_path: ""
      identity_url: ""
      gateway_issuer: ""
      jwt_audience: "internal-services"
      redirect_uri: ""
      default_return_to: "/"
      csrf_origins: []
      oidc_scopes: ["openid", "email", "profile"]
      idp:
        issuer_url: ""
        client_id: ""
        client_secret: ""
        tenant_claim: "tenant_id"
        source_type: ""
        external_id_claim: "sub"
        default_tenant_id: ""
      service_tokens:
        token_bind_addr: "0.0.0.0:8093"
        audience: "http://localhost:8093/internal/token"
        assertion_max_lifetime_seconds: 60
        token_ttl_seconds: 300
        public_key_dir: ""
        services:
          testclient:
            public_key_paths: ["testclient.pub.pem"]
            roles: ["service", "session_admin"]
