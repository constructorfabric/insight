{{- /*
  The reviewable route table, built from .Values.gateway.routes and rendered
  with `tpl` so `{{ .Release.Name }}` in each upstream resolves to the real
  service. The gateway container compiles this into nginx.conf at startup via
  routegen; editing routes is a values change, reviewable in gitops (DD-GW-02).
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "insight-gateway.fullname" . }}-routes
  labels:
    {{- include "insight-gateway.labels" . | nindent 4 }}
data:
  routes.yaml: |
    version: 1
    defaults:
      strip_request_headers:
        {{- range .Values.gateway.defaults.stripRequestHeaders }}
        - {{ . }}
        {{- end }}
    routes:
      {{- range .Values.gateway.routes }}
      {{- $mcpOk := or (not (.mcpOnly | default false)) $.Values.global.mcp.enabled }}
      {{- $sqlApiOk := or (not (.sqlApiOnly | default false)) $.Values.global.sqlApi.enabled }}
      {{- $previewsOk := or (not (.previewsOnly | default false)) $.Values.global.previews.enabled }}
      {{- $v3Ok := or (not (.v3Only | default false)) ((($.Values.global).insightV3Core).deploy) }}
      {{- if and $mcpOk $sqlApiOk $previewsOk $v3Ok }}
      - prefix: {{ .prefix }}
        upstream: {{ tpl .upstream $ | quote }}
        {{- with .auth }}
        auth: {{ . }}
        {{- end }}
        {{- with .mcpScope }}
        mcp_scope: {{ . | quote }}
        {{- end }}
        {{- with .timeoutMs }}
        timeout_ms: {{ . }}
        {{- end }}
        {{- with .stripPrefix }}
        strip_prefix: {{ . }}
        {{- end }}
        {{- with .websocket }}
        websocket: {{ . }}
        {{- end }}
      {{- end }}
      {{- end }}
