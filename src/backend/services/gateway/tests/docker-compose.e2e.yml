# Gateway e2e stack (dev/CI ONLY) -- NGINX_BFF.md §D.
#
# The full edge: the real authenticator + a realm-importing Keycloak behind the
# OpenResty gateway, with stub identity + echo upstream. Everything runs on one
# compose network so DNS names resolve for both nginx upstreams and the Lua
# cosocket (resolver 127.0.0.11), and the OIDC redirect flow works without URL
# rewriting inside the network. Driven by run-e2e.sh; the host-side pytest
# rewrites the in-network hostnames to the published ports (conftest.py).
name: insight-gw-e2e

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  identity-stub:
    image: python:3.12-slim
    volumes:
      - ../../authenticator/tests/identity-stub.py:/identity-stub.py:ro
    command: ["python", "/identity-stub.py", "0.0.0.0:8092"]

  # Real IdP: same image the compose stack pins (docker-compose.yml), importing
  # the generated roster realm (conftest.py runs insight-seed-realm into
  # ./keycloak-import before `up`).
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # In-network origin, so discovery, token exchange, and the id_token `iss`
      # agree; the host-side pytest rewrites it to the published port.
      KC_HOSTNAME: "http://keycloak:8085"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8085"
      JAVA_OPTS_APPEND: "-Xms256m -Xmx512m"
    volumes:
      - ./keycloak-import:/opt/keycloak/data/import:ro
    ports:
      # Published so the host-side pytest can drive the OIDC redirect chain and
      # the Keycloak login form.
      - "${KEYCLOAK_E2E_PORT:-18084}:8085"

  authenticator:
    build:
      context: ../../..
      dockerfile: services/authenticator/Dockerfile
    depends_on:
      redis: {condition: service_healthy}
      keycloak: {condition: service_started}
      identity-stub: {condition: service_started}
    ports:
      # Published so pytest can assert JWKS is served directly by the authenticator.
      - "${AUTHENTICATOR_E2E_PORT:-18083}:8083"
    environment:
      APP__gears__authenticator__config__redis_url: "redis://redis:6379"
      APP__gears__authenticator__config__signing_keys_path: "/keys"
      APP__gears__authenticator__config__identity_url: "http://identity-stub:8092"
      APP__gears__authenticator__config__gateway_issuer: "http://gateway:8080"
      APP__gears__authenticator__config__redirect_uri: "http://gateway:8080/auth/callback"
      APP__gears__authenticator__config__idp__issuer_url: "http://keycloak:8085/realms/insight"
      APP__gears__authenticator__config__idp__client_id: "insight-authenticator"
      # The generated realm's confidential-client secret (insight-seed-realm
      # default; kc-realm docs call it the dev secret).
      APP__gears__authenticator__config__idp__client_secret: "insight-authenticator-dev-secret"
      # Required since the login-bootstrap person resolve: the identity-stub
      # answers any source_type, so the value only has to be non-empty. The
      # external id is the default `sub` claim (the realm user's roster uuid).
      APP__gears__authenticator__config__idp__source_type: "keycloak"
      # Short exchange-cache window so the logout-revocation phase is fast.
      APP__gears__authenticator__config__authz_cache_max_age_seconds: "3"
      # Resolve the baked dev `testclient` registry entry's public_key_paths
      # against the mounted keys dir (conftest generates testclient.pub.pem).
      APP__gears__authenticator__config__service_tokens__public_key_dir: "/keys"
    volumes:
      - ./keys:/keys:ro

  echo:
    image: python:3.12-slim
    volumes:
      - ./echo-stub.py:/echo-stub.py:ro
    command: ["python", "/echo-stub.py", "0.0.0.0:9090"]

  gateway:
    build:
      context: ../../..
      dockerfile: services/gateway/Dockerfile
    depends_on:
      authenticator: {condition: service_started}
      echo: {condition: service_started}
    environment:
      GATEWAY_AUTHENTICATOR_URL: "http://authenticator:8083"
      GATEWAY_FRONT_URL: "http://echo:9090"
    volumes:
      # The container compiles this into nginx.conf at startup (routes -> echo).
      - ./routes.e2e.yaml:/etc/gateway/routes.yaml:ro
    ports:
      - "${GW_E2E_PORT:-18080}:8080"
