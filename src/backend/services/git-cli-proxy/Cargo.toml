[package]
name = "git-cli-proxy"
version = "0.1.0"
description = "Git CLI Proxy — clone-based commit data extraction for nocode git connectors"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
toolkit = { workspace = true, features = ["bootstrap"] }
toolkit-security = { workspace = true }
toolkit-canonical-errors = { workspace = true }
utoipa = { workspace = true }
chrono = { workspace = true }
insight-http-metrics = { workspace = true }
insight-log-context = { workspace = true }
insight-openapi = { workspace = true }
opentelemetry = { workspace = true }
rustix = { version = "1.1", features = ["fs", "process"] }

service_discovery = { workspace = true }
grpc_hub = { workspace = true }
types_registry = { workspace = true }

anyhow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }

hex = { workspace = true }
base64 = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
tokio-util = "0.7"
tower-http = { version = "0.7", features = ["catch-panic"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
insight-log-context = { workspace = true, features = ["test-support"] }
uuid = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
reqwest = { workspace = true, features = ["json"] }
serde_json = { workspace = true }
