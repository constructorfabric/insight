[package]
name = "git-cli-proxy"
version = "0.1.0"
description = "Git CLI Proxy — clone-based commit data extraction for nocode git connectors"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
# ToolKit host runtime. This service runs as a gears-rust host: routes are
# served by the `api-gateway` system gear (the REST host) under
# `toolkit::bootstrap::run_server`. Unlike analytics/identity-resolution, auth
# is NOT the gateway-JWT pipeline: the service is cluster-internal (consumed by
# Airbyte connector pods, never routed through the platform gateway), so the
# host runs with `auth_disabled: true` and every /v1 route is guarded by our
# own static bearer token middleware (`api::auth`), provisioned via Helm.
toolkit = { workspace = true, features = ["bootstrap"] }
toolkit-canonical-errors = { workspace = true }

# System gears linked for the REST host. Discovered at link time via inventory
# (`use … as _;` in main.rs is load-bearing). Deliberately minimal: no
# oidc-authn-plugin / authz / tenant-resolver — see the auth note above.
api_gateway = { workspace = true }
authn-resolver = { workspace = true }
gear_orchestrator = { workspace = true }
grpc_hub = { workspace = true }
types_registry = { workspace = true }

anyhow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }

# Repo-cache engine: cache keys are sha256(tenant \0 source \0 clone_url)
# hex dir names; git credentials travel as an env-injected Basic header.
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# `tower::ServiceExt::oneshot` for driving the Axum router in tests without a
# bound socket (same approach as the analytics HTTP live tests).
tower = { version = "0.5", features = ["util"] }
# tests/boot.rs drives the built binary over real HTTP (routegen cli.rs
# precedent — covers main.rs/gear.rs under llvm-cov).
reqwest = { workspace = true, features = ["json"] }
serde_json = { workspace = true }
