apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "insight-git-cli-proxy.fullname" . }}-config
  labels:
    {{- include "insight-git-cli-proxy.labels" . | nindent 4 }}
data:
  insight.yaml: |
    server:
      home_dir: "/app/data/home"

    logging:
      default:
        console_level: info

    gears:
      gear-orchestrator:
        config: {}

      grpc-hub:
        config:
          listen_addr: "uds:///tmp/git-cli-proxy-grpc"

      git-cli-proxy:
        config:
          # Airbyte-only consumer: no gateway-JWT pipeline. /v1 is guarded by
          # the service's own bearer token from the config Secret.
          bind_addr: "0.0.0.0:{{ .Values.service.port }}"
          data_dir: "{{ .Values.persistence.mountPath }}"
          disk_budget_bytes: {{ include "insight-git-cli-proxy.diskBudgetBytes" . }}
          max_repo_bytes: {{ required "cache.maxRepoBytes is required" .Values.cache.maxRepoBytes | int64 }}
          default_max_staleness_seconds: {{ required "cache.defaultMaxStalenessSeconds is required" .Values.cache.defaultMaxStalenessSeconds | int64 }}
          heavy_ops_concurrency: {{ required "cache.heavyOpsConcurrency is required" .Values.cache.heavyOpsConcurrency | int64 }}
          ca_cert_path: {{ .Values.cache.caCertPath | quote }}
          # Not a values knob on purpose: a file:// origin reads the pod's own
          # filesystem, so no deployment may turn this on.
          allow_file_repos: false
          # Exceptions to the built-in refusal of loopback, link-local,
          # private and cluster-internal hosts. Additive only: naming one host
          # never stops another from working, so a tenant adding a public
          # vendor never waits on a redeploy.
          # `toJson`, not a `range`: an empty range leaves the key with no
          # value, which is YAML null, and the service refuses to start on it.
          allowed_repo_hosts: {{ .Values.cache.allowedRepoHosts | default list | toJson }}
          # proxy_token is NEVER rendered here — it arrives via envFrom from
          # the config Secret (APP__gears__git_cli_proxy__config__proxy_token).
          proxy_token: ""
