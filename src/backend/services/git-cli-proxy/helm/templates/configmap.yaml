apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "insight-git-cli-proxy.fullname" . }}-config
  labels:
    {{- include "insight-git-cli-proxy.labels" . | nindent 4 }}
data:
  insight.yaml: |
    server:
      home_dir: "/app/data/home"

    logging:
      default:
        console_level: {{ ((((.Values.global).observability).logs).level) | default "info" }}
        console_format: {{ ((((.Values.global).observability).logs).format) | default "json" }}

    opentelemetry:
      resource:
        service_name: "insight-git-cli-proxy"
        attributes:
          service.version: {{ .Values.image.tag | default .Chart.AppVersion | quote }}
      exporter:
        kind: {{ .Values.opentelemetry.exporter.kind }}
        {{- with .Values.opentelemetry.exporter.endpoint }}
        endpoint: {{ . | quote }}
        {{- end }}
      tracing:
        enabled: {{ .Values.opentelemetry.tracing.enabled }}
      metrics:
        enabled: {{ .Values.opentelemetry.metrics.enabled }}

    gears:
      service-discovery:
        config: {}

      grpc-hub:
        config:
          listen_addr: "uds:///tmp/git-cli-proxy-grpc"

      git-cli-proxy:
        config:
          bind_addr: "0.0.0.0:{{ .Values.service.port }}"
          data_dir: "{{ .Values.persistence.mountPath }}"
          disk_budget_bytes: {{ include "insight-git-cli-proxy.diskBudgetBytes" . }}
          max_repo_bytes: {{ required "cache.maxRepoBytes is required" .Values.cache.maxRepoBytes | int64 }}
          default_max_staleness_seconds: {{ required "cache.defaultMaxStalenessSeconds is required" .Values.cache.defaultMaxStalenessSeconds | int64 }}
          heavy_ops_concurrency: {{ required "cache.heavyOpsConcurrency is required" .Values.cache.heavyOpsConcurrency | int64 }}
          serve_concurrency: {{ required "cache.serveConcurrency is required" .Values.cache.serveConcurrency | int64 }}
          ca_cert_path: {{ .Values.cache.caCertPath | quote }}
          allow_file_repos: false
          # `toJson` renders an empty list as `[]` rather than a bare key.
          allowed_repo_hosts: {{ .Values.cache.allowedRepoHosts | default list | toJson }}
          proxy_token: ""
