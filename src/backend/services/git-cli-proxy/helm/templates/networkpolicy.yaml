{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "insight-git-cli-proxy.fullname" . }}
  labels:
    {{- include "insight-git-cli-proxy.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "insight-git-cli-proxy.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  # Every /v1 request carries a git credential, so ingress is restricted to the
  # namespaces that run Airbyte connector pods — the only consumer. An empty
  # allow-list denies all ingress: a closed default beats an accidentally open
  # one.
  ingress:
    {{- range $entry := .Values.networkPolicy.allowedNamespaceLabels }}
    {{- range $value := $entry.values }}
    - from:
        - namespaceSelector:
            matchLabels:
              {{ $entry.key }}: {{ $value | quote }}
      ports:
        - port: http
          protocol: TCP
    {{- end }}
    {{- end }}
{{- end }}
