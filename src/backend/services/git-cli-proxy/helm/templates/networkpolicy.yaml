{{- if .Values.networkPolicy.enabled }}
{{- $allowed := 0 }}
{{- range $entry := .Values.networkPolicy.allowedNamespaceLabels }}
  {{- $allowed = add $allowed (len $entry.values) }}
{{- end }}
{{- if eq $allowed 0 }}
  {{- fail "networkPolicy.allowedNamespaceLabels names no namespace, so the rendered policy would deny every caller and each git sync would time out against an apparently healthy pod. Set it to the namespace running Airbyte connector jobs (the Airbyte release's own namespace unless its chart pins a separate job namespace), or set networkPolicy.enabled=false on a cluster without NetworkPolicy support." }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "insight-git-cli-proxy.fullname" . }}
  labels:
    {{- include "insight-git-cli-proxy.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "insight-git-cli-proxy.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  # Every /v1 request carries a git credential, so ingress is restricted to the
  # namespaces that run Airbyte connector pods — the only consumer.
  ingress:
    {{- range $entry := .Values.networkPolicy.allowedNamespaceLabels }}
    {{- range $value := $entry.values }}
    - from:
        - namespaceSelector:
            matchLabels:
              {{ $entry.key }}: {{ $value | quote }}
      ports:
        - port: http
          protocol: TCP
    {{- end }}
    {{- end }}
{{- end }}
