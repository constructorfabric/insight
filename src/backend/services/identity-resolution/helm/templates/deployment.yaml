apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "insight-identity-resolution.fullname" . }}
  labels:
    {{- include "insight-identity-resolution.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "insight-identity-resolution.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "insight-identity-resolution.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/observability: {{ default dict (default dict .Values.global).observability | toYaml | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.global }}
      {{- with .imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      # Suppress the legacy `<SVC>_SERVICE_HOST/PORT/…` Docker-link env-vars
      # kubelet auto-injects for every Service in the namespace at pod-start
      # (see api-gateway deployment for the longer explanation).
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      {{- if .Values.waitForMariadb.enabled }}
      initContainers:
        - name: wait-for-mariadb
          image: "{{ .Values.waitForMariadb.image.repository }}:{{ .Values.waitForMariadb.image.tag }}"
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-platform
          command:
            - sh
            - -c
            - |
              set -eu
              host="$MARIADB_HOST"
              port="${MARIADB_PORT:-3306}"
              timeout={{ .Values.waitForMariadb.timeoutSeconds }}
              elapsed=0
              echo "wait-for-mariadb: ${host}:${port} (timeout=${timeout}s)"
              until nc -z "${host}" "${port}"; do
                if [ "${elapsed}" -ge "${timeout}" ]; then
                  echo "wait-for-mariadb: ERROR — ${host}:${port} not reachable within ${timeout}s" >&2
                  exit 1
                fi
                sleep 2
                elapsed=$((elapsed + 2))
              done
              echo "wait-for-mariadb: ${host}:${port} is up after ${elapsed}s"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
        {{- end }}
      containers:
        - name: identity-resolution
          image: "{{ required "image.repository is required" .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/identity-resolution"]
          args: ["-c", "/app/config/insight.yaml"]
          volumeMounts:
            - name: identity-resolution-config
              mountPath: /app/config/insight.yaml
              subPath: insight.yaml
              readOnly: true
            {{- if .Values.gateway.caCertSecret }}
            - name: authn-ca
              mountPath: /etc/insight/authn-ca
              readOnly: true
            {{- end }}
            # The only two paths the process writes under a read-only root:
            # the gears host creates `server.home_dir` at boot, and grpc-hub
            # binds its UDS under /tmp (both set in the ConfigMap).
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-platform
                optional: true
            - secretRef:
                name: {{ required "existingSecret is required (umbrella provides `insight-identity-resolution-config`; standalone installs supply their own)" .Values.existingSecret | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: identity-resolution-config
          configMap:
            name: {{ include "insight-identity-resolution.fullname" . }}-gears-config
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- if .Values.gateway.caCertSecret }}
        - name: authn-ca
          secret:
            secretName: {{ .Values.gateway.caCertSecret | quote }}
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
