replicaCount: 1

podAnnotations: {}

image:
  repository: ghcr.io/constructorfabric/insight-identity-resolution
  tag: "" # MUST be set by the operator. No `:latest` default.
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  # Same port as the .NET identity service this replaces (consumers reach
  # identity at <host>:8082, so the cutover flips only the hostname).
  port: 8082

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Pre-provisioned Secret carrying the gears-rust host's leaf-config overrides
# (injected via envFrom; they override the mounted config ConfigMap):
#   APP__gears__identity_resolution__config__database_url
#   APP__gears__identity_resolution__config__clickhouse_url|_database|_user|_password
#   APP__gears__identity_resolution__config__tenant_default_id       (optional)
#   APP__gears__identity_resolution__config__bootstrap_admin_person_id (optional)
#
# The two optional fields drive the first-admin bootstrap in the migrate
# initContainer (port of the .NET BootstrapAdminRunner): the configured person
# gets an active `admin` assignment in the default tenant, idempotently.
#
# The umbrella populates `insight-identity-resolution-config` automatically;
# for standalone installs the operator pre-creates an equivalent Secret and
# sets `existingSecret` to its name.
existingSecret: ""

# Optional Secret read ONLY by the migrate hook Job, listed after
# `existingSecret` so its keys win. The umbrella renders it as a pre-install
# hook so migrations can run before the release's own Secrets exist. Empty
# disables the extra ref.
migrateEnvSecret: ""

# Gateway-JWT verification (cf-gears-oidc-authn-plugin, NGINX_BFF R1). These
# render into the plugin's `jwt.trusted_issuers` / `expected_audience` in the
# ConfigMap (nested/list-shaped, so not env-injectable). The plugin resolves the
# JWKS via OIDC discovery on the issuer over https ONLY.
gateway:
  # `iss` the token carries = the authenticator's gateway_issuer (gateway
  # origin). The plugin fetches `{issuer}/.well-known/openid-configuration`.
  issuer: ""
  # Optional discovery override: where to fetch the discovery document, when the
  # public `issuer` is not reachable from in-cluster. `{issuer}` is substituted
  # with the matched `iss`. Leave empty to use the issuer directly.
  discoveryUrl: ""
  # Expected `aud`. Fixed by the authenticator's claim contract.
  audience: "internal-services"
  # Optional extra TLS trust roots (PEM paths inside the pod) for the discovery/
  # JWKS fetch — e.g. an internal CA. Empty for a publicly-trusted issuer cert.
  caCertPaths: []
  # Secret holding the discovery issuer's CA under key `ca.crt` (the
  # authenticator's authn-tls cert Secret). When set, it is mounted read-only at
  # /etc/insight/authn-ca and `caCertPaths` should include
  # `/etc/insight/authn-ca/ca.crt`. The umbrella wires both automatically.
  caCertSecret: ""

orgChartSourceType: "bamboohr"
expandSubordinates: true
maxDepth: 16

# Whose data a caller may see: "org_chart" (the reporting line plus explicit
# visibility grants) or "flat" (every person in the tenant). An unreadable
# value stops the service rather than resolving to a policy.
visibilityPolicy: "org_chart"

# The ONE source trusted to say who exists: the persons-seed mints a person for
# its accounts even with no address to match on, and the identities console asks
# an operator to confirm each one. Empty (the default) mints from an address
# only. Full rationale and the requirements a roster must meet: DESIGN §4.1.
#
# A `source_type` as the connectors emit it, not the connector package name — the
# GitHub roster package emits `github`. From the umbrella:
# `identityResolution.rosterSourceType`.
rosterSourceType: ""

# Scheduled persons-seed (#1690): a CronJob runs `identity-resolution seed`
# to rebuild the identity org projection from ClickHouse identity_inputs.
# Requires tenant_default_id in the config Secret (the seed refuses to run
# without it). Manual run:
#   kubectl create job --from=cronjob/<fullname>-seed seed-manual-<who>
seed:
  enabled: true
  # Explicit tenant for the seed run (UUID). Optional: when set it is
  # injected as an env var that OVERRIDES any tenant_default_id the
  # existingSecret carries (k8s `env` beats `envFrom`) — the single source
  # for the CronJob. Leave empty when the Secret already carries the tenant
  # (the umbrella wires it from global.tenantDefaultId and validates at
  # render). Without a tenant from either source every run exits 1.
  tenantDefaultId: ""
  # A freshness backstop, not the publish path (every seed run and operator
  # correction publishes on its own): it bounds how long a publish lost to a
  # dead pod can stay unpublished.
  schedule: "*/15 * * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# TCP gate before start: the service connects to MariaDB at boot. Same
# busybox wait as the .NET identity chart.
waitForMariadb:
  enabled: true
  image:
    repository: busybox
    tag: "1.36"
  timeoutSeconds: 180

# Health probes: /healthz is the cheap process-liveness ping, /health the
# deeper status endpoint — readiness gets the deeper one so an unhealthy pod
# leaves rotation instead of waiting for a liveness restart.
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
