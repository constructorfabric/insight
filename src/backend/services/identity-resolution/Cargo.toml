[package]
name = "identity-resolution"
version = "0.1.0"
description = "Identity Resolution — read API"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
toolkit = { workspace = true, features = ["bootstrap"] }

# System gears linked for the REST host + auth pipeline. Discovered at link time
# via inventory; mirrors the analytics host's authenticated set.
api_gateway = { workspace = true }
authn-resolver = { workspace = true }
oidc-authn-plugin = { workspace = true }
authz-resolver = { workspace = true }
tenant-resolver = { workspace = true }
single-tenant-tr-plugin = { workspace = true }
static-authz-plugin = { workspace = true }
grpc_hub = { workspace = true }
service_discovery = { workspace = true }
types_registry = { workspace = true }

anyhow = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }

sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }

# `insight-clickhouse` wraps the client; the direct `clickhouse` dep is for the
# `Row` derive on the query row struct.
insight-clickhouse = { workspace = true }
insight-http-metrics = { workspace = true }
insight-log-context = { workspace = true }
insight-openapi = { workspace = true }
insight-migration = { workspace = true }
clickhouse = { workspace = true }

opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }

toolkit-security = { workspace = true }
toolkit-canonical-errors = { workspace = true }
# utoipa pinned to match the `ToSchema` the toolkit OperationBuilder compiles against.
utoipa = { workspace = true, features = ["chrono", "uuid"] }

[dev-dependencies]
insight-log-context = { workspace = true, features = ["test-support"] }
tower = { version = "0.5", features = ["util"] }
