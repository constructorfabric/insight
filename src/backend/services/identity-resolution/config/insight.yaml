server:
  home_dir: "~/.insight"

logging:
  default:
    console_level: info

gears:
  api-gateway:
    config:
      # INVARIANT: the service router's insight-http-metrics is the single
      # writer of http.server.request.duration — the host's copy stays renamed
      # or two bucket layouts collide in one series.
      metrics:
        prefix: "host"
      bind_addr: "0.0.0.0:8082"
      enable_docs: true
      cors_enabled: true
      openapi:
        title: "Insight Identity Resolution API"
        version: "0.1.0"
        description: "Identity Resolution read API (Rust port)"
      auth_disabled: false

  service-discovery:
    config: {}

  grpc-hub:
    config:
      listen_addr: "uds:///tmp/identity-resolution-grpc"

  authn-resolver:
    config:
      vendor: "hyperspot"

  oidc-authn-plugin:
    config:
      vendor: "hyperspot"
      priority: 50
      jwt:
        supported_algorithms: ["ES256"]
        clock_skew_leeway: 60s
        require_audience: true
        expected_audience:
          - "internal-services"
        trusted_issuers:
          - issuer: "https://gateway.invalid"
        claim_mapping:
          subject_id: "sub"
          subject_tenant_id: "tenant_id"
          subject_type: "sub_type"
          token_scopes: "roles"
        required_claims: []
      http_client:
        request_timeout: 5s
      # Client-credentials exchange is unused here but required config;
      # discovery_url must name a trusted issuer, never fetched.
      s2s_oauth:
        discovery_url: "https://gateway.invalid"
        default_subject_type: "service"
        token_cache:
          ttl: 300s
          max_entries: 100

  authz-resolver:
    config:
      vendor: "hyperspot"

  static-authz-plugin:
    config:
      vendor: "hyperspot"
      priority: 100

  tenant-resolver:
    config:
      vendor: "hyperspot"

  single-tenant-tr-plugin:
    config:
      vendor: "hyperspot"
      priority: 20

  identity-resolution:
    config:
      database_url: ""
      org_chart_source_type: "bamboohr"
      expand_subordinates: true
      max_depth: 16
      clickhouse_url: ""
      clickhouse_database: "identity"
      clickhouse_user: ""
      clickhouse_password: ""
      clickhouse_cluster_mode: false
      clickhouse_cluster_name: ""
