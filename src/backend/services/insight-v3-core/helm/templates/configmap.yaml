apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "insight-v3-core.fullname" . }}-gears-config
  labels:
    {{- include "insight-v3-core.labels" . | nindent 4 }}
data:
  insight.yaml: |
    server:
      home_dir: "/app/data"

    logging:
      default:
        console_level: {{ ((((.Values.global).observability).logs).level) | default "info" }}
        console_format: {{ ((((.Values.global).observability).logs).format) | default "json" }}

    opentelemetry:
      resource:
        service_name: "insight-v3-core"
        attributes:
          # The release the pod runs; the log_ctx span and the OTel resource
          # both read it (semconv service.version).
          service.version: {{ .Values.image.tag | default .Chart.AppVersion | quote }}

    gears:
      api-gateway:
        config:
          metrics:
            prefix: "host"
          bind_addr: "0.0.0.0:{{ .Values.service.port }}"
          auth_disabled: false
          cors_enabled: false
          enable_docs: false
          openapi:
            title: "Insight v3 Core API"
            version: "0.1.0"
            description: "Token-authenticated raw-data ingestion"

      gear-orchestrator:
        config: {}

      grpc-hub:
        config:
          listen_addr: "uds:///tmp/insight-v3-core-grpc"

      authn-resolver:
        config:
          vendor: "hyperspot"

      oidc-authn-plugin:
        config:
          vendor: "hyperspot"
          priority: 50
          jwt:
            supported_algorithms: ["ES256"]
            clock_skew_leeway: 60s
            require_audience: true
            expected_audience: ["internal-services"]
            trusted_issuers:
              - issuer: "https://gateway.invalid"
            claim_mapping:
              subject_id: "sub"
              subject_tenant_id: "tenant_id"
              subject_type: "sub_type"
              token_scopes: "roles"
            required_claims: []
          http_client:
            request_timeout: 5s
          s2s_oauth:
            discovery_url: "https://gateway.invalid"
            default_subject_type: "service"
            token_cache:
              ttl: 300s
              max_entries: 100

      authz-resolver:
        config:
          vendor: "hyperspot"

      static-authz-plugin:
        config:
          vendor: "hyperspot"
          priority: 100

      tenant-resolver:
        config:
          vendor: "hyperspot"

      single-tenant-tr-plugin:
        config:
          vendor: "hyperspot"
          priority: 20

      insight-v3-core:
        config: {}
