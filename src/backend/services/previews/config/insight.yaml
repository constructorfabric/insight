server:
  home_dir: "~/.insight"

logging:
  default:
    console_level: info

gears:
  api-gateway:
    config:
      bind_addr: "0.0.0.0:8085"
      enable_docs: true
      cors_enabled: true
      openapi:
        title: "Insight Previews API"
        version: "1.0.0"
        description: "Preview experiments API"
      auth_disabled: false

  service-discovery:
    config: {}

  grpc-hub:
    config:
      listen_addr: "uds:///tmp/previews-grpc"

  authn-resolver:
    config:
      vendor: "hyperspot"

  oidc-authn-plugin:
    config:
      vendor: "hyperspot"
      priority: 50
      jwt:
        supported_algorithms: ["ES256"]
        clock_skew_leeway: 60s
        require_audience: true
        expected_audience:
          - "internal-services"
        trusted_issuers:
          - issuer: "https://gateway.invalid"
        claim_mapping:
          subject_id: "sub"
          subject_tenant_id: "tenant_id"
          subject_type: "sub_type"
          token_scopes: "roles"
        required_claims: []
      http_client:
        request_timeout: 5s
      # Client-credentials exchange is unused here but required config;
      # discovery_url must name a trusted issuer, never fetched.
      s2s_oauth:
        discovery_url: "https://gateway.invalid"
        default_subject_type: "service"
        token_cache:
          ttl: 300s
          max_entries: 100

  authz-resolver:
    config:
      vendor: "hyperspot"

  static-authz-plugin:
    config:
      vendor: "hyperspot"
      priority: 100

  tenant-resolver:
    config:
      vendor: "hyperspot"

  single-tenant-tr-plugin:
    config:
      vendor: "hyperspot"
      priority: 20

  previews:
    config:
      namespace: "insight-previews"
      gateway_name: "insight"
      gateway_namespace: "insight-infra"
      gateway_section_name: ""
      route_host: ""
      base_path: "/exp"
      max_experiments: 10
      default_ttl_days: 7
      max_ttl_days: 30
      sweep_interval_secs: 300
      registry_url: "https://ghcr.io"
      registry_token: ""
