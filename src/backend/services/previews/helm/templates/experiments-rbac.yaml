apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "insight-previews.fullname" . }}-experiments
  namespace: {{ .Values.experiments.namespace }}
  labels:
    {{- include "insight-previews.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "list", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "list", "delete"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["create", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "insight-previews.fullname" . }}-experiments
  namespace: {{ .Values.experiments.namespace }}
  labels:
    {{- include "insight-previews.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "insight-previews.fullname" . }}-experiments
subjects:
  - kind: ServiceAccount
    name: {{ include "insight-previews.fullname" . }}
    namespace: {{ .Release.Namespace }}
