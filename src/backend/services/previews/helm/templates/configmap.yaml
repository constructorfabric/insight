apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "insight-previews.fullname" . }}-gears-config
  labels:
    {{- include "insight-previews.labels" . | nindent 4 }}
data:
  # gears-rust host config. Everything is structural — previews has no
  # database and no credentials; the per-stand leaf (route_host) is not a
  # secret, so the whole config rides this ConfigMap.
  #
  # Auth ENABLED: the upstream `cf-gears-oidc-authn-plugin` verifies the ES256
  # gateway JWT (signature / iss / aud / exp) against the authenticator's JWKS —
  # resolved via OIDC discovery on the issuer — and maps its claims straight into
  # the SecurityContext (NGINX_BFF R1). The issuer / discovery / audience are
  # rendered below from `.Values.gateway.*`; there is no `authverify` wrapper and
  # no `X-Tenant-ID` selector. No auth_disabled path.
  insight.yaml: |
    server:
      home_dir: "/app/data"

    logging:
      default:
        console_level: info

    gears:
      api-gateway:
        config:
          bind_addr: "0.0.0.0:{{ .Values.service.port }}"
          # Auth ENABLED: the oidc-authn-plugin verifies the ES256 gateway JWT
          # and maps its claims into the SecurityContext (R1).
          auth_disabled: false
          cors_enabled: false
          enable_docs: false
          openapi:
            title: "Insight Previews API"
            version: "1.0.0"
            description: "Preview experiments API"

      gear-orchestrator:
        config: {}

      grpc-hub:
        config:
          listen_addr: "uds:///tmp/previews-grpc"

      authn-resolver:
        config:
          vendor: "hyperspot"

      # Downstream gateway-JWT verification (NGINX_BFF R1). Verifies the ES256
      # gateway JWT against the authenticator's JWKS (resolved via OIDC discovery
      # on the issuer) and maps its claims into the SecurityContext. Rendered
      # from `.Values.gateway.*`; the plugin resolves the JWKS over https only.
      oidc-authn-plugin:
        config:
          vendor: "hyperspot"
          priority: 50
          jwt:
            supported_algorithms: ["ES256"]
            clock_skew_leeway: 60s
            require_audience: true
            expected_audience:
              - {{ .Values.gateway.audience | default "internal-services" | quote }}
            # `issuer` = the token `iss` (authenticator gateway_issuer);
            # `discovery_url` defaults to `{issuer}` when unset.
            trusted_issuers:
              - issuer: {{ tpl (.Values.gateway.issuer | default "") . | quote }}
                {{- with .Values.gateway.discoveryUrl }}
                discovery_url: {{ tpl . $ | quote }}
                {{- end }}
            # tenant_id is REQUIRED (mapped to subject_tenant_id) — a token
            # without it is rejected ("no tenant, no auth").
            claim_mapping:
              subject_id: "sub"
              subject_tenant_id: "tenant_id"
              subject_type: "sub_type"
              token_scopes: "roles"
            required_claims: []
          http_client:
            request_timeout: 5s
            {{- with .Values.gateway.caCertPaths }}
            # Extra trust roots for the discovery/JWKS TLS (e.g. an internal CA).
            custom_ca_certificate_paths:
              {{- toYaml . | nindent 14 }}
            {{- end }}
          # Client-credentials exchange is unused here but required config;
          # discovery_url must name a trusted issuer, never fetched.
          s2s_oauth:
            discovery_url: {{ tpl (.Values.gateway.issuer | default "") . | quote }}
            default_subject_type: "service"
            token_cache:
              ttl: 300s
              max_entries: 100

      authz-resolver:
        config:
          vendor: "hyperspot"

      static-authz-plugin:
        config:
          vendor: "hyperspot"
          priority: 100

      tenant-resolver:
        config:
          vendor: "hyperspot"

      # Derives the tenant from the SecurityContext at request time; the
      # oidc-authn-plugin sets it from the gateway JWT's single `tenant_id`.
      single-tenant-tr-plugin:
        config:
          vendor: "hyperspot"
          priority: 20

      previews:
        config:
          # INVARIANT: `namespace` and the Role/RoleBinding in
          # experiments-rbac.yaml render from the same `experiments.namespace`
          # value — set independently they drift and every create 403s.
          namespace: {{ .Values.experiments.namespace | quote }}
          gateway_name: {{ .Values.sharedGateway.name | quote }}
          gateway_namespace: {{ .Values.sharedGateway.namespace | quote }}
          gateway_section_name: {{ .Values.sharedGateway.sectionName | quote }}
          # Empty fails create closed (failed_precondition) until the stand
          # sets it.
          route_host: {{ .Values.experiments.routeHost | quote }}
          base_path: {{ .Values.experiments.basePath | quote }}
          max_experiments: {{ .Values.experiments.maxExperiments }}
          # The registry token is a credential; it rides a Secret-backed env
          # override, never this ConfigMap.
          registry_url: {{ .Values.experiments.registryUrl | quote }}
          default_ttl_days: {{ .Values.experiments.defaultTtlDays }}
          max_ttl_days: {{ .Values.experiments.maxTtlDays }}
          sweep_interval_secs: {{ .Values.experiments.sweepIntervalSecs }}
