[package]
name = "previews"
version = "0.1.0"
description = "Preview experiments — manages the per-experiment FE Deployment/Service/HTTPRoute trio"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
toolkit = { workspace = true, features = ["bootstrap"] }

api_gateway = { workspace = true }
authn-resolver = { workspace = true }
oidc-authn-plugin = { workspace = true }
authz-resolver = { workspace = true }
tenant-resolver = { workspace = true }
single-tenant-tr-plugin = { workspace = true }
static-authz-plugin = { workspace = true }
grpc_hub = { workspace = true }
service_discovery = { workspace = true }
types_registry = { workspace = true }

anyhow = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
tracing = { workspace = true }

chrono = { workspace = true }
uuid = { workspace = true }
regex-lite = { workspace = true }

reqwest = { workspace = true }

kube = { workspace = true, features = ["client", "rustls-tls", "aws-lc-rs"] }
k8s-openapi = { workspace = true, features = ["latest"] }

toolkit-security = { workspace = true }
insight-log-context = { workspace = true }
insight-openapi = { workspace = true }
toolkit-canonical-errors = { workspace = true }
utoipa = { workspace = true, features = ["chrono", "uuid"] }

[dev-dependencies]
insight-log-context = { workspace = true, features = ["test-support"] }
