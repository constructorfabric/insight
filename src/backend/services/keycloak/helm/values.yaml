# insight-keycloak — the stack's Keycloak (identity broker, ADR-0003).
# Always production shape: `start`, MariaDB-backed, bootstrap admin from a
# Secret. Realm content is applied by the umbrella's keycloak-config-cli Job
# — no realm import, no admin-UI channel.
replicaCount: 1

image:
  repository: quay.io/keycloak/keycloak
  tag: "26.4"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8085

# Advertised issuer base (browser- AND authenticator-facing). MUST end with
# /kc — Keycloak 26 hostname-v2 drops --http-relative-path from the
# advertised issuer.
hostname: ""

# Admin console base URL. The ingress never exposes /kc/admin — admin access
# is `kubectl port-forward svc/<release>-keycloak <service.port>`, and this
# is the URL the console advertises for that. Empty = derived as
# http://localhost:<service.port>/kc.
adminHostname: ""

# Secret with keys `username`/`password` (bootstrap admin).
admin:
  existingSecret: ""

# MariaDB connection; password via secretKeyRef.
database:
  host: ""
  port: 3306
  name: "keycloak"
  username: ""
  passwordSecret: {name: "", key: ""}

# Optional ingress exposing only /kc/realms and /kc/resources (Keycloak
# serves under /kc natively — no rewrite). /kc/admin stays cluster-internal;
# see adminHostname.
ingress:
  enabled: false
  className: nginx
  host: ""
  annotations: {}

resources:
  requests: {cpu: 100m, memory: 384Mi}
  limits: {cpu: "1", memory: 768Mi}
