apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "insight-keycloak.fullname" . }}
  labels:
    {{- include "insight-keycloak.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "insight-keycloak.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "insight-keycloak.selectorLabels" . | nindent 8 }}
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: keycloak
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - start
            - --http-relative-path=/kc
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ required "admin.existingSecret is required" .Values.admin.existingSecret | quote }}
                  key: username
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.admin.existingSecret | quote }}
                  key: password
            - name: KC_DB
              value: mariadb
            - name: KC_DB_URL_HOST
              value: {{ tpl (required "database.host is required" .Values.database.host) . | quote }}
            - name: KC_DB_URL_PORT
              value: {{ .Values.database.port | quote }}
            - name: KC_DB_URL_DATABASE
              value: {{ .Values.database.name | quote }}
            - name: KC_DB_USERNAME
              value: {{ required "database.username is required" .Values.database.username | quote }}
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "database.passwordSecret.name is required" .Values.database.passwordSecret.name | quote }}
                  key: {{ required "database.passwordSecret.key is required" .Values.database.passwordSecret.key | quote }}
            # TLS terminates at the ingress; trust its X-Forwarded-* headers.
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_HEALTH_ENABLED
              value: "true"
            # Advertised (browser + authenticator) issuer base. MUST include /kc.
            - name: KC_HOSTNAME
              value: {{ tpl (required "keycloak.hostname is required (the URL both the browser and the authenticator reach, e.g. https://<host>/kc)" .Values.hostname) . | quote }}
            # Serve back-channel (token/JWKS) on the reached host too, so an
            # in-cluster caller works alongside the advertised issuer.
            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
              value: "true"
            # Admin console base. The ingress does not expose /kc/admin, so
            # the console is advertised on the port-forward URL (default
            # localhost:<service.port>) instead of KC_HOSTNAME.
            - name: KC_HOSTNAME_ADMIN
              value: {{ default (printf "http://localhost:%v/kc" .Values.service.port) .Values.adminHostname | quote }}
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HTTP_PORT
              value: {{ .Values.service.port | quote }}
            - name: JAVA_OPTS_APPEND
              value: "-Xms256m -Xmx512m"
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
            - name: mgmt
              containerPort: 9000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            # No readOnlyRootFilesystem: Keycloak re-augments Quarkus into
            # /opt/keycloak/lib/quarkus on boot, and an emptyDir there hides
            # quarkus-application.dat from the image. See #2084.
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # Health lives on the management interface (KC 25+); its path
          # inherits --http-relative-path.
          startupProbe:
            httpGet: {path: /kc/health/started, port: mgmt}
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /kc/health/live, port: mgmt}
            periodSeconds: 15
          readinessProbe:
            httpGet: {path: /kc/health/ready, port: mgmt}
            periodSeconds: 10
