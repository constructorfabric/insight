{{- if .Values.route.enabled }}
# Keycloak serves under /kc natively (--http-relative-path) and discovery
# emits absolute URLs off KC_HOSTNAME (= .Values.hostname), so no rewrite.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "insight-keycloak.fullname" . }}
  labels:
    {{- include "insight-keycloak.labels" . | nindent 4 }}
  {{- with .Values.route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - name: {{ .Values.route.parentRef.name }}
      namespace: {{ .Values.route.parentRef.namespace }}
      {{- with .Values.route.parentRef.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  {{- if .Values.route.host }}
  hostnames:
    - {{ .Values.route.host | quote }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /kc/realms
        - path:
            type: PathPrefix
            value: /kc/resources
      backendRefs:
        - name: {{ include "insight-keycloak.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
