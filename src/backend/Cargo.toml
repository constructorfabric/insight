[workspace]
members = [
    "libs/insight-clickhouse",
    "libs/insight-http-metrics",
    "libs/insight-log-context",
    "libs/insight-migration",
    "libs/insight-openapi",
    "libs/authenticator-sdk",
    "services/analytics",
    "services/git-cli-proxy",
    "services/insight-v3-core",
    "services/identity-resolution",
    "services/previews",
    "services/authenticator",
    "tools/routegen",
]
resolver = "3"

[profile.e2e]
inherits = "release"
opt-level = 1
codegen-units = 256
debug = false

[workspace.package]
edition = "2024"
license = "Apache-2.0"
authors = ["Constructor Fabric"]
repository = "https://github.com/constructorfabric/insight"
rust-version = "1.98.1"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_mut = "warn"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"

[workspace.dependencies]
clickhouse = { version = "0.15", features = ["uuid", "chrono"] }

sqlparser = "0.63"
schemars = "1.2"
rmcp = { version = "3.2", default-features = false, features = ["macros", "server", "transport-streamable-http-server"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
utoipa = "5.5"

thiserror = "2.0"
anyhow = "1.0"

tokio = { version = "1.47", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
async-trait = "0.1"
futures = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

axum = "0.8"

sea-orm = { version = "2.0", features = ["runtime-tokio", "sqlx-mysql", "with-uuid", "with-chrono", "with-json", "macros"] }
sea-orm-migration = { version = "2.0", features = ["runtime-tokio", "sqlx-mysql"] }

uuid = { version = "1.19", features = ["serde", "v7"] }
url = "2.5"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
base64 = "0.23"
zeroize = "1.8"
hex = "0.4"
csv = "1.3"
rust_xlsxwriter = { version = "0.102", features = ["constant_memory"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

secrecy = { version = "0.10", features = ["serde"] }

reqwest = { version = "0.12", features = ["json"] }

redis = { version = "1.5", features = ["tokio-comp", "connection-manager"] }
bullmq = { package = "bullmq-official", version = "=1.4.4" }

# One version + one crypto provider (aws_lc_rs) across the workspace: v10 needs
# exactly one provider process-wide under feature unification, else it panics.
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs", "use_pem"] }

serde_yaml = "0.9"

clap = { version = "4.5", features = ["derive"] }

toolkit = { package = "cf-gears-toolkit", version = "=0.12.1" }
toolkit-auth = { package = "cf-gears-toolkit-auth", version = "=0.8.4" }
toolkit-security = { package = "cf-gears-toolkit-security", version = "=0.12.1", features = ["jwt"] }
toolkit-canonical-errors = { package = "cf-gears-toolkit-canonical-errors", version = "=0.10.0", features = ["axum", "sea-orm"] }

authn-resolver-sdk = { package = "cf-gears-authn-resolver-sdk", version = "0.3.41" }
types-registry-sdk = { package = "cf-gears-types-registry-sdk", version = "0.5.0" }

api_gateway = { package = "cf-gears-api-gateway", version = "0.7.2" }
authn-resolver = { package = "cf-gears-authn-resolver", version = "0.3.0" }
authz-resolver = { package = "cf-gears-authz-resolver", version = "0.4.0" }
oidc-authn-plugin = { package = "cf-gears-oidc-authn-plugin", version = "0.4.0" }
tenant-resolver = { package = "cf-gears-tenant-resolver", version = "0.2.0" }
static-authz-plugin = { package = "cf-gears-static-authz-plugin", version = "0.1.42" }
single-tenant-tr-plugin = { package = "cf-gears-single-tenant-tr-plugin", version = "0.1.44" }
grpc_hub = { package = "cf-gears-grpc-hub", version = "0.5.0" }
service_discovery = { package = "cf-gears-service-discovery", version = "0.4.0" }
types_registry = { package = "cf-gears-types-registry", version = "0.6.0" }

regex-lite = "0.1"

kube = { version = "5.0", default-features = false }
k8s-openapi = { version = "0.29", default-features = false }

figment = { version = "0.10", features = ["yaml", "env"] }

# INVARIANT: must match the toolkit's opentelemetry major — a different major
# is a different global meter provider and instruments silently no-op.
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["metrics", "rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "http-proto", "metrics"] }

insight-clickhouse = { path = "libs/insight-clickhouse" }
insight-http-metrics = { path = "libs/insight-http-metrics" }
insight-log-context = { path = "libs/insight-log-context" }
insight-migration = { path = "libs/insight-migration" }
insight-openapi = { path = "libs/insight-openapi" }
authenticator-sdk = { path = "libs/authenticator-sdk" }
