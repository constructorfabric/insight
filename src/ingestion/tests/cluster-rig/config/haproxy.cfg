global
    maxconn 256

defaults
    mode http
    timeout connect 5s
    timeout client 600s
    timeout server 600s
    # INVARIANT: one request, one replica — keep-alive pinning hides every
    # failure where DDL or rows reach only one replica.
    option http-server-close

frontend ch_http
    bind *:8123
    default_backend ch_replicas

backend ch_replicas
    balance roundrobin
    server ch1 ch1:8123 check
    server ch2 ch2:8123 check
