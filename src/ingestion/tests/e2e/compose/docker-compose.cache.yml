# CI-only build-cache overlay.
#
# Wires each build-only service (and the runner) to the GitHub Actions BuildKit
# cache backend so the expensive layers persist across workflow runs: the Rust
# dependency-compile layers for analytics + jira-enrich, and the runner's
# pip-install layer. On a warm cache with an unchanged Cargo.lock/pyproject.toml,
# those layers restore instead of rebuilding.
#
# NOT loaded locally — `type=gha` requires the ACTIONS_* tokens that only exist
# inside a GitHub Actions runner, plus the docker-container buildx driver from
# docker/setup-buildx-action. e2e.sh loads this only when E2E_COMPOSE_OVERLAYS
# names it (the E2E workflow sets that on the build step).
#
# Distinct `scope` per image keeps the caches from clobbering one another.
#
# Each service also reads (never writes) the scope build-images.yml seeds from
# pushes to main — same context/Dockerfile/platform, so the layers hit. Those
# main-branch caches are visible to every PR and merge-queue run, which is what
# keeps a NEW PR's first build warm; the e2e-* scopes only help re-pushes to
# the same branch. The seeded scope names must track build-images.yml
# (`<image>-amd64`; connectors use the descriptor image name).

services:
  jira-enrich:
    build:
      cache_from:
        - type=gha,scope=e2e-jira-enrich
        - type=gha,scope=insight-jira-enrich-amd64
      cache_to:
        - type=gha,mode=max,scope=e2e-jira-enrich

  analytics:
    build:
      cache_from:
        - type=gha,scope=e2e-analytics
        - type=gha,scope=analytics-amd64
      cache_to:
        - type=gha,mode=max,scope=e2e-analytics

  identity:
    build:
      cache_from:
        - type=gha,scope=e2e-identity
        - type=gha,scope=identity-amd64
      cache_to:
        - type=gha,mode=max,scope=e2e-identity

  identity-resolution:
    build:
      cache_from:
        - type=gha,scope=e2e-identity-resolution
        - type=gha,scope=identity-resolution-amd64
      cache_to:
        - type=gha,mode=max,scope=e2e-identity-resolution

  runner:
    build:
      cache_from:
        - type=gha,scope=e2e-runner
      cache_to:
        - type=gha,mode=max,scope=e2e-runner
