spec_version: 1
description: >
  Regression: a pull request is attributed to its AUTHOR, never to whoever wrote
  the commits it carries, #3176.
  How it's computed (bronze → silver → gold):
    • bronze: the pull requests a git connector reports, the account id it names
      for each author, and the commits each request links to
    • silver: one class row per request, carrying the author's address when the
      source publishes one and the author's account id when it names one
    • gold:   a request reaches a person through the author's account first and
      the author's own address second — and through nothing else

  Four requests, the same pair on each of two connectors: an author account bound
  to a person, and one bound to nobody. Neither connector publishes an author
  address here — on Bitbucket that is structural, since it has none to publish,
  which makes it the stricter of the two. Every request carries commits written
  by the same third person, who opened none of them: the condition under which an
  address borrowed from the commits would look unambiguous.

  Cases: the requests whose author account is bound reach that account's person
  for prs_created and prs_merged alike, and the ones whose account is bound to
  nobody stay unresolved rather than reaching the commit author. A request the
  source names no author for at all is the neighbouring case and belongs to
  git_pr_account_attribution, which owns it.

identity_accounts:
  # Account 9002 is alice's. Account 9001 is deliberately absent — an account
  # the identity store has never been taught about, which is what a service
  # account or a departed user looks like here.
  - {source_type: github, source_id: git-test, account_id: "9002", person: alice@example.com}
  # The same pair on Bitbucket, where it carries more weight: the connector
  # publishes no author address at all, so the account binding is the only
  # thing that can ever attribute a request.
  - {source_type: bitbucket, source_id: bitbucket-test, account_id: "bb-carol", person: carol@example.com}

bronze:
  bronze_bamboohr.employees:
    - $ref: templates/people.yaml#/templates/alice
    - $ref: templates/people.yaml#/templates/bob
    - $ref: templates/people.yaml#/templates/carol

  bronze_github.branches:
    - {$ref: templates/git_activity.yaml#/templates/base, unique_key: br-main, repository: "https://github.com/constructor/insight.git", name: main, head_sha: head-main, is_default: true}

  bronze_github.pull_requests:
    # Opened by the bound account 9002.
    - {$ref: templates/git_activity.yaml#/templates/pull_request, unique_key: pr-901, id: 901, number: 901, author_login: alice-gh, created_at: "2026-11-02T08:00:00Z", closed_at: "2026-11-03T09:00:00Z", merged_at: "2026-11-03T09:00:00Z", merge_commit_sha: merge-901}
    # Opened by the unbound account 9001.
    - {$ref: templates/git_activity.yaml#/templates/pull_request, unique_key: pr-902, id: 902, number: 902, author_login: releaser-bot, created_at: "2026-11-02T10:00:00Z", closed_at: "2026-11-03T11:00:00Z", merged_at: "2026-11-03T11:00:00Z", merge_commit_sha: merge-902}

  bronze_github.pull_request_diff_stats:
    # author_email stays empty on both: GitHub publishes an address only for
    # some authors, and the account id is what the request travels on.
    # author_id IS that account id.
    - {$ref: templates/git_activity.yaml#/templates/diff_stat, unique_key: ds-901, pull_number: 901, additions: 10, author_id: 9002}
    - {$ref: templates/git_activity.yaml#/templates/diff_stat, unique_key: ds-902, pull_number: 902, additions: 10, author_id: 9001}

  bronze_github.pull_request_commits:
    - {$ref: templates/git_activity.yaml#/templates/base, unique_key: prc-901, repo_full_name: constructor/insight, pull_number: 901, sha: hash-bob-1, author_email: bob@example.com, is_merge: false}
    - {$ref: templates/git_activity.yaml#/templates/base, unique_key: prc-902, repo_full_name: constructor/insight, pull_number: 902, sha: hash-bob-2, author_email: bob@example.com, is_merge: false}

  bronze_github.commits:
    - {$ref: templates/git_activity.yaml#/templates/commit, unique_key: commit-bob-1, sha: hash-bob-1, author_name: bob, author_email: bob@example.com, committer_name: bob, committer_email: bob@example.com, additions: 5}
    - {$ref: templates/git_activity.yaml#/templates/commit, unique_key: commit-bob-2, sha: hash-bob-2, author_name: bob, author_email: bob@example.com, committer_name: bob, committer_email: bob@example.com, additions: 5}

  # Bitbucket is the provider that publishes no author address whatsoever, so a
  # request there rests on the account binding alone. One bound account, one the
  # store has never seen, and bob's commits on both.
  bronze_bitbucket_cloud.pull_requests:
    - {$ref: templates/bitbucket_git.yaml#/templates/pull_request, unique_key: "bb-pr:801", id: 801, author_display_name: Carol Gamma, author_account_id: bb-carol, created_on: "2026-11-02T08:00:00Z", updated_on: "2026-11-03T09:00:00Z", source_commit_sha: bb-src-801, destination_commit_sha: bb-dst-801, merge_commit_sha: bb-merge-801}
    - {$ref: templates/bitbucket_git.yaml#/templates/pull_request, unique_key: "bb-pr:802", id: 802, author_display_name: Releaser Bot, author_account_id: bb-unbound, created_on: "2026-11-02T10:00:00Z", updated_on: "2026-11-03T11:00:00Z", source_commit_sha: bb-src-802, destination_commit_sha: bb-dst-802, merge_commit_sha: bb-merge-802}

  bronze_bitbucket_cloud.pull_request_activity:
    # A Bitbucket request records no close time of its own; the terminal update
    # event in its activity is what gives prs_merged a date.
    - {$ref: templates/bitbucket_git.yaml#/templates/activity, unique_key: "bb-ac:801", pr_id: 801, update_state: MERGED, event_date: "2026-11-03T09:00:00Z"}
    - {$ref: templates/bitbucket_git.yaml#/templates/activity, unique_key: "bb-ac:802", pr_id: 802, update_state: MERGED, event_date: "2026-11-03T11:00:00Z"}

  bronze_bitbucket_cloud.pull_request_commits:
    - {$ref: templates/bitbucket_git.yaml#/templates/pull_request_commit, unique_key: "bb-prc:801", pr_id: 801, sha: bb-hash-bob-1, author_email: bob@example.com, author_name: bob, committed_date: "2026-11-02T07:00:00Z"}
    - {$ref: templates/bitbucket_git.yaml#/templates/pull_request_commit, unique_key: "bb-prc:802", pr_id: 802, sha: bb-hash-bob-2, author_email: bob@example.com, author_name: bob, committed_date: "2026-11-02T09:00:00Z"}

  bronze_bitbucket_cloud.commits:
    - {$ref: templates/bitbucket_git.yaml#/templates/commit, unique_key: "bb-c:1", sha: bb-hash-bob-1, author_name: bob, author_email: bob@example.com, committer_name: bob, committer_email: bob@example.com, committed_date: "2026-11-02T07:00:00Z", additions: 5}
    - {$ref: templates/bitbucket_git.yaml#/templates/commit, unique_key: "bb-c:2", sha: bb-hash-bob-2, author_name: bob, author_email: bob@example.com, committer_name: bob, committer_email: bob@example.com, committed_date: "2026-11-02T09:00:00Z", additions: 5}

cases:
  - name: A bound author account takes its request and an unbound one takes nobody
    request:
      url: /v1/metric-results
      method: POST
      body:
        entity: {type: person, ids: [alice@example.com, bob@example.com, carol@example.com]}
        period: {from: "2026-11-01", to: "2026-11-30"}
        metrics:
          - metric_key: git.prs_created
            views: [{view: period}]
          - metric_key: git.prs_merged
            views: [{view: period}]
    expect:
      - assert: "status == 200"
      # pr-901 only. Account 9002 is alice's, so the request is hers even though
      # every commit on it is bob's.
      - {metric: git.prs_created, view: period, find: {entity_id: alice@example.com}, equal: {value: 1}}
      - {metric: git.prs_merged, view: period, find: {entity_id: alice@example.com}, equal: {value: 1}}
      # bb-pr:801 only, and on Bitbucket the binding is doing all of the work:
      # the connector publishes no author address, so nothing else could have
      # carried this request to her.
      - {metric: git.prs_created, view: period, find: {entity_id: carol@example.com}, equal: {value: 1}}
      - {metric: git.prs_merged, view: period, find: {entity_id: carol@example.com}, equal: {value: 1}}
      # Bob wrote the commits on all four requests and opened none. The unbound
      # accounts (pr-902, bb-pr:802) leave their requests unresolved rather than
      # turning his commits into a claim on his behalf — for the creation date
      # and the merge date, on either connector.
      - {metric: git.prs_created, view: period, find: {entity_id: bob@example.com}, equal: {value: null}}
      - {metric: git.prs_merged, view: period, find: {entity_id: bob@example.com}, equal: {value: null}}
