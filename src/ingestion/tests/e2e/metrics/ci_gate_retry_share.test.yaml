description: >
  Metric: ci.gate_retry_share — share of gate runs whose final state came from
  a re-run (tenant-grain, issue #2803).
  How it's computed (bronze → silver → gold):
    • bronze: workflow run attempts; a re-run arrives as a higher run_attempt
    • silver: a run counts once at its LAST attempt; retried = that attempt > 1
    • gold:   retried gate runs / gate runs

  Seeded: four gate runs, one of them on attempt 2 → 25%.
  Cases: period 25, daily point, per-pipeline breakdown.
bronze:
  bronze_github.workflow_runs:
    - $ref: templates/github_ci.yaml#/templates/workflow_run
      unique_key: gh-run-t1
      id: 1
      run_number: 1
    - $ref: templates/github_ci.yaml#/templates/workflow_run
      unique_key: gh-run-t2
      id: 2
      run_number: 2
    - $ref: templates/github_ci.yaml#/templates/workflow_run
      unique_key: gh-run-t3
      id: 3
      run_number: 3
      run_attempt: 2
    - $ref: templates/github_ci.yaml#/templates/workflow_run
      unique_key: gh-run-t4
      id: 4
      run_number: 4
      conclusion: failure
cases:
  - name: retry share counts a run once, at its last attempt
    request:
      url: /v1/metric-results
      method: POST
      body:
        entity: { type: tenant }
        period: { from: "2026-03-01", to: "2026-03-07" }
        metrics:
          - metric_key: ci.gate_retry_share
            views:
              - { view: period }
              - { view: timeseries, bucket: day }
              - { view: breakdown, dimensions: [pipeline] }
    expect:
      - assert: "status == 200"
      - metric: ci.gate_retry_share
        view: period
        find: { entity_id: "11111111-1111-1111-1111-111111111111" }
        assert: "double(it.value) == 25.0"
      - metric: ci.gate_retry_share
        view: timeseries
        assert: "items.exists(s, s.points.exists(p, p.bucket_start == '2026-03-01' && double(p.value) == 25.0))"
      - metric: ci.gate_retry_share
        view: breakdown
        assert: "items.exists(v, v.dimensions.exists(d, d.key == 'pipeline' && d.value == '.github/workflows/ci.yml') && double(v.value) == 25.0)"
