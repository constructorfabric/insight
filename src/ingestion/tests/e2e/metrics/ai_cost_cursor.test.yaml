spec_version: 1
description: >
  Metric: ai.cost — the Cursor input, #1952.
  How it's computed (bronze → silver → gold):
    • bronze: Cursor prices usage per event, and ships those events twice — an
              hourly stream whose amount Cursor may still recompute, plus a
              next-day re-fetch carrying the finalized amount for the same event
    • silver: the two event streams are folded into one row per event (latest
              wins), the day's amounts are summed per developer, and that total
              lands on the developer's day alongside their activity counters
    • gold:   metric = sum of those daily amounts over the window, in dollars

  What the amount means: an event's charged amount ALREADY includes Cursor's
  token fee, so only the charged amount is summed — adding the fee on top
  double-counts it. Usage the team's seats already cover counts too: the metric
  is what the usage costs at Cursor's rates, not the amount invoiced.

  Seeded (all on 2026-01-05 unless stated):
    alice — 500¢ charged with a 150¢ token fee (fee must NOT add) + 300¢ covered
            by the subscription (must still count) + one event re-priced DOWN by
            the next-day re-fetch, 420¢ → 250¢ (counts once, at 250¢)
            → $10.50. Also active on 2026-01-06 with lines but no priced event
            → that day contributes nothing and reads as "not tracked", not $0.
    bob   — 200¢ from Cursor + 3¢ from Claude Code the same day → $2.03 total,
            split by tool in the breakdown.
    carol — three 0.6¢ events → summed then rounded once = 2¢ ($0.02).
  Cases: cursor cost · fee not double-counted · downward restatement ·
         cross-tool sum · fractional cents · active day without priced events
         (null, not 0).

bronze:
  bronze_bamboohr.employees:
    - $ref: templates/people.yaml#/templates/alice
    - $ref: templates/people.yaml#/templates/bob
    - $ref: templates/people.yaml#/templates/carol

  bronze_cursor.cursor_daily_usage:
    # date 1767571200000 ms = 2026-01-05; 1767657600000 ms = 2026-01-06.
    - $ref: templates/cursor_usage.yaml#/templates/alice
      unique_key: cursor-alice-20260105
      date: 1767571200000
      acceptedLinesAdded: 40
    - $ref: templates/cursor_usage.yaml#/templates/alice
      unique_key: cursor-alice-20260106
      date: 1767657600000
      acceptedLinesAdded: 5
    - $ref: templates/cursor_usage.yaml#/templates/bob
      unique_key: cursor-bob-20260105
      date: 1767571200000
      acceptedLinesAdded: 20
    - $ref: templates/cursor_usage.yaml#/templates/carol
      unique_key: cursor-carol-20260105
      date: 1767571200000
      acceptedLinesAdded: 10

  bronze_cursor.cursor_usage_events:
    # timestamp 1767585600000 ms = 2026-01-05 04:00 UTC (inside the day above).
    # alice: charged 500¢ WITH a 150¢ token fee already inside it → adds 500, not 650.
    - $ref: templates/cursor_events.yaml#/templates/alice
      unique_key: cursor-ev-alice-1
      timestamp: "1767585600000"
      chargedCents: 500
      cursorTokenFee: 150
    - $ref: templates/cursor_events.yaml#/templates/alice   # re-sync dup → must NOT double
      unique_key: cursor-ev-alice-1
      timestamp: "1767585600000"
      chargedCents: 500
      cursorTokenFee: 150
    # alice: covered by the subscription — priced usage, still counts. Mixed-case
    # and padded email: the day's events and the daily-usage row come from
    # different endpoints, so the join must normalize both sides.
    - $ref: templates/cursor_events.yaml#/templates/alice
      unique_key: cursor-ev-alice-2
      timestamp: "1767589200000"
      chargedCents: 300
      kind: "Included in Business"
      userEmail: " Alice@Example.com"
    # alice: initial amount, superseded by the finalized resync row below. The
    # restatement goes DOWN (420 → 250) so picking the larger amount, or the
    # earlier row, both fail — only extraction order gives 250.
    - $ref: templates/cursor_events.yaml#/templates/alice
      unique_key: cursor-ev-alice-3
      timestamp: "1767592800000"
      chargedCents: 420
      _airbyte_extracted_at: "2026-01-05T05:00:00Z"
    # bob: plain usage-based event.
    - $ref: templates/cursor_events.yaml#/templates/bob
      unique_key: cursor-ev-bob-1
      timestamp: "1767585600000"
      chargedCents: 200
    # carol: three fractional amounts on one day → 0.6+0.6+0.6 = 1.8¢, summed
    # THEN rounded = 2¢. Rounding per event would give 3¢, truncating 1¢.
    - $ref: templates/cursor_events.yaml#/templates/carol
      unique_key: cursor-ev-carol-1
      timestamp: "1767585600000"
      chargedCents: 0.6
    - $ref: templates/cursor_events.yaml#/templates/carol
      unique_key: cursor-ev-carol-2
      timestamp: "1767589200000"
      chargedCents: 0.6
    - $ref: templates/cursor_events.yaml#/templates/carol
      unique_key: cursor-ev-carol-3
      timestamp: "1767592800000"
      chargedCents: 0.6

  bronze_cursor.cursor_usage_events_daily_resync:
    # Same unique_key as cursor-ev-alice-3, extracted later with the finalized
    # amount → 250¢ replaces 420¢ and is counted once.
    - $ref: templates/cursor_events.yaml#/templates/alice
      unique_key: cursor-ev-alice-3
      timestamp: "1767592800000"
      chargedCents: 250
      _airbyte_extracted_at: "2026-01-06T00:00:00Z"

  bronze_claude_team.claude_team_code_metrics:
    # bob also uses Claude Code that day → 3¢, summed with Cursor's 200¢.
    - $ref: templates/claude_team_usage.yaml#/templates/bob
      metric_date: "2026-01-05"
      unique_key: cc-bob-20260105
      total_cost: "0.03"
