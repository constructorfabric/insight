description: >
  Metric: ci.commits_observed — commits the git connector collected, dated at
  their commit time (tenant-grain, issue #2803). The denominator of the
  run-to-commit join-coverage panel.
  How it's computed (bronze → silver → gold):
    • bronze: the commits stream
    • silver: the commit class accumulates
    • gold:   one event row per collected commit, dated at commit time

  Seeded: two commits on different days → period 2, one daily point each.
  Cases: period total, per-day points.
bronze:
