description: >
  Metric: ci.run_duration_min_p90 — the 90th percentile of gate run duration,
  minutes (tenant-grain, issue #2803). First metric on the new percentile
  computation.
  How it's computed (bronze → silver → gold):
    • bronze: workflow run attempts with start and finish timestamps
    • silver: duration = finish − start of the LAST attempt, minutes; only
      decided gate runs carry one
    • gold:   per-run duration rows kept at event grain; p90 is the exact
      0.9-quantile over runs in the period, org-wide

  Seeded: nine gate runs of 1..9 minutes. Exact-quantile p90 lands on a high
  element of that set — pinned to [8, 9] so an off-by-one rank fails while the
  test stays engine-honest; the histogram view must expose the event rows.
  Cases: p90 over 1..9, histogram availability.
