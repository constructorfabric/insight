cases:
  - name: p90 duration reads the tail of the run distribution
    request:
      url: /v1/metric-results
      method: POST
      body:
        entity: { type: tenant }
        period: { from: "2026-03-01", to: "2026-03-07" }
        metrics:
          - metric_key: ci.run_duration_min_p90
            views:
              - { view: period }
              - { view: histogram }
              - { view: timeseries, bucket: day }
              - { view: breakdown, dimensions: [pipeline] }
    expect:
      - assert: "status == 200"
      - metric: ci.run_duration_min_p90
        view: period
        find: { entity_id: "11111111-1111-1111-1111-111111111111" }
        assert: "double(it.value) >= 8.0 && double(it.value) <= 9.0"
      - metric: ci.run_duration_min_p90
        view: histogram
        find: { entity_id: "11111111-1111-1111-1111-111111111111" }
        assert: "size(it.bins) > 0"
      - metric: ci.run_duration_min_p90
        view: timeseries
        assert: "items.exists(s, s.points.exists(p, p.bucket_start == '2026-03-02' && double(p.value) >= 8.0 && double(p.value) <= 9.0))"
      - metric: ci.run_duration_min_p90
        view: breakdown
        assert: "items.exists(v, v.dimensions.exists(d, d.key == 'pipeline' && d.value == '.github/workflows/ci.yml') && double(v.value) >= 8.0 && double(v.value) <= 9.0)"
