spec_version: 1
description: >
  Bitbucket Cloud git metrics. Seeds the connector's bronze and drives it through
  the bitbucket_cloud__commits / __file_changes / __pull_requests staging models
  into the shared git classes. Assertions use the `source=bitbucket_cloud`
  breakdown so they are unaffected by any other git connector seeded in the suite.

  Fixture covers:
    * line counts come from the file-change rows, so a commit with no file
      changes contributes zero rather than dropping out;
    * a merge commit is excluded from the commit count;
    * pull-request line totals are summed from the per-file diffstat rows, and
      closed_on comes from the terminal MERGED activity event.

bronze:
  bronze_bamboohr.employees:
    - $ref: templates/people.yaml#/templates/erin

  bronze_bitbucket_cloud.commits:
    - { $ref: templates/bitbucket_git.yaml#/templates/commit, unique_key: "c:commit-a", sha: commit-a, author_name: Erin Epsilon, author_email: erin@example.com, committer_name: Erin Epsilon, committer_email: erin@example.com, additions: 10, deletions: 2, changed_files: 1 }
    - { $ref: templates/bitbucket_git.yaml#/templates/commit, unique_key: "c:commit-b", sha: commit-b, author_name: Erin Epsilon, author_email: erin@example.com, committer_name: Erin Epsilon, committer_email: erin@example.com }
    # Merge commits are excluded from the commit count.
    - { $ref: templates/bitbucket_git.yaml#/templates/commit, unique_key: "c:commit-m", sha: commit-m, author_name: Erin Epsilon, author_email: erin@example.com, committer_name: Erin Epsilon, committer_email: erin@example.com, is_merge: true }

  bronze_bitbucket_cloud.file_changes:
    # commit-a changed one file; commit-b changed none, so it contributes zero.
    - { $ref: templates/bitbucket_git.yaml#/templates/file_change, unique_key: "fc:commit-a:a.py", sha: commit-a, filename: src/a.py, additions: 10, deletions: 2, changes: 12 }

  bronze_bitbucket_cloud.pull_requests:
    - { $ref: templates/bitbucket_git.yaml#/templates/pull_request, unique_key: "pr:1", id: 1, author_display_name: Erin Epsilon, source_commit_sha: src-1, destination_commit_sha: dst-1, merge_commit_sha: merge-1 }

  bronze_bitbucket_cloud.pull_request_diffstat:
    - { $ref: templates/bitbucket_git.yaml#/templates/diffstat, unique_key: "ds:1:a.py", pr_id: 1, file_path: src/a.py, lines_added: 5, lines_removed: 1 }
    - { $ref: templates/bitbucket_git.yaml#/templates/diffstat, unique_key: "ds:1:b.py", pr_id: 1, file_path: src/b.py, lines_added: 3, lines_removed: 0 }

  bronze_bitbucket_cloud.pull_request_activity:
    - { $ref: templates/bitbucket_git.yaml#/templates/activity, unique_key: "ac:1:ev1", pr_id: 1, update_state: MERGED }

cases:
  - name: Bitbucket git metrics build and resolve through the source breakdown
    request:
      url: /v1/metric-results
      method: POST
      body:
        entity: { type: person, ids: [erin@example.com] }
        period: { from: "2026-10-01", to: "2026-10-02" }
        metrics:
          - metric_key: git.commits
            views:
              - { view: period }
              - { view: breakdown, dimensions: [source] }
          - metric_key: git.lines_added
            views:
              - { view: breakdown, dimensions: [source] }
          - metric_key: git.lines_removed
            views:
              - { view: breakdown, dimensions: [source] }
    expect:
      - assert: "status == 200"
      # commit-a and commit-b count; the merge commit does not.
      - metric: git.commits
        view: breakdown
        find: { entity_id: erin@example.com, dimensions: { key: source, value: bitbucket_cloud } }
        equal: { value: 2 }
      # Lines come from the file-change rows: only commit-a changed a file.
      - metric: git.lines_added
        view: breakdown
        find: { entity_id: erin@example.com, dimensions: { key: source, value: bitbucket_cloud } }
        equal: { value: 10 }
      - metric: git.lines_removed
        view: breakdown
        find: { entity_id: erin@example.com, dimensions: { key: source, value: bitbucket_cloud } }
        equal: { value: 2 }

  - name: Bitbucket git metrics empty window
    request:
      url: /v1/metric-results
      method: POST
      body:
        entity: { type: person, ids: [erin@example.com] }
        period: { from: "2025-01-01", to: "2025-01-31" }
        metrics:
          - { metric_key: git.commits, views: [{ view: period }] }
    expect:
      - assert: "status == 200"
      - { metric: git.commits, view: period, find: { entity_id: erin@example.com }, equal: { value: null } }
