# Reusable Claude Team seat-spend records (bronze_claude_team.claude_team_overage_spend).
# Base carries every schema column (unused = null) incl. the 4 _airbyte_* CDK
# columns. Variants override identity (account_email, account_uuid) only; the
# fields under test (_airbyte_extracted_at, used_credits, monthly_credit_limit)
# are set in each test's `bronze`. The staging model requires a non-empty
# account_uuid AND account_email, and stamps period_month, the silver
# unique_key and collected_at from _airbyte_extracted_at.
templates:
  claude_team_seat:
    _airbyte_raw_id: "00000000-0000-0000-0000-000000000000"
    _airbyte_extracted_at: "2026-01-05T00:00:00Z"
    _airbyte_meta: "{}"
    _airbyte_generation_id: 0
    tenant_id: "11111111-1111-1111-1111-111111111111"
    source_id: "claude-team-test"
    unique_key: null
    collected_at: null
    data_source: "insight_claude_team"
    account_uuid: null
    account_email: null
    account_name: null
    seat_tier: "team_tier_1"
    is_enabled: true
    monthly_credit_limit: null
    used_credits: null
    currency: "USD"
    out_of_credits: null
    used_credits_basis: "post_discount"
    limit_type: "seat_tier"
    disabled_reason: null
    disabled_until: null

  alice:
    $ref: "#/templates/claude_team_seat"
    account_email: alice@example.com
    account_uuid: seat-alice

  bob:
    $ref: "#/templates/claude_team_seat"
    account_email: bob@example.com
    account_uuid: seat-bob

  carol:
    $ref: "#/templates/claude_team_seat"
    account_email: carol@example.com
    account_uuid: seat-carol

  dave:
    $ref: "#/templates/claude_team_seat"
    account_email: dave@example.com
    account_uuid: seat-dave

  erin:
    $ref: "#/templates/claude_team_seat"
    account_email: erin@example.com
    account_uuid: seat-erin

  # A seat holder absent from the HR feed, so outside every org-unit cohort: a
  # test can give this seat no ceiling without shrinking a peer pool below the
  # five contributors the peer view needs.
  frank:
    $ref: "#/templates/claude_team_seat"
    account_email: frank@example.com
    account_uuid: seat-frank
