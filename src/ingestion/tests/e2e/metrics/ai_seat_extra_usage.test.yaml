spec_version: 1
description: >
  Metrics: ai.extra_usage_cost and ai.extra_usage_utilisation — Claude Team seat spend.
  How they're computed (bronze → silver → gold):
    • bronze: per-seat spend snapshot, used_credits and monthly_credit_limit ALREADY in cents
    • silver: latest snapshot per seat per calendar month, stamped period_month from
              the extraction time
    • gold:   one evidence row per seat-month per measure, dated at the day the snapshot
              was last read — NOT the first of the billing month, which would fall
              outside short rolling windows.

  used_credits IS the money: the vendor bills it only once a seat has exhausted the
  usage included in its fee. It is NOT the excess over monthly_credit_limit, which is
  an enforced ceiling on that same spend. Every seat below is under its ceiling, so a
  model computing max(0, used − limit) would return 0 for all of them and every
  ai.extra_usage_cost assertion here would fail.

  Department: 5 Engineering members. Two snapshots each, read Nov 15 and Dec 10, both
  inside the custom window (Nov 01 .. Dec 12):

    person   Nov used   Dec used   window sum   ceiling/month   window utilisation
    alice        100¢        50¢        150¢    (none)          — no denominator
    bob          200¢       100¢        300¢          1000¢     300/2000 = 15.0 %
    carol        300¢       150¢        450¢          1000¢     450/2000 = 22.5 %
    dave         400¢       200¢        600¢          1000¢     600/2000 = 30.0 %
    erin         500¢       250¢        750¢          1000¢     750/2000 = 37.5 %

  alice carries no ceiling, so she is present in ai.extra_usage_cost and absent from
  ai.extra_usage_utilisation — honest-NULL, not a zero. Cases: custom scope · the
  no-ceiling seat · empty window.

bronze:
  bronze_bamboohr.employees:
    - $ref: templates/people.yaml#/templates/alice
    - $ref: templates/people.yaml#/templates/bob
    - $ref: templates/people.yaml#/templates/carol
    - $ref: templates/people.yaml#/templates/dave
    - $ref: templates/people.yaml#/templates/erin

  bronze_claude_team.claude_team_overage_spend:
    # ── alice — NO ceiling: money yes, utilisation absent ────────────────────────
    - { $ref: templates/claude_team_overage.yaml#/templates/alice, _airbyte_extracted_at: "2026-11-15T00:00:00Z", unique_key: seat-alice, used_credits: 100, monthly_credit_limit: null, seat_tier: unassigned, limit_type: null }
    - { $ref: templates/claude_team_overage.yaml#/templates/alice, _airbyte_extracted_at: "2026-12-10T00:00:00Z", unique_key: seat-alice, used_credits: 50,  monthly_credit_limit: null, seat_tier: unassigned, limit_type: null }
    # ── bob ─────────────────────────────────────────────────────────────────────
    - { $ref: templates/claude_team_overage.yaml#/templates/bob,   _airbyte_extracted_at: "2026-11-15T00:00:00Z", unique_key: seat-bob,   used_credits: 200, monthly_credit_limit: 1000 }
    - { $ref: templates/claude_team_overage.yaml#/templates/bob,   _airbyte_extracted_at: "2026-12-10T00:00:00Z", unique_key: seat-bob,   used_credits: 100, monthly_credit_limit: 1000 }
    # ── carol ───────────────────────────────────────────────────────────────────
    - { $ref: templates/claude_team_overage.yaml#/templates/carol, _airbyte_extracted_at: "2026-11-15T00:00:00Z", unique_key: seat-carol, used_credits: 300, monthly_credit_limit: 1000 }
    - { $ref: templates/claude_team_overage.yaml#/templates/carol, _airbyte_extracted_at: "2026-12-10T00:00:00Z", unique_key: seat-carol, used_credits: 150, monthly_credit_limit: 1000 }
    # ── dave ────────────────────────────────────────────────────────────────────
    - { $ref: templates/claude_team_overage.yaml#/templates/dave,  _airbyte_extracted_at: "2026-11-15T00:00:00Z", unique_key: seat-dave,  used_credits: 400, monthly_credit_limit: 1000 }
    - { $ref: templates/claude_team_overage.yaml#/templates/dave,  _airbyte_extracted_at: "2026-12-10T00:00:00Z", unique_key: seat-dave,  used_credits: 200, monthly_credit_limit: 1000 }
    # ── erin (the requested IC member) ──────────────────────────────────────────
    - { $ref: templates/claude_team_overage.yaml#/templates/erin,  _airbyte_extracted_at: "2026-11-15T00:00:00Z", unique_key: seat-erin,  used_credits: 500, monthly_credit_limit: 1000 }
    - { $ref: templates/claude_team_overage.yaml#/templates/erin,  _airbyte_extracted_at: "2026-12-10T00:00:00Z", unique_key: seat-erin,  used_credits: 250, monthly_credit_limit: 1000 }
    # Repeated sync of erin's December snapshot — the staging model keeps one row
    # per (seat, month), so the window stays 7.50 and does not become 10.00.
    - { $ref: templates/claude_team_overage.yaml#/templates/erin,  _airbyte_extracted_at: "2026-12-10T00:00:00Z", unique_key: seat-erin,  used_credits: 250, monthly_credit_limit: 1000 }

cases:
  # ── CUSTOM scope (Nov 01 .. Dec 12) — both snapshots ─────────────────────────
  - name: AI seat extra usage
    request:
      url: /v1/metric-results
      method: POST
      body:
        entity: { type: person, ids: [erin@example.com] }
        period: { from: "2026-11-01", to: "2026-12-12" }
        metrics:
          - metric_key: ai.extra_usage_cost
            views:
              - { view: period }
              - { view: peer }
              - { view: timeseries, bucket: day }
              - { view: breakdown, dimensions: [seat_tier] }
          - metric_key: ai.extra_usage_utilisation
            views:
              - { view: period }
    expect:
      - assert: "status == 200"
      - metric: ai.extra_usage_cost
        view: period
        find: { entity_id: erin@example.com }
        equal: { value: 7.5 }
      - metric: ai.extra_usage_cost
        view: peer
        find: { entity_id: erin@example.com }
        equal: { target_value: 7.5, p25: 3, median: 4.5, p75: 6, min: 1.5, max: 7.5, n: 5 }
      - metric: ai.extra_usage_cost
        view: timeseries
        assert: "items.exists(s, s.entity_id == 'erin@example.com' && s.points.exists(p, p.bucket_start == '2026-11-15' && double(p.value) == 5.0) && s.points.exists(p, p.bucket_start == '2026-12-10' && double(p.value) == 2.5))"
      - metric: ai.extra_usage_cost
        view: breakdown
        assert: "items.exists(v, v.entity_id == 'erin@example.com' && v.dimensions.exists(d, d.key == 'seat_tier' && d.value == 'team_tier_1') && double(v.value) == 7.5)"
      - metric: ai.extra_usage_utilisation
        view: period
        find: { entity_id: erin@example.com }
        equal: { value: 37.5 }

  # ── A seat with no ceiling: money present, utilisation absent ────────────────
  - name: AI seat with no ceiling
    request:
      url: /v1/metric-results
      method: POST
      body:
        entity: { type: person, ids: [alice@example.com] }
        period: { from: "2026-11-01", to: "2026-12-12" }
        metrics:
          - metric_key: ai.extra_usage_cost
            views:
              - { view: period }
          - metric_key: ai.extra_usage_utilisation
            views:
              - { view: period }
    expect:
      - assert: "status == 200"
      - metric: ai.extra_usage_cost
        view: period
        find: { entity_id: alice@example.com }
        equal: { value: 1.5 }
      - metric: ai.extra_usage_utilisation
        view: period
        find: { entity_id: alice@example.com }
        equal: { value: null }

  # ── EMPTY window (no snapshot read in range) ─────────────────────────────────
  - name: AI seat extra usage empty window
    request:
      url: /v1/metric-results
      method: POST
      body:
        entity: { type: person, ids: [erin@example.com] }
        period: { from: "2026-06-01", to: "2026-06-30" }
        metrics:
          - metric_key: ai.extra_usage_cost
            views:
              - { view: period }
    expect:
      - assert: "status == 200"
      - metric: ai.extra_usage_cost
        view: period
        find: { entity_id: erin@example.com }
        equal: { value: null }
