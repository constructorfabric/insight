cases:
  - name: duration spread is the sample stddev over runs
    request:
      url: /v1/metric-results
      method: POST
      body:
        entity: { type: tenant }
        period: { from: "2026-03-01", to: "2026-03-07" }
        metrics:
          - metric_key: ci.run_duration_min_stddev
            views:
              - { view: period }
              - { view: timeseries, bucket: day }
              - { view: breakdown, dimensions: [repository] }
    expect:
      - assert: "status == 200"
      - metric: ci.run_duration_min_stddev
        view: period
        find: { entity_id: "11111111-1111-1111-1111-111111111111" }
        assert: "double(it.value) > 2.1 && double(it.value) < 2.2"
      - metric: ci.run_duration_min_stddev
        view: timeseries
        assert: "items.exists(s, s.points.exists(p, p.bucket_start == '2026-03-02' && double(p.value) > 2.1 && double(p.value) < 2.2))"
      - metric: ci.run_duration_min_stddev
        view: breakdown
        assert: "items.exists(v, v.dimensions.exists(d, d.key == 'repository' && d.value == 'acme/app') && double(v.value) > 2.1 && double(v.value) < 2.2)"
  - name: a single run has no measurable spread and reads null
    request:
      url: /v1/metric-results
      method: POST
      body:
        entity: { type: tenant }
        period: { from: "2026-04-01", to: "2026-04-07" }
        metrics:
          - metric_key: ci.run_duration_min_stddev
            views:
              - { view: period }
    expect:
      - assert: "status == 200"
      - metric: ci.run_duration_min_stddev
        view: period
        find: { entity_id: "11111111-1111-1111-1111-111111111111" }
        equal: { value: null }
