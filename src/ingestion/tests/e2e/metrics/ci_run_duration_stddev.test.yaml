description: >
  Metric: ci.run_duration_min_stddev — sample standard deviation of gate run
  duration, minutes (tenant-grain, issue #2803). First metric on the new
  stddev computation.
  How it's computed (bronze → silver → gold):
    • bronze: workflow run attempts with start and finish timestamps
    • silver: duration = finish − start of the LAST attempt, minutes
    • gold:   per-run duration rows kept at event grain; the value is the
      sample stddev over runs in the period, org-wide

  Seeded: eight gate runs of [2, 4, 4, 4, 5, 5, 7, 9] minutes — sample stddev = sqrt(32/7)
  ≈ 2.138, pinned to (2.1, 2.2). A single-run window has no measurable spread
  and must read null, never a fabricated zero.
  Cases: spread over the eight-run set, single-run window is null.
bronze:
  bronze_github.workflow_runs:
    - $ref: templates/github_ci.yaml#/templates/workflow_run
      unique_key: gh-run-1-1
      id: 1
      run_number: 1
      run_started_at: "2026-03-02T10:00:00Z"
      updated_at: "2026-03-02T10:02:00Z"
