      _airbyte_meta:
        type: string
      _airbyte_generation_id:
        type: integer
      unique_key: &id001
        type: string
      tenant_id: *id001
      source_id: *id001
      data_source: *id001
      collected_at: *id001
      event_id: *id001
      event_type: *id001
      event_at: *id001
      item_number: &id002
        type: integer
      repo_full_name: *id001
      actor_login: *id001
      actor_id: *id002
      target_login: *id001
      target_id: *id002
      label_name: *id001
      state_reason:
        type:
        - string
        - 'null'
      field_id: *id001
      field_name: *id001
      prev_value: *id001
      new_value: *id001
      prev_value_id: *id001
      new_value_id: *id001
      prev_options_json: *id001
      new_options_json: *id001
