# Derived from the bronze_gitlab DDL snapshot. Array fields land in bronze as
# JSON strings (the staging models toString() them), so they are typed string.
schemas:
  bronze_gitlab.merge_requests:
    $schema: http://json-schema.org/draft-07/schema#
    type: object
    additionalProperties: false
    properties:
      unique_key: { type: [string, "null"] }
      tenant_id: { type: [string, "null"] }
      source_id: { type: [string, "null"] }
      data_source: { type: [string, "null"] }
      collected_at: { type: [string, "null"] }
      project_id: { type: [integer, "null"] }
      iid: { type: [integer, "null"] }
      id: { type: [integer, "null"] }
      title: { type: [string, "null"] }
      title_truncated: { type: [boolean, "null"] }
      description: { type: [string, "null"] }
      description_truncated: { type: [boolean, "null"] }
      state: { type: [string, "null"] }
      draft: { type: [boolean, "null"] }
      author_id: { type: [integer, "null"] }
      author_username: { type: [string, "null"] }
      merged_by_id: { type: [integer, "null"] }
      merged_by_username: { type: [string, "null"] }
      source_branch: { type: [string, "null"] }
      target_branch: { type: [string, "null"] }
      created_at: { type: [string, "null"] }
      updated_at: { type: [string, "null"] }
      merged_at: { type: [string, "null"] }
      closed_at: { type: [string, "null"] }
      sha: { type: [string, "null"] }
      merge_commit_sha: { type: [string, "null"] }
      squash_commit_sha: { type: [string, "null"] }
      squash: { type: [boolean, "null"] }
      merge_status: { type: [string, "null"] }
      user_notes_count: { type: [integer, "null"] }
      milestone_id: { type: [integer, "null"] }
      assignee_ids: { type: [string, "null"] }
      reviewer_ids: { type: [string, "null"] }
      labels: { type: [string, "null"] }
      _airbyte_raw_id: { type: string }
      _airbyte_extracted_at: { type: string, format: date-time }
      _airbyte_meta: { type: string }
      _airbyte_generation_id: { type: integer }
