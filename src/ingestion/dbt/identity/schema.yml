version: 2

# The source it reads is declared in the connector's own schema.yml:
#   - bronze_cursor        → connectors/ai/cursor/dbt/schema.yml

models:
  - name: seed_identity_inputs_from_cursor
    description: >
      Cursor's contribution to the identity_inputs union (tag
      silver:identity_inputs). Raw alias observations (no normalization).
      Each cursor member produces up to 3 rows: id, email, display_name.
    columns:
      - name: insight_tenant_id
        description: "Tenant UUID (derived from Bronze tenant_id via sipHash128)"
        tests:
          - not_null
      - name: value_type
        description: "id, email, or display_name"
        tests:
          - not_null
          - accepted_values:
              values: ['id', 'email', 'display_name']
      - name: value
        description: "Raw value (not normalized)"
        tests:
          - not_null
      - name: value_field_name
        description: "Fully-qualified Bronze field path"
        tests:
          - not_null
          - accepted_values:
              values:
                - 'bronze_cursor.cursor_members.email'
                - 'bronze_cursor.cursor_members.id'
                - 'bronze_cursor.cursor_members.name'
      - name: source_account_id
        description: "Cursor user ID"
        tests:
          - not_null
      - name: operation_type
        description: "Always UPSERT for initial seed"
        tests:
          - not_null
          - accepted_values:
              values: ['UPSERT']

  # --- Resolution projections (views over the identity journal) ---

  - name: account_assignment
    description: >
      Current binding of every source account to a canonical person: one row
      per (source_type, source_id, account_id), from the newest
      `value_type='id'` observation in the identity journal. A view, so an
      operator correction is visible as soon as the persons-sync publishes it.
      Carries `created_at` and the whole account triple so effective-dated
      assignment and account-keyed consumers stay reachable without a rewrite.
    columns:
      - name: source_type
        description: "Source family the account belongs to (e.g. github, jira)"
        tests:
          - not_null
      - name: source_id
        description: "Source instance UUID (journal-side tenant/source identity)"
        tests:
          - not_null
      - name: account_id
        description: "Source-native account id, trimmed"
        tests:
          - not_null
      - name: person_id
        description: "Canonical person UUID the account is bound to right now"
        tests:
          - not_null
      - name: created_at
        description: "When the winning binding observation was recorded"
        tests:
          - not_null

  - name: person_map
    description: >
      email → canonical person, resolved live. The map analytics joins at query
      time to attribute email-keyed facts to a person. One row per email:
      claims come from the accounts carrying the address, every address an
      account ever carried claims it, a contested address resolves to nobody,
      and excluded (bot) accounts claim nothing. Uniqueness and normalization
      are asserted by singular tests at error severity — a duplicate row would
      multiply joined facts and an unnormalized one would match nothing.
    columns:
      - name: email
        description: "Normalized email (lower + trim), unique across the map"
        tests:
          - not_null
      - name: person_id
        description: "Canonical person UUID the address resolves to"
        tests:
          - not_null
