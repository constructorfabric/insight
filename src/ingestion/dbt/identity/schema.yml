version: 2

# The source it reads is declared in the connector's own schema.yml:
#   - bronze_cursor        → connectors/ai/cursor/dbt/schema.yml

models:
  - name: seed_identity_inputs_from_cursor
    description: >
      Cursor's contribution to the identity_inputs union (tag
      silver:identity_inputs). Raw alias observations (no normalization).
      Each cursor member produces up to 3 rows: id, email, display_name.
    columns:
      - name: insight_tenant_id
        description: "Tenant UUID (derived from Bronze tenant_id via sipHash128)"
        tests:
          - not_null
      - name: value_type
        description: "id, email, or display_name"
        tests:
          - not_null
          - accepted_values:
              values: ['id', 'email', 'display_name']
      - name: value
        description: "Raw value (not normalized)"
        tests:
          - not_null
      - name: value_field_name
        description: "Fully-qualified Bronze field path"
        tests:
          - not_null
          - accepted_values:
              values:
                - 'bronze_cursor.cursor_members.email'
                - 'bronze_cursor.cursor_members.id'
                - 'bronze_cursor.cursor_members.name'
      - name: source_account_id
        description: "Cursor user ID"
        tests:
          - not_null
      - name: operation_type
        description: "Always UPSERT for initial seed"
        tests:
          - not_null
          - accepted_values:
              values: ['UPSERT']
