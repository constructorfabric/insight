name: ingestion
version: "1.0.0"
config-version: 2

profile: ingestion

model-paths:
  - identity
  - ../silver
  - ../gold
  - ../connectors

macro-paths:
  - macros

clean-targets:
  - target
  - dbt_packages

vars:
  # ClickHouse database gold serving relations materialize into. Single flip
  # point for the deferred `insight` -> `presentation` relocation (#1979): the
  # gold macros and per-model configs read this rather than a literal.
  gold_database: insight

  # Window git_file_change_coverage judges a live source over. The all-time
  # share carries history no re-read can reach, so only the recent window says
  # whether collection is working NOW. Wide enough that a connector's own
  # catch-up (a branch is re-walked when its head moves) is not read as a gap.
  git_coverage_recent_days: 14

  # Guardrail for assert_git_file_change_coverage_holds. Operational values,
  # not semantic invariants: the floor is where a healthy connector instance
  # sits with room for a provider hiccup, and the sample size keeps a new or
  # tiny instance out of the test, where one lost diff out of three reads as
  # 66% and means nothing. Raise the floor once an installation's own measured
  # norm is known.
  git_coverage_min_pct: 90
  git_coverage_min_sample: 50

  # Path patterns (ClickHouse `match` / RE2 regex fragments, matched
  # case-insensitively) that mark a git file as vendored/generated rather than
  # authored. Files matching any pattern are classified `vendored` by the
  # shared `git_file_category` macro and so are excluded from authored
  # line-count metrics (code_loc / clean_loc / code_lines_added) while still
  # being retained — and auditable — under the `vendored` category in the
  # total lines_added breakdown. Override per deployment to extend coverage.
  # NOTE: values are RE2 fragments embedded into a ClickHouse SQL *string
  # literal*, so backslashes are doubled (`\\.` -> ClickHouse unescapes to
  # `\.` -> RE2 sees a literal dot), matching the convention in the other
  # hand-written regexes in git_file_category.sql. Single-quoted YAML keeps the
  # doubled backslashes verbatim.
  git_vendored_path_patterns:
    # dependency / vendored trees
    - '(^|/)node_modules/'
    - '(^|/)bower_components/'
    - '(^|/)vendor/'
    - '(^|/)third_party/'
    - '(^|/)Pods/'
    - '(^|/)\\.venv/'
    - '(^|/)site-packages/'
    - '(^|/)Carthage/'
    # build / generated output
    - '(^|/)dist/'
    - '(^|/)build/'
    - '(^|/)out/'
    - '(^|/)target/'
    - '(^|/)bin/'
    - '(^|/)obj/'
    - '(^|/)\\.next/'
    - '(^|/)\\.nuxt/'
    - '(^|/)__pycache__/'
    - '(^|/)(__generated__|generated|gen)/'
    - '(^|/)coverage/'
    # generated / minified single files
    - '\\.min\\.(js|css)$'
    - '\\.(pb|pb\\.go)$'
    - '\\.g\\.(dart|cs)$'
    - '\\.generated\\.'
    - '\\.designer\\.cs$'
    - '\\.d\\.ts$'
    # lockfiles / machine-managed manifests (checked before the `config`
    # branch, so all lockfiles land in one auditable `vendored` bucket)
    - '(^|/)go\\.sum$'
    - '(^|/)Cargo\\.lock$'
    - '(^|/)composer\\.lock$'
    - '(^|/)Gemfile\\.lock$'
    - '(^|/)pnpm-lock\\.yaml$'
    - '(^|/)package-lock\\.json$'
    - '(^|/)npm-shrinkwrap\\.json$'
    - '(^|/)yarn\\.lock$'
    - '(^|/)poetry\\.lock$'
    - '(^|/)Pipfile\\.lock$'
    - '(^|/)packages\\.lock\\.json$'
    - '(^|/)gradle\\.lockfile$'
    - '(^|/)mix\\.lock$'
    - '(^|/)flake\\.lock$'

  # Issue-type names the shared `task_issue_kind` macro maps to bug / other,
  # compared case-insensitively. Anything else is `unknown`.
  task_bug_type_names:
    - bug
    - defect
    - regression
    - exception
    - cosmetics
    - usability problem
    - performance problem
  # Custom-field names carrying the issue type, for sources that model it as a
  # field rather than a global type table (YouTrack). Canonical field names,
  # compared case-insensitively — never a localized name.
  task_issue_type_field_names:
    - type
  # Whether a Projects V2 board's status field must be bound like any other
  # field. Boards multiply the field set: every board defines its own status,
  # so enforcing coverage means one authored binding per board, and there is no
  # authoring surface for that yet — the tables are written by hand. While this
  # is false the two coverage tests skip board fields, so collecting boards
  # cannot turn the build red on its own.
  #
  # It does NOT relax the invariant it guards: an unbound or unmapped board
  # value still produces no dimension row and still reaches no category. It
  # goes unreported instead of failing the build. Flip this on once binding
  # boards is something an operator can actually do.
  task_board_bindings_enforced: false
  task_non_bug_type_names:
    - task
    - sub-task
    - subtask
    - story
    - user story
    - epic
    - improvement
    - feature
    - new feature
    - meeting

# on-run-start hooks:
#  - create_task_field_history_staging:
#      DDL for `staging.jira__task_field_history` (Rust-owned table, ADR-003).
#      The Rust `jira-enrich` binary has INSERT rights only; dbt owns DDL.
#
# Bronze MergeTree → ReplacingMergeTree promotion happens per-connector via
# a dedicated bootstrap model (e.g. `jira__bronze_promoted`) using `pre_hook`,
# so all the connector's other models depend on it via `-- depends_on:`. This
# keeps connector-specific table lists co-located with the connector code.
on-run-start:
  - "{{ create_task_field_history_staging() }}"
  # config.task_field_roles / config.task_value_map — operator-authored
  # bindings from a vendor field or value to the role and canonical value gold
  # consumes. dbt guarantees the relations exist and reads them as sources; the
  # rows are written by an operator, so no model may own them.
  - "{{ create_task_config_tables() }}"
  # config.ai_seat_tier_map — the operator-authored binding from an invoice
  # line's tier identifier to the tier a seat carries. Same ownership rule: dbt
  # guarantees the relation exists, an operator writes the rows.
  - "{{ create_ai_config_tables() }}"
  # identity.identity_persons — the persons-log copy the identity-resolution
  # service's persons-sync fills; gold models resolve email → person_id
  # against it. The hook only guarantees the (possibly empty) table exists
  # so builds don't fail before the first sync — see the macro's schema
  # contract with infra/identity_persons.rs.
  - "{{ create_identity_persons() }}"
  # Drop the silver placeholders (created by create-bronze-placeholders.sh,
  # run from the clickhouse-migrate Hook Job) BEFORE any model
  # materialization starts. Two-factor detection (placeholder marker +
  # at least one staging model materialised for the matching
  # `silver:<id>` tag) — see drop_silver_placeholders_at_start macro for
  # rationale. Lives in on-run-start, NOT a per-model pre-hook, because
  # dbt-clickhouse captures the target's existence at materialization
  # start (before pre_hooks run) for `is_incremental()`. A pre-hook drop
  # leaves is_incremental=True so the compiled SQL still references the
  # (now-dropped) target → ClickHouse SYNTAX_ERROR. on-run-start runs
  # before the materialization framework, so existing_relation is
  # captured as nil and the model takes the create-from-scratch branch.
  - "{{ drop_silver_placeholders_at_start() }}"
