# Hand-run convenience only. Every step that runs dbt for real writes its own
# profile through scripts/dbt_profiles.py, which is where the connection shape
# and the ClickHouse topology are decided; a model's engine comes from
# dbt_project.yml and the `insight_engine` macro, never from here.
ingestion:
  target: local
  outputs:
    local:
      type: clickhouse
      host: localhost
      port: 30123
      schema: default
      user: default
      password: "{{ env_var('CLICKHOUSE_PASSWORD') }}"
      secure: false
      send_receive_timeout: 1500
      connect_timeout: 30
      custom_settings:
        allow_experimental_correlated_subqueries: 1
    k8s:
      type: clickhouse
      host: insight-clickhouse.insight.svc.cluster.local
      port: 8123
      schema: default
      user: default
      password: "{{ env_var('CLICKHOUSE_PASSWORD') }}"
      secure: false
      send_receive_timeout: 1500
      connect_timeout: 30
      custom_settings:
        allow_experimental_correlated_subqueries: 1
