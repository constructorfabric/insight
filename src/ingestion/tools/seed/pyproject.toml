# Package metadata, dependencies, and tool config for the Insight sample-data
# seeder. Lives at the tool root so `ruff check .` and `mypy .` cover both the
# `insight_seed` package and its `tests/`, and `pip install .` builds the
# package (only the package — tests are not shipped).

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "insight-seed"
version = "0.1.0"
description = "Insight sample-data seeder for the compose stack and Kubernetes test stands."
# 3.12, not 3.13: this package ships inside the toolbox image
# (tools/toolbox/Dockerfile), which is python:3.12-slim, and the rest of the
# ingestion tree pins the same direction (tests/connectors caps at <3.13). No
# 3.13-only syntax or API is used here, so the floor costs nothing.
requires-python = ">=3.12"
# What the package IMPORTS. dbt is deliberately absent: no module here imports
# it — the silver step shells out to the ingestion tree's own scripts, and dbt
# is a requirement of THAT environment (the toolbox image installs it directly,
# and the `silver` extra below covers a host run). Declaring it here made every
# install of this package resolve dbt-core, including the one a realm
# generation needs.
dependencies = [
    "PyMySQL==1.2.0",
    "clickhouse-connect==1.6.0",
]

[project.optional-dependencies]
# The silver step's environment for a host run outside the toolbox image:
# `apply-ch-migrations.sh` writes a profiles.yml with PyYAML (which dbt-core
# pulls in) and then runs dbt itself.
silver = ["dbt-clickhouse"]
dev = [
    # dbt-core 1.12 raised its own cap to pathspec<1.1 (dbt-labs/dbt-core#12385),
    # so a current mypy resolves again. Below 2.0 it would pull pathspec<1.0 and
    # drag dbt-core back to the 1.11 line.
    "mypy>=2,<3",
    # Same pin as the ruff-pre-commit hook in .pre-commit-config.yaml, so a local
    # run and the commit hook cannot reach different verdicts.
    "ruff==0.16.1",
    "types-PyMySQL==1.2.0.20260724",
    # The tests are pytest-style; the image-validation step in build-images.yml
    # installs pytest transiently on top of the built image to run them, so the
    # published image itself still ships without it.
    "pytest>=8,<10",
]

# The entry points every runner uses. Both images install this package, so the
# compose service, the Kubernetes Job and a developer shell all invoke a program
# on PATH rather than a module in a particular directory.
[project.scripts]
insight-seed = "insight_seed.__main__:main"
# The realm generator is a second entry point on the same roster, so compose
# bring-up can run it as a program rather than a module in a directory.
insight-seed-realm = "insight_seed.keycloak_realm:main"

# One importable package; `tests/` stays out of the distribution.
[tool.setuptools.packages.find]
include = ["insight_seed*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Pragmatic strict set: pycodestyle, pyflakes, isort, bugbear, comprehensions,
# pyupgrade, return-style, simplify, type-annotations, datetime-tz, naming.
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "UP",       # pyupgrade
    "RET",      # flake8-return
    "SIM",      # flake8-simplify
    "ANN",      # flake8-annotations
    "DTZ",      # flake8-datetimez (naive datetime is a bug)
    "N",        # pep8-naming
    "RUF",      # ruff-specific
]
ignore = [
    "ANN401",  # Dynamic `Any` is sometimes the right tool
    "E501",    # Long lines handled by `line-length`
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
# clickhouse-connect doesn't ship full type stubs yet
[[tool.mypy.overrides]]
module = "clickhouse_connect.*"
ignore_missing_imports = true
