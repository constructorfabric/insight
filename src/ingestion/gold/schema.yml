version: 2

models:
  - name: ai_metric_evidence
    description: >
      Materialized MergeTree evidence serving table for AI source measures.
      AI silver retains daily usage summaries, so rows use source_summary
      granularity except active-day population rows.
    columns: &metric_evidence_columns
      - name: tenant_id
        description: "Tenant isolation field"
        tests:
          - not_null
      - name: source_key
        description: "Logical source family"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ai_usage', 'ai_cost', 'collab', 'git', 'task', 'wiki']
      - name: entity_type
        description: "Measured entity type"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['person']
      - name: entity_id
        description: >
          Canonical person id, resolved ONCE per gold build ('' when identity
          does not know the source email — those rows stay for coverage and
          reach no serving relation). The same snapshot every downstream
          relation answers for.
        tests:
          - not_null
      - name: source_entity_id
        description: >
          Source-native email the row was resolved from — provenance and the
          coverage denominator; never a serving key.
        tests:
          - not_null
      - name: metric_date
        description: "Date used by metric period filtering"
        tests:
          - not_null
      - name: observed_at
        description: "Optional event timestamp"
      - name: measure_key
        description: "Source measure key"
        tests:
          - not_null
      - name: record_id
        description: "Deterministic total-order key within the measure scope"
        tests:
          - not_null
      - name: record_kind
        description: "Source record classification"
        tests:
          - not_null
      - name: granularity
        description: "Evidence grain: event, source_summary, or derived_population"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['event', 'source_summary', 'derived_population']
      - name: record_label
        description: "Human-readable record label"
      - name: contribution
        description: "Nullable numeric contribution to the source measure"
      - name: subject_key
        description: "Nullable subject for distinct-count computations"
      - name: dimensions
        description: "Typed metric dimensions inherited by filtering and grouping"
      - name: details
        description: "Additional display fields keyed by stable field name"

  - name: git_authored_commits
    description: >
      One row per authored commit that reaches a git measure: the surviving row
      of the commit-hash collapse, with branch scope, repository, project and
      source dimensions already resolved. Materialized so the commit class read
      and the collapse run once per build in their own query budget.
    columns:
      - name: commit_hash
        description: "Commit identifier; one row per tenant, data source and hash"
        tests:
          - not_null

  - name: git_commit_file_changes
    description: >
      File changes attached to the commit row that survived the hash collapse,
      one row per commit, path, change type and object id pair. Materialized so
      the file-change class read runs in its own query budget.
    columns:
      - name: commit_hash
        description: "Commit the change is attached to"
        tests:
          - not_null

  - name: git_default_branch_commits
    description: >
      Commits that reached a repository's default branch through a merged pull
      request: one row per tenant/source/project/repo/commit. Materialized so
      the pull-request membership joins run once per build in their own query
      budget; the git evidence build reads it as a semi-join set alongside the
      sync-time is_default_branch flag.
    columns:
      - name: commit_hash
        description: "Commit identifier within the repository"
        tests:
          - not_null

  - name: git_review_events
    description: >
      One row per pull-request review or comment, with the actor resolved, the
      request it sits on joined, and its dimension tuple built. Materialized so
      the identity map and the pull-request join run once per build in their own
      query budget rather than competing for memory with every other git measure
      inside the evidence query.
    columns:
      - name: event_key
        description: "The silver event's unique key — several events by one person on one request stay distinct"
        tests:
          - not_null
      - name: event_kind
        description: "'review' for a submitted verdict, 'comment' for a conversation or review-thread comment"
      - name: entity_id
        description: "The actor's normalized e-mail; rows without one are dropped here, not downstream"
        tests:
          - not_null

  - name: git_derived_commits
    description: >
      Commits whose work is already counted on another commit, one row per
      tenant/data_source/commit_hash/reason. merge_result is the commit a
      merged pull request produced on its destination (a squash result or the
      last rebased copy), marked only when every linked branch commit was
      collected; patch_duplicate is a later carrier of a patch id an earlier
      commit in the same repository authored (a rebase copy or a cherry-pick).
      The git
      evidence build excludes these from both the commit and the line figures,
      so one authored change counts once and the two figures describe the same
      set of commits.
    columns:
      - name: commit_hash
        description: "Commit identifier within the source"
        tests:
          - not_null
      - name: reason
        description: "Why the commit is derived"
        tests:
          - accepted_values:
              arguments:
                values: ['merge_result', 'patch_duplicate']

  - name: git_metric_evidence
    description: >
      Materialized MergeTree evidence serving table for Git source measures.
      Median inputs retain event grain; additive measures retain daily and
      dimension summaries. Active commit days retain their date subject and
      dimensions for exact distinct counts at every supported breakdown.
    columns: *metric_evidence_columns

  - name: collab_metric_evidence
    description: >
      Materialized MergeTree evidence serving table for collaboration source
      measures. Connector class contracts retain daily summaries; focus,
      activity, and meeting-free populations are marked as derived.
    columns: *metric_evidence_columns

  - name: task_metric_evidence
    description: >
      Materialized MergeTree evidence serving table for task source measures.
      Issue duration inputs retain event grain; lifecycle ratios, snapshots,
      and daily flows are marked as derived populations.
    columns: *metric_evidence_columns

  - name: wiki_metric_evidence
    description: >
      Materialized MergeTree evidence serving table for wiki source measures.
      Page creation rows retain event grain; edits and engagement expose the
      established daily summaries retained by the silver contracts.
    columns: *metric_evidence_columns

  - name: ci_metric_evidence
    description: >
      Materialized MergeTree evidence serving table for CI measures — the
      first TENANT-grain family: entity_id is the tenant id, there is no
      person and no identity join (issue #2803). One row per decided run per
      measure it feeds; run_duration_min keeps event grain for query-time
      percentiles. Deployment rows fold the latest status event in; no event
      yet reads as the visible 'pending' outcome. Deliberately NOT the shared
      person-grain column anchor: this family's source_key and entity_type
      would fail its accepted-values pins.
    columns:
      - name: tenant_id
        description: "Tenant isolation field"
        tests:
          - not_null
      - name: source_key
        description: "Logical source family — always ci here"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ci']
      - name: entity_type
        description: "Measured entity type — always the tenant for CI"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['tenant']
      - name: entity_id
        description: >
          The tenant id, verbatim — the shape the results compiler expects
          for tenant-entity reads (entity_id = tenant_id). No identity
          resolution happens for this family.
        tests:
          - not_null
      - name: source_entity_id
        description: >
          Same tenant id — kept so the evidence contract keeps one column
          set across families; there is no source-native identity to record.
        tests:
          - not_null
      - name: metric_date
        description: "Run start date; deployment creation date"
        tests:
          - not_null
      - name: observed_at
        description: "Run start instant; NULL on deployment rows"
      - name: measure_key
        description: "Source measure key"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - runs
                  - gate_runs
                  - gate_passed
                  - gate_first_try_passed
                  - gate_retried
                  - run_duration_min
                  - run_hours
                  - deployments
                  - runs_matched_commit
                  - commits_observed
      - name: record_id
        description: >
          Deterministic total-order key within the measure scope; source_id
          leads it, so two source instances covering the same repository
          cannot collide.
        tests:
          - not_null
      - name: record_kind
        description: "ci_run for run measures, deployment for deployments, commit for commits_observed"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ci_run', 'deployment', 'commit']
      - name: granularity
        description: "Always event: one row per run / deployment"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['event']
      - name: record_label
        description: "Pipeline name + run number, or environment + outcome"
      - name: contribution
        description: "Nullable numeric contribution to the source measure"
      - name: subject_key
        description: "Unused by this family (no distinct-count measure); always NULL"
      - name: dimensions
        description: >
          Run rows carry repository / pipeline / trigger / outcome /
          hour_block; deployment rows carry repository / environment /
          outcome / env_kind (production, or preview vs static by the
          vendor's transient flag).
      - name: details
        description: "Drilldown display fields keyed by stable field name"

  - name: ai_cost_metric_evidence
    description: >
      Materialized MergeTree evidence serving table for AI cost measures, all
      at source_summary granularity. A month-grain row is one seat-month, dated
      at the first day of the month it bills for; a day-grain row is one reading
      of a seat, dated at the day it was read. A day-grain row carries
      covers_days, the span from the previous reading in the same billing month
      or from the 1st for the first one: a reading attributed to the wrong month
      at a boundary keeps its money and loses that span. A separate family from
      ai_metric_evidence because one evidence relation is bound per source.
    columns: *metric_evidence_columns

  - name: ai_cost_metric_observations
    description: >
      Source measure observations for the unified metrics runtime, AI cost
      family. One row per (tenant, entity, metric date, measure, dimension tuple).
      seat_cost_usd is the invoiced price of the seat itself, from the per-seat
      amount on the invoice's subscription lines; extra_usage_usd is the money
      the vendor billed once that seat exhausted the usage included in its fee;
      extra_usage_limit_usd is the admin-set ceiling on that spend, and serves
      only as the utilisation denominator; daily_extra_usage_usd is the same
      billed money as extra_usage_usd, stepped across the days it was spent.
      The month-grain measures are dated at the first day of the billing month
      they charge for, so their date never moves with the sync schedule. A
      reading taken on that month's last calendar day may raise the month but
      never lower it: the endpoint names no billing period, so a drop there
      cannot be told apart from its counter having already rolled over. A
      reading taken before that rollover overstates the month it lands in, and
      the same rewriting rule erases it once the month's real readings arrive —
      a month whose only reading is that one keeps it.
    columns:
      - name: tenant_id
        description: "Tenant isolation field"
        tests:
          - not_null
      - name: source_key
        description: "Logical source key registered in the metric registry"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ai_cost']
      - name: entity_type
        description: "Measured entity type"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['person']
      - name: entity_id
        description: >
          Canonical person id, stamped into the evidence relation once per gold
          build. Source rows whose email identity cannot resolve never reach
          this relation.
        tests:
          - not_null
      - name: metric_date
        description: >
          For a month-grain measure, the first day of the month it bills for, so
          the date does not move with the sync schedule. For daily_extra_usage_usd,
          the day the reading was taken.
        tests:
          - not_null
      - name: observed_at
        description: "NULL here; the read timestamp lives on the evidence row."
      - name: measure_key
        description: "Source measure key registered in the metric registry"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - seat_cost_usd
                  - extra_usage_usd
                  - extra_usage_limit_usd
                  - daily_extra_usage_usd
      - name: value
        description: >
          Measure value. Rows are emitted only when the source provides a
          value, so value is never NULL; the column stays Nullable(Float64)
          in the published contract.
        tests:
          - not_null
      - name: subject_key
        description: "Always NULL — no distinct-count measure in this family."
      - name: dimensions
        description: >
          Array(Tuple(key, value, label)) carrying tool and seat_tier. A seat
          with no tier reports 'unknown' rather than dropping the dimension.

  - name: ai_metric_observations
    description: >
      Source measure observations for the unified metrics runtime. One row per
      (tenant, entity, day, measure, dimension tuple). Emits measures, not
      metrics: the analytics service metric registry binds input roles to
      measure keys and compiles result queries against this relation. The
      column set is a published contract — the analytics service schema validator
      probes it at runtime (`OBSERVATION_COLUMNS`); changing it requires a
      coordinated backend change.
    columns:
      - name: tenant_id
        description: "Tenant isolation field"
        tests:
          - not_null
      - name: source_key
        description: "Logical source key registered in the metric registry"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ai_usage']
      - name: entity_type
        description: "Measured entity type"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['person']
      - name: entity_id
        description: >
          Canonical person id — `entity_type + entity_id` identifies the
          measured entity, and for a person that identity IS the person id,
          stamped into the evidence relations once per gold build. Source rows
          whose email identity cannot resolve never reach this relation;
          identity_resolution_coverage counts them from evidence, which keeps
          the source email as source_entity_id.
        tests:
          - not_null
      - name: metric_date
        description: "Observation date"
        tests:
          - not_null
      - name: observed_at
        description: >
          Intra-day observation timestamp for future point-in-time semantics.
          NULL for day-grain aggregate measures.
      - name: measure_key
        description: "Source measure key registered in the metric registry"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - accepted_lines
                  - removed_lines
                  - active_day
                  - cost_usd
                  - accepted_edit_actions
                  - tool_use_offered
                  - dev_conversations
                  - assistant_messages
                  - assistant_actions
                  - chat_assistant_conversations
                  - prs_with_assistant
                  - prs_total
      - name: value
        description: >
          Measure value. Rows are emitted only when the source provides a
          value, so value is never NULL; the column stays Nullable(Float64)
          in the published contract.
        tests:
          - not_null
      - name: subject_key
        description: >
          Distinct-count subject for future distinct-count semantics. NULL for
          measures without distinct-count support.
      - name: dimensions
        description: >
          Array(Tuple(key, value, label)) of all dimensions the source emits
          for the measure. Values and labels come straight from class-contract
          columns, which the silver contract guarantees non-null.

  - name: git_metric_observations
    description: >
      Source measure observations for the unified metrics runtime, git
      family. Day-grain measures emit one row per (tenant, entity, day,
      measure, dimension tuple); commit_day emits one row per dimensioned
      active-date subject. Duration and size measures intentionally retain one
      row per source event, so multiple rows per that key are valid — they
      feed median metrics, which aggregate over events at query time. The
      column set is the same published contract the analytics service schema
      validator probes (`OBSERVATION_COLUMNS`); changing it requires a
      coordinated backend change.
    columns:
      - name: tenant_id
        description: "Tenant isolation field"
        tests:
          - not_null
      - name: source_key
        description: "Logical source key registered in the metric registry"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['git']
      - name: entity_type
        description: "Measured entity type"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['person']
      - name: entity_id
        description: >
          Canonical person id — `entity_type + entity_id` identifies the
          measured entity, and for a person that identity IS the person id,
          stamped into the evidence relations once per gold build. Source rows
          whose email identity cannot resolve never reach this relation;
          identity_resolution_coverage counts them from evidence, which keeps
          the source email as source_entity_id.
        tests:
          - not_null
      - name: metric_date
        description: >
          Observation date: commit date for commit-derived measures,
          created_on for created-PR measures, first review for time to first
          review, and close date for merged-PR measures.
        tests:
          - not_null
      - name: observed_at
        description: >
          Intra-day observation timestamp for future point-in-time
          semantics. NULL for all git measures.
      - name: measure_key
        description: "Source measure key registered in the metric registry"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - commit_count
                  - commit_day
                  - commit_change_size
                  - code_lines_added
                  - test_lines_added
                  - test_and_code_lines_added
                  - lines_added
                  - lines_removed
                  - pr_created
                  - pr_created_merged
                  - pr_abandoned
                  - pr_reviewed
                  - pr_reviewer_count
                  - pr_multi_reviewed
                  - pr_merged
                  - pr_merged_without_approval
                  - pr_commit_count
                  - pr_cycle_hours
                  - pr_change_size
                  - pr_first_review_hours
                  - pr_review_wait_share
                  - pr_review_to_merge_hours
                  - pr_approval_to_merge_hours
                  - review_submitted
                  - pr_comment
                  - default_commit_count
                  - non_default_commit_count
                  - default_code_lines_added
                  - non_default_code_lines_added
                  - default_lines_added
                  - non_default_lines_added
                  - default_lines_removed
                  - non_default_lines_removed
                  - default_pr_created
                  - non_default_pr_created
                  - default_pr_merged
                  - non_default_pr_merged
      - name: value
        description: >
          Measure value. Rows are emitted only when the source provides a
          value, so value is never NULL; the column stays Nullable(Float64)
          in the published contract.
        tests:
          - not_null
      - name: subject_key
        description: >
          Distinct-count subject for future distinct-count semantics. NULL
          except on commit_day, where it contains the active calendar date.
      - name: dimensions
        description: >
          Array(Tuple(key, value, label)). `source` carries the git source
          discriminator with static product labels; `category` (file-change
          measures) carries the source-agnostic file classification computed
          by the shared gold macro.

  - name: collab_metric_observations
    description: >
      Source measure observations for the unified metrics runtime,
      collaboration family. Day-grain sum and presence measures emit one row
      per (tenant, entity, day, measure, dimension tuple). Distinct-count
      measures (active_day, active_modality) stamp the counted subject on
      subject_key and emit one row per (entity, day, subject); the runtime
      aggregates them with uniqExact(subject_key). The column set is the same
      published contract the analytics service schema validator probes
      (`OBSERVATION_COLUMNS`); changing it requires a coordinated backend
      change.
    columns:
      - name: tenant_id
        description: "Tenant isolation field"
        tests:
          - not_null
      - name: source_key
        description: "Logical source key registered in the metric registry"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['collab']
      - name: entity_type
        description: "Measured entity type"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['person']
      - name: entity_id
        description: >
          Canonical person id — `entity_type + entity_id` identifies the
          measured entity, and for a person that identity IS the person id,
          stamped into the evidence relations once per gold build. Source rows
          whose email identity cannot resolve never reach this relation;
          identity_resolution_coverage counts them from evidence, which keeps
          the source email as source_entity_id.
        tests:
          - not_null
      - name: metric_date
        description: "Observation date (activity date per source)."
        tests:
          - not_null
      - name: observed_at
        description: >
          Intra-day observation timestamp for future point-in-time
          semantics. NULL for all collaboration measures.
      - name: measure_key
        description: "Source measure key registered in the metric registry"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - total_chat_messages
                  - channel_posts
                  - direct_and_group_messages
                  - emails_sent
                  - emails_received
                  - emails_read
                  - files_engaged
                  - files_shared_internal
                  - files_shared_external
                  - files_shared
                  - meeting_hours
                  - meetings_attended
                  - meetings_organized
                  - adhoc_meetings_attended
                  - scheduled_meetings_attended
                  - focus_hours
                  - working_hours
                  - chat_active_day
                  - meeting_free_day
                  - active_day
                  - active_modality
      - name: value
        description: >
          Measure value. Rows are emitted only when the source provides a
          value, so value is never NULL; the column stays Nullable(Float64)
          in the published contract. Distinct-count measures carry a constant
          1 here and the counted subject on subject_key.
        tests:
          - not_null
      - name: subject_key
        description: >
          Distinct-count subject: the date for active_day, the modality for
          active_modality. NULL for sum and presence measures.
      - name: dimensions
        description: >
          Array(Tuple(key, value, label)). `tool` carries the collaboration
          tool discriminator (data_source with the insight_ prefix stripped)
          with static product labels; `scope` (files_shared only) carries the
          recipient scope (internal/external). Empty for whole-person
          measures (focus_hours, working_hours, meeting_free_day,
          active_modality).

  - name: task_metric_observations
    description: >
      Source measure observations for the unified metrics runtime, task-delivery
      family. Reconstructs per-issue lifecycle (status pivot, spans, close/reopen
      transitions) from the task class contracts. Day-grain sum measures emit one
      row per (tenant, entity, day, measure); event measures (dev_time_hours,
      resolution_days, pickup_days) emit one row per closed issue for query-time
      median. No distinct-count measure, so subject_key is NULL on every row. The
      column set is the same published contract the analytics service schema
      validator probes (`OBSERVATION_COLUMNS`); changing it requires a
      coordinated backend change.
    columns:
      - name: tenant_id
        description: "Tenant isolation field"
        tests:
          - not_null
      - name: source_key
        description: "Logical source key registered in the metric registry"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['task']
      - name: entity_type
        description: "Measured entity type"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['person']
      - name: entity_id
        description: >
          Canonical person id — `entity_type + entity_id` identifies the
          measured entity, and for a person that identity IS the person id,
          stamped into the evidence relations once per gold build. Source rows
          whose email identity cannot resolve never reach this relation;
          identity_resolution_coverage counts them from evidence, which keeps
          the source email as source_entity_id.
        tests:
          - not_null
      - name: metric_date
        description: >
          Observation date: close date for closed-issue measures, transition
          date for close/reopen measures, calendar day for worklog measures, and
          the build date for the stale_in_progress snapshot.
        tests:
          - not_null
      - name: observed_at
        description: "Reserved for point-in-time semantics. NULL for all task measures."
      - name: measure_key
        description: "Source measure key registered in the metric registry"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - tasks_closed
                  - bugs_fixed
                  - closed_non_bug
                  - due_date_on_time
                  - due_date_with_due
                  - slip_days_total
                  - late_count
                  - estimation_error_pct
                  - estimation_samples
                  - flow_dev_seconds
                  - flow_lead_seconds
                  - close_events
                  - reopened_within_14d
                  - worklog_seconds
                  - in_progress_seconds
                  - stale_in_progress
                  - dev_time_hours
                  - resolution_days
                  - pickup_days
      - name: value
        description: >
          Measure value. Rows are emitted only when the source provides a value,
          so value is never NULL; the column stays Nullable(Float64) in the
          published contract.
        tests:
          - not_null
      - name: subject_key
        description: "Unused by this family (no distinct-count measure); always NULL."
      - name: dimensions
        description: >
          Array(Tuple(key, value, label)). Per-issue count measures carry `type`
          — the issue type, keyed on its locale-independent name and labelled
          with its display name, so the closed-issue total splits into parts that
          add back up to it. An issue whose type is not reported at all falls in
          `__unknown__`. Empty for the day-grain and duration measures.

  - name: task_issue_state
    description: >
      Per-issue lifecycle state for the task-delivery observation pipeline:
      one row per assignee-resolved issue with tenant/email attribution, the
      current status category, the close time, and the scalar fields the
      observation measures read. Materialized so the field-history pivot runs
      once per build instead of once per measure branch.
    columns:
      - name: tenant_id
        description: "Tenant isolation field"
        tests:
          - not_null
      - name: entity_id
        description: "Lowercased assignee email"
        tests:
          - not_null
      - name: issue_id
        description: "Source issue identifier; unique per insight_source_id"
        tests:
          - not_null

  - name: task_status_spans
    description: >
      Per-issue status spans for the task-delivery observation pipeline: each
      status event paired with the next; the last span ends at the close for
      currently-done issues and stays live to build time otherwise. Feeds dev
      time, close/reopen transitions, and per-day in-progress splitting.
    columns:
      - name: issue_id
        description: "Source issue identifier"
        tests:
          - not_null
      - name: interval_start
        description: "Span start (status event time)"
        tests:
          - not_null

  - name: ci_metric_observations
    description: >
      Source measure observations for the unified metrics runtime, CI family —
      the first TENANT-grain family (issue #2803): entity_id is the tenant id,
      no identity resolution and no '' filter. Day-grain sums for counts and
      hours; run_duration_min passes through at event grain for median and
      percentile metrics. The column set is the same published contract the
      analytics service schema validator probes (`OBSERVATION_COLUMNS`);
      changing it requires a coordinated backend change.
    columns:
      - name: tenant_id
        description: "Tenant isolation field"
        tests:
          - not_null
      - name: source_key
        description: "Logical source key registered in the metric registry"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ci']
      - name: entity_type
        description: "Measured entity type — always the tenant for CI"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['tenant']
      - name: entity_id
        description: >
          The tenant id, verbatim — the shape the results compiler expects
          for tenant-entity reads (entity_id = tenant_id). No person ever
          appears in this family (issue #2803, decision 5).
        tests:
          - not_null
      - name: metric_date
        description: >
          Run start date for run measures, deployment creation date for
          deployments.
        tests:
          - not_null
      - name: observed_at
        description: "Reserved for point-in-time semantics. NULL for all CI measures."
      - name: measure_key
        description: "Source measure key registered in the metric registry"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - runs
                  - gate_runs
                  - gate_passed
                  - gate_first_try_passed
                  - gate_retried
                  - run_duration_min
                  - run_hours
                  - deployments
                  - runs_matched_commit
                  - commits_observed
      - name: value
        description: >
          Measure value. Rows are emitted only when the run feeds the measure,
          so value is never NULL; the column stays Nullable(Float64) in the
          published contract.
        tests:
          - not_null
      - name: subject_key
        description: "Unused by this family (no distinct-count measure); always NULL."
      - name: dimensions
        description: >
          Array(Tuple(key, value, label)). Run measures carry repository /
          pipeline / trigger / outcome / hour_block (two-hour start block of
          the run, UTC); deployments carry repository / environment /
          outcome / env_kind.

  - name: wiki_metric_observations
    description: >
      Source measure observations for the unified metrics runtime, wiki
      family. Day-grain sums over the wiki class contracts: page creation
      from the page snapshot, edit sessions and distinct pages edited from
      the per-author activity rollup, and comments received attributed to
      the page author. No event or distinct-count measures, so subject_key
      is NULL on every row and the model is a single value UNION branch.
      The column set is the same published contract the analytics service
      schema validator probes (`OBSERVATION_COLUMNS`); changing it requires
      a coordinated backend change.
    columns:
      - name: tenant_id
        description: "Tenant isolation field"
        tests:
          - not_null
      - name: source_key
        description: "Logical source key registered in the metric registry"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['wiki']
      - name: entity_type
        description: "Measured entity type"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['person']
      - name: entity_id
        description: >
          Canonical person id — `entity_type + entity_id` identifies the
          measured entity, and for a person that identity IS the person id,
          stamped into the evidence relations once per gold build. Source rows
          whose email identity cannot resolve never reach this relation;
          identity_resolution_coverage counts them from evidence, which keeps
          the source email as source_entity_id.
        tests:
          - not_null
      - name: metric_date
        description: >
          Observation date: page creation date for pages_created, edit day
          for edits/pages_edited, comment day for comments.
        tests:
          - not_null
      - name: observed_at
        description: "Reserved for point-in-time semantics. NULL for all wiki measures."
      - name: measure_key
        description: "Source measure key registered in the metric registry"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - pages_created
                  - edits
                  - pages_edited
                  - comments
      - name: value
        description: >
          Measure value. Rows are emitted only when the source provides a
          value, so value is never NULL; the column stays Nullable(Float64)
          in the published contract.
        tests:
          - not_null
      - name: subject_key
        description: "Unused by this family (no distinct-count measure); always NULL."
      - name: dimensions
        description: >
          Array(Tuple(key, value, label)). Empty for every wiki measure — the
          family carries no breakdown dimension.

  - name: account_attribute_values
    description: >
      Effective-dated person-attribute values per stable source account, built
      deterministically from silver.class_person_attribute_claims. Half-open
      validity [valid_from, valid_to); valid_to IS NULL is the currently
      effective value; a cleared attribute has no current row. Carries NO
      canonical person_id by design: account facts stay independent of person
      assignment, which is joined at query time, so identity corrections never
      rebuild this relation. Interval disjointness is asserted by
      tests/hr/assert_account_attribute_values_no_overlap.sql.
    columns:
      - name: insight_tenant_id
        description: "Tenant isolation field"
        tests:
          - not_null
      - name: insight_source_type
        description: "Source system discriminator (bamboohr, workday, ms-entra, active-directory)"
        tests:
          - not_null
      - name: insight_source_id
        description: "Source instance identifier"
        tests:
          - not_null
      - name: source_account_id
        description: "Stable native source-account identifier"
        tests:
          - not_null
      - name: field_id
        description: "Source field key exactly as delivered; source-instance scoped"
        tests:
          - not_null
      - name: value_id
        description: "Immutable source value identifier when available; NULL for all current HR sources"
      - name: value_label
        description: "Exact source value effective over the interval"
        tests:
          - not_null
      - name: valid_from
        description: "Inclusive start of validity"
        tests:
          - not_null
      - name: valid_to
        description: "Exclusive end of validity; NULL = currently effective"
      - name: ingested_at
        description: "Ingestion watermark of the opening claim"
        tests:
          - not_null

  - name: metric_entity_cohorts_current
    description: >
      Current cohort membership per person for peer comparison. One row per
      (tenant, entity_type, entity_id, cohort_key) — uniqueness is asserted by
      tests/gold/assert_metric_entity_cohorts_unique.sql, and since entity_id is
      the canonical person id that uniqueness is per PERSON: the model collapses
      a person's several HR emails itself and EXCLUDES anyone whose emails claim
      different org units, so the peer query reads it straight instead of
      repairing the grain per request. The column set is a published contract
      probed by the analytics service schema validator (`COHORT_COLUMNS`).
    columns:
      - name: tenant_id
        description: "Tenant isolation field"
        tests:
          - not_null
      - name: entity_type
        description: "Entity type the cohort row applies to"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['person']
      - name: entity_id
        description: >
          Canonical person id — `entity_type + entity_id` identifies the
          measured entity, and for a person that identity IS the person id,
          stamped into the evidence relations once per gold build. Source rows
          whose email identity cannot resolve never reach this relation;
          identity_resolution_coverage counts them from evidence, which keeps
          the source email as source_entity_id.
        tests:
          - not_null
      - name: cohort_key
        description: "Cohort basis identifier"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['org_unit']
      - name: cohort_id
        description: >
          Cohort membership value: org unit id when present, department name
          fallback otherwise. NULL when the person has neither.

  - name: identity_resolution_coverage
    description: >
      Identity-resolution match rate measured over ACTIVITY (evidence source
      rows), one row per source (git/ai_usage/ai_cost/collab/task/wiki) plus
      hr_cohorts for the peer-membership relation. A TABLE materialized in
      the same gold build as the serving relations, reading the resolution
      snapshot stamped into evidence — so coverage answers for exactly what
      is served, never a fresher map. Row-weighted on purpose —
      unresolved_rows counts what the dashboards actually lose;
      unresolved_people counts the distinct unknown emails behind the gap
      (roughly the operator decisions that would close it). The "match rate
      is reported" surface of the identity epic for the metrics pipeline.
    columns:
      - name: source_key
        description: "Observation source_key, or 'hr_cohorts' for the cohort membership"
        tests:
          - not_null
      - name: observation_rows
        description: "Total observation rows for the source"
      - name: unresolved_rows
        description: "Source rows whose email identity cannot resolve"
      - name: unresolved_people
        description: "Distinct entity_id (emails) behind the unresolved rows"
      - name: match_rate_pct
        description: "Share of source rows that resolve to a person, percent (1 decimal)"
