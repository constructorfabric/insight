name: confluence
# 1.2.0: substream children (versions + footer/inline comments + replies)
# now IGNORE HTTP 404 — a parent page/comment deleted mid-sync no longer
# fails the whole sync (Jira/Zendesk substream large-data lesson). Parents
# (spaces/pages) keep the strict handler. Additive → MINOR per ADR-0015.
# 1.3.0: connections carry destinationSyncMode append_dedup with
#   primaryKey unique_key, so the Airbyte destination owns the bronze table
#   shape and the RMT promotion step is gone (#2877). MINOR per ADR-0015:
#   reconcile must republish this connector so the connection catalog is
#   refreshed; nothing already stored changes meaning.
version: "1.3.0"
schedule: "0 4 * * *"
workflow: sync

# Silver routing (class_wiki_pages, class_wiki_activity, class_wiki_engagement)
# enabled via dbt tags on the staging models (silver:class_wiki_pages,
# silver:class_wiki_activity, silver:class_wiki_engagement).
# silver_targets prohibited per Connector Spec §4.10 — Silver determined by dbt_select tags.
dbt_select: "tag:confluence+"

connection:
  namespace: bronze_confluence
secret:
  required_fields:
    - confluence_instance_url
    - confluence_email
    - confluence_api_token
    - confluence_start_date
