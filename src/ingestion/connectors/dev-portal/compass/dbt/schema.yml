version: 2

sources:
  - name: bronze_compass
    # The deployment-event feed is a rolling ~2-week window with no backfill,
    # so a stalled sync is not recoverable by catching up later. Warn well
    # inside that window.
    freshness:
      warn_after: {count: 36, period: hour}
      error_after: {count: 72, period: hour}
    loaded_at_field: _airbyte_extracted_at
    schema: bronze_compass
    tables:
      - name: components
      - name: scorecards
      - name: component_scorecard_scores
      - name: teams
      - name: team_members
      - name: deployment_events

models:
  - name: compass__components
    description: "Deduplicated Compass component catalog — one row per component, with its owning team id and the raw JSON columns (labels, links, event sources, dependency edges) that silver will flatten."
    columns:
      - name: unique_key
        tests:
          - not_null
          - unique
      - name: component_id
        tests:
          - not_null
      - name: name
        tests:
          - not_null
