# Atlassian Compass — service catalog, ownership, scorecards, deployment events.
#
# No silver yet: `dbt_select` resolves to the single staging model
# `compass__components` and nothing downstream of it. Silver class families are
# sketched in SPEC.md §7 and deliberately deferred.
name: compass
type: nocode
# Strict semver per ADR-0015 — three components, no leading zeros.
# 1.1.0: connections carry destinationSyncMode append_dedup with
#   primaryKey unique_key, so the Airbyte destination owns the bronze table
#   shape and the RMT promotion step is gone (#2877). MINOR per ADR-0015:
#   reconcile must republish this connector so the connection catalog is
#   refreshed; nothing already stored changes meaning.
# 1.2.0: the tenant segment of unique_key comes from insight_tenant_key, so a
#   warm install keeps its keys when tenant_id moves to the canonical tenant
#   UUID. MINOR per ADR-0015: no stored key changes.
version: "1.2.0"
# Daily is a floor, not a preference: the Compass event feed is a rolling
# window with no backfill, so a skipped run loses deployment events for good.
schedule: "0 2 * * *"
workflow: sync
dbt_select: "tag:compass+"

connection:
  namespace: "bronze_compass"

secret:
  required_fields:
    - atlassian_email
    - atlassian_api_token
    - atlassian_cloud_id
