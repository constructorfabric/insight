name: jira
# 2.0.0 (major): project scope moved from the jira_project_keys allowlist to
# runtime auto-discovery; per-project partitioning resets incremental state —
# reconcile dispatches a full refresh on major bumps (ADR-0015), which is the
# intended migration.
# 2.0.1 (patch): force global_substream_cursor on jira_issue/jira_issue_keys —
# 2.0.0's per-partition cursor did not persist, making every sync a full
# re-sync. Bump required so reconcile republishes the manifest.
# 2.0.2 (patch): widen jira_project_discovery cursor_datetime_formats so it can
# parse child-stream cursor values carried in parent_state (was crashing with
# "No format ['%Y-%m-%dT%H:%M:%S.%f%z'] matching 2026-06-15 02:00").
# 3.0.0 (major): declare jira_issue_history.items as a plain string so the
# CDK's literal-eval render survives, and repair the rows already stored
# double-encoded; the full refresh a major dispatches is what re-derives the
# field-history journal from the repaired Bronze.
# 4.0.0 (major): deletion/visibility + data-completeness scope (#2419).
# New streams: jira_project_visibility, jira_issue_census (absence censuses),
# jira_worklog_deleted (tombstones), jira_board_configuration; expand=lead on
# jira_projects; story-points field id resolved from /field metadata instead
# of a hardcoded default. MAJOR because the silver contract changes shape —
# class_task_worklogs gains is_deleted and class_task_field_history's
# event_kind gains the 'availability' and 'lifecycle' values — and per
# ADR-0015 a major bump dispatches the one-shot sync with dbt --full-refresh
# that rebuilds those tables; no ALTER migrations are shipped.
# 5.0.0 (major): jira-enrich carries the issue summary into the class contract's
# `title`, so task evidence rows can name the work item. MAJOR because the fix
# only reaches rows the binary writes, and it skips any issue that already has
# them — the deploy hook empties the staging table and the one-shot sync a major
# dispatches is what re-bootstraps every issue with its summary (#2738).
# 5.4.0 (minor): stop emitting the raw `fields` object on jira_issue. It was
# the same payload `custom_fields_json` already carries, re-serialized — the key
# sets are identical and every value difference is nested-key ordering — and it
# was the larger of the two by a wide margin. MINOR, not major: nothing needs
# re-deriving, the column is simply no longer produced. It must be removed from
# bronze in this order, or the destination recreates it: bump and deploy, let a
# sync complete, then the ALTER migration.
# 6.0.0 (major): key jira_issue and jira_issue_keys on the issue's immutable
# numeric id instead of its "PROJ-123" key. Jira changes that key when an issue
# moves between projects, and bronze replaces rows by `unique_key` — so a moved
# issue stopped replacing itself: the new key inserted a second row and the old
# one stayed behind with a stale payload, leaving the issue present twice
# downstream, once with its real history and once as a ghost.
#
# Rows written before this are rebuilt by `heal_jira_issue_key` in
# apply-ch-migrations.sh: `unique_key` is the sort key and cannot be updated in
# place, so the table is copied with the new key, one row per issue, and
# swapped in atomically. Readers dedup by (source_id, jira_id) regardless — the
# issue's stable key within a source, which is what joins use; `unique_key`
# exists for ReplacingMergeTree alone. `id_readable` keeps the mutable key as
# an attribute — the rename is a fact about the issue.
#
# MAJOR because the key an existing row is stored under changes, which is what
# a major means here; the full refresh it dispatches also clears anything
# derived while the two copies were both visible.
# 6.1.0 (minor): jira_issue_history, jira_comments and jira_worklogs carry
# `jira_id`, the parent issue's immutable numeric id, taken from the parent
# slice. Each of these substreams is partitioned by the issue KEY and stamped
# only `id_readable`, the key at fetch time — so after an issue moved between
# projects nothing in its changelog, comments or worklogs named the issue by
# anything stable, and every reader had to recover the id by joining on a key
# that no longer matched. MINOR: a new column, nothing re-derived; rows written
# before this are filled by `heal_jira_substream_issue_id` from the two issue
# streams.
version: "6.2.0"
schedule: "0 3 * * *"
workflow: sync
# CI build metadata + runtime image refs (ADR-0016). The `images:` block is
# the sole source of truth: CI scans it via dynamic discovery to know what
# to build, and reconcile reads images.enrich.image to pass to the
# tt-enrich-jira-run workflow on each submission. Keys with runtime
# semantics: `cdk` (CDK source image — absent for jira; jira is nocode/
# manifest-based and served by Airbyte's first-party source-jira image),
# `enrich` (jira-enrich Rust sidecar).
images:
  enrich:
    name: insight-jira-enrich
    dockerfile: ./enrich/Dockerfile
    context: ./enrich
    image: "ghcr.io/constructorfabric/insight-jira-enrich:2026.09.11.16.23-7e78828"
# Silver routing (class_task_*) is delivered by the task-tracking Silver layer
# package, not by this connector. The pipeline runs the jira-rust path:
# dbt(tag:jira) → tt-enrich-jira-run → dbt(<selector below>). The selector is
# the third step: the silver models that union jira staging (class_task_*)
# plus the gold task-delivery chain downstream of them (space = union of the
# two intersections) — not the full silver or gold layers. See DESIGN §1.1
# and §3.2.
dbt_select: "tag:silver,tag:jira+ tag:gold,tag:jira+"
connection:
  namespace: bronze_jira
secret:
  required_fields:
    - jira_instance_url
    - jira_email
    - jira_api_token
