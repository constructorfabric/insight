version: 2

# Bronze (Airbyte-produced) source declarations.
# Connector-level models union into silver `class_task_*` via `union_by_tag`
# (see src/ingestion/silver/task-tracking/).

sources:
  - name: bronze_jira
    # Source freshness (TAF #1322): the newest Airbyte row must be recent,
    # else the sync silently stopped and dashboards go stale with no error.
    freshness:
      warn_after: {count: 36, period: hour}
      error_after: {count: 72, period: hour}
    loaded_at_field: _airbyte_extracted_at
    schema: bronze_jira
    tables:
      - name: jira_fields
      - name: jira_projects
      - name: jira_user
      - name: jira_issue
      - name: jira_issue_history
      - name: jira_comments
      - name: jira_worklogs
      - name: jira_sprints
      - name: jira_boards
      # Lightweight substream parent (issue key + updated). Also read by the
      # availability classifier (id↔key mapping).
      - name: jira_issue_keys
      # Normalized lookup streams — populated globally per source instance.
      # `jira_issue` references these by ID only; display names come from JOIN.
      - name: jira_statuses
      - name: jira_priorities
      - name: jira_issuetypes
      - name: jira_resolutions
      # Deletion/visibility censuses (specs/DELETION-AND-VISIBILITY.md):
      # full-refresh streams; after RMT promotion each row's
      # _airbyte_extracted_at is the entity's last-seen timestamp.
      - name: jira_project_visibility
      - name: jira_issue_census
      # Worklog deletion tombstones from /rest/api/3/worklog/deleted.
      - name: jira_worklog_deleted
      # Per-board estimation field + column-to-status mapping.
      - name: jira_board_configuration

models:
  - name: jira__bronze_promoted
    description: |
      Bootstrap model that promotes every Airbyte-managed `bronze_jira.*` table from
      MergeTree to ReplacingMergeTree(_airbyte_extracted_at) with a natural-key
      ORDER BY. Idempotent — subsequent runs are no-ops once tables are RMT.

      Every other Jira staging model declares a `depends_on` comment referencing
      this model, so dbt's DAG materializes the view (and runs the migration
      side effects) before any model reads bronze.
  - name: jira__task_comments
    description: "Per-source staging projection of Jira comments. Unioned into silver.class_task_comments."
  - name: jira__task_worklogs
    description: "Per-source staging projection of Jira worklogs. Unioned into silver.class_task_worklogs."
  - name: jira__task_users
    description: "Per-source staging projection of Jira users. Unioned into silver.class_task_users."
  - name: jira__task_projects
    description: "Per-source staging projection of Jira projects. Unioned into silver.class_task_projects."
  - name: jira__task_sprints
    description: "Per-source staging projection of Jira sprints. Unioned into silver.class_task_sprints."
  - name: jira__task_field_metadata
    description: "Per-source staging projection of Jira field catalog. Unioned into silver.class_task_field_metadata."
  - name: jira__task_field_unclassified
    description: "Registry of fields the changelog names but the field catalogue does not contain, with their event range. Their history cannot be reconstructed; see specs/FIELD-HISTORY-IN-DBT.md §3.2."
  - name: jira__catalogue_first_seen
    description: "Per-source instant of the first field-catalogue sync, written once and kept: bronze keeps only each field's latest extraction once its parts merge, so the value cannot be recomputed later. Input to the recency guard of specs/FIELD-HISTORY-IN-DBT.md §3.2."
  - name: jira__task_field_kind
    description: "Per-source field classification into the closed field_kind enum that drives value normalization and delta application. Matched on Jira type constants, never on instance-specific field ids. See specs/FIELD-HISTORY-IN-DBT.md."
  - name: jira__changelog_entry_ranks
    description: "Rank of each changelog entry among the entries its issue recorded at the same instant, from the from→to chains of every field they touch, then the numeric changelog id. One row per entry of such an instant; an entry alone at its instant has none and ranks 0. Read by jira__field_history_derived into event_order. See specs/FIELD-HISTORY-IN-DBT.md §5."
    columns:
      - name: unique_key
        description: "Source, issue and changelog id."
        tests:
          - unique
          - not_null
      - name: changelog_id
        description: "The entry, as the changelog id string the journal carries as event_id."
      - name: entry_rank
        description: "0-based position of the entry within its issue's instant, shared by every field the entry changed."
  - name: jira__task_statuses
    description: "Per-source status dimension: Jira status_id → status_category (via statusCategory). Unioned into silver.class_task_statuses. See issue #1541."
  - name: jira__task_issuetypes
    description: "Per-source issue-type dimension: the raw Jira type catalogue (id, display name, untranslatedName). Unioned into silver.class_task_issuetypes; gold resolves the kind from config.field_value_map."
  - name: jira__identity_inputs
    description: "Identity-resolution inputs from the Jira user profile history (email, display_name, id binding). Unioned into silver.identity_inputs via the silver:identity_inputs tag."
  - name: jira__project_visibility_state
    description: "Current visibility per ever-seen project: is_visible + project_status derived from the jira_project_visibility census (absent from the latest generation = not visible). Input to the SCD2 snapshot."
  - name: jira__project_visibility_snapshot
    description: "Append-only SCD2 over project visibility — a version per is_visible/project_status flip. Permanent record of when the account gained or lost sight of a project."
  - name: jira__project_visibility_history
    description: "Per-field change events (is_visible, project_status: old → new @ ts) derived from the visibility snapshot."
  - name: jira__issue_availability_state
    description: "Current availability per ever-seen issue (present / deleted / archived / trashed / access_lost / unobserved), classified from the jira_issue_census absence against the project visibility roster. See specs/DELETION-AND-VISIBILITY.md."
  - name: jira__issue_availability_snapshot
    description: "Append-only SCD2 over issue availability — a version per state flip. Deletion is recorded here as an event in the issue's history, never as a physical delete."
  - name: jira__issue_availability_history
    description: "Per-issue availability transition events (availability: old → new @ detection time) derived from the availability snapshot."
  - name: jira__availability_events
    description: "Availability transitions as synthetic field-history events (field_id='availability', event_kind='availability'). Unioned into silver.class_task_field_history so an issue's whole lifecycle — including deletion and lost access — lives in one source-agnostic table."
  - name: jira__comment_state
    description: "Current state per comment including is_deleted (missing from a later read of its issue's comment list, or parent-issue availability). Feeds the class projection and the lifecycle snapshot chain."
  - name: jira__comment_snapshot
    description: "Append-only SCD2 over comment state — a version per edit (updated_at) or deletion flip."
  - name: jira__comment_lifecycle_history
    description: "Per-field transitions derived from the comment snapshot; raw input for the lifecycle events."
  - name: jira__comment_lifecycle_events
    description: "Comment add/set/remove as field-history events (field_id='comment', event_kind='lifecycle'); value carries the comment id — the lookup key into class_task_comments. Unioned into silver.class_task_field_history."
  - name: jira__worklog_state
    description: "Current state per worklog including is_deleted (tombstone + parent-issue availability) and the tombstone's real deletion timestamp. Feeds the class projection and the lifecycle snapshot chain."
  - name: jira__worklog_snapshot
    description: "Append-only SCD2 over worklog state — a version per edit (updated_at / seconds / started) or deletion flip."
  - name: jira__worklog_lifecycle_history
    description: "Per-field transitions derived from the worklog snapshot; raw input for the lifecycle events."
  - name: jira__worklog_lifecycle_events
    description: "Worklog add/set/remove as field-history events (field_id='worklog', event_kind='lifecycle'); value carries the worklog id — the lookup key into class_task_worklogs; remove is dated by the /worklog/deleted tombstone when available. Unioned into silver.class_task_field_history."
  - name: jira__link_occurrences
    description: "Every link occurrence an issue has had — one link of one type to one linked issue, keyed by the type's immutable id and direction, or by its phrase when it resolves to no type — with the changelog operations that opened and closed it and whether it was held before them. Read by jira__task_links."
    columns:
      - name: unique_key
        description: "Source, issue, kind, occurrence key and the linked issue."
        tests:
          - unique
          - not_null
      - name: occurrence_key
        description: "'type:<type id>:<direction>', 'phrase:<phrase>' for a phrase resolved to no type, or 'parent'."
  - name: jira__issue_read_current
    description: >
      Latest key, creation/update times and read timestamp per issue, materialized once for link
      retention and interval labels. Rebuilt from bronze on each sync; contains no issue JSON.
    columns:
      - name: unique_key
        description: "Source and immutable issue id."
        tests:
          - unique
          - not_null
      - name: insight_source_id
        description: "Connector source instance."
      - name: issue_id
        description: "Immutable Jira issue id."
      - name: current_key
        description: "Readable key from the issue's newest read."
      - name: created_at
        description: "Issue creation time from the newest read carrying a parseable value."
      - name: updated_at
        description: "Issue update time from the newest read carrying a parseable value."
      - name: read_at
        description: "Newest issue extraction timestamp."
      - name: _version
        description: "Model build timestamp in epoch milliseconds."
  - name: jira__issue_link_current
    description: >
      Issue links and parents shown by each issue's newest read, parsed in a single streaming
      unpivot after raw-id deduplication. Rebuilt on every sync; jira__issue_link_snapshot adds
      retained observations from earlier reads while the other issue is hidden.
    columns:
      - name: unique_key
        description: "Source, issue, kind, the link's own id and the linked issue."
        tests:
          - unique
          - not_null
      - name: insight_source_id
        description: "Connector source instance."
      - name: issue_id
        description: "Immutable id of the issue holding the link."
      - name: id_readable
        description: "Readable key of the issue holding the link."
      - name: kind
        description: "issuelink | parent."
      - name: link_id
        description: "The link object's own id; empty for a parent."
      - name: type_id
        description: "Immutable link type id; empty for a parent."
      - name: type_name
        description: "Link type name; empty for a parent."
      - name: type_outward
        description: "Link type's outward phrase; empty for a parent."
      - name: type_inward
        description: "Link type's inward phrase; empty for a parent."
      - name: direction
        description: "outward | inward; empty for a parent."
      - name: relation
        description: "Phrase for this side of the link; parent for a parent."
      - name: target_id
        description: "Other issue's id as the read names it; empty when only its key is available."
      - name: target_key
        description: "Other issue's readable key as the read names it."
      - name: extracted_at
        description: "Issue extraction timestamp of this observation."
      - name: _version
        description: "Model build timestamp in epoch milliseconds."
  - name: jira__issue_link_snapshot
    description: >
      Issue links and parents from each issue's newest read, retaining earlier links omitted while the
      other issue was hidden at that read. Replaces the table while remembering its prior rows, even
      under full refresh. Supplies occurrence identities, key-to-id mappings and reference labels.
      Visible versions begin at census last_seen_at; absent or invisible versions begin one millisecond later,
      without adding the census tolerance to these boundaries;
      see specs/DELETION-AND-VISIBILITY.md.
    columns:
      - name: unique_key
        description: "Source, issue, kind, the link's own id and the linked issue."
        tests:
          - unique
          - not_null
      - name: kind
        description: "issuelink | parent."
        tests:
          - accepted_values:
              values: ['issuelink', 'parent']
      - name: link_id
        description: "The link object's own id; empty for a parent."
      - name: type_id
        description: "The link type's immutable id; empty for a parent. Its name and phrases can be reworded, the id cannot."
      - name: type_name
        description: "The link type's name (Blocks, Duplicate, ...); empty for a parent."
      - name: type_outward
        description: "The type's outward phrase (\"blocks\")."
      - name: type_inward
        description: "The type's inward phrase (\"is blocked by\")."
      - name: direction
        description: "outward when this issue holds the outward phrase, inward otherwise; empty for a parent."
      - name: relation
        description: "The phrase this issue holds, as the changelog renders it; `parent` for a parent."
      - name: target_id
        description: "The linked issue's immutable id."
      - name: target_key
        description: "The linked issue's current key."
      - name: extracted_at
        description: "When bronze received the issue row showing this link; retained rows keep the earlier read's timestamp."
  - name: jira__issue_key_ids
    description: "Every key an issue is known to have had, with its immutable id: the issue's own bronze rows, Key events of moved issues, the links snapshots hold, and parent changes. Resolves the keys the changelog names linked issues by."
    columns:
      - name: unique_key
        description: "Source and key."
        tests:
          - unique
          - not_null
      - name: issue_key
        description: "A key the issue has or had."
      - name: issue_id
        description: "The issue's immutable id."
        tests:
          - not_null
  - name: jira__task_references
    description: "Per-source staging projection of the issues each Jira issue points at — through a link, a key in a field value, or a key in a live comment — resolving written keys through jira__issue_key_ids. Unioned into silver.class_task_references."
    columns:
      - name: unique_key
        tests:
          - not_null
          - unique
  - name: jira__task_links
    description: >
      Jira link and parent intervals folded from changelog operations, seeded from retained link snapshots.
      A newest read can close an event-open interval only when the other issue was observable at that read;
      a link shown by the newest read can reopen an event-closed interval. Parent intervals mirror as sub_issue.
      Unioned into silver.class_task_links.
    columns:
      - name: unique_key
        description: "Source, issue, link type, relation, linked issue (its id, or its key when the key resolves to none) and valid_from."
        tests:
          - unique
          - not_null
      - name: link_type
        description: "parent | sub_issue | blocked_by | blocking | duplicate_of | connected. Jira's Blocks and Duplicate types map by name and direction, then Jira's default wording; every other type is connected."
        tests:
          - accepted_values:
              values: ['parent', 'sub_issue', 'blocked_by', 'blocking', 'duplicate_of', 'connected']
      - name: target_id
        description: "The linked issue's immutable id; NULL when its key resolves to no id (a project the connector cannot read, an issue deleted before it was read)."
      - name: evidence
        description: >
          event when folded without an observation edge; observation when a newest read reopens a link
          or closes it while the other issue is observable. Omission during a visibility gap is not an edge.
