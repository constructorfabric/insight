name: youtrack
# 1.1.0: connections carry destinationSyncMode append_dedup with
#   primaryKey unique_key, so the Airbyte destination owns the bronze table
#   shape and the RMT promotion step is gone (#2877). MINOR per ADR-0015:
#   reconcile must republish this connector so the connection catalog is
#   refreshed; nothing already stored changes meaning.
# 2.0.0: Silver transforms (class_task_* staging models) land for YouTrack.
#   Bronze: activities drop AttachmentRecognizedTextCategory, whose events the
#   server fails to resolve (HTTP 500 on every page that holds one), and
#   youtrack_issue_sprints reads only issues changed in the incremental window
#   — the updated: search plus the SprintCategory activity feed — instead of
#   every accessible issue. MAJOR per ADR-0015: the staging models are new
#   tables that the scoped full refresh a major dispatches builds from Bronze.
version: "2.0.0"
schedule: 0 2 * * *
workflow: sync
dbt_select: tag:youtrack+
connection:
  namespace: bronze_youtrack
secret:
  required_fields:
    - youtrack_base_url
    - youtrack_token
    - youtrack_start_date
