name: zoom
# 1.2.1 (patch): republish the manifest carrying the Cloudflare-WAF skip filter
# on the participants stream (#1933). The fix landed in connector.yaml without a
# version bump, and reconcile publishes a new manifest only on descriptor-version
# drift (current 1.2.0 == target 1.2.0 → noop), so Airbyte kept serving the
# pre-fix manifest and every zoom sync kept dying on the blocked meeting UUID.
# Patch bump per ADR-0015: republish + catalog re-discover, NO full-refresh
# (bronze→silver semantics unchanged).
# 1.3.0: connections carry destinationSyncMode append_dedup with
#   primaryKey unique_key, so the Airbyte destination owns the bronze table
#   shape and the RMT promotion step is gone (#2877). MINOR per ADR-0015:
#   reconcile must republish this connector so the connection catalog is
#   refreshed; nothing already stored changes meaning.
# 2.0.0 (major): meeting time counts only while someone else was in the meeting,
#   and a session with nobody else is not a meeting. MAJOR so reconcile runs the
#   one-shot `dbt --full-refresh` that recomputes history already in staging/silver.
# 3.0.0 (major): time in the waiting room no longer counts as meeting time,
#   participants stop carrying device and network identifiers, and users are
#   listed with inactive accounts so a deactivation reaches identity. MAJOR so
#   reconcile republishes the manifest and runs the one-shot `dbt --full-refresh`
#   that recomputes history without the waiting room.
# 4.0.0 (major): a participant who joined without signing in is attributed through
#   the account's user list when exactly one Zoom user carries the display name.
#   MAJOR so reconcile runs the one-shot `dbt --full-refresh` that recomputes the
#   history those joiners were dropped from.
# 5.0.0 (major): a joiner no Zoom user is named after is kept as a `zoom-guest`
#   account (person_key, account triple) for an operator to bind in the identity
#   console; the meeting feeder and the class gain the three account columns.
#   MAJOR so reconcile runs the one-shot `dbt --full-refresh` that writes the
#   guest rows back into history.
# 6.0.0 (major): the meeting feeder and the class name the meetings a day's
#   count stands for, so a meeting joined from two of a person's addresses
#   counts once. MAJOR so reconcile runs the one-shot `dbt --full-refresh` that
#   fills the keys for history; a day without them keeps counting per address.
version: "6.0.0"
schedule: 0 3 * * *
dbt_select: tag:zoom+
workflow: sync
connection:
  namespace: bronze_zoom
secret:
  required_fields:
    - zoom_account_id
    - zoom_client_id
    - zoom_client_secret
