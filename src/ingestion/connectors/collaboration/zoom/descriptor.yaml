name: zoom
# 1.2.1 (patch): republish the manifest carrying the Cloudflare-WAF skip filter
# on the participants stream (#1933). The fix landed in connector.yaml without a
# version bump, and reconcile publishes a new manifest only on descriptor-version
# drift (current 1.2.0 == target 1.2.0 → noop), so Airbyte kept serving the
# pre-fix manifest and every zoom sync kept dying on the blocked meeting UUID.
# Patch bump per ADR-0015: republish + catalog re-discover, NO full-refresh
# (bronze→silver semantics unchanged).
# 1.3.0: connections carry destinationSyncMode append_dedup with
#   primaryKey unique_key, so the Airbyte destination owns the bronze table
#   shape and the RMT promotion step is gone (#2877). MINOR per ADR-0015:
#   reconcile must republish this connector so the connection catalog is
#   refreshed; nothing already stored changes meaning.
# 2.0.0 (major): meeting time counts only while someone else was in the meeting,
#   and a session with nobody else is not a meeting. MAJOR so reconcile runs the
#   one-shot `dbt --full-refresh` that recomputes history already in staging/silver.
version: "2.0.0"
schedule: 0 3 * * *
dbt_select: tag:zoom+
workflow: sync
connection:
  namespace: bronze_zoom
secret:
  required_fields:
    - zoom_account_id
    - zoom_client_id
    - zoom_client_secret
