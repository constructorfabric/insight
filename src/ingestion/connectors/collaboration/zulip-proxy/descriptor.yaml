name: zulip-proxy
# 1.1.0: connections carry destinationSyncMode append_dedup with
#   primaryKey unique_key, so the Airbyte destination owns the bronze table
#   shape and the RMT promotion step is gone (#2877). MINOR per ADR-0015:
#   reconcile must republish this connector so the connection catalog is
#   refreshed; nothing already stored changes meaning.
# 2.0.0 (major): guest accounts (role 600) no longer reach chat activity. MAJOR so
#   reconcile runs the one-shot `dbt --full-refresh` that purges rows written
#   before the filter.
version: "2.0.0"
schedule: 0 3 * * *
dbt_select: tag:zulip-proxy+
workflow: sync
connection:
  namespace: bronze_zulip_proxy
secret:
  required_fields:
    - zulip_proxy_base_url
    - zulip_proxy_api_key
    - zulip_proxy_start_date
