version: 2

sources:
  - name: bronze_github
    # Source freshness (TAF #1322): the newest Airbyte row must be recent,
    # else the sync silently stopped and dashboards go stale with no error.
    freshness:
      warn_after: {count: 36, period: hour}
      error_after: {count: 72, period: hour}
    loaded_at_field: _airbyte_extracted_at
    schema: bronze_github
    tables:
      - name: repositories
      - name: branches
      - name: commits
      - name: file_changes
      - name: pull_requests
      - name: pull_request_reviews
      - name: pull_request_comments
      - name: pull_request_review_comments
      - name: pull_request_commits
      - name: pull_request_diff_stats
      - name: issues
      - name: projects_v2
      - name: workflow_runs
      - name: deployments
      - name: deployment_statuses
      - name: pull_request_timeline_events
      - name: issue_timeline_events
      - name: commit_authors

models:
  - name: github__bronze_promoted
    description: "Promotes every GitHub bronze table to ReplacingMergeTree keyed on unique_key"

  - name: github__item_events
    description: "GitHub issue and pull-request lifecycle events -> staging, feeds class_git_item_events"

  - name: github__repositories
    description: "GitHub repositories -> staging, feeds class_git_repositories"

  - name: github__repository_branches
    description: "GitHub branches -> staging, feeds class_git_repository_branches"

  - name: github__commits
    description: "GitHub commits -> staging, feeds class_git_commits"

  - name: github__file_changes
    description: "GitHub file changes (PR + direct push) -> staging, feeds class_git_file_changes"

  - name: github__pull_requests
    description: "GitHub pull requests -> staging, feeds class_git_pull_requests"

  - name: github__pull_requests_reviewers
    description: "GitHub PR reviews -> staging, feeds class_git_pull_requests_reviewers"

  - name: github__pull_requests_comments
    description: "GitHub PR comments -> staging, feeds class_git_pull_requests_comments"

  - name: github__pull_requests_commits
    description: "GitHub PR commits -> staging, feeds class_git_pull_requests_commits"

  - name: github__account_emails
    description: "Every (GitHub account, e-mail) pair the connector observed, one row per pair"
    columns:
      - name: login
        description: "Lowercased GitHub login the e-mail was observed under (ADR-0002 account id)"
        data_tests:
          - not_null
      - name: email
        description: "Lowercased e-mail address the account committed under or published"
        data_tests:
          - not_null
      - name: observed_in
        description: "Bronze field that first named this pair, carried onto the claim as provenance"
      - name: observed_at
        description: "Earliest time the pair was observed"

  - name: github__identity_inputs
    description: "E-mail claims against GitHub accounts -> staging, feeds silver.identity_inputs"
    columns:
      - name: unique_key
        description: "One claim per (tenant, account, value_type, operation, e-mail)"
        data_tests:
          - not_null
          - unique
      - name: source_account_id
        description: "Lowercased GitHub login the claim is made against"
      - name: value
        description: "The claimed e-mail address"
