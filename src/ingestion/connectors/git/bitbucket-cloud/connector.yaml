          - type: AddedFieldDefinition
            path: [state_name]
            value: "{{ (record.get('state') or {}).get('name') or '' }}"
            value_type: string
          - type: AddedFieldDefinition
            path: [result_name]
            value: "{{ ((record.get('state') or {}).get('result') or {}).get('name') or '' }}"
            value_type: string
          - type: AddedFieldDefinition
            path: [target_ref]
            value: "{{ (record.get('target') or {}).get('ref_name') or '' }}"
            value_type: string
          - type: AddedFieldDefinition
            path: [target_commit_sha]
