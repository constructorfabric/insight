name: bitbucket-cloud
version: "1.18.0"
type: cdk
# A slot of its own: replication pods sharing a slot with other connector
# syncs can be starved of workers, which surfaces as startup and activity
# timeouts rather than as a connector error.
schedule: "0 5 * * *"
workflow: sync
# CI build metadata + runtime image refs (ADR-0016).
images:
  cdk:
    name: source-bitbucket-cloud-insight
    dockerfile: ./Dockerfile
    context: .
    image: "ghcr.io/constructorfabric/source-bitbucket-cloud-insight:2026.08.20.11.19-2b469e9"
dbt_select: "tag:bitbucket-cloud+"
connection:
  namespace: "bronze_bitbucket_cloud"
secret:
  required_fields:
    - bitbucket_token
    - bitbucket_workspaces
