name: bitbucket-cloud
# Strict semver per ADR-0015. 4.0.0: dbt staging carries the pull request's
#   author account id into the class-contract column author_account_id, the
#   key person attribution resolves through. MAJOR for the same reason as
#   github 5.0.0 — the id has been in Bronze all along, but staging never
#   re-reads Bronze, so the column heals to '' on existing rows and only the
#   one-shot scoped `dbt --full-refresh` a major bump dispatches
#   re-materializes the history.
version: "4.0.1"
# A slot of its own: replication pods sharing a slot with other connector
# syncs can be starved of workers, which surfaces as startup and activity
# timeouts rather than as a connector error.
schedule: "0 5 * * *"
workflow: sync

# Silver routing via dbt tags on the staging models.
# silver_targets prohibited per Connector Spec §4.10 — Silver is determined by
# the dbt tags, and the pipeline's silver step hardcodes `tag:<slug>+`.
dbt_select: "tag:bitbucket-cloud+"

# The proxy's address and bearer token belong to the platform, not to the
# operator: the chart owns both and publishes them into the reconcile CronJob,
# which injects them into this connector's source config. A Secret carrying them
# would be a second copy of a port and a token that the chart can change.
platform_config:
  git_proxy: true

secret:
  # The pre-flight Secret validator reads this list and nothing else, so it
  # carries every field the operator must supply — the proxy address and token
  # are not among them, because platform_config.git_proxy injects those.
  required_fields:
    - bitbucket_token
    - bitbucket_workspaces
    - bitbucket_start_date

connection:
  namespace: bronze_bitbucket_cloud
