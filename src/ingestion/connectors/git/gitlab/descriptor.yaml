# Strict semver per ADR-0015. 4.0.0: declarative connector on the git-cli-proxy
# replaces the CDK source. Every stream, column and key changes shape, so the
# major bump dispatches the scoped `dbt --full-refresh` that rebuilds the
# staging models; bronze tables the CDK connector wrote carry a different
# contract and are dropped before the first sync.
name: gitlab
version: "4.0.0"
schedule: "0 2 * * *"
workflow: sync

# Silver routing via dbt tags on the staging models. The connector slug is
# the dbt tag, and the pipeline's silver step hardcodes `tag:<slug>+`.
dbt_select: "tag:gitlab+"

platform_config:
  git_proxy: true

secret:
  # The pre-flight Secret validator reads this list and nothing else, so it
  # carries every field the operator must supply — the proxy address and token
  # are not among them, because platform_config.git_proxy injects those.
  required_fields:
    - gitlab_url
    - gitlab_token
    - gitlab_start_date

connection:
  namespace: bronze_gitlab
