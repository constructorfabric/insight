name: gitlab
# Strict semver per ADR-0015. 1.15.0: dbt staging declares the class-contract
#   column is_default_branch. MINOR, not MAJOR: the commits stream reported no
#   branch membership, so the column was NULL whether a row re-materialized or
#   not and nothing had to be rebuilt.
# 1.16.0: bump-descriptors, for the rebuilt image alone — the dbt change in
#   1.15.0 sits inside this connector's build context, so the CI job rebuilt
#   the image and took the next MINOR itself. No connector behaviour of its own.
# 1.17.0: the commits stream now projects is_in_default_branch, taken from the
#   ref it walked — the default branch whole, every other branch only as
#   `default_head..head`. MINOR, not MAJOR: additive in Bronze, and a
#   `dbt --full-refresh` would buy nothing, because rows already in Bronze do
#   not carry the field and no dbt operation can invent it. Only re-reading the
#   commits stream from its start date labels history, which a version bump
#   does not do.
# 1.18.0: commit_file_changes walks non-default branches too, the same
#   `default_head..head` ranges the commits stream uses. Until now it walked
#   only the default ref, so a commit outside it reached the class with no file
#   rows at all and contributed nothing to any lines measure while still
#   counting as a commit. MINOR per ADR-0015: additive, nothing re-materializes.
#   Branch history arrives as the stream reaches each branch; commits on a
#   branch whose head has not moved since the last sync are not re-walked.
# 1.21.0: dbt staging declares the class-contract column patch_id. MINOR, not
#   MAJOR: the commits stream reports no patch id, so the column is NULL
#   whether a row re-materializes or not and nothing has to be rebuilt.
version: "1.22.0"
type: cdk
schedule: "0 2 * * *"
workflow: sync
images:
  cdk:
    name: source-gitlab-insight
    dockerfile: ./Dockerfile
    context: .
    image: "ghcr.io/constructorfabric/source-gitlab-insight:2026.08.26.03.42-3e74a6a"
dbt_select: "tag:gitlab+"
connection:
  namespace: "bronze_gitlab"
secret:
  required_fields:
    - gitlab_url
    - gitlab_token
