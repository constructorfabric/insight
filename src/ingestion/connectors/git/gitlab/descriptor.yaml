name: gitlab
# Strict semver per ADR-0015. 1.15.0: dbt staging declares the class-contract
#   column is_default_branch. MINOR, not MAJOR: the commits stream reports no
#   branch membership, so the column is NULL whether a row re-materializes or
#   not and nothing has to be rebuilt.
version: "1.15.0"
type: cdk
schedule: "0 2 * * *"
workflow: sync
images:
  cdk:
    name: source-gitlab-insight
    dockerfile: ./Dockerfile
    context: .
    image: "ghcr.io/constructorfabric/source-gitlab-insight:2026.08.20.11.19-2b469e9"
dbt_select: "tag:gitlab+"
connection:
  namespace: "bronze_gitlab"
secret:
  required_fields:
    - gitlab_url
    - gitlab_token
