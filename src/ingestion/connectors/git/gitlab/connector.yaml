      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path: []
      paginator: *link_paginator
      partition_router: *configured_scope_router
    transformations:
      - type: AddFields
        fields: *standard_fields
      - type: AddFields
        fields:
          - type: AddedFieldDefinition
            path: [scope]
            value: "{{ stream_partition.scope }}"
            value_type: string
          - type: AddedFieldDefinition
            path: [email]
            value: "{{ record.get('email') or '' }}"
            value_type: string
          - type: AddedFieldDefinition
            path: [public_email]
            value: "{{ record.get('public_email') or '' }}"
            value_type: string
          - type: AddedFieldDefinition
            path: [unique_key]
            value: >-
              {{ config['insight_tenant_id'] }}:{{ config['insight_source_id'] }}:{{ stream_partition.scope }}:{{ record['id'] }}
      - type: RemoveFields
        field_pointers:
          - [avatar_url]
          - [web_url]
          - [created_by]
          - [group_saml_identity]
          - [locked]

  # ── Pipelines (GitLab GraphQL) ──────────────────────────────────────────
  # REST `/pipelines` filters by `updated_after` too, but gives no source,
  # no queued duration and no merge-request link without a second call per
  # pipeline; GraphQL returns the whole row in one paged query per project.
  # GraphQL ids are global (`gid://gitlab/Ci::Pipeline/N`); the numeric tail
  # is what the REST API and the UI show, so both are kept.
  - type: DeclarativeStream
    name: pipelines
    primary_key:
      - unique_key
    schema_loader:
      type: InlineSchemaLoader
      schema:
        type: object
        $schema: http://json-schema.org/schema#
        properties:
          unique_key: {type: string}
          tenant_id: {type: [string, "null"]}
          source_id: {type: [string, "null"]}
          data_source: {type: [string, "null"]}
          collected_at: {type: [string, "null"]}
          project_id: {type: [integer, "null"]}
          repo_path: {type: [string, "null"]}
          id: {type: [integer, "null"]}
          iid: {type: [integer, "null"]}
          sha: {type: [string, "null"]}
          ref: {type: [string, "null"]}
          status: {type: [string, "null"]}
          source: {type: [string, "null"]}
          user_id: {type: [integer, "null"]}
          user_username: {type: [string, "null"]}
          user_name: {type: [string, "null"]}
          mr_iid: {type: [integer, "null"]}
          created_at: {type: [string, "null"]}
          updated_at: {type: [string, "null"]}
          started_at: {type: [string, "null"]}
          finished_at: {type: [string, "null"]}
          duration: {type: [integer, "null"]}
          queued_duration: {type: [number, "null"]}
          retryable: {type: [boolean, "null"]}
        required:
          - unique_key
        additionalProperties: true
    retriever:
      type: SimpleRetriever
      requester:
        <<: *graphql_requester
        request_body_json:
          query: |
            query($project: ID!, $updatedAfter: Time, $cursor: String) {
              project(fullPath: $project) {
                pipelines(updatedAfter: $updatedAfter, first: 100, after: $cursor) {
                  pageInfo { hasNextPage endCursor }
                  nodes {
                    id
                    iid
                    sha
                    ref
                    status
                    source
                    createdAt
                    updatedAt
                    startedAt
                    finishedAt
                    duration
                    queuedDuration
                    retryable
                    user { id username name }
                    mergeRequest { iid }
                  }
                }
              }
            }
          variables:
            project: "{{ stream_partition.project_path }}"
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path: [data, project, pipelines, nodes]
      paginator:
        type: DefaultPaginator
        pagination_strategy:
          type: CursorPagination
          cursor_value: "{{ ((((response.get('data') or {}).get('project') or {}).get('pipelines') or {}).get('pageInfo') or {}).get('endCursor') }}"
          stop_condition: "{{ not ((((response.get('data') or {}).get('project') or {}).get('pipelines') or {}).get('pageInfo') or {}).get('hasNextPage') }}"
        page_token_option:
          type: RequestOption
          inject_into: body_json
          field_path: [variables, cursor]
      partition_router:
        type: SubstreamPartitionRouter
        parent_stream_configs:
          - type: ParentStreamConfig
            parent_key: path_with_namespace
            partition_field: project_path
            extra_fields:
              - [id]
            stream: *projects_all_parent
    incremental_sync:
      type: DatetimeBasedCursor
      cursor_field: updated_at
      datetime_format: "%Y-%m-%dT%H:%M:%SZ"
      cursor_datetime_formats:
        - "%Y-%m-%dT%H:%M:%SZ"
        - "%Y-%m-%dT%H:%M:%S%z"
      lookback_window: P1D
      start_datetime:
        type: MinMaxDatetime
        datetime: "{{ config['gitlab_start_date'] }}"
        datetime_format: "%Y-%m-%d"
      start_time_option:
        type: RequestOption
        inject_into: body_json
        field_path: [variables, updatedAfter]
    transformations:
      - type: AddFields
        fields: *standard_fields
      - type: AddFields
        fields:
          - type: AddedFieldDefinition
            path: [project_id]
            value: "{{ stream_slice.extra_fields['id'] }}"
          - type: AddedFieldDefinition
            path: [repo_path]
            value: "{{ stream_partition.project_path }}"
            value_type: string
          - type: AddedFieldDefinition
            path: [id]
            value: "{{ (record.get('id') or '').rsplit('/', 1)[-1] }}"
            value_type: integer
          - type: AddedFieldDefinition
            path: [iid]
            value: "{{ record.get('iid') }}"
            value_type: integer
          - type: AddedFieldDefinition
            path: [sha]
            value: "{{ record.get('sha') or '' }}"
            value_type: string
          - type: AddedFieldDefinition
            path: [ref]
            value: "{{ record.get('ref') or '' }}"
            value_type: string
          - type: AddedFieldDefinition
            path: [status]
            value: "{{ (record.get('status') or '') | lower }}"
            value_type: string
          - type: AddedFieldDefinition
            path: [source]
            value: "{{ record.get('source') or '' }}"
            value_type: string
          - type: AddedFieldDefinition
            path: [user_id]
            value: "{{ (((record.get('user') or {}).get('id') or '') | string).rsplit('/', 1)[-1] or none }}"
          - type: AddedFieldDefinition
            path: [user_username]
            value: "{{ (record.get('user') or {}).get('username') or '' }}"
            value_type: string
          - type: AddedFieldDefinition
            path: [user_name]
            value: "{{ (record.get('user') or {}).get('name') or '' }}"
            value_type: string
          - type: AddedFieldDefinition
            path: [mr_iid]
            value: "{{ (record.get('mergeRequest') or {}).get('iid') }}"
          - type: AddedFieldDefinition
            path: [created_at]
            value: "{{ record.get('createdAt') or '' }}"
            value_type: string
          - type: AddedFieldDefinition
            path: [updated_at]
            value: "{{ record.get('updatedAt') or '' }}"
            value_type: string
          - type: AddedFieldDefinition
            path: [started_at]
            value: "{{ record.get('startedAt') or '' }}"
            value_type: string
          - type: AddedFieldDefinition
            path: [finished_at]
            value: "{{ record.get('finishedAt') or '' }}"
            value_type: string
          - type: AddedFieldDefinition
            path: [queued_duration]
            value: "{{ record.get('queuedDuration') }}"
          - type: AddedFieldDefinition
            path: [unique_key]
            value: >-
              {{ config['insight_tenant_id'] }}:{{ config['insight_source_id'] }}:{{ stream_slice.extra_fields['id'] }}:{{ record['id'] }}
      - type: RemoveFields
        field_pointers:
          - [user]
          - [mergeRequest]
          - [createdAt]
          - [updatedAt]
          - [startedAt]
          - [finishedAt]
          - [queuedDuration]

