  # ── Commit authors (git-cli-proxy + GitLab API) ─────────────────────────
  # A commit names an e-mail and no account, so it reaches a person only once
  # something claims that e-mail for one. GitLab has no commit-to-account
  # endpoint at all. The proxy enumerates a project's distinct authors from
  # the clone it already holds, and this stream asks the user search for each
  # of them — one call per AUTHOR, not per commit. The search matches a
  # private e-mail only for an administrator's token; for anyone else it
  # matches the address a user chose to publish (`public_email`), so a match
  # here is the vendor naming the account, not a guess.
  #
  # Only an exact address match becomes a row: the search also matches names
  # and usernames, and a partial hit is not evidence about the address.
  - type: DeclarativeStream
    name: commit_authors
    primary_key:
      - unique_key
    schema_loader:
      type: InlineSchemaLoader
      schema:
        type: object
        $schema: http://json-schema.org/schema#
        properties:
          unique_key: {type: string}
          tenant_id: {type: [string, "null"]}
          source_id: {type: [string, "null"]}
          data_source: {type: [string, "null"]}
          collected_at: {type: [string, "null"]}
          project_id: {type: [integer, "null"]}
          repo_path: {type: [string, "null"]}
          author_email: {type: [string, "null"]}
          author_account_id: {type: [integer, "null"]}
          author_username: {type: [string, "null"]}
          author_name: {type: [string, "null"]}
          author_state: {type: [string, "null"]}
          matched_field: {type: [string, "null"]}
          sample_sha: {type: [string, "null"]}
          last_committed_date: {type: [string, "null"]}
        required:
          - unique_key
        additionalProperties: true
    retriever:
      type: SimpleRetriever
      requester:
        <<: *vendor_requester
        path: /users
        request_parameters:
          search: "{{ stream_partition.author_email }}"
          per_page: "20"
        error_handler: *discovery_error_handler
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path: []
        record_filter:
          type: RecordFilter
          # Case-insensitive on both sides: git idents and profile addresses
          # are typed by humans. Compared against the partition's address so
          # a search hit on the name never claims the e-mail.
          condition: >-
            {{ ((record.get('email') or '') | lower) == (stream_partition.author_email | lower)
               or ((record.get('public_email') or '') | lower) == (stream_partition.author_email | lower) }}
      paginator: *link_paginator
      partition_router:
        type: SubstreamPartitionRouter
        parent_stream_configs:
          - type: ParentStreamConfig
            parent_key: author_email
            partition_field: author_email
            extra_fields:
              - [project_id]
              - [repo_path]
              - [sample_sha]
              - [last_committed_date]
            incremental_dependency: true
            stream:
              type: DeclarativeStream
              name: repository_authors
              primary_key:
                - author_email
              schema_loader:
                type: InlineSchemaLoader
                schema:
                  type: object
                  $schema: http://json-schema.org/schema#
                  properties:
                    author_email: {type: [string, "null"]}
                    author_name: {type: [string, "null"]}
                    sample_sha: {type: [string, "null"]}
                    last_committed_date: {type: [string, "null"]}
                    commit_count: {type: [integer, "null"]}
                    project_id: {type: [integer, "null"]}
                    repo_path: {type: [string, "null"]}
                  additionalProperties: true
              retriever:
                type: SimpleRetriever
                requester:
                  <<: *proxy_requester
                  path: /v1/authors
                  request_parameters:
                    repo: "{{ stream_partition.repo_clone_url }}"
                    page_size: "500"
                record_selector:
                  type: RecordSelector
                  extractor:
                    type: DpathExtractor
                    field_path: [items]
                paginator: *proxy_paginator
                pagination_reset:
                  type: PaginationReset
                  action: RESET
                partition_router:
                  type: SubstreamPartitionRouter
                  parent_stream_configs:
                    - type: ParentStreamConfig
                      parent_key: http_url_to_repo
                      partition_field: repo_clone_url
                      extra_fields:
                        - [id]
                        - [path_with_namespace]
                        - [statistics, repository_size]
                      incremental_dependency: true
                      stream: *projects_active_parent
              incremental_sync:
                # Per project, "authors who committed since": after one
                # completed pass a sync asks each project only for authors
                # with newer commits, and the vendor lookups below run for
                # those alone.
                type: DatetimeBasedCursor
                cursor_field: last_committed_date
                datetime_format: "%Y-%m-%dT%H:%M:%S%z"
                # WORKAROUND: same future-date guard as `commits`.
                is_client_side_incremental: true
                # A commit can be pushed days after its date while another
                # author's push has already moved `since` past it.
                lookback_window: "P1M"
                cursor_datetime_formats:
                  - "%Y-%m-%dT%H:%M:%S%z"
                  - "%Y-%m-%dT%H:%M:%SZ"
                start_datetime:
                  type: MinMaxDatetime
                  datetime: "{{ config['gitlab_start_date'] }}"
                  datetime_format: "%Y-%m-%d"
                start_time_option:
                  type: RequestOption
                  field_name: since
                  inject_into: request_parameter
              transformations:
                - type: AddFields
                  fields:
                    - type: AddedFieldDefinition
                      path: [project_id]
                      value: "{{ stream_slice.extra_fields['id'] }}"
                    - type: AddedFieldDefinition
                      path: [repo_path]
                      value: "{{ stream_slice.extra_fields['path_with_namespace'] }}"
                      value_type: string
    # The stamped parent date is the cursor: it carries the author walk's state
    # (and, through it, the roster's) along with this stream's own.
    incremental_sync:
      type: DatetimeBasedCursor
      cursor_field: last_committed_date
      datetime_format: "%Y-%m-%dT%H:%M:%S%z"
      # Nothing reads this cursor's value; one entry per (project, author)
      # partition would only grow the state.
      global_substream_cursor: true
      cursor_datetime_formats:
        - "%Y-%m-%dT%H:%M:%S%z"
        - "%Y-%m-%dT%H:%M:%SZ"
      start_datetime:
        type: MinMaxDatetime
        datetime: "{{ config['gitlab_start_date'] }}"
        datetime_format: "%Y-%m-%d"
    transformations:
      - type: AddFields
        fields: *standard_fields
      - type: AddFields
        fields:
          - type: AddedFieldDefinition
            path: [project_id]
            value: "{{ stream_slice.extra_fields['project_id'] }}"
          - type: AddedFieldDefinition
            path: [repo_path]
            value: "{{ stream_slice.extra_fields['repo_path'] }}"
            value_type: string
          - type: AddedFieldDefinition
            path: [author_email]
            value: "{{ stream_partition.author_email }}"
            value_type: string
          - type: AddedFieldDefinition
            path: [sample_sha]
            value: "{{ stream_slice.extra_fields['sample_sha'] }}"
            value_type: string
          - type: AddedFieldDefinition
            path: [last_committed_date]
            value: "{{ stream_slice.extra_fields['last_committed_date'] }}"
            value_type: string
          - type: AddedFieldDefinition
            path: [author_account_id]
            value: "{{ record.get('id') }}"
          - type: AddedFieldDefinition
            path: [author_username]
            value: "{{ record.get('username') or '' }}"
            value_type: string
          - type: AddedFieldDefinition
            path: [author_name]
            value: "{{ record.get('name') or '' }}"
            value_type: string
          - type: AddedFieldDefinition
            path: [author_state]
            value: "{{ record.get('state') or '' }}"
            value_type: string
          # Which profile field named the address — an administrator's token
          # sees the private one, everyone else only the published one.
          - type: AddedFieldDefinition
            path: [matched_field]
            value: "{{ 'email' if ((record.get('email') or '') | lower) == (stream_partition.author_email | lower) else 'public_email' }}"
            value_type: string
          - type: AddedFieldDefinition
            path: [unique_key]
            value: >-
              {{ config['insight_tenant_id'] }}:{{ config['insight_source_id'] }}:{{ stream_slice.extra_fields['project_id'] }}:{{ stream_partition.author_email | lower | replace(':', '%3A') }}
      - type: RemoveFields
        # The search returns whole user profiles; only the pairing is kept.
        field_pointers:
          - [id]
          - [username]
          - [name]
          - [state]
          - [locked]
          - [avatar_url]
          - [web_url]
          - [email]
          - [public_email]
          - [created_at]
          - [bio]
          - [location]
          - [skype]
          - [linkedin]
          - [twitter]
          - [discord]
          - [website_url]
          - [organization]
          - [job_title]
          - [pronouns]
          - [bot]
          - [work_information]
          - [followers]
          - [following]
          - [local_time]
          - [last_sign_in_at]
          - [confirmed_at]
          - [last_activity_on]
          - [theme_id]
          - [color_scheme_id]
          - [projects_limit]
          - [current_sign_in_at]
          - [identities]
          - [can_create_group]
          - [can_create_project]
          - [two_factor_enabled]
          - [external]
          - [private_profile]
          - [commit_email]
          - [is_admin]
          - [note]
          - [namespace_id]
          - [created_by]
          - [email_reset_offered_at]
          - [is_auditor]
          - [using_license_seat]
          - [shared_runners_minutes_limit]
          - [extra_shared_runners_minutes_limit]
          - [scim_identities]
          - [plan]
          - [trial]

concurrency_level:
  type: ConcurrencyLevel
  # `| int` because a Secret's values arrive as strings and the CDK rejects a
  # concurrency that does not evaluate to an integer; the filter's fallback
  # covers an absent value, which must never resolve to 0 or 1 — the
  # concurrent CDK self-deadlocks at a single worker once a sync generates
  # ~10k partitions. `config.get` because the interpolation is strict about a
  # missing key.
  default_concurrency: "{{ config.get('gitlab_concurrency') | int(8) }}"
  # Required by the CDK whenever the level comes from config, as a safeguard
  # against a value that would spawn more workers than the pod can hold.
  max_concurrency: 32

spec:
  type: Spec
  connection_specification:
    type: object
    $schema: http://json-schema.org/draft-07/schema#
    title: GitLab (git-cli-proxy) Spec
    required:
      - insight_tenant_id
      - insight_source_id
      - gitlab_url
      - gitlab_token
      - git_proxy_url
      - git_proxy_token
      - gitlab_start_date
    properties:
      insight_tenant_id:
        type: string
        description: Insight tenant identifier stamped onto every emitted record.
        title: Insight Tenant ID
        order: 0
      insight_source_id:
        type: string
        description: >-
          Instance discriminator for multi-instance support (e.g. gitlab-acme).
        title: Insight Source ID
        order: 1
      gitlab_url:
        type: string
        description: >-
          Base URL of the GitLab instance, e.g. https://gitlab.com or
          https://gitlab.example.com. The connector appends /api/v4 and
          /api/graphql itself.
        title: GitLab URL
        format: uri
        order: 2
      gitlab_token:
        type: string
        description: >-
          Personal, group or project access token with the `read_api` scope
          (the API) and `read_repository` (the clone the proxy performs on its
          behalf). Group and project tokens see only their own scope; the
          instance-wide and users listings need a personal token, and `email`
          on users needs an administrator's. The same token is forwarded to
          the proxy for the clone and never stored there.
        title: GitLab Token
        airbyte_secret: true
        order: 3
      gitlab_groups:
        type: array
        items:
          type: string
        description: >-
          Full paths of groups to sync (e.g. acme or acme/platform); every
          project in the group and its subgroups is included. Leave empty
          together with gitlab_projects to sync every project the token can
          see — not available on gitlab.com.
        title: Groups
        order: 4
      gitlab_projects:
        type: array
        items:
          type: string
        description: >-
          Full paths of individual projects to sync (e.g. acme/tools/cli), for
          projects outside the configured groups.
        title: Projects
        order: 5
      gitlab_include_forks:
        # A string, not a boolean: a Secret's values reach the source config as
        # strings and the spec is validated against them.
        type: string
        pattern: "^(true|false)$"
        default: "false"
        description: >-
          Sync forked projects. Off by default: a fork's history is its
          upstream's, and counting it doubles the upstream's commits.
        title: Include forks
        order: 6
      gitlab_exclude_projects:
        type: array
        items:
          type: string
        description: >-
          Regular expressions matched against a project's full path
          (e.g. ^acme/sandbox/ or -archive$); a matching project is skipped.
          Archived projects are always skipped.
        title: Exclude projects
        order: 7
      gitlab_instance_users:
        type: string
        pattern: "^(true|false)$"
        default: "true"
        description: >-
          Sync the instance user directory (/users) for identity resolution.
          A token that may not read it leaves the directory empty without
          failing the sync; e-mail addresses are returned only to
          administrators. Must be "false" on gitlab.com, where the directory
          is every account on the platform.
        title: Sync instance users
        order: 8
      git_proxy_url:
        type: string
        description: >-
          Base URL of the git-cli-proxy service. Cluster-internal and
          namespace-qualified, because the connector pod resolving it runs in
          the Airbyte namespace rather than the proxy's, e.g.
          http://insight-git-cli-proxy.insight.svc.cluster.local:8084. No
          default: a wrong or absent value must fail the check, not fall back
          somewhere.
        title: Git Proxy URL
        order: 9
      git_proxy_token:
        type: string
        description: Bearer token the git-cli-proxy requires on every /v1 request.
        title: Git Proxy Token
        airbyte_secret: true
        order: 10
      gitlab_start_date:
        type: string
        description: >-
          Earliest date for incremental sync (YYYY-MM-DD). Required: it bounds
          the first-sync cost, so choosing it is a deployment decision.
        title: Start Date
        format: date
        order: 11
      gitlab_concurrency:
        type: string
        pattern: "^[1-9][0-9]*$"
        default: "8"
        description: >-
          Worker threads the sync may use against the GitLab API. Self-hosted
          instances without a request limit can raise it; the ceiling is 32.
          The clone-backed streams are additionally paced by the
          git-cli-proxy's own clone and page-serve caps, so raising this alone
          does not speed them up.
        title: Concurrency
        order: 12
      gitlab_commit_email_hostname:
        type: string
        description: >-
          Host of the instance's private commit addresses,
          `{id}-{username}@<host>`, when the administrator changed it from
          the default `users.noreply.<GitLab host>`. A commit authored under
          that form names its account outright; the same form on any other
          host names an account elsewhere and is left unmatched.
        title: Commit e-mail hostname
        order: 13
    # On gitlab.com the instance-wide listing is every public project on the
    # platform and the user directory every account on it; the spec refuses
    # both outright, the directory by demanding an explicit "false".
    allOf:
      - if:
          properties:
            gitlab_url:
              pattern: "^https?://(www\\.)?gitlab\\.com/?$"
        then:
          required: [gitlab_instance_users]
          properties:
            gitlab_instance_users:
              const: "false"
          anyOf:
            - required: [gitlab_groups]
              properties:
                gitlab_groups:
                  minItems: 1
            - required: [gitlab_projects]
              properties:
                gitlab_projects:
                  minItems: 1
    additionalProperties: true

metadata:
  autoImportSchema:
    repositories: false
    commits: false
    file_changes: false
    branches: false
    commit_authors: false
    pull_requests: false
    pull_request_diff_stats: false
    pull_request_notes: false
    pull_request_commits: false
    pull_request_state_events: false
    pull_request_label_events: false
    pipelines: false
    environments: false
    deployments: false
    group_members: false
    users: false
