        # Absent means the spec default: a Secret carries no defaults.
        values: "{{ ['*'] if (config.get('gitlab_instance_users') or 'true') == 'true' else [] }}"
        cursor_field: scope
    transformations:
      - type: AddFields
        fields: *standard_fields
      - type: AddFields
        fields:
          - type: AddedFieldDefinition
            path: [email]
            value: "{{ record.get('email') or '' }}"
            value_type: string
          - type: AddedFieldDefinition
            path: [public_email]
            value: "{{ record.get('public_email') or '' }}"
            value_type: string
          - type: AddedFieldDefinition
            path: [commit_email]
            value: "{{ record.get('commit_email') or '' }}"
            value_type: string
          - type: AddedFieldDefinition
            path: [unique_key]
            value: >-
              {{ config['insight_tenant_id'] }}:{{ config['insight_source_id'] }}:{{ record['id'] }}
      - type: RemoveFields
