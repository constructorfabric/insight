  # ── Deployments (GitLab API) ────────────────────────────────────────────
  # One row per deployment PER STATUS: a deployment moves created -> running
  # -> success/failed/canceled, and `updated_at` advances with each. Keeping
  # the status in the key turns the successive reads into the status history
  # the deployment-events class wants, while the latest row per deployment id
  # is the deployment itself.
  - type: DeclarativeStream
    name: deployments
    primary_key:
      - unique_key
    schema_loader:
      type: InlineSchemaLoader
      schema:
        type: object
        $schema: http://json-schema.org/schema#
        properties:
          unique_key: {type: string}
          tenant_id: {type: [string, "null"]}
          source_id: {type: [string, "null"]}
          data_source: {type: [string, "null"]}
          collected_at: {type: [string, "null"]}
          project_id: {type: [integer, "null"]}
          repo_path: {type: [string, "null"]}
          id: {type: [integer, "null"]}
          iid: {type: [integer, "null"]}
          ref: {type: [string, "null"]}
          sha: {type: [string, "null"]}
          status: {type: [string, "null"]}
          environment_id: {type: [integer, "null"]}
          environment_name: {type: [string, "null"]}
          deployable_id: {type: [integer, "null"]}
          deployable_name: {type: [string, "null"]}
          deployable_stage: {type: [string, "null"]}
          pipeline_id: {type: [integer, "null"]}
          user_id: {type: [integer, "null"]}
          user_username: {type: [string, "null"]}
          user_name: {type: [string, "null"]}
          created_at: {type: [string, "null"]}
          updated_at: {type: [string, "null"]}
        required:
          - unique_key
        additionalProperties: true
    retriever:
      type: SimpleRetriever
      requester:
        <<: *vendor_requester
        path: "/projects/{{ stream_partition.project_id }}/deployments"
        request_parameters:
          # WORKAROUND: page-numbered listing; a mutable sort key skips the
          # item at a page boundary when another is updated mid-walk.
          order_by: id
          sort: asc
          per_page: "100"
        error_handler: *project_scoped_error_handler
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path: []
      paginator: *link_paginator
      partition_router:
        type: SubstreamPartitionRouter
        parent_stream_configs:
          - type: ParentStreamConfig
            parent_key: id
            partition_field: project_id
            extra_fields:
              - [path_with_namespace]
            stream: *projects_all_parent
    incremental_sync:
      type: DatetimeBasedCursor
      cursor_field: updated_at
      datetime_format: "%Y-%m-%dT%H:%M:%S.%f%z"
      cursor_datetime_formats:
        - "%Y-%m-%dT%H:%M:%S.%f%z"
        - "%Y-%m-%dT%H:%M:%S%z"
        - "%Y-%m-%dT%H:%M:%SZ"
      lookback_window: P1D
      start_datetime:
        type: MinMaxDatetime
        datetime: "{{ config['gitlab_start_date'] }}"
        datetime_format: "%Y-%m-%d"
      start_time_option:
        type: RequestOption
        field_name: updated_after
        inject_into: request_parameter
    transformations:
      - type: AddFields
        fields: *standard_fields
      - type: AddFields
        fields:
          - type: AddedFieldDefinition
            path: [project_id]
            value: "{{ stream_partition.project_id }}"
          - type: AddedFieldDefinition
            path: [repo_path]
            value: "{{ stream_slice.extra_fields['path_with_namespace'] or '' }}"
            value_type: string
          - type: AddedFieldDefinition
            path: [status]
            value: "{{ record.get('status') or '' }}"
            value_type: string
          - type: AddedFieldDefinition
            path: [environment_id]
            value: "{{ (record.get('environment') or {}).get('id') }}"
          - type: AddedFieldDefinition
            path: [environment_name]
            value: "{{ (record.get('environment') or {}).get('name') or '' }}"
            value_type: string
          - type: AddedFieldDefinition
            path: [deployable_id]
            value: "{{ (record.get('deployable') or {}).get('id') }}"
          - type: AddedFieldDefinition
            path: [deployable_name]
            value: "{{ (record.get('deployable') or {}).get('name') or '' }}"
            value_type: string
          - type: AddedFieldDefinition
            path: [deployable_stage]
            value: "{{ (record.get('deployable') or {}).get('stage') or '' }}"
            value_type: string
          - type: AddedFieldDefinition
            path: [pipeline_id]
            value: "{{ ((record.get('deployable') or {}).get('pipeline') or {}).get('id') }}"
          - type: AddedFieldDefinition
            path: [user_id]
            value: "{{ (record.get('user') or {}).get('id') }}"
          - type: AddedFieldDefinition
            path: [user_username]
            value: "{{ (record.get('user') or {}).get('username') or '' }}"
            value_type: string
          - type: AddedFieldDefinition
            path: [user_name]
            value: "{{ (record.get('user') or {}).get('name') or '' }}"
            value_type: string
          - type: AddedFieldDefinition
            path: [unique_key]
            value: >-
              {{ config['insight_tenant_id'] }}:{{ config['insight_source_id'] }}:{{ stream_partition.project_id }}:{{ record['id'] }}:{{ record.get('status') or '' }}
      - type: RemoveFields
        field_pointers:
          - [environment]
          - [deployable]
          - [user]

  # ── Users (GitLab API) ──────────────────────────────────────────────────
  # The instance directory, keyset-paged so an instance past the offset cap
  # still lists fully. On by default; a token that may not read it leaves it
  # empty rather than failing the sync. `email` is returned only to
  # administrators. The spec refuses it on gitlab.com, where the listing would
  # be every account on the platform.
  - type: DeclarativeStream
    name: users
    primary_key:
      - unique_key
    schema_loader:
      type: InlineSchemaLoader
      schema:
        type: object
        $schema: http://json-schema.org/schema#
        properties:
          unique_key: {type: string}
          tenant_id: {type: [string, "null"]}
          source_id: {type: [string, "null"]}
          data_source: {type: [string, "null"]}
          collected_at: {type: [string, "null"]}
          id: {type: [integer, "null"]}
          username: {type: [string, "null"]}
          name: {type: [string, "null"]}
          state: {type: [string, "null"]}
          email: {type: [string, "null"]}
          public_email: {type: [string, "null"]}
          commit_email: {type: [string, "null"]}
          bot: {type: [boolean, "null"]}
          external: {type: [boolean, "null"]}
          is_admin: {type: [boolean, "null"]}
          created_at: {type: [string, "null"]}
          last_activity_on: {type: [string, "null"]}
        required:
          - unique_key
        additionalProperties: true
    retriever:
      type: SimpleRetriever
      requester:
        <<: *vendor_requester
        path: /users
        request_parameters:
          pagination: keyset
          order_by: id
          sort: asc
