name: bamboohr
type: cdk
# The major bump full-refreshes the new roster and profile claims before the
# persons seed projects them.
version: "2.0.0"
schedule: 0 * * * *
dbt_select: tag:bamboohr+
workflow: sync
# CI build metadata + runtime image ref (ADR-0016). bump-descriptors keeps
# images.cdk.image pinned to the tag built by each main run; reconcile
# WARN+skips this connector whenever the ref is empty.
images:
  cdk:
    name: source-bamboohr-insight
    dockerfile: ./Dockerfile
    context: .
    image: "ghcr.io/constructorfabric/source-bamboohr-insight:2026.08.19.14.27-6346c92"
connection:
  namespace: bronze_bamboohr
secret:
  required_fields:
    - bamboohr_api_key
    - bamboohr_domain
