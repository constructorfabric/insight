name: cursor
# 2.1.0: emits the new class-contract column seat_status, constant NULL — this
#   source reports a per-day active flag, not a seat lifecycle state. MINOR per
#   ADR-0015: a full refresh would reproduce the same NULLs.
# 2.2.0: connections carry destinationSyncMode append_dedup with
#   primaryKey unique_key, so the Airbyte destination owns the bronze table
#   shape and the RMT promotion step is gone (#2877). MINOR per ADR-0015:
#   reconcile must republish this connector so the connection catalog is
#   refreshed; nothing already stored changes meaning.
version: "2.2.0"
schedule: 0 2 * * *
dbt_select: tag:cursor+
workflow: sync
connection:
  namespace: bronze_cursor
secret:
  required_fields:
    - cursor_api_key
