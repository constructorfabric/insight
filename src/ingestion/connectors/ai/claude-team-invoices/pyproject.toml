[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "source-claude-team-invoices"
version = "0.1.0"
description = "Airbyte source connector for Claude Team invoices via the claude-team proxy and the Stripe hosted chain (CDK)"
requires-python = ">=3.12"
dependencies = [
    "airbyte-cdk>=7.16.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "requests-mock>=1.11",
]

[project.scripts]
source-claude-team-invoices = "source_claude_team_invoices.source:main"

[tool.uv]
# Do not resolve a version published in the last week: a freshly pushed release is
# where a compromised maintainer account shows up first.
exclude-newer = "7 days"
# airbyte-cdk pins nltk==3.9.1 (fixed CRITICAL CVE-2025-14009); the image installs 3.10.0
# over it (see Dockerfile), so keep the resolved dependency graph on the same version.
override-dependencies = ["nltk>=3.10.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The suite shares fixtures across modules by importing `tests.<module>`.
# `python -m pytest` puts the root on the path and CI runs that; this makes
# a bare `pytest` behave the same instead of failing collection.
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["source_claude_team_invoices*"]

[tool.setuptools.package-data]
"source_claude_team_invoices" = ["spec.json", "schemas/*.json"]
