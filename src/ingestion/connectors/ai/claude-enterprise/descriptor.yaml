name: claude-enterprise
# 3.0.0: dbt staging maps code_session_count / chat_conversation_count into
#   class-contract conversation_count and declares tool_label /
#   surface_label — MAJOR per ADR-0015: pre-existing rows must
#   re-materialize from Bronze to populate the new columns (one-shot scoped
#   full refresh).
# 3.1.0: emits the new class-contract column seat_status, constant NULL — the
#   analytics API reports no seat lifecycle state. MINOR per ADR-0015: a full
#   refresh would reproduce the same NULLs, so there is nothing to
#   re-materialize.
# 3.2.0: every daily stream reads up to today instead of stopping three days
#   short, and re-reads the last three days via lookback_window. The vendor
#   revises a day after it closes; the old end bound waited for that instead of
#   re-asking, so the newest days never arrived at all. MINOR per ADR-0015 —
#   no schema or dbt output change, so nothing re-materializes; the re-read
#   lands as a newer _version and ReplacingMergeTree keeps it.
version: "3.2.0"
schedule: "0 11 * * *"   # daily at 11:00 UTC — accommodates Anthropic's 10:00 UTC aggregation
workflow: sync

# Silver routing: the dbt selector picks up all models tagged 'claude-enterprise':
#   • claude_enterprise__ai_dev_usage   → class_ai_dev_usage   (tag: silver:class_ai_dev_usage)
#   • claude_enterprise__ai_assistant_usage → class_ai_assistant_usage (tag: silver:class_ai_assistant_usage)
# silver_targets is prohibited per Connector Spec §4.10 — Silver is determined by dbt_select tags.
dbt_select: "tag:claude-enterprise+"

connection:
  namespace: "bronze_claude_enterprise"
secret:
  required_fields:
    - analytics_api_key
