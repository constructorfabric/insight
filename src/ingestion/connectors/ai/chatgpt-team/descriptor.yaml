name: chatgpt-team
# Strict semver per ADR-0015. 1.0.0: initial MVP — browser-proxy
# architecture (mirrors claude-team). Reads chatgpt.com web data via the
# customer-deployed chatgpt-team-proxy; requires `proxy_url` (no default),
# `proxy_auth_token`, and the workspace `chatgpt_account_id` / `chatgpt_org_id`.
# 1.0.1: tolerate 403/404 on subscription streams (blank org_id).
# 1.1.0: add Silver dbt models (chatgpt_team__ai_dev_usage,
#   chatgpt_team__ai_assistant_usage) — MINOR bump per ADR-0015 so reconcile
#   re-runs the dbt step (tag:chatgpt-team+ now spans the new staging models
#   and their downstream silver.class_ai_* unions).
# 1.1.1: review fixes (PR #1282) — drop conflicting window_days on the Codex
#   leaderboard (daily range only), remove the hardcoded min_datetime floor,
#   add lookback_window P2D, dedup on lower(trim(email)) and add a Codex
#   activity filter. Behaviour + dbt output change → reconcile must re-run.
# 2.0.0: dbt staging maps Codex threads (n_threads) into class-contract
#   conversation_count and declares tool_label / surface_label — MAJOR per
#   ADR-0015: pre-existing rows must re-materialize from Bronze to populate
#   the new columns (one-shot scoped full refresh).
# 2.1.0: emits the new class-contract column seat_status, constant NULL — this
#   source reports no seat lifecycle state. MINOR per ADR-0015: a full refresh
#   would reproduce the same NULLs, so there is nothing to re-materialize.
# 2.2.0: the shared day cursor loses its end bound, so its final request window
#   stays inside one day and a day's rows stop landing under the previous date.
#   MINOR per ADR-0015: the manifest has to reach Airbyte, and a full refresh
#   would not undo the rows already stored under the wrong date.
# 3.0.0: hardening pass. Five changes ship together:
#   chatgpt_team_codex_user_daily_org declares total_users, the day's headcount
#   the leaderboard envelope already carried and the per-user stream threw
#   away, and its unique_key carries the read so each read keeps its own
#   reference. On the back of it chatgpt_team__ai_dev_usage gains a
#   completeness gate: the per-user stream pages over sort_by=credits, which is
#   not a total order, so a person could sit past the page boundary in one
#   request and before it in the next, returned by neither while both requests
#   succeeded. A read whose distinct people do not equal its own total_users no
#   longer becomes the day's state.
#   Both emission filters narrow to the counters their model actually emits
#   into the class. A row admitted on a counter that only reaches a JSON blob
#   asserts activity none of its class columns can evidence, which is what
#   assert_ai_dev_usage_rows_active and its assistant sibling fail on.
#   seat_type in surface_metrics_json resolves roster-first, falling back to
#   the tier the usage row restates — the roster leaves it null for some
#   members and the usage row is the only other place it appears.
#   The Codex paginator names its first page explicitly. This fixes no defect:
#   the endpoint is 1-indexed and an omitted `page` answers page 1, measured
#   against a workspace. It removes a server default the walk would otherwise
#   depend on silently. The browser-session streams retry a transient 401/403
#   instead of failing the sync: the proxy answers those until a restarted
#   session settles. On the subscription streams 401 means something else
#   entirely — a workspace role below account-admin — and is IGNOREd with its
#   own message, because there the condition is permanent, not transient.
#   The subscription window stops reading config['start_date'] — that knob
#   backfills the daily streams, and letting it reach the billing request
#   silently redefined `amount` under an unchanged snapshot_date.
#   The roster gains the fields the endpoint already returned and the
#   connector discarded: credit_limits (the per-member cap override, kept
#   whole because absent, empty and populated are three different facts),
#   deactivated_time (the only departure signal the source offers),
#   pending_seat_type, account_user_id and the remaining account flags. A new
#   account_settings stream carries seat_type_credit_limits, the default that
#   governs every seat without an override. Nothing reads them yet; a fact the
#   connector never stores cannot gain a reader later.
#   deactivated_time is the exception — it is read immediately. The identity
#   chain tracks it and revokes the account's identity observations when the
#   vendor stamps it, so a closed seat stops resolving to a person. It is
#   reversible on purpose: the projection blanks email and name while the seat
#   is deactivated, so a reactivated account restores its observations through
#   an ordinary field change even when the address never changed. A
#   deactivation condition alone would delete them once and never bring them
#   back.
#   The subscription streams additionally tolerate 401, which is what a
#   workspace role below account-admin answers. It was previously unhandled and
#   failed the whole sync.
#   MAJOR per ADR-0015: the narrowed filters and the gate make rows already in
#   staging inadmissible, and only a full refresh removes them — leaving them
#   keeps the activity guards failing on rows no current read would produce.
#   Upgrade note: the two new Bronze tables are created by their streams' first
#   sync, which the sync workflow runs before dbt. An instance whose first run
#   of the envelope stream fails has no table for the gate to read, and its dbt
#   step fails until that stream succeeds once.
# 3.1.0: adds chatgpt_team_codex_sessions_daily, the vendor's session/message
#   aggregate, as a second per-person-per-day Codex reading. It owns the
#   per-surface credit split, an explicit on_demand_credits and the cached vs
#   uncached token split; the leaderboard keeps email, name and lines_added,
#   which this endpoint does not publish. The two reconcile on (user_id, date)
#   and chatgpt_team__ai_dev_usage records the outcome per row, so a person-day
#   one endpoint returned and the other did not stays visible instead of
#   reading as a null column. The endpoint is unpaginated, so the stream
#   carries no completeness gate. MINOR per ADR-0015: the manifest has to reach
#   Airbyte for the new Bronze table to be created, and no existing row changes
#   meaning — the added columns land in tool_action_breakdown_json and a full
#   refresh would reproduce what is already there for every day both endpoints
#   covered.
# 3.2.0: adds chatgpt_team__ai_credit_usage, the connector's contribution to
#   silver.class_ai_credit_usage. It carries every person-day the vendor
#   reports credits for, deliberately without chatgpt_team__ai_dev_usage's
#   emission filter: that filter admits a row on activity counters, and a
#   person-day can carry credits while every activity counter reads zero, so
#   routing spend through it would drop real charges. Priced in gold, the
#   credits feed the existing daily_extra_usage_usd and extra_usage_usd rather
#   than a second cost vocabulary, priced by one current operator-authored
#   configuration rather than a dated rate history — a Codex monetary value
#   is an estimate and restates when that configuration changes, while the
#   credits behind it do not. No new stream and no new Bronze table — it
#   reads the leaderboard Bronze the connector already collects, which is also
#   the authoritative source of the total. MINOR per ADR-0015: the dbt step has
#   to re-run so the new model materialises; nothing already stored changes
#   meaning.
# 3.3.0: connections carry destinationSyncMode append_dedup with
#   primaryKey unique_key, so the Airbyte destination owns the bronze table
#   shape and the RMT promotion step is gone (#2877). MINOR per ADR-0015:
#   reconcile must republish this connector so the connection catalog is
#   refreshed; nothing already stored changes meaning.
version: "3.3.0"
# Daily at 04:00 UTC — off-peak. The customer's proxy runs a single browser
# instance, so we avoid scheduling chatgpt-team next to anything else that
# may also hit it (same rationale as claude-team).
schedule: '0 4 * * *'
workflow: sync

# Scopes the dbt run to this connector: the Silver staging
# models (chatgpt_team__ai_dev_usage → class_ai_dev_usage,
# chatgpt_team__ai_assistant_usage → class_ai_assistant_usage) and their
# downstream silver.class_ai_* unions.
dbt_select: 'tag:chatgpt-team+'

connection:
  namespace: bronze_chatgpt_team

# Required secret fields (carried in the K8s Secret stringData):
#   - chatgpt_account_id — workspace account UUID (for /accounts/{id}/* endpoints)
#   - chatgpt_org_id      — organization UUID (for /subscriptions/{org_id}/* endpoints)
#   - proxy_url           — base URL of the customer-deployed chatgpt-team-proxy
#   - proxy_auth_token    — bearer token; must match PROXY_AUTH_TOKEN on the proxy
#
# Note: NO chatgpt.com session here. It lives ONLY on the customer's proxy
# container and is installed via the proxy's `POST /admin/session-key`.
# The proxy also derives the short-lived access_token. Insight never sees
# either — only proxy_url + proxy_auth_token.
secret:
  required_fields:
    - chatgpt_account_id
    - proxy_url
    - proxy_auth_token
  optional_fields:
    # Only needed by the subscription streams; blank for analytics-viewer
    # accounts without billing visibility.
    - chatgpt_org_id
    - start_date
