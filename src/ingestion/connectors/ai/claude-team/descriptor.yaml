name: claude-team
# Strict semver per ADR-0015. 1.2.0: split the proxy out of this repo into
# a customer-deployed Docker container (secure-enclave/proxies/claude_team).
# Connector now requires `proxy_url` (no default) and `proxy_auth_token`
# (bearer token Insight uses to authenticate to the customer's proxy).
# MINOR bump per ADR-0015 — Spec gains required fields; existing
# deployments must add the new Secret keys before next reconcile.
# 1.3.0: claude_team_overage_spend now feeds Silver class_ai_overage
# (per-seat spend-vs-limit overage). Additive — Bronze stream gains
# scalar fields (currency / out_of_credits / used_credits_basis /
# limit_type) and new dbt models (claude_team__ai_overage → class_ai_overage).
# Populates only once the proxy sessionKey holds billing:view / Owner;
# otherwise the stream stays empty and the Silver rows are zero (no failure).
# 2.0.0: dbt staging maps total_sessions into class-contract
#   conversation_count and declares tool_label — MAJOR per ADR-0015:
#   pre-existing rows must re-materialize from Bronze to populate the new
#   columns (one-shot scoped full refresh).
# 2.1.0: claude_team_overage_spend's unique_key gains the extraction month, so
#   Bronze retains one row per seat per billing month instead of one per seat.
#   MINOR per ADR-0015 — additive: existing rows keep their keys and stay valid,
#   nothing has to re-materialize. Deliberately NOT major: a major bump
#   dispatches a one-shot `dbt --full-refresh` (reconcile-connectors), which
#   rebuilds Silver from Bronze — the very operation this change exists to make
#   safe, and the one that cost the June history.
# 2.2.0: adds the claude_team_code_metrics_org Bronze stream, and dbt staging
#   stops filtering on the vendor seat status — it carries it in the
#   class-contract column seat_status instead. MINOR per ADR-0015, not MAJOR:
#   a major bump dispatches a one-shot `dbt --full-refresh`, and the guard that
#   makes that safe (full_refresh=false on claude_team__ai_overage) arrives in
#   this same change — it has to be on main before any major bump reads it.
#   Rows written before this version keep an empty seat_status and reach gold as
#   'unknown', which is what they honestly are.
# 3.0.0: no schema change of its own. MAJOR is the only way to dispatch the
#   one-shot scoped `dbt --full-refresh` (reconcile-connectors) that 2.0.0 and
#   2.2.0 each deferred, and four things need it. Rows written before 2.2.0
#   carry an empty seat_status; the seats the pre-2.2.0 `status = 'active'`
#   filter dropped at staging time are still in Bronze and reach the class only
#   on a re-read; the roster rows written before the activity gate violate the
#   contract assert_ai_dev_usage_rows_active states; and the rows the old
#   table-wide silver watermark stranded return only when staging re-emits them
#   — the per-source boundary stopped the loss, it does not undo it.
#   Safe now and not before: full_refresh=false on claude_team__ai_overage
#   landed in 2.2.0, so the one relation holding a past month's closing spend is
#   skipped by the rebuild while class_ai_overage re-materialises from it.
# 3.1.0: the two daily-metrics streams read up to today instead of stopping a
#   day short, and re-read the last two days via lookback_window. The vendor
#   revises a day after it closes; the old end bound waited for that instead of
#   re-asking, so the newest days never arrived at all. MINOR per ADR-0015 —
#   no schema or dbt output change, so nothing re-materializes; the re-read
#   lands as a newer _version and ReplacingMergeTree keeps it.
version: "3.1.0"
# Daily at 23:50 UTC, as late in the day as the boundary allows. The seat
# endpoint reports the billing month in progress and carries no history, so a
# month's spend is frozen at the last read INSIDE it and whatever follows is
# lost for good: reading at 04:00 dropped the last twenty hours of every month.
# A run after midnight cannot make up for it — by then the endpoint answers for
# the new month.
#
# Still off-peak vs other connectors, which occupy 02:00 to 06:00 and 11:00:
# the customer's proxy runs a single browser instance, so claude-team is not
# scheduled next to anything else that may hit it.
schedule: '50 23 * * *'
workflow: sync

dbt_select: 'tag:claude-team+'

connection:
  namespace: bronze_claude_team

# Required secret fields (carried in the K8s Secret stringData):
#   - claude_org_id     — UUID of the claude.ai organisation to read from
#   - proxy_url         — base URL of the customer-deployed claude-team-proxy
#                         (e.g. https://claude-team-proxy.customer.example.com)
#   - proxy_auth_token  — bearer token; must match PROXY_AUTH_TOKEN on the proxy
#
# Note: NO claude.ai sessionKey here. It lives ONLY on the customer's
# proxy container and is installed via the proxy's
# `POST /admin/session-key` endpoint. Rotation is the customer's
# responsibility — Insight never sees the cookie.
secret:
  required_fields:
    - claude_org_id
    - proxy_url
    - proxy_auth_token
