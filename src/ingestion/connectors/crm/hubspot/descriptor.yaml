name: hubspot
# 2.20.0: connections carry destinationSyncMode append_dedup with
#   primaryKey unique_key, so the Airbyte destination owns the bronze table
#   shape and the RMT promotion step is gone (#2877). MINOR per ADR-0015:
#   reconcile must republish this connector so the connection catalog is
#   refreshed; nothing already stored changes meaning.
# 2.23.0: the tenant segment of unique_key comes from insight_tenant_key, so a
#   warm install keeps its keys when tenant_id moves to the canonical tenant
#   UUID. MINOR per ADR-0015: no stored key changes.
version: "2.23.0"
type: cdk
schedule: "0 6 * * *"
workflow: sync
# CI build metadata + runtime image refs (ADR-0016). CI scans `images:`
# via dynamic discovery on every run; reconcile reads images.cdk.image
# when registering the Airbyte CDK source definition.
images:
  cdk:
    name: source-hubspot-insight
    dockerfile: ./Dockerfile
    context: .
    image: "ghcr.io/constructorfabric/source-hubspot-insight:2026.10.06.21.33-a31976c"
dbt_select: "tag:hubspot+"
connection:
  namespace: "bronze_hubspot"
secret:
  required_fields:
    - hubspot_access_token
