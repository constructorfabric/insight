            inject_into: header
            field_name: Authorization
        request_parameters:
          rql: >-
            lastModifiedDate >= {{ stream_interval.start_time }}
          sort: id,ASC
        error_handler:
          type: DefaultErrorHandler
          max_retries: 5
          response_filters:
            - type: HttpResponseFilter
              action: RATE_LIMITED
              http_codes:
                - 429
            - type: HttpResponseFilter
              action: RETRY
              http_codes:
                - 500
                - 502
                - 503
                - 504
          backoff_strategies:
            - type: WaitTimeFromHeader
