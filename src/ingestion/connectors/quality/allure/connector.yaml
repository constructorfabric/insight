version: 7.0.4

type: DeclarativeSource

check:
  type: CheckStream
  stream_names:
    - projects

definitions:
  linked:
    HttpRequester:
      authenticator:
        type: ApiKeyAuthenticator
        api_token: "Api-Token {{ config['allure_api_token'] }}"
        inject_into:
          type: RequestOption
          inject_into: header
          field_name: Authorization
    SimpleRetriever:
      paginator:
        type: DefaultPaginator
        page_token_option:
          type: RequestOption
          inject_into: request_parameter
          field_name: page
        page_size_option:
          type: RequestOption
          inject_into: request_parameter
          field_name: size
        pagination_strategy:
          type: CursorPagination
          page_size: "{{ config.get('allure_page_size', 100) }}"
          cursor_value: "{{ response.get('number', 0) + 1 }}"
          stop_condition: "{{ response.get('last', true) }}"

streams:
  - type: DeclarativeStream
    name: projects
    primary_key:
      - unique_key
    retriever:
      type: SimpleRetriever
      decoder:
        type: JsonDecoder
      requester:
        type: HttpRequester
        url: "{{ config['allure_url'] }}/api/project"
        http_method: GET
        authenticator:
          type: ApiKeyAuthenticator
          api_token: "Api-Token {{ config['allure_api_token'] }}"
          inject_into:
            type: RequestOption
            inject_into: header
            field_name: Authorization
        request_parameters:
          sort: id,ASC
        error_handler:
          type: DefaultErrorHandler
          max_retries: 5
          response_filters:
            - type: HttpResponseFilter
              action: RATE_LIMITED
              http_codes:
                - 429
            - type: HttpResponseFilter
              action: RETRY
              http_codes:
                - 500
                - 502
                - 503
                - 504
          backoff_strategies:
            - type: WaitTimeFromHeader
              header: Retry-After
            - type: ExponentialBackoffStrategy
              factor: 5
      paginator:
        type: DefaultPaginator
        page_token_option:
          type: RequestOption
          inject_into: request_parameter
          field_name: page
        page_size_option:
          type: RequestOption
          inject_into: request_parameter
          field_name: size
        pagination_strategy:
          type: CursorPagination
          page_size: "{{ config.get('allure_page_size', 100) }}"
          cursor_value: "{{ response.get('number', 0) + 1 }}"
          stop_condition: "{{ response.get('last', true) }}"
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path:
            - content
    schema_loader:
      type: InlineSchemaLoader
      schema:
        type: object
        $schema: http://json-schema.org/schema#
        properties:
          id:
            type:
              - integer
              - "null"
          name:
            type:
              - string
              - "null"
          abbr:
            type:
              - string
              - "null"
          description:
            type:
              - string
              - "null"
          descriptionHtml:
            type:
              - string
              - "null"
          isPublic:
            type:
              - boolean
              - "null"
          favorite:
            type:
              - boolean
              - "null"
          createdBy:
            type:
              - string
              - "null"
          createdDate:
            type:
              - integer
              - "null"
          lastModifiedBy:
            type:
              - string
              - "null"
          lastModifiedDate:
            type:
              - integer
              - "null"
          tenant_id:
            type:
              - string
              - "null"
          source_id:
            type:
              - string
              - "null"
          unique_key:
            type: string
        required:
          - unique_key
        additionalProperties: true
    transformations:
      - type: AddFields
        fields:
          - type: AddedFieldDefinition
            path:
              - tenant_id
            value: "{{ config['insight_tenant_id'] }}"
          - type: AddedFieldDefinition
            path:
              - source_id
            value: "{{ config['insight_source_id'] }}"
          - type: AddedFieldDefinition
            path:
              - unique_key
            value: >-
              {{ config['insight_tenant_id'] }}-{{ config['insight_source_id'] }}-{{ record['id'] }}
  - type: DeclarativeStream
    name: launches
    primary_key:
      - unique_key
    retriever:
      type: SimpleRetriever
      decoder:
