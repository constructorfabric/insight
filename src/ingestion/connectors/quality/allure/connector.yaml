concurrency_level:
  type: ConcurrencyLevel
  default_concurrency: 4

spec:
  type: Spec
  connection_specification:
    type: object
    $schema: http://json-schema.org/draft-07/schema#
    required:
      - insight_tenant_id
      - insight_source_id
      - allure_url
      - allure_api_token
    properties:
      insight_tenant_id:
        type: string
        description: Insight tenant identifier stamped onto every emitted record.
        title: Insight Tenant ID
        order: 0
      insight_source_id:
        type: string
        description: Insight source identifier stamped onto every emitted record.
        title: Insight Source ID
        order: 1
      allure_url:
        type: string
        description: >-
          HTTPS base URL of the Allure TestOps instance without a trailing slash,
          e.g. https://allure.example.com.
        title: Allure TestOps URL
        pattern: "^https://\\S+[^/]$"
        examples:
          - https://allure.example.test
        order: 2
      allure_api_token:
        type: string
        description: Allure TestOps API token, sent on every request as the header Authorization "Api-Token <token>".
        title: Allure TestOps API Token
        airbyte_secret: true
        order: 3
      allure_project_ids:
        type: array
        items:
          type: integer
        description: >-
          Optional. Numeric ids of the Allure TestOps projects to sync. Empty or
          unset syncs every project the token can see, including projects created
          later.
        title: Project IDs
        examples:
          - - 1
        order: 4
      allure_page_size:
        type: string
        description: Page size requested from every paginated Allure TestOps endpoint, 1 to 1000.
        title: Page Size
        pattern: "^([1-9]|[1-9][0-9]{1,2}|1000)$"
        default: "100"
        order: 5
      allure_start_date:
        type: string
        description: >-
          Earliest lastModifiedDate (UTC, YYYY-MM-DD) the first sync of launches and
          test results reads from. Empty means 90 days back. Test cases are always
          read in full.
        title: Start Date
        pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        examples:
          - "2025-01-01"
        order: 6
    additionalProperties: true

metadata:
  assist: {}
  autoImportSchema:
    projects: true
    launches: true
    test_results: true
    test_cases: true
    custom_fields: true
