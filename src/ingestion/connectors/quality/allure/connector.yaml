                    cursor_value: "{{ response.get('number', 0) + 1 }}"
                    stop_condition: "{{ response.get('last', true) }}"
                record_selector:
                  type: RecordSelector
                  extractor:
                    type: DpathExtractor
                    field_path:
                      - content
                  record_filter:
