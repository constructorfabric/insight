version: 2

sources:
  - name: bronze_allure
    freshness:
      warn_after: {count: 36, period: hour}
      error_after: {count: 72, period: hour}
    loaded_at_field: _airbyte_extracted_at
    schema: bronze_allure
    tables:
      - name: projects
      - name: launches
      - name: test_results
      - name: launch_environment
      - name: defects
        freshness: null
      - name: defect_test_results
        freshness: null
      - name: categories
        freshness: null
      - name: category_matchers
        freshness: null
      - name: launch_errors
        freshness: null
      - name: custom_fields
      - name: test_cases
        freshness: null

models:
  - name: allure__launches
    description: "Allure TestOps launches -> staging, one row per launch"
    columns:
      - name: tenant_id
        data_tests:
          - not_null
      - name: source_id
        data_tests:
          - not_null
      - name: unique_key
        description: "{tenant}-{source}-{launch id}"
        data_tests:
          - not_null
          - unique
      - name: created_by
        description: "Allure login of the launch creator, not a person id"
      - name: created_at
        description: "createdDate (epoch ms) as UTC DateTime64(3)"
      - name: last_modified_at
        description: "lastModifiedDate (epoch ms) as UTC DateTime64(3), the connector's incremental cursor"

  - name: allure__test_results
    description: "Allure TestOps test results -> staging, one row per result, read per launch"
    columns:
      - name: tenant_id
        data_tests:
          - not_null
      - name: source_id
        data_tests:
          - not_null
      - name: unique_key
        description: "{tenant}-{source}-{test result id}"
        data_tests:
          - not_null
          - unique
      - name: status
        description: "Allure status as sent: passed, failed, broken, skipped or unknown"
      - name: is_hidden
        description: "True when a retry superseded this result"
      - name: started_at
        description: "start (epoch ms) as UTC DateTime64(3)"
      - name: stopped_at
        description: "stop (epoch ms) as UTC DateTime64(3)"
      - name: category_id
        description: "Failure category the result was matched or resolved to; NULL when none"
      - name: category_name
        description: "Name of that failure category; empty when none"
      - name: assignee
        description: "Allure login the result is assigned to, not a person id"
      - name: tested_by
        description: "Allure login that ran a manual result, not a person id"
      - name: launch_env
        description: "The launch's environment variables as a JSON object, name -> value; when a name has several values, the one with the highest value id. '{}' when the launch has none"

  - name: allure__test_cases
    description: "Allure TestOps test cases -> staging, one row per test case"
    columns:
      - name: tenant_id
        data_tests:
          - not_null
      - name: source_id
        data_tests:
          - not_null
      - name: unique_key
        description: "{tenant}-{source}-{test case id}"
        data_tests:
          - not_null
          - unique
      - name: custom_fields
        description: "Every custom field the test case carries: field name -> its values. Field names come from the project, none are fixed here"
      - name: last_modified_at
        description: "lastModifiedDate (epoch ms) as UTC DateTime64(3), the connector's incremental cursor"

  - name: allure__test_case_custom_fields
    description: "One row per test case x custom field value, rebuilt from bronze each run so removed values drop out"
    columns:
      - name: tenant_id
        data_tests:
          - not_null
      - name: source_id
        data_tests:
          - not_null
      - name: unique_key
        description: "{test case unique_key}-{custom field value id}"
        data_tests:
          - not_null
          - unique
      - name: field_name
        description: "Custom field name as the project defines it, e.g. Epic, Feature, Story, SubProject"
        data_tests:
          - not_null

  - name: allure__custom_fields
    description: "Custom fields each configured project defines, including ones no test case uses yet"
    columns:
      - name: tenant_id
        data_tests:
          - not_null
      - name: source_id
        data_tests:
          - not_null
      - name: unique_key
        description: "{tenant}-{source}-{project id}-{field id}; built-in fields share negative ids across projects"
        data_tests:
          - not_null
          - unique

  - name: allure__launch_environment
    description: "Allure TestOps launch environment -> staging, one row per launch and variable value"
    columns:
      - name: tenant_id
        data_tests:
          - not_null
      - name: source_id
        data_tests:
          - not_null
      - name: unique_key
        description: "{tenant}-{source}-{launch id}-{value id}"
        data_tests:
          - not_null
          - unique
      - name: variable_name
        description: "Environment variable name as Allure sends it, spaces included"
      - name: value
        description: "The variable's value in this launch"
      - name: launch_last_modified_at
        description: "The launch's lastModifiedDate (epoch ms) as UTC DateTime64(3), the cursor the stream syncs by"

  - name: allure__launch_errors
    description: "Errors Allure TestOps recorded against a launch itself, outside any test result -> staging, one row per error"
    columns:
      - name: tenant_id
        data_tests:
          - not_null
      - name: source_id
        data_tests:
          - not_null
      - name: unique_key
        description: "{tenant}-{source}-{launch error id}"
        data_tests:
          - not_null
          - unique
      - name: error_hash
        description: "Hash Allure groups identical errors by"
      - name: launch_last_modified_at
        description: "The launch's lastModifiedDate (epoch ms) as UTC DateTime64(3), the cursor the stream syncs by"

  - name: allure__categories
    description: "Failure categories each synced project uses -> staging, one row per project and category"
    columns:
      - name: tenant_id
        data_tests:
          - not_null
      - name: source_id
        data_tests:
          - not_null
      - name: unique_key
        description: "{tenant}-{source}-{project id}-{category id}: a category is global and can serve several projects"
        data_tests:
          - not_null
          - unique

  - name: allure__category_matchers
    description: "Rules that assign a failed result to a failure category by regex on its message or trace -> staging, one row per project and matcher"
    columns:
      - name: tenant_id
        data_tests:
          - not_null
      - name: source_id
        data_tests:
          - not_null
      - name: unique_key
        description: "{tenant}-{source}-{project id}-{matcher id}: a matcher is global and can serve several projects"
        data_tests:
          - not_null
          - unique
      - name: message_regex
        description: "Regex the result's message must match; empty when the matcher checks the trace only"
      - name: trace_regex
        description: "Regex the result's trace must match; empty when the matcher checks the message only"

  - name: allure__defects
    description: "Defects triaged in Allure TestOps -> staging, one row per defect, read from the defect detail"
    columns:
      - name: tenant_id
        data_tests:
          - not_null
      - name: source_id
        data_tests:
          - not_null
      - name: unique_key
        description: "{tenant}-{source}-{defect id}"
        data_tests:
          - not_null
          - unique
      - name: issue_name
        description: "Tracker issue key the defect is linked to; empty when none"
      - name: found_launch_id
        description: "Launch the defect was first found in"
      - name: last_found_at
        description: "lastFoundDate (epoch ms) as UTC DateTime64(3): when a result last matched the defect"

  - name: allure__defect_test_results
    description: "Test results linked to each defect -> staging, one row per defect and result"
    columns:
      - name: tenant_id
        data_tests:
          - not_null
      - name: source_id
        data_tests:
          - not_null
      - name: unique_key
        description: "{tenant}-{source}-{defect id}-{test result id}"
        data_tests:
          - not_null
          - unique
      - name: test_result_id
        description: "Joins allure__test_results.test_result_id"
