version: 2

sources:
  - name: bronze_allure
    freshness:
      warn_after: {count: 36, period: hour}
      error_after: {count: 72, period: hour}
    loaded_at_field: _airbyte_extracted_at
    schema: bronze_allure
    tables:
      - name: projects
      - name: launches
      - name: test_results
      - name: launch_environment
      - name: custom_fields
      - name: test_cases
        freshness: null

models:
  - name: allure__launches
    description: "Allure TestOps launches -> staging, one row per launch"
    columns:
      - name: tenant_id
        data_tests:
          - not_null
      - name: source_id
        data_tests:
          - not_null
      - name: unique_key
        description: "{tenant}-{source}-{launch id}"
        data_tests:
          - not_null
          - unique
      - name: created_by
        description: "Allure login of the launch creator, not a person id"
      - name: created_at
        description: "createdDate (epoch ms) as UTC DateTime64(3)"
      - name: last_modified_at
        description: "lastModifiedDate (epoch ms) as UTC DateTime64(3), the connector's incremental cursor"

  - name: allure__test_results
    description: "Allure TestOps test results -> staging, one row per result, read per launch"
    columns:
      - name: tenant_id
        data_tests:
          - not_null
      - name: source_id
        data_tests:
          - not_null
      - name: unique_key
        description: "{tenant}-{source}-{test result id}"
        data_tests:
          - not_null
          - unique
      - name: status
        description: "Allure status as sent: passed, failed, broken, skipped or unknown"
      - name: is_hidden
        description: "True when a retry superseded this result"
      - name: started_at
        description: "start (epoch ms) as UTC DateTime64(3)"
      - name: stopped_at
        description: "stop (epoch ms) as UTC DateTime64(3)"
      - name: category_id
        description: "Failure category the result was matched or resolved to; NULL when none"
      - name: category_name
        description: "Name of that failure category; empty when none"
      - name: assignee
        description: "Allure login the result is assigned to, not a person id"
      - name: tested_by
        description: "Allure login that ran a manual result, not a person id"
      - name: launch_env
        description: "The launch's environment variables as a JSON object, name -> value; when a name has several values, the one with the highest value id. '{}' when the launch has none"

  - name: allure__test_cases
    description: "Allure TestOps test cases -> staging, one row per test case"
    columns:
      - name: tenant_id
        data_tests:
          - not_null
      - name: source_id
        data_tests:
          - not_null
      - name: unique_key
        description: "{tenant}-{source}-{test case id}"
        data_tests:
          - not_null
          - unique
      - name: custom_fields
        description: "Every custom field the test case carries: field name -> its values. Field names come from the project, none are fixed here"
      - name: last_modified_at
        description: "lastModifiedDate (epoch ms) as UTC DateTime64(3), the connector's incremental cursor"

  - name: allure__test_case_custom_fields
    description: "One row per test case x custom field value, rebuilt from bronze each run so removed values drop out"
    columns:
      - name: tenant_id
        data_tests:
          - not_null
      - name: source_id
        data_tests:
          - not_null
      - name: unique_key
        description: "{test case unique_key}-{custom field value id}"
        data_tests:
          - not_null
          - unique
      - name: field_name
        description: "Custom field name as the project defines it, e.g. Epic, Feature, Story, SubProject"
        data_tests:
          - not_null

  - name: allure__custom_fields
    description: "Custom fields each configured project defines, including ones no test case uses yet"
    columns:
      - name: tenant_id
        data_tests:
          - not_null
      - name: source_id
        data_tests:
          - not_null
      - name: unique_key
        description: "{tenant}-{source}-{project id}-{field id}; built-in fields share negative ids across projects"
        data_tests:
          - not_null
          - unique

  - name: allure__launch_environment
    description: "Allure TestOps launch environment -> staging, one row per launch and variable value"
    columns:
      - name: tenant_id
        data_tests:
          - not_null
      - name: source_id
        data_tests:
          - not_null
      - name: unique_key
        description: "{tenant}-{source}-{launch id}-{value id}"
        data_tests:
          - not_null
          - unique
      - name: variable_name
        description: "Environment variable name as Allure sends it, spaces included"
      - name: value
        description: "The variable's value in this launch"
      - name: launch_last_modified_at
        description: "The launch's lastModifiedDate (epoch ms) as UTC DateTime64(3), the cursor the stream syncs by"
