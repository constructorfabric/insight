name: allure
type: nocode
# 3.1.0: the tenant segment of unique_key comes from insight_tenant_key, so a
#   warm install keeps its keys when tenant_id moves to the canonical tenant
#   UUID. MINOR per ADR-0015: no stored key changes.
version: "3.1.0"
schedule: "0 4 * * *"
workflow: sync
dbt_select: "tag:allure+"

connection:
  namespace: "bronze_allure"

secret:
  required_fields:
    - allure_url
    - allure_api_token
