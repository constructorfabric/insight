version: 2

models:
  - name: class_ai_dev_usage
    description: >
      Unified per-person per-day AI developer tool usage across Cursor,
      Claude Code (from Claude Enterprise for Enterprise orgs; from Claude Admin
      for Admin-only orgs), GitHub Copilot, and future sources (Windsurf, Codex).
      One row per (tenant, email, day, tool).
      CONTRACT — activity invariant: a row exists ONLY when the person had real
      activity with the tool that day. Every staging model in the
      silver:class_ai_dev_usage tag must gate emission on a source-appropriate
      activity signal (cursor: isActive=true;
      claude-team/claude-enterprise/copilot/chatgpt-team: activity-counter
      filters). Seat lifecycle state is NOT an activity signal: it describes
      the seat as of the last read, so gating on it deletes the history of
      whoever left — carry it in seat_status instead.
      Downstream consumers (insight.ai_metric_observations active_day) rely on
      row existence and must NOT re-derive activity from counters.
    columns:
      - name: insight_tenant_id
        description: "Tenant isolation field"
        tests:
          - not_null
      - name: source_id
        description: "Connector instance identifier"
        tests:
          - not_null
      - name: unique_key
        description: >
          Composite dedup key. Format varies per staging model:
          cursor → tenant-source-userId-day;
          claude_admin → tenant-source-email-day.
          Uniqueness is per-source — a user active on BOTH Cursor and Claude Code
          on the same day produces two rows, disambiguated by `source` / `tool`.
        tests:
          - not_null
          - unique
      - name: email
        description: >
          Work email when directly available from the source (Cursor and
          Claude Code rows with actor_type='user'). NULL for rows where
          the source authenticated via an API key (Claude Code rows with
          actor_type='api_actor') — in that case api_key_id carries the
          identity proxy and Silver Step 2 (Identity Resolution) maps
          api_key_id → person_id. At least one of email / api_key_id is
          always populated.
      - name: api_key_id
        description: >
          Anthropic API key identifier. Populated when a source authenticated
          via an API key rather than a user session (common for Claude Code
          CLI: organisations provision named per-developer keys). Resolved
          to person_id by the resolve_person_id macro. NULL for Cursor and
          for Claude Code rows with actor_type='user'.
      - name: day
        description: "Calendar date of usage (UTC)"
        tests:
          - not_null
      - name: tool
        description: "AI dev tool discriminator"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['cursor', 'claude_code', 'copilot', 'windsurf', 'codex']
      - name: conversation_count
        description: >
          Dev-tool conversations/threads on this day — the metric-feed column
          Gold dev_conversations sums with no tool filter. A connector opts in
          by mapping it; structural NULL where the source has no conversation
          concept (Cursor) — never a synthetic marker.

          For the dev-agent tools the vendors do not report conversations
          separately: one session or thread IS the unit of conversation, so
          claude_code and codex connectors map their session/thread counter
          here and the value equals session_count on those rows. That is the
          intended mapping, not a duplication to collapse — the two columns
          hold different concepts that coincide for these sources, and they do
          NOT coincide on class_ai_assistant_usage, where chat reports
          conversations and the office surfaces report sessions.
      - name: session_count
        description: >
          Sessions recorded on this day. For Cursor: 1 per active day (Cursor
          only exposes an is-active flag, not session counts). Contract and
          data-quality column only — it feeds the activity guard, and no Gold
          measure or metric reads it. The conversations metric reads
          conversation_count.
        tests:
          - not_null
      - name: lines_added
        description: >
          Lines of code added and accepted from AI. For Cursor: acceptedLinesAdded.
          For Claude Code: lines_added from claude_admin_code_usage. Summed by
          insight.ai_metric_observations as the accepted_lines measure.
        tests:
          - not_null
      - name: lines_removed
        description: >
          Lines removed / accepted-to-remove from AI. NULL for sources that
          do not expose AI-removed lines (Claude Team, Claude Admin). Zero
          is not used — NULL-policy: structural absence = NULL, not 0.
      - name: total_lines_added
        description: >
          Total lines added by the user that day (AI-accepted + manual keystrokes).
          Populated for Cursor only (totalLinesAdded). NULL for Claude Code —
          Enterprise only sees AI-accepted lines, not total keystrokes.
      - name: total_lines_removed
        description: >
          Total lines deleted by the user that day (all edits, not just AI-assisted).
          Populated for Cursor only (totalLinesDeleted). NULL for Claude Code.
      - name: tool_use_offered
        description: >
          Tool invocations offered/shown. For Cursor: totalTabsShown.
          For Claude Code: tool_use_accepted + tool_use_rejected (offered = accept + reject).
          NULL if the source does not distinguish offered vs accepted.
      - name: tool_use_accepted
        description: >
          Tool invocations accepted. For Cursor: totalTabsAccepted.
          For Claude Code: tool_use_accepted (Edit/Write/MultiEdit/NotebookEdit).
          Numerator for accepted/offered acceptance ratios downstream.
      - name: agent_sessions
        description: >
          Cursor agent sessions (agentRequests). NULL for other tools.
      - name: chat_requests
        description: >
          Cursor chat + composer requests (chatRequests + composerRequests).
          NULL for other tools.
      - name: cost_cents
        description: >
          This person-day's AI usage priced at the vendor's token/usage rates,
          in cents — what the consumption would cost if billed purely by usage.
          It is NOT the amount invoiced: usage a seat or subscription already
          covered is included, and seat/subscription fees are excluded.

          Populated by Cursor (sum of the day's priced events) and Claude Team
          (total_cost). NULL for Claude Code via Enterprise (no per-user
          billing — cost exists only per API key / workspace), for Copilot (no
          cost surface), and for ChatGPT Team (credits are not currency).

          Cash actually spent is a different quantity and lives elsewhere:
          per-seat overage in class_ai_overage, token-metered invoices at
          workspace / project grain in their own sources.
      - name: commits_count
        description: >
          Git commits attributed to Claude Code sessions. Populated for
          Claude Enterprise only (code_commit_count). NULL for Cursor and
          other tools that do not expose git-level attribution.
      - name: pull_requests_count
        description: >
          Pull requests attributed to Claude Code sessions.
          Claude Enterprise only: code_pull_request_count.
          NULL for Claude Team (Team-plan PR counts go into prs_total_count),
          Cursor, and Copilot.
      - name: prs_with_cc_count
        description: >
          PRs where Claude Code was active at least once in the measurement
          window. Populated for Claude Team only (prs_with_cc from the web
          API; requires Anthropic GitHub-app to be connected — NULL / 0 on
          orgs without it). NULL for all other sources.
      - name: prs_total_count
        description: >
          Total PRs in the measurement window. Populated for Claude Team only
          (total_prs from the web API). Denominator for a PRs-with-assistant
          share downstream. ⚠️ May be a period-aggregate (cumulative across the
          billing window), not a daily count — verify against a tenant with
          the Anthropic GitHub-app connected. NULL for all other sources.
      - name: tool_action_breakdown_json
        description: >
          Raw JSON breakdown of tool actions per tool type.
          Claude Enterprise: edit/write/multi_edit/notebook_edit with accepted/rejected counts
          (from claude_code_metrics_json in Bronze).
          Copilot: activity flags {"used_chat": bool, "used_agent": bool, "used_cli": bool}.
          NULL for Cursor (Cursor does not expose per-tool-type breakdown at daily grain).
      - name: source
        description: "Staging-model discriminator: 'cursor' | 'claude_admin' | 'claude_enterprise' | 'claude_team' | 'claude_playwright' | 'copilot' | 'chatgpt_team' | future sources"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['cursor', 'claude_admin', 'claude_enterprise', 'claude_team', 'claude_playwright', 'copilot', 'windsurf', 'chatgpt_team']
      - name: data_source
        description: "Framework source discriminator — 'insight_cursor' / 'insight_claude_admin' / etc."
        tests:
          - not_null
      - name: collected_at
        description: "When the record was collected"
        tests:
          - not_null
      - name: seat_status
        description: >
          Vendor seat / licence state as reported at the LAST read, lower-cased
          ('active', 'deactivated', …). Not a property of `day`: sources restate
          it on every read of their rolling window, so a person whose seat is
          deactivated today carries the new value on every historical row.
          Populated by Claude Team only (`status`); NULL where the source has no
          seat lifecycle concept. Reaches gold as the seat_status dimension.
          Never use it as an emission filter — see the activity invariant above.

  - name: class_ai_assistant_usage
    description: >
      Unified per-person per-day AI assistant surface usage. Covers
      Claude Enterprise chat, office (Excel/PowerPoint), cowork, and cross
      (surface-agnostic counters, currently web_search) surfaces.
      One row per (tenant, email, day, surface).
      CONTRACT — activity invariant: a row exists ONLY when the person had real
      activity on the surface that day. Every staging model in the
      silver:class_ai_assistant_usage tag must gate emission on its surface
      counters (claude-enterprise: per-surface counter filters; chatgpt-team:
      chat counter filter). Downstream consumers
      (insight.ai_metric_observations active_day) rely on row existence and
      must NOT re-derive activity from counters.
    columns:
      - name: insight_tenant_id
        description: "Tenant isolation field"
        tests:
          - not_null
      - name: source_id
        description: "Connector instance identifier"
        tests:
          - not_null
      - name: unique_key
        description: "Composite dedup key: tenant-source-email-day-surface."
        tests:
          - not_null
          - unique
      - name: email
        description: "Work email — Enterprise always provides user_email."
        tests:
          - not_null
      - name: day
        description: "Calendar date of usage (UTC)"
        tests:
          - not_null
      - name: tool
        description: >
          AI assistant vendor discriminator. 'claude' for Claude Enterprise
          surfaces (chat / cowork / excel / powerpoint / cross). Future:
          'chatgpt' (OpenAI Compliance API), 'gemini'.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['claude', 'chatgpt', 'gemini']
      - name: surface
        description: >
          Per-vendor surface discriminator. For tool='claude': 'chat' = Claude.ai
          chat; 'excel' / 'powerpoint' = Office integrations; 'cowork' = Claude
          Cowork; 'cross' = surface-agnostic counters (currently only web_search) —
          emitted as a separate row to avoid attributing them to any single
          surface.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['chat', 'excel', 'powerpoint', 'cowork', 'cross']
      - name: session_count
        description: >
          Number of distinct sessions on the surface.
          excel → excel_session_count.
          powerpoint → powerpoint_session_count.
          cowork → cowork_session_count.
          chat → NULL (Claude.ai chat is not session-bounded in the API).
          cross → NULL.
      - name: conversation_count
        description: >
          Number of distinct conversations.
          chat → chat_conversation_count.
          excel / powerpoint / cowork / cross → NULL.
      - name: message_count
        description: >
          Total messages on the surface.
          chat → chat_message_count.
          excel → excel_message_count.
          powerpoint → powerpoint_message_count.
          cowork → cowork_message_count.
          cross → NULL.
      - name: action_count
        description: >
          Discrete actions performed on the surface (writes / edits / tool calls).
          cowork → cowork_action_count.
          chat, excel, powerpoint, cross → NULL (no action counter exposed).
      - name: files_uploaded_count
        description: "chat → chat_files_uploaded_count. NULL for other surfaces."
      - name: artifacts_created_count
        description: "chat → chat_artifacts_created_count. NULL for other surfaces."
      - name: projects_created_count
        description: "chat → chat_projects_created_count. NULL for other surfaces."
      - name: projects_used_count
        description: "chat → chat_projects_used_count. NULL for other surfaces."
      - name: skills_used_count
        description: >
          chat → chat_skills_used_count.
          cowork → cowork_skills_used_count.
          excel, powerpoint, cross → NULL.
      - name: connectors_used_count
        description: "chat → chat_connectors_used_count. NULL for other surfaces."
      - name: thinking_message_count
        description: "chat → chat_thinking_message_count. NULL for other surfaces."
      - name: dispatch_turn_count
        description: "cowork → cowork_dispatch_turn_count. NULL for other surfaces."
      - name: search_count
        description: >
          Web searches initiated by the user. Always emitted on a row with
          surface='cross' — web_search is cross-surface (not attributable to
          a single chat / excel / powerpoint / cowork session). NULL for
          non-cross surfaces.
      - name: cost_cents
        description: >
          Assistant usage priced at the vendor's token/usage rates, in cents —
          same meaning as class_ai_dev_usage.cost_cents, not an invoiced amount.
          NULL for Claude Enterprise (cost is org-level subscription, not
          per-user / per-surface). Reserved for future providers that surface
          assistant cost per-user.
      - name: surface_metrics_json
        description: >
          Raw JSON blob for the surface (chat_metrics_json / office_metrics_json /
          cowork_metrics_json) for future field extraction without Bronze re-query.
          NULL for surface='cross'.
      - name: source
        description: "Staging-model discriminator: 'claude_enterprise' | 'chatgpt_team' | future sources"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['claude_enterprise', 'chatgpt_team']
      - name: data_source
        description: "Framework source discriminator."
        tests:
          - not_null
      - name: collected_at
        description: "When the record was collected"
        tests:
          - not_null

  - name: class_ai_invoice
    description: >
      Unified vendor invoice lines — the invoiced layer, as opposed to
      consumption priced at vendor rates (class_ai_dev_usage) or spend against a
      seat's ceiling (class_ai_overage). Grain: one row per (tenant, source,
      invoice, line). Amounts in minor units + ISO currency. seat_unit_cents is
      the per-seat price the vendor stated, NULL wherever a line prices no seat.
    columns:
      - name: unique_key
        tests:
          - not_null
          - unique
      - name: insight_tenant_id
        tests:
          - not_null
      - name: tool
        tests:
          - not_null
      - name: chain_status
        description: "'ok' | 'failed' | 'unparsable_url' — how far the enrichment got for the invoice this line belongs to"
        tests:
          - not_null
      - name: currency
        tests:
          - not_null
      - name: period_month
        tests:
          - not_null
      - name: source
        tests:
          - not_null
      - name: _version
        tests:
          - not_null

  - name: class_ai_overage
    description: >
      Unified per-person per-month AI spend-vs-limit (overage) across vendors.
      Grain: one row per (tenant, source, seat, billing month). Answers "how
      much did each person spend above their monthly limit". Homogeneous
      monetary contract in minor units (cents) + ISO currency so seats from
      Claude Team and future sources (OpenAI / ChatGPT) are directly
      comparable. overage_cents = max(0, used_amount_cents - credit_limit_cents),
      NULL when no limit is known (honest-NULL). First/only source today:
      Claude Team (claude_team__ai_overage, from /overage_spend_limits via the
      claude-team-proxy, billing:view/Owner-gated). OpenAI joins later by
      emitting the same 19 columns under tag silver:class_ai_overage.
    columns:
      - name: insight_tenant_id
        description: "Tenant isolation field"
        tests:
          - not_null
      - name: source_id
        description: "Connector instance identifier"
        tests:
          - not_null
      - name: unique_key
        description: "Composite dedup key: tenant-source-seat-YYYY-MM (per source/month)"
        tests:
          - not_null
          - unique
      - name: email
        description: >
          Seat work email (lowercased). Present for Claude Team (every seat
          carries an email). For sources where overage is only attributable
          via an API/account id, email MAY be NULL and account_id carries the
          identity proxy (resolved in Silver Step 2).
      - name: account_id
        description: "Stable vendor seat/account id (Claude: account_uuid). Identity proxy / join anchor."
      - name: period_month
        description: "First day of the billing month (UTC). Monthly billing grain."
        tests:
          - not_null
      - name: tool
        description: "AI vendor discriminator."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['claude', 'chatgpt', 'openai']
      - name: seat_tier
        description: "Vendor plan/seat tier (free text per vendor). NULL when not exposed."
      - name: currency
        description: >
          ISO currency of the *_cents monetary columns. 'USD' today (both
          Claude Team and OpenAI bill in USD); extend accepted_values when a
          non-USD billing tenant first appears.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['USD']
      - name: credit_limit_cents
        description: >
          Monthly spend/credit limit in minor units (cents). NULL when no limit
          applies or the limit is unknown for the source.
      - name: used_amount_cents
        description: "Spend so far in the period, in minor units (cents)."
        tests:
          - not_null
      - name: overage_cents
        description: >
          Spend beyond the limit: max(0, used_amount_cents - credit_limit_cents).
          NULL (not 0) when credit_limit_cents is unknown — overage is
          uncomputable without a limit.
      - name: is_over_limit
        description: "1 when used_amount_cents > credit_limit_cents (soft overage). NULL when limit unknown."
      - name: is_enabled
        description: "Whether overage / extra-usage is enabled for the seat. NULL when not exposed."
      - name: overage_metrics_json
        description: >
          Raw vendor-specific extras kept out of the positional contract.
          Claude Team: limit_type / used_credits_basis / out_of_credits /
          seat_tier / disabled_reason / disabled_until / account_name.
      - name: source
        description: "Staging-model discriminator."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['claude_team', 'openai', 'chatgpt_team']
      - name: data_source
        description: "Framework source discriminator."
        tests:
          - not_null
      - name: collected_at
        description: "When the record was collected (_airbyte_extracted_at)."
        tests:
          - not_null

  - name: class_ai_overage_daily
    description: >
      Per-person readings of the month-to-date AI overage spend, across
      vendors. Grain: one row per (tenant, source, seat, day the vendor was
      read). Same monetary contract as class_ai_overage — minor units (cents)
      plus ISO currency. Where class_ai_overage holds a month's closing state,
      this holds the readings that led to it, so a vendor reporting only a
      cumulative month-to-date figure can still be resolved to a day's spend:
      the difference between consecutive readings, computed in gold. Readings
      begin at claude-team 3.2.0, when Bronze started keying a seat by the day
      it was read; earlier readings were overwritten within their month and are
      not recoverable.
    columns:
      - name: insight_tenant_id
        description: "Tenant isolation field"
        tests:
          - not_null
      - name: source_id
        description: "Connector instance identifier"
        tests:
          - not_null
      - name: unique_key
        description: "Composite dedup key: tenant-source-seat-YYYY-MM-DD (per source/day)"
        tests:
          - not_null
          - unique
      - name: email
        description: "Seat work email (lowercased)."
      - name: account_id
        description: "Stable vendor seat/account id (Claude: account_uuid)."
      - name: snapshot_date
        description: "The day the vendor was read. The grain of this relation."
        tests:
          - not_null
      - name: period_month
        description: >
          First day of the billing month the reading belongs to (UTC). The
          cumulative figure resets with it, so a difference may only be taken
          between readings that share it.
        tests:
          - not_null
      - name: tool
        description: "AI vendor discriminator."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['claude', 'chatgpt', 'openai']
      - name: seat_tier
        description: "Vendor plan/seat tier (free text per vendor). NULL when not exposed."
      - name: currency
        description: "ISO currency of the *_cents monetary columns."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['USD']
      - name: credit_limit_cents
        description: >
          The spend ceiling in force on the seat that day, in minor units.
          NULL when no limit applies or the limit is unknown for the source.
      - name: used_amount_cents
        description: >
          Spend since the start of the billing month, in minor units, as the
          vendor reported it that day. Cumulative — NOT that day's spend.
        tests:
          - not_null
      - name: source
        description: "Staging-model discriminator."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['claude_team', 'openai', 'chatgpt_team']
      - name: data_source
        description: "Framework source discriminator."
        tests:
          - not_null
      - name: collected_at
        description: "When the record was collected (_airbyte_extracted_at)."
        tests:
          - not_null
