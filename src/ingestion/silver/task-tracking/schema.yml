version: 2

sources:
  # Operator-authored bindings: which vendor field plays which metric role, and
  # what a vendor value means. dbt guarantees the relations exist via the
  # `create_task_config_tables` on-run-start hook but owns none of the rows — a
  # model materializing over them would wipe the decisions they hold. Declared
  # in the task-tracking domain rather than under one connector, because every
  # task source and gold itself read them.
  - name: config
    schema: config
    tables:
      - name: task_field_roles
      - name: task_value_map

models:
  - name: class_task_field_history
    description: "Unified per-(issue × field × event) history from all task-tracker sources. Event-sourced: one row per changelog entry or synthetic_initial bootstrap row. Source of truth is the Rust jira-enrich binary (per-source)."
    columns:
      - name: insight_source_id
        description: "Source instance identifier"
        tests:
          - not_null
      - name: data_source
        description: "Source system discriminator (e.g. 'jira')"
        tests:
          - not_null
      - name: title
        description: >
          The issue's own summary as the tracker states it, repeated on every
          event of that issue — an issue attribute, not an event one. NULL when
          the source does not report one. Gold surfaces it as `details.title` in
          task evidence; the record label is `id_readable`.
      - name: event_id
        description: "Natural identifier of the event. For `event_kind='changelog'` this is `jira_issue_history.changelog_id` (shared across all fields changed in one changelog). For `event_kind='synthetic_initial'` it is `'initial:<issue_id>'` (shared across all initial fields of one issue). For `event_kind='availability'` it is `'availability:<issue_id>:<detection epoch ms>'` (issue id included because census-only issues have an empty `id_readable`, and the audit grain needs event_id to disambiguate them). Per ADR-005, operator audit JOIN key is (insight_source_id, id_readable, event_id, field_id)."
        tests:
          - not_null
      - name: event_kind
        description: "Discriminator for event origin. Enum8: `changelog` = real field change from jira_issue_history; `synthetic_initial` = bootstrap row emitted for every tracked field on first observation of an issue; `availability` = synthetic availability transition (present / deleted / archived / trashed / access_lost / unobserved) detected by the source's census streams; `lifecycle` = sub-entity lifecycle (field_id `comment` / `worklog`, delta_action add/set/remove) — value_ids[1] is the entity id, the lookup key into class_task_comments / class_task_worklogs. The issue's entire history, including deletions of the issue and of its sub-entities, lives in this one table."
        tests:
          - not_null
          - accepted_values:
              values: ['changelog', 'synthetic_initial', 'availability', 'lifecycle']
      - name: field_id
        description: "Field identifier (e.g. 'status', 'assignee', 'customfield_10020'). Part of the ReplacingMergeTree ORDER BY together with (insight_source_id, data_source, id_readable, event_id) — see ADR-005."
        tests:
          - not_null

  - name: class_task_field_metadata
    description: "Unified task-tracker field catalog. Declares cardinality (`is_multi`) and whether the field has an opaque ID vs a string literal (`has_id`). Consumed by `jira-enrich` to classify `value_id_type`."
    columns:
      - name: insight_source_id
        tests:
          - not_null
      - name: field_id
        tests:
          - not_null

  - name: class_task_comments
    description: "Unified issue comments from all task-tracker sources."
    columns:
      - name: insight_source_id
        tests:
          - not_null
      - name: comment_id
        tests:
          - not_null

  - name: class_task_worklogs
    description: "Unified issue worklogs from all task-tracker sources."
    columns:
      - name: insight_source_id
        tests:
          - not_null
      - name: worklog_id
        tests:
          - not_null
      - name: is_deleted
        description: "1 when the worklog was deleted at the source: an authoritative /worklog/deleted tombstone, absence from the issue's re-fetched worklog list, or a deleted/trashed parent issue. Gold consumers must filter ifNull(is_deleted, 0) = 0."

  - name: class_task_users
    description: "Unified task-tracker user directory (anchor for identity resolution)."
    columns:
      - name: insight_source_id
        tests:
          - not_null
      - name: user_id
        tests:
          - not_null

  - name: class_task_projects
    description: "Unified task-tracker project catalog."
    columns:
      - name: insight_source_id
        tests:
          - not_null
      - name: project_id
        tests:
          - not_null

  - name: class_task_sprints
    description: "Unified task-tracker sprints."
    columns:
      - name: insight_source_id
        tests:
          - not_null
      - name: sprint_id
        tests:
          - not_null

  - name: class_task_links
    description: >
      Links between work items as INTERVALS, one row per link occurrence: `valid_from` when it appeared,
      `valid_to` when it went away, NULL while it is still there. The links over a window are a range
      predicate — `valid_from < :to AND (valid_to IS NULL OR valid_to > :from)` — and the links at an
      instant are the same predicate with one point. A link removed and re-added is two rows, so
      `valid_from` is part of the key rather than a version of one row. Both directions are stored: a
      parent-child pair yields a `sub_issue` row on the parent and a `parent` row on the child.
    columns:
      - name: unique_key
        description: "Source, item, link type, target and `valid_from` — the occurrence, not the link."
        tests:
          - not_null
      - name: insight_source_id
        tests:
          - not_null
      - name: data_source
        description: "Vendor that recorded the link; `github` today."
        tests:
          - not_null
      - name: id_readable
        description: "The item the link belongs to, as the tracker addresses it (`owner/repo#12`)."
        tests:
          - not_null
      - name: link_type
        description: "parent | sub_issue | blocked_by | blocking | duplicate_of | connected | closed_by_pr."
        tests:
          - not_null
      - name: target_type
        description: "What sits at the other end: issue | pull_request."
      - name: target_readable
        description: "The other end, addressed the same way. Carries its own repository, because a link may cross repositories."
        tests:
          - not_null
      - name: valid_from
        description: "When the link appeared. A lower bound rather than a fact when `valid_from_known = 0`."
        tests:
          - not_null
      - name: valid_to
        description: "When it went away; NULL while it is still there."
      - name: valid_from_known
        description: >
          1 when the vendor stated the moment the link appeared. 0 when the link was already there before
          collection began, or is known only from successive observations — the interval is still usable,
          but its lower edge is a bound. Filtering these out drops the oldest links.
      - name: evidence
        description: >
          `event` — folded from the vendor's own add and remove events, exact to the second.
          `observation` — bounded by first-seen and last-seen across snapshots, so each edge lies between
          two syncs. No link type is ever built from both, because their precision differs.
        tests:
          - accepted_values:
              values: ['event', 'observation']
      - name: is_cross_repository
        description: "The two ends live in different repositories. Derived by comparing them, because only some event types report it."
      - name: added_by
        description: "Who created the link, where the vendor names an actor; NULL for an observed link or an addition that predates collection."
      - name: removed_by
        description: "Who removed it; NULL while the link is still there."
      - name: origin_event_id
        description: "The vendor event the interval was folded from; NULL for an observed interval."
      - name: collected_at
        description: "When the evidence behind this row was collected."

  - name: class_task_statuses
    description: "Unified, source-neutral status dimension. Maps each source status id to the reconciled lifecycle `status_category` (new/in_progress/done/undefined). Jira derives it from statusCategory; YouTrack from the State bundle `isResolved` flag. Gold detects a closed task via `status_category='done'` — never a localized status name (issue #1541)."
    columns:
      - name: insight_source_id
        tests:
          - not_null
      - name: status_id
        tests:
          - not_null
      - name: status_category
        description: "Reconciled lifecycle: new | in_progress | done | undefined."
        tests:
          - not_null
          - accepted_values:
              values: ['new', 'in_progress', 'done', 'undefined']

  - name: class_task_issuetypes
    description: "Unified, source-neutral issue-type dimension. Maps each source issue type id to the reconciled `issue_kind` (bug/other/unknown) and the type display name. Jira classifies from `untranslatedName` so a translated instance reads like an untranslated one; YouTrack from the Type enum bundle value names. Gold identifies bug work via `issue_kind='bug'` — never a localized type name."
    columns:
      - name: insight_source_id
        tests:
          - not_null
      - name: issue_type_id
        tests:
          - not_null
      - name: issue_type_name
        description: "Type display name as the source reports it; the label Gold shows for the type dimension."
      - name: untranslated_name
        description: "Locale-independent type name where the source has one (Jira); NULL otherwise."
      - name: issue_kind
        description: "Reconciled type kind: bug | other | unknown. `unknown` means the type name matched neither configured list and is reported as its own bucket, never as non-bug work."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['bug', 'other', 'unknown']
