version: 2

sources:
  # Operator-authored bindings: which vendor field plays which metric role, what
  # a vendor value means, and what an unmapped value falls to. dbt guarantees
  # the relations exist via the `create_task_config_tables` on-run-start hook but
  # owns none of the rows — a model materializing over them would wipe the
  # decisions they hold. Declared in the task-tracking domain rather than under
  # one connector, because every task source and gold itself read them.
  - name: config
    schema: config
    tables:
      - name: task_field_roles
      - name: task_value_map
      - name: field_value_map
        description: >
          Operator decisions binding a vendor value of a standardized field
          (`field`, e.g. issue_type; `source_key` the vendor's key) to the
          canonical `target_value` gold consumes, with the `display_name` the
          decision was made against so a later rename of the vendor value is
          detectable.
      - name: field_value_defaults
        description: >
          Per (tenant, source, field) fallback: the `default_value` an unmapped
          source key resolves to. No row means the hardcoded `unknown` terminal.

models:
  - name: class_task_field_history
    description: "Unified per-(issue × field × event) history from all task-tracker sources. Event-sourced: one row per changelog entry, synthetic_initial bootstrap row or synthetic observation. Every producer is a dbt model contributing an arm through the `silver:class_task_field_history` tag."
    columns:
      - name: insight_source_id
        description: "Source instance identifier"
        tests:
          - not_null
      - name: data_source
        description: "Source system discriminator (e.g. 'jira')"
        tests:
          - not_null
      - name: event_id
        description: "Natural identifier of the event. For `event_kind='changelog'` this is `jira_issue_history.changelog_id` (shared across all fields changed in one changelog). For `event_kind='synthetic_initial'` it is `'initial:<issue_id>'` (shared across all initial fields of one issue). For `event_kind='availability'` it is `'availability:<issue_id>:<detection epoch ms>'` (issue id included because census-only issues have an empty `id_readable`, and the audit grain needs event_id to disambiguate them). Per ADR-005, operator audit JOIN key is (insight_source_id, issue_id, event_id, field_id)."
        tests:
          - not_null
      - name: event_kind
        description: "Discriminator for event origin, a LowCardinality(String) whose accepted values are this test, not a type: `changelog` = real field change from the tracker's changelog; `synthetic_initial` = the value at creation, one row per (issue, field); `availability` = synthetic availability transition (present / deleted / archived / trashed / access_lost / unobserved) detected by the source's census streams; `lifecycle` = sub-entity lifecycle (field_id `comment` / `worklog`, delta_action add/set/remove) — value_ids[1] is the entity id, the lookup key into class_task_comments / class_task_worklogs; `retired_field` = the field left the issue with no event recording it; `unclassified_field` = the newest value of a field the catalogue does not describe; `snapshot_diff` = the issue's observed state where it disagrees with its history, as observed rather than as an event. The issue's entire history, including deletions of the issue and of its sub-entities, lives in this one table."
        tests:
          - not_null
          - accepted_values:
              values: ['changelog', 'synthetic_initial', 'availability', 'lifecycle', 'retired_field', 'unclassified_field', 'snapshot_diff']
      - name: field_id
        description: "Field identifier (e.g. 'status', 'assignee', 'customfield_10020'). Part of the ReplacingMergeTree ORDER BY together with (insight_source_id, data_source, issue_id, event_id) — see ADR-005."
        tests:
          - not_null
      - name: event_order
        description: "The one column that orders a task's history, within one field and across all fields of the task: `ms(order_at) * 1 000 000 + band * 100 000 + rank`, composed by the `task_event_order` macro. `order_at` is `event_at`, except on `synthetic_initial` rows, where it is the earlier of the issue's creation and its first event. `band` is 0 for `synthetic_initial`, 1 for `changelog`, 2 for rows observed rather than recorded. `rank` is, for a changelog row, the position of its entry among the task's entries of that instant — shared by every field the entry changed, ordered by the from→to chains of those fields, then by the changelog id — and for a `synthetic_initial` row the field's index (0 for the creation marker). Unique per (issue, field); `event_at` stays the real time for durations and date filters."
        tests:
          - not_null
      - name: _seq
        description: "Superseded by `event_order`, which readers sort by. A `synthetic_initial` row's field index (0 for the creation marker) and a changelog row's rank within its instant; 0 elsewhere."
      - name: value_ids
        description: "Identifiers of the field's value at this event, parallel to `value_displays`. On a `text_ref` row, the one element is the `text_id` of the body in `class_task_field_text`."
      - name: value_displays
        description: "Readable values, parallel to `value_ids`. On a `text_ref` row, the one element is only the first characters of the body (`task_long_text_prefix_chars`, default 200), never the full text: join `class_task_field_text` on (`insight_source_id`, `data_source`, `text_id = value_ids[1]`) for it. An empty long-text value has no element and no body."
      - name: value_id_type
        description: >
          What `value_ids` hold: `opaque_id` = a source-native identifier;
          `account_id` = a user's account id; `string_literal` = the value
          itself; `none` = no identifier separate from the display (or no
          value); `text_ref` = a reference to a long-text body in
          `class_task_field_text`. A field is long text by its type, never by
          the length of one value: for Jira `description`, `environment` and
          multi-line text custom fields; for YouTrack `description` and
          multi-line text custom fields.
        tests:
          - not_null
          - accepted_values:
              values: ['opaque_id', 'account_id', 'string_literal', 'none', 'text_ref']

  - name: class_task_field_text
    description: >
      Bodies of long-text field values, one row per distinct body of a source,
      addressed by `text_id`. `class_task_field_history` refers to a body by a
      `text_ref` value; this table is the only place its full text lives.
      Every producer contributes an arm through the `silver:class_task_field_text` tag.
    columns:
      - name: unique_key
        description: "Source and `text_id`."
        tests:
          - not_null
          - unique
      - name: insight_source_id
        description: "Source instance identifier."
        tests:
          - not_null
      - name: data_source
        description: "Source system discriminator (e.g. 'jira', 'youtrack')."
        tests:
          - not_null
      - name: text_id
        description: "Content address of the body: `lower(hex(sipHash128(content)))` (`task_text_id`), the same rule for every source, so identical bodies of one source share a row."
        tests:
          - not_null
      - name: content_form
        description: >
          How `content` is encoded: `adf_json` = an Atlassian Document Format
          document, as the Jira issue holds the current body; `rendered_text` =
          plain text, as the Jira changelog renders a body at that point in time
          (formatting, links and media flattened); `markdown` = the Markdown
          source the tracker stores, as YouTrack does. Consumers render the
          structured forms themselves.
        tests:
          - not_null
          - accepted_values:
              values: ['adf_json', 'rendered_text', 'markdown']
      - name: content
        description: "The full body, never truncated."

  - name: class_task_field_current_text
    description: >
      The current body of each long-text field of an issue: one row per
      (source, issue, field) whose value is not empty, naming the body in
      `class_task_field_text` by `text_id`. The history's newest reference can be
      a changelog rendering (Jira `rendered_text`); this row is the body the
      issue holds now (Jira `adf_json`, YouTrack `markdown`).
    columns:
      - name: unique_key
        description: "Source, issue and field."
        tests:
          - not_null
          - unique
      - name: insight_source_id
        tests:
          - not_null
      - name: data_source
        tests:
          - not_null
      - name: issue_id
        description: "Immutable source-native issue ID, the same `issue_id` as `class_task_field_history`. Never the readable key."
        tests:
          - not_null
      - name: field_id
        tests:
          - not_null
      - name: text_id
        description: "The body in `class_task_field_text`, joined on (`insight_source_id`, `data_source`, `text_id`)."
        tests:
          - not_null

  - name: class_task_references
    description: >
      Which issues an issue points at, and where each reference was found: one
      row per (source, issue, place, target). A place is a link of one type, one
      field, or one comment. A key written in text counts only when it resolves
      to an issue, or carries the prefix of a project the source syncs — then
      `target_id` is NULL. A deleted comment points at nothing, and an issue
      naming its own key is not a reference. "Which issues of project B does an
      issue of project A point at" filters `id_readable` and `target_key` by
      prefix.
    columns:
      - name: unique_key
        description: "Source, issue, `found_in`, `found_ref` and the target — its id when the key resolved, else the key as written."
        tests:
          - not_null
          - unique
      - name: insight_source_id
        tests:
          - not_null
      - name: data_source
        tests:
          - not_null
      - name: issue_id
        description: "Immutable source-native ID of the issue that points, scoped by insight_source_id."
        tests:
          - not_null
      - name: id_readable
        description: "The pointing issue's current key; display and project filtering only, never a join key."
        tests:
          - not_null
      - name: target_id
        description: "Immutable source-native ID of the issue pointed at; NULL when the key resolved to no issue the source knows."
      - name: target_key
        description: "The target's current key when it is known — so a moved issue reads under its new project — else the key as written."
        tests:
          - not_null
      - name: found_in
        description: "`link` — a structured link in `class_task_links`; `field` — a key written in a field value; `comment` — a key written in a live comment."
        tests:
          - not_null
          - accepted_values:
              values: ['link', 'field', 'comment']
      - name: found_ref
        description: "`link_type` for a link, `field_id` for a field, `comment_id` for a comment."
        tests:
          - not_null
      - name: found_kind
        description: >
          What kind of place held the key: `link`; `long_text` — a description or another rich-text field,
          read from its full body; `short_text` — any other field value as the tracker displays it (a summary,
          a single-line text, a label, an option); `comment`. A function of `found_in` and `found_ref`, kept as
          a column so a reader can rank sources without a field catalogue.
        tests:
          - not_null
          - accepted_values:
              values: ['link', 'long_text', 'short_text', 'comment']
      - name: first_seen_at
        description: >
          When the reference appeared: a link's earliest `valid_from`, the earliest field event whose value
          held the key, a comment's creation. A key added to a comment by an edit dates from the comment's
          creation, because comment bodies have no history.
        tests:
          - not_null
      - name: is_current
        description: "1 while the reference is there: an open link interval, a key in the field's current value, a live comment. 0 for a closed link or a key only an older field value held."
        tests:
          - not_null
          - accepted_values:
              values: [0, 1]
              quote: false

  - name: class_task_field_metadata
    description: "Unified task-tracker field catalog. Declares cardinality (`is_multi`) and whether the field has an opaque ID vs a string literal (`has_id`)."
    columns:
      - name: insight_source_id
        tests:
          - not_null
      - name: field_id
        tests:
          - not_null

  - name: class_task_comments
    description: "Unified issue comments from all task-tracker sources."
    columns:
      - name: insight_source_id
        tests:
          - not_null
      - name: comment_id
        tests:
          - not_null

  - name: class_task_worklogs
    description: "Unified issue worklogs from all task-tracker sources."
    columns:
      - name: insight_source_id
        tests:
          - not_null
      - name: worklog_id
        tests:
          - not_null
      - name: is_deleted
        description: "1 when the worklog was deleted at the source: an authoritative /worklog/deleted tombstone or a deleted/trashed parent issue. Gold consumers must filter ifNull(is_deleted, 0) = 0."

  - name: class_task_users
    description: "Unified task-tracker user directory (anchor for identity resolution)."
    columns:
      - name: insight_source_id
        tests:
          - not_null
      - name: user_id
        tests:
          - not_null

  - name: class_task_projects
    description: "Unified task-tracker project catalog."
    columns:
      - name: insight_source_id
        tests:
          - not_null
      - name: project_id
        tests:
          - not_null

  - name: class_task_sprints
    description: "Unified task-tracker sprints."
    columns:
      - name: insight_source_id
        tests:
          - not_null
      - name: sprint_id
        tests:
          - not_null

  - name: class_task_links
    description: >
      Links between work items as INTERVALS, one row per link occurrence: `valid_from` when it appeared,
      `valid_to` when it went away, NULL while it is still there. The links over a window are a range
      predicate — `valid_from < :to AND (valid_to IS NULL OR valid_to > :from)` — and the links at an
      instant are the same predicate with one point. A link removed and re-added is two rows, so
      `valid_from` is part of the key rather than a version of one row. Both directions are stored: a
      parent-child pair yields a `sub_issue` row on the parent and a `parent` row on the child.
    columns:
      - name: issue_id
        description: "Immutable source-native ID of the item owning the link, scoped by insight_source_id. NULL from a producer that does not yet carry it."
      - name: target_id
        description: "Immutable source-native ID of the target, scoped by insight_source_id and target_type. Never substitute target_readable when missing."
      - name: unique_key
        description: "Source, item, link type, target and `valid_from` — the occurrence, not the link."
        tests:
          - not_null
      - name: insight_source_id
        tests:
          - not_null
      - name: data_source
        description: "Vendor that recorded the link: `github` or `jira`."
        tests:
          - not_null
      - name: id_readable
        description: "The item the link belongs to, as the tracker addresses it (`owner/repo#12`)."
        tests:
          - not_null
      - name: link_type
        description: "parent | sub_issue | blocked_by | blocking | duplicate_of | connected | closed_by_pr."
        tests:
          - not_null
      - name: target_type
        description: "What sits at the other end: issue | pull_request."
      - name: target_readable
        description: "The other end, addressed the same way. Carries its own repository, because a link may cross repositories."
        tests:
          - not_null
      - name: valid_from
        description: "When the link appeared. A lower bound rather than a fact when `valid_from_known = 0`."
        tests:
          - not_null
      - name: valid_to
        description: "When it went away; NULL while it is still there."
      - name: valid_from_known
        description: >
          1 when the vendor stated the moment the link appeared. 0 when the link was already there before
          collection began, or is known only from successive observations — the interval is still usable,
          but its lower edge is a bound. Filtering these out drops the oldest links.
      - name: evidence
        description: >
          `event` — folded from the vendor's own add and remove events, exact to the second.
          `observation` — at least one edge is bounded by snapshots rather than stated by an event, so it is
          known only to a sync. A Jira interval opened by an event and closed because the issue's newest read
          no longer holds the link is `observation` only when the other issue was observable at that read.
          Omission during a visibility gap leaves the event-derived state unchanged.
        tests:
          - accepted_values:
              values: ['event', 'observation']
      - name: is_cross_repository
        description: "The two ends live in different repositories. Derived by comparing them, because only some event types report it."
      - name: added_by
        description: "Who created the link, where the vendor names an actor; NULL for an observed link or an addition that predates collection."
      - name: removed_by
        description: "Who removed it; NULL while the link is still there."
      - name: origin_event_id
        description: "The vendor event the interval was folded from; NULL for an observed interval."
      - name: collected_at
        description: "When the evidence behind this row was collected."

  - name: class_task_statuses
    description: "Unified, source-neutral status dimension. Maps each source status id to the reconciled lifecycle `status_category` (new/in_progress/done/undefined). Jira derives it from statusCategory; YouTrack from the State bundle `isResolved` flag. Gold detects a closed task via `status_category='done'` — never a localized status name (issue #1541)."
    columns:
      - name: insight_source_id
        tests:
          - not_null
      - name: status_id
        tests:
          - not_null
      - name: status_category
        description: "Reconciled lifecycle: new | in_progress | done | undefined."
        tests:
          - not_null
          - accepted_values:
              values: ['new', 'in_progress', 'done', 'undefined']

  - name: class_task_issuetypes
    description: "Unified, source-neutral issue-type dimension: the raw vendor type catalogue, one row per source issue type (id, display name, untranslated name). Carries no classification — gold resolves the issue kind from `config.field_value_map` at its own build, keyed by the type id, so an operator decision applies without a silver rebuild."
    columns:
      - name: insight_source_id
        tests:
          - not_null
      - name: issue_type_id
        tests:
          - not_null
      - name: issue_type_name
        description: "Type display name as the source reports it; the label Gold shows for the type dimension."
      - name: untranslated_name
        description: "Locale-independent type name where the source has one (Jira); NULL otherwise."
