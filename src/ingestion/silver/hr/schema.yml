version: 2

models:
  - name: class_hr_working_hours
    description: "Scheduled working hours per active employee from all HR sources"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - insight_tenant_id
            - email
    columns:
      - name: insight_tenant_id
        tests:
          - not_null
      - name: source_person_id
        description: "Source-specific employee ID"
        tests:
          - not_null
      - name: email
        description: "Work email — identity key for Gold layer joins"
        tests:
          - not_null
      - name: source
        description: "Source discriminator (bamboohr, workday, …)"
        tests:
          - not_null
      - name: working_hours_per_day
        description: "Scheduled working hours per working day"
        tests:
          - not_null
      - name: working_hours_per_week
        description: "Scheduled working hours per week"
        tests:
          - not_null

  - name: class_person_attribute_claims
    description: >
      Unified person-attribute claim history from all HR and directory
      sources. One row per (source account, field, transition): claim_action
      'set' records a non-empty value taking effect at observed_at, 'clear'
      records the source delivering an empty value. Claims are keyed by stable
      source account and deliberately carry no canonical person_id — account
      facts stay independent of person assignment, which is joined at query
      time. History starts at the first retained snapshot observation. A clear
      is emitted only from a delivered record; record absence from a sync
      never closes values (no sync-completeness signal exists).
    columns:
      - name: unique_key
        description: "{tenant}-{source_instance}-{source_type}-{account}-{field}-{observed_at_ms} per the project unique_key formula; the observation instant is the version axis"
        tests:
          - not_null
      - name: insight_tenant_id
        description: "Tenant isolation field"
        tests:
          - not_null
      - name: insight_source_type
        description: "Source system discriminator (bamboohr, workday, ms-entra, active-directory)"
        tests:
          - not_null
      - name: insight_source_id
        description: "Source instance identifier"
        tests:
          - not_null
      - name: source_account_id
        description: "Stable native source-account identifier"
        tests:
          - not_null
      - name: field_id
        description: >
          Source field key exactly as delivered (e.g. jobTitle,
          Supervisory_Organization, customFunctionalTeam). Fields from
          different source instances remain separate definitions downstream.
        tests:
          - not_null
      - name: value_id
        description: "Immutable source value identifier when the source exposes one; NULL for all current HR sources"
      - name: value_label
        description: "Exact source value; empty string on clear claims"
      - name: claim_action
        description: "set = value takes effect; clear = source emptied the field"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['set', 'clear']
      - name: observed_at
        description: "When this version was captured (snapshot _tracked_at)"
        tests:
          - not_null
      - name: ingested_at
        description: "Airbyte extraction time of the snapshot row that produced the claim"
        tests:
          - not_null
      - name: _version
        description: "toUnixTimestamp64Milli(observed_at) — deterministic per claim, drives RMT dedup and the per-instance incremental watermark"

  - name: class_hr_events
    description: "Unified HR events (leave, on-leave, etc.) from all HR sources"
    columns:
      - name: insight_tenant_id
        tests:
          - not_null
      - name: unique_key
        tests:
          - not_null
      - name: source_person_id
        description: "Source-specific employee ID"
        tests:
          - not_null
      - name: event_type
        description: "Normalised event type: leave"
        tests:
          - not_null
      - name: start_date
        tests:
          - not_null
      - name: end_date
        description: "Leave end date; NULL for open-ended leaves"
      - name: source
        tests:
          - not_null

  - name: class_focus_metrics
    description: >
      Daily pre-aggregation of focus_time_pct and dev_time_h per active employee.
      Joins class_collab_meeting_activity (Zoom + M365 Teams meetings) with class_hr_working_hours.
      One row per person per working day. Incremental with 3-day lookback for late events.
      Users without HR working hours data default to 8h/day.
    columns:
      - name: insight_tenant_id
        description: "Tenant isolation field"
        tests:
          - not_null
      - name: unique_key
        description: "tenant_id-email-day"
        tests:
          - not_null
          - unique
      - name: email
        description: "Employee work email (lowercased)"
        tests:
          - not_null
      - name: day
        description: "Calendar date of the activity"
        tests:
          - not_null
      - name: meetings_count
        description: "Number of Zoom meeting participation events on this day"
        tests:
          - not_null
      - name: meeting_hours
        description: "Total hours spent in meetings (sum of duration_seconds / 3600)"
        tests:
          - not_null
      - name: working_hours_per_day
        description: "Scheduled working hours from class_hr_working_hours; defaults to 8.0 if missing"
        tests:
          - not_null
      - name: focus_time_pct
        description: "100 - (meeting_hours / working_hours_per_day) * 100, capped [0, 100]"
        tests:
          - not_null
      - name: dev_time_h
        description: "working_hours_per_day - meeting_hours, capped at 0 minimum"
        tests:
          - not_null
