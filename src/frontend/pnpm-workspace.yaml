# Minimum number of minutes that must pass after a version is published before pnpm will install it.
# This applies to all dependencies, including transitive ones.
minimumReleaseAge: 10080

# First-party Constructor packages are built and reviewed in-house, so the
# quarantine above only delays picking up our own releases.
minimumReleaseAgeExclude:
  - '@gears-frontx/*'

# Save exact versions when installing dependencies.
saveExact: true

engineStrict: true

# Transitive pins for advisories with no fixed release from the direct dependency
# yet. exceljs 4.4.0 still asks for the vulnerable ranges.
