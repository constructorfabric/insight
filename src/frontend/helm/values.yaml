replicaCount: 1

podAnnotations: {}

image:
  repository: ghcr.io/constructorfabric/insight-frontend
  tag: "" # MUST be set by the operator. No `:latest` default.
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

# Standalone installs only. Do not enable together with the gateway's route
# on the same Gateway and host: both match PathPrefix "/", and the older
# route wins the Gateway API tie-break.
route:
  enabled: false
  parentRef:
    name: insight
    namespace: insight-infra
    # Target listener on the Gateway (e.g. https). Empty = all listeners.
    sectionName: ""
  host: ""
  annotations: {}

sentry:
  # Sentry origin the SPA posts to, e.g. "https://sentry.example.com".
  # Empty leaves it out of the CSP, which blocks every event.
  connectSrc: ""
  # DSN the SPA reads from /config.js at load. Empty disables reporting.
  dsn: ""

nav:
  # Navigation entries hidden on this install, read by the SPA from
  # /config.js. Typed paths, one per entry:
  #   - "zone:scorecard"                          (a rail zone)
  #   - "zone:aicost/item:idle-seats"             (a pane item)
  #   - "zone:directions/dir:sales"               (a whole direction)
  #   - "zone:directions/dir:dev/lens:git-output" (one lens, by URL slug)
  #   - "zone:person/section:git_output"          (a Person-zone section)
  #   - "metric:tasks.resolution_time"            (one metric, everywhere)
  #   - "metric:ai.*"                             (a whole metric family)
  # A metric path is not a menu entry: it gates the key itself, so the metric
  # reaches no tile, attention row, heatmap column, drilldown block or report
  # column, and no request asks for it.
  # Unknown paths are ignored (the browser console warns). Presentation
  # only — the API authorizes independently of what the menu shows.
  hide: []
  # Navigation entries this install marks as still in development — same
  # path forms as `hide`. They behave like readiness-marked entries in the
  # code: demoted to the "Planned" menu group and toggled by the viewer's
  # "Show planned sections" switch. A path in both lists is hidden.
  planned: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
