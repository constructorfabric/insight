replicaCount: 1

podAnnotations: {}

image:
  repository: ghcr.io/constructorfabric/insight-frontend
  tag: "" # MUST be set by the operator. No `:latest` default.
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

# Standalone installs only. Do not enable together with the gateway's route
# on the same Gateway and host: both match PathPrefix "/", and the older
# route wins the Gateway API tie-break.
route:
  enabled: false
  parentRef:
    name: insight
    namespace: insight-infra
    # Target listener on the Gateway (e.g. https). Empty = all listeners.
    sectionName: ""
  host: ""
  annotations: {}

sentry:
  # Sentry origin the SPA posts to, e.g. "https://sentry.example.com".
  # Empty leaves it out of the CSP, which blocks every event.
  connectSrc: ""
  # DSN the SPA reads from /config.js at load. Empty disables reporting.
  dsn: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
