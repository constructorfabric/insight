replicaCount: 1

podAnnotations: {}

image:
  repository: ghcr.io/constructorfabric/insight-frontend
  tag: "" # MUST be set by the operator. No `:latest` default.
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

route:
  enabled: false
  parentRef:
    name: insight
    namespace: insight-infra
  host: ""
  annotations: {}

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
