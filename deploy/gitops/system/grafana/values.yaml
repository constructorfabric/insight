##
## Grafana — observability UI for the L2 system layer (observability
## `bundled` mode). The only LGTM component with a web face.
##
## Chart: grafana/grafana   (https://grafana.github.io/helm-charts)
## Pin in Makefile: GRAFANA_VERSION
## Release: `grafana` in the infra namespace (inventory `namespaces.infra`,
## `insight-infra` by default).
##
## The `${NS_*}` placeholders below are the namespaces of the datasource
## releases, resolved by scripts/render-system-values.sh before helm reads
## the file (see system/README.md § Values layout).
##
## Per-env overrides go in environments/<env>/grafana-values.yaml
## (ingress host, OIDC, admin secret).
##
## Reach it (dev): kubectl -n insight-infra port-forward svc/grafana 3000:80
## Then Explore → Loki, or the provisioned dashboards in the Insight folder.
##

# No persistence: this Grafana is fully as-code — the Loki datasource and
# the dashboards below are provisioned from this values file, so an
# ephemeral grafana.db is the source-of-truth-friendly choice. It also
# avoids two problems a PVC caused on the reference cluster:
#   1. RWO PVC + RollingUpdate deadlock — a new pod can't mount the volume
#      the old one holds, so every dashboard change wedged the rollout.
#   2. "Datasource provisioning error: data source not found" — a persisted
#      datasource (provisioned before it had a uid) collides with the
#      uid-bearing provisioning on restart and crash-loops grafana.
# Anything worth keeping lives in git, not in grafana.db. The admin
# password is re-applied from the Secret on each start, so it stays stable.
# An env where people also author dashboards in the UI can keep them by
# enabling a PVC in its overlay — paired with Recreate, or problem 1 above
# returns (problem 2 cannot: every provisioned datasource now has a uid):
#   deploymentStrategy: { type: Recreate, rollingUpdate: null }
#   persistence: { enabled: true, size: 10Gi }
# (rollingUpdate: null is required on an existing install — server-side
# apply keeps the old rollingUpdate block otherwise, and the API forbids
# it alongside Recreate.)
persistence:
  enabled: false

# init-chown-data is moot without a PVC, but keep it off: some clusters'
# runtimes strip CAP_CHOWN from uid-0 containers, so the chart's chown init
# fails with EPERM and would wedge the rollout if ever re-enabled.
initChownData:
  enabled: false

# The ClickHouse SQL datasource plugin (#2888). Space-separated pin — the
# image's run.sh passes "id version" to `grafana cli plugins install`.
plugins:
  - grafana-clickhouse-datasource 4.21.1

# Password for the SELECT-only `grafana` ClickHouse user (#2888), provisioned
# by the app deploy hook (apply-ch-migrations -> provision-grafana-access.sh)
# from the insight-db-creds key `clickhouse-grafana-password`. Seal the SAME
# value here as `grafana-clickhouse-creds` (key CLICKHOUSE_GRAFANA_PASSWORD,
# ns insight-infra) — `make system-grafana` applies any
# environments/<env>/sealed-secrets/insight-infra/grafana*-sealedsecret.yaml.
# Optional: without it Grafana still runs, only the ClickHouse datasource
# fails to authenticate.
envFromSecrets:
  - name: grafana-clickhouse-creds
    optional: true

# Loki wired as the default datasource so Explore works out of the box,
# VictoriaMetrics as the PromQL datasource for metrics, Tempo as the trace
# store, ClickHouse as the direct-SQL datasource. Fixed uids so provisioned
# dashboards can reference them on any environment. Loki's `derivedFields`
# turn a `trace_id` in a JSON log line into a Tempo link (log → trace
# correlation).
# INVARIANT: helm REPLACES lists — a per-env overlay that touches
# `datasources` must restate every entry below, and the uids (`loki`, `vm`,
# `tempo`, `clickhouse`) must stay what they are or every provisioned
# dashboard panel goes dark. Overlays go through the same ${NS_*}
# substitution as this file, so restated entries keep the placeholders
# instead of hardcoding a namespace.
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.${NS_MONITORING}.svc.cluster.local:3100
        isDefault: true
        jsonData:
          maxLines: 1000
          # `$$` because datasource provisioning expands $VAR env refs —
          # Grafana needs to receive the literal `${__value.raw}`.
          derivedFields:
            - name: TraceID
              datasourceUid: tempo
              matcherRegex: '"trace_id"\s*:\s*"([0-9a-fA-F]+)"'
              url: '$${__value.raw}'
              urlDisplayLabel: Trace

      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo.${NS_MONITORING}.svc.cluster.local:3200
        isDefault: false

      - name: VictoriaMetrics
        uid: vm
        type: prometheus
        access: proxy
        url: http://victoriametrics-server.${NS_MONITORING}.svc.cluster.local:8428
        isDefault: false
        jsonData:
          timeInterval: "30s"
          httpMethod: POST

      # Direct SQL over the native protocol as the SELECT-only `grafana`
      # user (#2888). Single `$`: provisioning expands the env ref, which
      # envFromSecrets above injects from grafana-clickhouse-creds.
      - name: ClickHouse
        uid: clickhouse
        type: grafana-clickhouse-datasource
        access: proxy
        isDefault: false
        jsonData:
          host: clickhouse.${NS_INFRA}.svc.cluster.local
          port: 9000
          protocol: native
          secure: false
          username: grafana
        secureJsonData:
          password: $CLICKHOUSE_GRAFANA_PASSWORD

# ─── Dashboards as code ─────────────────────────────────────────────────
# Provisioned into the "Insight" folder. Sources: LogQL over the gateway
# access_log and pod logs, and PromQL over VictoriaMetrics (cAdvisor +
# kube-state-metrics, the services' http.server.request.duration histogram,
# and the gateway's nginx exporter — #2893).
# Deploy markers: every umbrella deploy runs the insight-post-upgrade hook
# pod; its log lines drive the dashboard annotations. The "deploy output"
# panel shows what scripts/push-deploy-log.sh ships ({job="deploy-insight"}).
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: insight
        orgId: 1
        folder: Insight
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/insight

dashboards:
  insight:
    insight-http:
      json: |
        {
          "uid": "insight-http",
          "title": "Insight · HTTP",
          "schemaVersion": 39,
          "time": {"from": "now-6h", "to": "now"},
          "refresh": "1m",
          "annotations": {"list": [
            {"name": "Deploys", "enable": true, "iconColor": "purple",
             "datasource": {"type": "loki", "uid": "loki"},
             "expr": "{namespace=\"insight\", pod=~\"insight-post-upgrade.*\"}"}
          ]},
          "panels": [
            {"id": 1, "type": "timeseries", "title": "Requests by status (rps)",
             "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
             "datasource": {"type": "loki", "uid": "loki"},
             "fieldConfig": {"defaults": {"unit": "reqps", "custom": {"drawStyle": "line", "fillOpacity": 10}}, "overrides": []},
             "options": {"legend": {"displayMode": "list", "placement": "bottom"}},
             "targets": [
               {"refId": "A", "legendFormat": "2xx", "expr": "sum(rate({namespace=\"insight\", container=\"api-gateway\"} |= \"access_log\" | logfmt | status=~\"2..\" [$__auto]))"},
               {"refId": "B", "legendFormat": "4xx", "expr": "sum(rate({namespace=\"insight\", container=\"api-gateway\"} |= \"access_log\" | logfmt | status=~\"4..\" [$__auto]))"},
               {"refId": "C", "legendFormat": "5xx", "expr": "sum(rate({namespace=\"insight\", container=\"api-gateway\"} |= \"access_log\" | logfmt | status=~\"5..\" [$__auto]))"}
             ]},
            {"id": 2, "type": "timeseries", "title": "2xx latency by route, p95 (ms)",
             "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
             "datasource": {"type": "loki", "uid": "loki"},
             "fieldConfig": {"defaults": {"unit": "ms", "custom": {"drawStyle": "line", "fillOpacity": 10}}, "overrides": []},
             "options": {"legend": {"displayMode": "list", "placement": "bottom"}},
             "targets": [
               {"refId": "A", "legendFormat": "{{route}}", "expr": "quantile_over_time(0.95, {namespace=\"insight\", container=\"api-gateway\"} |= \"access_log\" | logfmt | status=~\"2..\" | label_format route=`{{ regexReplaceAll \"(/[0-9]+|/[0-9a-fA-F-]{16,}|/[^/?]*%40[^/?]*)\" .uri \"/{id}\" }}` | unwrap duration_ms [$__auto]) by (route)"}
             ]},
            {"id": 3, "type": "timeseries", "title": "2xx latency, p50 / p99 (ms)",
             "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
             "datasource": {"type": "loki", "uid": "loki"},
             "fieldConfig": {"defaults": {"unit": "ms", "custom": {"drawStyle": "line", "fillOpacity": 10}}, "overrides": []},
             "options": {"legend": {"displayMode": "list", "placement": "bottom"}},
             "targets": [
               {"refId": "A", "legendFormat": "p50", "expr": "quantile_over_time(0.5, {namespace=\"insight\", container=\"api-gateway\"} |= \"access_log\" | logfmt | status=~\"2..\" | unwrap duration_ms [$__auto])"},
               {"refId": "B", "legendFormat": "p99", "expr": "quantile_over_time(0.99, {namespace=\"insight\", container=\"api-gateway\"} |= \"access_log\" | logfmt | status=~\"2..\" | unwrap duration_ms [$__auto])"}
             ]},
            {"id": 4, "type": "logs", "title": "4xx / 5xx responses",
             "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
             "datasource": {"type": "loki", "uid": "loki"},
             "options": {"showTime": true, "wrapLogMessage": true, "sortOrder": "Descending"},
             "targets": [
               {"refId": "A", "expr": "{namespace=\"insight\", container=\"api-gateway\"} |= \"access_log\" | logfmt | status=~\"[45]..\""}
             ]},
            {"id": 6, "type": "timeseries", "title": "4xx by status code (count)",
             "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16},
             "datasource": {"type": "loki", "uid": "loki"},
             "fieldConfig": {"defaults": {"unit": "short", "custom": {"drawStyle": "bars", "fillOpacity": 60, "stacking": {"mode": "normal"}}}, "overrides": []},
             "options": {"legend": {"displayMode": "table", "placement": "right", "calcs": ["sum"]}},
             "targets": [
               {"refId": "A", "legendFormat": "{{status}}", "expr": "sum by (status) (count_over_time({namespace=\"insight\", container=\"api-gateway\"} |= \"access_log\" | logfmt | status=~\"4..\" [$__auto]))"}
             ]},
            {"id": 7, "type": "timeseries", "title": "5xx by status code (count)",
             "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16},
             "datasource": {"type": "loki", "uid": "loki"},
             "fieldConfig": {"defaults": {"unit": "short", "custom": {"drawStyle": "bars", "fillOpacity": 60, "stacking": {"mode": "normal"}}}, "overrides": []},
             "options": {"legend": {"displayMode": "table", "placement": "right", "calcs": ["sum"]}},
             "targets": [
               {"refId": "A", "legendFormat": "{{status}}", "expr": "sum by (status) (count_over_time({namespace=\"insight\", container=\"api-gateway\"} |= \"access_log\" | logfmt | status=~\"5..\" [$__auto]))"}
             ]},
            {"id": 5, "type": "logs", "title": "Service errors (gateway / analytics / identity-resolution)",
             "gridPos": {"h": 8, "w": 24, "x": 0, "y": 24},
             "datasource": {"type": "loki", "uid": "loki"},
             "options": {"showTime": true, "wrapLogMessage": true, "sortOrder": "Descending"},
             "targets": [
               {"refId": "A", "expr": "{namespace=\"insight\", container=~\"api-gateway|analytics|identity-resolution\"} |= \"ERROR\""}
             ]}
          ]
        }
    insight-ingestion:
      json: |
        {
          "uid": "insight-ingestion",
          "title": "Insight · Ingestion & deploys",
          "schemaVersion": 39,
          "time": {"from": "now-24h", "to": "now"},
          "refresh": "1m",
          "annotations": {"list": [
            {"name": "Deploys", "enable": true, "iconColor": "purple",
             "datasource": {"type": "loki", "uid": "loki"},
             "expr": "{namespace=\"insight\", pod=~\"insight-post-upgrade.*\"}"}
          ]},
          "panels": [
            {"id": 1, "type": "logs", "title": "Reconcile",
             "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
             "datasource": {"type": "loki", "uid": "loki"},
             "options": {"showTime": true, "wrapLogMessage": true, "sortOrder": "Descending"},
             "targets": [{"refId": "A", "expr": "{namespace=\"insight\", pod=~\".*reconcile.*\"}"}]},
            {"id": 2, "type": "logs", "title": "Airbyte syncs (trigger / poll)",
             "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
             "datasource": {"type": "loki", "uid": "loki"},
             "options": {"showTime": true, "wrapLogMessage": true, "sortOrder": "Descending"},
             "targets": [{"refId": "A", "expr": "{namespace=\"insight\", pod=~\".*-sync-.*\"}"}]},
            {"id": 3, "type": "logs", "title": "dbt",
             "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
             "datasource": {"type": "loki", "uid": "loki"},
             "options": {"showTime": true, "wrapLogMessage": true, "sortOrder": "Descending"},
             "targets": [{"refId": "A", "expr": "{namespace=\"insight\", pod=~\".*dbt.*\"}"}]},
            {"id": 4, "type": "logs", "title": "Deploy: hook pods (migrations, configuration)",
             "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
             "datasource": {"type": "loki", "uid": "loki"},
             "options": {"showTime": true, "wrapLogMessage": true, "sortOrder": "Descending"},
             "targets": [{"refId": "A", "expr": "{namespace=\"insight\", pod=~\"insight-(configuration|post-install|post-upgrade).*\"}"}]},
            {"id": 5, "type": "logs", "title": "Deploy: helm/make output (push-deploy-log.sh)",
             "gridPos": {"h": 8, "w": 24, "x": 0, "y": 16},
             "datasource": {"type": "loki", "uid": "loki"},
             "options": {"showTime": true, "wrapLogMessage": true, "sortOrder": "Ascending"},
             "targets": [{"refId": "A", "expr": "{job=\"deploy-insight\"}"}]}
          ]
        }
    insight-services:
      json: |
        {
          "uid": "insight-services",
          "title": "Insight · Service health",
          "schemaVersion": 39,
          "time": {"from": "now-6h", "to": "now"},
          "refresh": "1m",
          "annotations": {"list": [
            {"name": "Deploys", "enable": true, "iconColor": "purple",
             "datasource": {"type": "loki", "uid": "loki"},
             "expr": "{namespace=\"insight\", pod=~\"insight-post-upgrade.*\"}"}
          ]},
          "panels": [
            {"id": 1, "type": "timeseries", "title": "CPU by service (cores)",
             "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
             "datasource": {"type": "prometheus", "uid": "vm"},
             "fieldConfig": {"defaults": {"unit": "short", "custom": {"drawStyle": "line", "fillOpacity": 10}}, "overrides": []},
             "options": {"legend": {"displayMode": "list", "placement": "bottom"}},
             "targets": [
               {"refId": "A", "legendFormat": "{{container}}", "expr": "sum by (container) (rate(container_cpu_usage_seconds_total{namespace=\"insight\", container=~\"gateway|authenticator|keycloak|analytics|identity-resolution|previews|git-cli-proxy|frontend\"}[$__rate_interval]))"}
             ]},
            {"id": 2, "type": "timeseries", "title": "Memory by service (working set)",
             "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
             "datasource": {"type": "prometheus", "uid": "vm"},
             "fieldConfig": {"defaults": {"unit": "bytes", "custom": {"drawStyle": "line", "fillOpacity": 10}}, "overrides": []},
             "options": {"legend": {"displayMode": "list", "placement": "bottom"}},
             "targets": [
               {"refId": "A", "legendFormat": "{{container}}", "expr": "sum by (container) (container_memory_working_set_bytes{namespace=\"insight\", container=~\"gateway|authenticator|keycloak|analytics|identity-resolution|previews|git-cli-proxy|frontend\"})"}
             ]},
            {"id": 3, "type": "timeseries", "title": "Container restarts",
             "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
             "datasource": {"type": "prometheus", "uid": "vm"},
             "fieldConfig": {"defaults": {"unit": "short", "custom": {"drawStyle": "bars", "fillOpacity": 60, "stacking": {"mode": "normal"}}}, "overrides": []},
             "options": {"legend": {"displayMode": "table", "placement": "right", "calcs": ["sum"]}},
             "targets": [
               {"refId": "A", "legendFormat": "{{container}}", "expr": "sum by (container) (increase(kube_pod_container_status_restarts_total{namespace=\"insight\"}[$__rate_interval])) > 0"}
             ]},
            {"id": 4, "type": "timeseries", "title": "Ready vs desired replicas",
             "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
             "datasource": {"type": "prometheus", "uid": "vm"},
             "fieldConfig": {"defaults": {"unit": "short", "min": 0, "custom": {"drawStyle": "line", "fillOpacity": 0}}, "overrides": []},
             "options": {"legend": {"displayMode": "list", "placement": "bottom"}},
             "targets": [
               {"refId": "A", "legendFormat": "{{deployment}} ready", "expr": "sum by (deployment) (kube_deployment_status_replicas_ready{namespace=\"insight\"})"},
               {"refId": "B", "legendFormat": "{{deployment}} desired", "expr": "sum by (deployment) (kube_deployment_spec_replicas{namespace=\"insight\"})"}
             ]},
            {"id": 5, "type": "timeseries", "title": "Unready pods",
             "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16},
             "datasource": {"type": "prometheus", "uid": "vm"},
             "fieldConfig": {"defaults": {"unit": "short", "min": 0, "custom": {"drawStyle": "line", "fillOpacity": 10}}, "overrides": []},
             "options": {"legend": {"displayMode": "list", "placement": "bottom"}},
             "targets": [
               {"refId": "A", "legendFormat": "{{pod}}", "expr": "kube_pod_status_ready{namespace=\"insight\", condition=\"false\"} == 1"}
             ]},
            {"id": 6, "type": "timeseries", "title": "OOM kills / abnormal terminations",
             "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16},
             "datasource": {"type": "prometheus", "uid": "vm"},
             "fieldConfig": {"defaults": {"unit": "short", "custom": {"drawStyle": "bars", "fillOpacity": 60, "stacking": {"mode": "normal"}}}, "overrides": []},
             "options": {"legend": {"displayMode": "table", "placement": "right", "calcs": ["sum"]}},
             "targets": [
               {"refId": "A", "legendFormat": "{{container}} {{reason}}", "expr": "sum by (container, reason) (kube_pod_container_status_last_terminated_reason{namespace=\"insight\", reason!=\"Completed\"})"}
             ]}
          ]
        }
    insight-red:
      json: |
        {
          "uid": "insight-red",
          "title": "Insight · RED by service",
          "schemaVersion": 39,
          "time": {"from": "now-6h", "to": "now"},
          "refresh": "1m",
          "annotations": {"list": [
            {"name": "Deploys", "enable": true, "iconColor": "purple",
             "datasource": {"type": "loki", "uid": "loki"},
             "expr": "{namespace=\"insight\", pod=~\"insight-post-upgrade.*\"}"}
          ]},
          "panels": [
            {"id": 1, "type": "timeseries", "title": "Request rate by service",
             "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
             "datasource": {"type": "prometheus", "uid": "vm"},
             "fieldConfig": {"defaults": {"unit": "reqps", "custom": {"drawStyle": "line", "fillOpacity": 10}}, "overrides": []},
             "options": {"legend": {"displayMode": "list", "placement": "bottom"}},
             "targets": [
               {"refId": "A", "legendFormat": "{{job}}", "expr": "sum by (job) (rate(http_server_request_duration_seconds_count[$__rate_interval]))"}
             ]},
            {"id": 2, "type": "timeseries", "title": "Error ratio by service (5xx, %)",
             "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
             "datasource": {"type": "prometheus", "uid": "vm"},
             "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "custom": {"drawStyle": "line", "fillOpacity": 10}}, "overrides": []},
             "options": {"legend": {"displayMode": "list", "placement": "bottom"}},
             "targets": [
               {"refId": "A", "legendFormat": "{{job}}", "expr": "100 * sum by (job) (rate(http_server_request_duration_seconds_count{http_response_status_code=~\"5..\"}[$__rate_interval])) / sum by (job) (rate(http_server_request_duration_seconds_count[$__rate_interval]))"}
             ]},
            {"id": 3, "type": "timeseries", "title": "Duration p50 / p99 by service",
             "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
             "datasource": {"type": "prometheus", "uid": "vm"},
             "fieldConfig": {"defaults": {"unit": "s", "custom": {"drawStyle": "line", "fillOpacity": 10}}, "overrides": []},
             "options": {"legend": {"displayMode": "list", "placement": "bottom"}},
             "targets": [
               {"refId": "A", "legendFormat": "{{job}} p50", "expr": "histogram_quantile(0.5, sum by (le, job) (rate(http_server_request_duration_seconds_bucket[$__rate_interval])))"},
               {"refId": "B", "legendFormat": "{{job}} p99", "expr": "histogram_quantile(0.99, sum by (le, job) (rate(http_server_request_duration_seconds_bucket[$__rate_interval])))"}
             ]},
            {"id": 4, "type": "timeseries", "title": "Duration p95 by route",
             "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
             "datasource": {"type": "prometheus", "uid": "vm"},
             "fieldConfig": {"defaults": {"unit": "s", "custom": {"drawStyle": "line", "fillOpacity": 10}}, "overrides": []},
             "options": {"legend": {"displayMode": "list", "placement": "bottom"}},
             "targets": [
               {"refId": "A", "legendFormat": "{{job}} {{http_route}}", "expr": "histogram_quantile(0.95, sum by (le, job, http_route) (rate(http_server_request_duration_seconds_bucket[$__rate_interval])))"}
             ]},
            {"id": 5, "type": "timeseries", "title": "Request rate by route (top 10)",
             "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16},
             "datasource": {"type": "prometheus", "uid": "vm"},
             "fieldConfig": {"defaults": {"unit": "reqps", "custom": {"drawStyle": "line", "fillOpacity": 10}}, "overrides": []},
             "options": {"legend": {"displayMode": "table", "placement": "right", "calcs": ["mean"]}},
             "targets": [
               {"refId": "A", "legendFormat": "{{job}} {{http_route}}", "expr": "topk(10, sum by (job, http_route) (rate(http_server_request_duration_seconds_count[$__rate_interval])))"}
             ]},
            {"id": 6, "type": "timeseries", "title": "Error rate by route (4xx / 5xx)",
             "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16},
             "datasource": {"type": "prometheus", "uid": "vm"},
             "fieldConfig": {"defaults": {"unit": "reqps", "custom": {"drawStyle": "line", "fillOpacity": 10}}, "overrides": []},
             "options": {"legend": {"displayMode": "list", "placement": "bottom"}},
             "targets": [
               {"refId": "A", "legendFormat": "{{job}} {{http_route}} {{http_response_status_code}}", "expr": "sum by (job, http_route, http_response_status_code) (rate(http_server_request_duration_seconds_count{http_response_status_code=~\"[45]..\"}[$__rate_interval])) > 0"}
             ]}
          ]
        }
    insight-gateway:
      json: |
        {
          "uid": "insight-gateway",
          "title": "Insight · Gateway traffic",
          "schemaVersion": 39,
          "time": {"from": "now-6h", "to": "now"},
          "refresh": "1m",
          "annotations": {"list": [
            {"name": "Deploys", "enable": true, "iconColor": "purple",
             "datasource": {"type": "loki", "uid": "loki"},
             "expr": "{namespace=\"insight\", pod=~\"insight-post-upgrade.*\"}"}
          ]},
          "panels": [
            {"id": 1, "type": "timeseries", "title": "Request rate (nginx)",
             "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
             "datasource": {"type": "prometheus", "uid": "vm"},
             "fieldConfig": {"defaults": {"unit": "reqps", "custom": {"drawStyle": "line", "fillOpacity": 10}}, "overrides": []},
             "options": {"legend": {"displayMode": "list", "placement": "bottom"}},
             "targets": [
               {"refId": "A", "legendFormat": "{{pod}}", "expr": "sum by (pod) (rate(nginx_http_requests_total{job=\"gateway-nginx\"}[$__rate_interval]))"}
             ]},
            {"id": 2, "type": "timeseries", "title": "Proxied responses by status class (rps)",
             "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
             "datasource": {"type": "prometheus", "uid": "vm"},
             "fieldConfig": {"defaults": {"unit": "reqps", "custom": {"drawStyle": "line", "fillOpacity": 10}}, "overrides": []},
             "options": {"legend": {"displayMode": "list", "placement": "bottom"}},
             "targets": [
               {"refId": "A", "legendFormat": "{{status_class}}", "expr": "sum by (status_class) (label_replace(rate(http_server_request_duration_seconds_count[$__rate_interval]), \"status_class\", \"${1}xx\", \"http_response_status_code\", \"([0-9])..\"))"}
             ]},
            {"id": 3, "type": "timeseries", "title": "Connections",
             "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
             "datasource": {"type": "prometheus", "uid": "vm"},
             "fieldConfig": {"defaults": {"unit": "short", "min": 0, "custom": {"drawStyle": "line", "fillOpacity": 10}}, "overrides": []},
             "options": {"legend": {"displayMode": "list", "placement": "bottom"}},
             "targets": [
               {"refId": "A", "legendFormat": "{{pod}} active", "expr": "nginx_connections_active{job=\"gateway-nginx\"}"},
               {"refId": "B", "legendFormat": "{{pod}} reading", "expr": "nginx_connections_reading{job=\"gateway-nginx\"}"},
               {"refId": "C", "legendFormat": "{{pod}} writing", "expr": "nginx_connections_writing{job=\"gateway-nginx\"}"},
               {"refId": "D", "legendFormat": "{{pod}} waiting", "expr": "nginx_connections_waiting{job=\"gateway-nginx\"}"}
             ]},
            {"id": 4, "type": "timeseries", "title": "Connections accepted vs handled (per second)",
             "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
             "datasource": {"type": "prometheus", "uid": "vm"},
             "fieldConfig": {"defaults": {"unit": "cps", "min": 0, "custom": {"drawStyle": "line", "fillOpacity": 10}}, "overrides": []},
             "options": {"legend": {"displayMode": "list", "placement": "bottom"}},
             "targets": [
               {"refId": "A", "legendFormat": "{{pod}} accepted", "expr": "rate(nginx_connections_accepted{job=\"gateway-nginx\"}[$__rate_interval])"},
               {"refId": "B", "legendFormat": "{{pod}} handled", "expr": "rate(nginx_connections_handled{job=\"gateway-nginx\"}[$__rate_interval])"}
             ]},
            {"id": 5, "type": "stat", "title": "Exporter up",
             "gridPos": {"h": 4, "w": 12, "x": 0, "y": 16},
             "datasource": {"type": "prometheus", "uid": "vm"},
             "fieldConfig": {"defaults": {"unit": "short", "mappings": [
               {"type": "value", "options": {"0": {"text": "down", "color": "red"}, "1": {"text": "up", "color": "green"}}}
             ]}, "overrides": []},
             "options": {"colorMode": "background", "reduceOptions": {"calcs": ["lastNotNull"]}},
             "targets": [
               {"refId": "A", "legendFormat": "{{pod}}", "expr": "nginx_up{job=\"gateway-nginx\"}"}
             ]}
          ]
        }

# Admin credentials. For anything past a throwaway PoC, seal a Secret named
# `grafana-creds` (keys: admin-user, admin-password) — `make system-grafana`
# applies any environments/<env>/sealed-secrets/insight-infra/grafana*-sealedsecret.yaml
# via the optional-secrets helper. Until then the chart generates a random
# admin password into the `grafana` Secret:
#   kubectl -n insight-infra get secret grafana -o jsonpath='{.data.admin-password}' | base64 -d
# admin:
#   existingSecret: grafana-creds
#   userKey: admin-user
#   passwordKey: admin-password

# Per-env overlay turns this on with the real host + TLS (mirrors the
# api-gateway ingress pattern). Off in the shared baseline.
ingress:
  enabled: false

service:
  type: ClusterIP

# OIDC SSO via the existing `insight-oidc` app is a per-env overlay concern
# (issuer/clientId differ per cluster) — see environments/<env>/grafana-values.yaml.
# grafana.ini:
#   auth.generic_oauth:
#     enabled: true
#     ...
