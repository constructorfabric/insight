##
## Grafana Alloy — telemetry collector for the L2 system layer
## (observability `bundled` mode). Two pipelines:
##   logs: node-local pod stdout → Loki (DaemonSet tail, below);
##   OTLP: services push to alloy:4317 (gRPC) / 4318 (HTTP) — metrics
##         remote-write to VictoriaMetrics, traces forward to Tempo.
## The umbrella's `global.observability.otlp.endpoint` points here when the
## bundled stack is on.
##
## Chart: grafana/alloy   (https://grafana.github.io/helm-charts)
## Pin in Makefile: ALLOY_VERSION
## Release: `alloy` in the infra namespace (inventory `namespaces.infra`,
## `insight-infra` by default).
##
## The `${NS_*}` placeholders below are the namespaces of the releases this
## config pushes to, resolved by scripts/render-system-values.sh before helm
## reads the file (see system/README.md § Values layout).
##
## Per-env overrides go in environments/<env>/alloy-values.yaml.
##
## Runs as a DaemonSet: one agent per node, tails every pod's
## stdout/stderr and ships to Loki. NO per-pod sidecars, NO changes in the
## app services — they only need to write to stdout (JSON is parsed below).
##
## NOTE: this collects EVERYTHING on the node, including the chatty
## `namespace=airbyte` sync pods. That is intentional for the first step
## ("see at least some logs from Airbyte and dbt"); scope or shorten
## retention per-namespace later via Loki limits + a relabel drop here.
##

controller:
  type: daemonset

alloy:
  # Mounts /var/log + the container runtime log dir so the DaemonSet can
  # read pod stdout. The chart wires the hostPath mounts for daemonset mode.
  mounts:
    varlog: true
  # OTLP listeners, added to both the container and the chart's ClusterIP
  # Service — `alloy.<infra-ns>.svc.cluster.local:4317/4318` is the
  # stable endpoint services export to. The Service spans every DaemonSet
  # pod; any node's agent accepts and routes the payload.
  extraPorts:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
      appProtocol: h2c
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
  configMap:
    content: |-
      // ── Discover pods scheduled on THIS node ───────────────────────────
      discovery.kubernetes "pods" {
        role = "pod"
      }

      // ── Promote a few low-cardinality labels; map the k8s component
      //    label (app.kubernetes.io/component) → `component` so reconcile /
      //    airbyte-sync / dbt separate cleanly in Grafana. Do NOT label by
      //    anything high-cardinality (trace_id, run_id) — keep those in the
      //    log body and filter with `| json`.
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component"]
          target_label  = "component"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.process.parse.receiver]
      }

      // ── Parse OUR structured JSON to promote `level` to a label.
      //    Non-JSON lines (raw Airbyte / dbt output) fall through the
      //    stage untouched — they still arrive in Loki, just without a
      //    `level` label.
      loki.process "parse" {
        stage.json {
          expressions = { level = "level" }
        }
        stage.labels {
          values = { level = "" }
        }
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.${NS_MONITORING}.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

      // ── OTLP entry point for the app services (umbrella
      //    `global.observability.otlp.endpoint` → alloy:4317). Metrics go to
      //    VictoriaMetrics, traces to Tempo. The logs signal is NOT routed:
      //    logs reach Loki through the stdout tail above, and routing both
      //    would double every line.
      otelcol.receiver.otlp "services" {
        grpc {
          endpoint = "0.0.0.0:4317"
        }
        http {
          endpoint = "0.0.0.0:4318"
        }
        output {
          metrics = [otelcol.exporter.prometheus.to_victoriametrics.input]
          traces  = [otelcol.exporter.otlp.to_tempo.input]
        }
      }

      otelcol.exporter.prometheus "to_victoriametrics" {
        forward_to = [prometheus.remote_write.victoriametrics.receiver]
      }

      prometheus.remote_write "victoriametrics" {
        endpoint {
          url = "http://victoriametrics-server.${NS_MONITORING}.svc.cluster.local:8428/api/v1/write"
        }
      }

      otelcol.exporter.otlp "to_tempo" {
        client {
          endpoint = "tempo.${NS_MONITORING}.svc.cluster.local:4317"
          tls {
            // In-cluster hop; Tempo's ingest is plaintext.
            insecure = true
          }
        }
      }
