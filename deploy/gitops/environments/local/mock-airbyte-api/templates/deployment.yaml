apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: {{ .Release.Name }}
          image: {{ required "image is required (rebuilt toolbox image)" .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          command: [python3, /ingestion/tools/mock-airbyte-api/server.py]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: MOCK_HOST
              value: "0.0.0.0"
            - name: MOCK_PORT
              value: "8080"
            - name: MOCK_JOURNAL_RETENTION
              value: {{ required "journalRetention is required" .Values.journalRetention | quote }}
            - name: MOCK_AIRBYTE_UPSTREAM
              value: {{ required "upstream is required (direct Airbyte origin)" .Values.upstream | quote }}
            - name: MOCK_UPSTREAM_TIMEOUT
              value: {{ required "upstreamTimeout is required" .Values.upstreamTimeout | quote }}
            - name: MOCK_CONTROL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-auth
                  key: control_token
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
