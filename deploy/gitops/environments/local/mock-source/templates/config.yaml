apiVersion: v1
kind: ConfigMap
metadata:
  name: mock-source-scenarios
data:
  scenarios.json: |
{{ .Files.Get "scenarios.json" | indent 4 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: mock-source-auth
type: Opaque
stringData:
  api_token: {{ required "apiToken is required" .Values.apiToken | quote }}
  control_token: {{ required "controlToken is required" .Values.controlToken | quote }}
{{- range $instance := list "mock-a" "mock-b" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $instance }}
  labels:
    app.kubernetes.io/part-of: insight
  annotations:
    insight.cyberfabric.com/connector: mock
    insight.cyberfabric.com/source-id: {{ $instance }}
type: Opaque
stringData:
  base_url: {{ printf "http://mock-source.%s.svc.cluster.local:8080/instances/%s" $.Release.Namespace $instance | quote }}
  api_token: {{ required "apiToken is required" $.Values.apiToken | quote }}
{{- end }}
