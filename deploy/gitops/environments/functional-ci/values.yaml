credentials:
  deploymentMode: gitops
  autoGenerate: false

global:
  storageClass: local-path
  tenantDefaultId: "00000000-df51-5b42-9538-d2b56b7ee953"

clickhouse:
  host: clickhouse.insight-infra.svc.cluster.local
  port: 8123
  database: insight
  username: insight

mariadb:
  host: mariadb.insight-infra.svc.cluster.local
  port: 3306
  database: insight
  username: insight

redis:
  host: redis-master.insight-infra.svc.cluster.local
  port: 6379

redpanda:
  brokers: "redpanda-disabled:9093"

ingestion:
  templates:
    enabled: false
  dataQuality:
    enabled: false

gateway:
  replicaCount: 1
  ingress:
    enabled: true

authenticator:
  replicaCount: 1
  tlsDiscovery:
    enabled: true
    issuerRef:
      name: local-ca
      kind: ClusterIssuer
  # IdP = the in-stack Keycloak (below). No browser participates in this
  # smoke, so the issuer is the cluster-internal Service URL. clientSecret is
  # the dev secret the realm generator bakes in; not sensitive.
  oidc:
    issuerUrl: 'http://{{ .Release.Name }}-keycloak.{{ .Release.Namespace }}.svc.cluster.local:8085/kc/realms/insight'
    clientId: "insight-authenticator"
    clientSecret: "insight-authenticator-dev-secret"
    redirectUri: "http://localhost/auth/callback"
    # Realm users' `sub` is their roster uuid; persons-seed fixtures key
    # their id rows on this source_type.
    sourceType: "keycloak"
    externalIdClaim: "sub"

# `hostname` is the advertised issuer base; no ingress here, so the concrete
# Service FQDN (the keycloak-realm recipe reads it raw — no tpl string).
keycloak:
  deploy: true
  hostname: 'http://insight-keycloak.insight.svc.cluster.local:8085/kc'
  admin:
    existingSecret: insight-keycloak-config # CI admin/admin (keycloak-realm target)
  database:
    host: mariadb.insight-infra.svc.cluster.local
    username: insight
    passwordSecret: {name: insight-db-creds, key: mariadb-password}

keycloakConfig:
  enabled: true
  # The roster realm is generated JSON (keycloak-realm target).
  filesLocations: "/config/*.yaml,/config/*.json"
  # In-cluster hop over plain http — ephemeral CI cluster only.
  url: 'http://{{ .Release.Name }}-keycloak:8085/kc'
  allowInsecureUrl: true
  extraEnv:
    - name: KEYCLOAK_USER
      valueFrom:
        secretKeyRef: {name: insight-keycloak-config, key: username}
    - name: KEYCLOAK_PASSWORD
      valueFrom:
        secretKeyRef: {name: insight-keycloak-config, key: password}

analytics:
  replicaCount: 1

# The authenticator's login-bootstrap resolve (GET /internal/persons/
# by-external-id / by-email-override) lives on identity-resolution
# (constructorfabric/insight#1960), so it must be deployed here — the
# authenticator talks to it unconditionally
# (deploy/gitops/scripts/compose-app-secrets.sh enforces this at apply time).
identityResolution:
  deploy: true
