credentials:
  deploymentMode: gitops
  autoGenerate: false

global:
  storageClass: local-path
  tenantDefaultId: "00000000-df51-5b42-9538-d2b56b7ee953"

clickhouse:
  host: clickhouse.insight-infra.svc.cluster.local
  port: 8123
  database: insight
  username: insight

mariadb:
  host: mariadb.insight-infra.svc.cluster.local
  port: 3306
  database: insight
  username: insight

redis:
  host: redis-master.insight-infra.svc.cluster.local
  port: 6379

redpanda:
  brokers: "redpanda-disabled:9093"

ingestion:
  templates:
    enabled: false
  dataQuality:
    enabled: false

gateway:
  replicaCount: 1
  ingress:
    enabled: true

authenticator:
  replicaCount: 1
  tlsDiscovery:
    enabled: true
    issuerRef:
      name: local-ca
      kind: ClusterIssuer
  oidc:
    issuerUrl: 'http://{{ .Release.Name }}-fakeidp.{{ .Release.Namespace }}.svc.cluster.local:8084'
    clientId: "insight-authenticator"
    redirectUri: "http://localhost/auth/callback"
    # fakeidp's `sub` claim IS the stable per-user id (see users.yaml) — no
    # real connector backs it, but the persons-seed fixtures used in this
    # environment key their `value_type='id'` rows on this made-up source_type.
    sourceType: "fakeidp"

fakeidp:
  deploy: true
  issuer: 'http://{{ .Release.Name }}-fakeidp.{{ .Release.Namespace }}.svc.cluster.local:8084'
  devUserEmail: "dev@company.nonpresent"

analytics:
  replicaCount: 1

identityResolution:
  deploy: true

# The authenticator's login-bootstrap resolve (GET /internal/persons/
# by-external-id / by-email-override) is Rust-only — the frozen .NET
# `identity` twin above never gained it (constructorfabric/insight#1960) — so
# identity-resolution must ALSO be deployed here, and the authenticator talks
# to it unconditionally (deploy/gitops/scripts/compose-app-secrets.sh enforces
# this at apply time regardless of what `.identityUrl` — analytics' own
# .NET<->Rust switch — is set to).
identityResolution:
  deploy: true
