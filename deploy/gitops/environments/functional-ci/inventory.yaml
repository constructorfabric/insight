##
## GitHub Actions functional K3s smoke environment.
##
## This committed env keeps .github/workflows/functional-k3s.yml small while
## still exercising the deploy/gitops Makefile path in CI.
##

kubeContext: k3d-insight-functional
protected: false

namespaces:
  services: insight
  infra: insight-infra

release: insight

deploy:
  # NO `--atomic`. The cluster is created and destroyed by the same job, so
  # there is no previous revision worth rolling back to — the rollback only
  # uninstalls the release, taking the pods and hook Jobs that hold the reason
  # it failed with it, minutes before the diagnostics step runs.
  atomic: false

bootstrap:
  namespaces: true
  # The edge every stand runs: the chart expresses it as an HTTPRoute, so a
  # cluster without the controller and its Gateway API CRDs cannot serve the
  # release it just installed. Bootstrap installs this before cert-manager,
  # whose gateway-shim needs those CRDs to start.
  envoyGateway: true
  # The authenticator's tlsDiscovery front (values.yaml) asks cert-manager for
  # its authn-tls leaf, so the controller and its CRDs have to be here.
  certManager: true
  sealedSecrets: true

system:
  mariadb: true
  clickhouse: true
  redis: true
  redpanda: false
  redpandaConsole: false
  airbyte: false
  argoWorkflows: false
  victoriametrics: false
  loki: false
  alloy: false
  grafana: false

secrets:
  infra:
    - {name: mariadb-creds, enabled: true}
    - {name: clickhouse-creds, enabled: true}
    - {name: redis-creds, enabled: true}
  services:
    - {name: insight-db-creds, enabled: true}
    # Minted per job by the workflow's sealing step — the chart supplies no
    # signing key and the authenticator will not start without one.
    - {name: insight-authenticator-signing-keys, enabled: true}
    - {name: insight-oidc, enabled: false}
