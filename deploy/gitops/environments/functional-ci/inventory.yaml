##
## GitHub Actions functional K3s smoke environment.
##
## This committed env keeps .github/workflows/functional-k3s.yml small while
## still exercising the deploy/gitops Makefile path in CI.
##

kubeContext: k3d-insight-functional
protected: false

namespaces:
  services: insight
  infra: insight-infra

release: insight

bootstrap:
  namespaces: true
  envoyGateway: false
  # The authenticator's tlsDiscovery front (values.yaml) asks cert-manager for
  # its authn-tls leaf, so the controller and its CRDs have to be here.
  certManager: true
  # No Gateway API CRDs on this cluster (envoyGateway above is off, and it is
  # what ships them), and no Gateway to program — so the shim would only stop
  # cert-manager from starting.
  certManagerGatewayShim: false
  sealedSecrets: true

system:
  mariadb: true
  clickhouse: true
  redis: true
  redpanda: false
  redpandaConsole: false
  airbyte: false
  argoWorkflows: false
  loki: false
  alloy: false
  grafana: false

secrets:
  infra:
    - {name: mariadb-creds, enabled: true}
    - {name: clickhouse-creds, enabled: true}
    - {name: redis-creds, enabled: true}
  services:
    - {name: insight-db-creds, enabled: true}
    - {name: insight-oidc, enabled: false}
