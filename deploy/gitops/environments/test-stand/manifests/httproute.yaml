# Cluster edge -> the Insight gateway, for the test stand.
#
# WHY THIS FILE EXISTS AT ALL
# The umbrella chart renders no HTTPRoute template. It renders an Ingress,
# which this stand cannot use: the edge is Envoy Gateway, which serves
# Gateway API routes and ignores Ingress objects. So `gateway.ingress.enabled`
# is false in ../values.yaml and the route has to be a hand-written object.
# If a later chart release learns Gateway API, prefer its template and retire
# this file rather than keeping two sources for one route.
#
# WHY IT IS COMMITTED HERE RATHER THAN LEFT ONLY IN THE BRING-UP REPO
# Everything the acceptance gate proves — a person logs in through the public
# URL and sees data — travels through this object. A values file that
# configures a gateway nothing routes to is not a deployable description of
# the stand. Committing it makes the request path reviewable in one place.
#
# WHY THE DEPLOY DOES NOT APPLY IT
# The route already exists on the stand and is Accepted, and it is applied
# today by the L0/L2 bring-up outside this repository. Two writers on one
# object is how a manual fix and an automated deploy start reverting each
# other. So the deploy VERIFIES this route (exists, Accepted, ResolvedRefs)
# and fails the run if it does not — it does not re-apply it. This file is
# the reviewed source for the day the route has to be recreated:
#
#     kubectl apply -f deploy/gitops/environments/test-stand/manifests/httproute.yaml
#     kubectl -n insight wait --for=condition=Accepted httproute/insight-gateway
#
# See ../README.md, "What this env does not own", for the boundary.
#
# ROUTING NOTE
# The Insight gateway is the single edge proxy for the application: it runs
# the cookie-to-JWT exchange against the authenticator and fans out to /api/*
# and the SPA. So this route sends everything ("/") to it and path routing
# happens inside the gateway, not here. The one exception is /kc, claimed by
# httproute-keycloak.yaml on the same shared Gateway — longest PathPrefix
# wins by Gateway API spec, so Keycloak traffic never reaches this backend.
#
# Lives in the `insight` namespace so the backendRef stays namespace-local
# (and so a namespace-scoped CI credential could re-apply it if the team ever
# decides the deploy should own it).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: insight-gateway
  namespace: insight
spec:
  parentRefs:
    - name: insight
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    # Must match `authenticator.oidc.redirectUri`, `authenticator.csrfOrigins`
    # and `keycloak.hostname` in ../values.yaml. A mismatch here does not fail
    # the deploy — it fails login, after the release reports success.
    - insight-test.cfabric.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: insight-gateway
          port: 8080
