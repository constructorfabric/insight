apiVersion: v1
kind: ServiceAccount
metadata:
  name: airbyte-admin
  namespace: airbyte
  labels:
    app.kubernetes.io/name: airbyte
    app.kubernetes.io/instance: airbyte
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: airbyte-admin-role
  namespace: airbyte
  labels:
    app.kubernetes.io/name: airbyte
    app.kubernetes.io/instance: airbyte
rules:
  - apiGroups:
      - ""
      - batch
    resources:
      - configmaps
      - endpoints
      - jobs
      - pods
      - pods/log
      - pods/exec
      - pods/attach
      - secrets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airbyte-admin-binding
  namespace: airbyte
  labels:
    app.kubernetes.io/name: airbyte
    app.kubernetes.io/instance: airbyte
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: airbyte-admin-role
subjects:
  - kind: ServiceAccount
    name: airbyte-admin
    namespace: airbyte
