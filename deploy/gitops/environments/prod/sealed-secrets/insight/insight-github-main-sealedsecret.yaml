---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: insight-github-main
  namespace: insight
spec:
  encryptedData:
    git_proxy_token: 
    git_proxy_url: 
    github_organizations: 
    github_start_date: 
    github_token: 
  template:
    metadata:
      annotations:
        insight.cyberfabric.com/connector: github
        # INVARIANT: unique per connector instance. It is stamped into every
        # bronze row's source_id and unique_key, so reusing another
        # connector's value conflates the two sources downstream.
        insight.cyberfabric.com/source-id: github-main
      labels:
        app.kubernetes.io/part-of: insight
      name: insight-github-main
      namespace: insight
    type: Opaque
