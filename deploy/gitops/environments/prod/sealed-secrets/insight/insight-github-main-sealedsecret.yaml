---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: insight-github-main
  namespace: insight
spec:
  encryptedData:
    git_proxy_token: 
    git_proxy_url: 
    github_organizations: 
    github_start_date: 
    github_token: 
  template:
    metadata:
      annotations:
        insight.cyberfabric.com/connector: github
        insight.cyberfabric.com/source-id: github-directory-main
      labels:
        app.kubernetes.io/part-of: insight
      name: insight-github-main
      namespace: insight
    type: Opaque
