##
## Chart values for the `prod` environment — the InsightCfabric stand
## (public host insight.cfabric.org, GitHub broker login, ADR-0003).
##
## Snapshot of insight-deployment's insight/values.yaml rendered for this
## stand's hostname, merged with its stands/prod/insight-values.yaml sizing
## overlay (16-vCPU workers). The authoritative comments explaining WHY each
## key is set live in those two files; this copy exists so the environment is
## reproducible from the gitops tree alone. Chart pin: inventory.chartVersion.
##
credentials:
  deploymentMode: helm
  autoGenerate: true

keycloak:
  deploy: true
  hostname: https://insight.cfabric.org/kc
  admin:
    existingSecret: insight-keycloak-admin
  database:
    host: mariadb-primary.mariadb.svc.cluster.local
    port: 3306
    name: keycloak
    username: insight
    passwordSecret:
      name: insight-db-creds
      key: mariadb-password
  route:
    enabled: true
    host: insight.cfabric.org
    parentRef:
      name: insight
      namespace: envoy-gateway-system
      sectionName: https
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 2Gi
keycloakConfig:
  enabled: true
  url: http://insight-keycloak:8085/kc
  allowInsecureUrl: true
  existingSecret: insight-keycloak-config

global:
  tenantDefaultId: 3f1d8f4e-6c2a-4a9b-91d7-8e5c0b2a7f36

clickhouse:
  host: chi-clickhouse-clickhouse-0-0.clickhouse.svc.cluster.local
  port: 8123
  database: insight
  username: insight

mariadb:
  host: mariadb-primary.mariadb.svc.cluster.local
  port: 3306
  database: insight
  username: insight

redis:
  host: redis-master.redis.svc.cluster.local
  port: 6379

redpanda:
  brokers: redpanda.redpanda.svc.cluster.local:9093

ingestion:
  templates:
    enabled: true
  reconcile:
    tenantId: 3f1d8f4e-6c2a-4a9b-91d7-8e5c0b2a7f36
    destinationName: clickhouse-bronze
    argoInstanceId: argo-workflows-argo
  airbyteSync:
    idleThresholdSeconds: 3600

airbyte:
  namespace: airbyte
  apiUrl: ''

analytics:
  replicaCount: 1
  resources:
    requests:
      cpu: 300m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 2Gi

frontend:
  replicaCount: 1
  route:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

gateway:
  replicaCount: 1
  route:
    enabled: true
    host: insight.cfabric.org
    parentRef:
      name: insight
      namespace: envoy-gateway-system
      sectionName: https
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 512Mi

authenticator:
  replicaCount: 1
  # View-as (`/auth/login?__override=<email>`, #1941) is dev/demo-only per the
  # chart: it mints a session for the named person with no role check, no
  # allowlist, and no audit. This stand has real GitHub logins and a real
  # roster, so it stays OFF. If demo impersonation is ever needed, build it
  # with explicit authorization and audit logging instead of flipping this.
  overrideEnabled: false
  csrfOrigins:
    - https://insight.cfabric.org
  tlsDiscovery:
    enabled: true
    issuerRef:
      name: insight-ca
      kind: ClusterIssuer
  oidc:
    issuerUrl: https://insight.cfabric.org/kc/realms/insight-broker
    clientId: insight-authenticator
    clientSecret: ''
    redirectUri: https://insight.cfabric.org/auth/callback
    scopes:
      - openid
    sourceType: github
    externalIdClaim: idp_sub
    defaultTenantId: 3f1d8f4e-6c2a-4a9b-91d7-8e5c0b2a7f36
    provisionOnLogin: true
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 512Mi

# Clone-based commit extraction for the github connector. Airbyte-only
# consumer — no gateway route.
# INVARIANT: the connector's own Secret must carry git_proxy_url and
# git_proxy_token itself. Reconcile injects them only for a descriptor setting
# platform_config.git_proxy, and no descriptor sets it, so the CronJob's
# GIT_PROXY_URL/GIT_PROXY_TOKEN go unread. The sealed token must stay equal to
# the one in insight-git-cli-proxy-config or every sync 401s.
gitCliProxy:
  deploy: true
  persistence:
    # INVARIANT: this pair must move together. The kubelet applies the pod's
    # fsGroup only for a ReadWriteOnce volume carrying an fsType (the driver's
    # fsGroupPolicy is ReadWriteOnceWithFSType), and the service runs non-root
    # on a read-only rootfs, so a volume it cannot write is a boot failure.
    # ReadWriteOncePod would not satisfy the policy; replicaCount is pinned to
    # 1 by the chart, which is what keeps the single-writer guarantee.
    storageClass: cinder-ext4
    accessMode: ReadWriteOnce
  networkPolicy:
    # Stated rather than inherited: the chart default flipped to false in
    # 0.5.171, and the clone cache holds private source, so leaving the policy
    # to a default would silently expose it cluster-wide on an upgrade.
    enabled: true
    allowedNamespaceLabels:
      - key: kubernetes.io/metadata.name
        values: [airbyte]

identityResolution:
  deploy: true
  databaseName: identity
  seed:
    enabled: true
    schedule: 30 6 * * *
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  sync:
    enabled: true
    schedule: 45 6 * * *
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  resources:
    requests:
      cpu: 300m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 2Gi
