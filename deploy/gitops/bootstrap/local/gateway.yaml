##
## Shared Gateway API entry point, applied by `make bootstrap-envoy-gateway`.
## HTTPRoutes from any namespace attach to the `insight` Gateway. Local dev
## is HTTP-only; envs with a cert add an https listener here.
##
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: insight
  namespace: insight-infra
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
