# One route object per experiment. The controller merges same-host Ingresses,
# so applying this chart ADDS the `/exp/<name>` path and `helm uninstall` REMOVES
# it -- no central config is ever rewritten. Controller-agnostic by design:
# nginx Ingress today, Gateway API HTTPRoute after the Envoy move.
#
# The FE image is built with a relative asset base and a runtime router
# basepath, so we prefix-strip: `use-regex` makes the path a regex, the capture
# group `(.*)` after `/exp/<name>(/|$)` is `$2`, and rewrite-target rewrites the
# request to `/$2` before it reaches the FE pod. `/api/...` is an ABSOLUTE path
# the FE emits unprefixed, so it is not matched here and flows to the shared
# backend route.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "insight-preview.fullname" . }}
  labels:
    {{- include "insight-preview.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host | quote }}
      {{- else }}
      {{- fail "ingress.host is required: one host serves every /exp/<name> experiment" }}
      {{- end }}
      http:
        paths:
          - path: {{ include "insight-preview.path" . }}(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "insight-preview.fullname" . }}
                port:
                  name: http
