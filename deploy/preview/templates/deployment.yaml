apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "insight-preview.fullname" . }}
  labels:
    {{- include "insight-preview.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "insight-preview.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "insight-preview.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Suppress the legacy `<SVC>_SERVICE_HOST/PORT` link env-vars kubelet
      # injects for every Service in the namespace (same as the FE chart).
      enableServiceLinks: false
      containers:
        - name: frontend
          image: "{{ required "image.repository is required" .Values.image.repository }}:{{ required "image.tag is required (pin a build per experiment)" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # No auth env: login is the gateway+authenticator's job (auth_request
          # -> authenticator, gateway-JWT injected). Preview's authenticated
          # return path arrives with #1972; the FE only serves static assets here.
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
