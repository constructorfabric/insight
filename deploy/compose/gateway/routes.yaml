# Gateway route table for the docker-compose dev stack. Same schema as the
# chart's gateway.routes values, but with compose service names (docker DNS
# resolves them) instead of Helm-templated k8s names -- compose has no Helm to
# render {{ .Release.Name }}. The gateway container compiles this into nginx.conf
# at startup.
version: 1
defaults:
  strip_request_headers:
    - X-Real-IP
    - Forwarded
routes:
  - prefix: /api/sql/query
    upstream: http://analytics:8086
    auth: instance_token
    timeout_ms: 40000
  - prefix: /mcp
    upstream: http://analytics:8086
    auth: bearer
    timeout_ms: 40000
  # strip_prefix turns `/api/analytics/v1/metrics` into the service's own
  # `/v1/metrics` (analytics + identity are addressed directly, serving `/v1/*`).
  - prefix: /api/analytics
    upstream: http://analytics:8081
    strip_prefix: true
    timeout_ms: 135000
  - prefix: /api/identity
    upstream: http://identity-resolution:8082
    strip_prefix: true
  # No `auth` key -> defaults to session. /v1/raw-data is NOT routed here:
  # ingest uses its own token and is reached on the published host port.
  - prefix: /api/v3
    upstream: http://insight-v3-core:8086
    strip_prefix: true
    timeout_ms: 40000
  # The custom-surface MCP server, on its own listener with its own scope. Not
  # strip_prefix: the streamable-http endpoint answers on this exact path.
  - prefix: /mcp/v3
    upstream: http://insight-v3-core:8087
    auth: bearer
    mcp_scope: "mcp:author"
    timeout_ms: 40000
